server {
    listen 443 ssl http2;
    server_name example.terrafusion.local;

    ssl_certificate /etc/letsencrypt/live/example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:TFSSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/terrafusion.access.log;
    error_log /var/log/nginx/terrafusion.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Websocket path (if used by web_shell)
    location /ws/ {
        proxy_pass http://127.0.0.1:8090/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # maintenance toggle
    location /maintenance {
        return 503;
    }
}
server {
  listen 80;
  server_name terrafusion.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name terrafusion.example.com;

  # TLS (Certbot-managed paths)
  ssl_certificate     /etc/letsencrypt/live/terrafusion.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/terrafusion.example.com/privkey.pem;

  # TLS 1.3 only (tighten if all clients support it)
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers on;

  # OCSP stapling
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 1.1.1.1 1.0.0.1 valid=300s;
  resolver_timeout 5s;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Proxy sane timeouts and buffering for APIs/WS
  proxy_read_timeout  300s;
  proxy_send_timeout  300s;
  proxy_connect_timeout 60s;
  proxy_buffering off;
  proxy_request_buffering off;

  # API proxy
  location /api/ {
    proxy_pass http://127.0.0.1:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # Websocket upgrades (adjust path if needed)
  location /ws/ {
    proxy_pass http://127.0.0.1:8090/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Shell/static app
  location / {
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }
}
