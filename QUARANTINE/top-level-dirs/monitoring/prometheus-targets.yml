global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # TerraFusion API Metrics
  - job_name: 'terrafusion-api'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: /metrics
    scrape_interval: 5s
    scrape_timeout: 5s
    
  # AI Swarm Metrics  
  - job_name: 'ai-swarm'
    static_configs:
      - targets: ['localhost:5001']
    metrics_path: /api/ai/metrics
    scrape_interval: 10s
    
  # Database Metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 15s
    
  # Redis Metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s
    
  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
    
  # HAProxy Metrics
  - job_name: 'haproxy'
    static_configs:
      - targets: ['localhost:8404']
    metrics_path: /stats?stats;csv
    scrape_interval: 30s
    
  # Government Compliance Metrics
  - job_name: 'compliance-monitor'
    static_configs:
      - targets: ['localhost:5002']
    metrics_path: /compliance/metrics
    scrape_interval: 60s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093