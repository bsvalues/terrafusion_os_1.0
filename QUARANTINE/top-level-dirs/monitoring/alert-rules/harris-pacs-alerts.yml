# ═══════════════════════════════════════════════════════════════════════
# Harris PACS Integration Alert Rules
# Championship-Level Monitoring for Legacy System Sync
# Target: 99.9% Success Rate, <5% Discrepancy Threshold
# ═══════════════════════════════════════════════════════════════════════

groups:
  - name: harris_pacs_alerts
    interval: 30s
    rules:
      # ───────────────────────────────────────────────────────────────
      # CRITICAL ALERTS - Immediate Action Required
      # ───────────────────────────────────────────────────────────────

      - alert: HarrisPACSConsecutiveSyncFailures
        expr: |
          sum(increase(terrafusion_harris_pacs_sync_failure_total[15m])) by (county, jurisdiction) >= 3
        for: 5m
        labels:
          severity: critical
          component: harris-pacs
          compliance: fisma-high
        annotations:
          summary: 'Harris PACS sync experiencing consecutive failures'
          description: 'County {{ $labels.county }} jurisdiction {{ $labels.jurisdiction }} has {{ $value }} sync failures in 15 minutes. IMMEDIATE ACTION REQUIRED.'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-sync-failure'

      - alert: HarrisPACSSyncDown
        expr: |
          absent(terrafusion_harris_pacs_sync_success_total) == 1
        for: 10m
        labels:
          severity: critical
          component: harris-pacs
        annotations:
          summary: 'Harris PACS sync service is DOWN'
          description: 'No successful sync metrics detected for 10 minutes. Service may be down.'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-service-down'

      - alert: DataDiscrepancyRateCritical
        expr: |
          terrafusion_data_discrepancy_rate_percent > 10.0
        for: 5m
        labels:
          severity: critical
          component: data-validation
          compliance: data-integrity
        annotations:
          summary: 'Data discrepancy rate CRITICAL for county {{ $labels.county }}'
          description: 'Discrepancy rate is {{ $value }}% (threshold: 5%). Data integrity compromised.'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/data-discrepancy-critical'

      # ───────────────────────────────────────────────────────────────
      # HIGH SEVERITY ALERTS - Attention Within 1 Hour
      # ───────────────────────────────────────────────────────────────

      - alert: HarrisPACSSyncSlowPerformance
        expr: |
          histogram_quantile(0.95, sum(rate(terrafusion_harris_pacs_sync_duration_seconds_bucket[5m])) by (county, jurisdiction, le)) > 300
        for: 15m
        labels:
          severity: high
          component: harris-pacs
          performance: degraded
        annotations:
          summary: 'Harris PACS sync performance degraded'
          description: 'P95 sync duration for {{ $labels.county }}/{{ $labels.jurisdiction }} is {{ $value }}s (target: <300s)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-slow-sync'

      - alert: DataDiscrepancyRateHigh
        expr: |
          terrafusion_data_discrepancy_rate_percent > 5.0 and terrafusion_data_discrepancy_rate_percent <= 10.0
        for: 10m
        labels:
          severity: high
          component: data-validation
        annotations:
          summary: 'Data discrepancy rate HIGH for county {{ $labels.county }}'
          description: 'Discrepancy rate is {{ $value }}% (threshold: 5%). Monitor closely.'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/data-discrepancy-high'

      - alert: AutoCorrectionSuccessRateLow
        expr: |
          (sum(rate(terrafusion_auto_correction_success_total[30m])) by (county) 
          / 
          (sum(rate(terrafusion_auto_correction_success_total[30m])) by (county) + sum(rate(terrafusion_auto_correction_failure_total[30m])) by (county))) < 0.95
        for: 15m
        labels:
          severity: high
          component: data-validation
        annotations:
          summary: 'Auto-correction success rate low for county {{ $labels.county }}'
          description: 'Auto-correction success rate is {{ $value | humanizePercentage }} (target: >=95%)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/auto-correction-low'

      # ───────────────────────────────────────────────────────────────
      # WARNING ALERTS - Monitor and Investigate
      # ───────────────────────────────────────────────────────────────

      - alert: HarrisPACSPropertiesSyncedAnomaly
        expr: |
          abs(terrafusion_harris_pacs_properties_synced - 
              (avg_over_time(terrafusion_harris_pacs_properties_synced[24h]))) 
              > (stddev_over_time(terrafusion_harris_pacs_properties_synced[24h]) * 3)
        for: 20m
        labels:
          severity: warning
          component: harris-pacs
          anomaly: sync-volume
        annotations:
          summary: 'Harris PACS sync volume anomaly detected'
          description: 'County {{ $labels.county }} sync volume is {{ $value }} (3 std dev from 24h average)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-anomaly'

      - alert: ValidationDurationIncreasing
        expr: |
          histogram_quantile(0.95, sum(rate(terrafusion_validation_duration_seconds_bucket[30m])) by (county, validation_type, le)) > 60
        for: 30m
        labels:
          severity: warning
          component: data-validation
          performance: degraded
        annotations:
          summary: 'Data validation duration increasing'
          description: 'P95 validation duration for {{ $labels.county }} is {{ $value }}s (target: <60s)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/validation-slow'

      # ───────────────────────────────────────────────────────────────
      # CHAMPIONSHIP-LEVEL SLA MONITORING
      # ───────────────────────────────────────────────────────────────

      - alert: HarrisPACSSyncSuccessRateBelow999
        expr: |
          (sum(rate(terrafusion_harris_pacs_sync_success_total[1h])) by (county)
          /
          (sum(rate(terrafusion_harris_pacs_sync_success_total[1h])) by (county) + sum(rate(terrafusion_harris_pacs_sync_failure_total[1h])) by (county))) < 0.999
        for: 1h
        labels:
          severity: warning
          component: harris-pacs
          sla: championship
        annotations:
          summary: 'Harris PACS sync success rate below 99.9% for {{ $labels.county }}'
          description: 'Success rate is {{ $value | humanizePercentage }} (championship target: >=99.9%)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-sla-breach'

      - alert: DataValidationSLABreach
        expr: |
          histogram_quantile(0.95, sum(rate(terrafusion_validation_duration_seconds_bucket[1h])) by (county, le)) > 30
        for: 1h
        labels:
          severity: warning
          component: data-validation
          sla: championship
        annotations:
          summary: 'Data validation P95 latency SLA breach for {{ $labels.county }}'
          description: 'P95 validation latency is {{ $value }}s (championship target: <30s)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/validation-sla-breach'

  # ═══════════════════════════════════════════════════════════════════
  # MULTI-COUNTY AGGREGATION ALERTS
  # ═══════════════════════════════════════════════════════════════════

  - name: harris_pacs_regional_alerts
    interval: 60s
    rules:
      - alert: MultiCountyHarrisPACSFailures
        expr: |
          count(sum(increase(terrafusion_harris_pacs_sync_failure_total[30m])) by (county) > 1) > 3
        for: 15m
        labels:
          severity: critical
          component: harris-pacs
          scope: regional
        annotations:
          summary: 'Multiple counties experiencing Harris PACS sync failures'
          description: '{{ $value }} counties have sync failures - potential regional issue'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/harris-pacs-regional-outage'

      - alert: SystemWideDiscrepancyRateHigh
        expr: |
          avg(terrafusion_data_discrepancy_rate_percent) > 3.0
        for: 30m
        labels:
          severity: high
          component: data-validation
          scope: system-wide
        annotations:
          summary: 'System-wide data discrepancy rate elevated'
          description: 'Average discrepancy rate across all counties is {{ $value }}% (target: <2%)'
          runbook_url: 'https://docs.terrafusionmarket.com/runbooks/system-wide-discrepancy'
