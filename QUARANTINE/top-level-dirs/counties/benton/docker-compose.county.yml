# ══════════════════════════════════════════════════════════════════
# TerraFusion Elite Government OS — Benton County Development Stack
# ══════════════════════════════════════════════════════════════════

x-env: &default-env
  env_file:
    - ./.env

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  benton-net:
    name: benton-county-network
    driver: bridge

volumes:
  postgres_data:
    name: benton-postgres-data
  redis_data:
    name: benton-redis-data

services:
  # ── PostgreSQL 15 (Primary Database) ────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: benton-postgres
    <<: *default-env
    environment:
      POSTGRES_DB: ${DB_NAME:-benton_county}
      POSTGRES_USER: ${DB_USER:-terrafusion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DevPasswordChangeInProd}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=en_US.utf8'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - benton-net
    logging: *default-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-terrafusion} -d ${DB_NAME:-benton_county}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # ── Redis 7 (Cache & Session Store) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: benton-redis
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - benton-net
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # ── TerraFusion API (Backend) ───────────────────────────────────
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: development
    container_name: benton-api
    <<: *default-env
    environment:
      # Override with container network names
      DB_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${DB_USER:-terrafusion}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-benton_county}
      REDIS_URL: redis://redis:6379

      # County-specific
      COUNTY_NAME: ${COUNTY_NAME:-benton}
      COUNTY_CODE: ${COUNTY_CODE:-WA-005}

      # API config
      PORT: ${API_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Features
      TF_ELITE_MODE: ${TF_ELITE_MODE:-true}
      QUANTUM_FACTOR: ${QUANTUM_FACTOR:-949}
      AI_AGENT_COUNT: ${AI_AGENT_COUNT:-1008}
    ports:
      - '${API_PORT:-5000}:5000'
    volumes:
      - ../../backend:/app:delegated
    networks:
      - benton-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── TerraFusion Frontend (UI) ───────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    container_name: benton-frontend
    <<: *default-env
    environment:
      VITE_API_URL: http://api:5000
      VITE_COUNTY_NAME: ${COUNTY_DISPLAY_NAME:-Benton County, Washington}
      VITE_COUNTY_CODE: ${COUNTY_CODE:-WA-005}
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      - ../../frontend:/app:delegated
      - /app/node_modules
    networks:
      - benton-net
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ── Optional: Prometheus (Metrics) ──────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: benton-prometheus
    profiles: ['monitoring']
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - benton-net
    restart: unless-stopped

  # ── Optional: Jaeger (Tracing) ──────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: benton-jaeger
    profiles: ['monitoring']
    ports:
      - '16686:16686' # UI
      - '14268:14268' # Collector
    networks:
      - benton-net
    restart: unless-stopped
