<svg width="220" height="80" viewBox="0 0 220 80" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="tfAIGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#00d2ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="tfAITextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:1" />
        </linearGradient>
        <filter id="aiGlow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge> 
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- AI Enhanced TF Icon -->
    <g transform="translate(5,15)">
        <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#tfAIGradient)" filter="url(#aiGlow)"/>
        <path d="M8 15 L42 15 L42 20 L28 20 L28 40 L22 40 L22 20 L8 20 Z" fill="white" opacity="0.9"/>
        <path d="M15 25 L35 25 L35 30 L28 30 L28 40 L22 40 L22 30 L15 30 Z" fill="white" opacity="0.7"/>
        <!-- AI Neural Network Pattern -->
        <circle cx="12" cy="35" r="2" fill="#00d2ff" opacity="0.6"/>
        <circle cx="38" cy="35" r="2" fill="#00d2ff" opacity="0.6"/>
        <circle cx="25" cy="45" r="2" fill="#00d2ff" opacity="0.6"/>
        <line x1="12" y1="35" x2="38" y2="35" stroke="#00d2ff" stroke-width="0.5" opacity="0.4"/>
        <line x1="12" y1="35" x2="25" y2="45" stroke="#00d2ff" stroke-width="0.5" opacity="0.4"/>
        <line x1="38" y1="35" x2="25" y2="45" stroke="#00d2ff" stroke-width="0.5" opacity="0.4"/>
    </g>
    
    <!-- TerraFusion Text -->
    <text x="65" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="url(#tfAITextGradient)">TerraFusion</text>
    <text x="65" y="48" font-family="Arial, sans-serif" font-size="12" fill="#00d2ff" opacity="0.9">AI for Land Understanding</text>
    <text x="65" y="62" font-family="Arial, sans-serif" font-size="9" fill="#0891b2" opacity="0.7">Intelligence That Counties Envy</text>
</svg>