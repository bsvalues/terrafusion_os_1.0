[package]
name = "terraforge-kernel-cost"
version = "1.0.0"
edition = "2021"
description = "TerraForge Cost Kernel - Calculates replacement cost, depreciation, and RCNLD"
license = "Apache-2.0"
authors = ["TerraFusion OS Team"]

[[bin]]
name = "terraforge-kernel-cost"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
