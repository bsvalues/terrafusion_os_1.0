services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: pacs-benton-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-TF_Pacs2026!}
      - MSSQL_PID=Developer
    ports:
      - '1433:1433'
    healthcheck:
      test:
        [
          'CMD',
          '/opt/mssql-tools18/bin/sqlcmd',
          '-S',
          'localhost,1433',
          '-U',
          'sa',
          '-P',
          '${SA_PASSWORD:-TF_Pacs2026!}',
          '-C',
          '-Q',
          'SELECT 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ../mssql/data:/var/opt/mssql
      - ../mssql/init:/docker-entrypoint-initdb.d
