---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: terrafusion
spec:
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: terrafusion-backend-authz
  namespace: terrafusion
spec:
  selector:
    matchLabels:
      app: terrafusion-backend
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-frontend"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-costforge"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-propertyworkbench"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-terrainsight"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths: ["/api/*"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: terrafusion-database-authz
  namespace: terrafusion
spec:
  selector:
    matchLabels:
      app: terrafusion-postgres
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-backend"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-propertyworkbench"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-terrainsight"]
    to:
    - operation:
        ports: ["5432"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: terrafusion-redis-authz
  namespace: terrafusion
spec:
  selector:
    matchLabels:
      app: terrafusion-redis
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-backend"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-costforge"]
    - source:
        principals: ["cluster.local/ns/terrafusion/sa/terrafusion-propertyworkbench"]
    to:
    - operation:
        ports: ["6379"]

---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: terrafusion-jwt
  namespace: terrafusion
spec:
  selector:
    matchLabels:
      app: terrafusion-backend
  jwtRules:
  - issuer: "https://terrafusion.local"
    jwksUri: "https://terrafusion.local/.well-known/jwks.json"
    audiences:
    - "terrafusion-api"
    forwardOriginalToken: true

---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-apis
  namespace: terrafusion
spec:
  hosts:
  - api.github.com
  - api.openweathermap.org
  - nominatim.openstreetmap.org
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS