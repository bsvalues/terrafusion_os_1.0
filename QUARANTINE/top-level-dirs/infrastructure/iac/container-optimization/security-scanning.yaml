---
apiVersion: batch/v1
kind: Job
metadata:
  name: initial-security-scan
  namespace: security
spec:
  template:
    spec:
      serviceAccountName: trivy-scanner
      containers:
      - name: trivy-initial-scan
        image: aquasec/trivy:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Running initial security baseline scan..."
          
          # Update vulnerability database
          trivy image --download-db-only
          
          # Create baseline security policies
          cat > /tmp/security-policy.json << 'EOF'
          {
            "policies": {
              "critical_vulnerabilities": 0,
              "high_vulnerabilities": 5,
              "medium_vulnerabilities": 20,
              "base_image_requirements": [
                "alpine:3.19",
                "node:20-alpine",
                "rust:1.75-alpine",
                "nginx:1.25-alpine"
              ],
              "forbidden_packages": [
                "telnet",
                "ftp",
                "rsh",
                "suid-tools"
              ]
            }
          }
          EOF
          
          # Store policy in ConfigMap
          kubectl create configmap security-policies \
            --from-file=/tmp/security-policy.json \
            --namespace=security \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Initial security scan completed"
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 200m
      restartPolicy: OnFailure
  backoffLimit: 3