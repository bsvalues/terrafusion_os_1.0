---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trivy-config
  namespace: security
data:
  trivy.yaml: |
    # Trivy security scanner configuration
    format: json
    output: /tmp/trivy-report.json
    exit-code: 1
    severity: CRITICAL,HIGH,MEDIUM
    skip-files:
      - "*.md"
      - "*.txt"
      - "*.log"
    skip-dirs:
      - "/tmp"
      - "/var/tmp"
      - "/var/log"
    ignorefile: .trivyignore

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: container-security-scan
  namespace: security
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: trivy-scanner
          containers:
          - name: trivy-scanner
            image: aquasec/trivy:latest
            command:
            - /bin/sh
            - -c
            - |
              # Scan all TerraFusion images
              IMAGES=(
                "terrafusion/backend:latest"
                "terrafusion/costforge:latest"
                "terrafusion/propertyworkbench:latest"
                "terrafusion/terrainsight:latest"
                "terrafusion/frontend:latest"
              )
              
              mkdir -p /tmp/scan-results
              
              for image in "${IMAGES[@]}"; do
                echo "Scanning $image..."
                trivy image \
                  --format json \
                  --output "/tmp/scan-results/$(echo $image | tr '/:' '-').json" \
                  --severity CRITICAL,HIGH,MEDIUM \
                  --exit-code 0 \
                  "$image"
              done
              
              # Generate summary report
              python3 /scripts/generate-security-report.py /tmp/scan-results /tmp/security-summary.json
              
              # Upload results to Elasticsearch
              curl -X POST "http://elasticsearch:9200/security-scans/_doc" \
                -H "Content-Type: application/json" \
                -d @/tmp/security-summary.json
              
              # Send alerts if critical vulnerabilities found
              if grep -q '"Severity": "CRITICAL"' /tmp/scan-results/*.json; then
                /scripts/send-security-alert.sh
              fi
            volumeMounts:
            - name: scan-scripts
              mountPath: /scripts
            - name: scan-results
              mountPath: /tmp/scan-results
            resources:
              requests:
                memory: 512Mi
                cpu: 250m
              limits:
                memory: 1Gi
                cpu: 500m
          volumes:
          - name: scan-scripts
            configMap:
              name: security-scan-scripts
              defaultMode: 0755
          - name: scan-results
            emptyDir: {}
          restartPolicy: OnFailure

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-scan-scripts
  namespace: security
data:
  generate-security-report.py: |
    #!/usr/bin/env python3
    import json
    import os
    import sys
    from datetime import datetime
    
    def main():
        if len(sys.argv) != 3:
            print("Usage: generate-security-report.py <scan_dir> <output_file>")
            sys.exit(1)
        
        scan_dir = sys.argv[1]
        output_file = sys.argv[2]
        
        summary = {
            "timestamp": datetime.utcnow().isoformat(),
            "scan_summary": {
                "total_images": 0,
                "vulnerabilities": {
                    "CRITICAL": 0,
                    "HIGH": 0,
                    "MEDIUM": 0,
                    "LOW": 0
                },
                "images": []
            }
        }
        
        for filename in os.listdir(scan_dir):
            if filename.endswith('.json'):
                with open(os.path.join(scan_dir, filename), 'r') as f:
                    scan_result = json.load(f)
                    
                summary["scan_summary"]["total_images"] += 1
                
                image_summary = {
                    "image": filename.replace('.json', '').replace('-', '/'),
                    "vulnerabilities": {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
                }
                
                if "Results" in scan_result:
                    for result in scan_result["Results"]:
                        if "Vulnerabilities" in result:
                            for vuln in result["Vulnerabilities"]:
                                severity = vuln.get("Severity", "UNKNOWN")
                                if severity in image_summary["vulnerabilities"]:
                                    image_summary["vulnerabilities"][severity] += 1
                                    summary["scan_summary"]["vulnerabilities"][severity] += 1
                
                summary["scan_summary"]["images"].append(image_summary)
        
        with open(output_file, 'w') as f:
            json.dump(summary, f, indent=2)
        
        print(f"Security report generated: {output_file}")
    
    if __name__ == "__main__":
        main()
  
  send-security-alert.sh: |
    #!/bin/bash
    
    WEBHOOK_URL="${SLACK_WEBHOOK_URL}"
    CRITICAL_COUNT=$(grep -o '"Severity": "CRITICAL"' /tmp/scan-results/*.json | wc -l)
    HIGH_COUNT=$(grep -o '"Severity": "HIGH"' /tmp/scan-results/*.json | wc -l)
    
    if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 10 ]; then
        ALERT_MESSAGE="🚨 SECURITY ALERT: Container scan found $CRITICAL_COUNT CRITICAL and $HIGH_COUNT HIGH vulnerabilities in TerraFusion images. Please review immediately."
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$ALERT_MESSAGE\"}" \
          "$WEBHOOK_URL"
        
        echo "Security alert sent to Slack"
    else
        echo "No critical security issues found"
    fi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trivy-scanner
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trivy-scanner
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trivy-scanner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trivy-scanner
subjects:
- kind: ServiceAccount
  name: trivy-scanner
  namespace: security

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trivy-scanner-policy
  namespace: security
spec:
  podSelector:
    matchLabels:
      job-name: container-security-scan
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9200  # Elasticsearch
  - to: []  # Allow external image registry access
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  ingress: []  # No ingress needed

