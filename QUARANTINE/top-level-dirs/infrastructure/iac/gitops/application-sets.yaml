---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: terrafusion-apps
  namespace: argocd
spec:
  generators:
  - clusters: {}
  - list:
      elements:
      - app: costforge
        port: "3001"
        replicas: "3"
        environment: production
      - app: propertyworkbench
        port: "3002"
        replicas: "3"
        environment: production
      - app: terrainsight
        port: "3003"
        replicas: "2"
        environment: production
      - app: backend
        port: "8080"
        replicas: "5"
        environment: production
  template:
    metadata:
      name: '{{app}}-{{environment}}'
      namespace: argocd
      labels:
        app: '{{app}}'
        environment: '{{environment}}'
    spec:
      project: terrafusion
      source:
        repoURL: https://github.com/terrafusion/infrastructure
        targetRevision: HEAD
        path: 'apps/{{app}}/{{environment}}'
        helm:
          valueFiles:
          - values-{{environment}}.yaml
      destination:
        server: '{{server}}'
        namespace: terrafusion
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
        - CreateNamespace=true
        - PrunePropagationPolicy=foreground
        - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      revisionHistoryLimit: 10

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: terrafusion-infrastructure
  namespace: argocd
spec:
  generators:
  - clusters: {}
  - list:
      elements:
      - component: monitoring
        namespace: monitoring
      - component: security
        namespace: security
      - component: networking
        namespace: istio-system
      - component: storage
        namespace: storage
  template:
    metadata:
      name: 'infrastructure-{{component}}'
      namespace: argocd
      labels:
        component: '{{component}}'
        type: infrastructure
    spec:
      project: terrafusion-infrastructure
      source:
        repoURL: https://github.com/terrafusion/infrastructure
        targetRevision: HEAD
        path: 'infrastructure/{{component}}'
      destination:
        server: '{{server}}'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: terrafusion
  namespace: argocd
spec:
  description: TerraFusion Applications
  sourceRepos:
  - 'https://github.com/terrafusion/*'
  destinations:
  - namespace: terrafusion
    server: https://kubernetes.default.svc
  - namespace: terrafusion-*
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Secret
  - group: ''
    kind: ConfigMap
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: extensions
    kind: Ingress
  - group: networking.k8s.io
    kind: Ingress
  - group: networking.k8s.io
    kind: NetworkPolicy
  roles:
  - name: developer
    description: Developer access to TerraFusion apps
    policies:
    - p, proj:terrafusion:developer, applications, get, terrafusion/*, allow
    - p, proj:terrafusion:developer, applications, sync, terrafusion/*, allow
    groups:
    - terrafusion:developer
  - name: admin
    description: Admin access to TerraFusion apps
    policies:
    - p, proj:terrafusion:admin, applications, *, terrafusion/*, allow
    groups:
    - terrafusion:admin

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: terrafusion-infrastructure
  namespace: argocd
spec:
  description: TerraFusion Infrastructure Components
  sourceRepos:
  - 'https://github.com/terrafusion/infrastructure'
  destinations:
  - namespace: '*'
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  roles:
  - name: infrastructure-admin
    description: Infrastructure admin access
    policies:
    - p, proj:terrafusion-infrastructure:infrastructure-admin, applications, *, */*, allow
    groups:
    - terrafusion:infrastructure-admin