apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "terrafusion-backend.fullname" . }}-test-connection"
  labels:
    {{- include "terrafusion-backend.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args:  ['{{ include "terrafusion-backend.fullname" . }}:{{ .Values.service.port }}']
