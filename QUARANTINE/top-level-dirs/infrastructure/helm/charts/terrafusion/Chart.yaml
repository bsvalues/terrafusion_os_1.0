apiVersion: v2
name: terrafusion
description: A Helm umbrella chart for TerraFusion OS
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - terrafusion
  - government
  - ai
  - platform
  - microservices
home: https://github.com/terrafusion-os
sources:
  - https://github.com/terrafusion-os/terrafusion
maintainers:
  - name: TerraFusion Team
    email: team@terrafusion-os.com
dependencies:
  - name: terrafusion-backend
    version: "1.0.0"
    repository: "file://./charts/terrafusion-backend"
    condition: backend.enabled
  - name: terrafusion-frontend
    version: "1.0.0"
    repository: "file://./charts/terrafusion-frontend"
    condition: frontend.enabled
  - name: terrafusion-ai-swarm
    version: "1.0.0"
    repository: "file://./charts/terrafusion-ai-swarm"
    condition: aiSwarm.enabled
  - name: postgresql
    version: "12.8.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: nginx-ingress
    version: "4.7.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: ingress.enabled
