apiVersion: v2
name: terrafusion-ai-swarm
description: A Helm chart for TerraFusion AI Swarm Service
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - terrafusion
  - ai-swarm
  - python
  - ml
  - government
  - ai
home: https://github.com/terrafusion-os
sources:
  - https://github.com/terrafusion-os/ai-swarm
maintainers:
  - name: TerraFusion Team
    email: team@terrafusion-os.com
dependencies:
  - name: redis
    version: "17.11.3"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: postgresql
    version: "12.8.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
