# AWS Secrets Manager Integration for TerraFusion OS
# Government-grade secret management with FISMA compliance

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: terrafusion-production
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: terrafusion-os
    app.kubernetes.io/component: security
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: terrafusion-production

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: terrafusion-application-secrets
  namespace: terrafusion-production
  labels:
    app.kubernetes.io/name: terrafusion-secrets
    app.kubernetes.io/part-of: terrafusion-os
    app.kubernetes.io/component: security
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  
  target:
    name: terrafusion-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Database credentials
        database-password: "{{ .database_password }}"
        database-connection: "Server={{ .database_host }};Port=5432;Database={{ .database_name }};User Id={{ .database_username }};Password={{ .database_password }};SSL Mode=Require;"
        
        # Application secrets
        jwt-secret: "{{ .jwt_secret }}"
        encryption-key: "{{ .encryption_key }}"
        
        # API keys for external services
        harris-pacs-api-key: "{{ .harris_pacs_api_key }}"
        tyler-api-key: "{{ .tyler_api_key }}"
        aumentum-api-key: "{{ .aumentum_api_key }}"
        
        # AI model configuration
        openai-api-key: "{{ .openai_api_key }}"
        anthropic-api-key: "{{ .anthropic_api_key }}"
        
        # Monitoring and observability
        prometheus-auth-token: "{{ .prometheus_auth_token }}"
        grafana-admin-password: "{{ .grafana_admin_password }}"
        
        # Government compliance keys
        fisma-encryption-key: "{{ .fisma_encryption_key }}"
        audit-signing-key: "{{ .audit_signing_key }}"

  data:
    - secretKey: database_password
      remoteRef:
        key: terrafusion/production/application
        property: database_password
    
    - secretKey: database_host
      remoteRef:
        key: terrafusion/production/application
        property: database_host
    
    - secretKey: database_name
      remoteRef:
        key: terrafusion/production/application
        property: database_name
    
    - secretKey: database_username
      remoteRef:
        key: terrafusion/production/application
        property: database_username
    
    - secretKey: jwt_secret
      remoteRef:
        key: terrafusion/production/application
        property: jwt_secret
    
    - secretKey: encryption_key
      remoteRef:
        key: terrafusion/production/application
        property: encryption_key
    
    - secretKey: harris_pacs_api_key
      remoteRef:
        key: terrafusion/production/integrations
        property: harris_pacs_api_key
    
    - secretKey: tyler_api_key
      remoteRef:
        key: terrafusion/production/integrations
        property: tyler_api_key
    
    - secretKey: aumentum_api_key
      remoteRef:
        key: terrafusion/production/integrations
        property: aumentum_api_key
    
    - secretKey: openai_api_key
      remoteRef:
        key: terrafusion/production/ai-models
        property: openai_api_key
    
    - secretKey: anthropic_api_key
      remoteRef:
        key: terrafusion/production/ai-models
        property: anthropic_api_key
    
    - secretKey: prometheus_auth_token
      remoteRef:
        key: terrafusion/production/monitoring
        property: prometheus_auth_token
    
    - secretKey: grafana_admin_password
      remoteRef:
        key: terrafusion/production/monitoring
        property: grafana_admin_password
    
    - secretKey: fisma_encryption_key
      remoteRef:
        key: terrafusion/production/compliance
        property: fisma_encryption_key
    
    - secretKey: audit_signing_key
      remoteRef:
        key: terrafusion/production/compliance
        property: audit_signing_key

---
# Service Account for External Secrets with IRSA
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: terrafusion-production
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/terrafusion-external-secrets-role
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: terrafusion-os

---
# ClusterRole for External Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-terrafusion
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: terrafusion-os
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-terrafusion
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: terrafusion-os
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-terrafusion
subjects:
  - kind: ServiceAccount
    name: external-secrets-sa
    namespace: terrafusion-production