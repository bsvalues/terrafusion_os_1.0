# TerraFusion Alertmanager Configuration
# Phase 6: The Dynasty Continues - Alert Routing Excellence
# "Communication is everything" - Tom Brady

global:
  # SMTP configuration for email alerts
  smtp_smarthost: 'localhost:587'
  smtp_from: 'terrafusion-alerts@your-domain.com'
  smtp_auth_username: 'alerts'
  smtp_auth_password: 'your-password'
  smtp_require_tls: true

  # Slack configuration
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Templates for alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  
  routes:
    # Critical alerts go to on-call immediately
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      repeat_interval: 5m

    # Database alerts go to DBA team
    - match:
        team: database
      receiver: 'database-team'

    # Infrastructure alerts go to ops team
    - match:
        team: infrastructure
      receiver: 'infrastructure-team'

    # Security alerts go to security team
    - match:
        team: security
      receiver: 'security-team'

    # Business alerts go to product team
    - match:
        team: business
      receiver: 'business-team'

    # Development alerts during business hours only
    - match:
        team: api
      receiver: 'dev-team'
      active_time_intervals:
        - business-hours

# Inhibition rules (suppress alerts when others are firing)
inhibit_rules:
  # Suppress warning alerts when critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['service', 'instance']

  # Suppress individual service alerts when the whole node is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*'
    equal: ['instance']

# Receiver configurations
receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://terrafusion-monitor:8080/webhook/alerts'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'terrafusion'
            password: 'monitoring-webhook-secret'

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@your-domain.com'
        html: |
          <h2>🚨 CRITICAL: TerraFusion Alert</h2>
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.job }}</p>
          <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
          <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}
          <p><strong>Runbook:</strong> Check monitoring dashboard and service logs immediately.</p>
          <p><em>The Belichick Standard: Handle this with urgency and precision.</em></p>

    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/CRITICAL/WEBHOOK'
        channel: '#terrafusion-critical'
        title: '🚨 CRITICAL TerraFusion Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Service:* {{ .Labels.job }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

    webhook_configs:
      - url: 'http://terrafusion-monitor:8080/webhook/critical'
        send_resolved: true

  # Database team alerts
  - name: 'database-team'
    email_configs:
      - to: 'dba-team@your-domain.com'
        html: |
          <h2>TerraFusion Database Alert</h2>
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Database:</strong> {{ .Labels.job }}</p>
          <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}
          <p>Please check database health and performance metrics.</p>

    slack_configs:
      - channel: '#terrafusion-database'
        title: 'Database Alert'
        text: |
          {{ range .Alerts }}
          *Database:* {{ .Labels.job }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Infrastructure team alerts
  - name: 'infrastructure-team'
    email_configs:
      - to: 'infrastructure@your-domain.com'
        html: |
          <h2>TerraFusion Infrastructure Alert</h2>
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Host:</strong> {{ .Labels.instance }}</p>
          <p><strong>Component:</strong> {{ .Labels.job }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}
          <p>Check system resources and container health.</p>

    slack_configs:
      - channel: '#terrafusion-infrastructure'
        title: 'Infrastructure Alert'
        text: |
          {{ range .Alerts }}
          *Host:* {{ .Labels.instance }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Security team alerts
  - name: 'security-team'
    email_configs:
      - to: 'security@your-domain.com'
        html: |
          <h2>🛡️ TerraFusion Security Alert</h2>
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Source:</strong> {{ .Labels.instance }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}
          <p><strong>Immediate security review required.</strong></p>

    slack_configs:
      - channel: '#terrafusion-security'
        title: '🛡️ Security Alert'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Source:* {{ .Labels.instance }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

  # Business team alerts
  - name: 'business-team'
    email_configs:
      - to: 'product@your-domain.com'
        html: |
          <h2>TerraFusion Business Metrics Alert</h2>
          {{ range .Alerts }}
          <p><strong>Alert:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.job }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}
          <p>Business impact analysis required.</p>

  # Development team alerts
  - name: 'dev-team'
    slack_configs:
      - channel: '#terrafusion-development'
        title: 'Development Alert'
        text: |
          {{ range .Alerts }}
          *Service:* {{ .Labels.job }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}

# Time intervals for routing
time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '17:00'
        location: 'America/New_York'