apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
data:
  terrafusion-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "TerraFusion Overview",
        "tags": ["terrafusion", "overview"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Service Health",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"terrafusion-.*\"}",
                "legendFormat": "{{job}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "mappings": [
                  {
                    "options": {
                      "0": {
                        "text": "DOWN",
                        "color": "red"
                      },
                      "1": {
                        "text": "UP",
                        "color": "green"
                      }
                    },
                    "type": "value"
                  }
                ]
              }
            }
          },
          {
            "id": 2,
            "title": "CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{pod=~\"terrafusion-.*\"}[5m])",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{pod=~\"terrafusion-.*\"}",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total[5m])",
                "legendFormat": "{{method}} {{path}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          },
          {
            "id": 6,
            "title": "Database Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "pg_stat_activity_count{datname=\"terrafusion\"}",
                "legendFormat": "Active connections"
              }
            ]
          },
          {
            "id": 7,
            "title": "Redis Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_memory_used_bytes / redis_memory_max_bytes * 100",
                "legendFormat": "Memory usage %"
              }
            ]
          },
          {
            "id": 8,
            "title": "GPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_accelerator_duty_cycle_percent{pod=~\"terrafusion-ai-swarm-.*\"}",
                "legendFormat": "{{pod}}"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 0,
        "links": []
      }
    }
  terrafusion-backend.json: |
    {
      "dashboard": {
        "id": null,
        "title": "TerraFusion Backend",
        "tags": ["terrafusion", "backend"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Backend Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"terrafusion-backend\"}[5m]))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket{job=\"terrafusion-backend\"}[5m]))",
                "legendFormat": "50th percentile"
              }
            ]
          },
          {
            "id": 2,
            "title": "Request Rate by Endpoint",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"terrafusion-backend\"}[5m])",
                "legendFormat": "{{method}} {{path}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{job=\"terrafusion-backend\", status=~\"5..\"}[5m]) / rate(http_requests_total{job=\"terrafusion-backend\"}[5m]) * 100",
                "legendFormat": "Error rate %"
              }
            ]
          },
          {
            "id": 4,
            "title": "Active Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "http_active_connections{job=\"terrafusion-backend\"}",
                "legendFormat": "Active connections"
              }
            ]
          },
          {
            "id": 5,
            "title": "Database Query Performance",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(database_query_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile query time"
              }
            ]
          },
          {
            "id": 6,
            "title": "Cache Hit Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cache_hits_total[5m]) / (rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) * 100",
                "legendFormat": "Cache hit rate %"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 0,
        "links": []
      }
    }
  terrafusion-ai-swarm.json: |
    {
      "dashboard": {
        "id": null,
        "title": "TerraFusion AI Swarm",
        "tags": ["terrafusion", "ai-swarm", "ml"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "GPU Utilization",
            "type": "graph",
            "targets": [
              {
                "expr": "container_accelerator_duty_cycle_percent{pod=~\"terrafusion-ai-swarm-.*\"}",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "GPU Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_accelerator_memory_used_bytes{pod=~\"terrafusion-ai-swarm-.*\"}",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Model Inference Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(model_inference_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              }
            ]
          },
          {
            "id": 4,
            "title": "Batch Processing Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(batch_processed_total[5m])",
                "legendFormat": "Batches per second"
              }
            ]
          },
          {
            "id": 5,
            "title": "Active Workers",
            "type": "graph",
            "targets": [
              {
                "expr": "ai_swarm_active_workers",
                "legendFormat": "Active workers"
              }
            ]
          },
          {
            "id": 6,
            "title": "Queue Length",
            "type": "graph",
            "targets": [
              {
                "expr": "ai_swarm_queue_length",
                "legendFormat": "Queue length"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "timepicker": {},
        "templating": {
          "list": []
        },
        "annotations": {
          "list": []
        },
        "refresh": "30s",
        "schemaVersion": 27,
        "version": 0,
        "links": []
      }
    }
