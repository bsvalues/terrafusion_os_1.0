---
# Airflow Webserver Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: terrafusion-airflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      serviceAccountName: airflow-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        fsGroup: 50000
      initContainers:
      - name: wait-for-postgres
        image: postgres:15.4-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h airflow-postgres -p 5432 -U airflow; do
            echo "Waiting for postgres..."
            sleep 2
          done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: postgres-password
      - name: airflow-init
        image: apache/airflow:2.7.1-python3.11
        command:
        - airflow
        - db
        - init
        env:
        - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
          value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@airflow-postgres:5432/airflow
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: postgres-password
        - name: AIRFLOW_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: fernet-key
        - name: AIRFLOW_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: secret-key
        volumeMounts:
        - name: airflow-config
          mountPath: /opt/airflow/airflow.cfg
          subPath: airflow.cfg
      containers:
      - name: airflow-webserver
        image: apache/airflow:2.7.1-python3.11
        ports:
        - containerPort: 8080
          name: http
        command:
        - airflow
        - webserver
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: redis-password
        - name: AIRFLOW_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: fernet-key
        - name: AIRFLOW_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: secret-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
        volumeMounts:
        - name: airflow-config
          mountPath: /opt/airflow/airflow.cfg
          subPath: airflow.cfg
        - name: dags-volume
          mountPath: /opt/airflow/dags
        - name: logs-volume
          mountPath: /opt/airflow/logs
        - name: plugins-volume
          mountPath: /opt/airflow/plugins
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: airflow-config
        configMap:
          name: airflow-config
      - name: dags-volume
        persistentVolumeClaim:
          claimName: airflow-dags-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: airflow-logs-pvc
      - name: plugins-volume
        persistentVolumeClaim:
          claimName: airflow-plugins-pvc

---
# Airflow Scheduler Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  namespace: terrafusion-airflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      serviceAccountName: airflow-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        fsGroup: 50000
      containers:
      - name: airflow-scheduler
        image: apache/airflow:2.7.1-python3.11
        command:
        - airflow
        - scheduler
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: redis-password
        - name: AIRFLOW_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: fernet-key
        - name: AIRFLOW_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: secret-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: 2Gi
            cpu: 1000m
          limits:
            memory: 4Gi
            cpu: 2000m
        volumeMounts:
        - name: airflow-config
          mountPath: /opt/airflow/airflow.cfg
          subPath: airflow.cfg
        - name: dags-volume
          mountPath: /opt/airflow/dags
        - name: logs-volume
          mountPath: /opt/airflow/logs
        - name: plugins-volume
          mountPath: /opt/airflow/plugins
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"
          initialDelaySeconds: 60
          periodSeconds: 60
      volumes:
      - name: airflow-config
        configMap:
          name: airflow-config
      - name: dags-volume
        persistentVolumeClaim:
          claimName: airflow-dags-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: airflow-logs-pvc
      - name: plugins-volume
        persistentVolumeClaim:
          claimName: airflow-plugins-pvc

---
# Airflow Workers Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-worker
  namespace: terrafusion-airflow
spec:
  replicas: 4
  selector:
    matchLabels:
      app: airflow-worker
  template:
    metadata:
      labels:
        app: airflow-worker
    spec:
      serviceAccountName: airflow-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        fsGroup: 50000
      containers:
      - name: airflow-worker
        image: apache/airflow:2.7.1-python3.11
        command:
        - airflow
        - celery
        - worker
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: redis-password
        - name: AIRFLOW_FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: fernet-key
        - name: AIRFLOW_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-secrets
              key: secret-key
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            memory: 3Gi
            cpu: 1500m
          limits:
            memory: 6Gi
            cpu: 3000m
        volumeMounts:
        - name: airflow-config
          mountPath: /opt/airflow/airflow.cfg
          subPath: airflow.cfg
        - name: dags-volume
          mountPath: /opt/airflow/dags
        - name: logs-volume
          mountPath: /opt/airflow/logs
        - name: plugins-volume
          mountPath: /opt/airflow/plugins
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "celery -A airflow.executors.celery_executor.app inspect ping -d celery@$(hostname)"
          initialDelaySeconds: 60
          periodSeconds: 60
      volumes:
      - name: airflow-config
        configMap:
          name: airflow-config
      - name: dags-volume
        persistentVolumeClaim:
          claimName: airflow-dags-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: airflow-logs-pvc
      - name: plugins-volume
        persistentVolumeClaim:
          claimName: airflow-plugins-pvc

---
# Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags-pvc
  namespace: terrafusion-airflow
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: fast-ssd-shared
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs-pvc
  namespace: terrafusion-airflow
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: fast-ssd-shared
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-plugins-pvc
  namespace: terrafusion-airflow
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: fast-ssd-shared
  resources:
    requests:
      storage: 5Gi

---
# Services
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
  namespace: terrafusion-airflow
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: airflow-webserver

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-service-account
  namespace: terrafusion-airflow

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: airflow-network-policy
  namespace: terrafusion-airflow
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from TerraFusion services
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-system
    ports:
    - protocol: TCP
      port: 8080
  # Allow internal communication
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-airflow
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  egress:
  # Allow to external systems
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 5432
  # Allow internal communication
  - to:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-airflow
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  # Allow to Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-streaming
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093