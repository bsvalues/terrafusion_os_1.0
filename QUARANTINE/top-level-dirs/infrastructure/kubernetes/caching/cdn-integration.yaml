apiVersion: v1
kind: ConfigMap
metadata:
  name: cdn-config
  namespace: terrafusion
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log main;

        # Performance optimizations
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 100M;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        # Brotli compression
        brotli on;
        brotli_comp_level 6;
        brotli_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            application/xml+rss
            text/javascript;

        # Cache zones
        proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:100m max_size=10g inactive=60m use_temp_path=off;
        proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=50g inactive=7d use_temp_path=off;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

        # Upstream servers
        upstream terrafusion_api {
            least_conn;
            server terrafusion-api:5000 max_fails=3 fail_timeout=30s;
            server terrafusion-api:5001 max_fails=3 fail_timeout=30s backup;
            keepalive 32;
        }

        # API caching server
        server {
            listen 80;
            server_name api.terrafusion.local;

            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";
            add_header Referrer-Policy strict-origin-when-cross-origin;

            # API endpoints with caching
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                
                proxy_pass http://terrafusion_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Caching configuration
                proxy_cache api_cache;
                proxy_cache_valid 200 302 10m;
                proxy_cache_valid 404 1m;
                proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
                proxy_cache_lock on;
                proxy_cache_lock_timeout 5s;

                # Cache key includes query parameters and headers
                proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";

                # Add cache status header
                add_header X-Cache-Status $upstream_cache_status;

                # Don't cache certain endpoints
                location ~* ^/api/(auth|security|realtime) {
                    proxy_cache off;
                    proxy_pass http://terrafusion_api;
                }

                # Cache government data endpoints longer
                location ~* ^/api/(counties|properties|valuations) {
                    proxy_cache_valid 200 302 1h;
                    proxy_pass http://terrafusion_api;
                }
            }

            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
        }

        # Static content CDN server
        server {
            listen 80;
            server_name cdn.terrafusion.local;

            root /var/www/html;
            index index.html;

            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";

            # Static assets with long-term caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                limit_req zone=static burst=100 nodelay;
                
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Vary "Accept-Encoding";
                
                # Enable caching
                proxy_cache static_cache;
                proxy_cache_valid 200 302 7d;
                proxy_cache_use_stale error timeout invalid_header updating;
                
                # Image optimization
                location ~* \.(png|jpg|jpeg)$ {
                    # WebP conversion for supported browsers
                    location ~* \.(png|jpg|jpeg)$ {
                        add_header Vary Accept;
                        try_files $uri$webp_suffix $uri =404;
                    }
                }
            }

            # HTML files with shorter caching
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public, must-revalidate";
            }

            # API documentation
            location /docs/ {
                expires 10m;
                add_header Cache-Control "public, must-revalidate";
            }

            # Default location
            location / {
                try_files $uri $uri/ =404;
            }
        }

        # SSL termination and redirect
        server {
            listen 443 ssl http2;
            server_name api.terrafusion.local cdn.terrafusion.local;

            ssl_certificate /etc/ssl/certs/terrafusion.crt;
            ssl_certificate_key /etc/ssl/private/terrafusion.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;

            # HSTS
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

            # Route to appropriate server block
            if ($host = api.terrafusion.local) {
                return 301 http://api.terrafusion.local$request_uri;
            }
            if ($host = cdn.terrafusion.local) {
                return 301 http://cdn.terrafusion.local$request_uri;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdn-nginx
  namespace: terrafusion
  labels:
    app: cdn-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cdn-nginx
  template:
    metadata:
      labels:
        app: cdn-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: static-content
          mountPath: /var/www/html
        - name: ssl-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: ssl-keys
          mountPath: /etc/ssl/private
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: cdn-config
      - name: cache-volume
        emptyDir:
          sizeLimit: 10Gi
      - name: static-content
        persistentVolumeClaim:
          claimName: static-content-pvc
      - name: ssl-certs
        secret:
          secretName: terrafusion-tls
          items:
          - key: tls.crt
            path: terrafusion.crt
      - name: ssl-keys
        secret:
          secretName: terrafusion-tls
          items:
          - key: tls.key
            path: terrafusion.key

---
apiVersion: v1
kind: Service
metadata:
  name: cdn-nginx
  namespace: terrafusion
  labels:
    app: cdn-nginx
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 443
    targetPort: 443
    name: https
  selector:
    app: cdn-nginx

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-content-pvc
  namespace: terrafusion
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: nfs-storage

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cdn-nginx-hpa
  namespace: terrafusion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cdn-nginx
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cdn-ingress
  namespace: terrafusion
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api.terrafusion.local
    - cdn.terrafusion.local
    secretName: terrafusion-tls
  rules:
  - host: api.terrafusion.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cdn-nginx
            port:
              number: 80
  - host: cdn.terrafusion.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cdn-nginx
            port:
              number: 80

---
apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-tls
  namespace: terrafusion
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t # Base64 encoded private key
