apiVersion: apps/v1
kind: Deployment
metadata:
  name: terramap-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terramap-backend
  template:
    metadata:
      labels:
        app: terramap-backend
    spec:
      containers:
      - name: backend
        image: terramap-backend:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: terramap-backend
spec:
  selector:
    app: terramap-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
