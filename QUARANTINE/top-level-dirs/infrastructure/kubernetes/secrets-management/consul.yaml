apiVersion: v1
kind: ConfigMap
metadata:
  name: consul-config
  namespace: vault
data:
  consul.json: |
    {
      "datacenter": "cosmic-dc1",
      "domain": "cosmic",
      "data_dir": "/consul/data",
      "log_level": "INFO",
      "server": true,
      "bootstrap_expect": 3,
      "ui": true,
      "client_addr": "0.0.0.0",
      "bind_addr": "0.0.0.0",
      "advertise_addr": "{{ GetInterfaceIP \"eth0\" }}",
      "retry_join": ["consul-0.consul.vault.svc.cluster.local", "consul-1.consul.vault.svc.cluster.local", "consul-2.consul.vault.svc.cluster.local"],
      "encrypt": "${CONSUL_GOSSIP_KEY}",
      "ca_file": "/consul/tls/ca.crt",
      "cert_file": "/consul/tls/tls.crt",
      "key_file": "/consul/tls/tls.key",
      "verify_incoming": true,
      "verify_outgoing": true,
      "verify_server_hostname": true,
      "ports": {
        "grpc": 8502,
        "http": 8500,
        "https": 8501,
        "serf_lan": 8301,
        "serf_wan": 8302,
        "server": 8300,
        "dns": 8600
      },
      "connect": {
        "enabled": true,
        "enable_mesh_gateway_wan_federation": true
      },
      "acl": {
        "enabled": true,
        "default_policy": "deny",
        "enable_token_persistence": true
      },
      "performance": {
        "raft_multiplier": 1
      },
      "telemetry": {
        "prometheus_retention_time": "30s",
        "disable_hostname": true
      },
      "cosmic_features": {
        "neural_consensus": true,
        "quantum_encryption": true,
        "holographic_replication": true,
        "consciousness_aware_routing": true
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: consul-secrets
  namespace: vault
type: Opaque
stringData:
  gossip-key: ${CONSUL_GOSSIP_KEY}  # Generate with: consul keygen
  master-token: ${CONSUL_MASTER_TOKEN}  # Generate strong token
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: consul
  namespace: vault
  labels:
    app: consul
spec:
  serviceName: consul
  replicas: 3
  selector:
    matchLabels:
      app: consul
  template:
    metadata:
      labels:
        app: consul
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8500"
        prometheus.io/path: "/v1/agent/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: consul
        image: consul:1.16.1
        command:
          - consul
          - agent
          - -config-file=/consul/config/consul.json
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONSUL_GOSSIP_KEY
          valueFrom:
            secretKeyRef:
              name: consul-secrets
              key: gossip-key
        - name: CONSUL_HTTP_TOKEN
          valueFrom:
            secretKeyRef:
              name: consul-secrets
              key: master-token
        ports:
        - containerPort: 8300
          name: server
        - containerPort: 8301
          name: serf-lan
        - containerPort: 8302
          name: serf-wan
        - containerPort: 8500
          name: http
        - containerPort: 8501
          name: https
        - containerPort: 8502
          name: grpc
        - containerPort: 8600
          name: dns
          protocol: UDP
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /v1/agent/self
            port: 8500
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/agent/self
            port: 8500
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: consul-data
          mountPath: /consul/data
        - name: consul-config
          mountPath: /consul/config
        - name: consul-tls
          mountPath: /consul/tls
      volumes:
      - name: consul-config
        configMap:
          name: consul-config
      - name: consul-tls
        secret:
          secretName: consul-tls
  volumeClaimTemplates:
  - metadata:
      name: consul-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: consul
  namespace: vault
  labels:
    app: consul
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: server
    port: 8300
    targetPort: 8300
  - name: serf-lan
    port: 8301
    targetPort: 8301
  - name: serf-wan
    port: 8302
    targetPort: 8302
  - name: http
    port: 8500
    targetPort: 8500
  - name: https
    port: 8501
    targetPort: 8501
  - name: grpc
    port: 8502
    targetPort: 8502
  - name: dns
    port: 8600
    targetPort: 8600
    protocol: UDP
  selector:
    app: consul
---
apiVersion: v1
kind: Service
metadata:
  name: consul-ui
  namespace: vault
  labels:
    app: consul
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8500
    targetPort: 8500
  selector:
    app: consul