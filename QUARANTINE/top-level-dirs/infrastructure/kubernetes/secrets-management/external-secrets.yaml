apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    cosmic-platform: terrafusion
    component: secrets-management
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: external-secrets
  labels:
    app: external-secrets
spec:
  replicas: 2
  selector:
    matchLabels:
      app: external-secrets
  template:
    metadata:
      labels:
        app: external-secrets
    spec:
      serviceAccountName: external-secrets
      containers:
      - name: external-secrets
        image: ghcr.io/external-secrets/external-secrets:v0.9.0
        args:
        - --loglevel=info
        - --concurrent-reconciles=10
        - --enable-leader-election
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: webhook
        - containerPort: 8082
          name: probes
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: webhook
        image: ghcr.io/external-secrets/external-secrets:v0.9.0
        args:
        - webhook
        - --loglevel=info
        - --port=8081
        ports:
        - containerPort: 8081
          name: webhook
        livenessProbe:
          httpGet:
            path: /healthz
            port: webhook
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: webhook
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets
rules:
- apiGroups: ["external-secrets.io"]
  resources: ["secretstores", "clustersecretstores", "externalsecrets", "clusterexternalsecrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["external-secrets.io"]
  resources: ["secretstores/status", "externalsecrets/status"]
  verbs: ["update", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: external-secrets-webhook
  namespace: external-secrets
  labels:
    app: external-secrets
spec:
  type: ClusterIP
  ports:
  - port: 443
    targetPort: 8081
    name: webhook
  selector:
    app: external-secrets
---
# Secret Store configurations
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: terrafusion-cosmic
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "cosmic"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cosmic-app"
          serviceAccountRef:
            name: "cosmic-app"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      vaultUrl: "https://cosmic-keyvault.vault.azure.net"
      authType: WorkloadIdentity
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secretmanager
spec:
  provider:
    gcpsm:
      projectID: "terrafusion-cosmic"
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: cosmic-cluster
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Example External Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: terrafusion-cosmic
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cosmic-level: "restricted"
          managed-by: "external-secrets"
      data:
        DATABASE_URL: "{{ .url }}"
        DATABASE_USERNAME: "{{ .username }}"
        DATABASE_PASSWORD: "{{ .password }}"
  data:
  - secretKey: url
    remoteRef:
      key: database/config
      property: url
  - secretKey: username
    remoteRef:
      key: database/config
      property: username
  - secretKey: password
    remoteRef:
      key: database/config
      property: password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cosmic-neural-keys
  namespace: terrafusion-cosmic
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: cosmic-neural-keys
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      engineVersion: v2
      data:
        tls.crt: "{{ .certificate | b64enc }}"
        tls.key: "{{ .privateKey | b64enc }}"
        neural-model-key: "{{ .neuralModelKey }}"
        consciousness-token: "{{ .consciousnessToken }}"
  dataFrom:
  - extract:
      key: cosmic/neural/keys
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantum-entanglement-keys
  namespace: terrafusion-cosmic
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: quantum-entanglement-keys
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        QUANTUM_KEY_DIMENSION_1: "{{ .dimension1 }}"
        QUANTUM_KEY_DIMENSION_2: "{{ .dimension2 }}"
        QUANTUM_KEY_DIMENSION_3: "{{ .dimension3 }}"
        QUANTUM_KEY_DIMENSION_4: "{{ .dimension4 }}"
        QUANTUM_KEY_DIMENSION_5: "{{ .dimension5 }}"
        QUANTUM_KEY_DIMENSION_6: "{{ .dimension6 }}"
        QUANTUM_KEY_DIMENSION_7: "{{ .dimension7 }}"
        QUANTUM_KEY_DIMENSION_8: "{{ .dimension8 }}"
        QUANTUM_KEY_DIMENSION_9: "{{ .dimension9 }}"
        QUANTUM_KEY_DIMENSION_10: "{{ .dimension10 }}"
        QUANTUM_KEY_DIMENSION_11: "{{ .dimension11 }}"
        ENTANGLEMENT_MATRIX: "{{ .entanglementMatrix | toString | b64enc }}"
  data:
  - secretKey: dimension1
    remoteRef:
      key: quantum-key-d1
  - secretKey: dimension2
    remoteRef:
      key: quantum-key-d2
  - secretKey: dimension3
    remoteRef:
      key: quantum-key-d3
  - secretKey: dimension4
    remoteRef:
      key: quantum-key-d4
  - secretKey: dimension5
    remoteRef:
      key: quantum-key-d5
  - secretKey: dimension6
    remoteRef:
      key: quantum-key-d6
  - secretKey: dimension7
    remoteRef:
      key: quantum-key-d7
  - secretKey: dimension8
    remoteRef:
      key: quantum-key-d8
  - secretKey: dimension9
    remoteRef:
      key: quantum-key-d9
  - secretKey: dimension10
    remoteRef:
      key: quantum-key-d10
  - secretKey: dimension11
    remoteRef:
      key: quantum-key-d11
  - secretKey: entanglementMatrix
    remoteRef:
      key: quantum-entanglement-matrix
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: interplanetary-credentials
spec:
  namespaceSelector:
    matchLabels:
      cosmic-network: "enabled"
  refreshInterval: 30m
  externalSecretSpec:
    secretStoreRef:
      name: gcp-secretmanager
      kind: ClusterSecretStore
    target:
      name: interplanetary-credentials
      creationPolicy: Owner
    dataFrom:
    - find:
        name:
          regexp: "^interplanetary-.*"
        tags:
          network: "quantum-tunnel"