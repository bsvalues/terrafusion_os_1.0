apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    cosmic-platform: terrafusion
    component: secrets-management
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-agent-injector
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-discovery
rules:
- apiGroups: [""]
  resources: ["pods", "services", "serviceaccounts", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-discovery
subjects:
- kind: ServiceAccount
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-agent-injector
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "serviceaccounts", "namespaces", "pods", "pods/log", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["mutatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "patch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-agent-injector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-agent-injector
subjects:
- kind: ServiceAccount
  name: vault-agent-injector
  namespace: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    
    listener "tcp" {
      tls_disable = 0
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
      telemetry {
        unauthenticated_metrics_access = true
      }
    }
    
    storage "consul" {
      path = "vault"
      address = "consul.vault.svc.cluster.local:8500"
      cluster_addr = "https://$(HOSTNAME).vault-internal:8201"
      redirect_addr = "https://$(HOSTNAME).vault-internal:8200"
      tls_skip_verify = "false"
    }
    
    service_registration "kubernetes" {
      namespace = "vault"
      pod_name = "$(HOSTNAME)"
    }
    
    seal "awskms" {
      region = "us-east-1"
      kms_key_id = "${VAULT_KMS_KEY_ID}"
    }
    
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
    }
    
    # Cosmic Platform Features
    cosmic_features {
      neural_encryption = true
      quantum_key_generation = true
      consciousness_aware_policies = true
      holographic_secret_storage = true
      interplanetary_replication = true
    }
    
    # Performance Tuning
    max_lease_ttl = "87600h"
    default_lease_ttl = "87600h"
    cluster_cipher_suites = "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
    
    # Audit Logging
    audit {
      type = "file"
      format = "json"
      file_path = "/vault/logs/audit.log"
      log_raw = false
      hmac_accessor = true
      mode = 0644
      prefix = "cosmic-audit:"
    }
  
  agent-config.hcl: |
    pid_file = "/tmp/vault-agent.pid"
    
    vault {
      address = "https://vault.vault.svc.cluster.local:8200"
      tls_skip_verify = false
      ca_cert = "/vault/tls/ca.crt"
    }
    
    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "cosmic-app"
        }
      }
      
      sink "file" {
        config = {
          path = "/tmp/vault-token"
        }
      }
    }
    
    cache {
      use_auto_auth_token = true
    }
    
    listener "tcp" {
      address = "127.0.0.1:8100"
      tls_disable = true
    }
    
    template {
      contents = <<EOT
    {{- with secret "cosmic/data/database/config" }}
    DATABASE_URL={{ .Data.data.url }}
    DATABASE_USERNAME={{ .Data.data.username }}
    DATABASE_PASSWORD={{ .Data.data.password }}
    {{- end }}
    EOT
      destination = "/vault/secrets/database.env"
    }
    
    template {
      contents = <<EOT
    {{- with secret "cosmic/data/neural/keys" }}
    NEURAL_PRIVATE_KEY={{ .Data.data.private_key }}
    NEURAL_PUBLIC_KEY={{ .Data.data.public_key }}
    NEURAL_ENCRYPTION_KEY={{ .Data.data.encryption_key }}
    {{- end }}
    EOT
      destination = "/vault/secrets/neural.env"
    }
    
    template {
      contents = <<EOT
    {{- with secret "cosmic/data/quantum/config" }}
    QUANTUM_ENTANGLEMENT_KEY={{ .Data.data.entanglement_key }}
    QUANTUM_DIMENSION_MAP={{ .Data.data.dimension_map }}
    QUANTUM_COHERENCE_TOKEN={{ .Data.data.coherence_token }}
    {{- end }}
    EOT
      destination = "/vault/secrets/quantum.env"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policies
  namespace: vault
data:
  cosmic-admin.hcl: |
    # Cosmic Admin Policy - Full access
    path "*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }
    
  cosmic-operator.hcl: |
    # Cosmic Operator Policy - Operational access
    path "cosmic/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    path "neural/*" {
      capabilities = ["read", "list"]
    }
    
    path "quantum/*" {
      capabilities = ["read", "list"]
    }
    
    path "auth/token/create" {
      capabilities = ["create", "update"]
    }
    
    path "sys/health" {
      capabilities = ["read"]
    }
    
    path "sys/policies/acl/*" {
      capabilities = ["read", "list"]
    }
    
  cosmic-app.hcl: |
    # Cosmic Application Policy - Read-only access
    path "cosmic/data/{{identity.entity.aliases.auth_kubernetes_*.metadata.service_account_namespace}}/*" {
      capabilities = ["read", "list"]
    }
    
    path "cosmic/metadata/{{identity.entity.aliases.auth_kubernetes_*.metadata.service_account_namespace}}/*" {
      capabilities = ["list"]
    }
    
    path "neural/data/public/*" {
      capabilities = ["read"]
    }
    
    path "quantum/data/readonly/*" {
      capabilities = ["read"]
    }
    
  neural-network.hcl: |
    # Neural Network Policy - AI service access
    path "neural/*" {
      capabilities = ["create", "read", "update", "list"]
    }
    
    path "cosmic/data/neural/*" {
      capabilities = ["read", "list"]
    }
    
    path "quantum/data/neural/*" {
      capabilities = ["read"]
    }
    
    path "auth/token/renew-self" {
      capabilities = ["update"]
    }
    
  quantum-storage.hcl: |
    # Quantum Storage Policy - Storage service access
    path "quantum/*" {
      capabilities = ["create", "read", "update", "delete", "list"]
    }
    
    path "cosmic/data/quantum/*" {
      capabilities = ["read", "list"]
    }
    
    path "holographic/data/*" {
      capabilities = ["create", "read", "update", "delete"]
    }
    
  consciousness-service.hcl: |
    # Consciousness Service Policy
    path "consciousness/*" {
      capabilities = ["create", "read", "update", "list"]
    }
    
    path "neural/data/consciousness/*" {
      capabilities = ["read", "update"]
    }
    
    path "cosmic/data/consciousness/*" {
      capabilities = ["read"]
    }
    
    path "quantum/data/consciousness/*" {
      capabilities = ["read", "update"]
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  serviceName: vault-internal
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: vault
        image: vault:1.14.1
        command:
        - vault
        - server
        - -config=/vault/config/vault.hcl
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_API_ADDR
          value: "https://$(HOSTNAME).vault-internal:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(HOSTNAME).vault-internal:8201"
        - name: VAULT_RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_KMS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: vault-kms
              key: key-id
        - name: AWS_REGION
          value: "us-east-1"
        - name: SKIP_CHOWN
          value: "true"
        - name: SKIP_SETCAP
          value: "true"
        ports:
        - containerPort: 8200
          name: vault
        - containerPort: 8201
          name: cluster
        - containerPort: 8202
          name: replication
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        volumeMounts:
        - name: vault-config
          mountPath: /vault/config
        - name: vault-tls
          mountPath: /vault/tls
        - name: vault-data
          mountPath: /vault/data
        - name: vault-logs
          mountPath: /vault/logs
        - name: vault-policies
          mountPath: /vault/policies
      volumes:
      - name: vault-config
        configMap:
          name: vault-config
      - name: vault-tls
        secret:
          secretName: vault-tls
      - name: vault-logs
        emptyDir: {}
      - name: vault-policies
        configMap:
          name: vault-policies
  volumeClaimTemplates:
  - metadata:
      name: vault-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  publishNotReadyAddresses: true
  ports:
  - name: vault
    port: 8200
    targetPort: 8200
  - name: cluster
    port: 8201
    targetPort: 8201
  selector:
    app: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
  labels:
    app: vault
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: vault
    port: 8200
    targetPort: 8200
  - name: cluster
    port: 8201
    targetPort: 8201
  selector:
    app: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault-standby
  namespace: vault
  labels:
    app: vault
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
  - name: vault
    port: 8200
    targetPort: 8200
  - name: cluster
    port: 8201
    targetPort: 8201
  selector:
    app: vault