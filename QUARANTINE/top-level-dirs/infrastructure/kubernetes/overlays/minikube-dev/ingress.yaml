# Example Ingress for Minikube
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: terrafusion.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-frontend
                port:
                  number: 80
