apiVersion: v1
kind: ConfigMap
metadata:
  name: terrafusion-metrics-config
  namespace: terrafusion-system
  labels:
    app: terrafusion-autoscaling
    component: custom-metrics
data:
  metrics-config.yaml: |
    # TerraFusion OS Custom Metrics Configuration
    # AI Workload Scaling Metrics
    
    aiMetrics:
      swarmIntelligence:
        - name: ai_agent_queue_length
          description: "Number of queued AI agent tasks"
          threshold: 100
          scaleUpFactor: 2
          scaleDownFactor: 0.5
        
        - name: swarm_coherence_level
          description: "Collective intelligence coherence percentage"
          threshold: 85
          scaleUpFactor: 1.5
          
        - name: revenue_optimization_requests_per_second
          description: "Government revenue optimization requests rate"
          threshold: 1000
          scaleUpFactor: 3
      
      quantumEngine:
        - name: quantum_computation_queue_depth
          description: "Quantum computation queue depth"
          threshold: 50
          scaleUpFactor: 2
          
        - name: quantum_speedup_factor
          description: "Current quantum speedup multiplier"
          threshold: 379000000
          maintainLevel: true
          
        - name: quantum_entanglement_stability
          description: "Quantum entanglement stability percentage"
          threshold: 95
          scaleUpFactor: 1.2
      
      probabilisticEngine:
        - name: pbit_computation_rate
          description: "P-bit computations per second"
          threshold: 1000
          scaleUpFactor: 1.8
          
        - name: uncertainty_quantification_requests
          description: "Uncertainty quantification requests per second"
          threshold: 500
          scaleUpFactor: 2
          
        - name: probabilistic_accuracy_score
          description: "Probabilistic computation accuracy"
          threshold: 97
          maintainLevel: true
    
    governmentMetrics:
      workloadComplexity:
        - name: government_workload_complexity
          description: "Government workload complexity score"
          threshold: 75
          scaleUpFactor: 2.5
          
        - name: compliance_validation_load
          description: "FISMA/NIST compliance validation load"
          threshold: 80
          scaleUpFactor: 1.5
      
      performanceTargets:
        - name: ai_model_inference_latency
          description: "AI model inference latency (ms)"
          threshold: 100
          scaleUpWhenAbove: true
          
        - name: government_service_response_time
          description: "Government service response time (ms)"
          threshold: 200
          scaleUpWhenAbove: true
          
        - name: revenue_discovery_efficiency
          description: "Revenue discovery efficiency percentage"
          threshold: 95
          maintainLevel: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terrafusion-scaling-policies
  namespace: terrafusion-system
  labels:
    app: terrafusion-autoscaling
    component: scaling-policies
data:
  scaling-policies.yaml: |
    # TerraFusion OS Scaling Policies
    
    defaultPolicies:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 50
            periodSeconds: 30
          - type: Pods
            value: 5
            periodSeconds: 30
        selectPolicy: Max
      
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
          - type: Pods
            value: 2
            periodSeconds: 60
        selectPolicy: Min
    
    aiWorkloadPolicies:
      swarmIntelligence:
        scaleUp:
          stabilizationWindowSeconds: 30
          maxScaleUp: 100
          aggressiveScaling: true
        scaleDown:
          stabilizationWindowSeconds: 600
          conservativeScaling: true
          
      quantumEngine:
        scaleUp:
          stabilizationWindowSeconds: 15
          maxScaleUp: 200
          quantumOptimized: true
        scaleDown:
          stabilizationWindowSeconds: 900
          quantumStabilization: true
          
      probabilisticEngine:
        scaleUp:
          stabilizationWindowSeconds: 45
          maxScaleUp: 75
          probabilisticOptimized: true
        scaleDown:
          stabilizationWindowSeconds: 450
          uncertaintyAware: true
