apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-ai-swarm-hpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: swarm-intelligence
    tier: ai-workload
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-ai-swarm
  minReplicas: 3
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: ai_agent_queue_length
      target:
        type: AverageValue
        averageValue: "100"
  - type: Object
    object:
      metric:
        name: revenue_optimization_requests_per_second
      target:
        type: Value
        value: "1000"
      describedObject:
        apiVersion: v1
        kind: Service
        name: terrafusion-ai-service
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 5
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-quantum-engine-hpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: quantum-engine
    tier: ai-workload
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-quantum-engine
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  - type: Pods
    pods:
      metric:
        name: quantum_computation_queue_depth
      target:
        type: AverageValue
        averageValue: "50"
  - type: External
    external:
      metric:
        name: quantum_speedup_factor
        selector:
          matchLabels:
            component: quantum-accelerator
      target:
        type: Value
        value: "379000000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 5
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-probabilistic-engine-hpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: probabilistic-engine
    tier: ai-workload
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-probabilistic-engine
  minReplicas: 2
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Pods
    pods:
      metric:
        name: pbit_computation_rate
      target:
        type: AverageValue
        averageValue: "1000"
  - type: Pods
    pods:
      metric:
        name: uncertainty_quantification_requests
      target:
        type: AverageValue
        averageValue: "500"
