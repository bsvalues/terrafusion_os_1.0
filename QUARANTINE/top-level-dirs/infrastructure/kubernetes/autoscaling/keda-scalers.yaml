apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: terrafusion-ai-swarm-scaler
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: swarm-intelligence
spec:
  scaleTargetRef:
    name: terrafusion-ai-swarm
  minReplicaCount: 3
  maxReplicaCount: 100
  pollingInterval: 15
  cooldownPeriod: 300
  idleReplicaCount: 5
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: ai_agent_queue_length
      threshold: '100'
      query: sum(ai_agent_queue_length{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: revenue_optimization_rps
      threshold: '1000'
      query: sum(rate(revenue_optimization_requests_total{namespace="terrafusion-system"}[2m]))
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: swarm_coherence_level
      threshold: '85'
      query: avg(swarm_coherence_percentage{namespace="terrafusion-system"})

