apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: terrafusion-quantum-engine-scaler
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: quantum-engine
spec:
  scaleTargetRef:
    name: terrafusion-quantum-engine
  minReplicaCount: 2
  maxReplicaCount: 50
  pollingInterval: 10
  cooldownPeriod: 600
  idleReplicaCount: 3
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: quantum_computation_queue_depth
      threshold: '50'
      query: avg(quantum_computation_queue_depth{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: quantum_entanglement_stability
      threshold: '95'
      query: min(quantum_entanglement_stability{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: quantum_error_rate
      threshold: '0.01'
      query: avg(quantum_error_rate{namespace="terrafusion-system"})

