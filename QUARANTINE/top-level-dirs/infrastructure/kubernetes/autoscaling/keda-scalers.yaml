apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: terrafusion-probabilistic-engine-scaler
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: probabilistic-engine
spec:
  scaleTargetRef:
    name: terrafusion-probabilistic-engine
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 20
  cooldownPeriod: 450
  idleReplicaCount: 3
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: pbit_computation_rate
      threshold: '1000'
      query: sum(rate(pbit_computations_total{namespace="terrafusion-system"}[1m]))
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: uncertainty_quantification_requests
      threshold: '500'
      query: sum(rate(uncertainty_quantification_requests_total{namespace="terrafusion-system"}[1m]))
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: probabilistic_accuracy_score
      threshold: '97'
      query: avg(probabilistic_accuracy_score{namespace="terrafusion-system"})

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: terrafusion-government-workload-scaler
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: government-workload
spec:
  scaleTargetRef:
    name: terrafusion-government-api
  minReplicaCount: 5
  maxReplicaCount: 200
  pollingInterval: 30
  cooldownPeriod: 180
  idleReplicaCount: 10
  triggers:
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: government_workload_complexity
      threshold: '75'
      query: avg(government_workload_complexity_score{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: compliance_validation_load
      threshold: '80'
      query: sum(compliance_validation_requests{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: government_service_response_time
      threshold: '200'
      query: avg(government_service_response_duration_ms{namespace="terrafusion-system"})
  - type: prometheus
    metadata:
      serverAddress: http://prometheus.terrafusion-system.svc:9090
      metricName: concurrent_government_users
      threshold: '1000'
      query: sum(concurrent_government_users{namespace="terrafusion-system"})
