apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: terrafusion-ai-swarm-vpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: swarm-intelligence
    tier: ai-workload
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-ai-swarm
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 3
  resourcePolicy:
    containerPolicies:
    - containerName: ai-swarm-container
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: 8
        memory: 32Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    - containerName: swarm-coordinator
      minAllowed:
        cpu: 200m
        memory: 512Mi
      maxAllowed:
        cpu: 2
        memory: 8Gi

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: terrafusion-quantum-engine-vpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: quantum-engine
    tier: ai-workload
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-quantum-engine
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
    - containerName: quantum-engine-container
      minAllowed:
        cpu: 1
        memory: 2Gi
      maxAllowed:
        cpu: 16
        memory: 64Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
    - containerName: quantum-accelerator
      minAllowed:
        cpu: 2
        memory: 4Gi
      maxAllowed:
        cpu: 32
        memory: 128Gi

