apiVersion: v1
kind: Namespace
metadata:
  name: chaos-mesh
  labels:
    cosmic-platform: terrafusion
    component: chaos-engineering
---
# Chaos Mesh installation would typically be done via Helm:
# helm repo add chaos-mesh https://charts.chaos-mesh.org
# helm install chaos-mesh chaos-mesh/chaos-mesh -n chaos-mesh --version 2.6.0
---
# Network Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: cosmic-network-delay
  namespace: load-testing
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      app: cosmic-orchestrator
  delay:
    latency: "100ms"
    correlation: "50"
    jitter: "50ms"
  duration: "5m"
  scheduler:
    cron: "@every 2h"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: quantum-network-partition
  namespace: load-testing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      app: holographic-storage
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - terrafusion-cosmic
      labelSelectors:
        app: consciousness-service
  duration: "2m"
---
# Pod Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: neural-pod-failure
  namespace: load-testing
spec:
  action: pod-failure
  mode: one
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      cosmic-role: neural-network
  duration: "1m"
  scheduler:
    cron: "@every 30m"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: consciousness-pod-kill
  namespace: load-testing
spec:
  action: pod-kill
  mode: random-max-percent
  value: "30"
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      app: consciousness-service
  gracePeriod: 0
---
# Stress Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: quantum-cpu-stress
  namespace: load-testing
spec:
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      app: holographic-storage
  stressors:
    cpu:
      workers: 4
      load: 80
    memory:
      workers: 4
      size: "1GB"
  duration: "3m"
---
# IO Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: IOChaos
metadata:
  name: cosmic-io-delay
  namespace: load-testing
spec:
  action: latency
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      app: cosmic-orchestrator
  volumePath: /data
  path: "/data/*"
  delay: "100ms"
  percent: 50
  duration: "5m"
---
# Time Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: TimeChaos
metadata:
  name: quantum-time-skew
  namespace: load-testing
spec:
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      cosmic-feature: quantum-sync
  timeOffset: "30s"
  duration: "10m"
---
# HTTP Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: api-gateway-chaos
  namespace: load-testing
spec:
  mode: all
  selector:
    namespaces:
      - kong
    labelSelectors:
      app: kong-proxy
  target: Request
  port: 8000
  method: POST
  path: "/api/v1/neural/*"
  abort: true
  duration: "30s"
  scheduler:
    cron: "@every 1h"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: api-response-delay
  namespace: load-testing
spec:
  mode: random-max-percent
  value: "50"
  selector:
    namespaces:
      - kong
    labelSelectors:
      app: kong-proxy
  target: Response
  port: 8000
  delay: "2s"
  duration: "2m"
---
# JVM Chaos for Java services
apiVersion: chaos-mesh.org/v1alpha1
kind: JVMChaos
metadata:
  name: neural-jvm-exception
  namespace: load-testing
spec:
  action: exception
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      runtime: jvm
      app: neural-processor
  class: "io.terrafusion.neural.NeuralProcessor"
  method: "processQuantumData"
  exception: "io.terrafusion.exceptions.QuantumCoherenceException"
  duration: "1m"
---
# Kernel Chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: KernelChaos
metadata:
  name: cosmic-kernel-chaos
  namespace: load-testing
spec:
  mode: all
  selector:
    namespaces:
      - terrafusion-cosmic
    labelSelectors:
      cosmic-critical: "true"
  failKernRequest:
    failtype: 0
    headers:
      - IFLA_MTU
      - IFLA_QDISC
    probability: 10
  duration: "1m"
---
# Workflow for complex chaos scenarios
apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: cosmic-chaos-workflow
  namespace: load-testing
spec:
  entry: cosmic-chaos-sequence
  templates:
  - name: cosmic-chaos-sequence
    templateType: Serial
    deadline: 30m
    children:
    - inject-network-delay
    - stress-neural-pods
    - partition-quantum-network
    - recover-and-validate
  
  - name: inject-network-delay
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: delay
      mode: all
      selector:
        namespaces:
          - terrafusion-cosmic
      delay:
        latency: "200ms"
      duration: "5m"
  
  - name: stress-neural-pods
    templateType: StressChaos
    deadline: 5m
    stressChaos:
      mode: all
      selector:
        namespaces:
          - terrafusion-cosmic
        labelSelectors:
          cosmic-role: neural-network
      stressors:
        cpu:
          workers: 8
          load: 90
      duration: "5m"
  
  - name: partition-quantum-network
    templateType: NetworkChaos
    deadline: 5m
    networkChaos:
      action: partition
      mode: all
      selector:
        namespaces:
          - terrafusion-cosmic
        labelSelectors:
          cosmic-feature: quantum-sync
      direction: both
      duration: "5m"
  
  - name: recover-and-validate
    templateType: Task
    deadline: 10m
    task:
      container:
        name: validator
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for recovery..."
          sleep 60
          echo "Validating cosmic platform health..."
          curl -f https://api.terrafusion.cosmic/health || exit 1
          echo "Platform recovered successfully!"
---
# Schedule for chaos experiments
apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: cosmic-chaos-schedule
  namespace: load-testing
spec:
  schedule: "@every 6h"
  historyLimit: 10
  concurrencyPolicy: Forbid
  type: Workflow
  workflow:
    entry: daily-chaos
    templates:
    - name: daily-chaos
      templateType: Parallel
      deadline: 1h
      children:
      - network-chaos
      - pod-chaos
      - stress-chaos
    
    - name: network-chaos
      templateType: NetworkChaos
      networkChaos:
        action: loss
        mode: random-max-percent
        value: "30"
        selector:
          namespaces:
            - terrafusion-cosmic
        loss:
          loss: "30"
        duration: "10m"
    
    - name: pod-chaos
      templateType: PodChaos
      podChaos:
        action: pod-failure
        mode: random-max-percent
        value: "20"
        selector:
          namespaces:
            - terrafusion-cosmic
        duration: "5m"
    
    - name: stress-chaos
      templateType: StressChaos
      stressChaos:
        mode: all
        selector:
          namespaces:
            - terrafusion-cosmic
        stressors:
          memory:
            workers: 2
            size: "2GB"
        duration: "10m"