apiVersion: k6.io/v1alpha1
kind: K6
metadata:
  name: cosmic-basic-test
  namespace: load-testing
spec:
  parallelism: 4
  script:
    configMap:
      name: k6-cosmic-tests
      file: cosmic-basic.js
  arguments: "--out influxdb=http://influxdb:8086/k6"
  runner:
    image: grafana/k6:0.45.0
    metadata:
      labels:
        test-type: "basic"
        cosmic-level: "standard"
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    env:
    - name: BASE_URL
      value: "https://api.terrafusion.cosmic"
    - name: API_TOKEN
      valueFrom:
        secretKeyRef:
          name: load-test-secrets
          key: api-token
    - name: K6_PROMETHEUS_RW_SERVER_URL
      value: "http://prometheus:9090/api/v1/write"
---
apiVersion: k6.io/v1alpha1
kind: K6
metadata:
  name: cosmic-stress-test
  namespace: load-testing
spec:
  parallelism: 10
  script:
    configMap:
      name: k6-cosmic-tests
      file: cosmic-stress.js
  arguments: "--out influxdb=http://influxdb:8086/k6 --tag testid=stress"
  runner:
    image: grafana/k6:0.45.0
    metadata:
      labels:
        test-type: "stress"
        cosmic-level: "extreme"
    resources:
      requests:
        cpu: 2000m
        memory: 4Gi
      limits:
        cpu: 8000m
        memory: 16Gi
    env:
    - name: BASE_URL
      value: "https://api.terrafusion.cosmic"
    - name: WS_URL
      value: "wss://api.terrafusion.cosmic"
    - name: scenario
      value: "mixed"
  cleanup: "post"
---
apiVersion: k6.io/v1alpha1
kind: K6
metadata:
  name: cosmic-chaos-test
  namespace: load-testing
spec:
  parallelism: 5
  script:
    configMap:
      name: k6-cosmic-tests
      file: cosmic-chaos.js
  arguments: "--out csv=chaos-results.csv --summary-export=chaos-summary.json"
  runner:
    image: grafana/k6:0.45.0
    metadata:
      labels:
        test-type: "chaos"
        cosmic-level: "quantum"
      annotations:
        chaos-mesh.org/inject: "true"
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    env:
    - name: BASE_URL
      value: "https://api.terrafusion.cosmic"
    - name: CHAOS_ENABLED
      value: "true"
  separate: true
---
# Scheduled load tests
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-load-test
  namespace: load-testing
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k6-operator
          containers:
          - name: trigger
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              kubectl apply -f - <<EOF
              apiVersion: k6.io/v1alpha1
              kind: K6
              metadata:
                name: nightly-test-$(date +%Y%m%d-%H%M%S)
                namespace: load-testing
              spec:
                parallelism: 2
                script:
                  configMap:
                    name: k6-cosmic-tests
                    file: cosmic-basic.js
                arguments: "--duration 30m --vus 200"
                runner:
                  image: grafana/k6:0.45.0
                  env:
                  - name: BASE_URL
                    value: "https://api.terrafusion.cosmic"
                  - name: TEST_TYPE
                    value: "nightly"
              EOF
          restartPolicy: OnFailure
---
# Load test results storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: load-test-results
  namespace: load-testing
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi
---
# InfluxDB for metrics storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: influxdb
  namespace: load-testing
spec:
  serviceName: influxdb
  replicas: 1
  selector:
    matchLabels:
      app: influxdb
  template:
    metadata:
      labels:
        app: influxdb
    spec:
      containers:
      - name: influxdb
        image: influxdb:2.7
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: INFLUXDB_DB
          value: k6
        - name: INFLUXDB_ADMIN_USER
          value: admin
        - name: INFLUXDB_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: influxdb-secrets
              key: admin-password
        volumeMounts:
        - name: data
          mountPath: /var/lib/influxdb2
        - name: config
          mountPath: /etc/influxdb2
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: influxdb
  namespace: load-testing
spec:
  type: ClusterIP
  ports:
  - port: 8086
    targetPort: 8086
    name: http
  selector:
    app: influxdb
---
# Grafana dashboard for load test results
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-grafana-dashboard
  namespace: load-testing
  labels:
    grafana_dashboard: "1"
data:
  k6-load-testing.json: |
    {
      "dashboard": {
        "title": "K6 Cosmic Platform Load Testing",
        "uid": "k6-cosmic-load",
        "tags": ["k6", "load-testing", "cosmic"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Virtual Users",
            "type": "graph",
            "targets": [
              {
                "expr": "k6_vus",
                "legendFormat": "VUs"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(k6_http_reqs_total[1m])",
                "legendFormat": "Requests/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Response Time Percentiles",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, k6_http_req_duration)",
                "legendFormat": "p95"
              },
              {
                "expr": "histogram_quantile(0.99, k6_http_req_duration)",
                "legendFormat": "p99"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(k6_http_req_failed[1m])",
                "legendFormat": "Error Rate"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Cosmic Metrics",
            "type": "stat",
            "targets": [
              {
                "expr": "k6_cosmic_throughput",
                "legendFormat": "Cosmic Throughput"
              },
              {
                "expr": "k6_neural_success",
                "legendFormat": "Neural Success Rate"
              },
              {
                "expr": "k6_quantum_errors",
                "legendFormat": "Quantum Errors"
              }
            ],
            "gridPos": {"h": 4, "w": 24, "x": 0, "y": 16}
          }
        ]
      }
    }