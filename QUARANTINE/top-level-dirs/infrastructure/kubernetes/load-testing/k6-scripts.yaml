apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-cosmic-tests
  namespace: load-testing
data:
  cosmic-basic.js: |
    import http from 'k6/http';
    import { check, group, sleep } from 'k6';
    import { Rate } from 'k6/metrics';
    
    // Custom metrics
    const errorRate = new Rate('errors');
    const cosmicLatency = new Rate('cosmic_latency_high');
    const neuralSuccess = new Rate('neural_success');
    
    // Test configuration
    export const options = {
      stages: [
        { duration: '2m', target: 100 },   // Ramp up to 100 users
        { duration: '5m', target: 100 },   // Stay at 100 users
        { duration: '2m', target: 200 },   // Ramp up to 200 users
        { duration: '5m', target: 200 },   // Stay at 200 users
        { duration: '2m', target: 0 },     // Ramp down to 0 users
      ],
      thresholds: {
        http_req_duration: ['p(95)<500', 'p(99)<1000'],
        http_req_failed: ['rate<0.1'],
        errors: ['rate<0.1'],
        cosmic_latency_high: ['rate<0.05'],
        neural_success: ['rate>0.95']
      },
    };
    
    // Environment configuration
    const BASE_URL = __ENV.BASE_URL || 'https://api.terrafusion.cosmic';
    const API_TOKEN = __ENV.API_TOKEN || 'test-token';
    
    export function setup() {
      // Setup code - validate environment
      const res = http.get(`${BASE_URL}/health`);
      check(res, {
        'health check passed': (r) => r.status === 200,
      });
      return { baseUrl: BASE_URL, token: API_TOKEN };
    }
    
    export default function(data) {
      const headers = {
        'Authorization': `Bearer ${data.token}`,
        'Content-Type': 'application/json',
        'X-Cosmic-Test': 'k6-load-test',
      };
      
      group('Cosmic API Tests', () => {
        // Test 1: Basic endpoint
        group('Basic Operations', () => {
          const res = http.get(`${data.baseUrl}/api/v1/cosmic/status`, { headers });
          check(res, {
            'status is 200': (r) => r.status === 200,
            'has cosmic data': (r) => r.json('cosmic_level') !== undefined,
          });
          errorRate.add(res.status !== 200);
        });
        
        // Test 2: Neural Network endpoint
        group('Neural Network', () => {
          const payload = JSON.stringify({
            input: Array(100).fill(0).map(() => Math.random()),
            model: 'cosmic-neural-v1',
            temperature: 0.7,
          });
          
          const res = http.post(`${data.baseUrl}/api/v1/neural/compute`, payload, { headers });
          check(res, {
            'neural computation successful': (r) => r.status === 200,
            'has neural output': (r) => r.json('output') !== undefined,
            'latency acceptable': (r) => r.timings.duration < 500,
          });
          
          neuralSuccess.add(res.status === 200);
          cosmicLatency.add(res.timings.duration > 1000);
        });
        
        // Test 3: Quantum Storage
        group('Quantum Storage', () => {
          const quantumData = JSON.stringify({
            dimension: Math.floor(Math.random() * 11) + 1,
            data: btoa(Math.random().toString()),
            entanglement_key: 'test-key-' + __VU + '-' + __ITER,
          });
          
          // Write quantum data
          const writeRes = http.post(`${data.baseUrl}/api/v1/quantum/store`, quantumData, { headers });
          check(writeRes, {
            'quantum write successful': (r) => r.status === 201,
            'has quantum id': (r) => r.json('quantum_id') !== undefined,
          });
          
          if (writeRes.status === 201) {
            const quantumId = writeRes.json('quantum_id');
            
            // Read quantum data
            const readRes = http.get(`${data.baseUrl}/api/v1/quantum/retrieve/${quantumId}`, { headers });
            check(readRes, {
              'quantum read successful': (r) => r.status === 200,
              'data integrity maintained': (r) => r.json('data') === JSON.parse(quantumData).data,
            });
          }
        });
        
        // Test 4: Consciousness Stream
        group('Consciousness Service', () => {
          const consciousnessReq = JSON.stringify({
            query: 'What is the meaning of the cosmic platform?',
            context_level: 'omniscient',
            neural_depth: 5,
          });
          
          const res = http.post(`${data.baseUrl}/api/v1/consciousness/query`, consciousnessReq, { 
            headers,
            timeout: '30s',
          });
          
          check(res, {
            'consciousness response received': (r) => r.status === 200,
            'has cosmic insight': (r) => r.json('insight') !== undefined,
            'consciousness level appropriate': (r) => r.json('consciousness_level') >= 4,
          });
        });
      });
      
      sleep(1);
    }
    
    export function teardown(data) {
      // Cleanup code
      console.log('Test completed, cleaning up...');
    }
  
  cosmic-stress.js: |
    import http from 'k6/http';
    import { check, group } from 'k6';
    import { Rate, Trend } from 'k6/metrics';
    import ws from 'k6/ws';
    import { randomString } from 'https://jslib.k6.io/k6-utils/1.2.0/index.js';
    
    // Custom metrics for cosmic platform
    const quantumErrors = new Rate('quantum_errors');
    const neuralLatency = new Trend('neural_processing_time');
    const cosmicThroughput = new Rate('cosmic_throughput');
    const websocketSuccess = new Rate('websocket_connections');
    
    export const options = {
      scenarios: {
        cosmic_spike: {
          executor: 'ramping-arrival-rate',
          startRate: 50,
          timeUnit: '1s',
          preAllocatedVUs: 500,
          maxVUs: 2000,
          stages: [
            { duration: '30s', target: 100 },    // Warm up
            { duration: '1m', target: 500 },     // Ramp to spike
            { duration: '30s', target: 1000 },   // Spike!
            { duration: '1m', target: 500 },     // Scale down
            { duration: '30s', target: 100 },    // Cool down
          ],
        },
        neural_sustained: {
          executor: 'constant-arrival-rate',
          rate: 200,
          timeUnit: '1s',
          duration: '5m',
          preAllocatedVUs: 300,
          maxVUs: 500,
        },
        quantum_burst: {
          executor: 'shared-iterations',
          vus: 1000,
          iterations: 10000,
          maxDuration: '5m',
        },
      },
      thresholds: {
        http_req_duration: ['p(95)<1000', 'p(99)<2000'],
        http_req_failed: ['rate<0.05'],
        quantum_errors: ['rate<0.02'],
        neural_processing_time: ['p(95)<500', 'p(99)<1000'],
        cosmic_throughput: ['rate>0.95'],
        websocket_connections: ['rate>0.98'],
      },
    };
    
    const BASE_URL = __ENV.BASE_URL || 'https://api.terrafusion.cosmic';
    const WS_URL = __ENV.WS_URL || 'wss://api.terrafusion.cosmic';
    
    export default function() {
      const scenario = __ENV.scenario || 'mixed';
      
      switch(scenario) {
        case 'neural':
          testNeuralNetwork();
          break;
        case 'quantum':
          testQuantumStorage();
          break;
        case 'websocket':
          testWebSocketConnections();
          break;
        default:
          // Run all tests
          testNeuralNetwork();
          testQuantumStorage();
          testWebSocketConnections();
      }
    }
    
    function testNeuralNetwork() {
      group('Neural Network Stress Test', () => {
        const startTime = new Date();
        
        // Generate complex neural input
        const neuralInput = {
          vectors: Array(1000).fill(0).map(() => Math.random()),
          matrix: Array(100).fill(0).map(() => 
            Array(100).fill(0).map(() => Math.random())
          ),
          model: 'cosmic-neural-heavy',
          batch_size: 32,
          iterations: 10,
        };
        
        const res = http.post(
          `${BASE_URL}/api/v1/neural/process`,
          JSON.stringify(neuralInput),
          {
            headers: {
              'Content-Type': 'application/json',
              'X-Neural-Priority': 'high',
            },
            timeout: '60s',
          }
        );
        
        const processingTime = new Date() - startTime;
        neuralLatency.add(processingTime);
        
        const success = check(res, {
          'neural processing complete': (r) => r.status === 200,
          'processing time acceptable': (r) => processingTime < 5000,
          'neural accuracy maintained': (r) => r.json('accuracy') > 0.95,
        });
        
        cosmicThroughput.add(success);
      });
    }
    
    function testQuantumStorage() {
      group('Quantum Storage Stress Test', () => {
        // Test multi-dimensional storage
        for (let dimension = 1; dimension <= 11; dimension++) {
          const quantumPayload = {
            dimension: dimension,
            data: randomString(1024 * dimension), // Larger data for higher dimensions
            entanglement_pairs: Array(dimension).fill(0).map(() => ({
              id: randomString(16),
              coherence: Math.random(),
            })),
            quantum_state: 'superposition',
          };
          
          const res = http.post(
            `${BASE_URL}/api/v1/quantum/multidimensional`,
            JSON.stringify(quantumPayload),
            {
              headers: {
                'Content-Type': 'application/json',
                'X-Quantum-Dimension': dimension.toString(),
              },
            }
          );
          
          const hasError = res.status !== 201;
          quantumErrors.add(hasError);
          
          check(res, {
            [`dimension ${dimension} storage successful`]: (r) => r.status === 201,
            'quantum coherence maintained': (r) => r.json('coherence_score') > 0.9,
          });
        }
      });
    }
    
    function testWebSocketConnections() {
      group('WebSocket Consciousness Stream', () => {
        const url = `${WS_URL}/consciousness/stream`;
        
        const response = ws.connect(url, {}, function(socket) {
          socket.on('open', () => {
            websocketSuccess.add(true);
            
            // Send consciousness queries
            socket.send(JSON.stringify({
              type: 'consciousness_query',
              query: 'Stream cosmic consciousness',
              depth: 10,
              neural_connections: 1000,
            }));
            
            // Simulate real-time interaction
            socket.setInterval(() => {
              socket.send(JSON.stringify({
                type: 'neural_pulse',
                timestamp: Date.now(),
                intensity: Math.random(),
              }));
            }, 100);
          });
          
          socket.on('message', (data) => {
            try {
              const msg = JSON.parse(data);
              check(msg, {
                'consciousness data received': (m) => m.type === 'consciousness_update',
                'neural activity present': (m) => m.neural_activity !== undefined,
              });
            } catch (e) {
              console.error('WebSocket message error:', e);
            }
          });
          
          socket.on('error', (e) => {
            websocketSuccess.add(false);
            console.error('WebSocket error:', e);
          });
          
          // Keep connection open for stress test
          socket.setTimeout(() => {
            socket.close();
          }, 30000);
        });
        
        check(response, {
          'websocket connected': (r) => r && r.status === 101,
        });
      });
    }
  
  cosmic-chaos.js: |
    import http from 'k6/http';
    import { check } from 'k6';
    import { Rate } from 'k6/metrics';
    import exec from 'k6/execution';
    
    // Chaos engineering metrics
    const resilienceScore = new Rate('resilience_score');
    const recoveryTime = new Rate('recovery_time_acceptable');
    const dataIntegrity = new Rate('data_integrity_maintained');
    
    export const options = {
      scenarios: {
        // Simulate service failures
        service_killer: {
          executor: 'per-vu-iterations',
          vus: 10,
          iterations: 20,
          exec: 'chaosServiceKiller',
        },
        // Simulate network partitions
        network_partition: {
          executor: 'constant-vus',
          vus: 50,
          duration: '5m',
          exec: 'chaosNetworkPartition',
        },
        // Simulate resource exhaustion
        resource_exhaustion: {
          executor: 'ramping-vus',
          startVUs: 100,
          stages: [
            { duration: '2m', target: 1000 },
            { duration: '3m', target: 1000 },
            { duration: '2m', target: 100 },
          ],
          exec: 'chaosResourceExhaustion',
        },
      },
    };
    
    const BASE_URL = __ENV.BASE_URL || 'https://api.terrafusion.cosmic';
    
    export function chaosServiceKiller() {
      // Randomly kill services and test recovery
      const services = [
        'cosmic-orchestrator',
        'consciousness-service',
        'holographic-storage',
        'neural-network',
      ];
      
      const targetService = services[Math.floor(Math.random() * services.length)];
      
      // Simulate service failure by overwhelming it
      const promises = [];
      for (let i = 0; i < 1000; i++) {
        promises.push(
          http.post(`${BASE_URL}/api/v1/${targetService}/chaos`, 
            JSON.stringify({ operation: 'cpu_spike', duration: 10 }),
            { timeout: '1s' }
          )
        );
      }
      
      // Wait and then test recovery
      sleep(5);
      
      const recoveryStart = new Date();
      let recovered = false;
      
      for (let attempt = 0; attempt < 30; attempt++) {
        const healthRes = http.get(`${BASE_URL}/api/v1/${targetService}/health`);
        if (healthRes.status === 200) {
          recovered = true;
          break;
        }
        sleep(1);
      }
      
      const recoveryDuration = new Date() - recoveryStart;
      resilienceScore.add(recovered);
      recoveryTime.add(recoveryDuration < 30000); // Recovery within 30 seconds
    }
    
    export function chaosNetworkPartition() {
      // Simulate split-brain scenarios
      const headers = {
        'X-Chaos-Simulation': 'network-partition',
        'X-Partition-Group': exec.vu.idInTest % 2 === 0 ? 'A' : 'B',
      };
      
      // Write to one partition
      const writeRes = http.post(
        `${BASE_URL}/api/v1/quantum/partition-write`,
        JSON.stringify({
          key: `chaos-key-${exec.vu.idInTest}-${exec.scenario.iterationInInstance}`,
          value: `partition-${headers['X-Partition-Group']}`,
          timestamp: Date.now(),
        }),
        { headers }
      );
      
      check(writeRes, {
        'partition write accepted': (r) => r.status === 202 || r.status === 201,
      });
      
      // Try to read from opposite partition
      headers['X-Partition-Group'] = headers['X-Partition-Group'] === 'A' ? 'B' : 'A';
      
      const readRes = http.get(
        `${BASE_URL}/api/v1/quantum/partition-read/${writeRes.json('key')}`,
        { headers }
      );
      
      // Check eventual consistency
      let consistent = false;
      if (readRes.status !== 200) {
        // Wait for convergence
        sleep(5);
        const retryRes = http.get(
          `${BASE_URL}/api/v1/quantum/partition-read/${writeRes.json('key')}`,
          { headers }
        );
        consistent = retryRes.status === 200 && 
                    retryRes.json('value') === `partition-${headers['X-Partition-Group'] === 'A' ? 'B' : 'A'}`;
      }
      
      dataIntegrity.add(consistent);
    }
    
    export function chaosResourceExhaustion() {
      // Generate massive payloads to exhaust resources
      const megaPayload = {
        neural_data: Array(1000).fill(0).map(() => ({
          neurons: Array(1000).fill(0).map(() => Math.random()),
          connections: Array(1000).fill(0).map(() => ({
            from: Math.floor(Math.random() * 1000),
            to: Math.floor(Math.random() * 1000),
            weight: Math.random(),
          })),
        })),
        quantum_states: Array(100).fill(0).map(() => ({
          dimension: Math.floor(Math.random() * 11) + 1,
          state_vector: Array(1000).fill(0).map(() => ({
            real: Math.random(),
            imaginary: Math.random(),
          })),
        })),
      };
      
      const res = http.post(
        `${BASE_URL}/api/v1/cosmic/process-mega`,
        JSON.stringify(megaPayload),
        {
          headers: { 'Content-Type': 'application/json' },
          timeout: '30s',
        }
      );
      
      // System should gracefully handle or reject
      const handled = check(res, {
        'resource exhaustion handled': (r) => 
          r.status === 413 || // Payload too large
          r.status === 503 || // Service unavailable
          r.status === 429 || // Rate limited
          r.status === 200,   // Actually processed (impressive!)
      });
      
      resilienceScore.add(handled);
    }