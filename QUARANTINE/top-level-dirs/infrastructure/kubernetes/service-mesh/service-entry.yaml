apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-ai-services
  namespace: terrafusion-cosmic
spec:
  hosts:
  - api.openai.com
  - api.anthropic.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-monitoring
  namespace: terrafusion-cosmic
spec:
  hosts:
  - prometheus.io
  - grafana.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-cloud-services
  namespace: terrafusion-cosmic
spec:
  hosts:
  - "*.amazonaws.com"
  - "*.googleapis.com"
  - "*.azurewebsites.net"
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: mars-datacenter
  namespace: terrafusion-cosmic
spec:
  hosts:
  - mars.terrafusion.cosmic
  ports:
  - number: 8443
    name: https-quantum
    protocol: HTTPS
  - number: 7000
    name: quantum-sync
    protocol: TCP
  location: MESH_EXTERNAL
  resolution: STATIC
  endpoints:
  - address: 10.100.0.1  # Mars datacenter IP
    labels:
      region: mars
      zone: olympus-mons
    weight: 100
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: external-ai-services-dr
  namespace: terrafusion-cosmic
spec:
  host: "*.openai.com"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 10
        connectTimeout: 30s
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 20
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 60s
    tls:
      mode: SIMPLE
      sni: api.openai.com
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mars-datacenter-dr
  namespace: terrafusion-cosmic
spec:
  host: mars.terrafusion.cosmic
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 5
        connectTimeout: 60s
      http:
        http1MaxPendingRequests: 5
        http2MaxRequests: 10
    tls:
      mode: MUTUAL
      clientCertificate: /etc/certs/mars-client-cert.pem
      privateKey: /etc/certs/mars-client-key.pem
      caCertificates: /etc/certs/mars-ca-cert.pem
      sni: mars.terrafusion.cosmic