apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: cosmic-orchestrator-dr
  namespace: terrafusion-cosmic
spec:
  host: cosmic-orchestrator
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      consistentHash:
        httpHeaderName: "x-cosmic-session"
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
      splitExternalLocalOriginErrors: true
  subsets:
  - name: v1
    labels:
      version: v1
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 50
  - name: v2
    labels:
      version: v2
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: consciousness-service-dr
  namespace: terrafusion-cosmic
spec:
  host: consciousness-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 30s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 1
        h2UpgradePolicy: UPGRADE
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 60s
      maxEjectionPercent: 100
      minHealthPercent: 0
  subsets:
  - name: gpu-enabled
    labels:
      gpu: "true"
    trafficPolicy:
      connectionPool:
        tcp:
          maxConnections: 20
  - name: cpu-only
    labels:
      gpu: "false"
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: holographic-storage-dr
  namespace: terrafusion-cosmic
spec:
  host: holographic-storage
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 10s
      http:
        http1MaxPendingRequests: 200
        http2MaxRequests: 500
        maxRequestsPerConnection: 5
    loadBalancer:
      consistentHash:
        httpCookie:
          name: "quantum-session"
          ttl: 3600s
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 20s
      baseEjectionTime: 180s
      maxEjectionPercent: 50
      minHealthPercent: 50
    tls:
      mode: ISTIO_MUTUAL
  subsets:
  - name: primary
    labels:
      zone: primary
  - name: secondary
    labels:
      zone: secondary
  - name: tertiary
    labels:
      zone: tertiary