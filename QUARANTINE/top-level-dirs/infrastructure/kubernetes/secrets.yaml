apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-secrets
  namespace: terrafusion
type: Opaque
stringData:
  DATABASE_URL: "postgres://terrafusion:changeme@postgres-service:5432/terrafusion"
  REDIS_URL: "redis://default:changeme@redis-service:6379"
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  POSTGRES_PASSWORD: "changeme"
  REDIS_PASSWORD: "changeme"