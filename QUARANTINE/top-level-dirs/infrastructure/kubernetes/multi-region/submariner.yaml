# Submariner for cross-cluster networking
apiVersion: v1
kind: Namespace
metadata:
  name: submariner-operator
---
# Submariner installation typically via operator:
# kubectl apply -f https://get.submariner.io/submariner-operator.yaml
---
# Broker configuration (deploy in one cluster)
apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: cosmic-broker
  namespace: submariner-operator
spec:
  namespace: submariner-broker
  components:
    - service-discovery
    - connectivity
    - globalnet
  defaultGlobalnetClusterSize: 65536
  globalnetCIDR: "240.0.0.0/4"
---
# SubmarinerCluster for each region
apiVersion: submariner.io/v1alpha1
kind: SubmarinerCluster
metadata:
  name: us-east-1
  namespace: submariner-operator
spec:
  cluster_id: us-east-1
  color_codes:
    - blue
  repository: quay.io/submariner
  version: 0.14.0
  ce_ipsec_natt_port: 4500
  ce_ipsec_ikeport: 500
  broker_k8s_apiserver: https://broker.terrafusion.cosmic:6443
  broker_k8s_ca: ${BROKER_CA}
  broker_k8s_token: ${BROKER_TOKEN}
  broker_k8s_namespace: submariner-broker
  cable_driver: libreswan
  cluster_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"
  global_cidr: "240.0.0.0/16"
  service_discovery: true
  connectivity_health_check:
    enabled: true
    interval_seconds: 60
    max_packet_loss_count: 5
---
# ServiceExport for cross-cluster services
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: consciousness-service
  namespace: terrafusion-cosmic
---
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceExport
metadata:
  name: holographic-storage
  namespace: terrafusion-cosmic
---
# ServiceImport for consuming cross-cluster services
apiVersion: multicluster.x-k8s.io/v1alpha1
kind: ServiceImport
metadata:
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic
spec:
  type: ClusterSetIP
  ports:
  - port: 8080
    protocol: TCP
---
# GlobalIngressIP for multi-cluster ingress
apiVersion: submariner.io/v1
kind: GlobalIngressIP
metadata:
  name: cosmic-gateway
  namespace: kong
spec:
  target: Service
  serviceRef:
    name: kong-proxy
  allocate: true
---
# ClusterGlobalEgressIP for egress traffic
apiVersion: submariner.io/v1
kind: ClusterGlobalEgressIP
metadata:
  name: cosmic-egress
  namespace: submariner-operator
spec:
  numberOfIPs: 3
---
# Network policies for cross-cluster communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cross-cluster
  namespace: terrafusion-cosmic
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          submariner.io/namespace: "true"
    - podSelector:
        matchLabels:
          submariner.io/gateway: "true"
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          submariner.io/namespace: "true"
  - to:
    - podSelector:
        matchLabels:
          submariner.io/gateway: "true"
---
# Quantum network tunnel configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantum-tunnel-config
  namespace: submariner-operator
data:
  