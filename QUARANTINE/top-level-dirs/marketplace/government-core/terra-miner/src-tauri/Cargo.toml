[package]
name = "terra-miner"
version = "1.8.0"
description = "TerraMiner - Advanced Data Mining & Analytics Platform"
authors = ["TerraFusion Team"]
license = "MIT"
repository = "https://github.com/terrafusion/terra-miner"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["window-show", "window-close", "window-unminimize", "window-start-dragging", "window-unmaximize", "window-maximize", "window-hide", "shell-open", "window-minimize"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { version = "1.32", features = ["serde-float"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
rayon = "1.8"
ndarray = "0.15"
nalgebra = "0.32"
statrs = "0.16"
rand = "0.8"
candle-core = "0.3"
candle-nn = "0.3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

