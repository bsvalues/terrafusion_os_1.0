{{- if .Values.pluginAdmission.webhook.enabled }}
# TerraFusion Plugin Admission ValidatingWebhookConfiguration
# Enforces constitutional requirements for all plugin deployments:
#   - SBOM SHA-256 present
#   - SLSA provenance present
#   - Bundle signature valid
#   - Plugin metadata well-formed

apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "terrafusion.fullname" . }}-plugin-admission
  labels:
    {{- include "terrafusion.labels" . | nindent 4 }}
    app.kubernetes.io/component: admission-webhook
  annotations:
    {{- if .Values.pluginAdmission.webhook.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "terrafusion.fullname" . }}-admission-cert
    {{- end }}
webhooks:
  - name: plugins.admission.terrafusion.gov
    # Constitutional: Deny beats Allow - fail closed
    failurePolicy: {{ .Values.pluginAdmission.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
    admissionReviewVersions: ["v1", "v1beta1"]
    timeoutSeconds: {{ .Values.pluginAdmission.webhook.timeoutSeconds | default 10 }}

    clientConfig:
      {{- if .Values.pluginAdmission.webhook.certManager.enabled }}
      # cert-manager will inject the CA bundle
      service:
        name: {{ include "terrafusion.fullname" . }}-admission
        namespace: {{ .Release.Namespace }}
        path: /validate-plugin
        port: 443
      {{- else }}
      # Manual CA bundle (for non-cert-manager setups)
      caBundle: {{ .Values.pluginAdmission.webhook.caBundle | b64enc }}
      service:
        name: {{ include "terrafusion.fullname" . }}-admission
        namespace: {{ .Release.Namespace }}
        path: /validate-plugin
        port: 443
      {{- end }}

    # Only intercept plugin deployments in terrafusion namespaces
    namespaceSelector:
      matchLabels:
        terrafusion.gov/plugin-admission: "enabled"

    # Rules: CREATE/UPDATE of Deployments with plugin labels
    rules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
        scope: "Namespaced"

    # Object selector: only plugins (has tf-plugin label)
    objectSelector:
      matchLabels:
        terrafusion.gov/component: plugin

  # Secondary webhook for ConfigMaps (plugin manifests)
  - name: plugin-manifests.admission.terrafusion.gov
    failurePolicy: {{ .Values.pluginAdmission.webhook.failurePolicy | default "Fail" }}
    sideEffects: None
    admissionReviewVersions: ["v1"]
    timeoutSeconds: 5

    clientConfig:
      {{- if .Values.pluginAdmission.webhook.certManager.enabled }}
      service:
        name: {{ include "terrafusion.fullname" . }}-admission
        namespace: {{ .Release.Namespace }}
        path: /validate-plugin-manifest
        port: 443
      {{- else }}
      caBundle: {{ .Values.pluginAdmission.webhook.caBundle | b64enc }}
      service:
        name: {{ include "terrafusion.fullname" . }}-admission
        namespace: {{ .Release.Namespace }}
        path: /validate-plugin-manifest
        port: 443
      {{- end }}

    namespaceSelector:
      matchLabels:
        terrafusion.gov/plugin-admission: "enabled"

    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["configmaps"]
        scope: "Namespaced"

    objectSelector:
      matchLabels:
        terrafusion.gov/type: plugin-manifest
{{- end }}
