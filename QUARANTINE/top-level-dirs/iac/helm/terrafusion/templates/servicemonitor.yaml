{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "terrafusion.fullname" . }}
  labels:
    {{- include "terrafusion.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "terrafusion.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.path }}
      interval: 15s
{{- end }}
