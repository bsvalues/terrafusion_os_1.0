# GitHub Projects Board Configuration
# Phase 4.9: Readiness Convergence

name: "Phase 4.9 - Readiness Convergence"
description: "Bridge from working platform to operationally immortal system"

# Project fields
fields:
  - name: Status
    type: single_select
    options:
      - name: "Not Started"
        color: gray
      - name: "In Progress"
        color: yellow
      - name: "Blocked"
        color: red
      - name: "In Review"
        color: blue
      - name: "Complete"
        color: green

  - name: Priority
    type: single_select
    options:
      - name: "Critical"
        color: red
      - name: "High"
        color: orange
      - name: "Medium"
        color: yellow
      - name: "Low"
        color: green

  - name: Phase
    type: single_select
    options:
      - name: "Week 1: Architecture & Resilience"
      - name: "Week 2: Infrastructure & Governance"
      - name: "Week 3: Production & Operations"
      - name: "Ongoing"

  - name: Owner
    type: text
    
  - name: Due Date
    type: date
    
  - name: Exit Criteria
    type: checkbox

# Views
views:
  - name: "By Week"
    layout: board
    group_by: Phase
    sort_by: Priority
    
  - name: "By Owner"
    layout: table
    group_by: Owner
    
  - name: "Exit Criteria Tracking"
    layout: table
    filter: Exit Criteria = true
    
  - name: "Blocked Items"
    layout: table
    filter: Status = "Blocked"

