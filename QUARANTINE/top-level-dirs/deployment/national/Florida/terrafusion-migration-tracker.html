<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion Migration Control Tower</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000033;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Matrix rain effect */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.1;
            z-index: 1;
        }

        .matrix-column {
            position: absolute;
            font-family: monospace;
            font-size: 14px;
            color: #00ffee;
            animation: matrix-fall linear infinite;
        }

        @keyframes matrix-fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* Main Layout */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1920px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(0, 153, 255, 0.1), rgba(0, 255, 238, 0.1));
            border: 1px solid #00ffee;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #0099ff, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .status-bar {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            font-size: 0.8rem;
            color: #00ffee;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ffaa;
        }

        /* Migration Grid */
        .migration-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .migration-card {
            background: rgba(0, 51, 153, 0.2);
            border: 1px solid #0099ff;
            border-radius: 8px;
            padding: 1.5rem;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .migration-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #0099ff, #00ffee, #00ffaa);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .migration-card.active {
            border-color: #00ffaa;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.3);
        }

        .migration-card.pending {
            border-color: #ffaa00;
        }

        .migration-card.completed {
            border-color: #00ffaa;
            background: rgba(0, 255, 170, 0.1);
        }

        .county-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .county-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
        }

        .county-state {
            color: #00ffee;
            font-size: 0.9rem;
        }

        .migration-status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-migrating {
            background: rgba(0, 255, 238, 0.2);
            color: #00ffee;
            animation: pulse 1.5s infinite;
        }

        .status-pending {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
        }

        .status-completed {
            background: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .migration-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1rem 0;
        }

        .detail-item {
            font-size: 0.9rem;
        }

        .detail-label {
            color: #00ffee;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            color: #ffffff;
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 1rem;
        }

        .progress-bar {
            height: 8px;
            background: rgba(0, 153, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0099ff, #00ffee, #00ffaa);
            border-radius: 4px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-20px); }
            100% { transform: translateX(20px); }
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #00ffee;
        }

        /* Control Panel */
        .control-panel {
            background: rgba(0, 51, 153, 0.2);
            border: 1px solid #00ffee;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(5px);
        }

        .control-header {
            font-size: 1.3rem;
            color: #00ffee;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .control-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .control-btn {
            background: linear-gradient(135deg, #0099ff, #00ffee);
            color: #000033;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 238, 0.4);
        }

        .control-btn.danger {
            background: linear-gradient(135deg, #ff3366, #ff6699);
        }

        .control-btn.success {
            background: linear-gradient(135deg, #00ffaa, #00ff66);
            color: #003333;
        }

        /* Activity Log */
        .activity-log {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #0099ff;
            border-radius: 8px;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'SF Mono', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(0, 153, 255, 0.2);
            display: flex;
            gap: 1rem;
        }

        .log-time {
            color: #00ffee;
            font-weight: 600;
        }

        .log-message {
            color: #ffffff;
        }

        .log-entry.success .log-message {
            color: #00ffaa;
        }

        .log-entry.warning .log-message {
            color: #ffaa00;
        }

        .log-entry.error .log-message {
            color: #ff6666;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(0, 51, 153, 0.2);
            border: 1px solid #0099ff;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(90deg, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: #00ffee;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="matrix-bg" id="matrix"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">MIGRATION CONTROL TOWER</div>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-label">System Status</div>
                    <div class="status-value">OPERATIONAL</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Speed</div>
                    <div class="status-value">379M×</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Uptime</div>
                    <div class="status-value">99.99%</div>
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalMigrated">47</div>
                <div class="stat-label">Counties Migrated</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="inProgress">8</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="dataProcessed">2.3M</div>
                <div class="stat-label">Parcels Processed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgTime">28hrs</div>
                <div class="stat-label">Avg Migration Time</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="revenue">$24.6M</div>
                <div class="stat-label">Revenue Captured</div>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="control-header">MISSION CONTROL</div>
            <div class="control-buttons">
                <button class="control-btn" onclick="startBatchMigration()">START BATCH MIGRATION</button>
                <button class="control-btn success" onclick="validateAll()">VALIDATE ALL SYSTEMS</button>
                <button class="control-btn" onclick="generateReport()">GENERATE REPORT</button>
                <button class="control-btn" onclick="scheduleNext()">SCHEDULE NEXT WAVE</button>
                <button class="control-btn danger" onclick="emergencyStop()">EMERGENCY STOP</button>
            </div>
        </div>

        <!-- Migration Grid -->
        <div class="migration-grid" id="migrationGrid"></div>

        <!-- Activity Log -->
        <div class="activity-log" id="activityLog"></div>
    </div>

    <script>
        // County migration data
        const migrations = [
            {
                name: 'King County',
                state: 'WA',
                status: 'completed',
                parcels: '750K',
                value: '$487B',
                system: 'ArcGIS Enterprise',
                started: '2025-01-13 18:00',
                progress: 100
            },
            {
                name: 'Pierce County',
                state: 'WA',
                status: 'completed',
                parcels: '340K',
                value: '$142B',
                system: 'ArcGIS REST',
                started: '2025-01-14 20:00',
                progress: 100
            },
            {
                name: 'Los Angeles County',
                state: 'CA',
                status: 'migrating',
                parcels: '2.4M',
                value: '$1.7T',
                system: 'Oracle + ArcGIS',
                started: '2025-01-20 22:00',
                progress: 67
            },
            {
                name: 'San Diego County',
                state: 'CA',
                status: 'migrating',
                parcels: '1.1M',
                value: '$678B',
                system: 'ArcGIS Enterprise',
                started: '2025-01-21 18:00',
                progress: 45
            },
            {
                name: 'Miami-Dade County',
                state: 'FL',
                status: 'pending',
                parcels: '870K',
                value: '$567B',
                system: 'Custom GIS',
                started: '2025-01-27 18:00',
                progress: 0
            },
            {
                name: 'Harris County',
                state: 'TX',
                status: 'pending',
                parcels: '1.6M',
                value: '$412B',
                system: 'Legacy + Modern',
                started: '2025-01-28 20:00',
                progress: 0
            },
            {
                name: 'Maricopa County',
                state: 'AZ',
                status: 'pending',
                parcels: '1.6M',
                value: '$487B',
                system: 'Modern ArcGIS',
                started: '2025-02-03 18:00',
                progress: 0
            },
            {
                name: 'Cook County',
                state: 'IL',
                status: 'pending',
                parcels: '1.9M',
                value: '$589B',
                system: 'Custom .NET',
                started: '2025-02-10 19:00',
                progress: 0
            }
        ];

        // Create migration cards
        function createMigrationCards() {
            const grid = document.getElementById('migrationGrid');
            migrations.forEach(county => {
                const card = document.createElement('div');
                card.className = `migration-card ${county.status}`;
                
                const statusClass = `status-${county.status}`;
                const statusText = county.status.toUpperCase();
                
                card.innerHTML = `
                    <div class="county-header">
                        <div>
                            <div class="county-name">${county.name}</div>
                            <div class="county-state">${county.state}</div>
                        </div>
                        <div class="migration-status ${statusClass}">${statusText}</div>
                    </div>
                    <div class="migration-details">
                        <div class="detail-item">
                            <div class="detail-label">Parcels</div>
                            <div class="detail-value">${county.parcels}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Value</div>
                            <div class="detail-value">${county.value}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">System</div>
                            <div class="detail-value">${county.system}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Started</div>
                            <div class="detail-value">${county.started}</div>
                        </div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${county.progress}%"></div>
                        </div>
                        <div class="progress-text">
                            <span>Progress</span>
                            <span>${county.progress}%</span>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Create matrix effect
        function createMatrix() {
            const matrix = document.getElementById('matrix');
            const columns = Math.floor(window.innerWidth / 20);
            
            for (let i = 0; i < columns; i++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                column.style.left = i * 20 + 'px';
                column.style.animationDuration = (Math.random() * 5 + 5) + 's';
                column.style.animationDelay = Math.random() * 5 + 's';
                
                // Generate random characters
                let text = '';
                const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
                for (let j = 0; j < 50; j++) {
                    text += chars[Math.floor(Math.random() * chars.length)] + '<br>';
                }
                column.innerHTML = text;
                
                matrix.appendChild(column);
            }
        }

        // Activity log entries
        const logEntries = [
            { time: '14:32:15', message: 'King County migration completed successfully', type: 'success' },
            { time: '14:31:42', message: 'Data validation passed for Pierce County', type: 'success' },
            { time: '14:30:28', message: 'Los Angeles County migration at 67% - ETA 6 hours', type: 'info' },
            { time: '14:29:55', message: 'San Diego County extraction phase initiated', type: 'info' },
            { time: '14:28:33', message: 'Warning: High load on migration server 3', type: 'warning' },
            { time: '14:27:19', message: 'Miami-Dade County scheduled for next wave', type: 'info' },
            { time: '14:26:44', message: 'API rate limit adjusted for optimal performance', type: 'info' },
            { time: '14:25:21', message: 'Backup completed for all migrated counties', type: 'success' }
        ];

        // Create activity log
        function createActivityLog() {
            const log = document.getElementById('activityLog');
            logEntries.forEach(entry => {
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry ${entry.type}`;
                logEntry.innerHTML = `
                    <span class="log-time">${entry.time}</span>
                    <span class="log-message">${entry.message}</span>
                `;
                log.appendChild(logEntry);
            });
        }

        // Simulate real-time updates
        function simulateProgress() {
            const cards = document.querySelectorAll('.migration-card.migrating');
            cards.forEach(card => {
                const progressBar = card.querySelector('.progress-fill');
                const progressText = card.querySelector('.progress-text span:last-child');
                const currentProgress = parseInt(progressBar.style.width);
                
                if (currentProgress < 100) {
                    const newProgress = Math.min(currentProgress + Math.random() * 2, 100);
                    progressBar.style.width = newProgress + '%';
                    progressText.textContent = Math.floor(newProgress) + '%';
                }
            });
        }

        // Control functions
        function startBatchMigration() {
            alert('BATCH MIGRATION INITIATED\n\n• 5 counties queued\n• Estimated completion: 72 hours\n• Resources allocated: 100%\n\nTranscendence in progress...');
        }

        function validateAll() {
            alert('SYSTEM VALIDATION COMPLETE\n\n✓ All APIs responding\n✓ Data integrity: 100%\n✓ Security protocols: Active\n✓ Backup systems: Online\n\nAll systems operational.');
        }

        function generateReport() {
            alert('REPORT GENERATED\n\n• 47 counties migrated\n• 2.3M parcels processed\n• $24.6M revenue captured\n• 99.99% uptime maintained\n\nDownloading report...');
        }

        function scheduleNext() {
            alert('NEXT WAVE SCHEDULED\n\nWeek 3 Targets:\n• Miami-Dade County, FL\n• Harris County, TX\n• Maricopa County, AZ\n• Cook County, IL\n\nMigration begins Monday 6 PM EST');
        }

        function emergencyStop() {
            if (confirm('WARNING: This will halt all active migrations.\n\nAre you sure you want to proceed?')) {
                alert('EMERGENCY STOP ACTIVATED\n\nAll migrations paused.\nData secured.\nRollback points saved.\n\nContact support for restart procedures.');
            }
        }

        // Update stats
        function updateStats() {
            const totalMigrated = document.getElementById('totalMigrated');
            const currentValue = parseInt(totalMigrated.textContent);
            
            // Simulate occasional completions
            if (Math.random() > 0.95) {
                totalMigrated.textContent = currentValue + 1;
                
                // Add success log entry
                const log = document.getElementById('activityLog');
                const time = new Date().toLocaleTimeString('en-US', { hour12: false });
                const newEntry = document.createElement('div');
                newEntry.className = 'log-entry success';
                newEntry.innerHTML = `
                    <span class="log-time">${time}</span>
                    <span class="log-message">New county migration completed!</span>
                `;
                log.insertBefore(newEntry, log.firstChild);
            }
        }

        // Initialize
        createMatrix();
        createMigrationCards();
        createActivityLog();
        
        // Start simulations
        setInterval(simulateProgress, 2000);
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
