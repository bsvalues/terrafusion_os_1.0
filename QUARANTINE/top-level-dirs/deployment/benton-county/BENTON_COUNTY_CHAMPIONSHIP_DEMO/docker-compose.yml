version: '3.8'

services:
  # 🏆 Championship Demo Application
  benton-county-demo:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: terrafusion-benton-demo
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEMO_MODE=championship
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - terrafusion-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.benton-demo.rule=Host(`demo.terrafusion.local`)"
      - "traefik.http.routers.benton-demo.tls=true"
      - "terrafusion.component=championship-demo"
      - "terrafusion.county=benton"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/demo/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 📊 PostgreSQL Database (for production scaling)
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres
    environment:
      POSTGRES_DB: terrafusion_benton
      POSTGRES_USER: terrafusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-championship2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - terrafusion-network
    restart: unless-stopped
    ports:
      - "5432:5432"
    labels:
      - "terrafusion.component=database"

  # 🔄 Redis Cache
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-championship2025}
    volumes:
      - redis_data:/data
    networks:
      - terrafusion-network
    restart: unless-stopped
    ports:
      - "6379:6379"
    labels:
      - "terrafusion.component=cache"

  # 📈 Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terrafusion-network
    restart: unless-stopped
    ports:
      - "9090:9090"
    labels:
      - "terrafusion.component=monitoring"

  # 📊 Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-championship2025}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - terrafusion-network
    restart: unless-stopped
    ports:
      - "3001:3000"
    labels:
      - "terrafusion.component=dashboard"

  # 🔄 Reverse Proxy (Traefik)
  traefik:
    image: traefik:v2.10
    container_name: terrafusion-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs:ro
    networks:
      - terrafusion-network
    restart: unless-stopped
    labels:
      - "terrafusion.component=proxy"

volumes:
  postgres_data:
    driver: local
    labels:
      - "terrafusion.data=postgres"
  
  redis_data:
    driver: local
    labels:
      - "terrafusion.data=redis"
  
  prometheus_data:
    driver: local
    labels:
      - "terrafusion.data=prometheus"
  
  grafana_data:
    driver: local
    labels:
      - "terrafusion.data=grafana"

networks:
  terrafusion-network:
    driver: bridge
    labels:
      - "terrafusion.network=championship"