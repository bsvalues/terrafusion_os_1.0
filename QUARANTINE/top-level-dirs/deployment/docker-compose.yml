version: '3.8'

services:
  # Core Infrastructure Services
  costforge-ai:
    image: terrafusion/costforge-ai:latest
    environment:
      - TERRAFUSION_SERVICE=costforge-ai
      - AI_MODE=quantum_enhanced
      - GOVERNMENT_COMPLIANCE=FISMA_HIGH
    ports:
      - '5001:5000'
    networks:
      - terrafusion-quantum-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  terra-sync:
    image: terrafusion/terra-sync:latest
    environment:
      - TERRAFUSION_SERVICE=terra-sync
      - COUNTY_INTEGRATION=harris_pacs_v12_4_7
      - SYNC_MODE=real_time
    ports:
      - '5002:5000'
    networks:
      - terrafusion-quantum-net
    depends_on:
      - government-core

  consciousness:
    image: terrafusion/consciousness:latest
    environment:
      - TERRAFUSION_SERVICE=consciousness
      - AI_AGENT_COUNT=1008
      - SWARM_COORDINATION=enabled
      - QUANTUM_PROCESSING=enabled
    ports:
      - '3004:3000'
    networks:
      - terrafusion-quantum-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # Platform Services
  security:
    image: terrafusion/security:latest
    environment:
      - TERRAFUSION_SERVICE=security
      - SECURITY_LEVEL=zero_trust
      - FISMA_MODE=HIGH
    ports:
      - '5003:5000'
    networks:
      - terrafusion-quantum-net

  monitoring:
    image: terrafusion/monitoring:latest
    environment:
      - TERRAFUSION_SERVICE=monitoring
      - QUANTUM_ANALYTICS=enabled
      - AI_INSIGHTS=enabled
    ports:
      - '5004:5000'
      - '3000:3000' # Grafana
      - '9090:9090' # Prometheus
    networks:
      - terrafusion-quantum-net
    volumes:
      - prometheus_data:/prometheus
      - grafana_data:/var/lib/grafana

  # Government Services
  government-core:
    image: terrafusion/government-core:latest
    environment:
      - TERRAFUSION_SERVICE=government-core
      - GOVERNMENT_MODE=transcendent
      - CITIZEN_SERVICES=comprehensive
    ports:
      - '5000:5000'
    networks:
      - terrafusion-quantum-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 20s
      timeout: 10s
      retries: 3

  # AI Systems
  ai-systems:
    image: terrafusion/ai-systems:latest
    environment:
      - TERRAFUSION_SERVICE=ai-systems
      - AI_COORDINATION=swarm_enabled
      - QUANTUM_ENHANCED=true
    ports:
      - '5005:5000'
    networks:
      - terrafusion-quantum-net
    depends_on:
      - consciousness

  # Database Services
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=terrafusion_os
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    networks:
      - terrafusion-quantum-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - terrafusion-quantum-net
    volumes:
      - redis_data:/data

networks:
  terrafusion-quantum-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
