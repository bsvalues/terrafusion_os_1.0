[package]
name = "terra_flow"
version = "1.0.0"
description = "TerraFusion Terra Flow - Native Desktop Application"
authors = ["TerraFusion Championship Team"]
license = "MIT"
repository = "https://github.com/terrafusion/tauri-master-workspace"
default-run = "terra_flow"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["fs-read-file", "fs-write-file", "fs-read-dir", "fs-create-dir", "fs-exists", "path-all", "http-request", "dialog-open", "dialog-save", "dialog-message", "dialog-ask", "dialog-confirm", "notification-all", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize", "system-tray"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# TerraFusion Core - Tesla-grade shared services
terrafusion-core = { path = "../../../shared/rust-services/placeholder" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
