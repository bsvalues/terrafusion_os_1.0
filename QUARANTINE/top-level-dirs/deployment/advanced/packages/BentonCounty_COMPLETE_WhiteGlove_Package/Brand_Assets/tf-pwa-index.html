<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion OS - Government Edition</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/terrafusion.css">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="Enterprise Property Assessment Platform">
    
    <!-- PWA iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash" class="splash-screen">
        <div class="splash-content">
            <div class="logo-container">
                <svg width="120" height="120" viewBox="0 0 120 120" class="logo">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#0099ff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#00ffaa;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#gradient)" stroke-width="3"/>
                    <text x="60" y="70" font-size="36" font-weight="bold" text-anchor="middle" fill="url(#gradient)">TF</text>
                </svg>
            </div>
            <h1 class="splash-title">TerraFusion OS</h1>
            <p class="splash-subtitle">Government. Transcended.</p>
            <p class="splash-tagline">Turn Complexity into Clarity.</p>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-message" id="loadingMessage">Preparing transcendence…</p>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" class="app-container" style="display: none;">
        <!-- Header Bar -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-small">TF</div>
                <h1 class="app-title">TerraFusion OS</h1>
            </div>
            <div class="header-center">
                <div id="searchBar" class="search-bar">
                    <input type="text" placeholder="Search properties, modules, or commands..." />
                </div>
            </div>
            <div class="header-right">
                <div class="user-info">
                    <span class="user-name" id="userName">Loading...</span>
                    <div class="user-avatar">👤</div>
                </div>
            </div>
        </header>

        <!-- Module Grid -->
        <main class="app-main">
            <div class="module-grid" id="moduleGrid">
                <!-- Modules will be dynamically loaded here -->
            </div>
        </main>

        <!-- Module Container (hidden by default) -->
        <div id="moduleContainer" class="module-container" style="display: none;">
            <div class="module-header">
                <button class="back-button" onclick="closeModule()">← Back</button>
                <h2 id="moduleTitle">Module Name</h2>
            </div>
            <iframe id="moduleFrame" class="module-frame"></iframe>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // TerraFusion Transcendence Brand Protocol
        const BRAND = {
            essence: "Government. Transcended.",
            tagline: "Government. Transcended.",
            slogan: "Turn Complexity into Clarity.",
            motto: "We do it right the first time.",
            loadingMessages: [
                "Preparing transcendence…",
                "Advancing county intelligence…",
                "Orchestrating clarity…"
            ],
            confirmationMessages: [
                "Transcendence complete.",
                "Your path is clear.",
                "All systems: Ready."
            ],
            errorMessages: [
                "Let's clear the path—together.",
                "We anticipate, we adapt, we solve.",
                "Support is standing by your side."
            ],
            emptyStateMessages: [
                "A blank page for transformation.",
                "Begin your next chapter.",
                "The future starts here."
            ]
        };

        // Rotate loading messages
        let messageIndex = 0;
        setInterval(() => {
            const loadingMessage = document.getElementById('loadingMessage');
            if (loadingMessage && document.getElementById('splash').style.display !== 'none') {
                messageIndex = (messageIndex + 1) % BRAND.loadingMessages.length;
                loadingMessage.textContent = BRAND.loadingMessages[messageIndex];
            }
        }, 2000);

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('Service Worker registered:', reg);
            }).catch(err => {
                console.error('Service Worker registration failed:', err);
            });
        }

        // Get API configuration from WebView2 bridge or default
        const API_BASE = window.terrafusion?.api?.baseUrl || 'http://localhost:49152';

        // Initialize app
        async function initApp() {
            try {
                // Load user info
                const userResponse = await fetch(`${API_BASE}/api/user`);
                const user = await userResponse.json();
                document.getElementById('userName').textContent = user.name || 'Guest';

                // Load modules
                const modulesResponse = await fetch(`${API_BASE}/api/modules`);
                const modules = await modulesResponse.json();
                renderModules(modules);

                // Hide splash and show app
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('app').style.display = 'block';
                }, 1500);
            } catch (error) {
                console.error('Failed to initialize app:', error);
                showError('Failed to connect to TerraFusion API');
            }
        }

        // Render module grid
        function renderModules(modules) {
            const grid = document.getElementById('moduleGrid');
            grid.innerHTML = '';

            modules.forEach(module => {
                const tile = document.createElement('div');
                tile.className = `module-tile ${!module.enabled ? 'disabled' : ''}`;
                tile.innerHTML = `
                    <div class="module-icon">${module.icon}</div>
                    <h3 class="module-name">${module.name}</h3>
                    <p class="module-description">${module.description}</p>
                `;
                
                if (module.enabled) {
                    tile.onclick = () => loadModule(module);
                }
                
                grid.appendChild(tile);
            });
        }

        // Load a module
        async function loadModule(module) {
            // Check capabilities
            const capResponse = await fetch(`${API_BASE}/api/capabilities/check`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    module: module.id,
                    capability: 'access'
                })
            });
            
            const capability = await capResponse.json();
            
            if (!capability.allowed) {
                showError('Access denied to ' + module.name);
                return;
            }

            // Special handling for different modules
            switch(module.id) {
                case 'costforge-ai':
                    loadCostForgeModule();
                    break;
                case 'marketplace':
                    loadMarketplaceModule();
                    break;
                case 'devops':
                    loadDevOpsModule();
                    break;
                case 'ide':
                    loadIDEModule();
                    break;
                default:
                    loadGenericModule(module);
            }
        }

        // Load CostForge AI module
        function loadCostForgeModule() {
            const container = document.getElementById('moduleContainer');
            const frame = document.getElementById('moduleFrame');
            
            document.getElementById('moduleTitle').textContent = 'CostForge AI';
            frame.src = '/modules/costforge/index.html';
            
            document.querySelector('.app-main').style.display = 'none';
            container.style.display = 'block';
        }

        // Load Marketplace module
        function loadMarketplaceModule() {
            const container = document.getElementById('moduleContainer');
            const frame = document.getElementById('moduleFrame');
            
            document.getElementById('moduleTitle').textContent = 'TerraFusion Marketplace';
            frame.src = '/modules/marketplace/index.html';
            
            document.querySelector('.app-main').style.display = 'none';
            container.style.display = 'block';
        }

        // Load DevOps module
        function loadDevOpsModule() {
            const container = document.getElementById('moduleContainer');
            const frame = document.getElementById('moduleFrame');
            
            document.getElementById('moduleTitle').textContent = 'DevOps Workspace';
            frame.src = '/modules/devops/index.html';
            
            document.querySelector('.app-main').style.display = 'none';
            container.style.display = 'block';
        }

        // Load IDE module
        function loadIDEModule() {
            const container = document.getElementById('moduleContainer');
            const frame = document.getElementById('moduleFrame');
            
            document.getElementById('moduleTitle').textContent = 'TerraFusion IDE';
            frame.src = '/modules/ide/index.html';
            
            document.querySelector('.app-main').style.display = 'none';
            container.style.display = 'block';
        }

        // Load generic module
        function loadGenericModule(module) {
            const container = document.getElementById('moduleContainer');
            const frame = document.getElementById('moduleFrame');
            
            document.getElementById('moduleTitle').textContent = module.name;
            frame.src = `/modules/${module.id}/index.html`;
            
            document.querySelector('.app-main').style.display = 'none';
            container.style.display = 'block';
        }

        // Close module and return to grid
        function closeModule() {
            document.getElementById('moduleContainer').style.display = 'none';
            document.querySelector('.app-main').style.display = 'block';
            document.getElementById('moduleFrame').src = '';
        }

        // Show error message with Transcendence branding
        function showError(message) {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            
            // Use brand error messages
            const brandMessage = BRAND.errorMessages[Math.floor(Math.random() * BRAND.errorMessages.length)];
            toast.innerHTML = `
                <div class="error-brand">${brandMessage}</div>
                <div class="error-detail">${message}</div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }

        // Show success message with Transcendence branding
        function showSuccess(message) {
            const toast = document.createElement('div');
            toast.className = 'success-toast';
            
            // Use brand confirmation messages
            const brandMessage = BRAND.confirmationMessages[Math.floor(Math.random() * BRAND.confirmationMessages.length)];
            toast.innerHTML = `
                <div class="success-brand">${brandMessage}</div>
                <div class="success-detail">${message}</div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Start the app
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
