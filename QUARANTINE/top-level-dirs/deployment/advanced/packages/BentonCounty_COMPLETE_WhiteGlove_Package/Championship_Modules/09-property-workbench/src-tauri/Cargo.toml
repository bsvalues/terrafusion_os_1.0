[package]
name = "property-workbench"
version = "2.0.0"
description = "PropertyWorkbench - Heavy Property Management Suite with GIS and Sketching"
authors = ["TerraFusion Team"]
license = "MIT"
repository = ""
default-run = "property-workbench"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["dialog-all", "fs-all", "notification-all", "shell-open", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize", "system-tray"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
geo = "0.26"
geojson = "0.24"
wkt = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]