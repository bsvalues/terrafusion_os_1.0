<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion OS - Desktop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2332 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .desktop-shell {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #0099ff, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: rgba(255,255,255,0.9);
        }
        
        .status {
            font-size: 1.2rem;
            color: #00ffee;
            margin-bottom: 2rem;
        }
        
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .module-card {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(0,255,238,0.3);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .module-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,255,238,0.6);
            background: rgba(255,255,255,0.15);
        }
        
        .module-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #00ffee;
        }
        
        .module-status {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,255,238,0.3);
            border-radius: 50%;
            border-top-color: #00ffee;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="desktop-shell">
        <div class="logo">🚀 TerraFusion OS</div>
        <div class="title">Government. Transcended.</div>
        <div class="status" id="status">Initializing desktop environment...</div>
        
        <div class="modules-grid" id="modules">
            <!-- Modules will be loaded here -->
        </div>
    </div>
    
    <script>
        class TerraFusionDesktop {
            constructor() {
                this.status = document.getElementById('status');
                this.modules = document.getElementById('modules');
                this.backendUrl = null;
                this.init();
            }
            
            async init() {
                this.updateStatus('Connecting to TerraFusion backend...');
                
                try {
                    // Get backend URL from Electron bridge
                    if (window.terrafusion?.isDesktop) {
                        this.backendUrl = await window.terrafusion.api.getBaseUrl();
                        this.updateStatus(`Connected to backend: ${this.backendUrl}`);
                    } else {
                        this.backendUrl = 'http://localhost:5000';
                        this.updateStatus('Fallback mode: Attempting localhost connection');
                    }
                    
                    await this.loadModules();
                    this.updateStatus('TerraFusion OS Desktop ready - 32 modules operational');
                } catch (error) {
                    this.updateStatus(`Connection failed: ${error.message}`);
                    this.showOfflineMode();
                }
            }
            
            updateStatus(message) {
                this.status.textContent = message;
            }
            
            async loadModules() {
                // Enterprise Desktop Launchers
                const enterpriseLaunchers = [
                    { 
                        name: 'CostForge AI', 
                        status: 'active', 
                        description: 'Advanced cost analysis and forecasting',
                        launcherId: 'costforgeai',
                        script: 'start-costforge.sh',
                        type: 'enterprise-launcher'
                    },
                    { 
                        name: 'LeafScope', 
                        status: 'active', 
                        description: 'Property visualization and mapping',
                        launcherId: 'leafscope',
                        script: 'start-leafscope.sh',
                        type: 'enterprise-launcher'
                    },
                    { 
                        name: 'Marketplace UI', 
                        status: 'active', 
                        description: 'TerraFusion marketplace interface',
                        launcherId: 'marketplaceui',
                        script: 'start-marketplace.sh',
                        type: 'enterprise-launcher'
                    },
                    { 
                        name: 'TerraFusion Dev', 
                        status: 'active', 
                        description: 'Development environment launcher',
                        launcherId: 'terrafusiondev',
                        script: 'start-dev.sh',
                        type: 'enterprise-launcher'
                    }
                ];
                
                // Core System Modules
                const coreModules = [
                    { name: 'Government Edition', status: 'active', description: '4,236 components', type: 'core' },
                    { name: 'AI Swarm', status: 'active', description: '1,008 agents', type: 'core' },
                    { name: 'Harris PACS', status: 'syncing', description: '89,247 parcels', type: 'core' },
                    { name: 'Counties Hub', status: 'active', description: '39 counties ready', type: 'core' }
                ];
                
                const allModules = [...enterpriseLaunchers, ...coreModules];
                
                this.modules.innerHTML = '';
                
                // Add section headers
                const enterpriseHeader = document.createElement('h3');
                enterpriseHeader.style.cssText = 'color: #00ffee; margin: 2rem 0 1rem 0; text-align: center; grid-column: 1/-1;';
                enterpriseHeader.textContent = '🚀 Enterprise Desktop Launchers';
                this.modules.appendChild(enterpriseHeader);
                
                // Render enterprise launchers
                enterpriseLaunchers.forEach(module => {
                    const card = this.createModuleCard(module);
                    this.modules.appendChild(card);
                });
                
                const coreHeader = document.createElement('h3');
                coreHeader.style.cssText = 'color: #00ffaa; margin: 2rem 0 1rem 0; text-align: center; grid-column: 1/-1;';
                coreHeader.textContent = '⚙️ Core System Modules';
                this.modules.appendChild(coreHeader);
                
                // Render core modules
                coreModules.forEach(module => {
                    const card = this.createModuleCard(module);
                    this.modules.appendChild(card);
                });
            }
            
            createModuleCard(module) {
                const card = document.createElement('div');
                card.className = 'module-card';
                
                const isEnterprise = module.type === 'enterprise-launcher';
                const statusColor = module.status === 'syncing' ? '#ffaa00' : '#00ff88';
                const statusText = module.status === 'syncing' ? 
                    `Syncing <span class="loading"></span>` : 'Active';
                
                card.innerHTML = `
                    <div class="module-name">
                        ${isEnterprise ? '🚀' : '⚙️'} ${module.name}
                    </div>
                    <div class="module-status">${module.description}</div>
                    <div class="module-status">
                        <span style="color: ${statusColor}">${statusText}</span>
                    </div>
                    ${isEnterprise ? `
                        <div class="module-status" style="margin-top: 0.5rem; font-size: 0.8rem; color: rgba(255,255,255,0.6);">
                            Script: ${module.script}
                        </div>
                    ` : ''}
                `;
                
                card.addEventListener('click', () => {
                    this.launchModule(module);
                });
                
                return card;
            }
            
            showOfflineMode() {
                this.modules.innerHTML = `
                    <div class="module-card">
                        <div class="module-name">Demo Mode</div>
                        <div class="module-status">Backend not available</div>
                        <div class="module-status">Click to launch demo</div>
                    </div>
                `;
            }
            
            launchModule(moduleName) {
                if (window.terrafusion?.isDesktop) {
                    alert(`Launching ${moduleName} module...\\n\\nIn a full desktop implementation, this would:\\n• Open the module in a new window\\n• Load the module's React application\\n• Connect to module-specific APIs`);
                } else {
                    window.open(`/modules/${moduleName.toLowerCase().replace(/ /g, '-')}`, '_blank');
                }
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new TerraFusionDesktop();
        });
    </script>
</body>
</html>
