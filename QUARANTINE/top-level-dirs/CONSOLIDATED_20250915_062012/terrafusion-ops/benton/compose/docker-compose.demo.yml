version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: benton-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - terrafusion_demo
    volumes:
      - benton_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: benton-redis
    ports:
      - "6379:6379"
    networks:
      - terrafusion_demo

  core:
    image: nginx:alpine
    container_name: benton-core
    ports:
      - "8010:80"
    networks:
      - terrafusion_demo
    volumes:
      - ./demo-content:/usr/share/nginx/html
    environment:
      - COUNTY_NAME=Benton County, WA

  ui:
    image: nginx:alpine
    container_name: benton-ui
    ports:
      - "3010:80"
    networks:
      - terrafusion_demo
    volumes:
      - ./demo-content:/usr/share/nginx/html
    environment:
      - COUNTY_NAME=Benton County, WA

networks:
  terrafusion_demo:
    external: true

volumes:
  benton_postgres_data:




