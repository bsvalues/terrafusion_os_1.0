[server]
host = "127.0.0.1"
port = 3005
environment = "Development"

[harris]
version = "9.0"
database_url = "sqlite://harris_pacs_test.db"
api_base_url = "http://localhost:8080"
api_version = "9.0"
batch_size = 100
timeout_seconds = 30
retry_attempts = 3
connection_pool_size = 5

[harris.auth]
database_username = "pacs_user"
database_password_env = "HARRIS_PACS_PASSWORD"
api_key_env = "HARRIS_PACS_API_KEY"

[harris.schema_mappings]
property_table = "parcels"
owner_table = "owners"
assessment_table = "assessments"
tax_table = "taxes"
sale_table = "sales"
property_view = "parcel_view"
assessment_view = "assessment_view"

[harris.schema_mappings.field_mappings]
parcel_id = "PARCEL_NUMBER"
owner_name = "OWNER_NAME"
property_address = "SITE_ADDRESS"
assessed_value = "ASSESSED_VALUE"
tax_year = "TAX_YEAR"

[counties.benton]
county_id = "benton"
county_name = "Benton County"
state = "WA"
fips_code = "53005"
jurisdiction_code = "BENTON_WA"
sync_enabled = true
sync_interval_minutes = 15
max_records_per_sync = 1000

[database]
url = "sqlite://terrafusion_harris.db"
max_connections = 10
timeout_seconds = 30
enable_logging = true

[security]
enable_ssl = false
require_authentication = true
api_key_env = "TERRAFUSION_API_KEY"
rate_limit_per_minute = 100

[sync]
max_concurrent_syncs = 5
default_batch_size = 100
quiet_hours_enabled = false

[logging]
level = "info"
enable_json = false
enable_file = false
