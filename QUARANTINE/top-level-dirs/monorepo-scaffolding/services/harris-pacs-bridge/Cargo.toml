[package]
name = "terrafusion-harris-pacs-bridge"
version = "1.0.0"
edition = "2021"
description = "TerraFusion Harris PACS Bridge - County Property System Integration"
authors = ["TerraFusion Elite Government OS Team"]
license = "PROPRIETARY"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-xml-rs = "0.6"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# HTTP client for PACS integration
reqwest = { version = "0.12", features = ["json", "stream"] }

# SOAP/XML processing for Harris PACS
# soap-client = { path = "../../../lib/soap-client" }
quick-xml = "0.31"

# Authentication & Security
jsonwebtoken = "9.0"
bcrypt = "0.15"
md5 = "0.7"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.23"
metrics = "0.23"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async processing
futures = "0.3"
tokio-stream = "0.1"

# API documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# County system protocols
tiberius = "0.12"  # SQL Server driver for Harris PACS

[dev-dependencies]
tokio-test = "0.4"
