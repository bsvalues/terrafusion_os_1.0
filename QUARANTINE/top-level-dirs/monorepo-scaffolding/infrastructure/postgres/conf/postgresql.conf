# TerraFusion OS - PostgreSQL Government-Grade Configuration

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200

# Memory Settings (optimized for government workloads)
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 16MB

# Write Ahead Log (WAL) - FISMA Compliance
wal_level = replica
max_wal_size = 2GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query Performance
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging (Government Audit Requirements)
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'mod'  # Log all data-modifying statements
log_connections = on
log_disconnections = on
log_duration = on
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Security
ssl = off  # Disabled for local development - enable in production
password_encryption = scram-sha-256

# Locale
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'

# Default Text Search Configuration
default_text_search_config = 'pg_catalog.english'

# Performance Monitoring
shared_preload_libraries = 'pg_stat_statements'
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# Autovacuum (maintain database health)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
