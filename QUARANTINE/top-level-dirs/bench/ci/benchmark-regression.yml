name: Performance Benchmark Regression Detection

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'modules/**'
      - 'bench/**'
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  BENCHMARK_REGRESSION_THRESHOLD: 10  # Fail if performance degrades >10%

jobs:
  api-benchmarks:
    name: API Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: terrafusion
          POSTGRES_PASSWORD: terrafusion
          POSTGRES_DB: terrafusion_bench
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          cd backend && dotnet restore
      
      - name: Build backend
        run: cd backend && dotnet build --configuration Release
      
      - name: Start API server
        run: |
          cd backend
          dotnet run --project TerraFusion.API --configuration Release &
          echo $! > api.pid
          sleep 10  # Wait for API to start
      
      - name: Download baseline benchmarks
        uses: actions/download-artifact@v3
        with:
          name: benchmark-baseline
          path: bench/baseline
        continue-on-error: true
      
      - name: Run API benchmarks
        run: |
          npm install -g k6
          k6 run bench/suites/api-performance.bench.ts \
            --out json=bench/reports/api-performance.json \
            --summary-export=bench/reports/api-summary.json
      
      - name: Check for regression
        id: regression-check
        run: |
          node bench/scripts/check-regression.js \
            --current bench/reports/api-summary.json \
            --baseline bench/baseline/api-summary.json \
            --threshold ${{ env.BENCHMARK_REGRESSION_THRESHOLD }}
      
      - name: Upload benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-baseline
          path: bench/reports/api-summary.json
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('bench/reports/api-summary.json', 'utf8'));
            
            const comment = `## 📊 API Performance Benchmark Results
            
            | Metric | Value | Target | Status |
            |--------|-------|--------|--------|
            | p50 Latency | ${results.metrics.api_latency.p50}ms | <50ms | ${results.metrics.api_latency.p50 < 50 ? '✅' : '❌'} |
            | p95 Latency | ${results.metrics.api_latency.p95}ms | <200ms | ${results.metrics.api_latency.p95 < 200 ? '✅' : '❌'} |
            | p99 Latency | ${results.metrics.api_latency.p99}ms | <500ms | ${results.metrics.api_latency.p99 < 500 ? '✅' : '❌'} |
            | Error Rate | ${(results.metrics.api_errors.rate * 100).toFixed(2)}% | <1% | ${results.metrics.api_errors.rate < 0.01 ? '✅' : '❌'} |
            
            ${steps['regression-check'].outputs.regression_detected === 'true' ? 
              '⚠️ **Performance regression detected!** This PR degrades performance by more than 10%.' : 
              '✅ No performance regression detected.'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Stop API server
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill $(cat api.pid) || true
          fi

  database-benchmarks:
    name: Database Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: terrafusion
          POSTGRES_PASSWORD: terrafusion
          POSTGRES_DB: terrafusion_bench
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Load test data
        run: |
          PGPASSWORD=terrafusion psql -h localhost -U terrafusion -d terrafusion_bench < bench/fixtures/test-data.sql
      
      - name: Run database benchmarks
        run: |
          DB_HOST=localhost DB_USER=terrafusion DB_PASSWORD=terrafusion \
          npx ts-node bench/suites/database-performance.bench.ts
      
      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: database-benchmark-results
          path: bench/reports/database-performance.json

  ai-model-benchmarks:
    name: AI Model Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          pip install -r backend/ai-models/requirements.txt
          pip install pytest-benchmark
      
      - name: Run AI model benchmarks
        run: |
          python -m pytest backend/ai-models/tests/benchmarks \
            --benchmark-json=bench/reports/ai-performance.json \
            --benchmark-autosave
      
      - name: Check model performance
        run: |
          python bench/scripts/check-ai-performance.py \
            --results bench/reports/ai-performance.json \
            --max-inference-time 500  # ms
            --min-accuracy 0.95

  integration-benchmarks:
    name: Integration Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [api-benchmarks, database-benchmarks]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30  # Wait for services to start
      
      - name: Run integration benchmarks
        run: |
          npm run bench:integration
      
      - name: Generate performance report
        run: |
          node bench/scripts/generate-report.js \
            --output bench/reports/performance-report.html
      
      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: bench/reports/performance-report.html
      
      - name: Post results to dashboard
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        run: |
          curl -X POST ${{ secrets.METRICS_DASHBOARD_URL }}/api/benchmarks \
            -H "Authorization: Bearer ${{ secrets.METRICS_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @bench/reports/integration-summary.json

  performance-gate:
    name: Performance Quality Gate
    runs-on: ubuntu-latest
    needs: [api-benchmarks, database-benchmarks, ai-model-benchmarks, integration-benchmarks]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all benchmark results
        uses: actions/download-artifact@v3
        with:
          path: bench/results
      
      - name: Validate performance gates
        run: |
          node bench/scripts/validate-gates.js \
            --api-p99-threshold 500 \
            --db-query-p95-threshold 100 \
            --ai-inference-threshold 1000 \
            --error-rate-threshold 0.01
      
      - name: Update status badge
        if: github.ref == 'refs/heads/main'
        run: |
          echo "[![Performance](https://img.shields.io/badge/performance-passing-green)](bench/reports/)" > bench/BADGE.md
