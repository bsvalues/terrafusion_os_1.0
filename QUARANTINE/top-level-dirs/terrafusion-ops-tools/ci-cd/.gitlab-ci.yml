# TerraFusion GitLab CI/CD Pipeline
# Comprehensive pipeline for testing, building, and deploying TerraFusion

stages:
  - validate
  - test
  - security
  - build
  - integration
  - deploy-staging
  - performance
  - deploy-production
  - cleanup

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: "$CI_REGISTRY"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

# Templates
.docker_template: &docker_template
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.python_template: &python_template
  image: python:$PYTHON_VERSION
  before_script:
    - python -m pip install --upgrade pip
    - cd $COMPONENT_PATH
    - pip install -r requirements.txt
    - pip install -r requirements-dev.txt

.node_template: &node_template
  image: node:$NODE_VERSION
  before_script:
    - cd frontend
    - npm ci

# Validation Stage
validate-yaml:
  stage: validate
  image: alpine:latest
  before_script:
    - apk add --no-cache yamllint
  script:
    - yamllint .gitlab-ci.yml
    - yamllint docker/docker-compose.yml
    - yamllint monitoring/prometheus-rules.yml
  rules:
    - changes:
        - "*.yml"
        - "*.yaml"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

validate-docker:
  stage: validate
  <<: *docker_template
  script:
    - docker build --dry-run -f backend/Dockerfile backend/
    - docker build --dry-run -f ai_engine/Dockerfile ai_engine/
    - docker build --dry-run -f frontend/Dockerfile frontend/
  rules:
    - changes:
        - "**/Dockerfile"
        - "docker/**/*"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Test Stage
test-backend:
  stage: test
  <<: *python_template
  variables:
    COMPONENT_PATH: "backend"
    DATABASE_URL: "postgresql://postgres:test_password@postgres:5432/terrafusion_test"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "test-secret-key"
  services:
    - name: postgres:16
      alias: postgres
      variables:
        POSTGRES_DB: terrafusion_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: test_password
    - name: redis:7-alpine
      alias: redis
  script:
    - flake8 .
    - black --check .
    - isort --check-only .
    - mypy .
    - pytest --cov=. --cov-report=xml --cov-report=html --junitxml=report.xml
  artifacts:
    reports:
      junit: backend/report.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

test-ai-engine:
  stage: test
  <<: *python_template
  variables:
    COMPONENT_PATH: "ai_engine"
  script:
    - flake8 .
    - black --check .
    - pytest --cov=. --cov-report=xml --junitxml=report.xml
  artifacts:
    reports:
      junit: ai_engine/report.xml
      coverage_report:
        coverage_format: cobertura
        path: ai_engine/coverage.xml
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'

test-frontend:
  stage: test
  <<: *node_template
  script:
    - npm run lint
    - npm run type-check
    - npm run test:coverage
  artifacts:
    reports:
      junit: frontend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'

# Security Stage
security-scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --exit-code 0 --format json --output trivy-report.json .
    - trivy fs --exit-code 1 --severity HIGH,CRITICAL .
  artifacts:
    reports:
      # GitLab 15.0+
      container_scanning: trivy-report.json
    paths:
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

secret-detection:
  stage: security
  image: alpine/git:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      # Simple secret detection
      echo "Scanning for potential secrets..."
      git log --all --full-history -- . | grep -i -E "(password|secret|key|token)" | head -20 || true
      
      # Check for hardcoded secrets in files
      grep -r -i -E "(password|secret|key|token).*=.*['\"].*['\"]" . --exclude-dir=.git --exclude="*.yml" --exclude="*.yaml" || true
  allow_failure: true

sast:
  stage: security
  image: python:$PYTHON_VERSION
  script:
    - pip install bandit
    - bandit -r backend/ -f json -o bandit-report.json || true
    - bandit -r ai_engine/ -f json -o bandit-ai-report.json || true
  artifacts:
    reports:
      sast: bandit-report.json
    paths:
      - bandit-*.json
    expire_in: 1 week
  allow_failure: true

# Build Stage
build-backend:
  stage: build
  <<: *docker_template
  script:
    - docker build -t $REGISTRY/terrafusion-backend:$IMAGE_TAG backend/
    - docker push $REGISTRY/terrafusion-backend:$IMAGE_TAG
    - docker tag $REGISTRY/terrafusion-backend:$IMAGE_TAG $REGISTRY/terrafusion-backend:latest
    - docker push $REGISTRY/terrafusion-backend:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build-ai-engine:
  stage: build
  <<: *docker_template
  script:
    - docker build -t $REGISTRY/terrafusion-ai-engine:$IMAGE_TAG ai_engine/
    - docker push $REGISTRY/terrafusion-ai-engine:$IMAGE_TAG
    - docker tag $REGISTRY/terrafusion-ai-engine:$IMAGE_TAG $REGISTRY/terrafusion-ai-engine:latest
    - docker push $REGISTRY/terrafusion-ai-engine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build-frontend:
  stage: build
  <<: *docker_template
  script:
    - docker build -t $REGISTRY/terrafusion-frontend:$IMAGE_TAG frontend/
    - docker push $REGISTRY/terrafusion-frontend:$IMAGE_TAG
    - docker tag $REGISTRY/terrafusion-frontend:$IMAGE_TAG $REGISTRY/terrafusion-frontend:latest
    - docker push $REGISTRY/terrafusion-frontend:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Integration Stage
integration-tests:
  stage: integration
  image: docker/compose:latest
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - cp docker/.env.example docker/.env
    - sed -i 's/CHANGE_THIS_SECURE_PASSWORD/test_password/g' docker/.env
    - sed -i 's/CHANGE_THIS_REDIS_PASSWORD/test_redis_pass/g' docker/.env
    - sed -i 's/CHANGE_THIS_SECRET_KEY/test_secret_key/g' docker/.env
  script:
    - cd docker
    - docker-compose up -d
    - sleep 60
    - cd ..
    - chmod +x scripts/health-check.sh
    - ./scripts/health-check.sh
    - chmod +x scripts/smoke-tests.sh
    - ./scripts/smoke-tests.sh
  after_script:
    - cd docker && docker-compose down -v
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Staging Deployment
deploy-staging:
  stage: deploy-staging
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.terrafusion.com
  before_script:
    - apk add --no-cache curl openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_HOST << 'EOF'
        cd /opt/terrafusion
        docker-compose pull
        docker-compose up -d
        sleep 30
        ./scripts/health-check.sh || exit 1
      EOF
  after_script:
    - |
      # Run post-deployment tests
      export BASE_URL=https://staging-api.terrafusion.com
      chmod +x scripts/smoke-tests.sh
      ./scripts/smoke-tests.sh staging || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  when: manual

# Performance Testing
performance-tests:
  stage: performance
  image: loadimpact/k6:latest
  variables:
    BASE_URL: "https://staging-api.terrafusion.com"
  script:
    - mkdir -p /var/reports/performance
    - chmod +x scripts/performance-test.sh
    - ./scripts/performance-test.sh -t load -u 50 -d 300 -r
  artifacts:
    paths:
      - /var/reports/performance/
    expire_in: 1 week
    reports:
      performance: /var/reports/performance/performance_report.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  dependencies:
    - deploy-staging

# Production Deployment
deploy-production:
  stage: deploy-production
  image: alpine:latest
  environment:
    name: production
    url: https://terrafusion.com
  before_script:
    - apk add --no-cache curl openssh-client aws-cli
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
    - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
    - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
    - aws configure set default.region us-west-2
  script:
    - |
      # Create database backup
      echo "Creating database backup..."
      aws rds create-db-snapshot \
        --db-instance-identifier terrafusion-prod \
        --db-snapshot-identifier terrafusion-prod-$(date +%Y%m%d-%H%M%S)
      
      # Deploy to production with zero-downtime
      ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
        cd /opt/terrafusion
        
        # Run deployment script
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh production $CI_COMMIT_TAG
        
        # Verify deployment
        sleep 30
        ./scripts/health-check.sh || exit 1
        ./scripts/smoke-tests.sh production || exit 1
      EOF
  after_script:
    - |
      # Notify teams about deployment
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"text\":\"✅ TerraFusion $CI_COMMIT_TAG deployed to production successfully!\"}" \
        $SLACK_WEBHOOK || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  when: manual
  allow_failure: false

# Rollback job (manual trigger)
rollback-production:
  stage: deploy-production
  image: alpine:latest
  environment:
    name: production
    action: rollback
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'EOF'
        cd /opt/terrafusion
        chmod +x scripts/rollback.sh
        ./scripts/rollback.sh production
        ./scripts/health-check.sh || exit 1
      EOF
  after_script:
    - |
      curl -X POST -H 'Content-type: application/json' \
        --data "{\"text\":\"⚠️ TerraFusion production rolled back!\"}" \
        $SLACK_WEBHOOK || true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  when: manual
  needs:
    - deploy-production

# Cleanup Stage
cleanup-images:
  stage: cleanup
  <<: *docker_template
  script:
    - |
      # Keep only last 10 versions of each image
      for image in terrafusion-backend terrafusion-ai-engine terrafusion-frontend; do
        echo "Cleaning up old $image images..."
        
        # Get all tags except latest and last 10
        OLD_TAGS=$(docker images --format "table {{.Repository}}:{{.Tag}}" \
          | grep $REGISTRY/$image \
          | grep -v latest \
          | tail -n +11 \
          | cut -d: -f2 || true)
        
        for tag in $OLD_TAGS; do
          docker rmi $REGISTRY/$image:$tag || true
        done
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  when: manual

cleanup-reports:
  stage: cleanup
  image: alpine:latest
  script:
    - echo "Cleanup old reports and artifacts"
    - find /var/reports -type f -mtime +30 -delete || true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# Pages for documentation
pages:
  stage: cleanup
  image: alpine:latest
  script:
    - mkdir public
    - |
      # Generate index page with links to reports
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
          <title>TerraFusion CI/CD Reports</title>
          <style>
              body { font-family: Arial, sans-serif; margin: 40px; }
              .container { max-width: 800px; }
              .report-link { display: block; margin: 10px 0; padding: 10px; background: #f5f5f5; text-decoration: none; border-radius: 4px; }
              .report-link:hover { background: #e5e5e5; }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>TerraFusion CI/CD Reports</h1>
              <p>Latest pipeline: <strong>$CI_PIPELINE_ID</strong></p>
              <p>Commit: <strong>$CI_COMMIT_SHORT_SHA</strong></p>
              
              <h2>Available Reports</h2>
              <a href="backend/htmlcov/index.html" class="report-link">Backend Test Coverage</a>
              <a href="frontend/coverage/index.html" class="report-link">Frontend Test Coverage</a>
              <a href="performance/index.html" class="report-link">Performance Test Results</a>
              <a href="security/index.html" class="report-link">Security Scan Results</a>
          </div>
      </body>
      </html>
      EOF
    
    # Copy coverage reports if they exist
    - cp -r backend/htmlcov public/backend/ || true
    - cp -r frontend/coverage public/frontend/ || true
    - cp -r /var/reports/performance public/performance/ || true
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Include additional pipeline files if they exist
include:
  - local: '.gitlab-ci-custom.yml'
    rules:
      - exists:
          - .gitlab-ci-custom.yml