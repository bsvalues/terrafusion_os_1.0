<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion OS - Government. Transcended.</title>
    
    <!-- TerraFusion Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* TerraFusion OS - Government. Transcended. */
        /* Official Brand Implementation */
        
        :root {
            /* Authentic TerraFusion Colors */
            --tf-primary: #0099ff;
            --tf-primary-dark: #0077cc;
            --tf-accent: #00ffaa;
            --tf-accent-dark: #00cc88;
            --tf-transcend: #00ffee;
            --tf-dark: #0b1020;
            --tf-dark-lighter: #1a1f3a;
            --tf-light: #ffffff;
            --tf-gray: #888888;
            --tf-gray-light: #cccccc;
            --tf-error: #ff3333;
            --tf-success: #00ff88;
            --tf-warning: #ffaa00;
            --tf-clarity: #e0f7ff;
            
            /* TerraFusion Gradients */
            --tf-gradient-main: linear-gradient(135deg, var(--tf-primary) 0%, var(--tf-transcend) 50%, var(--tf-accent) 100%);
            --tf-gradient-dark: linear-gradient(135deg, var(--tf-dark) 0%, var(--tf-dark-lighter) 100%);
            --tf-gradient-clarity: linear-gradient(135deg, var(--tf-clarity) 0%, rgba(255,255,255,0.1) 100%);
            
            /* Effects */
            --tf-shadow-transcend: 0 10px 40px rgba(0, 255, 238, 0.3);
            --tf-shadow-depth: 0 20px 60px rgba(0,0,0,0.4);
            --tf-shadow-glow: 0 0 30px rgba(0, 153, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--tf-dark);
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(0, 255, 238, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(0, 153, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0, 255, 170, 0.05) 0%, transparent 50%);
            color: var(--tf-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Transcendence Effects */
        .transcend-glow {
            box-shadow: 
                0 0 20px rgba(0, 255, 238, 0.4),
                0 0 40px rgba(0, 153, 255, 0.3),
                0 0 60px rgba(0, 255, 170, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .transcend-glow:hover {
            box-shadow: 
                0 0 30px rgba(0, 255, 238, 0.6),
                0 0 60px rgba(0, 153, 255, 0.4),
                0 0 90px rgba(0, 255, 170, 0.3);
            transform: translateY(-2px);
        }

        /* TerraFusion Header */
        .tf-header {
            background: rgba(11, 16, 32, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 255, 238, 0.2);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--tf-shadow-transcend);
        }

        .tf-header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .tf-logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .tf-terrasphere {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--tf-gradient-main);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: intelligencePulse 4s ease-in-out infinite;
        }

        .tf-logo-text {
            display: flex;
            flex-direction: column;
        }

        .tf-brand-name {
            font-size: 28px;
            font-weight: 800;
            background: var(--tf-gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .tf-tagline {
            font-size: 14px;
            color: var(--tf-transcend);
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tf-nav {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .tf-nav-item {
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 255, 238, 0.2);
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .tf-nav-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--tf-gradient-main);
            transition: left 0.3s ease;
            opacity: 0.1;
        }

        .tf-nav-item:hover::before {
            left: 0;
        }

        .tf-nav-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--tf-shadow-glow);
        }

        .tf-nav-item.active {
            background: rgba(0, 255, 238, 0.1);
            border-color: var(--tf-transcend);
            color: var(--tf-transcend);
        }

        /* Main Layout */
        .tf-main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: calc(100vh - 90px);
        }

        .tf-sidebar {
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 255, 238, 0.1);
            padding: 30px 25px;
            overflow-y: auto;
        }

        .tf-content {
            padding: 40px;
            overflow-y: auto;
        }

        /* Sidebar Styling */
        .tf-sidebar-section {
            margin-bottom: 40px;
        }

        .tf-sidebar-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--tf-transcend);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        .tf-sidebar-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 30px;
            height: 2px;
            background: var(--tf-gradient-main);
            border-radius: 1px;
        }

        .tf-sidebar-item {
            padding: 15px 20px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .tf-sidebar-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--tf-gradient-main);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .tf-sidebar-item:hover::before {
            transform: scaleY(1);
        }

        .tf-sidebar-item:hover {
            background: rgba(0, 255, 238, 0.05);
            transform: translateX(5px);
        }

        .tf-sidebar-item.active {
            background: rgba(0, 255, 238, 0.1);
            border-left: 4px solid var(--tf-transcend);
        }

        /* Content Cards */
        .tf-grid {
            display: grid;
            gap: 30px;
            margin-bottom: 40px;
        }

        .tf-grid-2 { grid-template-columns: 1fr 1fr; }
        .tf-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .tf-grid-4 { grid-template-columns: repeat(4, 1fr); }

        .tf-card {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 238, 0.2);
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tf-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--tf-gradient-main);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tf-card:hover::before {
            opacity: 1;
        }

        .tf-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--tf-shadow-transcend);
            border-color: var(--tf-transcend);
        }

        .tf-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .tf-card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--tf-light);
        }

        /* Status Indicators */
        .tf-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tf-status-online {
            background: rgba(0, 255, 136, 0.2);
            color: var(--tf-success);
            border: 1px solid var(--tf-success);
        }

        .tf-status-warning {
            background: rgba(255, 170, 0, 0.2);
            color: var(--tf-warning);
            border: 1px solid var(--tf-warning);
        }

        .tf-status-offline {
            background: rgba(255, 51, 51, 0.2);
            color: var(--tf-error);
            border: 1px solid var(--tf-error);
        }

        /* Buttons */
        .tf-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .tf-btn-primary {
            background: var(--tf-gradient-main);
            color: var(--tf-dark);
        }

        .tf-btn-secondary {
            background: rgba(0, 255, 238, 0.1);
            color: var(--tf-transcend);
            border: 1px solid var(--tf-transcend);
        }

        .tf-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--tf-shadow-glow);
        }

        /* Metrics Display */
        .tf-metric {
            text-align: center;
            padding: 20px;
        }

        .tf-metric-value {
            font-size: 36px;
            font-weight: 800;
            display: block;
            margin-bottom: 8px;
            background: var(--tf-gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tf-metric-label {
            color: var(--tf-gray-light);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Map Container */
        .tf-map-container {
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 238, 0.2);
            background: rgba(0,0,0,0.3);
        }

        #tf-map {
            height: 100%;
            width: 100%;
        }

        /* Console */
        .tf-console {
            background: rgba(0, 0, 0, 0.8);
            color: var(--tf-transcend);
            padding: 25px;
            border-radius: 15px;
            font-family: 'Monaco', 'Menlo', 'Cascadia Code', monospace;
            height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 238, 0.2);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Form Controls */
        .tf-form-group {
            margin-bottom: 25px;
        }

        .tf-label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--tf-light);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .tf-input, .tf-select, .tf-textarea {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid rgba(0, 255, 238, 0.3);
            border-radius: 12px;
            background: rgba(26, 31, 58, 0.6);
            color: var(--tf-light);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tf-input:focus, .tf-select:focus, .tf-textarea:focus {
            outline: none;
            border-color: var(--tf-transcend);
            box-shadow: 0 0 0 3px rgba(0, 255, 238, 0.1);
            background: rgba(26, 31, 58, 0.8);
        }

        /* Animations */
        @keyframes intelligencePulse {
            0%, 100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
            25% {
                transform: scale(1.05) rotate(90deg);
            }
            50% {
                transform: scale(1.1) rotate(180deg);
                opacity: 0.9;
            }
            75% {
                transform: scale(1.05) rotate(270deg);
            }
        }

        @keyframes transcendenceReveal {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
                filter: blur(10px);
            }
            50% {
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .tf-fade-in {
            animation: transcendenceReveal 1s ease-out forwards;
        }

        /* Loading Spinner */
        .tf-spinner {
            border: 3px solid rgba(0, 255, 238, 0.2);
            border-left: 3px solid var(--tf-transcend);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Title Styling */
        .tf-page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            background: var(--tf-gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tf-page-subtitle {
            color: var(--tf-gray-light);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 40px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .tf-main-container {
                grid-template-columns: 1fr;
            }
            
            .tf-sidebar {
                display: none;
            }

            .tf-grid-2, .tf-grid-3, .tf-grid-4 {
                grid-template-columns: 1fr;
            }

            .tf-header-content {
                padding: 0 20px;
            }

            .tf-content {
                padding: 20px;
            }
        }

        /* TerraFusion Special Effects */
        .tf-hologram-effect {
            position: relative;
        }

        .tf-hologram-effect::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: var(--tf-gradient-main);
            border-radius: inherit;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tf-hologram-effect:hover::before {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="tf-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // TerraFusion OS - Government. Transcended.
        function TerraFusionOS() {
            const [activeSection, setActiveSection] = useState('overview');
            const [systemStatus, setSystemStatus] = useState({});
            const [realTimeData, setRealTimeData] = useState({});
            const [federationData, setFederationData] = useState({});
            const [consoleOutput, setConsoleOutput] = useState('');

            // Initialize TerraFusion OS
            useEffect(() => {
                initializeTerraFusion();
                startRealTimeUpdates();
                initializeTerraSphere();
            }, []);

            const initializeTerraFusion = async () => {
                addConsoleLog('🌍 TerraFusion OS Initialization...');
                addConsoleLog('✨ Government. Transcended.');
                
                try {
                    const response = await axios.get('http://localhost:8787/health');
                    setSystemStatus(prev => ({
                        ...prev,
                        backend: 'online',
                        lastCheck: new Date().toISOString()
                    }));
                    
                    addConsoleLog('✓ TerraFusion Core Systems: ONLINE');
                    addConsoleLog('✓ Transcendence Protocol: ACTIVATED');
                    addConsoleLog('✓ Infrastructure Intelligence: READY');
                    
                    await loadFederationData();
                    await initializeMapping();
                    
                } catch (error) {
                    setSystemStatus(prev => ({
                        ...prev,
                        backend: 'offline'
                    }));
                    addConsoleLog('⚠ Transcendence Protocol: Initializing...');
                }
            };

            const initializeTerraSphere = () => {
                // Initialize the TerraSphere animation if available
                const terraSphereEl = document.querySelector('.tf-terrasphere');
                if (terraSphereEl && window.lottie) {
                    // Load the TerraSphere Lottie animation
                    try {
                        window.lottie.loadAnimation({
                            container: terraSphereEl,
                            renderer: 'svg',
                            loop: true,
                            autoplay: true,
                            path: './assets/animations/terrafusion-terrasphere-motion-v1.json'
                        });
                    } catch (error) {
                        // Fallback to CSS animation
                        console.log('Using CSS fallback for TerraSphere');
                    }
                }
            };

            const loadFederationData = async () => {
                // Washington State 7-County Federation
                setFederationData({
                    counties: [
                        { name: 'King County', properties: 89247, status: 'online', transcendenceLevel: '99.2%' },
                        { name: 'Pierce County', properties: 67543, status: 'online', transcendenceLevel: '98.7%' },
                        { name: 'Snohomish County', properties: 54321, status: 'online', transcendenceLevel: '99.1%' },
                        { name: 'Spokane County', properties: 43210, status: 'online', transcendenceLevel: '98.9%' },
                        { name: 'Clark County', properties: 38765, status: 'warning', transcendenceLevel: '97.3%' },
                        { name: 'Thurston County', properties: 32101, status: 'online', transcendenceLevel: '99.0%' },
                        { name: 'Kitsap County', properties: 31260, status: 'online', transcendenceLevel: '98.8%' }
                    ],
                    totalProperties: 356447,
                    activeNodes: 7,
                    syncStatus: 'transcended',
                    clarityLevel: '98.7%'
                });
                
                addConsoleLog('🏛️ 7-County Federation: TRANSCENDED');
                addConsoleLog('🔮 Clarity Level: 98.7% and rising...');
            };

            const initializeMapping = () => {
                setTimeout(() => {
                    if (document.getElementById('tf-map')) {
                        const map = L.map('tf-map').setView([47.6062, -122.3321], 8);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap contributors | TerraFusion OS'
                        }).addTo(map);

                        // Add federation markers with transcendence indicators
                        const counties = [
                            [47.6062, -122.3321, 'Seattle - King County HQ', 'transcended'],
                            [47.2529, -122.4443, 'Tacoma - Pierce County', 'transcended'],
                            [47.9779, -122.2021, 'Everett - Snohomish County', 'transcended'],
                            [47.6587, -117.4260, 'Spokane County', 'transcended'],
                            [45.6387, -122.6615, 'Vancouver - Clark County', 'optimizing'],
                            [47.0379, -122.9015, 'Olympia - Thurston County', 'transcended'],
                            [47.5615, -122.6426, 'Bremerton - Kitsap County', 'transcended']
                        ];

                        counties.forEach(([lat, lng, title, status]) => {
                            const marker = L.marker([lat, lng]).addTo(map);
                            marker.bindPopup(`
                                <div style="color: #0b1020; font-weight: bold;">
                                    ${title}<br>
                                    <span style="color: ${status === 'transcended' ? '#00ff88' : '#ffaa00'};">
                                        Status: ${status === 'transcended' ? 'Transcended ✨' : 'Optimizing ⚡'}
                                    </span>
                                </div>
                            `);
                        });
                    }
                }, 1000);
            };

            const startRealTimeUpdates = () => {
                const interval = setInterval(() => {
                    setRealTimeData({
                        cpuUsage: Math.floor(Math.random() * 20) + 15,
                        memoryUsage: Math.floor(Math.random() * 30) + 25,
                        networkTraffic: Math.floor(Math.random() * 100) + 200,
                        activeConnections: Math.floor(Math.random() * 300) + 1500,
                        privacyQueries: Math.floor(Math.random() * 50) + 200,
                        immersiveSessions: Math.floor(Math.random() * 25) + 60,
                        transcendenceLevel: (98.5 + Math.random() * 1.5).toFixed(1)
                    });
                }, 3000);

                return () => clearInterval(interval);
            };

            const addConsoleLog = (message) => {
                const timestamp = new Date().toLocaleTimeString();
                setConsoleOutput(prev => 
                    prev + `[${timestamp}] ${message}\n`
                );
            };

            const executeCommand = (command) => {
                addConsoleLog(`> ${command}`);
                
                setTimeout(() => {
                    switch(command.toLowerCase()) {
                        case 'transcend':
                            addConsoleLog('🌟 Initiating transcendence protocol...');
                            addConsoleLog('✨ Government operations elevated');
                            addConsoleLog('🚀 Clarity achieved: 99.9%');
                            break;
                        case 'clarity status':
                            addConsoleLog('🔮 Clarity Analysis Complete');
                            addConsoleLog('📊 All systems operating at transcendent levels');
                            addConsoleLog('⚡ Infrastructure intelligence: OPTIMAL');
                            break;
                        case 'federation sync':
                            addConsoleLog('🏛️ Federation synchronization initiated...');
                            addConsoleLog('✓ All 7 counties: TRANSCENDED');
                            addConsoleLog('🌍 Washington State: Government. Transcended.');
                            break;
                        default:
                            addConsoleLog(`✓ Command executed with transcendent precision`);
                    }
                }, 800);
            };

            const renderOverview = () => (
                <div className="tf-fade-in">
                    <h1 className="tf-page-title">TerraFusion Command Portal</h1>
                    <p className="tf-page-subtitle">Government. Transcended. Infrastructure Intelligence at Infinite Scale.</p>
                    
                    {/* Transcendence Metrics */}
                    <div className="tf-grid tf-grid-4">
                        <div className="tf-card transcend-glow">
                            <div className="tf-metric">
                                <span className="tf-metric-value">{realTimeData.transcendenceLevel || '98.7'}%</span>
                                <span className="tf-metric-label">Transcendence Level</span>
                            </div>
                        </div>
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#00ff88'}}>{realTimeData.cpuUsage || 18}%</span>
                                <span className="tf-metric-label">System Harmony</span>
                            </div>
                        </div>
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#0099ff'}}>{realTimeData.activeConnections || 1647}</span>
                                <span className="tf-metric-label">Active Connections</span>
                            </div>
