# TerraFusion Command Portal - Enhanced Kubernetes Deployment
# Government-grade container orchestration with security and monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-backend
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
    component: api
    tier: backend
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: terrafusion-backend
  template:
    metadata:
      labels:
        app: terrafusion-backend
        component: api
        tier: backend
        environment: production
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8787'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: terrafusion-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: terrafusion-backend
          image: ghcr.io/bsvalues/terrafusion_os_1.0/terrafusion-backend:latest
          ports:
            - containerPort: 8787
              name: http
              protocol: TCP
          env:
            - name: RUST_LOG
              value: 'info'
            - name: REPO_ROOT
              value: '/app/data'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: database-url
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: terrafusion-data
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: 'government-workload'
          operator: 'Equal'
          value: 'true'
          effect: 'NoSchedule'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - terrafusion-backend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-backend
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
    component: api
    tier: backend
spec:
  type: ClusterIP
  ports:
    - port: 8787
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: terrafusion-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-frontend
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
    component: web
    tier: frontend
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: terrafusion-frontend
  template:
    metadata:
      labels:
        app: terrafusion-frontend
        component: web
        tier: frontend
        environment: production
    spec:
      serviceAccountName: terrafusion-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: terrafusion-frontend
          image: ghcr.io/bsvalues/terrafusion_os_1.0/terrafusion-frontend:latest
          ports:
            - containerPort: 5177
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NEXT_PUBLIC_API_URL
              value: 'https://api.terrafusionmarket.com'
            - name: NEXT_PUBLIC_WS_URL
              value: 'wss://api.terrafusionmarket.com/ws'
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '200m'
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /.next
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: 'government-workload'
          operator: 'Equal'
          value: 'true'
          effect: 'NoSchedule'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - terrafusion-frontend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-frontend
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
    component: web
    tier: frontend
spec:
  type: ClusterIP
  ports:
    - port: 5177
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: terrafusion-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  namespace: terrafusion-production
  labels:
    app: terrafusion
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss://api.terrafusionmarket.com;" always;
spec:
  tls:
    - hosts:
        - terrafusionmarket.com
        - api.terrafusionmarket.com
      secretName: terrafusion-tls
  rules:
    - host: terrafusionmarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-frontend
                port:
                  number: 5177
    - host: api.terrafusionmarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-backend
                port:
                  number: 8787
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: terrafusion-data
  namespace: terrafusion-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-backend
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-frontend
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terrafusion-backend-pdb
  namespace: terrafusion-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: terrafusion-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terrafusion-frontend-pdb
  namespace: terrafusion-production
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: terrafusion-frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-backend-hpa
  namespace: terrafusion-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-frontend-hpa
  namespace: terrafusion-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
