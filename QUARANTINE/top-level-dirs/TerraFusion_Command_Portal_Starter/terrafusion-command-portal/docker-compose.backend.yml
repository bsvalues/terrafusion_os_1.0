version: '3.9'

# TerraFusion IDE Backend Docker Compose
# Supports development, testing, and production environments

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # TerraFusion IDE Backend Service
  # ═══════════════════════════════════════════════════════════════════════════
  terrafusion-ide-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: terrafusion-ide-backend

    # Port configuration
    ports:
      - '8787:8787'

    # Volume mounts for workspace access
    volumes:
      - /c/Users/bsval/terrafusion_os_1.0:/app/terrafusion_os_1.0:ro
      - /c/Users/bsval/terrafusion_os_1.0/marketplace:/app/marketplace:ro
      - /c/Users/bsval/terrafusion_os_1.0/SDK:/app/SDK:ro
      - backend-cache:/app/.cargo

    # Environment configuration
    environment:
      RUST_LOG: info
      REPO_ROOT: /app/terrafusion_os_1.0
      PORT: 8787
      RUST_BACKTRACE: 1

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    # Restart policy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8787/health/ready']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '3'

    # Network
    networks:
      - terrafusion-network

# ═══════════════════════════════════════════════════════════════════════════
# Volumes
# ═══════════════════════════════════════════════════════════════════════════
volumes:
  backend-cache:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════════════════════
networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
