<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion - County A/B Testing Framework</title>
    <style>
        :root {
            --tf-primary: #0099ff;
            --tf-accent: #00ffaa;
            --tf-transcend: #00ffee;
            --tf-dark: #0b1020;
            --tf-dark-lighter: #1a1f3a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            background: var(--tf-dark);
            color: white;
            overflow-x: hidden;
        }

        /* A/B Testing Control Panel */
        .ab-control {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(26, 31, 58, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--tf-transcend);
            z-index: 1000;
            backdrop-filter: blur(10px);
            min-width: 300px;
        }

        .ab-control h3 {
            color: var(--tf-transcend);
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .county-selector {
            margin-bottom: 15px;
        }

        .county-selector select {
            width: 100%;
            padding: 8px;
            background: var(--tf-dark);
            color: white;
            border: 1px solid var(--tf-primary);
            border-radius: 6px;
            font-size: 14px;
        }

        .variant-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .variant-btn {
            flex: 1;
            padding: 8px;
            background: var(--tf-dark);
            color: var(--tf-accent);
            border: 1px solid var(--tf-accent);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .variant-btn.active {
            background: var(--tf-accent);
            color: var(--tf-dark);
        }

        .metrics-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
        }

        .metric-value {
            color: var(--tf-transcend);
            font-weight: bold;
        }

        /* Hero Section Base */
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.8s ease;
        }

        .hero-content {
            max-width: 1200px;
            padding: 60px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .county-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(0, 255, 238, 0.1);
            border: 1px solid var(--tf-transcend);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--tf-transcend);
            margin-bottom: 24px;
        }

        .hero-headline {
            font-size: clamp(48px, 8vw, 96px);
            font-weight: 300;
            margin-bottom: 24px;
            line-height: 1.1;
            transition: all 0.5s ease;
        }

        .hero-subhead {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 48px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        .hero-ctas {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--tf-primary) 0%, var(--tf-transcend) 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            background: transparent;
            color: var(--tf-transcend);
            border: 2px solid var(--tf-transcend);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* County-Specific Themes */
        .county-benton {
            background: linear-gradient(135deg, #1a237e 0%, #0d47a1 100%);
        }

        .county-benton .county-badge::before {
            content: "🌾 ";
        }

        .county-clark {
            background: linear-gradient(135deg, #004d40 0%, #00695c 100%);
        }

        .county-clark .county-badge::before {
            content: "🌲 ";
        }

        .county-king {
            background: linear-gradient(135deg, #4a148c 0%, #6a1b9a 100%);
        }

        .county-king .county-badge::before {
            content: "👑 ";
        }

        .county-snohomish {
            background: linear-gradient(135deg, #b71c1c 0%, #c62828 100%);
        }

        .county-snohomish .county-badge::before {
            content: "🏔️ ";
        }

        .county-pierce {
            background: linear-gradient(135deg, #e65100 0%, #f57c00 100%);
        }

        .county-pierce .county-badge::before {
            content: "🌊 ";
        }

        /* Variant-Specific Styles */
        .variant-emotional .hero-headline {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .variant-data .metric-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .metric-card {
            background: rgba(0, 255, 238, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--tf-transcend);
        }

        .metric-number {
            font-size: 36px;
            font-weight: bold;
            color: var(--tf-transcend);
        }

        .metric-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .variant-urgency .countdown {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff3333;
            padding: 15px 30px;
            border-radius: 50px;
            display: inline-block;
            margin: 20px 0;
            font-size: 20px;
            font-weight: bold;
            color: #ff6666;
        }

        /* Success Indicator */
        .success-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--tf-success);
            color: var(--tf-dark);
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .success-indicator.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- A/B Testing Control Panel -->
    <div class="ab-control">
        <h3>🧪 A/B Testing Control</h3>
        
        <div class="county-selector">
            <label style="font-size: 12px; color: #999;">Select County:</label>
            <select id="countySelect" onchange="switchCounty(this.value)">
                <option value="benton">Benton County, WA</option>
                <option value="clark">Clark County, WA</option>
                <option value="king">King County, WA</option>
                <option value="snohomish">Snohomish County, WA</option>
                <option value="pierce">Pierce County, WA</option>
            </select>
        </div>

        <div class="variant-selector">
            <button class="variant-btn active" onclick="switchVariant('control')">Control</button>
            <button class="variant-btn" onclick="switchVariant('emotional')">Emotional</button>
            <button class="variant-btn" onclick="switchVariant('data')">Data-Driven</button>
            <button class="variant-btn" onclick="switchVariant('urgency')">Urgency</button>
        </div>

        <div class="metrics-display">
            <div class="metric-row">
                <span>Engagement Rate:</span>
                <span class="metric-value" id="engagementRate">0%</span>
            </div>
            <div class="metric-row">
                <span>Time on Page:</span>
                <span class="metric-value" id="timeOnPage">0s</span>
            </div>
            <div class="metric-row">
                <span>CTA Clicks:</span>
                <span class="metric-value" id="ctaClicks">0</span>
            </div>
            <div class="metric-row">
                <span>Conversion Rate:</span>
                <span class="metric-value" id="conversionRate">0%</span>
            </div>
        </div>
    </div>

    <!-- Hero Section -->
    <section class="hero-section county-benton" id="heroSection">
        <div class="hero-content" id="heroContent">
            <!-- Dynamic content will be inserted here -->
        </div>
    </section>

    <!-- Success Indicator -->
    <div class="success-indicator" id="successIndicator">
        ✨ Variant Updated Successfully
    </div>

    <script>
        // County-specific content database
        const countyData = {
            benton: {
                name: "Benton County",
                properties: "94,149",
                population: "206,873",
                savings: "$477,816",
                efficiency: "379M×",
                testimonial: "TerraFusion transformed our assessment process completely.",
                official: "County Assessor"
            },
            clark: {
                name: "Clark County",
                properties: "178,000",
                population: "503,311",
                savings: "$892,000",
                efficiency: "425M×",
                testimonial: "The clarity we've achieved is unprecedented.",
                official: "IT Director"
            },
            king: {
                name: "King County",
                properties: "542,000",
                population: "2,269,675",
                savings: "$2.8M",
                efficiency: "512M×",
                testimonial: "This is what modern government should be.",
                official: "County Executive"
            },
            snohomish: {
                name: "Snohomish County",
                properties: "312,000",
                population: "827,957",
                savings: "$1.2M",
                efficiency: "398M×",
                testimonial: "Our teams are more confident than ever.",
                official: "Department Head"
            },
            pierce: {
                name: "Pierce County",
                properties: "289,000",
                population: "921,130",
                savings: "$1.1M",
                efficiency: "405M×",
                testimonial: "Citizens love the transparency.",
                official: "Public Relations"
            }
        };

        // Variant templates
        const variants = {
            control: (county) => `
                <div class="county-badge">${county.name} Ready</div>
                <h1 class="hero-headline">Government. Transcended.</h1>
                <p class="hero-subhead">
                    Turn complexity into clarity across ${county.properties} properties. 
                    Make better decisions faster. Serve ${county.population} citizens with confidence.
                </p>
                <div class="hero-ctas">
                    <button class="btn-primary" onclick="trackCTA('primary')">Begin Transcendence</button>
                    <button class="btn-secondary" onclick="trackCTA('secondary')">Discover Clarity</button>
                </div>
            `,
            
            emotional: (county) => `
                <div class="county-badge">${county.name} Success Story</div>
                <h1 class="hero-headline variant-emotional">Your Team Deserves Better</h1>
                <p class="hero-subhead">
                    <em>"${county.testimonial}"</em><br>
                    <small>- ${county.official}, ${county.name}</small>
                </p>
                <p class="hero-subhead">
                    Join thousands of county employees who've transcended the old way of working.
                </p>
                <div class="hero-ctas">
                    <button class="btn-primary" onclick="trackCTA('primary')">Transform Your County</button>
                    <button class="btn-secondary" onclick="trackCTA('secondary')">Read Success Stories</button>
                </div>
            `,
            
            data: (county) => `
                <div class="county-badge">${county.name} Performance</div>
                <h1 class="hero-headline">The Numbers Speak Volumes</h1>
                <div class="metric-cards">
                    <div class="metric-card">
                        <div class="metric-number">${county.efficiency}</div>
                        <div class="metric-label">Faster Processing</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-number">${county.savings}</div>
                        <div class="metric-label">Annual Savings</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-number">${county.properties}</div>
                        <div class="metric-label">Properties Managed</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-number">94%</div>
                        <div class="metric-label">Accuracy Rate</div>
                    </div>
                </div>
                <p class="hero-subhead">
                    Real results from counties like yours. Verified. Documented. Repeatable.
                </p>
                <div class="hero-ctas">
                    <button class="btn-primary" onclick="trackCTA('primary')">See Your Projections</button>
                    <button class="btn-secondary" onclick="trackCTA('secondary')">Download Case Study</button>
                </div>
            `,
            
            urgency: (county) => `
                <div class="county-badge">⚡ Limited Availability</div>
                <h1 class="hero-headline">Only 3 Pilot Slots Remaining</h1>
                <div class="countdown" id="countdown">
                    Offer expires in: <span id="timer">48:00:00</span>
                </div>
                <p class="hero-subhead">
                    ${county.name} qualifies for our exclusive Pioneer Program. 
                    Lock in founding member pricing and priority support before it's too late.
                </p>
                <p class="hero-subhead" style="color: #ff6666;">
                    <strong>Special Offer:</strong> Save ${county.savings} annually + 
                    6 months free implementation support
                </p>
                <div class="hero-ctas">
                    <button class="btn-primary" onclick="trackCTA('primary')">Claim Your Slot Now</button>
                    <button class="btn-secondary" onclick="trackCTA('secondary')">Schedule Urgent Demo</button>
                </div>
            `
        };

        // Current state
        let currentCounty = 'benton';
        let currentVariant = 'control';
        let startTime = Date.now();
        let ctaClickCount = 0;
        let engagementEvents = 0;

        // Switch county
        function switchCounty(county) {
            currentCounty = county;
            document.getElementById('heroSection').className = `hero-section county-${county}`;
            renderVariant();
            showSuccess('County switched to ' + countyData[county].name);
            trackEvent('county_switch', county);
        }

        // Switch variant
        function switchVariant(variant) {
            currentVariant = variant;
            document.querySelectorAll('.variant-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === variant);
            });
            renderVariant();
            showSuccess('Variant switched to ' + variant);
            trackEvent('variant_switch', variant);
        }

        // Render current variant
        function renderVariant() {
            const content = variants[currentVariant](countyData[currentCounty]);
            document.getElementById('heroContent').innerHTML = content;
            
            // Start countdown for urgency variant
            if (currentVariant === 'urgency') {
                startCountdown();
            }
        }

        // Track CTA clicks
        function trackCTA(type) {
            ctaClickCount++;
            updateMetrics();
            showSuccess(`${type === 'primary' ? 'Primary' : 'Secondary'} CTA clicked!`);
            trackEvent('cta_click', {
                county: currentCounty,
                variant: currentVariant,
                cta_type: type
            });
        }

        // Track events (would send to analytics in production)
        function trackEvent(eventName, data) {
            console.log('Analytics Event:', eventName, data);
            engagementEvents++;
            updateMetrics();
            
            // Simulate sending to analytics
            if (window.gtag) {
                window.gtag('event', eventName, data);
            }
        }

        // Update metrics display
        function updateMetrics() {
            const timeOnPage = Math.floor((Date.now() - startTime) / 1000);
            const engagementRate = Math.min(100, engagementEvents * 10);
            const conversionRate = ctaClickCount > 0 ? Math.min(100, ctaClickCount * 25) : 0;
            
            document.getElementById('engagementRate').textContent = engagementRate + '%';
            document.getElementById('timeOnPage').textContent = timeOnPage + 's';
            document.getElementById('ctaClicks').textContent = ctaClickCount;
            document.getElementById('conversionRate').textContent = conversionRate + '%';
        }

        // Show success indicator
        function showSuccess(message) {
            const indicator = document.getElementById('successIndicator');
            indicator.textContent = '✨ ' + message;
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 3000);
        }

        // Countdown timer for urgency variant
        function startCountdown() {
            let hours = 48;
            let minutes = 0;
            let seconds = 0;
            
            const timerInterval = setInterval(() => {
                if (seconds > 0) {
                    seconds--;
                } else if (minutes > 0) {
                    minutes--;
                    seconds = 59;
                } else if (hours > 0) {
                    hours--;
                    minutes = 59;
                    seconds = 59;
                } else {
                    clearInterval(timerInterval);
                }
                
                const timerElement = document.getElementById('timer');
                if (timerElement) {
                    timerElement.textContent = 
                        `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
            }, 1000);
        }

        // Track scroll depth
        let maxScroll = 0;
        window.addEventListener('scroll', () => {
            const scrollPercentage = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            if (scrollPercentage > maxScroll) {
                maxScroll = scrollPercentage;
                if (maxScroll > 25 && maxScroll <= 26) trackEvent('scroll_25', {});
                if (maxScroll > 50 && maxScroll <= 51) trackEvent('scroll_50', {});
                if (maxScroll > 75 && maxScroll <= 76) trackEvent('scroll_75', {});
            }
        });

        // Track time on page
        setInterval(updateMetrics, 1000);

        // Initialize
        renderVariant();
        
        // Simulate A/B test distribution (would be server-side in production)
        if (Math.random() > 0.75) {
            // 25% chance of getting a variant
            const variantKeys = Object.keys(variants);
            const randomVariant = variantKeys[Math.floor(Math.random() * variantKeys.length)];
            switchVariant(randomVariant);
        }
    </script>
</body>
</html>
