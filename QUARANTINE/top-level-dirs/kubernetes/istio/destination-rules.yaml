---
# TerraFusion OS - Istio DestinationRules
# Defines load balancing policies and traffic policies for services
################################################################################

apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend-api
  namespace: terrafusion-prod
  labels:
    app: backend-api
spec:
  host: backend-api
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: x-user-id  # Session affinity based on user
    connectionPool:
      tcp:
        maxConnections: 1000
      http:
        http1MaxPendingRequests: 1024
        http2MaxRequests: 1024
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
      trafficPolicy:
        loadBalancer:
          simple: LEAST_CONN  # Intelligent load balancing

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ai-agent
  namespace: terrafusion-prod
  labels:
    app: ai-agent
spec:
  host: ai-agent
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 500
      http:
        http1MaxPendingRequests: 512
        http2MaxRequests: 512
        maxRequestsPerConnection: 50
    outlierDetection:
      consecutiveErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgres
  namespace: terrafusion-prod
  labels:
    app: postgres
spec:
  host: postgres
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 200
        connectTimeout: 5s

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: redis
  namespace: terrafusion-prod
  labels:
    app: redis
spec:
  host: redis
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
    connectionPool:
      tcp:
        maxConnections: 500
        connectTimeout: 2s

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: mcp-servers
  namespace: terrafusion-prod
  labels:
    app: mcp-servers
spec:
  host: mcp-servers
  trafficPolicy:
    loadBalancer:
      simple: LEAST_CONN
    connectionPool:
      tcp:
        maxConnections: 800
      http:
        http1MaxPendingRequests: 1024
        http2MaxRequests: 1024
    outlierDetection:
      consecutiveErrors: 5
      interval: 20s
      baseEjectionTime: 30s
  subsets:
    - name: v1
      labels:
        version: v1
