---
# TerraFusion OS - Istio VirtualServices
# Routes traffic to backend services with intelligent load balancing
################################################################################

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-api
  namespace: terrafusion-prod
  labels:
    app: backend-api
    version: v1
spec:
  hosts:
    - backend-api
    - backend-api.terrafusion-prod.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/api/v1"
      route:
        - destination:
            host: backend-api
            port:
              number: 8080
            subset: v1
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure,refused-stream
      timeout: 10s
      corsPolicy:
        allowOrigins:
          - prefix: "https://terrafusion.io"
          - prefix: "https://*.terrafusion.io"
        allowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        allowHeaders:
          - authorization
          - content-type
          - x-request-id
        maxAge: 24h

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ai-agent
  namespace: terrafusion-prod
  labels:
    app: ai-agent
    version: v1
spec:
  hosts:
    - ai-agent
    - ai-agent.terrafusion-prod.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/ai"
      route:
        - destination:
            host: ai-agent
            port:
              number: 3001
            subset: v1
          weight: 100
      retries:
        attempts: 2
        perTryTimeout: 5s
        retryOn: 5xx,reset,connect-failure
      timeout: 30s  # AI operations may take longer

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: postgres
  namespace: terrafusion-prod
  labels:
    app: postgres
spec:
  hosts:
    - postgres
    - postgres.terrafusion-prod.svc.cluster.local
  tcp:
    - match:
        - port: 5432
      route:
        - destination:
            host: postgres
            port:
              number: 5432

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: redis
  namespace: terrafusion-prod
  labels:
    app: redis
spec:
  hosts:
    - redis
    - redis.terrafusion-prod.svc.cluster.local
  tcp:
    - match:
        - port: 6379
      route:
        - destination:
            host: redis
            port:
              number: 6379

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mcp-servers
  namespace: terrafusion-prod
  labels:
    app: mcp-servers
spec:
  hosts:
    - mcp-servers
    - mcp-servers.terrafusion-prod.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: "/mcp"
      route:
        - destination:
            host: mcp-servers
            port:
              number: 8080
            subset: v1
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: 5xx,reset,connect-failure
      timeout: 15s
