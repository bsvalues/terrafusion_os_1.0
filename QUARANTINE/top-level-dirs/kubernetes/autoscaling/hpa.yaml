---
# Kong API Gateway HPA - Scale based on requests per second
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kong-hpa
  namespace: kong
  labels:
    app.kubernetes.io/name: kong
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kong
  minReplicas: 2                    # Minimum 2 pods (high availability)
  maxReplicas: 6                    # Maximum 6 pods (gateway is critical)
  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale up when CPU > 70%
    # Scale based on memory utilization
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80  # Scale up when memory > 80%
    # Scale based on custom metric: requests per second
    # Note: Requires custom metrics API (e.g., Prometheus Adapter)
    - type: Pods
      pods:
        metric:
          name: kong_http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"    # Scale up when > 1000 RPS per pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # Scale up quickly for gateway (30s)
      policies:
        - type: Percent
          value: 50                      # Scale up by 50%
          periodSeconds: 30              # Every 30 seconds
        - type: Pods
          value: 2                       # Or add 2 pods
          periodSeconds: 30              # Every 30 seconds
      selectPolicy: Max                  # Use the policy that adds more pods
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1                       # Scale down by 1 pod at a time
          periodSeconds: 120             # Every 2 minutes
      selectPolicy: Min                  # Conservative scale-down
