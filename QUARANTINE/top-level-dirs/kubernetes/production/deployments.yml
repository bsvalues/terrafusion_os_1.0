# TerraFusion Kubernetes Deployment - THE TERRAFUSION WAY
# Production-grade orchestration with quantum optimization

apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion-production
  labels:
    name: terrafusion-production
    environment: production
    quantum-optimized: 'true'

---
# ============================================================================
# API GATEWAY DEPLOYMENT
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: terrafusion-production
  labels:
    app: api-gateway
    tier: backend
    component: gateway
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/terrafusion/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '8000'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: jwt-secret
            - name: QUANTUM_OPTIMIZATION
              value: 'enabled'
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '4Gi'
              cpu: '2000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: speclock-state
              mountPath: /app/artifacts/speclock/tss/state
              subPath: speclock/tss/state
            - name: speclock-state
              mountPath: /app/artifacts/receipts
              subPath: receipts
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api-gateway
                topologyKey: kubernetes.io/hostname
      volumes:
        - name: speclock-state
          persistentVolumeClaim:
            claimName: speclock-state-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: terrafusion-production
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: api-gateway

---
# ============================================================================
# PROPERTY SERVICE DEPLOYMENT
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-service
  namespace: terrafusion-production
  labels:
    app: property-service
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: property-service
  template:
    metadata:
      labels:
        app: property-service
        tier: backend
        version: v1
    spec:
      containers:
        - name: property-service
          image: ghcr.io/terrafusion/property-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '8001'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: redis-url
            - name: ELASTICSEARCH_URL
              value: 'http://elasticsearch:9200'
            - name: AI_VALUATION
              value: 'enabled'
          resources:
            requests:
              memory: '3Gi'
              cpu: '1000m'
            limits:
              memory: '6Gi'
              cpu: '2000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: property-service
  namespace: terrafusion-production
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: property-service

---
# ============================================================================
# AI SERVICE DEPLOYMENT
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: terrafusion-production
  labels:
    app: ai-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        tier: backend
        version: v1
    spec:
      containers:
        - name: ai-service
          image: ghcr.io/terrafusion/ai-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PYTHON_ENV
              value: 'production'
            - name: PORT
              value: '8002'
            - name: MODEL_PATH
              value: '/models'
            - name: GPU_ENABLED
              value: 'false'
            - name: QUANTUM_ML
              value: 'enabled'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: redis-url
          resources:
            requests:
              memory: '8Gi'
              cpu: '2000m'
            limits:
              memory: '16Gi'
              cpu: '4000m'
          volumeMounts:
            - name: ai-models
              mountPath: /models
      volumes:
        - name: ai-models
          persistentVolumeClaim:
            claimName: ai-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: terrafusion-production
spec:
  type: ClusterIP
  ports:
    - port: 8002
      targetPort: 8002
  selector:
    app: ai-service

---
# ============================================================================
# QUANTUM SERVICE DEPLOYMENT
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-service
  namespace: terrafusion-production
  labels:
    app: quantum-service
    tier: backend
    quantum: 'true'
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quantum-service
  template:
    metadata:
      labels:
        app: quantum-service
        tier: backend
        quantum: 'true'
        version: v1
    spec:
      containers:
        - name: quantum-service
          image: ghcr.io/terrafusion/quantum-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: PYTHON_ENV
              value: 'production'
            - name: PORT
              value: '8005'
            - name: QUANTUM_BACKEND
              value: 'qiskit'
            - name: QUANTUM_PROCESSOR
              value: 'IBM-127Q'
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: redis-url
          resources:
            requests:
              memory: '4Gi'
              cpu: '2000m'
            limits:
              memory: '8Gi'
              cpu: '4000m'

---
apiVersion: v1
kind: Service
metadata:
  name: quantum-service
  namespace: terrafusion-production
spec:
  type: ClusterIP
  ports:
    - port: 8005
      targetPort: 8005
  selector:
    app: quantum-service

---
# ============================================================================
# FRONTEND DEPLOYMENTS
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: property-client
  namespace: terrafusion-production
  labels:
    app: property-client
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: property-client
  template:
    metadata:
      labels:
        app: property-client
        tier: frontend
        version: v1
    spec:
      containers:
        - name: property-client
          image: ghcr.io/terrafusion/property-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: 'production'
            - name: API_GATEWAY_URL
              value: 'http://api-gateway:8000'
            - name: QUANTUM_ENABLED
              value: 'true'
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '4Gi'
              cpu: '2000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: property-client
  namespace: terrafusion-production
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: property-client

---
# ============================================================================
# INGRESS CONFIGURATION
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  namespace: terrafusion-production
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/limit-rps: '50'
spec:
  tls:
    - hosts:
        - terrafusion.ai
        - www.terrafusion.ai
        - api.terrafusion.ai
      secretName: terrafusion-tls
  rules:
    - host: terrafusion.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: property-client
                port:
                  number: 3000
    - host: api.terrafusion.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000

---
# ============================================================================
# HORIZONTAL POD AUTOSCALER
# ============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: terrafusion-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: property-service-hpa
  namespace: terrafusion-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: property-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ============================================================================
# PERSISTENT VOLUME CLAIMS
# ============================================================================

# SpecLock State Mesh PVC - Constitutional artifact persistence
# Stores: receipts, proofs, TSS state quorum files
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speclock-state-pvc
  namespace: terrafusion-production
  labels:
    constitution: 'sealed'
    purpose: 'state-mesh'
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-models-pvc
  namespace: terrafusion-production
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: terrafusion-production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: fast-ssd

---
# ============================================================================
# NETWORK POLICIES
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: terrafusion-production
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: frontend
        - podSelector:
            matchLabels:
              tier: backend
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
        - protocol: TCP
          port: 8002
        - protocol: TCP
          port: 8005
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: database
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9200

---
# ============================================================================
# POD DISRUPTION BUDGETS
# ============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: terrafusion-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: property-service-pdb
  namespace: terrafusion-production
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: property-service
