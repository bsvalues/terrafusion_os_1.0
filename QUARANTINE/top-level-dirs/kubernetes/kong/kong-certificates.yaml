---
# TerraFusion OS - Kong SSL/TLS Certificate Configuration
# Configures TLS certificates for secure HTTPS access
################################################################################

# Create TLS secret from certificate files
# kubectl create secret tls terrafusion-tls-cert \
#   --cert=path/to/cert.pem \
#   --key=path/to/key.pem \
#   -n kong

---
# Self-signed certificate for development/testing
apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-tls-cert-selfsigned
  namespace: kong
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    # Replace with actual certificate
    # This is a placeholder for self-signed cert
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    # Replace with actual private key
    # This is a placeholder for self-signed key
    -----END PRIVATE KEY-----

---
# Kong certificate object
apiVersion: configuration.konghq.com/v1
kind: KongCertificate
metadata:
  name: terrafusion-cert
  namespace: kong
spec:
  cert: |
    -----BEGIN CERTIFICATE-----
    # Production certificate goes here
    -----END CERTIFICATE-----
  key: |
    -----BEGIN PRIVATE KEY-----
    # Production private key goes here
    -----END PRIVATE KEY-----
  snis:
    - api.terrafusion.io
    - "*.terrafusion.io"

---
# Certificate Manager (cert-manager) ClusterIssuer for Let's Encrypt
# Requires cert-manager to be installed
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@terrafusion.io
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: kong

---
# Certificate for api.terrafusion.io
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: terrafusion-api-cert
  namespace: kong
spec:
  secretName: terrafusion-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - api.terrafusion.io
    - "*.terrafusion.io"
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days before expiry
