events {
    worker_connections 10000;
    use epoll;
}

http {
    upstream terrafusion_core {
        least_conn;
        server terrafusion-os-core-fixed:8080 max_fails=3 fail_timeout=30s;
    }

    upstream terrafusion_consciousness {
        least_conn;
        server terrafusion-consciousness:3004 max_fails=3 fail_timeout=30s;
    }

    upstream terrafusion_compliance {
        least_conn;
        server terrafusion-compliance:8082 max_fails=3 fail_timeout=30s;
    }

    upstream terrafusion_isolation {
        least_conn;
        server terrafusion-isolation:8083 max_fails=3 fail_timeout=30s;
    }

    upstream terrafusion_quantum {
        least_conn;
        server terrafusion-quantum:8085 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=government_api:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=100r/s;

    server {
        listen 3002;
        server_name terrafusion-gateway;

        # Government-grade access logging
        access_log /var/log/nginx/access.log combined;
        error_log /var/log/nginx/error.log warn;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "TerraFusion API Gateway: Healthy\n";
            add_header Content-Type text/plain;
        }

        # OS Core routes
        location /api/core/ {
            limit_req zone=government_api burst=2000 nodelay;
            proxy_pass http://terrafusion_core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
        }

        # AI Consciousness routes  
        location /api/consciousness/ {
            limit_req zone=government_api burst=1000 nodelay;
            proxy_pass http://terrafusion_consciousness/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
        }

        # Government Compliance routes (optional - may be unavailable)
        location /api/compliance/ {
            limit_req zone=admin_api burst=200 nodelay;
            proxy_pass http://terrafusion_compliance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # County Isolation routes (optional - may be unavailable)
        location /api/county/ {
            limit_req zone=government_api burst=2000 nodelay;
            proxy_pass http://terrafusion_isolation/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Quantum Optimizer routes (optional - may be unavailable)
        location /api/quantum/ {
            limit_req zone=government_api burst=500 nodelay;
            proxy_pass http://terrafusion_quantum/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Direct core service access
        location /health/core {
            proxy_pass http://terrafusion_core/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Direct consciousness service access
        location /health/consciousness {
            proxy_pass http://terrafusion_consciousness/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default route
        location / {
            return 200 "TerraFusion Elite Government OS - API Gateway\nGovernment. Transcended.\nCore: Available | Consciousness: Available | PACS: Configuring\n";
            add_header Content-Type text/plain;
        }
    }
}