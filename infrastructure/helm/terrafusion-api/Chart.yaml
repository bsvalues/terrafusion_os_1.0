apiVersion: v2
name: terrafusion-api
description: TerraFusion OS API Service - Government AI Platform Backend
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/terrafusion/terrafusion-os
sources:
  - https://github.com/terrafusion/terrafusion-os
maintainers:
  - name: TerraFusion DevOps Team
    email: devops@terrafusion.com
keywords:
  - government
  - ai
  - property-valuation
  - county-management
  - dotnet
  - postgresql
dependencies:
  - name: postgresql
    version: 12.8.2
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 18.0.4
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
annotations:
  category: Government
  licenses: Proprietary