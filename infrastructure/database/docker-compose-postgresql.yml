# TerraFusion OS PostgreSQL Master-Replica Docker Compose Configuration
# PhD-Level Database Infrastructure with Negative Caching Integration
# Production-Ready PostgreSQL Cluster for Government Property Assessment Systems

version: '3.8'

services:
  # ===========================================================================
  # PRIMARY POSTGRESQL SERVER
  # ===========================================================================
  terrafusion-db-primary:
    image: postgres:15.4-alpine
    container_name: terrafusion-db-primary
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: terrafusion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:-TF_DB_Master_2025_Secure!}
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/data/pgdata
      
      # Replication environment variables
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-TF_Replica_2025_Secure!}
      
      # Government-grade security
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      
    volumes:
      # Primary data directory
      - postgres_primary_data:/var/lib/postgresql/data
      - postgres_primary_logs:/var/log/postgresql
      - postgres_wal_archive:/var/lib/postgresql/15/archive
      
      # Configuration files
      - ./config/postgresql/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/postgresql/setup-replication.sql:/docker-entrypoint-initdb.d/01-setup-replication.sql:ro
      
      # SSL certificates for government compliance
      - ./ssl/certs/terrafusion-db.crt:/etc/ssl/certs/terrafusion-db.crt:ro
      - ./ssl/private/terrafusion-db.key:/etc/ssl/private/terrafusion-db.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      
      # Backup directory
      - postgres_backups:/var/lib/postgresql/backups
      
    ports:
      - "5432:5432"
      
    networks:
      - terrafusion-network
      
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c log_destination=stderr
      -c log_statement=mod
      -c log_min_duration_statement=5000
      -c shared_preload_libraries=pg_stat_statements
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrafusion"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          
    security_opt:
      - no-new-privileges:true
      
    labels:
      - "component=database"
      - "role=primary"
      - "environment=production"
      - "compliance=government-grade"

  # ===========================================================================
  # READ REPLICA 1 - PRIMARY REPLICA
  # ===========================================================================
  terrafusion-db-replica1:
    image: postgres:15.4-alpine
    container_name: terrafusion-db-replica1
    restart: unless-stopped
    
    environment:
      PGUSER: postgres
      POSTGRES_DB: terrafusion
      POSTGRES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:-TF_DB_Master_2025_Secure!}
      PGDATA: /var/lib/postgresql/data/pgdata
      
      # Replica-specific environment
      POSTGRES_MASTER_SERVICE: terrafusion-db-primary
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-TF_Replica_2025_Secure!}
      
    volumes:
      # Replica data directory
      - postgres_replica1_data:/var/lib/postgresql/data
      - postgres_replica1_logs:/var/log/postgresql
      
      # Configuration files
      - ./config/postgresql/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      
      # SSL certificates
      - ./ssl/certs/terrafusion-db-replica.crt:/etc/ssl/certs/terrafusion-db-replica.crt:ro
      - ./ssl/private/terrafusion-db-replica.key:/etc/ssl/private/terrafusion-db-replica.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      - ./ssl/certs/replica.crt:/etc/ssl/certs/replica.crt:ro
      - ./ssl/private/replica.key:/etc/ssl/private/replica.key:ro
      
    ports:
      - "5433:5432"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - terrafusion-db-primary
      
    command: >
      bash -c "
        # Wait for primary to be ready
        until pg_isready -h terrafusion-db-primary -p 5432 -U postgres; do
          echo 'Waiting for primary database...'
          sleep 2
        done
        
        # Initialize replica if data directory is empty
        if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
          echo 'Initializing replica from primary...'
          pg_basebackup -h terrafusion-db-primary -D /var/lib/postgresql/data/pgdata -U replicator -v -P -W -R -X stream
          
          # Set proper permissions
          chmod 700 /var/lib/postgresql/data/pgdata
          chown -R postgres:postgres /var/lib/postgresql/data/pgdata
        fi
        
        # Start PostgreSQL with replica configuration
        postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrafusion"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
          
    security_opt:
      - no-new-privileges:true
      
    labels:
      - "component=database"
      - "role=replica"
      - "replica-id=1"
      - "environment=production"

  # ===========================================================================
  # READ REPLICA 2 - ANALYTICS REPLICA
  # ===========================================================================
  terrafusion-db-replica2:
    image: postgres:15.4-alpine
    container_name: terrafusion-db-replica2
    restart: unless-stopped
    
    environment:
      PGUSER: postgres
      POSTGRES_DB: terrafusion
      POSTGRES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:-TF_DB_Master_2025_Secure!}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_MASTER_SERVICE: terrafusion-db-primary
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICA_PASSWORD:-TF_Replica_2025_Secure!}
      
    volumes:
      - postgres_replica2_data:/var/lib/postgresql/data
      - postgres_replica2_logs:/var/log/postgresql
      - ./config/postgresql/postgresql-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./ssl/certs/terrafusion-db-replica.crt:/etc/ssl/certs/terrafusion-db-replica.crt:ro
      - ./ssl/private/terrafusion-db-replica.key:/etc/ssl/private/terrafusion-db-replica.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      
    ports:
      - "5434:5432"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - terrafusion-db-primary
      
    command: >
      bash -c "
        until pg_isready -h terrafusion-db-primary -p 5432 -U postgres; do
          echo 'Waiting for primary database...'
          sleep 2
        done
        
        if [ ! -s /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
          echo 'Initializing analytics replica from primary...'
          pg_basebackup -h terrafusion-db-primary -D /var/lib/postgresql/data/pgdata -U replicator -v -P -W -R -X stream -S replica_2
          chmod 700 /var/lib/postgresql/data/pgdata
          chown -R postgres:postgres /var/lib/postgresql/data/pgdata
        fi
        
        postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
      "
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d terrafusion"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
        reservations:
          cpus: '1.5'
          memory: 3G
          
    security_opt:
      - no-new-privileges:true
      
    labels:
      - "component=database"
      - "role=replica"
      - "replica-id=2"
      - "purpose=analytics"
      - "environment=production"

  # ===========================================================================
  # PGBOUNCER CONNECTION POOLING
  # ===========================================================================
  terrafusion-pgbouncer:
    image: pgbouncer/pgbouncer:1.20.1
    container_name: terrafusion-pgbouncer
    restart: unless-stopped
    
    environment:
      DATABASES_HOST: terrafusion-db-primary
      DATABASES_PORT: 5432
      DATABASES_USER: postgres
      DATABASES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:-TF_DB_Master_2025_Secure!}
      DATABASES_DBNAME: terrafusion
      
      POOL_MODE: transaction
      SERVER_RESET_QUERY: DISCARD ALL
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      RESERVE_POOL_TIMEOUT: 5
      MAX_DB_CONNECTIONS: 100
      MAX_USER_CONNECTIONS: 100
      SERVER_ROUND_ROBIN: 1
      
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      
    ports:
      - "6432:6432"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - terrafusion-db-primary
      
    healthcheck:
      test: ["CMD", "psql", "-h", "localhost", "-p", "6432", "-U", "pgbouncer", "-d", "pgbouncer", "-c", "SHOW POOLS;"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
          
    labels:
      - "component=database"
      - "role=connection-pooler"
      - "environment=production"

  # ===========================================================================
  # DATABASE MONITORING WITH POSTGRES EXPORTER
  # ===========================================================================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.13.2
    container_name: terrafusion-postgres-exporter
    restart: unless-stopped
    
    environment:
      DATA_SOURCE_NAME: "postgresql://monitoring_user:TF_Monitoring_2025_Secure!@terrafusion-db-primary:5432/terrafusion?sslmode=require"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: false
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: false
      
    volumes:
      - ./config/monitoring/postgres-exporter-queries.yaml:/etc/postgres_exporter/queries.yaml:ro
      
    ports:
      - "9187:9187"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - terrafusion-db-primary
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:\${{TF_PORT_9187:-9187}}/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
          
    labels:
      - "component=monitoring"
      - "role=database-exporter"
      - "environment=production"

  # ===========================================================================
  # DATABASE BACKUP SERVICE
  # ===========================================================================
  postgres-backup:
    image: postgres:15.4-alpine
    container_name: terrafusion-postgres-backup
    restart: "no"  # Run as scheduled job, not continuous service
    
    environment:
      PGPASSWORD: ${POSTGRES_MASTER_PASSWORD:-TF_DB_Master_2025_Secure!}
      BACKUP_SCHEDULE: "0 2 * * *"  # Daily at 2 AM
      BACKUP_RETENTION_DAYS: 30
      
    volumes:
      - postgres_backups:/backups
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      
    networks:
      - terrafusion-network
      
    depends_on:
      - terrafusion-db-primary
      
    command: >
      sh -c "
        # Install cron
        apk add --no-cache dcron
        
        # Create cron job for automated backups
        echo '0 2 * * * /usr/local/bin/backup-postgres.sh' | crontab -
        
        # Start cron daemon
        crond -f -l 2
      "
      
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
          
    labels:
      - "component=database"
      - "role=backup"
      - "environment=production"

# ===========================================================================
# PERSISTENT VOLUMES
# ===========================================================================
volumes:
  postgres_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/postgres/primary/data
      
  postgres_replica1_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/postgres/replica1/data
      
  postgres_replica2_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/postgres/replica2/data
      
  postgres_primary_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/postgres/primary
      
  postgres_replica1_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/postgres/replica1
      
  postgres_replica2_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/postgres/replica2
      
  postgres_wal_archive:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/postgres/wal-archive
      
  postgres_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/backups/postgres

# ===========================================================================
# NETWORK CONFIGURATION
# ===========================================================================
networks:
  terrafusion-network:
    external: true