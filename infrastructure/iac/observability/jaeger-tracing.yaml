---
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: terrafusion-jaeger
  namespace: observability
spec:
  strategy: production
  storage:
    type: elasticsearch
    elasticsearch:
      nodeCount: 3
      redundancyPolicy: SingleRedundancy
      resources:
        requests:
          memory: 2Gi
          cpu: 1000m
        limits:
          memory: 4Gi
          cpu: 2000m
      storage:
        size: 100Gi
        storageClassName: fast-ssd
  collector:
    maxReplicas: 5
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    options:
      collector:
        zipkin:
          host-port: ":9411"
        otlp:
          grpc:
            host-port: ":4317"
          http:
            host-port: ":4318"
  query:
    replicas: 3
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    options:
      query:
        base-path: /jaeger
  agent:
    strategy: DaemonSet
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: istio
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
    - jaeger.terrafusion.local
    tls:
    - secretName: jaeger-tls
      hosts:
      - jaeger.terrafusion.local

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-sampling-config
  namespace: observability
data:
  sampling.json: |
    {
      "service_strategies": [
        {
          "service": "terrafusion-backend",
          "type": "probabilistic",
          "param": 0.1,
          "operation_strategies": [
            {
              "operation": "GET /api/health",
              "type": "probabilistic",
              "param": 0.01
            },
            {
              "operation": "POST /api/properties",
              "type": "probabilistic",
              "param": 1.0
            }
          ]
        },
        {
          "service": "terrafusion-costforge",
          "type": "probabilistic",
          "param": 0.2
        },
        {
          "service": "terrafusion-propertyworkbench",
          "type": "probabilistic",
          "param": 0.2
        },
        {
          "service": "terrafusion-terrainsight",
          "type": "probabilistic",
          "param": 0.1
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.05
      },
      "per_operation_strategies": [
        {
          "operation": "health_check",
          "type": "probabilistic",
          "param": 0.001
        }
      ]
    }

---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: terrafusion-otel-collector
  namespace: observability
spec:
  mode: deployment
  replicas: 3
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 500m
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
          http:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
          thrift_http:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
          thrift_compact:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
          thrift_binary:
            endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
      zipkin:
        endpoint: 0.0.0.0:\${{TF_PORT_4317:-4317}}
      prometheus:
        config:
          scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 10s
            static_configs:
            - targets: ['0.0.0.0:\${{TF_PORT_4317:-4317}}']

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        limit_mib: 400
      resource:
        attributes:
        - key: service.name
          from_attribute: service_name
          action: insert
        - key: service.version
          from_attribute: service_version
          action: insert
      probabilistic_sampler:
        sampling_percentage: 10

    exporters:
      jaeger:
        endpoint: terrafusion-jaeger-collector:14250
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:\${{TF_PORT_4317:-4317}}"
      elasticsearch:
        endpoints:
        - https://terrafusion-elastic-es-http:9200
        index: otel-spans-%{+yyyy.MM.dd}
        tls:
          insecure_skip_verify: true

    service:
      pipelines:
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, resource, probabilistic_sampler, batch]
          exporters: [jaeger, elasticsearch]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
      extensions: [health_check, pprof]