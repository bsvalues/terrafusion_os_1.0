# ==================================================
# REVOLUTIONARY: TerraFusion OS 1.0 Service Mesh
# Istio Configuration for Government-Grade Zero-Trust
# 
# This configuration implements the most advanced
# service mesh architecture for government systems,
# providing quantum-enhanced security, observability,
# and traffic management across all microservices.
# ==================================================

# Service Mesh Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion-system
  labels:
    name: terrafusion-system
    istio-injection: enabled
    terrafusion.gov/security-level: "FISMA-HIGH"
    terrafusion.gov/compliance: "NIST-800-53"
---
# Main Application Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion-microservices
  labels:
    name: terrafusion-microservices
    istio-injection: enabled
    terrafusion.gov/security-level: "FISMA-HIGH"
    terrafusion.gov/compliance: "NIST-800-53"
---
# Gateway Configuration
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: terrafusion-gateway
  namespace: terrafusion-microservices
  labels:
    app: terrafusion-gateway
    version: v1.0.0
    terrafusion.gov/service-type: "government-portal"
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.terrafusion.gov
    - portal.terrafusion.gov
    - "*.terrafusion.gov"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - api.terrafusion.gov
    - portal.terrafusion.gov
    - "*.terrafusion.gov"
    tls:
      mode: SIMPLE
      credentialName: terrafusion-tls-secret
---
# Virtual Service for API Gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: terrafusion-api-gateway
  namespace: terrafusion-microservices
  labels:
    app: api-gateway
    terrafusion.gov/quantum-enhanced: "true"
spec:
  hosts:
  - api.terrafusion.gov
  gateways:
  - terrafusion-gateway
  http:
  - match:
    - uri:
        prefix: /api/v1/
    route:
    - destination:
        host: terrafusion-gateway-service
        port:
          number: 5000
      weight: 100
    fault:
      abort:
        percentage:
          value: 0.1
        httpStatus: 503
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,refused-stream
    timeout: 30s
    headers:
      request:
        add:
          x-government-service: "terrafusion-os"
          x-security-level: "fisma-high"
          x-request-id: "%REQ(x-request-id)%"
---
# Destination Rules for Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: terrafusion-circuit-breaker
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/pattern: "circuit-breaker"
spec:
  host: "*.terrafusion-microservices.svc.cluster.local"
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 50
    outlierDetection:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_CONN
  portLevelSettings:
  - port:
      number: 5000
    connectionPool:
      tcp:
        maxConnections: 50
---
# Peer Authentication for mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: terrafusion-mtls
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/security: "zero-trust"
spec:
  mtls:
    mode: STRICT
---
# Authorization Policy - FISMA HIGH Security
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: terrafusion-authorization
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/compliance: "fisma-high"
spec:
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/terrafusion-microservices/sa/terrafusion-gateway"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
    when:
    - key: request.headers[x-government-service]
      values: ["terrafusion-os"]
  - from:
    - source:
        namespaces: ["terrafusion-microservices"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
    when:
    - key: request.headers[x-security-level]
      values: ["fisma-high"]
---
# Telemetry Configuration for Observability
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: terrafusion-telemetry
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/observability: "comprehensive"
spec:
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        government_service:
          value: "terrafusion-os"
        security_level:
          value: "fisma-high"
        citizen_facing:
          value: "true"
  accessLogging:
  - providers:
    - name: envoy
  tracing:
  - providers:
    - name: jaeger
---
# Service Monitor for Prometheus Integration
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: terrafusion-service-monitor
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/monitoring: "prometheus"
spec:
  selector:
    matchLabels:
      app: terrafusion-microservices
  endpoints:
  - port: http-monitoring
    path: /metrics
    interval: 15s
    honorLabels: true
---
# Network Policy for Zero-Trust
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terrafusion-zero-trust
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/security: "zero-trust"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: terrafusion-microservices
    - namespaceSelector:
        matchLabels:
          name: terrafusion-system
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: terrafusion-microservices
    - namespaceSelector:
        matchLabels:
          name: terrafusion-system
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
---
# EnvoyFilter for Custom Headers
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: terrafusion-headers
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/customization: "headers"
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: "envoy.filters.network.http_connection_manager"
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.wasm
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
          config:
            name: "terrafusion_headers"
            vm_config:
              vm_id: "terrafusion_headers"
              runtime: "envoy.wasm.runtime.null"
              code:
                local:
                  inline_string: |
                    addEventListener("context_creation", (rootContext) => {
                      return new HeadersContext(rootContext);
                    });
                    
                    class HeadersContext {
                      constructor(rootContext) {
                        this.rootContext = rootContext;
                      }
                      
                      onHttpRequestHeaders() {
                        this.addRequestHeader("x-terrafusion-version", "1.0.0");
                        this.addRequestHeader("x-government-compliance", "fisma-high");
                        this.addRequestHeader("x-quantum-enhanced", "true");
                        return FilterHeadersStatus.Continue;
                      }
                      
                      onHttpResponseHeaders() {
                        this.addResponseHeader("x-terrafusion-processed", "true");
                        this.addResponseHeader("x-security-headers-applied", "true");
                        return FilterHeadersStatus.Continue;
                      }
                    }
---
# Request Authentication for JWT
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: terrafusion-jwt
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/auth: "jwt"
spec:
  selector:
    matchLabels:
      app: terrafusion-gateway
  jwtRules:
  - issuer: "https://auth.terrafusion.gov"
    jwksUri: "https://auth.terrafusion.gov/.well-known/jwks.json"
    audiences:
    - "api.terrafusion.gov"
    - "portal.terrafusion.gov"
    forwardOriginalToken: true
---
# Workload Entry for External Services
apiVersion: networking.istio.io/v1beta1
kind: WorkloadEntry
metadata:
  name: harris-pacs-external
  namespace: terrafusion-microservices
  labels:
    app: harris-pacs
    terrafusion.gov/external-service: "true"
spec:
  address: harris-pacs.county.gov
  ports:
    https: 443
  labels:
    app: harris-pacs
    version: v12.4.7
---
# Service Entry for External Dependencies
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: terrafusion-external-services
  namespace: terrafusion-microservices
  labels:
    terrafusion.gov/external: "true"
spec:
  hosts:
  - harris-pacs.county.gov
  - tyler-tech.api.com
  - aumentum.systems.api
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  - number: 80
    name: http
    protocol: HTTP
  location: MESH_EXTERNAL
  resolution: DNS