# TerraFusion OS - SLO Monitoring & Error Budget Management
# SERVICE LEVEL OBJECTIVES - GOVERNMENT EXCELLENCE
# 99.9% Availability with Intelligent Alerting

apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-definitions
  namespace: terrafusion-observability
  labels:
    app: slo-monitoring
    tier: observability
data:
  slos.yaml: |
    slos:
      # API Availability SLO - Critical Government Service
      - name: terrafusion_api_availability
        description: "TerraFusion API 99.9% availability requirement"
        service: terrafusion-api
        sli:
          query: |
            (
              sum(rate(http_requests_total{job="terrafusion-api", code!~"5.."}[5m])) /
              sum(rate(http_requests_total{job="terrafusion-api"}[5m]))
            ) * 100
          threshold: 99.9
          unit: "percent"
        objectives:
          - name: "30d"
            target: 99.9
            window: "30d"
          - name: "7d"
            target: 99.95
            window: "7d"
        alerting:
          burn_rates:
            - severity: "critical"
              short_window: "2m"
              long_window: "1h"
              burn_rate_threshold: 14.4
            - severity: "warning"
              short_window: "15m"
              long_window: "1h"
              burn_rate_threshold: 6.0
          error_budget:
            - name: "fast_burn"
              threshold: 0.02  # 2% of monthly budget in 1 hour
              window: "1h"
            - name: "slow_burn"
              threshold: 0.10  # 10% of monthly budget in 6 hours
              window: "6h"

      # API Latency SLO - Sub-50ms Government Requirement
      - name: terrafusion_api_latency
        description: "API P95 latency under 50ms for government efficiency"
        service: terrafusion-api
        sli:
          query: |
            histogram_quantile(0.95, 
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job="terrafusion-api"}[5m])
              )
            ) * 1000
          threshold: 50
          unit: "milliseconds"
        objectives:
          - name: "30d"
            target: 95.0  # 95% of requests under 50ms
            window: "30d"
          - name: "7d"
            target: 97.0  # 97% of requests under 50ms
            window: "7d"
        alerting:
          burn_rates:
            - severity: "warning"
              short_window: "5m"
              long_window: "30m"
              burn_rate_threshold: 2.0

      # AI Agent Success Rate SLO - Critical Intelligence Operations
      - name: ai_agent_success_rate
        description: "AI agent operations 99.5% success rate"
        service: ai-swarm
        sli:
          query: |
            (
              sum(rate(ai_agent_operations_total{status="success"}[5m])) /
              sum(rate(ai_agent_operations_total[5m]))
            ) * 100
          threshold: 99.5
          unit: "percent"
        objectives:
          - name: "30d"
            target: 99.5
            window: "30d"
          - name: "24h"
            target: 99.8
            window: "24h"
        alerting:
          burn_rates:
            - severity: "critical"
              short_window: "2m"
              long_window: "1h"
              burn_rate_threshold: 14.4

      # Database Transaction Success SLO - Data Integrity
      - name: database_transaction_success
        description: "PostgreSQL transaction success 99.99% rate"
        service: postgres
        sli:
          query: |
            (
              sum(rate(postgres_transactions_committed_total[5m])) /
              sum(rate(postgres_transactions_total[5m]))
            ) * 100
          threshold: 99.99
          unit: "percent"
        objectives:
          - name: "30d"
            target: 99.99
            window: "30d"
        alerting:
          burn_rates:
            - severity: "critical"
              short_window: "1m"
              long_window: "5m"
              burn_rate_threshold: 20.0

      # Citizen Portal Response Time SLO - User Experience
      - name: citizen_portal_response_time
        description: "Citizen portal P90 response time under 200ms"
        service: citizen-portal
        sli:
          query: |
            histogram_quantile(0.90, 
              sum by (le) (
                rate(http_request_duration_seconds_bucket{job="citizen-portal"}[5m])
              )
            ) * 1000
          threshold: 200
          unit: "milliseconds"
        objectives:
          - name: "30d"
            target: 90.0  # 90% of requests under 200ms
            window: "30d"
        alerting:
          burn_rates:
            - severity: "warning"
              short_window: "10m"
              long_window: "1h"
              burn_rate_threshold: 3.0

---
# SLO Monitoring PrometheusRule
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: terrafusion-slo-rules
  namespace: terrafusion-observability
  labels:
    prometheus: terrafusion
    role: alert-rules
spec:
  groups:
  - name: terrafusion.slo.api_availability
    interval: 30s
    rules:
    - alert: TerraFusionAPIHighErrorRate
      expr: |
        (
          (
            sum(rate(http_requests_total{job="terrafusion-api", code=~"5.."}[2m])) /
            sum(rate(http_requests_total{job="terrafusion-api"}[2m]))
          ) > (14.4 * (1 - 0.999))
        ) and
        (
          (
            sum(rate(http_requests_total{job="terrafusion-api", code=~"5.."}[1h])) /
            sum(rate(http_requests_total{job="terrafusion-api"}[1h]))
          ) > (14.4 * (1 - 0.999))
        )
      for: 1m
      labels:
        severity: critical
        slo: api_availability
        service: terrafusion-api
        burn_rate: fast
      annotations:
        summary: "TerraFusion API availability SLO burn rate is too high"
        description: |
          The error rate for TerraFusion API is burning through the error budget too fast.
          Current error rate: {{ $value | humanizePercentage }}
          This will exhaust the monthly error budget in {{ with printf "vector(%.2f)" (1 / $value * 24) | query }}{{ . | first | value | humanizeDuration }}{{ end }}.
        runbook_url: "https://docs.terrafusion.gov/runbooks/api-availability"

    - alert: TerraFusionAPISlowBurn
      expr: |
        (
          (
            sum(rate(http_requests_total{job="terrafusion-api", code=~"5.."}[15m])) /
            sum(rate(http_requests_total{job="terrafusion-api"}[15m]))
          ) > (6.0 * (1 - 0.999))
        ) and
        (
          (
            sum(rate(http_requests_total{job="terrafusion-api", code=~"5.."}[1h])) /
            sum(rate(http_requests_total{job="terrafusion-api"}[1h]))
          ) > (6.0 * (1 - 0.999))
        )
      for: 5m
      labels:
        severity: warning
        slo: api_availability
        service: terrafusion-api
        burn_rate: slow
      annotations:
        summary: "TerraFusion API availability SLO slow burn detected"
        description: "The error rate for TerraFusion API is elevated and burning error budget."

  - name: terrafusion.slo.api_latency
    interval: 30s
    rules:
    - alert: TerraFusionAPIHighLatency
      expr: |
        histogram_quantile(0.95, 
          sum by (le) (
            rate(http_request_duration_seconds_bucket{job="terrafusion-api"}[5m])
          )
        ) * 1000 > 50
      for: 2m
      labels:
        severity: warning
        slo: api_latency
        service: terrafusion-api
      annotations:
        summary: "TerraFusion API latency SLO violation"
        description: |
          The P95 latency for TerraFusion API is {{ $value }}ms, exceeding the 50ms SLO.
          This affects government service delivery efficiency.

  - name: terrafusion.slo.ai_agents
    interval: 30s
    rules:
    - alert: AIAgentHighFailureRate
      expr: |
        (
          sum(rate(ai_agent_operations_total{status!="success"}[5m])) /
          sum(rate(ai_agent_operations_total[5m]))
        ) > 0.005  # 0.5% failure rate threshold
      for: 2m
      labels:
        severity: critical
        slo: ai_agent_success
        service: ai-swarm
      annotations:
        summary: "AI Agent failure rate exceeding SLO"
        description: |
          AI Agent failure rate is {{ $value | humanizePercentage }}, exceeding the 0.5% SLO.
          Current agent count: {{ with query "ai_agent_count" }}{{ . | first | value }}{{ end }}
          Failed operations may impact government service quality.

  - name: terrafusion.slo.database
    interval: 30s
    rules:
    - alert: DatabaseTransactionFailures
      expr: |
        (
          sum(rate(postgres_transaction_rollbacks_total[5m])) /
          sum(rate(postgres_transactions_total[5m]))
        ) > 0.0001  # 0.01% failure threshold
      for: 1m
      labels:
        severity: critical
        slo: database_transactions
        service: postgres
      annotations:
        summary: "Database transaction failure rate exceeding SLO"
        description: |
          PostgreSQL transaction failure rate is {{ $value | humanizePercentage }}.
          This may indicate database health issues requiring immediate attention.

---
# Error Budget Alert Manager Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: error-budget-config
  namespace: terrafusion-observability
data:
  config.yaml: |
    error_budgets:
      terrafusion_api_availability:
        slo_target: 99.9
        period: 30d
        alerting:
          fast_burn:
            threshold: 2    # 2% of budget in 1 hour
            window: 1h
            severity: critical
            channels: ["pagerduty", "slack-critical"]
          slow_burn:
            threshold: 10   # 10% of budget in 6 hours  
            window: 6h
            severity: warning
            channels: ["slack-alerts", "email"]
        
      ai_agent_success:
        slo_target: 99.5
        period: 30d
        alerting:
          fast_burn:
            threshold: 5    # 5% of budget in 2 hours
            window: 2h
            severity: critical
            channels: ["pagerduty", "slack-critical"]
        
    notification_channels:
      pagerduty:
        integration_key: "${PAGERDUTY_INTEGRATION_KEY}"
        severity_mapping:
          critical: "critical"
          warning: "warning"
      
      slack-critical:
        webhook_url: "${SLACK_CRITICAL_WEBHOOK}"
        channel: "#terrafusion-critical"
        username: "TerraFusion SLO Bot"
        
      slack-alerts:
        webhook_url: "${SLACK_ALERTS_WEBHOOK}"
        channel: "#terrafusion-alerts"
        username: "TerraFusion SLO Bot"
        
      email:
        smtp_server: "${SMTP_SERVER}"
        recipients: ["ops@terrafusion.gov", "sre@terrafusion.gov"]

---
# Grafana Dashboard for SLO Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-dashboard
  namespace: terrafusion-observability
  labels:
    grafana_dashboard: "1"
data:
  slo-dashboard.json: |
    {
      "dashboard": {
        "title": "TerraFusion SLO Dashboard - Government Service Excellence",
        "tags": ["slo", "government", "terrafusion"],
        "timezone": "utc",
        "refresh": "30s",
        "time": {
          "from": "now-24h",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "API Availability SLO",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"terrafusion-api\", code!~\"5..\"}[24h])) / sum(rate(http_requests_total{job=\"terrafusion-api\"}[24h])) * 100",
                "legendFormat": "Availability %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 99.0},
                    {"color": "green", "value": 99.9}
                  ]
                },
                "unit": "percent",
                "min": 99.0,
                "max": 100.0
              }
            }
          },
          {
            "id": 2,
            "title": "Error Budget Burn Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "sum(rate(http_requests_total{job=\"terrafusion-api\", code=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"terrafusion-api\"}[5m]))",
                "legendFormat": "Current Error Rate"
              }
            ]
          },
          {
            "id": 3,
            "title": "AI Agent Success Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(rate(ai_agent_operations_total{status=\"success\"}[24h])) / sum(rate(ai_agent_operations_total[24h])) * 100",
                "legendFormat": "Success Rate %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "yellow", "value": 99.0},
                    {"color": "green", "value": 99.5}
                  ]
                },
                "unit": "percent"
              }
            }
          }
        ]
      }
    }