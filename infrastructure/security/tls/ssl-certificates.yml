# TerraFusion OS - SSL/TLS Certificate Management
# GOVERNMENT-GRADE ENCRYPTION FOUNDATION
# Let's Encrypt + Cert-Manager Configuration

apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
# Cert-Manager Installation
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    installCRDs: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    webhook:
      securePort: 10260
    cainjector:
      securePort: 10261

---
# Let's Encrypt ClusterIssuer - Production
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@terrafusion.gov
    privateKeySecretRef:
      name: letsencrypt-prod-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
      selector:
        dnsNames:
        - "*.terrafusion.gov"
        - "terrafusion.gov"
    - dns01:
        cloudflare:
          email: dns-admin@terrafusion.gov
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: token
      selector:
        dnsNames:
        - "*.terrafusion.gov"
        - "terrafusion.gov"

---
# Let's Encrypt ClusterIssuer - Staging
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: security@terrafusion.gov
    privateKeySecretRef:
      name: letsencrypt-staging-private-key
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        cloudflare:
          email: dns-admin@terrafusion.gov
          apiTokenSecretRef:
            name: cloudflare-api-token
            key: token

---
# TerraFusion Main Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: terrafusion-tls
  namespace: terrafusion-system
spec:
  secretName: terrafusion-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - terrafusion.gov
  - www.terrafusion.gov
  - api.terrafusion.gov
  - dashboard.terrafusion.gov
  - vault.terrafusion.gov
  - grafana.terrafusion.gov
  - jaeger.terrafusion.gov
  - marketplace.terrafusion.gov
  - citizen.terrafusion.gov
  - admin.terrafusion.gov
  usages:
  - digital signature
  - key encipherment
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days

---
# API Certificate for Microservices
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-internal-tls
  namespace: terrafusion-system
spec:
  secretName: api-internal-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - "*.api.internal.terrafusion.gov"
  - api.internal.terrafusion.gov
  - gateway.internal.terrafusion.gov
  - property.internal.terrafusion.gov
  - citizen.internal.terrafusion.gov
  - ai.internal.terrafusion.gov
  - analytics.internal.terrafusion.gov
  usages:
  - digital signature
  - key encipherment
  duration: 2160h
  renewBefore: 360h

---
# NGINX Ingress Controller with SSL
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  namespace: terrafusion-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256,ECDHE-RSA-AES128-GCM-SHA256,ECDHE-ECDSA-AES256-GCM-SHA384,ECDHE-RSA-AES256-GCM-SHA384"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https:; frame-ancestors 'self';" always;
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - terrafusion.gov
    - www.terrafusion.gov
    - api.terrafusion.gov
    - dashboard.terrafusion.gov
    - marketplace.terrafusion.gov
    - citizen.terrafusion.gov
    secretName: terrafusion-tls-secret
  rules:
  - host: api.terrafusion.gov
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: terrafusion-api-gateway
            port:
              number: 5000
  - host: dashboard.terrafusion.gov
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: terrafusion-dashboard
            port:
              number: 3000
  - host: marketplace.terrafusion.gov
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: marketplace-frontend
            port:
              number: 3002
  - host: citizen.terrafusion.gov
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: citizen-portal
            port:
              number: 3004

---
# Security Policy for TLS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tls-security-policy
  namespace: terrafusion-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80  # Only for redirect to 443
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53   # DNS
    - protocol: UDP
      port: 53   # DNS

---
# Certificate Monitoring
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cert-manager-metrics
  namespace: cert-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
  endpoints:
  - port: tcp-prometheus-servicemonitor
    interval: 60s
    path: /metrics