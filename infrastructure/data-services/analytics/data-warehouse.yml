---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-network-policy
  namespace: terrafusion-analytics
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from TerraFusion services
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-system
    ports:
    - protocol: TCP
      port: 8088  # Superset
    - protocol: TCP
      port: 8123  # ClickHouse HTTP
  # Allow from Airflow namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-airflow
    ports:
    - protocol: TCP
      port: 5432  # TimescaleDB
    - protocol: TCP
      port: 8123  # ClickHouse HTTP
    - protocol: TCP
      port: 9000  # ClickHouse Native
  # Allow internal communication
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-analytics
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8123
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9009
    - protocol: TCP
      port: 8088
  egress:
  # Allow to external systems
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Allow to Kafka for data ingestion
  - to:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-streaming
    ports:
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 9093
  # Allow to Redis (in Airflow namespace)
  - to:
    - namespaceSelector:
        matchLabels:
          name: terrafusion-airflow
    ports:
    - protocol: TCP
      port: 6379