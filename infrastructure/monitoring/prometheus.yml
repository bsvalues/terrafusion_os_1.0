global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:\${{TF_PROMETHEUS_PORT:-9090}}"]

  # Scrape TerraFusion backend metrics
  - job_name: "terrafusion-backend"
    static_configs:
      - targets: ["backend:${TF_STATIC_PORT:-8080}"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # Document Processor Services
  - job_name: "document-processor"
    static_configs:
      - targets: 
        - "document-processor-api-gateway-1:8000"
        - "document-processor-processor-1:${TF_STATIC_PORT:-8080}"
        - "document-processor-ocr-1:8081"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # MCP Servers
  - job_name: "mcp-servers"
    static_configs:
      - targets:
        - "mcp-servers-mcp-document-server-1:${TF_STATIC_PORT:-8080}"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # GraphQL Federation
  - job_name: "graphql-federation"
    static_configs:
      - targets:
        - "graphql-federation-schema-registry-1:4005"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # Infrastructure Services
  - job_name: "infrastructure-redis"
    static_configs:
      - targets:
        - "document-processor-redis-1:6379"
        - "graphql-federation-redis-1:6379"
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Node Exporter for system metrics
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  # cAdvisor for container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:${TF_STATIC_PORT:-8080}"]
    scrape_interval: 15s

  # Scrape Kubernetes metrics
  - job_name: "kubernetes-apiservers"
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels:
          [
            __meta_kubernetes_namespace,
            __meta_kubernetes_service_name,
            __meta_kubernetes_endpoint_port_name,
          ]
        action: keep
        regex: default;kubernetes;https

  # Scrape node metrics
  - job_name: "kubernetes-nodes"
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # Scrape pod metrics
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels:
          [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/alerts/*.yml"
