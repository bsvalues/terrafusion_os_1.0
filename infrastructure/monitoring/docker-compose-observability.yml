# TerraFusion OS Observability Stack Docker Compose Configuration
# PhD-Level APM Infrastructure with OpenTelemetry Integration
# Comprehensive Monitoring for Government Property Assessment Systems

version: '3.8'

services:
  # ===========================================================================
  # OPENTELEMETRY COLLECTOR - TELEMETRY DATA PROCESSING
  # ===========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.88.0
    container_name: terrafusion-otel-collector
    restart: unless-stopped
    
    command: ["--config=/etc/otel/config.yml", "--log-level=info"]
    
    volumes:
      # OpenTelemetry configuration
      - ./config/opentelemetry/otel-collector.yml:/etc/otel/config.yml:ro
      
      # SSL certificates for government compliance
      - ./ssl/certs/otel-collector.crt:/etc/ssl/certs/otel-collector.crt:ro
      - ./ssl/private/otel-collector.key:/etc/ssl/private/otel-collector.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      - ./ssl/certs/jaeger-client.crt:/etc/ssl/certs/jaeger-client.crt:ro
      - ./ssl/private/jaeger-client.key:/etc/ssl/private/jaeger-client.key:ro
      
      # Log storage for government audit compliance
      - otel_logs:/var/log/otel
      
      # Temporary data storage
      - otel_data:/tmp/otel-data
      
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8889:8889"    # Prometheus metrics
      - "8888:8888"    # OTel Collector metrics
      - "13133:13133"  # Health check
      - "1777:1777"    # pprof
      - "55679:55679"  # zpages
      - "9411:9411"    # Zipkin receiver
      - "14250:14250"  # Jaeger gRPC receiver
      - "14268:14268"  # Jaeger HTTP receiver
      - "6831:6831/udp" # Jaeger compact
      - "6832:6832/udp" # Jaeger binary
      
    networks:
      - terrafusion-network
      
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=otel-collector,service.version=0.88.0,environment=production
      - GOMEMLIMIT=2048MiB
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
          
    security_opt:
      - no-new-privileges:true
      
    labels:
      - "component=observability"
      - "role=telemetry-collector"
      - "environment=production"
      - "compliance=government-grade"

  # ===========================================================================
  # JAEGER - DISTRIBUTED TRACING
  # ===========================================================================
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:1.50
    container_name: terrafusion-jaeger
    restart: unless-stopped
    
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=https://elasticsearch:9200
      - ES_USERNAME=jaeger
      - ES_PASSWORD=TF_Jaeger_ES_2025_Secure!
      - ES_TLS_ENABLED=true
      - ES_TLS_CERT=/etc/ssl/certs/jaeger-es.crt
      - ES_TLS_KEY=/etc/ssl/private/jaeger-es.key
      - ES_TLS_CA=/etc/ssl/certs/elasticsearch-ca.crt
      - QUERY_BASE_PATH=/jaeger
      - JAEGER_ADMIN_HTTP_HOST_PORT=:14269
      
    volumes:
      - ./ssl/certs/jaeger-es.crt:/etc/ssl/certs/jaeger-es.crt:ro
      - ./ssl/private/jaeger-es.key:/etc/ssl/private/jaeger-es.key:ro
      - ./ssl/certs/elasticsearch-ca.crt:/etc/ssl/certs/elasticsearch-ca.crt:ro
      
    ports:
      - "16686:16686"  # Jaeger UI
      - "14269:14269"  # Admin port
      
    networks:
      - terrafusion-network
      
    depends_on:
      - elasticsearch
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
          
    labels:
      - "component=observability"
      - "role=tracing"
      - "environment=production"

  # ===========================================================================
  # PROMETHEUS - METRICS COLLECTION AND STORAGE
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: terrafusion-prometheus
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=http://localhost:9090/prometheus'
      - '--web.route-prefix=/prometheus'
      - '--log.level=info'
      
    volumes:
      # Prometheus configuration
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert-rules:/etc/prometheus/rules:ro
      
      # Data storage
      - prometheus_data:/prometheus
      
      # SSL certificates
      - ./ssl/certs/prometheus.crt:/etc/ssl/certs/prometheus.crt:ro
      - ./ssl/private/prometheus.key:/etc/ssl/private/prometheus.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      
    ports:
      - "9090:9090"
      
    networks:
      - terrafusion-network
      
    user: "65534:65534"
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          
    labels:
      - "component=observability"
      - "role=metrics-storage"
      - "environment=production"

  # ===========================================================================
  # GRAFANA - VISUALIZATION AND DASHBOARDS
  # ===========================================================================
  grafana:
    image: grafana/grafana-enterprise:10.2.0
    container_name: terrafusion-grafana
    restart: unless-stopped
    
    environment:
      # Security configuration for government compliance
      - GF_SECURITY_ADMIN_PASSWORD=TF_Grafana_Admin_2025_Secure!
      - GF_SECURITY_SECRET_KEY=TF_Grafana_Secret_2025_Very_Long_Random_Key!
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=strict
      - GF_SECURITY_STRICT_TRANSPORT_SECURITY=true
      
      # Server configuration
      - GF_SERVER_DOMAIN=grafana.terrafusion.gov
      - GF_SERVER_ROOT_URL=https://grafana.terrafusion.gov/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/ssl/certs/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/ssl/private/grafana.key
      
      # Database configuration
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=terrafusion-db-primary:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=TF_Grafana_DB_2025_Secure!
      - GF_DATABASE_SSL_MODE=require
      
      # Authentication
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_DISABLE_SIGNOUT_MENU=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      
      # Government compliance settings
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/terrafusion-overview.json
      
      # Plugin configuration
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-worldmap-panel,grafana-piechart-panel
      
    volumes:
      # Configuration
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/dashboard-definitions:/etc/grafana/dashboards:ro
      
      # Data storage
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
      
      # SSL certificates
      - ./ssl/certs/grafana.crt:/etc/ssl/certs/grafana.crt:ro
      - ./ssl/private/grafana.key:/etc/ssl/private/grafana.key:ro
      - ./ssl/certs/terrafusion-ca.crt:/etc/ssl/certs/terrafusion-ca.crt:ro
      
    ports:
      - "3000:3000"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - prometheus
      - terrafusion-db-primary
      
    user: "472:472"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
          
    labels:
      - "component=observability"
      - "role=visualization"
      - "environment=production"

  # ===========================================================================
  # ELASTICSEARCH - LOG STORAGE AND SEARCH
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: terrafusion-elasticsearch
    restart: unless-stopped
    
    environment:
      - node.name=terrafusion-elasticsearch
      - cluster.name=terrafusion-logs
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.http.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/elasticsearch-ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/certs/elasticsearch.key
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/certs/elasticsearch.crt
      - xpack.security.transport.ssl.certificate_authorities=/usr/share/elasticsearch/config/certs/elasticsearch-ca.crt
      - ELASTIC_PASSWORD=TF_Elastic_Super_2025_Secure!
      
    volumes:
      # Data storage
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_logs:/usr/share/elasticsearch/logs
      
      # Configuration
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      
      # SSL certificates
      - ./ssl/certs/elasticsearch.crt:/usr/share/elasticsearch/config/certs/elasticsearch.crt:ro
      - ./ssl/private/elasticsearch.key:/usr/share/elasticsearch/config/certs/elasticsearch.key:ro
      - ./ssl/certs/elasticsearch-ca.crt:/usr/share/elasticsearch/config/certs/elasticsearch-ca.crt:ro
      
    ports:
      - "9200:9200"
      - "9300:9300"
      
    networks:
      - terrafusion-network
      
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
        
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "-u", "elastic:TF_Elastic_Super_2025_Secure!", "https://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 3G
          
    labels:
      - "component=observability"
      - "role=log-storage"
      - "environment=production"

  # ===========================================================================
  # KIBANA - LOG VISUALIZATION
  # ===========================================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: terrafusion-kibana
    restart: unless-stopped
    
    environment:
      - SERVERNAME=kibana.terrafusion.gov
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=TF_Kibana_ES_2025_Secure!
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/certs/elasticsearch-ca.crt
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/certs/kibana.crt
      - SERVER_SSL_KEY=/usr/share/kibana/config/certs/kibana.key
      - SERVER_PUBLICBASEURL=https://kibana.terrafusion.gov
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=TF_Kibana_Encryption_2025_Very_Long_Random_Key_32_Chars_Plus!
      - XPACK_REPORTING_ENCRYPTIONKEY=TF_Kibana_Reporting_2025_Very_Long_Random_Key_32_Chars_Plus!
      - XPACK_SECURITY_ENCRYPTIONKEY=TF_Kibana_Security_2025_Very_Long_Random_Key_32_Chars_Plus!
      
    volumes:
      # Configuration
      - ./config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      
      # SSL certificates
      - ./ssl/certs/kibana.crt:/usr/share/kibana/config/certs/kibana.crt:ro
      - ./ssl/private/kibana.key:/usr/share/kibana/config/certs/kibana.key:ro
      - ./ssl/certs/elasticsearch-ca.crt:/usr/share/kibana/config/certs/elasticsearch-ca.crt:ro
      
      # Data storage
      - kibana_data:/usr/share/kibana/data
      
    ports:
      - "5601:5601"
      
    networks:
      - terrafusion-network
      
    depends_on:
      - elasticsearch
      
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:5601/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
          
    labels:
      - "component=observability"
      - "role=log-visualization"
      - "environment=production"

  # ===========================================================================
  # ALERTMANAGER - ALERT HANDLING
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: terrafusion-alertmanager
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093/alertmanager'
      - '--web.route-prefix=/alertmanager'
      - '--log.level=info'
      
    volumes:
      # Configuration
      - ./config/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - ./config/alertmanager/templates:/etc/alertmanager/templates:ro
      
      # Data storage
      - alertmanager_data:/alertmanager
      
    ports:
      - "9093:9093"
      
    networks:
      - terrafusion-network
      
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/alertmanager/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
          
    labels:
      - "component=observability"
      - "role=alerting"
      - "environment=production"

# ===========================================================================
# PERSISTENT VOLUMES
# ===========================================================================
volumes:
  otel_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/otel
      
  otel_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/otel
      
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/prometheus
      
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/grafana
      
  grafana_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/grafana
      
  elasticsearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/elasticsearch
      
  elasticsearch_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs/elasticsearch
      
  kibana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/kibana
      
  alertmanager_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/alertmanager

# ===========================================================================
# NETWORK CONFIGURATION
# ===========================================================================
networks:
  terrafusion-network:
    external: true