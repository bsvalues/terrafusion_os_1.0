# TerraFusion OS Prometheus Configuration
# Government-grade monitoring for 1,008 AI agents and 39 modules

prometheus:
  prometheusSpec:
    # Resource allocation for enterprise monitoring
    resources:
      limits:
        cpu: 4000m
        memory: 16Gi
      requests:
        cpu: 2000m
        memory: 8Gi
    
    # Retention configuration for compliance
    retention: 30d
    retentionSize: 100GB
    
    # Storage configuration
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 200Gi
    
    # High availability configuration
    replicas: 2
    
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
    
    # Service monitor selector to scrape all TerraFusion services
    serviceMonitorSelector:
      matchLabels:
        app.kubernetes.io/part-of: terrafusion
    
    # Pod monitor selector for detailed pod metrics
    podMonitorSelector:
      matchLabels:
        app.kubernetes.io/part-of: terrafusion
    
    # Rule selector for custom alerting rules
    ruleSelector:
      matchLabels:
        app.kubernetes.io/part-of: terrafusion
    
    # Scrape configuration for TerraFusion components
    additionalScrapeConfigs:
      - job_name: 'terrafusion-api'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - terrafusion-production
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
      
      - job_name: 'terrafusion-ai-swarm'
        static_configs:
          - targets: ['ai-swarm-service:${TF_STATIC_PORT:-8080}']
        scrape_interval: 15s
        metrics_path: '/metrics'
        params:
          agent_count: ['1008']
        
      - job_name: 'terrafusion-modules'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - terrafusion-modules
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
    
    # External labels for federation
    externalLabels:
      cluster: terrafusion-production
      region: us-west-2
      environment: production
    
    # Remote write configuration for long-term storage
    remoteWrite:
      - url: "https://prometheus-remote-write.terrafusion.gov/api/v1/write"
        name: "terrafusion-remote-storage"
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "terrafusion_.*|kubernetes_.*|node_.*"
            action: keep
        queueConfig:
          maxSamplesPerSend: 10000
          maxShards: 200
          capacity: 50000
    
    # Alertmanager configuration
    alerting:
      alertmanagers:
        - namespace: monitoring
          name: alertmanager-main
          port: web

# Grafana configuration
grafana:
  enabled: true
  
  # Admin credentials
  adminPassword: "terrafusion-grafana-admin"
  
  # Resource allocation
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  
  # Persistence for dashboards and configuration
  persistence:
    enabled: true
    size: 50Gi
    storageClassName: gp3-retain
  
  # Grafana configuration
  grafana.ini:
    server:
      root_url: https://monitoring.terrafusion.gov/grafana
      serve_from_sub_path: true
    security:
      cookie_secure: true
      strict_transport_security: true
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    log:
      mode: console
      level: info
    database:
      type: postgres
      host: postgresql-grafana:5432
      name: grafana
      user: grafana
      password: grafana-db-password
  
  # Data sources configuration
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: TerraFusion Prometheus
          type: prometheus
          url: http://prometheus-operated:9090
          access: proxy
          isDefault: true
          jsonData:
            timeInterval: 30s
            queryTimeout: 60s
        - name: TerraFusion Logs
          type: loki
          url: http://loki:3100
          access: proxy
          jsonData:
            maxLines: 5000
        - name: TerraFusion Metrics DB
          type: postgres
          url: postgresql-metrics:5432
          database: terrafusion_metrics
          user: metrics_reader
          jsonData:
            sslmode: require
            postgresVersion: 1500
  
  # Dashboard providers
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'terrafusion-dashboards'
          orgId: 1
          folder: 'TerraFusion'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 10
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/terrafusion
        - name: 'government-compliance'
          orgId: 1
          folder: 'Compliance'
          type: file
          disableDeletion: false
          updateIntervalSeconds: 10
          options:
            path: /var/lib/grafana/dashboards/compliance
  
  # Dashboard definitions
  dashboards:
    terrafusion:
      terrafusion-overview:
        gnetId: 15760
        revision: 1
        datasource: TerraFusion Prometheus
      ai-swarm-monitoring:
        file: dashboards/ai-swarm-dashboard.json
      module-health:
        file: dashboards/module-health-dashboard.json
      government-compliance:
        file: dashboards/compliance-dashboard.json
      performance-metrics:
        file: dashboards/performance-dashboard.json
  
  # Plugins
  plugins:
    - grafana-piechart-panel
    - grafana-worldmap-panel
    - grafana-clock-panel
    - grafana-simple-json-datasource
    - marcusolsson-treemap-panel
    - vonage-status-panel
  
  # RBAC and security
  rbac:
    create: true
    pspEnabled: true
  
  serviceAccount:
    create: true
    name: grafana

# Alertmanager configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    # High availability
    replicas: 2
    
    # Resources
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
    
    # Storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    
    # Configuration
    configSecret: alertmanager-config
    
    # External URL
    externalUrl: https://monitoring.terrafusion.gov/alertmanager
    
    # Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534

# Node Exporter configuration
nodeExporter:
  enabled: true
  
  # Service monitor
  serviceMonitor:
    enabled: true
    interval: 30s
  
  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 30Mi

# Kube State Metrics
kubeStateMetrics:
  enabled: true
  
  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Prometheus Operator
prometheusOperator:
  enabled: true
  
  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi
  
  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534

# Service Monitors for TerraFusion components
additionalServiceMonitors:
  - name: terrafusion-api-metrics
    selector:
      matchLabels:
        app: terrafusion-api
    endpoints:
      - port: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s
        honorLabels: true
  
  - name: terrafusion-frontend-metrics
    selector:
      matchLabels:
        app: terrafusion-frontend
    endpoints:
      - port: http
        path: /metrics
        interval: 60s
  
  - name: terrafusion-ai-swarm-metrics
    selector:
      matchLabels:
        app: terrafusion-ai-swarm
    endpoints:
      - port: metrics
        path: /metrics
        interval: 15s
        params:
          agent_metrics: ['true']

# Prometheus Rules for TerraFusion specific alerting
additionalPrometheusRules:
  - name: terrafusion-alerts
    groups:
      - name: terrafusion.rules
        interval: 30s
        rules:
          - alert: TerraFusionAPIDown
            expr: up{job="terrafusion-api"} == 0
            for: 1m
            labels:
              severity: critical
              service: api
            annotations:
              summary: "TerraFusion API is down"
              description: "TerraFusion API has been down for more than 1 minute."
          
          - alert: AISwarmAgentCountLow
            expr: terrafusion_ai_agents_active < 1000
            for: 5m
            labels:
              severity: warning
              service: ai-swarm
            annotations:
              summary: "AI Swarm agent count is below threshold"
              description: "Only {{ $value }} AI agents are active, expected 1008."
          
          - alert: ModuleHealthDegraded
            expr: terrafusion_module_health_score < 0.9
            for: 10m
            labels:
              severity: warning
              service: modules
            annotations:
              summary: "Module health degraded"
              description: "Module {{ $labels.module_name }} health score is {{ $value }}."
          
          - alert: DatabaseConnectionHigh
            expr: terrafusion_db_connections_active / terrafusion_db_connections_max > 0.8
            for: 5m
            labels:
              severity: warning
              service: database
            annotations:
              summary: "High database connection usage"
              description: "Database connection usage is at {{ $value | humanizePercentage }}."
          
          - alert: ComplianceAuditLogGap
            expr: increase(terrafusion_audit_logs_total[5m]) < 10
            for: 15m
            labels:
              severity: critical
              service: compliance
            annotations:
              summary: "FISMA compliance: Audit log gap detected"
              description: "Audit logs have not been generated for 15 minutes."

# Network policies for security
networkPolicy:
  enabled: true
  flavor: kubernetes