apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terrafusion-api
  namespace: argocd
  labels:
    app.kubernetes.io/name: terrafusion-api
    app.kubernetes.io/part-of: terrafusion-os
    app.kubernetes.io/component: backend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: terrafusion-production
  
  source:
    repoURL: https://github.com/terrafusion/terrafusion-os
    targetRevision: HEAD
    path: infrastructure/helm/terrafusion-api
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
      parameters:
        - name: image.tag
          value: $ARGOCD_APP_SOURCE_TARGET_REVISION
        - name: app.environment
          value: production
        - name: replicaCount
          value: "3"
        - name: resources.requests.cpu
          value: "1000m"
        - name: resources.requests.memory
          value: "2Gi"
        - name: resources.limits.cpu
          value: "4000m"
        - name: resources.limits.memory
          value: "8Gi"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "20"
        - name: postgresql.enabled
          value: "false"  # Use external RDS
        - name: redis.enabled
          value: "false"   # Use external ElastiCache
  
  destination:
    server: https://kubernetes.default.svc
    namespace: terrafusion-production
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  revisionHistoryLimit: 10
  
  # Health checks for custom resources
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
  
  # Custom health checks
  info:
    - name: API Health
      value: https://api.terrafusion.gov/health
    - name: Metrics
      value: https://api.terrafusion.gov/metrics
    - name: AI Agents
      value: "1008 active agents"
    - name: Modules
      value: "39 government modules"