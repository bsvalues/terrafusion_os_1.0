# TerraFusion OS HAProxy Prometheus Exporter Configuration
# Government-grade monitoring and metrics collection

version: '3.8'

services:
  haproxy-exporter:
    image: quay.io/prometheus/haproxy-exporter:v0.15.0
    container_name: terrafusion-haproxy-exporter
    restart: unless-stopped
    
    # Command line options for HAProxy stats
    command:
      - '--haproxy.scrape-uri=http://admin:${HAPROXY_STATS_PASSWORD}@haproxy:8404/stats?stats;csv'
      - '--haproxy.timeout=5s'
      - '--web.listen-address=:9101'
      - '--web.telemetry-path=/metrics'
      - '--log.level=info'
    
    ports:
      - "9101:9101"
    
    networks:
      - terrafusion-network
    
    depends_on:
      - haproxy
    
    # Health check for the exporter
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits for government compliance
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    
    # Labels for monitoring
    labels:
      - "monitoring=prometheus"
      - "service=haproxy-exporter"
      - "component=load-balancer"
      - "environment=production"
      - "compliance=government-grade"

networks:
  terrafusion-network:
    external: true