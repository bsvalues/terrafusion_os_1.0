apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: terrafusion
data:
  redis.conf: |
    # Redis Cluster Configuration for TerraFusion OS
    cluster-enabled yes
    cluster-config-file nodes.conf
    cluster-node-timeout 15000
    cluster-announce-ip ${POD_IP}
    cluster-announce-port \${{TF_REDIS_PORT:-6379}}
    cluster-announce-bus-port \${{TF_REDIS_PORT:-6379}}
    
    # Memory and persistence
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    
    # Security
    requirepass ${REDIS_PASSWORD}
    masterauth ${REDIS_PASSWORD}
    
    # Logging
    loglevel notice
    logfile /var/log/redis/redis.log
    
    # Network
    bind 0.0.0.0
    port \${{TF_REDIS_PORT:-6379}}
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    
    # Performance tuning
    databases 16
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    
    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    repl-diskless-sync-delay 5
    
    # Append only file
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster
  namespace: terrafusion
  labels:
    app: redis-cluster
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: client
  - port: 16379
    targetPort: 16379
    name: gossip
  clusterIP: None
  selector:
    app: redis-cluster

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cluster
  namespace: terrafusion
spec:
  serviceName: redis-cluster
  replicas: 6
  selector:
    matchLabels:
      app: redis-cluster
  template:
    metadata:
      labels:
        app: redis-cluster
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        ports:
        - containerPort: 6379
          name: client
        - containerPort: 16379
          name: gossip
        command:
        - redis-server
        args:
        - /etc/redis/redis.conf
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: REDIS_PASSWORD
          valueFrom:
            secretRef:
              name: redis-secret
              key: password
        volumeMounts:
        - name: conf
          mountPath: /etc/redis/
          readOnly: false
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /var/log/redis
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3
      volumes:
      - name: conf
        configMap:
          name: redis-cluster-config
          defaultMode: 0755
      - name: logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: terrafusion
type: Opaque
data:
  password: VGVycmFGdXNpb25SZWRpc0NsdXN0ZXIyMDI1IQ== # TerraFusionRedisCluster2025!

---
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: terrafusion
spec:
  template:
    spec:
      containers:
      - name: redis-cluster-init
        image: redis:7.2-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for Redis pods to be ready..."
          sleep 30
          
          # Get pod IPs
          REDIS_NODES=""
          for i in $(seq 0 5); do
            POD_IP=$(nslookup redis-cluster-${i}.redis-cluster.terrafusion.svc.cluster.local | grep Address | tail -1 | awk '{print $2}')
            REDIS_NODES="${REDIS_NODES} ${POD_IP}:6379"
          done
          
          echo "Creating Redis cluster with nodes: ${REDIS_NODES}"
          
          # Create cluster
          redis-cli -a ${REDIS_PASSWORD} --cluster create ${REDIS_NODES} --cluster-replicas 1 --cluster-yes
          
          echo "Redis cluster created successfully!"
          
          # Verify cluster
          redis-cli -h redis-cluster-0.redis-cluster.terrafusion.svc.cluster.local -a ${REDIS_PASSWORD} cluster info
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretRef:
              name: redis-secret
              key: password
      restartPolicy: OnFailure
  backoffLimit: 3

---
apiVersion: v1
kind: Service
metadata:
  name: redis-cluster-lb
  namespace: terrafusion
  labels:
    app: redis-cluster
spec:
  type: LoadBalancer
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis-cluster

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-cluster-monitor
  namespace: terrafusion
  labels:
    app: redis-cluster
spec:
  selector:
    matchLabels:
      app: redis-cluster
  endpoints:
  - port: client
    interval: 30s
    path: /metrics

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-cluster-pdb
  namespace: terrafusion
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: redis-cluster

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-cluster-netpol
  namespace: terrafusion
spec:
  podSelector:
    matchLabels:
      app: redis-cluster
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: terrafusion
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: terrafusion
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 16379
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
