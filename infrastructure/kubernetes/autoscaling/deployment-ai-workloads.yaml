apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-government-api
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
    component: government-workload
    tier: api
spec:
  replicas: 5
  selector:
    matchLabels:
      app: terrafusion-api
      component: government-workload
  template:
    metadata:
      labels:
        app: terrafusion-api
        component: government-workload
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: government-api-container
        image: terrafusion/government-api:v1.0.0
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 5000
          name: api
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: GOVERNMENT_COMPLIANCE
          value: "FISMA,NIST,SOC2"
        - name: AI_INTEGRATION_ENABLED
          value: "true"
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
