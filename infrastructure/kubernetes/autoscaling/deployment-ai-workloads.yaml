apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-probabilistic-engine
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: probabilistic-engine
    tier: ai-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terrafusion-ai
      component: probabilistic-engine
  template:
    metadata:
      labels:
        app: terrafusion-ai
        component: probabilistic-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: probabilistic-engine-container
        image: terrafusion/probabilistic-engine:v1.0.0
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: PBIT_RATE_TARGET
          value: "1000"
        - name: UNCERTAINTY_THRESHOLD
          value: "0.05"
        - name: ACCURACY_TARGET
          value: "97"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 8
            memory: 24Gi
        livenessProbe:
          httpGet:
            path: /probabilistic/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /probabilistic/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

