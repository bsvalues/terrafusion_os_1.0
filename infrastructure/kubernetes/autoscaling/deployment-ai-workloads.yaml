apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-omniscient-orchestrator
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: omniscient-orchestrator
    tier: ai-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terrafusion-ai
      component: omniscient-orchestrator
  template:
    metadata:
      labels:
        app: terrafusion-ai
        component: omniscient-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: omniscient-orchestrator-container
        image: terrafusion/omniscient-orchestrator:v1.0.0
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 5000
          name: api
        env:
        - name: FRACTAL_HIERARCHY_LEVELS
          value: "7"
        - name: AGENT_CAPACITY
          value: "1000000"
        - name: OMNISCIENCE_MODE
          value: "enabled"
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 12
            memory: 48Gi
        livenessProbe:
          httpGet:
            path: /omniscient/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /omniscient/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

