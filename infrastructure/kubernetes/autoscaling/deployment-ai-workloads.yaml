apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-ai-swarm
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: swarm-intelligence
    tier: ai-workload
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terrafusion-ai
      component: swarm-intelligence
  template:
    metadata:
      labels:
        app: terrafusion-ai
        component: swarm-intelligence
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: ai-swarm-container
        image: terrafusion/ai-swarm:v1.0.0
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 9090
          name: ai-metrics
        env:
        - name: SWARM_SIZE
          value: "1000"
        - name: OPTIMIZATION_TARGET
          value: "revenue"
        - name: QUANTUM_ENHANCED
          value: "true"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 8
            memory: 32Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: swarm-coordinator
        image: terrafusion/swarm-coordinator:v1.0.0
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 8Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-quantum-engine
  namespace: terrafusion-system
  labels:
    app: terrafusion-ai
    component: quantum-engine
    tier: ai-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terrafusion-ai
      component: quantum-engine
  template:
    metadata:
      labels:
        app: terrafusion-ai
        component: quantum-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
      - name: quantum-engine-container
        image: terrafusion/quantum-engine:v1.0.0
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: QUANTUM_BITS
          value: "50"
        - name: SPEEDUP_TARGET
          value: "379000000"
        - name: ENTANGLEMENT_ENABLED
          value: "true"
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 16
            memory: 64Gi
        livenessProbe:
          httpGet:
            path: /quantum/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /quantum/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      - name: quantum-accelerator
        image: terrafusion/quantum-accelerator:v1.0.0
        resources:
          requests:
            cpu: 2
            memory: 4Gi
          limits:
            cpu: 32
            memory: 128Gi

