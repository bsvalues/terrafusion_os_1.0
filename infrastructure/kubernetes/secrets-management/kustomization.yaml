apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - consul.yaml
  - vault.yaml
  - vault-injector.yaml
  - sealed-secrets.yaml
  - external-secrets.yaml

configMapGenerator:
  - name: vault-scripts
    files:
      - vault-init.sh
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: vault-tls
    files:
      - tls.crt=certs/vault.crt
      - tls.key=certs/vault.key
      - ca.crt=certs/ca.crt
    type: Opaque
    options:
      disableNameSuffixHash: true
  
  - name: consul-tls
    files:
      - tls.crt=certs/consul.crt
      - tls.key=certs/consul.key
      - ca.crt=certs/ca.crt
    type: Opaque
    options:
      disableNameSuffixHash: true
  
  - name: vault-kms
    literals:
      - key-id=${VAULT_KMS_KEY_ID}
    type: Opaque
    options:
      disableNameSuffixHash: true

patches:
  # Increase Vault resources for production
  - target:
      kind: StatefulSet
      name: vault
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 2000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
  
  # Add PodDisruptionBudget for Vault
  - target:
      kind: StatefulSet
      name: vault
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: vault-pdb
        namespace: vault
      spec:
        minAvailable: 3
        selector:
          matchLabels:
            app: vault
  
  # Add PodDisruptionBudget for Consul
  - target:
      kind: StatefulSet
      name: consul
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: consul-pdb
        namespace: vault
      spec:
        minAvailable: 2
        selector:
          matchLabels:
            app: consul

patchesStrategicMerge:
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: vault
      namespace: vault
    spec:
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800

commonLabels:
  cosmic-platform: "terrafusion"
  cosmic-component: "secrets-management"
  cosmic-tier: "security"

commonAnnotations:
  terrafusion.io/version: "1.0.0"
  terrafusion.io/managed-by: "cosmic-orchestrator"

replicas:
  - name: vault
    count: 5
  - name: consul
    count: 5
  - name: vault-agent-injector
    count: 3

images:
  - name: vault
    newTag: "1.14.1"
  - name: consul
    newTag: "1.16.1"
  - name: hashicorp/vault-k8s
    newTag: "1.2.1"
  - name: bitnami/sealed-secrets-controller
    newTag: "0.24.0"
  - name: ghcr.io/external-secrets/external-secrets
    newTag: "v0.9.0"

nameSuffix: -cosmic