  name: sealed-secrets-examples
  namespace: sealed-secrets
data:
  database-sealed.yaml: |
    apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: database-credentials
      namespace: terrafusion-cosmic
    spec:
      encryptedData:
        username: AgBvKZ1... # Encrypted value
        password: AgCmKp2... # Encrypted value
        url: AgDnLq3... # Encrypted value
      template:
        type: Opaque
        metadata:
          name: database-credentials
          labels:
            cosmic-level: "restricted"
            managed-by: "sealed-secrets"
  
  cosmic-keys-sealed.yaml: |
