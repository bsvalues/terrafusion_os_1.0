            cosmic-level: "omniscient"
            encryption: "quantum"
  
  interplanetary-creds-sealed.yaml: |
    apiVersion: bitnami.com/v1alpha1
    kind: SealedSecret
    metadata:
      name: interplanetary-credentials
      namespace: terrafusion-cosmic
    spec:
      encryptedData:
        mars-relay-key: AgBaBC1... # Encrypted value
        moon-station-token: AgCbCD2... # Encrypted value
        satellite-auth: AgDcDE3... # Encrypted value
      template:
