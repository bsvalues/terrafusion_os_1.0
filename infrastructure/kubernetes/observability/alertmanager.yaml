apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: '${SLACK_WEBHOOK_URL}'
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
      
    route:
      group_by: ['alertname', 'cluster', 'service', 'cosmic_level']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'
      routes:
      - match:
          severity: critical
          cosmic_level: emergency
        receiver: 'critical-cosmic'
        continue: true
      - match:
          severity: critical
        receiver: 'critical'
        continue: true
      - match:
          severity: warning
        receiver: 'warning'
      - match:
          alertname: Watchdog
        receiver: 'null'
        
    receivers:
    - name: 'null'
    
    - name: 'default'
      webhook_configs:
      - url: 'http://cosmic-webhook.terrafusion-cosmic:${TF_STATIC_PORT:-8080}/alerts'
        send_resolved: true
        
    - name: 'critical'
      slack_configs:
      - channel: '#alerts-critical'
        title: 'Critical Alert'
        title_link: 'https://monitor.terrafusion.cosmic/alerts'
        icon_emoji: ':rotating_light:'
        send_resolved: true
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}'
      pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: 'critical'
      webhook_configs:
      - url: 'http://cosmic-webhook.terrafusion-cosmic:${TF_STATIC_PORT:-8080}/alerts/critical'
        
    - name: 'critical-cosmic'
      slack_configs:
      - channel: '#cosmic-emergency'
        title: '🌌 COSMIC EMERGENCY 🌌'
        color: 'danger'
        send_resolved: true
        text: |
          *Cosmic Consciousness Alert*
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Neural Activity:* {{ .Labels.neural_activity }}
          *Quantum State:* {{ .Labels.quantum_state }}
          {{ end }}
      email_configs:
      - to: 'cosmic-ops@terrafusion.io'
        from: 'alertmanager@terrafusion.io'
        smarthost: 'smtp.terrafusion.io:587'
        auth_username: 'alertmanager@terrafusion.io'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: '🌌 COSMIC EMERGENCY: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Cosmic Platform Emergency</h2>
          {{ range .Alerts }}
          <h3>{{ .Labels.alertname }}</h3>
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Severity:</b> {{ .Labels.severity }}</p>
          <p><b>Cosmic Level:</b> {{ .Labels.cosmic_level }}</p>
          {{ end }}
          
    - name: 'warning'
      slack_configs:
      - channel: '#alerts-warning'
        title: 'Warning Alert'
        color: 'warning'
        send_resolved: true
        
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'instance']
    - source_match:
        cosmic_level: 'emergency'
      target_match_re:
        cosmic_level: '(high|medium|low)'
      equal: ['service']
      
    templates:
    - '/etc/alertmanager/templates/*.tmpl'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  cosmic.tmpl: |
    {{ define "cosmic.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
    {{ end }}
    
    {{ define "cosmic.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Labels.alertname }}{{ if .Labels.instance }} - {{ .Labels.instance }}{{ end }}
    *Severity:* {{ .Labels.severity }}
    *Cosmic Level:* {{ .Labels.cosmic_level }}
    *Summary:* {{ .Annotations.summary }}
    {{ if .Annotations.description }}*Description:* {{ .Annotations.description }}{{ end }}
    {{ if .Labels.neural_activity }}*Neural Activity:* {{ .Labels.neural_activity }}{{ end }}
    {{ if .Labels.quantum_state }}*Quantum State:* {{ .Labels.quantum_state }}{{ end }}
    {{ end }}
    {{ end }}
    
    {{ define "cosmic.html" }}
    <html>
    <head>
      <style>
        body { font-family: Arial, sans-serif; }
        .alert { border: 1px solid #ddd; padding: 10px; margin: 10px 0; }
        .critical { border-color: #ff0000; background-color: #ffe0e0; }
        .warning { border-color: #ffaa00; background-color: #fff0e0; }
        .info { border-color: #0080ff; background-color: #e0f0ff; }
        .cosmic-emergency { 
          border: 3px solid #ff00ff; 
          background: linear-gradient(45deg, #ffe0ff, #e0e0ff);
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0% { opacity: 1; }
          50% { opacity: 0.8; }
          100% { opacity: 1; }
        }
      </style>
    </head>
    <body>
      <h2>TerraFusion Cosmic Platform Alert</h2>
      {{ range .Alerts }}
      <div class="alert {{ .Labels.severity }}{{ if eq .Labels.cosmic_level "emergency" }} cosmic-emergency{{ end }}">
        <h3>{{ .Labels.alertname }}</h3>
        <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
        <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
        {{ if .Annotations.description }}<p><strong>Description:</strong> {{ .Annotations.description }}</p>{{ end }}
        <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
        <p><strong>Cosmic Level:</strong> {{ .Labels.cosmic_level }}</p>
        {{ if .Labels.neural_activity }}<p><strong>Neural Activity:</strong> {{ .Labels.neural_activity }}</p>{{ end }}
        {{ if .Labels.quantum_state }}<p><strong>Quantum State:</strong> {{ .Labels.quantum_state }}</p>{{ end }}
        <p><strong>Time:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</p>
      </div>
      {{ end }}
    </body>
    </html>
    {{ end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
type: Opaque
stringData:
  slack-webhook-url: ${SLACK_WEBHOOK_URL}
  pagerduty-service-key: ${PAGERDUTY_SERVICE_KEY}
  smtp-password: ${SMTP_PASSWORD}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  replicas: 3
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.25.0
        args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --cluster.listen-address=0.0.0.0:\${{TF_PORT_9094:-9094}}
        - --cluster.peer=alertmanager-0.alertmanager:9094
        - --cluster.peer=alertmanager-1.alertmanager:9094
        - --cluster.peer=alertmanager-2.alertmanager:9094
        ports:
        - containerPort: 9093
          name: http
        - containerPort: 9094
          name: cluster
        env:
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: alertmanager-secrets
              key: slack-webhook-url
        - name: PAGERDUTY_SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: alertmanager-secrets
              key: pagerduty-service-key
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: alertmanager-secrets
              key: smtp-password
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 100m
            memory: 200Mi
        volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
        - name: templates
          mountPath: /etc/alertmanager/templates
        - name: storage
          mountPath: /alertmanager
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: templates
        configMap:
          name: alertmanager-templates
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
  - name: http
    port: 9093
    targetPort: 9093
  - name: cluster
    port: 9094
    targetPort: 9094
---
# PodDisruptionBudget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: alertmanager