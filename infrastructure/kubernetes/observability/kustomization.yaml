apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - prometheus.yaml
  - grafana.yaml
  - loki.yaml
  - elasticsearch.yaml
  - fluentd.yaml
  - alertmanager.yaml
  - jaeger.yaml

configMapGenerator:
  - name: monitoring-dashboards
    files:
      - dashboards/kubernetes-cluster.json
      - dashboards/istio-mesh.json
      - dashboards/cosmic-neural-network.json
      - dashboards/quantum-storage.json
    options:
      labels:
        grafana_dashboard: "1"

secretGenerator:
  - name: monitoring-credentials
    literals:
      - grafana-admin-password=changeme
      - elasticsearch-password=changeme
      - slack-webhook-url=https://hooks.slack.com/services/YOUR/WEBHOOK/URL
      - pagerduty-service-key=YOUR-PAGERDUTY-KEY
      - smtp-password=changeme

patches:
  - target:
      kind: StatefulSet
      name: prometheus
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
        value: "true"
      - op: add
        path: /spec/template/metadata/annotations/prometheus.io~1port
        value: "9090"
  
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"

patchesStrategicMerge:
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: prometheus
      namespace: monitoring
    spec:
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800
  
  - |-
    apiVersion: v1
    kind: Service
    metadata:
      name: grafana
      namespace: monitoring
    spec:
      sessionAffinity: ClientIP

replicas:
  - name: prometheus
    count: 2
  - name: elasticsearch
    count: 3
  - name: loki
    count: 3
  - name: grafana
    count: 2
  - name: alertmanager
    count: 3

commonLabels:
  cosmic-platform: "terrafusion"
  cosmic-component: "observability"
  
commonAnnotations:
  terrafusion.io/version: "1.0.0"
  terrafusion.io/managed-by: "cosmic-orchestrator"