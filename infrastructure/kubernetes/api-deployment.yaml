# TerraFusion OS API Deployment
# Government-grade Kubernetes deployment with quantum performance optimization
# Features: Auto-scaling, health checks, security policies, monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-api
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
    component: backend
    tier: api
    version: v1.0.0
    quantum-enabled: "true"
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "TerraFusion OS API with 379M× performance improvement"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: terrafusion-api
      tier: api
  template:
    metadata:
      labels:
        app: terrafusion-api
        component: backend
        tier: api
        version: v1.0.0
        quantum-enabled: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: terrafusion-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: terrafusion/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:5000"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: db-host
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: db-password
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: jwt-secret-key
        - name: JWT_ISSUER
          value: "TerraFusion-Production"
        - name: JWT_AUDIENCE
          value: "TerraFusion-Government-Users"
        - name: JWT_EXPIRATION_HOURS
          value: "8"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: terrafusion-secrets
              key: encryption-key
        - name: REDIS_CONNECTION_STRING
          value: "terrafusion-redis:6379"
        - name: AI_SWARM_SIZE
          value: "1008"
        - name: QUANTUM_PERFORMANCE_ENABLED
          value: "true"
        - name: PERFORMANCE_TARGET
          value: "379000000"
        - name: GOVERNMENT_COMPLIANCE_LEVEL
          value: "FISMA-High"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs
        - name: ai-models-volume
          mountPath: /app/ai-models
          readOnly: true
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
      - name: ai-models-volume
        configMap:
          name: terrafusion-ai-models
      nodeSelector:
        kubernetes.io/os: linux
        node-type: compute
      tolerations:
      - key: "government-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - terrafusion-api
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute
                - general-purpose

---
# TerraFusion API Service
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-api
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
    component: backend
    tier: api
  annotations:
    service.kubernetes.io/topology-aware-hints: auto
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
  selector:
    app: terrafusion-api
    tier: api

---
# Horizontal Pod Autoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-api-hpa
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
    component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Object
    object:
      metric:
        name: requests_per_second
        selector:
          matchLabels:
            app: terrafusion-api
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terrafusion-api-pdb
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: terrafusion-api
      tier: api

---
# Network Policy for API Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terrafusion-api-network-policy
  namespace: terrafusion-system
  labels:
    app: terrafusion-api
    tier: security
spec:
  podSelector:
    matchLabels:
      app: terrafusion-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: terrafusion-frontend
    - podSelector:
        matchLabels:
          app: nginx-ingress
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443