apiVersion: v1
kind: Namespace
metadata:
  name: load-testing
  labels:
    cosmic-platform: terrafusion
    component: load-testing
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6-operator
  namespace: load-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k6-operator
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "events"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["k6.io"]
  resources: ["k6s", "k6s/status", "k6s/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k6-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k6-operator
subjects:
- kind: ServiceAccount
  name: k6-operator
  namespace: load-testing
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: k6s.k6.io
spec:
  group: k6.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parallelism:
                type: integer
                minimum: 1
              script:
                type: object
                properties:
                  configMap:
                    type: object
                    properties:
                      name:
                        type: string
                      file:
                        type: string
                  localFile:
                    type: string
              arguments:
                type: string
              runner:
                type: object
                properties:
                  image:
                    type: string
                  metadata:
                    type: object
                    properties:
                      labels:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      annotations:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                  resources:
                    type: object
                    properties:
                      requests:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                  env:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        valueFrom:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
              separate:
                type: boolean
              cleanup:
                type: string
                enum: ["post"]
          status:
            type: object
            properties:
              stage:
                type: string
              startTime:
                type: string
              endTime:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
  scope: Namespaced
  names:
    plural: k6s
    singular: k6
    kind: K6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-operator
  namespace: load-testing
  labels:
    app: k6-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-operator
  template:
    metadata:
      labels:
        app: k6-operator
    spec:
      serviceAccountName: k6-operator
      containers:
      - name: operator
        image: grafana/k6-operator:0.0.8
        args:
        - manager
        env:
        - name: WATCH_NAMESPACE
          value: ""  # Watch all namespaces
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: "k6-operator"
        ports:
        - containerPort: 8080
          name: metrics
        - containerPort: 8081
          name: health
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: k6-operator-metrics
  namespace: load-testing
  labels:
    app: k6-operator
spec:
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
  selector:
    app: k6-operator