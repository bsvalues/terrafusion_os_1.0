apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: load-testing

resources:
  - k6-operator.yaml
  - k6-scripts.yaml
  - k6-tests.yaml
  - locust-deployment.yaml
  - artillery-config.yaml
  - chaos-mesh.yaml

configMapGenerator:
  - name: load-test-scripts
    files:
      - scripts/performance-baseline.js
      - scripts/spike-test.js
      - scripts/soak-test.js
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: load-test-secrets
    literals:
      - api-token=changeme
      - admin-token=changeme
    options:
      disableNameSuffixHash: true
  
  - name: influxdb-secrets
    literals:
      - admin-password=changeme
      - write-token=changeme
    options:
      disableNameSuffixHash: true

patches:
  # Increase resources for high-load tests
  - target:
      kind: Deployment
      name: locust-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 10
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 8000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 8Gi
  
  # Add node affinity for load generators
  - target:
      kind: Deployment
      name: locust-worker
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: node-role.kubernetes.io/load-testing
                  operator: Exists
  
  # Add PodDisruptionBudget
  - target:
      kind: Deployment
      name: k6-operator
    patch: |-
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: k6-operator-pdb
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app: k6-operator

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: locust-master
      namespace: load-testing
    spec:
      template:
        spec:
          nodeSelector:
            workload-type: load-testing

commonLabels:
  cosmic-platform: "terrafusion"
  cosmic-component: "load-testing"
  cosmic-tier: "testing"

commonAnnotations:
  terrafusion.io/version: "1.0.0"
  terrafusion.io/managed-by: "cosmic-orchestrator"

images:
  - name: grafana/k6
    newTag: "0.45.0"
  - name: locustio/locust
    newTag: "2.15.1"
  - name: artilleryio/artillery
    newTag: "2.0.0"
  - name: grafana/k6-operator
    newTag: "0.0.8"

replicas:
  - name: locust-worker
    count: 10
  - name: k6-operator
    count: 1

vars:
  - name: TARGET_URL
    objref:
      kind: ConfigMap
      name: load-test-config
      apiVersion: v1
    fieldref:
      fieldpath: data.target_url
  
  - name: MAX_USERS
    objref:
      kind: ConfigMap
      name: load-test-config
      apiVersion: v1
    fieldref:
      fieldpath: data.max_users