apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts
  namespace: load-testing
data:
  locustfile.py: |
    import time
    import json
    import random
    import base64
    from locust import HttpUser, task, between, events
    from locust.contrib.fasthttp import FastHttpUser
    import gevent
    
    # Custom cosmic platform load testing
    class CosmicUser(FastHttpUser):
        wait_time = between(1, 3)
        
        def on_start(self):
            """Initialize user session"""
            # Authenticate and get token
            response = self.client.post("/auth/login", json={
                "username": f"cosmic_user_{random.randint(1000, 9999)}",
                "password": "cosmic_password",
                "dimension": random.randint(1, 11)
            })
            
            if response.status_code == 200:
                self.token = response.json().get("token")
                self.headers = {
                    "Authorization": f"Bearer {self.token}",
                    "X-Cosmic-Level": str(random.randint(1, 5)),
                    "X-Neural-Network-ID": f"neural-{random.randint(1, 100)}"
                }
            else:
                self.headers = {}
        
        @task(3)
        def test_cosmic_status(self):
            """Test basic cosmic platform status"""
            with self.client.get("/api/v1/cosmic/status", 
                               headers=self.headers,
                               catch_response=True) as response:
                if response.status_code == 200:
                    data = response.json()
                    if data.get("cosmic_level", 0) < 3:
                        response.failure("Cosmic level too low")
                else:
                    response.failure(f"Status check failed: {response.status_code}")
        
        @task(5)
        def test_neural_computation(self):
            """Test neural network computations"""
            input_size = random.choice([100, 500, 1000, 5000])
            neural_data = {
                "input_vectors": [random.random() for _ in range(input_size)],
                "model_type": random.choice(["standard", "deep", "quantum-enhanced"]),
                "activation": random.choice(["relu", "tanh", "cosmic"]),
                "layers": random.randint(3, 10)
            }
            
            start_time = time.time()
            with self.client.post("/api/v1/neural/compute",
                                json=neural_data,
                                headers=self.headers,
                                catch_response=True) as response:
                total_time = time.time() - start_time
                
                if response.status_code == 200:
                    result = response.json()
                    if total_time > 5:
                        response.failure(f"Neural computation too slow: {total_time}s")
                    elif result.get("accuracy", 0) < 0.95:
                        response.failure("Neural accuracy below threshold")
                    else:
                        # Report custom metrics
                        events.request.fire(
                            request_type="NEURAL",
                            name="compute_accuracy",
                            response_time=result.get("accuracy", 0) * 1000,
                            response_length=0,
                            response=response,
                            context={},
                            exception=None,
                        )
        
        @task(4)
        def test_quantum_storage(self):
            """Test quantum storage operations"""
            # Write quantum data
            quantum_key = f"quantum-{self.user_id}-{time.time()}"
            quantum_data = {
                "key": quantum_key,
                "dimension": random.randint(1, 11),
                "data": base64.b64encode(
                    json.dumps({
                        "timestamp": time.time(),
                        "quantum_state": "superposition",
                        "entanglement_pairs": random.randint(1, 100),
                        "coherence": random.random()
                    }).encode()
                ).decode(),
                "ttl": random.choice([60, 300, 3600])
            }
            
            with self.client.post("/api/v1/quantum/store",
                                json=quantum_data,
                                headers=self.headers,
                                name="/api/v1/quantum/store") as write_response:
                
                if write_response.status_code == 201:
                    # Read back the data
                    with self.client.get(f"/api/v1/quantum/retrieve/{quantum_key}",
                                       headers=self.headers,
                                       name="/api/v1/quantum/retrieve/[key]",
                                       catch_response=True) as read_response:
                        
                        if read_response.status_code == 200:
                            retrieved = read_response.json()
                            if retrieved.get("data") != quantum_data["data"]:
                                read_response.failure("Data integrity check failed")
                        else:
                            read_response.failure(f"Read failed: {read_response.status_code}")
        
        @task(2)
        def test_consciousness_query(self):
            """Test consciousness service queries"""
            queries = [
                "What is the current cosmic consciousness level?",
                "Analyze the neural network patterns",
                "Predict quantum entanglement probability",
                "Optimize holographic storage distribution",
                "Calculate interplanetary communication latency"
            ]
            
            consciousness_request = {
                "query": random.choice(queries),
                "context_depth": random.randint(1, 10),
                "neural_layers": random.randint(5, 20),
                "quantum_coherence": random.random(),
                "response_format": random.choice(["text", "json", "neural"])
            }
            
            with self.client.post("/api/v1/consciousness/query",
                                json=consciousness_request,
                                headers=self.headers,
                                timeout=30,
                                catch_response=True) as response:
                
                if response.status_code == 200:
                    result = response.json()
                    if not result.get("insight"):
                        response.failure("No consciousness insight received")
                    elif result.get("confidence", 0) < 0.7:
                        response.failure("Low confidence response")
        
        @task(1)
        def test_holographic_projection(self):
            """Test holographic storage projection"""
            projection_data = {
                "source_dimension": random.randint(1, 11),
                "target_dimensions": random.sample(range(1, 12), k=random.randint(2, 5)),
                "data_size": random.choice([1024, 10240, 102400]),  # 1KB, 10KB, 100KB
                "projection_type": random.choice(["linear", "quantum", "neural"]),
                "compression": random.choice(["none", "quantum", "holographic"])
            }
            
            with self.client.post("/api/v1/holographic/project",
                                json=projection_data,
                                headers=self.headers,
                                catch_response=True) as response:
                
                if response.status_code == 200:
                    result = response.json()
                    efficiency = result.get("projection_efficiency", 0)
                    if efficiency < 0.8:
                        response.failure(f"Low projection efficiency: {efficiency}")
    
    class QuantumStressUser(FastHttpUser):
        """Specialized user for quantum entanglement stress testing"""
        wait_time = between(0.1, 0.5)
        
        def on_start(self):
            self.quantum_pairs = []
            self.entanglement_id = f"entangle-{random.randint(10000, 99999)}"
        
        @task
        def create_quantum_entanglement(self):
            """Create quantum entangled pairs"""
            pair_data = {
                "pair_id": f"{self.entanglement_id}-{len(self.quantum_pairs)}",
                "dimensions": random.sample(range(1, 12), k=2),
                "entanglement_strength": random.random(),
                "coherence_time": random.randint(100, 10000)
            }
            
            with self.client.post("/api/v1/quantum/entangle",
                                json=pair_data,
                                catch_response=True) as response:
                
                if response.status_code == 201:
                    self.quantum_pairs.append(pair_data["pair_id"])
                    
                    # Test entanglement by modifying one particle
                    if len(self.quantum_pairs) > 0 and random.random() < 0.5:
                        test_pair = random.choice(self.quantum_pairs)
                        
                        modify_data = {
                            "pair_id": test_pair,
                            "particle": "A",
                            "operation": random.choice(["spin_flip", "phase_shift", "measure"]),
                            "value": random.random()
                        }
                        
                        with self.client.put(f"/api/v1/quantum/entangle/{test_pair}",
                                           json=modify_data,
                                           name="/api/v1/quantum/entangle/[pair_id]") as mod_response:
                            
                            if mod_response.status_code == 200:
                                # Verify entanglement effect on particle B
                                with self.client.get(f"/api/v1/quantum/entangle/{test_pair}/B",
                                                   name="/api/v1/quantum/entangle/[pair_id]/B") as verify_response:
                                    
                                    if verify_response.status_code == 200:
                                        state = verify_response.json()
                                        if not state.get("entangled"):
                                            verify_response.failure("Entanglement broken")
    
    class NeuralSwarmUser(HttpUser):
        """Simulates distributed neural network swarm behavior"""
        wait_time = between(0.5, 2)
        host = "https://api.terrafusion.cosmic"
        
        def on_start(self):
            self.swarm_id = f"swarm-{random.randint(1000, 9999)}"
            self.neuron_count = random.randint(100, 1000)
        
        @task(10)
        def neural_swarm_compute(self):
            """Distributed neural computation across swarm"""
            # Split computation across multiple nodes
            chunk_size = self.neuron_count // 10
            tasks = []
            
            for i in range(10):
                chunk_data = {
                    "swarm_id": self.swarm_id,
                    "chunk_id": i,
                    "neurons": list(range(i * chunk_size, (i + 1) * chunk_size)),
                    "computation_type": "parallel_neural",
                    "synchronize": True
                }
                
                # Simulate parallel requests
                gevent.spawn(self.client.post, 
                           "/api/v1/neural/swarm/compute",
                           json=chunk_data)
            
            # Wait for all chunks
            gevent.wait(timeout=5)
            
            # Aggregate results
            with self.client.post("/api/v1/neural/swarm/aggregate",
                                json={"swarm_id": self.swarm_id},
                                catch_response=True) as response:
                
                if response.status_code == 200:
                    result = response.json()
                    if result.get("chunks_processed", 0) < 10:
                        response.failure("Not all chunks processed")
    
    # Custom event handlers
    @events.init.add_listener
    def on_locust_init(environment, **kwargs):
        """Initialize cosmic platform testing environment"""
        print("🌌 Initializing Cosmic Platform Load Testing 🌌")
    
    @events.test_start.add_listener
    def on_test_start(environment, **kwargs):
        """Setup before test starts"""
        print(f"Starting test with {environment.parsed_options.users} cosmic users")
    
    @events.request.add_listener
    def on_request(request_type, name, response_time, response_length, **kwargs):
        """Custom request metrics"""
        if request_type == "NEURAL":
            # Track neural-specific metrics
            print(f"Neural computation: {name} - {response_time}ms")
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-config
  namespace: load-testing
data:
  locust.conf: |
    # Locust configuration
    host = https://api.terrafusion.cosmic
    users = 1000
    spawn-rate = 10
    run-time = 10m
    
    # Cosmic platform specific
    tags = cosmic neural quantum consciousness holographic
    
    # Reporting
    html = /stats/report.html
    csv = /stats/data
    
    # Distribution
    expect-workers = 5
    master-bind-port=\${{TF_PORT_5557:-5557}}
    master-bind-host = *
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: load-testing
  labels:
    app: locust-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.15.1
        args:
          - --master
          - --host=https://api.terrafusion.cosmic
          - --expect-workers=5
        ports:
        - containerPort: 8089
          name: web
        - containerPort: 5557
          name: master
        env:
        - name: LOCUST_MODE
          value: master
        volumeMounts:
        - name: locust-scripts
          mountPath: /mnt/locust
        - name: stats
          mountPath: /stats
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: locust-scripts
        configMap:
          name: locust-scripts
      - name: stats
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: load-testing
  labels:
    app: locust-worker
spec:
  replicas: 5
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      containers:
      - name: locust
        image: locustio/locust:2.15.1
        args:
          - --worker
          - --master-host=locust-master
        env:
        - name: LOCUST_MODE
          value: worker
        volumeMounts:
        - name: locust-scripts
          mountPath: /mnt/locust
        resources:
          requests:
            cpu: 1000m
            memory: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
      volumes:
      - name: locust-scripts
        configMap:
          name: locust-scripts
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: load-testing
  labels:
    app: locust-master
spec:
  type: LoadBalancer
  ports:
  - port: 8089
    targetPort: 8089
    name: web
  - port: 5557
    targetPort: 5557
    name: master
  selector:
    app: locust-master
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locust-worker-hpa
  namespace: load-testing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locust-worker
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 10
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60