# TerraFusion OS - Production Environment Configuration
# Government. Transcended.

# Domain Configuration
domain: &domain "app.terrafusion.gov"
environment: &env "production"

# TLS Configuration
tls:
  enabled: true
  issuer: letsencrypt-prod
  secretName: tf-app-tls

# Resource Limits (Government Scale)
resources:
  api:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"
  
  frontend:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"

# High Availability
replicas:
  api: 3
  frontend: 3
  
# Autoscaling (99.99% Uptime Requirement)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 100
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Government Security
security:
  networkPolicies: true
  podSecurityStandards: "restricted"
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false

# Monitoring & Observability
monitoring:
  enabled: true
  namespace: monitoring
  serviceMonitor: true
  prometheusRule: true
  grafanaDashboard: true

# Government Compliance
compliance:
  fisma: true
  nist80053: true
  section508: true
  wcag21: true
  soc2: true
  auditLogging: true

# Performance Targets
performance:
  targetResponseTime: "7ms"
  targetUptime: "99.99%"
  targetThroughput: "10000rps"

# Database Configuration (PostgreSQL with PostGIS)
database:
  enabled: true
  type: postgresql
  version: "15"
  extensions:
    - postgis
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retention: "30d"
  encryption:
    enabled: true
    type: "AES-256"

# AI Agent Configuration
aiAgents:
  enabled: true
  totalAgents: 50000
  supremeCommander:
    replicas: 1
    resources:
      cpu: "8000m"
      memory: "16Gi"
  fieldGenerals:
    replicas: 1220
    resources:
      cpu: "2000m"
      memory: "4Gi"
  operationalForces:
    replicas: 48779
    resources:
      cpu: "1000m"
      memory: "2Gi"

# County Customization
counties:
  - name: benton
    theme: "#00B3A4"
    population: 206873
  - name: yakima
    theme: "#2FB3FF"
    population: 249015