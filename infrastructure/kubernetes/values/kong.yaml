# TerraFusion OS - Kong API Gateway Configuration
# Government. Transcended.

# Kong Configuration
env:
  database: "off"  # DB-less mode for performance
  nginx_worker_processes: "auto"
  nginx_worker_connections: "16384"
  mem_cache_size: "128m"
  log_level: "info"

# Enterprise Features
enterprise:
  enabled: false  # Set to true for enterprise license
  license_secret: kong-enterprise-license

# Kong Image
image:
  repository: kong/kong-gateway
  tag: "3.7.1"
  pullPolicy: IfNotPresent

# Service Configuration
proxy:
  enabled: true
  type: LoadBalancer
  http:
    enabled: true
    servicePort: 80
    containerPort: 8000
  tls:
    enabled: true
    servicePort: 443
    containerPort: 8443
    parameters:
      - http2

# Admin API
admin:
  enabled: true
  type: ClusterIP
  http:
    enabled: true
    servicePort: 8001
    containerPort: 8001
  tls:
    enabled: true
    servicePort: 8444
    containerPort: 8444

# Government Security Configuration
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

# Resources (Government Scale)
resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

# High Availability
replicaCount: 3

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Health Checks
readinessProbe:
  httpGet:
    path: /status
    port: status
    scheme: HTTP
  initialDelaySeconds: 5
  timeoutSeconds: 5
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /status
    port: status
    scheme: HTTP
  initialDelaySeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Plugins Configuration
plugins:
  configMaps:
    - pluginName: prometheus
      name: kong-plugin-prometheus
  
# Service Mesh Integration
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 30s
  labels:
    app: kong

# TerraFusion Ingress Rules
ingressController:
  enabled: true
  ingressClass: kong
  
  # Government Rate Limiting
  env:
    enable_proxy_protocol: "true"
    proxy_access_log: "/dev/stdout"
    proxy_error_log: "/dev/stderr"
    admin_access_log: "/dev/stdout"
    admin_error_log: "/dev/stderr"

# Custom Kong Configuration
customEnv:
  trusted_ips: "0.0.0.0/0,::/0"
  real_ip_header: "X-Forwarded-For"
  real_ip_recursive: "on"

# Government Compliance
nodeSelector:
  kubernetes.io/os: linux