# Istio Multi-cluster Configuration
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: cosmic-control-plane
  namespace: istio-system
spec:
  values:
    pilot:
      env:
        PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION: true
        PILOT_ENABLE_CROSS_CLUSTER_WORKLOAD_ENTRY: true
    global:
      meshID: cosmic-mesh
      multiCluster:
        clusterName: us-east-1
      network: network-us-east-1
---
# Multi-cluster secret for each remote cluster
apiVersion: v1
kind: Secret
metadata:
  name: istio-remote-secret-us-west-2
  namespace: istio-system
  labels:
    istio/multiCluster: true
type: Opaque
data:
  us-west-2: ${US_WEST_2_KUBECONFIG_BASE64}
---
apiVersion: v1
kind: Secret
metadata:
  name: istio-remote-secret-eu-west-1
  namespace: istio-system
  labels:
    istio/multiCluster: true
type: Opaque
data:
  eu-west-1: ${EU_WEST_1_KUBECONFIG_BASE64}
---
apiVersion: v1
kind: Secret
metadata:
  name: istio-remote-secret-ap-southeast-1
  namespace: istio-system
  labels:
    istio/multiCluster: true
type: Opaque
data:
  ap-southeast-1: ${AP_SOUTHEAST_1_KUBECONFIG_BASE64}
---
# East-West Gateway for cross-cluster communication
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: eastwest-gateway
  namespace: istio-system
spec:
  revision: ""
  profile: empty
  components:
    ingressGateways:
    - name: istio-eastwestgateway
      label:
        istio: eastwestgateway
        app: istio-eastwestgateway
      enabled: true
      k8s:
        service:
          type: LoadBalancer
          ports:
          - port: 15021
            targetPort: 15021
            name: status-port
          - port: 15443
            targetPort: 15443
            name: mtls
        serviceAnnotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  values:
    gateways:
      istio-ingressgateway:
        injectionTemplate: gateway
    global:
      network: network-us-east-1
---
# Gateway for cross-cluster communication
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cosmic-cross-cluster-gateway
  namespace: istio-system
spec:
  selector:
    istio: eastwestgateway
  servers:
  - port:
      number: 15443
      name: mtls
      protocol: TLS
    tls:
      mode: ISTIO_MUTUAL
    hosts:
    - "*.local"
    - "*.terrafusion.cosmic"
---
# VirtualService for cross-region routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cosmic-cross-region
  namespace: terrafusion-cosmic
spec:
  hosts:
  - cosmic-orchestrator.terrafusion-cosmic.global
  gateways:
  - istio-system/cosmic-cross-cluster-gateway
  http:
  - match:
    - headers:
        x-cosmic-region:
          exact: us-west-2
    route:
    - destination:
        host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
        subset: us-west-2
  - match:
    - headers:
        x-cosmic-region:
          exact: eu-west-1
    route:
    - destination:
        host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
        subset: eu-west-1
  - route:
    - destination:
        host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
        subset: us-east-1
      weight: 50
    - destination:
        host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
        subset: us-west-2
      weight: 30
    - destination:
        host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
        subset: eu-west-1
      weight: 20
---
# DestinationRule for locality load balancing
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: cosmic-locality-lb
  namespace: terrafusion-cosmic
spec:
  host: cosmic-orchestrator.terrafusion-cosmic.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      consistentHash:
        httpHeaderName: x-cosmic-session
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      splitExternalLocalOriginErrors: true
  subsets:
  - name: us-east-1
    labels:
      region: us-east-1
    trafficPolicy:
      portLevelSettings:
      - port:
          number: 8080
        loadBalancer:
          consistentHash:
            httpHeaderName: x-cosmic-session
  - name: us-west-2
    labels:
      region: us-west-2
  - name: eu-west-1
    labels:
      region: eu-west-1
  - name: ap-southeast-1
    labels:
      region: ap-southeast-1
---
# ServiceEntry for external multi-region endpoints
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: cosmic-global-endpoints
  namespace: terrafusion-cosmic
spec:
  hosts:
  - global.terrafusion.cosmic
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
  endpoints:
  - address: api-us-east-1.terrafusion.cosmic
    priority: 0
    weight: 100
    labels:
      region: us-east-1
      zone: us-east-1a
  - address: api-us-west-2.terrafusion.cosmic
    priority: 1
    weight: 90
    labels:
      region: us-west-2
      zone: us-west-2a
  - address: api-eu-west-1.terrafusion.cosmic
    priority: 2
    weight: 80
    labels:
      region: eu-west-1
      zone: eu-west-1a
  - address: api-ap-southeast-1.terrafusion.cosmic
    priority: 3
    weight: 70
    labels:
      region: ap-southeast-1
      zone: ap-southeast-1a
---
# Telemetry configuration for multi-cluster observability
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: cosmic-cross-cluster-metrics
  namespace: istio-system
spec:
  metrics:
  - providers:
    - name: prometheus
    overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        source_cluster:
          value: |
            source.cluster | "unknown"
        destination_cluster:
          value: |
            destination.cluster | "unknown"
        source_region:
          value: |
            source.labels["region"] | "unknown"
        destination_region:
          value: |
            destination.labels["region"] | "unknown"
---
# PeerAuthentication for cross-cluster mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: cosmic-cross-cluster-mtls
  namespace: istio-system
spec:
  mtls:
    mode: STRICT
---
# RequestAuthentication for JWT validation across clusters
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: cosmic-jwt-cross-cluster
  namespace: terrafusion-cosmic
spec:
  jwtRules:
  - issuer: "https://auth.terrafusion.cosmic"
    jwksUri: "https://auth.terrafusion.cosmic/.well-known/jwks.json"
    audiences:
    - "cosmic-platform"
    forwardOriginalToken: true
    outputPayloadToHeader: x-cosmic-claims
---
# WorkloadEntry for cross-cluster VM workloads
apiVersion: networking.istio.io/v1beta1
kind: WorkloadEntry
metadata:
  name: mars-relay-vm
  namespace: terrafusion-cosmic
spec:
  address: 10.100.0.1
  ports:
    grpc: 8443
  labels:
    app: mars-relay
    region: mars
    type: interplanetary
  location: MESH_EXTERNAL
  serviceAccount: mars-relay-sa
---
# Sidecar configuration for multi-cluster traffic
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: cosmic-cross-cluster-sidecar
  namespace: terrafusion-cosmic
spec:
  workloadSelector:
    labels:
      cosmic-multicluster: "true"
  egress:
  - hosts:
    - "./*"
    - "istio-system/*"
    - "terrafusion-cosmic/*"
  outboundTrafficPolicy:
    mode: ALLOW_ANY
  ingress:
  - port:
      number: 8080
      protocol: HTTP
      name: http-cosmic
    defaultEndpoint: 127.0.0.1:8080
    captureMode: REDIRECT