apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    cosmic-platform: terrafusion
    component: global-dns
---
# External DNS for automatic DNS management
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
- apiGroups: [""]
  resources: ["services", "endpoints", "pods"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["externaldns.k8s.io"]
  resources: ["dnsendpoints", "dnsendpoints/status"]
  verbs: ["get", "watch", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
- kind: ServiceAccount
  name: external-dns
  namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: k8s.gcr.io/external-dns/external-dns:v0.13.5
        args:
        - --source=service
        - --source=ingress
        - --source=crd
        - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
        - --crd-source-kind=DNSEndpoint
        - --domain-filter=terrafusion.cosmic
        - --provider=aws
        - --aws-zone-type=public
        - --aws-prefer-cname
        - --registry=txt
        - --txt-owner-id=cosmic-platform
        - --txt-prefix=_cosmic.
        - --policy=sync
        - --interval=30s
        - --log-level=info
        env:
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
# Route53 Health Checks
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cosmic-global-endpoints
  namespace: external-dns
spec:
  endpoints:
  - dnsName: api.terrafusion.cosmic
    recordType: A
    recordTTL: 60
    targets:
    - 1.2.3.4  # us-east-1 NLB
    - 5.6.7.8  # us-west-2 NLB
    - 9.10.11.12  # eu-west-1 NLB
    - 13.14.15.16  # ap-southeast-1 NLB
    setIdentifier: global
    providerSpecific:
    - name: aws/route53/routing-policy
      value: geolocation
    - name: aws/route53/health-check-id
      value: ${HEALTH_CHECK_ID}
    - name: aws/route53/failover
      value: PRIMARY
  
  - dnsName: api-us-east-1.terrafusion.cosmic
    recordType: A
    recordTTL: 60
    targets:
    - 1.2.3.4
    setIdentifier: us-east-1
    providerSpecific:
    - name: aws/route53/continent-code
      value: NA
    - name: aws/route53/country-code
      value: US
    - name: aws/route53/subdivision-code
      value: NY
  
  - dnsName: api-us-west-2.terrafusion.cosmic
    recordType: A
    recordTTL: 60
    targets:
    - 5.6.7.8
    setIdentifier: us-west-2
    providerSpecific:
    - name: aws/route53/continent-code
      value: NA
    - name: aws/route53/country-code
      value: US
    - name: aws/route53/subdivision-code
      value: CA
  
  - dnsName: api-eu-west-1.terrafusion.cosmic
    recordType: A
    recordTTL: 60
    targets:
    - 9.10.11.12
    setIdentifier: eu-west-1
    providerSpecific:
    - name: aws/route53/continent-code
      value: EU
  
  - dnsName: api-ap-southeast-1.terrafusion.cosmic
    recordType: A
    recordTTL: 60
    targets:
    - 13.14.15.16
    setIdentifier: ap-southeast-1
    providerSpecific:
    - name: aws/route53/continent-code
      value: AS
---
# K8GB for global load balancing
apiVersion: v1
kind: Namespace
metadata:
  name: k8gb
---
apiVersion: k8gb.absa.oss/v1beta1
kind: Gslb
metadata:
  name: cosmic-platform-gslb
  namespace: terrafusion-cosmic
spec:
  ingress:
    ingressClassName: kong
    rules:
    - host: api.terrafusion.cosmic
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: cosmic-orchestrator
              port:
                number: 8080
    tls:
    - hosts:
      - api.terrafusion.cosmic
      secretName: cosmic-platform-tls
  strategy:
    type: geoip
    geoip:
      - continent: NA
        country: US
        subdivision: NY
        weight: 100
      - continent: NA
        country: US
        subdivision: CA
        weight: 90
      - continent: EU
        weight: 80
      - continent: AS
        weight: 70
    splitBrainThresholdSeconds: 60
    dnsTtlSeconds: 30
---
# CloudFlare DNS configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-config
  namespace: external-dns
data:
  config.yaml: |
    providers:
      cloudflare:
        - name: cosmic-cloudflare
          apiToken: ${CLOUDFLARE_API_TOKEN}
          zones:
            - terrafusion.cosmic
          proxied: true
          ttl: 60
          priority: 10
          
    records:
      - name: api
        type: A
        proxied: true
        healthCheck:
          type: https
          path: /health
          interval: 60
          timeout: 10
          retries: 2
        geoRouting:
          - location: NA
            targets:
              - 1.2.3.4  # us-east-1
              - 5.6.7.8  # us-west-2
            weights:
              - 60
              - 40
          - location: EU
            targets:
              - 9.10.11.12  # eu-west-1
          - location: AS
            targets:
              - 13.14.15.16  # ap-southeast-1
---
# Global Traffic Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-traffic-manager
  namespace: external-dns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: global-traffic-manager
  template:
    metadata:
      labels:
        app: global-traffic-manager
    spec:
      containers:
      - name: traffic-manager
        image: terrafusion/global-traffic-manager:latest
        env:
        - name: PROVIDERS
          value: "route53,cloudflare,azure-traffic-manager"
        - name: HEALTH_CHECK_INTERVAL
          value: "30s"
        - name: FAILOVER_THRESHOLD
          value: "3"
        - name: QUANTUM_ROUTING_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Anycast configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: anycast-config
  namespace: external-dns
data:
  anycast.yaml: |
    anycast_prefixes:
      - prefix: 192.0.2.0/24
        description: "Cosmic Platform Global Anycast"
        locations:
          - region: us-east-1
            asn: 65001
            communities:
              - "65001:100"  # Prefer US East
          - region: us-west-2
            asn: 65002
            communities:
              - "65002:90"   # Secondary US West
          - region: eu-west-1
            asn: 65003
            communities:
              - "65003:80"   # Europe
          - region: ap-southeast-1
            asn: 65004
            communities:
              - "65004:70"   # Asia Pacific
    
    bgp_config:
      local_as: 65000
      router_id: 192.0.2.1
      hold_time: 90
      keepalive_time: 30
      
    health_checks:
      - name: http_health
        type: http
        url: https://api.terrafusion.cosmic/health
        interval: 10s
        timeout: 5s
        fall: 3
        rise: 2