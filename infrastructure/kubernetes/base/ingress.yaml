apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosmic-ingress
  namespace: terrafusion-cosmic
  labels:
    app: terrafusion-cosmic
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "cosmic-session"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
spec:
  tls:
  - hosts:
    - terrafusion.cosmic
    - api.terrafusion.cosmic
    - console.terrafusion.cosmic
    - monitor.terrafusion.cosmic
    secretName: cosmic-tls
  rules:
  - host: terrafusion.cosmic
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cosmic-orchestrator
            port:
              number: 8080
  - host: api.terrafusion.cosmic
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cosmic-orchestrator
            port:
              number: 8080
  - host: console.terrafusion.cosmic
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cosmic-dashboard
            port:
              number: 3000
  - host: monitor.terrafusion.cosmic
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-cosmic
            port:
              number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosmic-websocket-ingress
  namespace: terrafusion-cosmic
  labels:
    app: terrafusion-cosmic
    component: websocket-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cosmic-orchestrator"
spec:
  rules:
  - host: ws.terrafusion.cosmic
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cosmic-orchestrator
            port:
              number: 8080