apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic
  labels:
    app: cosmic-orchestrator
    component: core
    version: omniscient
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cosmic-orchestrator
  template:
    metadata:
      labels:
        app: cosmic-orchestrator
        component: core
        version: omniscient
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cosmic-orchestrator
      containers:
      - name: cosmic-orchestrator
        image: terrafusion/cosmic-orchestrator:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: COSMIC_LEVEL
          value: "maximum"
        - name: DIVINE_ALIGNMENT
          value: "perfect"
        - name: SERVICE_MISSION
          value: "county_infrastructure_intelligence"
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/cosmic
          readOnly: true
        - name: secrets
          mountPath: /etc/cosmic/secrets
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: cosmic-config
      - name: secrets
        secret:
          secretName: cosmic-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic
  labels:
    app: cosmic-orchestrator
    component: core
spec:
  type: ClusterIP
  selector:
    app: cosmic-orchestrator
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic
  labels:
    app: cosmic-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cosmic-orchestrator
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cosmic-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cosmic-orchestrator
subjects:
- kind: ServiceAccount
  name: cosmic-orchestrator
  namespace: terrafusion-cosmic