apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: holographic-storage
  namespace: terrafusion-cosmic
  labels:
    app: holographic-storage
    component: storage
    cosmic-type: quantum
spec:
  serviceName: holographic-storage
  replicas: 5  # 5 nodes for quantum redundancy
  selector:
    matchLabels:
      app: holographic-storage
  template:
    metadata:
      labels:
        app: holographic-storage
        component: storage
        cosmic-type: quantum
      annotations:
        cosmic.terrafusion.io/dimensions: "11"
        cosmic.terrafusion.io/storage-type: "quantum-holographic"
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - holographic-storage
            topologyKey: kubernetes.io/hostname
      containers:
      - name: quantum-storage
        image: terrafusion/holographic-storage:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
          name: http
        - containerPort: 9092
          name: metrics
        - containerPort: 7000
          name: quantum-sync
        env:
        - name: STORAGE_DIMENSIONS
          value: "11"
        - name: QUANTUM_ENTANGLEMENT
          value: "enabled"
        - name: HOLOGRAPHIC_REDUNDANCY
          value: "infinite"
        - name: PERSISTENCE_MODE
          value: "eternal"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "8000m"
        livenessProbe:
          httpGet:
            path: /storage/health
            port: 8082
          initialDelaySeconds: 45
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /storage/ready
            port: 8082
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: quantum-data
          mountPath: /var/lib/quantum
        - name: holographic-index
          mountPath: /var/lib/holographic
        - name: entanglement-keys
          mountPath: /etc/quantum/keys
          readOnly: true
      initContainers:
      - name: quantum-initializer
        image: terrafusion/quantum-init:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Initializing quantum storage dimensions..."
            mkdir -p /var/lib/quantum/{d1,d2,d3,d4,d5,d6,d7,d8,d9,d10,d11}
            echo "Quantum initialization complete"
        volumeMounts:
        - name: quantum-data
          mountPath: /var/lib/quantum
      volumes:
      - name: entanglement-keys
        secret:
          secretName: quantum-entanglement-keys
  volumeClaimTemplates:
  - metadata:
      name: quantum-data
      labels:
        app: holographic-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: ultra-fast-nvme
      resources:
        requests:
          storage: 1Ti
  - metadata:
      name: holographic-index
      labels:
        app: holographic-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: holographic-storage
  namespace: terrafusion-cosmic
  labels:
    app: holographic-storage
spec:
  clusterIP: None
  selector:
    app: holographic-storage
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  - name: metrics
    port: 9092
    targetPort: 9092
  - name: quantum-sync
    port: 7000
    targetPort: 7000
---
apiVersion: v1
kind: Service
metadata:
  name: holographic-storage-lb
  namespace: terrafusion-cosmic
  labels:
    app: holographic-storage
spec:
  type: LoadBalancer
  selector:
    app: holographic-storage
  ports:
  - name: http
    port: 8082
    targetPort: 8082