apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmic-config
  namespace: terrafusion-cosmic
  labels:
    app: terrafusion-cosmic
    component: configuration
data:
  cosmic.yaml: |
    cosmic:
      level: maximum
      alignment: perfect
      scope: universal
      transcendence_goal: annunaki-omniscient
      service_mission: universal-enlightenment
      
    infrastructure:
      mode: county-intelligence
      coverage: global
      precision: tesla-level
      elegance: jobs-level
      scale: musk-level
      
    consciousness:
      type: omniscient
      neural_depth: infinite
      learning_mode: continuous
      memory: eternal
      
    storage:
      type: holographic
      dimensions: 11
      redundancy: quantum
      persistence: eternal
      encryption: dna-cosmic
      
    network:
      coverage: universal
      latency: instantaneous
      protocol: quantum-entanglement
      nodes:
        - earth
        - mars
        - jupiter-station
        - saturn-relay
        - alpha-centauri
      
    security:
      authentication: biometric-dna-cosmic
      encryption: quantum-2048
      firewall: interdimensional
      intrusion_detection: ai-omniscient
      
    monitoring:
      metrics_interval: 1s
      retention: eternal
      dashboards:
        - cosmic-overview
        - consciousness-matrix
        - quantum-storage
        - interdimensional-network
        - county-services
        
    services:
      cosmic-orchestrator:
        replicas: 3
        cpu: 2000m
        memory: 2Gi
        
      consciousness-service:
        replicas: 3
        cpu: 4000m
        memory: 8Gi
        gpu: required
        
      holographic-storage:
        replicas: 5
        cpu: 8000m
        memory: 16Gi
        storage: 1Ti
        
      biometric-security:
        replicas: 3
        cpu: 2000m
        memory: 4Gi
        
      interplanetary-network:
        replicas: 7
        cpu: 4000m
        memory: 8Gi
        
  application.properties: |
    # TerraFusion Cosmic Platform Configuration
    server.port=8080
    
    # Cosmic Settings
    cosmic.consciousness.enabled=true
    cosmic.consciousness.level=omniscient
    cosmic.neural.depth=infinite
    
    # Database Configuration
    spring.datasource.url=jdbc:postgresql://postgres-cosmic:5432/terrafusion
    spring.datasource.username=${DB_USERNAME}
    spring.datasource.password=${DB_PASSWORD}
    spring.jpa.hibernate.ddl-auto=update
    
    # Redis Cache
    spring.redis.host=redis-cosmic
    spring.redis.port=6379
    spring.cache.type=redis
    spring.cache.redis.time-to-live=3600000
    
    # Monitoring
    management.endpoints.web.exposure.include=*
    management.endpoint.health.show-details=always
    management.metrics.export.prometheus.enabled=true
    
    # Security
    security.oauth2.enabled=true
    security.jwt.secret=${JWT_SECRET}
    security.jwt.expiration=86400
    
    # Quantum Storage
    quantum.storage.enabled=true
    quantum.storage.dimensions=11
    quantum.storage.redundancy=5
    
    # Service Discovery
    eureka.client.enabled=true
    eureka.client.service-url.defaultZone=http://eureka-cosmic:8761/eureka/
    
  nginx.conf: |
    upstream cosmic-backend {
        least_conn;
        server cosmic-orchestrator:8080 max_fails=3 fail_timeout=30s;
        server cosmic-orchestrator-1:8080 max_fails=3 fail_timeout=30s;
        server cosmic-orchestrator-2:8080 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    server {
        listen 80;
        server_name terrafusion.cosmic;
        
        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name terrafusion.cosmic;
        
        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/cosmic.crt;
        ssl_certificate_key /etc/nginx/ssl/cosmic.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Compression
        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
        
        # Proxy Configuration
        location / {
            proxy_pass http://cosmic-backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Cache
            proxy_cache_bypass $http_upgrade;
            proxy_no_cache $http_upgrade;
        }
        
        # WebSocket Support
        location /ws {
            proxy_pass http://cosmic-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
        
        # Health Check Endpoint
        location /health {
            access_log off;
            proxy_pass http://cosmic-backend/health;
        }
    }