apiVersion: v1
kind: Secret
metadata:
  name: cosmic-secrets
  namespace: terrafusion-cosmic
  labels:
    app: terrafusion-cosmic
    component: secrets
type: Opaque
stringData:
  # Database credentials
  DB_USERNAME: cosmic_admin
  DB_PASSWORD: ${DB_PASSWORD}  # Replace with actual password
  
  # JWT Secret
  JWT_SECRET: ${JWT_SECRET}  # Replace with actual secret
  
  # API Keys
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  
  # OAuth2 Credentials
  OAUTH2_CLIENT_ID: ${OAUTH2_CLIENT_ID}
  OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
  
  # Notification Webhooks
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  
  # Encryption Keys
  MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
  
---
apiVersion: v1
kind: Secret
metadata:
  name: quantum-entanglement-keys
  namespace: terrafusion-cosmic
  labels:
    app: terrafusion-cosmic
    component: quantum-security
type: Opaque
data:
  # Base64 encoded quantum keys (example - replace with actual)
  primary.key: cXVhbnR1bS1lbnRhbmdsZW1lbnQta2V5LXByaW1hcnk=
  secondary.key: cXVhbnR1bS1lbnRhbmdsZW1lbnQta2V5LXNlY29uZGFyeQ==
  tertiary.key: cXVhbnR1bS1lbnRhbmdsZW1lbnQta2V5LXRlcnRpYXJ5
  
---
apiVersion: v1
kind: Secret
