apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: cosmic-gateway
  namespace: terrafusion-cosmic
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "terrafusion.cosmic"
    - "*.terrafusion.cosmic"
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "terrafusion.cosmic"
    - "*.terrafusion.cosmic"
    tls:
      mode: SIMPLE
      credentialName: cosmic-tls-cert
      minProtocolVersion: TLSV1_2
      maxProtocolVersion: TLSV1_3
      cipherSuites:
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES256-GCM-SHA384
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES128-GCM-SHA256
  - port:
      number: 8443
      name: https-admin
      protocol: HTTPS
    hosts:
    - "admin.terrafusion.cosmic"
    tls:
      mode: MUTUAL
      credentialName: cosmic-admin-tls
      minProtocolVersion: TLSV1_2
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: cosmic-gateway-vs
  namespace: terrafusion-cosmic
spec:
  hosts:
  - "terrafusion.cosmic"
  - "api.terrafusion.cosmic"
  - "console.terrafusion.cosmic"
  - "admin.terrafusion.cosmic"
  gateways:
  - cosmic-gateway
  http:
  - match:
    - uri:
        prefix: "/api/v1"
      headers:
        host:
          exact: "api.terrafusion.cosmic"
    route:
    - destination:
        host: cosmic-orchestrator
        port:
          number: 8080
    corsPolicy:
      allowOrigins:
      - exact: "https://terrafusion.cosmic"
      - exact: "https://console.terrafusion.cosmic"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-cosmic-token
      - x-request-id
      exposeHeaders:
      - x-cosmic-trace-id
      - x-rate-limit-remaining
      maxAge: "24h"
      allowCredentials: true
  - match:
    - uri:
        prefix: "/console"
      headers:
        host:
          exact: "console.terrafusion.cosmic"
    route:
    - destination:
        host: cosmic-dashboard
        port:
          number: 3000
  - match:
    - uri:
        prefix: "/admin"
      headers:
        host:
          exact: "admin.terrafusion.cosmic"
    route:
    - destination:
        host: cosmic-admin-panel
        port:
          number: 8090
    headers:
      request:
        add:
          x-admin-access: "required"
  - match:
    - uri:
        prefix: "/"
    route:
    - destination:
        host: cosmic-orchestrator
        port:
          number: 8080
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s