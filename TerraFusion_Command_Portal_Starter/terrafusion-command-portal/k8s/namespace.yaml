apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion-system
  labels:
    name: terrafusion-system
    app.kubernetes.io/name: terrafusion
    app.kubernetes.io/part-of: terrafusion-platform
    app.kubernetes.io/version: '1.0.0'
    security.terrafusion.gov/compliance-level: 'fedramp-moderate'
    security.terrafusion.gov/data-classification: 'cui-basic'
  annotations:
    terrafusion.gov/environment: 'production'
    terrafusion.gov/compliance: 'fedramp-moderate'
    terrafusion.gov/audit-required: 'true'
    terrafusion.gov/retention-policy: '7-years'
    scheduler.alpha.kubernetes.io/node-selector: 'security-zone=government'

---
# Resource Quota for Government-Grade Resource Management
apiVersion: v1
kind: ResourceQuota
metadata:
  name: terrafusion-system-quota
  namespace: terrafusion-system
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '8'
    limits.memory: 16Gi
    persistentvolumeclaims: '10'
    services: '20'
    secrets: '50'
    configmaps: '50'
    pods: '50'

---
# Limit Range for Security and Performance
apiVersion: v1
kind: LimitRange
metadata:
  name: terrafusion-system-limits
  namespace: terrafusion-system
spec:
  limits:
    - type: Container
      default:
        cpu: '1'
        memory: '1Gi'
      defaultRequest:
        cpu: '100m'
        memory: '128Mi'
      max:
        cpu: '4'
        memory: '4Gi'
      min:
        cpu: '50m'
        memory: '64Mi'
    - type: Pod
      max:
        cpu: '8'
        memory: '8Gi'
    - type: PersistentVolumeClaim
      min:
        storage: '1Gi'
      max:
        storage: '100Gi'

---
# Pod Security Policy for Government Compliance
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: terrafusion-system-psp
  namespace: terrafusion-system
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    seccomp.security.alpha.kubernetes.io/defaultProfileName: 'runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true

---
# Network Policy for Zero-Trust Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terrafusion-system-default-deny
  namespace: terrafusion-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # Default deny all - specific allows must be explicitly defined
