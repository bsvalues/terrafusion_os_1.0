apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-frontend
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
    component: frontend
    environment: production
    version: '1.0'
    app.kubernetes.io/name: terrafusion-frontend
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: '1.0'
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: terrafusion-command-portal
    app.kubernetes.io/managed-by: terrafusion
  annotations:
    deployment.kubernetes.io/revision: '1'
    description: 'TerraFusion Frontend - React/Next.js Application'
spec:
  replicas: 3 # High availability with 3 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero downtime deployments
  selector:
    matchLabels:
      app: terrafusion-frontend
  template:
    metadata:
      labels:
        app: terrafusion-frontend
        component: frontend
        environment: production
        version: '1.0'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: '/metrics'
        fluentd/include: 'true'
        logging.coreos.com/enabled: 'true'
    spec:
      serviceAccountName: terrafusion-service-account
      automountServiceAccountToken: true

      # Security context for government compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - terrafusion-frontend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: frontend
          image: terrafusion/frontend:latest
          imagePullPolicy: Always

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMap and Secrets
          env:
            - name: NODE_ENV
              value: 'production'
            - name: NEXT_PUBLIC_API_URL
              value: 'https://api.terrafusion.gov'
            - name: NEXT_PUBLIC_WS_URL
              value: 'wss://ws.terrafusion.gov'
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: environment
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: log_level

          # Resource requests and limits
          resources:
            requests:
              cpu: '500m' # 0.5 CPU core
              memory: '1Gi' # 1GB RAM
            limits:
              cpu: '2' # 2 CPU cores max
              memory: '4Gi' # 4GB RAM max

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup probe for faster deployments
          startupProbe:
            httpGet:
              path: /health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
            successThreshold: 1

          # Volume mounts for writable directories
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: logs-volume
              mountPath: /app/logs

      # Volumes for writable directories
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 1Gi
        - name: nextjs-cache
          emptyDir:
            sizeLimit: 2Gi
        - name: logs-volume
          emptyDir:
            sizeLimit: 1Gi

      # DNS configuration for government networks
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: '2'
          - name: edns0

      # Termination settings
      terminationGracePeriodSeconds: 30

      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-frontend-service
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
    component: frontend
    environment: production
  annotations:
    service.description: 'TerraFusion Frontend Service'
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: terrafusion-frontend
  sessionAffinity: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-backend
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
    component: backend
    environment: production
    version: '1.0'
  annotations:
    deployment.kubernetes.io/revision: '1'
    description: 'TerraFusion Backend - Rust API Server'
spec:
  replicas: 5 # High availability with 5 replicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1 # Allow 1 pod to be unavailable during updates
  selector:
    matchLabels:
      app: terrafusion-backend
  template:
    metadata:
      labels:
        app: terrafusion-backend
        component: backend
        environment: production
        version: '1.0'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: terrafusion-service-account
      automountServiceAccountToken: true

      # Security context for government compliance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - terrafusion-backend
                topologyKey: kubernetes.io/hostname

      containers:
        - name: backend
          image: terrafusion/backend:latest
          imagePullPolicy: Always

          # Security context for container
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
            - name: websocket
              containerPort: 8788
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          # Environment variables from ConfigMap and Secrets
          env:
            - name: RUST_ENV
              value: 'production'
            - name: RUST_LOG
              value: 'info'
            - name: BIND_ADDRESS
              value: '0.0.0.0:8787'
            - name: WEBSOCKET_ADDRESS
              value: '0.0.0.0:8788'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-database-secret
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: terrafusion-redis-secret
                  key: url
            - name: FEDERATION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: federation_enabled
            - name: COUNTIES
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: counties

          # Resource requests and limits
          resources:
            requests:
              cpu: '1' # 1 CPU core
              memory: '2Gi' # 2GB RAM
            limits:
              cpu: '4' # 4 CPU cores max
              memory: '8Gi' # 8GB RAM max

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /ready
              port: 8787
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Startup probe for Rust application
          startupProbe:
            httpGet:
              path: /health
              port: 8787
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
            successThreshold: 1

          # Volume mounts for writable directories
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: logs-volume
              mountPath: /app/logs
            - name: cache-volume
              mountPath: /app/cache

      # Volumes for writable directories
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 1Gi
        - name: logs-volume
          emptyDir:
            sizeLimit: 2Gi
        - name: cache-volume
          emptyDir:
            sizeLimit: 1Gi

      # DNS configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: '2'
          - name: edns0

      # Termination settings
      terminationGracePeriodSeconds: 60 # Longer for graceful shutdown

      # Restart policy
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-backend-service
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
    component: backend
    environment: production
  annotations:
    service.description: 'TerraFusion Backend Service'
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8787
      protocol: TCP
    - name: websocket
      port: 8080
      targetPort: 8788
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: terrafusion-backend
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-frontend-hpa
  namespace: terrafusion-production
  labels:
    app: terrafusion-frontend
    component: autoscaling
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-frontend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-backend-hpa
  namespace: terrafusion-production
  labels:
    app: terrafusion-backend
    component: autoscaling
    environment: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-backend
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
