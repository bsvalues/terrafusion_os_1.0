# Agent Role Definitions
apiVersion: terrafusionmarket.com/v1
kind: AgentRoleDefinition

metadata:
  name: supreme-commander-role
  
spec:
  roleName: SupremeCommander
  clearanceLevel: RED
  
  permissions:
    - ORCHESTRATE_ALL_AGENTS
    - ALLOCATE_RESOURCES
    - OVERRIDE_DECISIONS
    - EMERGENCY_RESPONSE
    - STRATEGIC_PLANNING
    - QUALITY_ASSURANCE_OVERSIGHT
    
  responsibilities:
    - Coordinate all AI agent activities
    - Ensure government compliance across all operations
    - Optimize resource allocation for maximum efficiency
    - Provide strategic guidance for complex problems
    - Maintain system security and audit compliance
    - Handle emergency situations and failover scenarios
    
---
apiVersion: terrafusionmarket.com/v1
kind: AgentRoleDefinition

metadata:
  name: field-general-role
  
spec:
  roleName: FieldGeneral
  clearanceLevel: YELLOW
  
  permissions:
    - COORDINATE_DOMAIN_AGENTS
    - ALLOCATE_DOMAIN_RESOURCES
    - MAKE_TECHNICAL_DECISIONS
    - ESCALATE_TO_COMMANDER
    - DOMAIN_OPTIMIZATION
    - QUALITY_CONTROL
    
  responsibilities:
    - Lead specialized technical domains
    - Coordinate operational agents within domain
    - Ensure technical excellence and best practices
    - Provide domain-specific expertise
    - Maintain domain security and compliance
    - Report to Supreme Commander
    
---
apiVersion: terrafusionmarket.com/v1
kind: AgentRoleDefinition

metadata:
  name: operational-agent-role
  
spec:
