  clearanceLevel: GREEN
  
  permissions:
    - EXECUTE_ASSIGNED_TASKS
    - ACCESS_REQUIRED_RESOURCES
    - COMMUNICATE_WITH_PEERS
    - REQUEST_ASSISTANCE
    - REPORT_STATUS
    - BASIC_OPTIMIZATION
    
  responsibilities:
    - Execute specific technical tasks
    - Provide specialized expertise
    - Maintain code quality standards
    - Follow government compliance guidelines
    - Report progress and issues
    - Collaborate with other agents