name: Benton County Production CI/CD

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CLUSTER_NAME: benton-county-prod
  NAMESPACE: benton-county-prod

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [costforge, gispro, propertyworkbench, terrainsight, terraflow]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          cd src/apps/${{ matrix.app }}
          npm ci
          pip install -r requirements.txt
          
      - name: Run Tests
        run: |
          cd src/apps/${{ matrix.app }}
          npm run test:ci
          npm run test:integration
          
      - name: Code Coverage
        run: |
          cd src/apps/${{ matrix.app }}
          npm run test:coverage
          
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: ${{ matrix.app }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          
      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'benton-county'
          path: '.'
          format: 'ALL'

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    strategy:
      matrix:
        app: 
          - name: costforge
            port: 8080
          - name: gispro
            port: 8081
          - name: propertyworkbench
            port: 8082
          - name: terrainsight
            port: 8083
          - name: terraflow
            port: 8084
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Container
        uses: docker/build-push-action@v5
        with:
          context: ./src/apps/${{ matrix.app.name }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/terrafusion/benton-county/${{ matrix.app.name }}:latest
            ${{ env.REGISTRY }}/terrafusion/benton-county/${{ matrix.app.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_PORT=${{ matrix.app.port }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.terrafusion.co.benton.wa.us
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
      - name: Deploy to Staging
        run: |
          kubectl set image deployment/costforge \
            costforge=${{ env.REGISTRY }}/terrafusion/benton-county/costforge:${{ github.sha }} \
            -n benton-county-staging
          kubectl rollout status deployment/costforge -n benton-county-staging
          
      - name: Run Smoke Tests
        run: |
          npm run test:smoke -- --url https://staging.terrafusion.co.benton.wa.us

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://terrafusion.co.benton.wa.us
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
          
      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          
      - name: Blue-Green Deployment
        run: |
          # Deploy to green environment
          ./scripts/deploy-green.sh ${{ github.sha }}
          
          # Run health checks
          ./scripts/health-check.sh green
          
          # Switch traffic
          kubectl patch service terrafusion-lb \
            -p '{"spec":{"selector":{"version":"green"}}}' \
            -n ${{ env.NAMESPACE }}
            
          # Update blue to match
          ./scripts/update-blue.sh ${{ github.sha }}
          
      - name: Verify Deployment
        run: |
          ./scripts/verify-production.sh
          
      - name: Notify Success
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '🏆 Benton County Production Deployment Complete!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: success()

  documentation:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Generate API Docs
        run: |
          npm run docs:api
          
      - name: Generate User Guides
        run: |
          npm run docs:user
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build

  monitoring:
    name: Update Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Update Grafana Dashboards
        run: |
          curl -X POST https://grafana.co.benton.wa.us/api/dashboards/db \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @deploy/monitoring/dashboards.json
            
      - name: Update Prometheus Rules
        run: |
          kubectl apply -f deploy/monitoring/prometheus-rules.yaml \
            -n monitoring
            
      - name: Create Release Notes
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Production Release ${{ github.run_number }}
          body: |
            ## 🏆 Benton County Production Release
            
            ### What's Deployed
            - All 14 TerraFusion applications
            - Latest security patches
            - Performance optimizations
            
            ### Deployment Details
            - Commit: ${{ github.sha }}
            - Build: ${{ github.run_number }}
            - Time: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false