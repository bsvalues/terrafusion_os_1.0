        text-align: center;

      .tf-stats-grid {

        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }
      
      .tf-stat-card {

      .tf-stat-label {

      .tf-stat-desc {

      }
      
      .tf-agent-card {

        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 8px;

      }
      
      .tf-agent-avatar {
        width: 60px;
        height: 60px;

        margin-right: 1rem;
        position: relative;
      }
      
      .tf-agent-avatar::after {
        content: '';
        position: absolute;
        top: 10%;
        left: 10%;
        width: 80%;
        height: 80%;
        border-radius: 50%;
        background-color: #0A0E1A;
      }
      
      .tf-agent-title {

        color: #00FFFF;

        gap: 1.5rem;
        margin-bottom: 1rem;

      .tf-agent-stat-label {

        color: rgba(0, 255, 255, 0.8);
        margin-bottom: 0.25rem;

      /* TerraSphere Styles */
      .tf-terrasphere {
        background: linear-gradient(135deg, #0A0E1A 0%, #1A2332 100%);
        border: 1px solid #00FFFF;
        border-radius: 1rem;
        padding: 1.5rem;
        animation: terraGlow 3s ease-in-out infinite;
      }
      
      .tf-terrasphere-title {
        color: #00FFFF;
        margin-bottom: 1rem;
        font-size: 1.125rem;
        text-shadow: 0 0 5px rgba(0, 255, 255, 0.3);
        text-align: center;
      }
      
      .tf-terrasphere-container {
        width: 100%;
        height: 300px;
        background: radial-gradient(circle at center, #001122 0%, #000611 100%);
        border: 1px solid rgba(0, 255, 255, 0.2);
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      
      .tf-sphere {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(0, 255, 255, 0.13) 0%, rgba(0, 255, 255, 0.4) 25%, rgba(0, 255, 255, 0.13) 50%, rgba(0, 255, 255, 0.53) 75%, rgba(0, 255, 255, 0.13) 100%);
        border: 2px solid #00FFFF;
        position: relative;
        animation: terraRotate 4s linear infinite, terraPulse 2s ease-in-out infinite;
      }
      
      .tf-sphere-text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #00FFFF;
        font-size: 0.875rem;
        text-align: center;
        text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        font-weight: bold;
      }
      
      .tf-orbital-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(0, 255, 255, 0.2);
        animation: terraRotate 4s linear infinite;
      }
      
      .tf-ring-1 {
        top: -10px;
        left: -10px;
        width: 220px;
        height: 220px;
        border-color: rgba(0, 255, 255, 0.3);
      }
      
      .tf-ring-2 {
        top: -20px;
        left: -20px;
        width: 240px;
        height: 240px;
        border-color: rgba(0, 255, 255, 0.2);

      }
      
      .tf-footer-left span,

      }
      
      /* Animations */
      @keyframes terraRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      @keyframes terraPulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      
      @keyframes terraGlow {
        0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        50% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.6); }
