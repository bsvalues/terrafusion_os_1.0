# TerraFusion Property Workbench - Elite Development Environment
# Championship-level Docker Compose configuration for property assessment excellence
# Supports 99.9% accuracy property valuation with government-grade performance

version: "3.9"

services:
  # API Gateway - Elite Traffic Management
  terrafusion-gateway:
    build:
      context: .
      dockerfile: backend/TerraFusion.Gateway/Dockerfile
    container_name: terrafusion-gateway-elite
    ports:
      - "3002:8080"
      - "3003:8443" # HTTPS for production
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
      - OCELOT_CONFIG_PATH=/app/config/ocelot.json
      - TERRAFUSION_PERFORMANCE_MODE=Elite
    depends_on:
      - terrafusion-api
      - terrafusion-ai
      - terrafusion-consciousness
    volumes:
      - ./backend/TerraFusion.Gateway/config:/app/config
      - ./logs/gateway:/app/logs
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`gateway.terrafusion.local`)"
      - "terrafusion.service.type=gateway"
      - "terrafusion.performance.mode=elite"

  # Core API Service - Championship Property Assessment
  terrafusion-api:
    build:
      context: .
      dockerfile: Dockerfile.property-workbench
      target: runtime
    container_name: terrafusion-api-championship
    ports:
      - "3001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_CONNECTION_STRING=Host=postgres-elite;Database=TerraFusionDB;Username=terrafusion_user;Password=${POSTGRES_PASSWORD}
      - REDIS_CONNECTION_STRING=redis-elite:6379
      - AI_SERVICE_URL=http://terrafusion-ai:8080
      - CONSCIOUSNESS_SERVICE_URL=http://terrafusion-consciousness:3004
      - TERRAFUSION_ACCURACY_TARGET=0.999
      - TERRAFUSION_PERFORMANCE_MODE=Championship
      - IAAO_COMPLIANCE_ENABLED=true
    depends_on:
      postgres-elite:
        condition: service_healthy
      redis-elite:
        condition: service_healthy
    volumes:
      - ./logs/api:/app/logs
      - ./config:/app/config
      - property-data:/app/data
      - ml-models:/app/ml-models
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "terrafusion.service.type=api"
      - "terrafusion.performance.mode=championship"
      - "terrafusion.accuracy.target=99.9%"

  # AI Coordination Service - Elite Agent Management
  terrafusion-ai:
    build:
      context: .
      dockerfile: backend/TerraFusion.AI/Dockerfile
    container_name: terrafusion-ai-elite
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AI_SWARM_SIZE=1008
      - AI_COORDINATION_MODE=Elite
      - QUANTUM_OPTIMIZATION_ENABLED=true
      - COSTFORGE_AI_ENDPOINT=${COSTFORGE_AI_ENDPOINT}
      - COSTFORGE_AI_KEY=${COSTFORGE_AI_KEY}
      - CONSCIOUSNESS_COORDINATION_ENABLED=true
    depends_on:
      - postgres-elite
      - redis-elite
    volumes:
      - ./logs/ai:/app/logs
      - ai-models:/app/models
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "terrafusion.service.type=ai-coordination"
      - "terrafusion.ai.swarm.size=1008"
      - "terrafusion.quantum.enabled=true"

  # Consciousness Service - Elite AI Swarm Orchestration (50,000+ Agents)
  terrafusion-consciousness:
    build:
      context: .
      dockerfile: backend/TerraFusion.Consciousness/Dockerfile
    container_name: terrafusion-consciousness-elite
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - CONSCIOUSNESS_PORT=3004
      - MAX_AGENTS=50000
      - ORCHESTRATION_MODE=Elite
      - QUANTUM_COORDINATION_ENABLED=true
      - HARMONY_TARGET=0.98
      - LATENCY_TARGET_MS=15
      - CONSCIOUSNESS_OPTIMIZATION=Championship
    depends_on:
      - redis-elite
    volumes:
      - ./logs/consciousness:/app/logs
      - consciousness-state:/app/state
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "terrafusion.service.type=consciousness-orchestration"
      - "terrafusion.agents.max=50000"
      - "terrafusion.performance.mode=elite"

  # PostgreSQL Database - Elite Data Management
  postgres-elite:
    image: postgres:16-alpine
    container_name: postgres-terrafusion-elite
    environment:
      - POSTGRES_DB=TerraFusionDB
      - POSTGRES_USER=terrafusion_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-elite:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - terrafusion-elite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion_user -d TerraFusionDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "terrafusion.service.type=database"
      - "terrafusion.persistence.type=postgresql"

  # Redis Cache - Championship Performance Caching
  redis-elite:
    image: redis:7-alpine
    container_name: redis-terrafusion-elite
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data-elite:/data
    restart: unless-stopped
    networks:
      - terrafusion-elite
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - "terrafusion.service.type=cache"
      - "terrafusion.performance.type=elite-caching"

  # ML Model Server - 99.9% Accuracy Property Valuation
  ml-model-server:
    build:
      context: marketplace/property-workbench/valuation-models
      dockerfile: Dockerfile.ml-server
    container_name: terrafusion-ml-championship
    environment:
      - MODEL_ACCURACY_TARGET=0.999
      - MODEL_OPTIMIZATION_MODE=Championship
      - TENSORFLOW_SERVING_PORT=8501
      - PYTORCH_SERVING_PORT=8502
      - SCIKIT_SERVING_PORT=8503
    volumes:
      - ml-models:/app/models
      - ./logs/ml:/app/logs
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "terrafusion.service.type=ml-inference"
      - "terrafusion.accuracy.target=99.9%"
      - "terrafusion.ml.mode=championship"

  # Property Assessment Interface - Elite Assessor Dashboard
  assessor-interface:
    build:
      context: marketplace/property-workbench/assessor-interface
      dockerfile: Dockerfile
    container_name: terrafusion-assessor-elite
    ports:
      - "3005:80"
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:3002
      - REACT_APP_ACCURACY_TARGET=99.9
      - REACT_APP_PERFORMANCE_MODE=Elite
    depends_on:
      - terrafusion-gateway
    volumes:
      - ./logs/frontend:/app/logs
    restart: unless-stopped
    networks:
      - terrafusion-elite
    labels:
      - "terrafusion.service.type=frontend"
      - "terrafusion.interface.type=assessor-elite"

  # Monitoring Stack - Championship Performance Analytics
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus-terrafusion
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - terrafusion-elite

  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana-terrafusion
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - terrafusion-elite

  # Jaeger Tracing - Elite Performance Tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: jaeger-terrafusion
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - terrafusion-elite

  # Development Tools
  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog-terrafusion
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped
    networks:
      - terrafusion-elite

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:8.2
    container_name: pgadmin-terrafusion
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@terrafusion.local
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres-elite
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - terrafusion-elite

# Elite Network Configuration
networks:
  terrafusion-elite:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "terrafusion.network.type=elite-development"

# Championship Data Volumes
volumes:
  postgres-data-elite:
    driver: local
    labels:
      - "terrafusion.volume.type=database"
  redis-data-elite:
    driver: local
    labels:
      - "terrafusion.volume.type=cache"
  property-data:
    driver: local
    labels:
      - "terrafusion.volume.type=property-data"
  ml-models:
    driver: local
    labels:
      - "terrafusion.volume.type=ml-models"
  ai-models:
    driver: local
    labels:
      - "terrafusion.volume.type=ai-models"
  consciousness-state:
    driver: local
    labels:
      - "terrafusion.volume.type=consciousness-state"
  prometheus-data:
    driver: local
    labels:
      - "terrafusion.volume.type=monitoring"
  grafana-data:
    driver: local
    labels:
      - "terrafusion.volume.type=dashboards"
  pgadmin-data:
    driver: local
    labels:
      - "terrafusion.volume.type=admin-tools"
