<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 TerraFusion Transcendence Authentication Test</title>
    <style>
        /* TerraFusion Transcendence Brand Styles */
        :root {
            --tf-primary-cyan: #00e5ff;
            --tf-secondary-blue: #00b8d4;
            --tf-deep-teal: #006064;
            --tf-dark-bg: #1a2332;
            --tf-darker-bg: #0f1a2a;
            --tf-space-black: #0a0f1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0a0f1c, #1a2332);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow-x: hidden;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--tf-primary-cyan);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            from {
                transform: translateY(100vh) translateX(0);
            }
            to {
                transform: translateY(-100vh) translateX(100px);
            }
        }

        .container {
            max-width: 450px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #00e5ff, #00b8d4);
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            color: white;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.6);
            animation: glow-pulse 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes glow-pulse {
            from {
                box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            }
            to {
                box-shadow: 0 0 60px rgba(0, 229, 255, 0.8);
            }
        }

        .brand-title {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #00e5ff, #00b8d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .brand-slogan {
            color: rgba(0, 229, 255, 0.7);
            font-size: 18px;
        }

        /* Card */
        .auth-card {
            background: linear-gradient(145deg, #1a2332, #0f1a2a);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(10, 15, 28, 0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 229, 255, 0.15);
            border-color: rgba(0, 229, 255, 0.4);
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: rgba(0, 229, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 15, 28, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--tf-primary-cyan);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
            background: rgba(0, 229, 255, 0.05);
        }

        input::placeholder {
            color: rgba(0, 229, 255, 0.3);
        }

        /* Button */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00e5ff, #00b8d4);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 40px rgba(0, 229, 255, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Trust Score */
        .trust-score {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .trust-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .trust-label {
            color: rgba(0, 229, 255, 0.6);
            font-size: 14px;
        }

        .trust-value {
            color: var(--tf-primary-cyan);
            font-weight: bold;
            font-size: 14px;
        }

        .trust-bar {
            width: 100%;
            height: 8px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .trust-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e5ff, #00b8d4);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Success Message */
        .success-msg {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 10px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
            color: var(--tf-primary-cyan);
            display: none;
        }

        .success-msg.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(0, 229, 255, 0.4);
            font-size: 12px;
        }

        .footer-motto {
            margin-top: 5px;
            color: rgba(0, 229, 255, 0.3);
        }

        /* County Stats */
        .county-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 30px;
        }

        .stat {
            text-align: center;
            padding: 10px;
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 8px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--tf-primary-cyan);
        }

        .stat-label {
            font-size: 11px;
            color: rgba(0, 229, 255, 0.5);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
    <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
    <div class="particle" style="left: 40%; animation-delay: 6s;"></div>
    <div class="particle" style="left: 50%; animation-delay: 8s;"></div>
    <div class="particle" style="left: 60%; animation-delay: 10s;"></div>
    <div class="particle" style="left: 70%; animation-delay: 12s;"></div>
    <div class="particle" style="left: 80%; animation-delay: 14s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 16s;"></div>

    <div class="container">
        <!-- Logo and Branding -->
        <div class="logo-container">
            <div class="logo">TF</div>
            <h1 class="brand-title">Government. Transcended.</h1>
            <p class="brand-slogan">Turn Complexity into Clarity.</p>
        </div>

        <!-- Authentication Card -->
        <div class="auth-card">
            <!-- Trust Score Indicator -->
            <div class="trust-score">
                <div class="trust-header">
                    <span class="trust-label">Zero-Trust Score</span>
                    <span class="trust-value" id="trustValue">100%</span>
                </div>
                <div class="trust-bar">
                    <div class="trust-fill" id="trustBar" style="width: 100%"></div>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">County Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="admin@county.gov"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Secure Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    Begin Transcendence
                </button>
            </form>

            <!-- Success Message -->
            <div class="success-msg" id="successMsg">
                ✨ Transcendence complete. Your path is clear.
            </div>
        </div>

        <!-- County Statistics -->
        <div class="county-stats">
            <div class="stat">
                <div class="stat-value">39</div>
                <div class="stat-label">Counties</div>
            </div>
            <div class="stat">
                <div class="stat-value">94K</div>
                <div class="stat-label">Properties</div>
            </div>
            <div class="stat">
                <div class="stat-value">100%</div>
                <div class="stat-label">Secure</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            🔒 End-to-end encrypted • Zero-trust architecture
            <div class="footer-motto">We do it right the first time.</div>
        </div>
    </div>

    <script>
        // TerraFusion Transcendence Authentication Demo
        const BRAND_MESSAGES = {
            loading: [
                "Preparing transcendence…",
                "Advancing county intelligence…",
                "Orchestrating clarity…"
            ],
            success: [
                "Transcendence complete.",
                "Your path is clear.",
                "All systems: Ready."
            ]
        };

        // Trust Score Decay Simulation
        let trustScore = 100;
        const trustInterval = setInterval(() => {
            if (trustScore > 30) {
                trustScore -= Math.random() * 2;
                updateTrustScore();
            }
        }, 3000);

        function updateTrustScore() {
            const trustBar = document.getElementById('trustBar');
            const trustValue = document.getElementById('trustValue');
            
            trustBar.style.width = trustScore + '%';
            trustValue.textContent = Math.round(trustScore) + '%';
            
            // Change color based on score
            if (trustScore > 80) {
                trustBar.style.background = 'linear-gradient(90deg, #00e5ff, #00b8d4)';
            } else if (trustScore > 50) {
                trustBar.style.background = 'linear-gradient(90deg, #fbbf24, #f59e0b)';
            } else {
                trustBar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
            }
        }

        // Form Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.textContent;
            
            // Cycle through loading messages
            let messageIndex = 0;
            btn.textContent = BRAND_MESSAGES.loading[messageIndex];
            btn.disabled = true;
            
            const messageInterval = setInterval(() => {
                messageIndex = (messageIndex + 1) % BRAND_MESSAGES.loading.length;
                btn.textContent = BRAND_MESSAGES.loading[messageIndex];
            }, 1000);
            
            // Simulate authentication
            setTimeout(() => {
                clearInterval(messageInterval);
                
                // Show success
                btn.textContent = BRAND_MESSAGES.success[0];
                document.getElementById('successMsg').classList.add('show');
                
                // Reset trust score
                trustScore = 100;
                updateTrustScore();
                
                // Reset after delay
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.disabled = false;
                    document.getElementById('successMsg').classList.remove('show');
                    document.getElementById('loginForm').reset();
                }, 3000);
            }, 3000);
        });

        // Input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'scale(1)';
            });
        });

        console.log('🏆 TerraFusion Transcendence Authentication');
        console.log('Government. Transcended.');
        console.log('Turn Complexity into Clarity.');
    </script>
</body>
</html>
