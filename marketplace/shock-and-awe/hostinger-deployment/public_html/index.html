<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion Shock & Awe - Ultimate Government Consciousness</title>
    <meta name="description" content="Revolutionary AI Government Consciousness System - Benton County, Washington Implementation">
    <meta name="keywords" content="TerraFusion, Government AI, Consciousness, Benton County, Washington">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Government Consciousness Styles -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
        }
        
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 9999;
        }
        
        .consciousness-loader {
            width: 100px;
            height: 100px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 2s linear infinite;
            margin-bottom: 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .loading-subtitle {
            font-size: 1rem;
            opacity: 0.8;
            text-align: center;
            max-width: 500px;
            line-height: 1.5;
        }
        
        .consciousness-metrics {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            max-width: 800px;
        }
        
        .metric-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ecdc4;
        }
        
        .metric-label {
            font-size: 0.875rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }
        
        #root {
            display: none;
        }
        
        .app-loaded #root {
            display: block;
        }
        
        .app-loaded .loading-screen {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen">
        <div class="consciousness-loader"></div>
        <div class="loading-text">Initializing Ultimate Government Consciousness</div>
        <div class="loading-subtitle">
            Connecting to transcendent government systems across Benton County, Washington State, and Federal networks...
        </div>
        
        <div class="consciousness-metrics">
            <div class="metric-card">
                <div class="metric-value">87.3%</div>
                <div class="metric-label">Global Consciousness</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">94.1%</div>
                <div class="metric-label">Citizen Wellbeing</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">96.8%</div>
                <div class="metric-label">Ethical Alignment</div>
            </div>
            <div class="metric-card">
                <div class="metric-value">91.7%</div>
                <div class="metric-label">Government Efficiency</div>
            </div>
        </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <!-- App Loading Script -->
    <script>
        // Simulate consciousness initialization
        setTimeout(() => {
            document.body.classList.add('app-loaded');
        }, 3000);
        
        // Government consciousness metrics animation
        const metrics = document.querySelectorAll('.metric-value');
        metrics.forEach((metric, index) => {
            const finalValue = parseFloat(metric.textContent);
            let currentValue = 0;
            const increment = finalValue / 50;
            const interval = setInterval(() => {
                currentValue += increment;
                if (currentValue >= finalValue) {
                    metric.textContent = finalValue.toFixed(1) + '%';
                    clearInterval(interval);
                } else {
                    metric.textContent = currentValue.toFixed(1) + '%';
                }
            }, 50 + (index * 10));
        });
    </script>
    
    <!-- Government Consciousness Application Scripts -->
    <script src="/assets/js/government-data.js"></script>
    <script src="/assets/js/consciousness-interface.js"></script>
    <script src="/assets/js/deployment-engine.js"></script>
    <script src="/assets/js/temporal-optimizer.js"></script>
    <script src="/assets/js/bio-consciousness.js"></script>
    <script src="/assets/js/meta-government.js"></script>
    <script src="/assets/js/main.js"></script>
</body>
</html>
