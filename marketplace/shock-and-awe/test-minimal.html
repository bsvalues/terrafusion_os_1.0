<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0a0f1c;
            color: white;
            font-family: Arial, sans-serif;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-button {
            background: linear-gradient(135deg, #00e5ff, #00b8d4);
            color: #0a0f1c;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            display: inline-block;
        }
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 229, 255, 0.3);
        }
        .status {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🚀 TerraFusion Test Page</h1>
        <p>If you can see this, the server is working correctly.</p>
        
        <div class="status">
            <h3>✅ Server Status: WORKING</h3>
            <p>URL: <a href="http://127.0.0.1:8080" style="color: #00e5ff;">http://127.0.0.1:8080</a></p>
            <p>Time: <span id="current-time"></span></p>
        </div>
        
        <h2>Quick Tests:</h2>
        <button class="test-button" onclick="testAlert()">Test JavaScript</button>
        <button class="test-button" onclick="testConsole()">Test Console</button>
        <button class="test-button" onclick="location.href='index.html'">Go to Main Page</button>
        
        <h2>Debug Info:</h2>
        <div class="status">
            <p><strong>Browser:</strong> <span id="browser-info"></span></p>
            <p><strong>Screen:</strong> <span id="screen-info"></span></p>
            <p><strong>Location:</strong> <span id="location-info"></span></p>
        </div>
        
        <h2>File Check:</h2>
        <div id="file-check" class="status">
            Testing file access...
        </div>
    </div>
    
    <script>
        // Update current time
        function updateTime() {
            document.getElementById('current-time').textContent = new Date().toLocaleString();
        }
        updateTime();
        setInterval(updateTime, 1000);
        
        // Test functions
        function testAlert() {
            alert('JavaScript is working! ✅');
        }
        
        function testConsole() {
            console.log('Console test successful! ✅');
            console.log('Window object:', window);
            console.log('Document object:', document);
            alert('Check the browser console (F12) - message logged!');
        }
        
        // Browser info
        document.getElementById('browser-info').textContent = navigator.userAgent;
        document.getElementById('screen-info').textContent = screen.width + 'x' + screen.height;
        document.getElementById('location-info').textContent = location.href;
        
        // Test file access
        function testFiles() {
            const files = ['index.html', 'js/main.js', 'styles/main.css'];
            const fileCheck = document.getElementById('file-check');
            let results = '<h4>File Access Test:</h4>';
            
            let completed = 0;
            files.forEach(file => {
                fetch(file)
                    .then(response => {
                        results += `<p>✅ ${file}: ${response.status} (${response.statusText})</p>`;
                        completed++;
                        if (completed === files.length) {
                            fileCheck.innerHTML = results;
                        }
                    })
                    .catch(error => {
                        results += `<p>❌ ${file}: ${error.message}</p>`;
                        completed++;
                        if (completed === files.length) {
                            fileCheck.innerHTML = results;
                        }
                    });
            });
        }
        
        testFiles();
        
        console.log('🧪 Test page loaded successfully');
        console.log('🔗 Main page available at: index.html');
    </script>
</body>
</html>
