syntax = "proto3";

package terrafusion.modules.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "TerraFusion.Grpc.Modules.V1";
option go_package = "github.com/terrafusion/protos/modules/v1;modules";

// Module types
message ModuleId {
  string module_name = 1;
  string version = 2;
}

message Module {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string version = 4;
  ModuleStatus status = 5;
  ModuleTier tier = 6;
  string category = 7;
  string author = 8;
  repeated string dependencies = 9;
  repeated string capabilities = 10;
  ModuleConfiguration config = 11;
  ModuleHealth health = 12;
  google.protobuf.Timestamp last_updated = 13;
}

enum ModuleStatus {
  MODULE_STATUS_UNSPECIFIED = 0;
  LOADING = 1;
  ACTIVE = 2;
  INACTIVE = 3;
  ERROR = 4;
  UPDATING = 5;
  UNLOADING = 6;
}

enum ModuleTier {
  MODULE_TIER_UNSPECIFIED = 0;
  TIER_1_CORE = 1;
  TIER_2_ESSENTIAL = 2;
  TIER_3_EXTENDED = 3;
}

message ModuleConfiguration {
  map<string, string> settings = 1;
  repeated string endpoints = 2;
  repeated int32 ports = 3;
  bool hot_reload_enabled = 4;
  bool restart_required = 5;
}

message ModuleHealth {
  bool is_healthy = 1;
  double cpu_usage = 2;
  double memory_usage = 3;
  int32 active_connections = 4;
  double response_time_ms = 5;
  int32 error_count = 6;
  google.protobuf.Timestamp last_health_check = 7;
  string last_error = 8;
}

message ModuleList {
  repeated Module modules = 1;
  int32 total_count = 2;
  int32 active_count = 3;
  int32 error_count = 4;
  google.protobuf.Timestamp retrieved_at = 5;
}

message ModuleLoadRequest {
  string module_name = 1;
  ModuleConfiguration config = 2;
  bool force_reload = 3;
}

message ModuleUnloadRequest {
  string module_name = 1;
  bool force_unload = 2;
  bool graceful_shutdown = 3;
}

message ModuleUpdateRequest {
  string module_name = 1;
  string target_version = 2;
  ModuleConfiguration new_config = 3;
  bool auto_restart = 4;
}

message ModuleEvent {
  string module_name = 1;
  ModuleEventType event_type = 2;
  ModuleStatus old_status = 3;
  ModuleStatus new_status = 4;
  string message = 5;
  google.protobuf.Timestamp timestamp = 6;
  map<string, string> metadata = 7;
}

enum ModuleEventType {
  MODULE_EVENT_TYPE_UNSPECIFIED = 0;
  LOADED = 1;
  UNLOADED = 2;
  STARTED = 3;
  STOPPED = 4;
  ERROR_OCCURRED = 5;
  CONFIG_CHANGED = 6;
  HEALTH_CHANGED = 7;
  UPDATE_AVAILABLE = 8;
}

message HotReloadEvent {
  string module_name = 1;
  string file_path = 2;
  HotReloadAction action = 3;
  google.protobuf.Timestamp timestamp = 4;
  bool reload_successful = 5;
  string error_message = 6;
}

enum HotReloadAction {
  HOT_RELOAD_ACTION_UNSPECIFIED = 0;
  FILE_CREATED = 1;
  FILE_MODIFIED = 2;
  FILE_DELETED = 3;
  MANIFEST_CHANGED = 4;
}

// Service definitions
service ModuleManagementService {
  // Module lifecycle
  rpc LoadModule(ModuleLoadRequest) returns (Module);
  rpc UnloadModule(ModuleUnloadRequest) returns (google.protobuf.Empty);
  rpc UpdateModule(ModuleUpdateRequest) returns (Module);
  rpc RestartModule(ModuleId) returns (Module);
  
  // Module queries
  rpc GetModule(ModuleId) returns (Module);
  rpc ListModules(google.protobuf.Empty) returns (ModuleList);
  rpc GetModuleHealth(ModuleId) returns (ModuleHealth);
  
  // Module monitoring
  rpc StreamModuleEvents(google.protobuf.Empty) returns (stream ModuleEvent);
  rpc StreamModuleHealth(ModuleId) returns (stream ModuleHealth);
  
  // Hot reload
  rpc EnableHotReload(ModuleId) returns (google.protobuf.Empty);
  rpc DisableHotReload(ModuleId) returns (google.protobuf.Empty);
  rpc StreamHotReloadEvents(google.protobuf.Empty) returns (stream HotReloadEvent);
  
  // Bulk operations
  rpc LoadAllModules(google.protobuf.Empty) returns (ModuleList);
  rpc RefreshModules(google.protobuf.Empty) returns (ModuleList);
  
  // System health
  rpc GetSystemHealth(google.protobuf.Empty) returns (SystemHealth);
}

message SystemHealth {
  bool is_healthy = 1;
  int32 total_modules = 2;
  int32 healthy_modules = 3;
  int32 unhealthy_modules = 4;
  double avg_response_time_ms = 5;
  double total_cpu_usage = 6;
  double total_memory_usage = 7;
  google.protobuf.Timestamp last_check = 8;
  repeated string warnings = 9;
  repeated string errors = 10;
}