syntax = "proto3";

package terrafusion.ai.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";

option csharp_namespace = "TerraFusion.Grpc.Ai.V1";
option go_package = "github.com/terrafusion/protos/ai/v1;ai";

// Agent coordination types
message AgentId {
  string agent_id = 1;
  AgentType agent_type = 2;
  string cluster_id = 3;
}

enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0;
  COORDINATOR = 1;
  WORKER = 2;
  SPECIALIST = 3;
  MONITOR = 4;
  SECURITY = 5;
  BACKUP = 6;
}

message AgentStatus {
  AgentId agent_id = 1;
  AgentState state = 2;
  double cpu_usage = 3;
  double memory_usage = 4;
  int32 active_tasks = 5;
  int32 completed_tasks = 6;
  google.protobuf.Timestamp last_heartbeat = 7;
  string current_task_id = 8;
  map<string, string> metadata = 9;
}

enum AgentState {
  AGENT_STATE_UNSPECIFIED = 0;
  INITIALIZING = 1;
  IDLE = 2;
  WORKING = 3;
  OVERLOADED = 4;
  ERROR = 5;
  OFFLINE = 6;
}

message SwarmStatus {
  int32 total_agents = 1;
  int32 active_agents = 2;
  int32 idle_agents = 3;
  int32 working_agents = 4;
  int32 error_agents = 5;
  double overall_cpu_usage = 6;
  double overall_memory_usage = 7;
  int32 queued_tasks = 8;
  int32 processing_tasks = 9;
  google.protobuf.Timestamp last_updated = 10;
  SwarmTopology topology = 11;
}

message SwarmTopology {
  int32 coordinator_agents = 1;
  int32 worker_agents = 2;
  int32 specialist_agents = 3;
  int32 monitor_agents = 4;
  int32 security_agents = 5;
  int32 backup_agents = 6;
  repeated string active_clusters = 7;
}

message Task {
  string task_id = 1;
  TaskType task_type = 2;
  TaskPriority priority = 3;
  google.protobuf.Any payload = 4;
  string assigned_agent_id = 5;
  TaskState state = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp completed_at = 9;
  map<string, string> context = 10;
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  VALUATION = 1;
  GIS_ANALYSIS = 2;
  DATA_SYNC = 3;
  REPORT_GENERATION = 4;
  MARKET_ANALYSIS = 5;
  SECURITY_SCAN = 6;
  SYSTEM_MONITORING = 7;
}

enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  CRITICAL = 4;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  ASSIGNED = 2;
  RUNNING = 3;
  COMPLETED = 4;
  FAILED = 5;
  CANCELLED = 6;
}

message TaskResult {
  string task_id = 1;
  TaskState final_state = 2;
  google.protobuf.Any result = 3;
  string error_message = 4;
  google.protobuf.Timestamp completed_at = 5;
  map<string, string> metrics = 6;
}

message AgentHeartbeat {
  AgentId agent_id = 1;
  AgentStatus status = 2;
  google.protobuf.Timestamp timestamp = 3;
}

message SwarmCommand {
  string command_id = 1;
  SwarmCommandType command_type = 2;
  repeated string target_agent_ids = 3; // Empty means broadcast
  google.protobuf.Any payload = 4;
  bool require_acknowledgment = 5;
}

enum SwarmCommandType {
  SWARM_COMMAND_TYPE_UNSPECIFIED = 0;
  SCALE_UP = 1;
  SCALE_DOWN = 2;
  REDISTRIBUTE_TASKS = 3;
  EMERGENCY_STOP = 4;
  HEALTH_CHECK = 5;
  UPDATE_CONFIG = 6;
  RESTART_AGENT = 7;
}

// Service definitions
service SwarmCoordinationService {
  // Agent lifecycle
  rpc RegisterAgent(AgentId) returns (AgentStatus);
  rpc UnregisterAgent(AgentId) returns (google.protobuf.Empty);
  
  // Heartbeat and status
  rpc Heartbeat(AgentHeartbeat) returns (google.protobuf.Empty);
  rpc GetAgentStatus(AgentId) returns (AgentStatus);
  rpc GetSwarmStatus(google.protobuf.Empty) returns (SwarmStatus);
  
  // Task management
  rpc SubmitTask(Task) returns (TaskResult);
  rpc GetTask(AgentId) returns (Task); // Agent requests next task
  rpc CompleteTask(TaskResult) returns (google.protobuf.Empty);
  
  // Streaming interfaces
  rpc StreamTasks(AgentId) returns (stream Task); // Agent receives task stream
  rpc StreamHeartbeats(stream AgentHeartbeat) returns (google.protobuf.Empty);
  rpc StreamSwarmStatus(google.protobuf.Empty) returns (stream SwarmStatus);
  
  // Command and control
  rpc SendCommand(SwarmCommand) returns (google.protobuf.Empty);
  rpc StreamCommands(AgentId) returns (stream SwarmCommand);
}

service AgentService {
  // Individual agent control
  rpc Start(google.protobuf.Empty) returns (AgentStatus);
  rpc Stop(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc Restart(google.protobuf.Empty) returns (AgentStatus);
  rpc GetStatus(google.protobuf.Empty) returns (AgentStatus);
  
  // Task execution
  rpc ExecuteTask(Task) returns (TaskResult);
  rpc CancelTask(string) returns (google.protobuf.Empty); // task_id
  
  // Health and diagnostics
  rpc Health(google.protobuf.Empty) returns (AgentHealth);
}

message AgentHealth {
  bool is_healthy = 1;
  string version = 2;
  google.protobuf.Timestamp uptime = 3;
  double cpu_usage = 4;
  double memory_usage = 5;
  int32 tasks_completed = 6;
  string last_error = 7;
}