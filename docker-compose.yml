services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: terrafusion-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-terrafusion}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - terrafusion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-terrafusion}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - terrafusion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: terrafusion-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-terrafusion};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-redis}
      - JWT__SecretKey=${JWT_SECRET_KEY:-your-super-secret-jwt-key-here}
      - JWT__Issuer=TerraFusion
      - JWT__Audience=TerraFusion-Client
      - JWT__ExpiryInDays=7
    ports:
      - "8080:8080"
    networks:
      - terrafusion-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # AI Agent
  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: ../docker/ai-agent/Dockerfile
    container_name: terrafusion-ai-agent
    environment:
      - NODE_ENV=development
      - PORT=3001
      - API_BASE_URL=http://backend:8080
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    ports:
      - "3001:3001"
    networks:
      - terrafusion-network
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: terrafusion-frontend
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8080
      - REACT_APP_AI_AGENT_URL=http://localhost:3001
    ports:
      - "3000:8080"
    networks:
      - terrafusion-network
    depends_on:
      backend:
        condition: service_healthy
      ai-agent:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Nginx Load Balancer (for production)
  nginx:
    image: nginx:1.25-alpine
    container_name: terrafusion-nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - terrafusion-network
    depends_on:
      - frontend
      - backend
      - ai-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
