services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-cos-db
    environment:
      POSTGRES_DB: terrafusion_cos
      POSTGRES_USER: terrafusion
      POSTGRES_PASSWORD: ${DB_PASSWORD:-terrafusion_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terrafusion-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: terrafusion-cos-cache
    command: redis-server --requirepass ${REDIS_PASSWORD:-terrafusion_redis_secure}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - terrafusion-network

  # TerraFusion cOS Kernel (Python FastAPI)
  kernel:
    build:
      context: .
      dockerfile: Dockerfile.kernel
    container_name: terrafusion-cos-kernel
    environment:
      DATABASE_URL: postgresql://terrafusion:${DB_PASSWORD:-terrafusion_secure_password}@postgres:5432/terrafusion_cos
      REDIS_URL: redis://default:${REDIS_PASSWORD:-terrafusion_redis_secure}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_here}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "${KERNEL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./kernel:/app/kernel
      - ./substrate:/app/substrate
      - ./services:/app/services
      - ./applications:/app/applications
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Swarm Coordinator
  ai-swarm:
    build:
      context: .
      dockerfile: Dockerfile.ai-swarm
    container_name: terrafusion-cos-ai-swarm
    environment:
      REDIS_URL: redis://default:${REDIS_PASSWORD:-terrafusion_redis_secure}@redis:6379/1
      SWARM_SIZE: 50000
      SUPREME_COMMANDER_ENABLED: true
    ports:
      - "${AI_SWARM_PORT:-8001}:8001"
    depends_on:
      - redis
    networks:
      - terrafusion-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # CostForge AI MCP Server
  costforge:
    build:
      context: .
      dockerfile: Dockerfile.costforge
    container_name: terrafusion-cos-costforge
    environment:
      DATABASE_URL: postgresql://terrafusion:${DB_PASSWORD:-terrafusion_secure_password}@postgres:5432/terrafusion_cos
      MCP_PORT: 8002
    ports:
      - "${COSTFORGE_PORT:-8002}:8002"
    depends_on:
      - postgres
    networks:
      - terrafusion-network

  # TerraFusion Sync Service
  sync-service:
    build:
      context: .
      dockerfile: Dockerfile.sync
    container_name: terrafusion-cos-sync
    environment:
      DATABASE_URL: postgresql://terrafusion:${DB_PASSWORD:-terrafusion_secure_password}@postgres:5432/terrafusion_cos
      REDIS_URL: redis://default:${REDIS_PASSWORD:-terrafusion_redis_secure}@redis:6379/2
    ports:
      - "${SYNC_PORT:-8003}:8003"
    depends_on:
      - postgres
      - redis
    networks:
      - terrafusion-network

  # TerraFlow Orchestrator
  terraflow:
    build:
      context: .
      dockerfile: Dockerfile.flow
    container_name: terrafusion-cos-flow
    environment:
      DATABASE_URL: postgresql://terrafusion:${DB_PASSWORD:-terrafusion_secure_password}@postgres:5432/terrafusion_cos
      REDIS_URL: redis://default:${REDIS_PASSWORD:-terrafusion_redis_secure}@redis:6379/3
    ports:
      - "${FLOW_PORT:-8004}:8004"
    depends_on:
      - postgres
      - redis
    networks:
      - terrafusion-network

  # Security Mesh
  security-mesh:
    build:
      context: .
      dockerfile: Dockerfile.security
    container_name: terrafusion-cos-security
    environment:
      DATABASE_URL: postgresql://terrafusion:${DB_PASSWORD:-terrafusion_secure_password}@postgres:5432/terrafusion_cos
      COMPLIANCE_LEVEL: FISMA_HIGH
    ports:
      - "${SECURITY_PORT:-8005}:8005"
    depends_on:
      - postgres
    networks:
      - terrafusion-network

  # Frontend (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrafusion-cos-frontend
    environment:
      VITE_API_URL: http://localhost:${KERNEL_PORT:-8000}
      VITE_AI_SWARM_URL: http://localhost:${AI_SWARM_PORT:-8001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - kernel
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - terrafusion-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: terrafusion-cos-proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - kernel
      - frontend
    networks:
      - terrafusion-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-cos-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - terrafusion-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-cos-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - terrafusion-network

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

