[workspace]
resolver = "2"
members = [
    "crates/agent-coordination",
    "crates/geospatial-engine", 
    "crates/valuation-kernel",
    "crates/security-layer",
    "crates/performance-monitor",
    "crates/ffi-bridge"
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["TerraFusion Systems <systems@terrafusion.gov>"]
license = "MIT"
repository = "https://github.com/terrafusion/terrafusion-cos-2.0"
homepage = "https://terrafusion.gov"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and metrics
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.13"

# Data structures
dashmap = "5.5"
crossbeam = "0.8"
parking_lot = "0.12"

# Cryptography
ring = "0.17"
rustls = "0.22"
sha2 = "0.10"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "time"] }

# HTTP
hyper = "1.0"
axum = "0.7"
tower = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Geospatial
geo = "0.27"
geojson = "0.24"
proj = "0.27"
rstar = "0.11"

# Performance
rayon = "1.8"
num_cpus = "1.16"

# FFI
libc = "0.2"
cbindgen = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-with-debug]
inherits = "release"
strip = false
debug = true

[profile.bench]
inherits = "release"

# MIT PhD Systems Design Engineer Standards
# Government. Transcended.
