---
# ServiceMonitor for Istio (Envoy sidecars)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istio-envoy-monitor
  namespace: observability
  labels:
    app: istio
    release: prometheus
spec:
  selector:
    matchLabels:
      istio: envoy
  namespaceSelector:
    any: true
  endpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s
      scrapeTimeout: 10s

---
# PodMonitor for Istio control plane
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-control-plane-monitor
  namespace: observability
  labels:
    app: istiod
    release: prometheus
spec:
  selector:
    matchLabels:
      app: istiod
  namespaceSelector:
    matchNames:
      - istio-system
  podMetricsEndpoints:
    - port: http-monitoring
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
