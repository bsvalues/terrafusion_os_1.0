---
# ServiceMonitor for Kong API Gateway
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kong-monitor
  namespace: observability
  labels:
    app: kong
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  namespaceSelector:
