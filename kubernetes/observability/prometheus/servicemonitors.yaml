---
# TerraFusion OS - Prometheus ServiceMonitors
# Configures Prometheus to scrape metrics from all services
################################################################################

# ServiceMonitor for Backend API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api-monitor
  namespace: observability
  labels:
    app: backend-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: backend-api
  namespaceSelector:
    matchNames:
      - terrafusion-prod
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

