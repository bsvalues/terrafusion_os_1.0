# TerraFusion OS - Resource Requests and Limits
# Defines CPU/memory resources for all services (required for HPA)
################################################################################

---
# Backend API - ASP.NET Core API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: terrafusion-prod
  labels:
    app: backend-api
    version: v1
spec:
  replicas: 2  # Initial replicas (HPA will adjust)
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
        version: v1
    spec:
      containers:
        - name: backend-api
          image: terrafusion/backend-api:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 500m        # 0.5 CPU cores minimum
              memory: 512Mi    # 512 MB minimum
            limits:
              cpu: 2000m       # 2 CPU cores maximum
              memory: 2Gi      # 2 GB maximum
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: DATABASE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: connection-string
            - name: REDIS_HOST
              value: "redis-service.terrafusion-prod.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

---
# AI Agent - Node.js AI Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: terrafusion-prod
  labels:
    app: ai-agent
    version: v1
spec:
  replicas: 2  # Initial replicas (HPA will adjust)
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
        version: v1
    spec:
      containers:
        - name: ai-agent
          image: terrafusion/ai-agent:latest
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 1000m       # 1 CPU core minimum (AI workloads are CPU-intensive)
              memory: 1Gi      # 1 GB minimum
            limits:
              cpu: 4000m       # 4 CPU cores maximum
              memory: 4Gi      # 4 GB maximum
          env:
            - name: NODE_ENV
              value: "production"
            - name: BACKEND_API_URL
              value: "http://backend-api.terrafusion-prod.svc.cluster.local:8080"
            - name: REDIS_HOST
              value: "redis-service.terrafusion-prod.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: MAX_QUEUE_SIZE
              value: "100"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

