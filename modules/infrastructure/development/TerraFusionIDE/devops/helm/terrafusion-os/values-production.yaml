# TerraFusion OS 1.0 - Production Deployment Values
# Complete Government AI Operating System with AI Swarm Supreme Commander
# Production Configuration for Multi-County Deployment

# Global Configuration
global:
  nameOverride: "terrafusion-os"
  fullnameOverride: "terrafusion-os-production"
  namespace: "terrafusion-production"
  environment: "production"
  
  # Image Configuration
  imageRegistry: "ghcr.io/terrafusion"
  imagePullPolicy: "Always"
  imagePullSecrets:
    - name: "ghcr-terrafusion-secret"
  
  # TerraFusion Specific Configuration
  terrafusion:
    version: "1.0.0"
    aiAgentScale: 50000
    quantumOptimization: true
    consciousnessLayer: true
    multiCountyCoordination: true
    governmentCompliance: true
    
    # Performance Targets
    performance:
      apiResponseTimeMs: 6
      systemEfficiencyPercent: 99.7
      performanceMultiplier: 379000000
      
    # Government Compliance
    compliance:
      fisma: true
      section508: true
      encryptionLevel: "government-grade"
      auditLogging: "comprehensive"

# AI Swarm Supreme Commander Configuration
aiSwarmSupremeCommander:
  enabled: true
  replicaCount: 1  # Single Supreme Commander
  
  image:
    repository: "ai-swarm-supreme-commander"
    tag: "1.0.0"
    pullPolicy: "Always"
  
  # Supreme Commander Configuration
  config:
    mode: "active"
    authorityLevel: "absolute"
    agentHierarchy:
      totalAgents: 50000
      structure:
        supremeCommander: 1
        aiCouncilMembers: 20
        quantumCommanders: 200
        domainGenerals: 1000
        processCoordinators: 3000
        expertSpecialists: 10000
        adaptiveExecutors: 20000
        microOptimizers: 15780
  
  # Resources
  resources:
    requests:
      memory: "16Gi"
      cpu: "8000m"
      ephemeralStorage: "50Gi"
    limits:
      memory: "32Gi"
      cpu: "16000m"
      ephemeralStorage: "100Gi"
  
  # Node Configuration
  nodeSelector:
    terrafusion.gov/node-type: "supreme-commander"
    kubernetes.io/arch: "amd64"
  
  tolerations:
    - key: "terrafusion.gov/supreme-commander"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  
  # Service Configuration
  service:
    type: ClusterIP
    ports:
      command: 8080
      metrics: 9090
      quantum: 8443
      consciousness: 9443
  
  # Health Checks
  livenessProbe:
    enabled: true
    path: "/health/supreme-commander"
    initialDelaySeconds: 60
    periodSeconds: 30
  
  readinessProbe:
    enabled: true
    path: "/ready/supreme-commander"
    initialDelaySeconds: 30
    periodSeconds: 10
  
  # Storage
  persistence:
    enabled: true
    size: "100Gi"
    storageClass: "fast-ssd"

# AI Agent Hierarchy Configuration
aiAgentHierarchy:
  # AI Council Members (20 agents)
  aiCouncilMembers:
    enabled: true
    replicaCount: 20
    image:
      repository: "ai-council-member"
      tag: "1.0.0"
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"
  
  # Quantum Commanders (200 agents)
  quantumCommanders:
    enabled: true
    replicaCount: 200
    image:
      repository: "quantum-commander"
      tag: "1.0.0"
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  
  # Domain Generals (1,000 agents)
  domainGenerals:
    enabled: true
    replicaCount: 1000
    image:
      repository: "domain-general"
      tag: "1.0.0"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  
  # Process Coordinators (3,000 agents)
  processCoordinators:
    enabled: true
    replicaCount: 3000
    image:
      repository: "process-coordinator"
      tag: "1.0.0"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  # Expert Specialists (10,000 agents)
  expertSpecialists:
    enabled: true
    replicaCount: 10000
    image:
      repository: "expert-specialist"
      tag: "1.0.0"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
  
  # Adaptive Executors (20,000 agents)
  adaptiveExecutors:
    enabled: true
    replicaCount: 20000
    image:
      repository: "adaptive-executor"
      tag: "1.0.0"
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
  
  # Micro Optimizers (15,780 agents)
  microOptimizers:
    enabled: true
    replicaCount: 15780
    image:
      repository: "micro-optimizer"
      tag: "1.0.0"
    resources:
      requests:
        memory: "64Mi"
        cpu: "25m"
      limits:
        memory: "128Mi"
        cpu: "50m"

# Quantum Gauge Theory Engine
quantumEngine:
  enabled: true
  replicaCount: 1
  
  image:
    repository: "quantum-gauge-theory-engine"
    tag: "1.0.0"
  
  config:
    gaugeGroup: "SU(3)_Government"
    couplingConstant: 0.379
    vacuumExpectationValue: 94149
    topologicalInvariants: true
    quantumTunneling: true
  
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  
  service:
    type: ClusterIP
    port: 8444

# Consciousness Service Layer
consciousnessService:
  enabled: true
  replicaCount: 1
  
  image:
    repository: "consciousness-service-layer"
    tag: "1.0.0"
  
  config:
    coherenceTarget: 98
    universalTranslation: true
    speciesDetection: true
    quantumEntanglementSimulation: true
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  service:
    type: ClusterIP
    port: 9444

# TerraFusion API Backend (.NET 8.0)
api:
  enabled: true
  replicaCount: 3
  
  image:
    repository: "terrafusion-api"
    tag: "1.0.0"
  
  config:
    environment: "Production"
    aspnetcoreUrls: "http://+:5000"
    
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000
  
  # Auto Scaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  # Health Checks
  livenessProbe:
    enabled: true
    path: "/health"
    initialDelaySeconds: 30
  
  readinessProbe:
    enabled: true
    path: "/health/ready"
    initialDelaySeconds: 15

# TerraFusion Frontend PWA (React 18)
frontend:
  enabled: true
  replicaCount: 2
  
  image:
    repository: "terrafusion-frontend"
    tag: "1.0.0"
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  service:
    type: ClusterIP
    port: 3000
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Module Ecosystem (32+ Production Modules)
modules:
  enabled: true
  
  # Tier 1 - Core Government Modules
  tier1:
    enabled: true
    replicaCount: 2
    image:
      repository: "terrafusion-modules-tier1"
      tag: "1.0.0"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  
  # Tier 2 - Essential Operations Modules
  tier2:
    enabled: true
    replicaCount: 2
    image:
      repository: "terrafusion-modules-tier2"
      tag: "1.0.0"
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  
  # Tier 3 - Extended Features Modules
  tier3:
    enabled: true
    replicaCount: 1
    image:
      repository: "terrafusion-modules-tier3"
      tag: "1.0.0"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"

# Multi-County Coordination
multiCounty:
  enabled: true
  
  # Benton County (Production)
  benton:
    enabled: true
    status: "production"
    properties: 94149
    harrisPACSIntegration: true
    replicaCount: 2
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  
  # Yakima County (Flagship)
  yakima:
    enabled: true
    status: "flagship"
    customizations: ["enhanced-analytics", "advanced-reporting"]
    replicaCount: 2
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  
  # Cowlitz County (Customized)
  cowlitz:
    enabled: true
    status: "customized"
    specializations: ["rural-optimization", "efficiency-focus"]
    replicaCount: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

# Database Configuration
postgresql:
  enabled: true
  auth:
    existingSecret: "terrafusion-database-secrets"
    secretKeys:
      adminPasswordKey: "postgres-password"
      userPasswordKey: "password"
      replicationPasswordKey: "replication-password"
  
  architecture: "replication"
  primary:
    persistence:
      enabled: true
      size: "500Gi"
      storageClass: "fast-ssd"
    resources:
      requests:
        memory: "8Gi"
        cpu: "4000m"
      limits:
        memory: "16Gi"
        cpu: "8000m"
  
  readReplicas:
    replicaCount: 2
    persistence:
      enabled: true
      size: "500Gi"
      storageClass: "fast-ssd"
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis Configuration
redis:
  enabled: true
  architecture: "replication"
  auth:
    enabled: true
    existingSecret: "terrafusion-redis-secrets"
    existingSecretPasswordKey: "redis-password"
  
  master:
    persistence:
      enabled: true
      size: "100Gi"
      storageClass: "fast-ssd"
    resources:
      requests:
        memory: "4Gi"
        cpu: "2000m"
      limits:
        memory: "8Gi"
        cpu: "4000m"
  
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: "100Gi"
      storageClass: "fast-ssd"
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Monitoring Configuration
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    server:
      persistentVolume:
        enabled: true
        size: "500Gi"
        storageClass: "fast-ssd"
      resources:
        requests:
          memory: "8Gi"
          cpu: "2000m"
        limits:
          memory: "16Gi"
          cpu: "4000m"
    
    alertmanager:
      enabled: true
      persistentVolume:
        enabled: true
        size: "50Gi"
        storageClass: "fast-ssd"
  
  grafana:
    enabled: true
    persistence:
      enabled: true
      size: "50Gi"
      storageClass: "fast-ssd"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

# Security Configuration
security:
  enabled: true
  
  # Network Policies
  networkPolicies:
    enabled: true
    
  # Pod Security Standards
  podSecurityStandards:
    enabled: true
    enforceLevel: "restricted"
    
  # RBAC
  rbac:
    create: true
    
  # Service Account
  serviceAccount:
    create: true
    name: "terrafusion-ai-swarm"
    
  # TLS/SSL Configuration
  tls:
    enabled: true
    certManager:
      enabled: true
      issuer: "letsencrypt-prod"

# Ingress Configuration
ingress:
  enabled: true
  className: "nginx"
  
  # Main Application Ingress
  main:
    enabled: true
    host: "terrafusion.gov"
    tls:
      enabled: true
      secretName: "terrafusion-tls"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  
  # API Ingress
  api:
    enabled: true
    host: "api.terrafusion.gov"
    path: "/api"
    tls:
      enabled: true
      secretName: "api-terrafusion-tls"
  
  # AI Swarm Supreme Commander Ingress
  supremeCommander:
    enabled: true
    host: "supreme-commander.terrafusion.gov"
    path: "/supreme-commander"
    tls:
      enabled: true
      secretName: "supreme-commander-terrafusion-tls"

# Storage Configuration
storage:
  # Storage Classes
  storageClasses:
    fastSSD:
      name: "fast-ssd"
      provisioner: "kubernetes.io/aws-ebs"
      parameters:
        type: "gp3"
        fsType: "ext4"
        encrypted: "true"
    
  # Persistent Volume Claims
  persistentVolumeClaims:
    aiModelCache:
      size: "1Ti"
      storageClass: "fast-ssd"
      accessModes: ["ReadWriteOnce"]

# Government Compliance
compliance:
  enabled: true
  
  # FISMA Compliance
  fisma:
    enabled: true
    securityControls: "comprehensive"
    auditTrail: "complete"
    
  # Section 508 Accessibility
  section508:
    enabled: true
    accessibilityCompliance: "AAA"
    
  # Audit Logging
  auditLogging:
    enabled: true
    level: "comprehensive"
    retention: "7years"
    
  # Encryption
  encryption:
    level: "government-grade"
    atRest: true
    inTransit: true

# Performance Configuration
performance:
  # Resource Quotas
  resourceQuota:
    enabled: true
    hard:
      requests.cpu: "1000"
      requests.memory: "2000Gi"
      limits.cpu: "2000"
      limits.memory: "4000Gi"
      persistentvolumeclaims: "100"
  
  # Limit Ranges
  limitRange:
    enabled: true
    default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "16"
      memory: "32Gi"
    min:
      cpu: "10m"
      memory: "32Mi"

# Backup Configuration
backup:
  enabled: true
  
  # Database Backup
  database:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention: "90d"
    storage: "s3"
    
  # AI Model Backup
  aiModels:
    enabled: true
    schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
    retention: "30d"
    
  # Configuration Backup
  configuration:
    enabled: true
    schedule: "0 4 * * *"  # Daily at 4 AM
    retention: "30d"

# Disaster Recovery
disasterRecovery:
  enabled: true
  
  # Multi-Region Replication
  multiRegion:
    enabled: true
    regions: ["us-gov-west-1", "us-gov-east-1"]
    
  # Automated Failover
  automatedFailover:
    enabled: true
    healthCheckInterval: "30s"
    failoverTimeout: "5m"
    
  # Data Replication
  dataReplication:
    enabled: true
    mode: "asynchronous"
    lagThreshold: "10s"

# Deployment Strategy
deploymentStrategy:
  type: "RollingUpdate"
  rollingUpdate:
    maxUnavailable: "25%"
    maxSurge: "25%"

# Environment Variables
env:
  # Global Environment Variables
  TERRAFUSION_VERSION: "1.0.0"
  DEPLOYMENT_ENVIRONMENT: "production"
  SUPREME_COMMANDER_MODE: "active"
  QUANTUM_OPTIMIZATION: "enabled"
  CONSCIOUSNESS_LAYER: "enabled"
  MULTI_COUNTY_COORDINATION: "enabled"
  FISMA_COMPLIANCE: "enabled"
  AUDIT_LOGGING: "comprehensive"
  ENCRYPTION_LEVEL: "government-grade"