[package]
name = "shock-and-awe"
version = "1.0.0"
description = "TerraFusion Shock & Awe - Revolutionary AI Government Demonstrations"
authors = ["TerraFusion Development Team"]
repository = "https://github.com/terrafusion/shock-and-awe"
default-run = "shock-and-awe"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "api-all",
  "devtools",
  "macos-private-api",
  "system-tray",
  "updater",
  "window-all"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
log = "0.4"
env_logger = "0.10"
uuid = { version = "1.0", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "shock-and-awe"
path = "src/main.rs"