<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFusion Operations Dashboard</title>
    <meta name="description" content="Real-time monitoring and management dashboard for TerraFusion OS ecosystem">
    <style>
      /* Critical loading styles */
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        color: white;
      }
      
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }
      
      .loading h1 {
        margin-bottom: 20px;
        color: #00ff88;
        text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 255, 136, 0.1);
        border-left: 4px solid #00ff88;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <h1>TerraFusion Operations Dashboard</h1>
        <div class="spinner"></div>
        <p>Loading ecosystem monitoring...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
