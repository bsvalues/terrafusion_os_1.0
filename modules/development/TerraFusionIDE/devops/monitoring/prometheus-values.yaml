prometheus:
  prometheusSpec:
    retention: 30d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: 'terrafusion-api'
        static_configs:
          - targets: ['terrafusion-api:5000']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
      - job_name: 'terrafusion-frontend'
        static_configs:
          - targets: ['terrafusion-frontend:3000']
        metrics_path: /api/metrics
        scrape_interval: 30s
        scrape_timeout: 10s
      - job_name: 'ai-swarm'
        static_configs:
          - targets: ['terrafusion-ai-swarm:5003']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s
      - job_name: 'quantum-performance'
        static_configs:
          - targets: ['terrafusion-quantum:5004']
        metrics_path: /metrics
        scrape_interval: 30s
        scrape_timeout: 10s

alertmanager:
  alertmanagerSpec:
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

grafana:
  adminPassword: admin
  persistence:
    enabled: true
    storageClassName: gp2
    size: 10Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'terrafusion'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/terrafusion
  dashboards:
    terrafusion:
      terrafusion-overview:
        gnetId: 1860
        revision: 22
        datasource: Prometheus
      terrafusion-api:
        gnetId: 1861
        revision: 15
        datasource: Prometheus
      terrafusion-ai-swarm:
        gnetId: 1862
        revision: 12
        datasource: Prometheus






