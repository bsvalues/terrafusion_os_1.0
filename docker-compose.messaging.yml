version: '3.8'

services:
  # RabbitMQ Enterprise Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: terrafusion-rabbitmq
    hostname: rabbitmq-cluster-1
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI
      - "25672:25672"   # Clustering port
    environment:
      - RABBITMQ_DEFAULT_USER=terrafusion
      - RABBITMQ_DEFAULT_PASS=government_secure_2024
      - RABBITMQ_ERLANG_COOKIE=terrafusion_cluster_cookie
      - RABBITMQ_DEFAULT_VHOST=/terrafusion
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log_levels [{connection,error}]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/config/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - terrafusion_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.terrafusion.local`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  # Apache Kafka Enterprise Streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: terrafusion-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - terrafusion_network
    healthcheck:
      test: ["CMD", "nc", "-vz", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: terrafusion-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:\${{TF_PORT_9092:-9092}},PLAINTEXT_HOST://localhost:\${{TF_PORT_9092:-9092}}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 1000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 1048576
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - terrafusion_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:\${{TF_PORT_9092:-9092}}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Kafka UI for Management
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: terrafusion-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8089:${TF_STATIC_PORT:-8080}"
    environment:
      - KAFKA_CLUSTERS_0_NAME=terrafusion-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    networks:
      - terrafusion_network
    restart: unless-stopped

  # Redis for High-Speed Caching
  redis:
    image: redis:7.2-alpine
    container_name: terrafusion-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
      - ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - terrafusion_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Message Bus Coordinator Service
  message-coordinator:
    build:
      context: .
      dockerfile: Dockerfile.message-coordinator
    container_name: terrafusion-message-coordinator
    depends_on:
      - rabbitmq
      - kafka
      - redis
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - RABBITMQ_URL=amqp://terrafusion:government_secure_2024@rabbitmq:5672/terrafusion
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - COORDINATOR_PORT=\${{TF_SERVICE_8090_PORT:-8090}}
      - LOG_LEVEL=info
      - GOVERNMENT_COMPLIANCE=FISMA
    volumes:
      - ./message-coordinator:/app
      - coordinator_logs:/app/logs
    networks:
      - terrafusion_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_PORT_9092:-9092}}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

networks:
  terrafusion_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  rabbitmq_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local
  coordinator_logs:
    driver: local