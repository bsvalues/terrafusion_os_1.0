apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actions.ai.terrafusion.gov
spec:
  group: ai.terrafusion.gov
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                scope:
                  type: string
                rateLimit:
                  type: object
                inputSchemaRef:
                  type: string
                outputSchemaRef:
                  type: string
                impl:
                  type: object
                policies:
                  type: array
                  items:
                    type: object
                signing:
                  type: object
  scope: Namespaced
  names:
    plural: actions
    singular: action
    kind: Action
