apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ontologies.ai.terrafusion.gov
spec:
  group: ai.terrafusion.gov
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                objectType:
                  type: string
                version:
                  type: string
                attributes:
                  type: object
                classifications:
                  type: array
                  items:
                    type: string
                actions:
                  type: array
                  items:
                    type: object
  scope: Namespaced
  names:
    plural: ontologies
    singular: ontology
    kind: Ontology
