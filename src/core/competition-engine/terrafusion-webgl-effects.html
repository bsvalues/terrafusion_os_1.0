<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion WebGL Shader Effects System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0b1020;
            color: white;
            font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
        }
        
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .content {
            position: relative;
            z-index: 1;
            padding: 2rem;
            background: rgba(11, 16, 32, 0.8);
            backdrop-filter: blur(20px);
        }
        
        h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #0099ff, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .shader-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        
        .shader-btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #0099ff, #00ffee);
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        .shader-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 238, 0.4);
        }
        
        .shader-btn.active {
            background: linear-gradient(135deg, #00ffaa, #00ff88);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.5);
        }
        
        .performance-stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1rem;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .stat {
            margin: 0.5rem 0;
            color: #00ffee;
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    
    <div class="content">
        <h1>TerraFusion WebGL Effects</h1>
        <p style="text-align: center; color: #00ffee; font-style: italic; margin-bottom: 2rem;">
            Government. Transcended. Visually.
        </p>
        
        <div class="shader-controls">
            <button class="shader-btn active" data-shader="quantum">Quantum Field</button>
            <button class="shader-btn" data-shader="neural">Neural Network</button>
            <button class="shader-btn" data-shader="transcend">Transcendence</button>
            <button class="shader-btn" data-shader="matrix">Data Matrix</button>
            <button class="shader-btn" data-shader="energy">Energy Grid</button>
            <button class="shader-btn" data-shader="particle">Particle Storm</button>
        </div>
    </div>
    
    <div class="performance-stats">
        <div class="stat">FPS: <span id="fps">60</span></div>
        <div class="stat">Draw Calls: <span id="drawCalls">0</span></div>
        <div class="stat">Shader: <span id="currentShader">quantum</span></div>
        <div class="stat">GPU: <span id="gpuTime">0ms</span></div>
    </div>

    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec3 position;
        uniform float time;
        uniform vec2 resolution;
        varying vec2 vUv;
        varying float vTime;
        
        void main() {
            vUv = position.xy * 0.5 + 0.5;
            vTime = time;
            gl_Position = vec4(position, 1.0);
        }
    </script>

    <script id="quantum-fragment" type="x-shader/x-fragment">
        precision highp float;
        
        uniform float time;
        uniform vec2 resolution;
        uniform vec2 mouse;
        varying vec2 vUv;
        
        #define PI 3.14159265359
        
        // Quantum field visualization
        vec3 quantumField(vec2 uv, float t) {
            vec3 col = vec3(0.0);
            
            // Create quantum waves
            for(float i = 0.0; i < 5.0; i++) {
                vec2 pos = vec2(
                    sin(t * 0.7 + i * 1.3) * 0.3,
                    cos(t * 0.5 + i * 1.7) * 0.3
                );
                
                float d = length(uv - pos - 0.5);
                float wave = sin(d * 50.0 - t * 3.0) * 0.5 + 0.5;
                wave *= exp(-d * 3.0);
                
                vec3 waveColor = mix(
                    vec3(0.0, 0.6, 1.0),  // Trust Blue
                    vec3(0.0, 1.0, 0.93), // Transcend Cyan
                    wave
                );
                
                col += waveColor * wave * 0.3;
            }
            
            // Add quantum noise
            float noise = fract(sin(dot(uv * 100.0, vec2(12.9898, 78.233))) * 43758.5453);
            col += vec3(0.0, 1.0, 0.67) * noise * 0.05; // Success Green accent
            
            return col;
        }
        
        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec3 color = quantumField(uv, time);
            
            // Add vignette
            float vignette = 1.0 - length(uv - 0.5) * 0.7;
            color *= vignette;
            
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script id="neural-fragment" type="x-shader/x-fragment">
        precision highp float;
        
        uniform float time;
        uniform vec2 resolution;
        varying vec2 vUv;
        
        // Neural network visualization
        float neuron(vec2 p, vec2 center, float t) {
            float d = length(p - center);
            float pulse = sin(t * 3.0 + d * 10.0) * 0.5 + 0.5;
            return exp(-d * 20.0) * pulse;
        }
        
        vec3 neuralNetwork(vec2 uv, float t) {
            vec3 col = vec3(0.0);
            
            // Create neurons
            const int NEURONS = 12;
            for(int i = 0; i < NEURONS; i++) {
                float fi = float(i);
                vec2 pos = vec2(
                    sin(fi * 0.5 + t * 0.3) * 0.4 + 0.5,
                    cos(fi * 0.7 + t * 0.2) * 0.4 + 0.5
                );
                
                // Neuron body
                float n = neuron(uv, pos, t + fi);
                col += vec3(0.0, 1.0, 0.93) * n; // Cyan neurons
                
                // Connections
                for(int j = i + 1; j < NEURONS; j++) {
                    float fj = float(j);
                    vec2 pos2 = vec2(
                        sin(fj * 0.5 + t * 0.3) * 0.4 + 0.5,
                        cos(fj * 0.7 + t * 0.2) * 0.4 + 0.5
                    );
                    
                    vec2 line = pos2 - pos;
                    vec2 proj = clamp(dot(uv - pos, line) / dot(line, line), 0.0, 1.0) * line;
                    float dist = length(uv - pos - proj);
                    
                    float connection = exp(-dist * 100.0) * 0.3;
                    connection *= sin(t * 5.0 + fi + fj) * 0.5 + 0.5;
                    
                    col += vec3(0.0, 0.6, 1.0) * connection; // Blue connections
                }
            }
            
            return col;
        }
        
        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec3 color = neuralNetwork(uv, time);
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script id="transcend-fragment" type="x-shader/x-fragment">
        precision highp float;
        
        uniform float time;
        uniform vec2 resolution;
        uniform vec2 mouse;
        varying vec2 vUv;
        
        // Transcendence portal effect
        vec3 transcendence(vec2 uv, float t) {
            vec2 center = vec2(0.5);
            vec2 p = uv - center;
            float d = length(p);
            float angle = atan(p.y, p.x);
            
            // Spiral portal
            float spiral = sin(angle * 5.0 + d * 20.0 - t * 3.0) * 0.5 + 0.5;
            spiral *= exp(-d * 2.0);
            
            // Energy rings
            float rings = 0.0;
            for(float i = 1.0; i < 5.0; i++) {
                float ringD = abs(d - i * 0.1 - mod(t * 0.2, 0.5));
                rings += exp(-ringD * 50.0) * 0.5;
            }
            
            // Color gradient
            vec3 innerColor = vec3(0.0, 1.0, 0.67); // Success Green
            vec3 midColor = vec3(0.0, 1.0, 0.93);   // Transcend Cyan
            vec3 outerColor = vec3(0.0, 0.6, 1.0);  // Trust Blue
            
            vec3 color = mix(innerColor, midColor, d * 2.0);
            color = mix(color, outerColor, d);
            
            color *= spiral + rings;
            
            // Center glow
            color += exp(-d * 10.0) * vec3(1.0, 1.0, 1.0) * 0.5;
            
            return color;
        }
        
        void main() {
            vec2 uv = gl_FragCoord.xy / resolution.xy;
            vec3 color = transcendence(uv, time);
            gl_FragColor = vec4(color, 1.0);
        }
    </script>

    <script>
        class WebGLEffectsSystem {
            constructor() {
                this.canvas = document.createElement('canvas');
                this.gl = null;
                this.programs = {};
                this.currentShader = 'quantum';
                this.startTime = Date.now();
                this.frameCount = 0;
                this.lastTime = 0;
                this.stats = {
                    fps: 60,
                    drawCalls: 0,
                    gpuTime: 0
                };
                
                this.init();
            }
            
            init() {
                // Setup canvas
                const container = document.getElementById('webgl-container');
                container.appendChild(this.canvas);
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                // Get WebGL context
                this.gl = this.canvas.getContext('webgl2', {
                    antialias: true,
                    alpha: false,
                    powerPreference: 'high-performance'
                });
                
                if (!this.gl) {
                    console.error('WebGL2 not supported');
                    return;
                }
                
                // Setup shaders
                this.setupShaders();
                
                // Setup geometry
                this.setupGeometry();
                
                // Setup events
                this.setupEvents();
                
                // Start render loop
                this.animate();
            }
            
            setupShaders() {
                const vertexSource = document.getElementById('vertex-shader').textContent;
                const shaderNames = ['quantum', 'neural', 'transcend'];
                
                shaderNames.forEach(name => {
                    const fragmentSource = document.getElementById(`${name}-fragment`).textContent;
                    this.programs[name] = this.createProgram(vertexSource, fragmentSource);
                });
            }
            
            createShader(source, type) {
                const shader = this.gl.createShader(type);
                this.gl.shaderSource(shader, source);
                this.gl.compileShader(shader);
                
                if (!this.gl.getShaderParameter(shader, this.gl.COMPILE_STATUS)) {
                    console.error('Shader compilation error:', this.gl.getShaderInfoLog(shader));
                    return null;
                }
                
                return shader;
            }
            
            createProgram(vertexSource, fragmentSource) {
                const vertexShader = this.createShader(vertexSource, this.gl.VERTEX_SHADER);
                const fragmentShader = this.createShader(fragmentSource, this.gl.FRAGMENT_SHADER);
                
                const program = this.gl.createProgram();
                this.gl.attachShader(program, vertexShader);
                this.gl.attachShader(program, fragmentShader);
                this.gl.linkProgram(program);
                
                if (!this.gl.getProgramParameter(program, this.gl.LINK_STATUS)) {
                    console.error('Program linking error:', this.gl.getProgramInfoLog(program));
                    return null;
                }
                
                return program;
            }
            
            setupGeometry() {
                // Create fullscreen quad
                const vertices = new Float32Array([
                    -1, -1, 0,
                     1, -1, 0,
                    -1,  1, 0,
                     1,  1, 0
                ]);
                
                this.vertexBuffer = this.gl.createBuffer();
                this.gl.bindBuffer(this.gl.ARRAY_BUFFER, this.vertexBuffer);
                this.gl.bufferData(this.gl.ARRAY_BUFFER, vertices, this.gl.STATIC_DRAW);
            }
            
            setupEvents() {
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
                });
                
                // Handle shader switching
                document.querySelectorAll('.shader-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.shader-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        
                        const shader = e.target.dataset.shader;
                        if (this.programs[shader]) {
                            this.currentShader = shader;
                            document.getElementById('currentShader').textContent = shader;
                        }
                    });
                });
                
                // Track mouse
                this.mouse = { x: 0, y: 0 };
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX / window.innerWidth;
                    this.mouse.y = 1.0 - (e.clientY / window.innerHeight);
                });
            }
            
            render() {
                const gl = this.gl;
                const program = this.programs[this.currentShader];
                
                if (!program) return;
                
                // Clear
                gl.clearColor(0.043, 0.063, 0.125, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT);
                
                // Use program
                gl.useProgram(program);
                
                // Set uniforms
                const time = (Date.now() - this.startTime) / 1000;
                const timeLocation = gl.getUniformLocation(program, 'time');
                gl.uniform1f(timeLocation, time);
                
                const resolutionLocation = gl.getUniformLocation(program, 'resolution');
                gl.uniform2f(resolutionLocation, this.canvas.width, this.canvas.height);
                
                const mouseLocation = gl.getUniformLocation(program, 'mouse');
                if (mouseLocation) {
                    gl.uniform2f(mouseLocation, this.mouse.x, this.mouse.y);
                }
                
                // Set attributes
                const positionLocation = gl.getAttribLocation(program, 'position');
                gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);
                gl.enableVertexAttribArray(positionLocation);
                gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);
                
                // Draw
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                this.stats.drawCalls = 1;
            }
            
            updateStats() {
                this.frameCount++;
                const currentTime = Date.now();
                const deltaTime = currentTime - this.lastTime;
                
                if (deltaTime >= 1000) {
                    this.stats.fps = Math.round(this.frameCount * 1000 / deltaTime);
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                    
                    // Update UI
                    document.getElementById('fps').textContent = this.stats.fps;
                    document.getElementById('drawCalls').textContent = this.stats.drawCalls;
                    
                    // Estimate GPU time
                    this.stats.gpuTime = Math.max(0, 16.67 - (1000 / this.stats.fps)).toFixed(2);
                    document.getElementById('gpuTime').textContent = this.stats.gpuTime + 'ms';
                }
            }
            
            animate() {
                this.render();
                this.updateStats();
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize WebGL effects
        window.addEventListener('DOMContentLoaded', () => {
            new WebGLEffectsSystem();
        });
    </script>
</body>
</html>
