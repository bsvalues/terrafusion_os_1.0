services:
  terra-permit-db:
    image: postgres:16-alpine
    container_name: terra-permit-db
    environment:
      POSTGRES_DB: terra_permit
      POSTGRES_USER: terra_permit
      POSTGRES_PASSWORD: terra_permit_dev_pw
    ports:
      - "54326:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra_permit -d terra_permit"]
      interval: 5s
      timeout: 3s
      retries: 10
