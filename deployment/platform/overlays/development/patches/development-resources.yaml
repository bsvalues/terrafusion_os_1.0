apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
spec:
  template:
    spec:
      containers:
        - name: platform-core
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          env:
            - name: NODE_ENV
              value: "development"
            - name: LOG_LEVEL
              value: "debug"
            - name: ENABLE_DEBUG
              value: "true"
            - name: VENDOR_INTEGRATION_DEBUG
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-integration
spec:
  template:
    spec:
      containers:
        - name: vendor-integration
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "150m"
          env:
            - name: NODE_ENV
              value: "development"
            - name: DEBUG_MODE
              value: "true"
            - name: VENDOR_DEBUG
              value: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "150m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-shell
spec:
  template:
    spec:
      containers:
        - name: ui-shell
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"