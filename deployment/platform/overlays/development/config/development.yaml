# TerraFusion cOS Development Environment Configuration

# Platform Core Configuration
platform:
  name: "TerraFusion cOS"
  version: "1.0.0-dev"
  environment: "development"
  mode: "substrate"

  # Core Services
  services:
    core:
      enabled: true
      debug: true
      logLevel: "debug"
      port: 3000

    auth:
      enabled: true
      debug: true
      tokenExpiry: "24h"
      refreshTokenExpiry: "7d"

    data:
      enabled: true
      debug: true
      cacheTTL: 300

    events:
      enabled: true
      debug: true
      retentionDays: 7

    ui:
      enabled: true
      debug: true
      hotReload: true

  # Vendor Integration
  vendorIntegration:
    enabled: true
    debug: true
    autoDiscovery: true
    sidecar:
      enabled: true
      port: 3001
      healthCheck: "/health/vendor-integration"

    certification:
      required: false
      skipValidation: true

    marketplace:
      enabled: true
      testMode: true

  # Security Configuration (Development)
  security:
    enforceHttps: false
    corsEnabled: true
    corsOrigins: ["*"]
    rateLimiting: false
    audit:
      enabled: true
      level: "basic"
      retention: "7d"

  # Database Configuration
  database:
    host: "postgres-dev"
    port: 5432
    database: "terrafusion_dev"
    ssl: false
    pool:
      min: 2
      max: 10
    migrations:
      autoRun: true

  # Cache Configuration
  cache:
    enabled: true
    provider: "redis"
    host: "redis-dev"
    port: 6379
    database: 0
    ttl: 300

  # Logging Configuration
  logging:
    level: "debug"
    format: "pretty"
    destinations:
      - "console"
      - "file"
    file:
      path: "/app/logs/platform-dev.log"
      maxSize: "100MB"
      maxFiles: 10

  # Monitoring Configuration
  monitoring:
    enabled: true
    metrics:
      port: 9090
      path: "/metrics"
      interval: "15s"

    health:
      port: 8080
      path: "/health"
      checks:
        - "database"
        - "cache"
        - "external-services"

    tracing:
      enabled: true
      jaeger:
        endpoint: "http://jaeger-dev:14268/api/traces"

  # Feature Flags (Development)
  features:
    experimentalVendorSDK: true
    advancedAnalytics: true
    aiAgentFabric: true
    quantumPerformance: false
    goldenRatioEngine: true
    realTimeSync: true
    hotModuleReload: true

# Vendor SDK Configuration
vendorSDK:
  development:
    enabled: true
    hotReload: true
    mockMode: true
    templates:
      generateExamples: true

    testing:
      unitTests: true
      integrationTests: true
      e2eTests: false

    documentation:
      autoGenerate: true
      includeExamples: true

# Government Configuration (Development)
government:
  compliance:
    fismaMode: "development"
    auditLevel: "basic"
    encryption:
      required: false
      algorithm: "AES-256-GCM"

    classification:
      level: "unclassified"
      enforceLabels: false

  # County Configuration
  counties:
    development:
      name: "Development County"
      code: "DEV"
      timezone: "America/Los_Angeles"

      services:
        assessor: true
        recorder: true
        clerk: true
        sheriff: false
        elections: false

# AI Agent Configuration (Development)
aiAgents:
  enabled: true
  development: true

  swarm:
    size: 10  # Reduced for development
    commander: "claude-dev"
    coordination: "basic"

  models:
    primary: "development-model"
    fallback: "mock-model"

  performance:
    optimization: false
    monitoring: true

# Performance Configuration
performance:
  optimization: "development"

  caching:
    aggressive: false
    strategy: "basic"

  compression:
    enabled: false

  cdn:
    enabled: false

# Developer Tools
developer:
  tools:
    enabled: true
    debugger: true
    profiler: true
    analyzer: true

  api:
    documentation: true
    playground: true
    mock: true

  hotReload:
    enabled: true
    patterns:
      - "src/**/*.ts"
      - "config/**/*.yaml"