apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-core
  namespace: terrafusion-platform
  labels:
    app.kubernetes.io/name: platform-core
    app.kubernetes.io/component: core
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-core
        app.kubernetes.io/component: core
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: platform-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: platform-core
          image: terrafusion/platform-core:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: METRICS_PORT
              value: "9090"
            - name: HEALTH_PORT
              value: "8080"
            - name: PLATFORM_MODE
              value: "substrate"
            - name: VENDOR_INTEGRATION_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: "info"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: jwt-refresh-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: redis-url
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: certs
              mountPath: /app/certs
              readOnly: true
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: config
          configMap:
            name: platform-config
        - name: certs
          secret:
            secretName: platform-certs
        - name: logs
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - platform-core
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.terrafusion.gov/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: platform-core
  namespace: terrafusion-platform
  labels:
    app.kubernetes.io/name: platform-core
    app.kubernetes.io/component: core
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: platform-core
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-core
  namespace: terrafusion-platform
  labels:
    app.kubernetes.io/name: platform-core
    app.kubernetes.io/component: core
automountServiceAccountToken: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-core
  namespace: terrafusion-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-core