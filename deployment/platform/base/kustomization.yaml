apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: terrafusion-cos-platform-base

resources:
  - namespace.yaml
  - platform-core.yaml
  - vendor-integration.yaml
  - security-mesh.yaml
  - data-plane.yaml
  - agent-fabric.yaml
  - observability.yaml
  - api-gateway.yaml
  - ui-shell.yaml
  - services.yaml
  - ingress.yaml
  - rbac.yaml
  - configmaps.yaml
  - secrets.yaml
  - persistent-volumes.yaml

commonLabels:
  app.kubernetes.io/name: terrafusion-cos
  app.kubernetes.io/part-of: terrafusion-platform
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  terrafusion.gov/platform: "cos"
  terrafusion.gov/version: "1.0.0"
  terrafusion.gov/architecture: "vendor-substrate"

images:
  - name: terrafusion/platform-core
    newTag: "1.0.0"
  - name: terrafusion/vendor-integration
    newTag: "1.0.0"
  - name: terrafusion/security-mesh
    newTag: "1.0.0"
  - name: terrafusion/data-plane
    newTag: "1.0.0"
  - name: terrafusion/agent-fabric
    newTag: "1.0.0"
  - name: terrafusion/observability
    newTag: "1.0.0"
  - name: terrafusion/api-gateway
    newTag: "1.0.0"
  - name: terrafusion/ui-shell
    newTag: "1.0.0"

configMapGenerator:
  - name: platform-config
    files:
      - config/platform.yaml
      - config/logging.yaml
      - config/metrics.yaml
  - name: vendor-integration-config
    files:
      - config/sidecar.yaml
      - config/gateway.yaml
      - config/certification.yaml

secretGenerator:
  - name: platform-secrets
    type: Opaque
    literals:
      - jwt-secret=PLACEHOLDER_JWT_SECRET
      - jwt-refresh-secret=PLACEHOLDER_JWT_REFRESH_SECRET
      - database-password=PLACEHOLDER_DB_PASSWORD
      - redis-password=PLACEHOLDER_REDIS_PASSWORD
  - name: vendor-integration-secrets
    type: Opaque
    literals:
      - api-key=PLACEHOLDER_API_KEY
      - webhook-secret=PLACEHOLDER_WEBHOOK_SECRET

replicas:
  - name: platform-core
    count: 3
  - name: vendor-integration
    count: 2
  - name: security-mesh
    count: 3
  - name: data-plane
    count: 3
  - name: agent-fabric
    count: 5
  - name: observability
    count: 2
  - name: api-gateway
    count: 3
  - name: ui-shell
    count: 2