version: '3.8'

services:
  # TerraFusion Government OS - Complete Web Demo
  # Live demo with real Benton County data for terrafusionmarket.io
  
  # Demo API Server with Real Benton County Data
  demo-api-server:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: terrafusion-demo-api-server
    ports:
      - "8080:${TF_STATIC_PORT:-8080}"
    environment:
      - NODE_ENV=production
      - PORT=\${{TF_ADMIN_PORT:-8080}}
    volumes:
      - ./data:/app/data:ro
    networks:
      - terrafusion-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend API with Benton County Data
  terrafusion-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.demo
    container_name: terrafusion-demo-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Demo
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/benton-county-demo.db
      - TerraFusion__DemoMode=true
      - TerraFusion__CountyName=Benton County
      - TerraFusion__PropertyCount=89247
      - TerraFusion__AIAgents=1008
      - TerraFusion__PerformanceMultiplier=949
      - TerraFusion__QuantumOptimization=true
    volumes:
      - ./data:/app/data:ro
      - ../../backend/ai-models:/app/ai-models:ro
    depends_on:
      - demo-api-server
    networks:
      - terrafusion-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Demo Frontend with Government OS Interface  
  demo-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: terrafusion-demo-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://demo-api-server:${TF_STATIC_PORT:-8080}
    depends_on:
      - demo-api-server
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Original Frontend Government OS Interface  
  terrafusion-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.demo
    container_name: terrafusion-original-frontend
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://terrafusion-api:80
      - REACT_APP_DEMO_MODE=true
      - REACT_APP_COUNTY_NAME=Benton County
      - REACT_APP_BRAND_TITLE=TerraFusion Government OS
      - REACT_APP_BRAND_SUBTITLE=Government. Transcended.
      - REACT_APP_PERFORMANCE_CLAIM=949x faster than traditional systems
    depends_on:
      - terrafusion-api
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # AI Swarm Orchestration Service
  ai-swarm-service:
    build:
      context: ../../backend/ai-swarm
      dockerfile: Dockerfile
    container_name: terrafusion-demo-ai-swarm
    ports:
      - "8080:${TF_STATIC_PORT:-8080}"
    environment:
      - NODE_ENV=production
      - AI_SWARM_SIZE=1008
      - SUPREME_COMMANDER=claude
      - GOVERNMENT_MODE=true
      - COUNTY_NAME=Benton County
      - API_BASE_URL=http://terrafusion-api:80
    depends_on:
      - terrafusion-api
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Quantum Performance Engine
  quantum-engine:
    build:
      context: ../../backend/quantum-performance
      dockerfile: Dockerfile
    container_name: terrafusion-demo-quantum
    ports:
      - "9090:9090"
    environment:
      - PYTHON_ENV=production
      - AGENTS_COUNT=1008
      - TARGET_IMPROVEMENT=949
      - CACHE_LEVELS=3
      - DEMO_MODE=true
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Operations Dashboard
  operations-dashboard:
    build:
      context: ../../modules/operations_dashboard
      dockerfile: Dockerfile
    container_name: terrafusion-demo-dashboard
    ports:
      - "5050:${TF_API_PORT:-5046}"
    environment:
      - FLASK_ENV=production
      - DEMO_MODE=true
      - API_BASE_URL=http://terrafusion-api:80
      - AI_SWARM_URL=http://ai-swarm-service:${TF_STATIC_PORT:-8080}
      - QUANTUM_ENGINE_URL=http://quantum-engine:9090
    depends_on:
      - terrafusion-api
      - ai-swarm-service
      - quantum-engine
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Enhanced Hybrid AI System
  hybrid-ai-system:
    build:
      context: ../../backend/ai-models/BENTON_COUNTY_CHAMPIONSHIP_PLAYBOOK
      dockerfile: Dockerfile.hybrid
    container_name: terrafusion-demo-hybrid-ai
    ports:
      - "7000:7000"
    environment:
      - PYTHON_ENV=production
      - DEMO_MODE=true
      - LOCAL_MODELS_ENABLED=false  # Disable for demo (resource intensive)
      - CLOUD_MODELS_ENABLED=true
      - COUNTY_NAME=Benton County
      - PROPERTY_COUNT=89247
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Redis Cache for Demo
  redis-cache:
    image: redis:7-alpine
    container_name: terrafusion-demo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - terrafusion-demo
    restart: unless-stopped

  # Nginx Reverse Proxy & Load Balancer
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: terrafusion-demo-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - terrafusion-frontend
      - terrafusion-api
      - operations-dashboard
    networks:
      - terrafusion-demo
    restart: unless-stopped

networks:
  terrafusion-demo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
    driver: local
  
# Demo Configuration
x-demo-info:
  title: "TerraFusion Government OS - Live Demo"
  description: "Complete government operating system with real Benton County data"
  features:
    - "89,247 real Benton County properties"
    - "1,008 AI agents with Supreme Commander orchestration" 
    - "949x performance improvement with quantum optimization"
    - "32+ government applications in unified interface"
    - "Real-time operations dashboard and monitoring"
    - "Enhanced hybrid AI with local + cloud capabilities"
    - "Government-grade compliance and security"
  urls:
    main_demo: "http://localhost"
    api_health: "http://localhost/api/health"
    operations_dashboard: "http://localhost:\${{TF_ADMIN_PORT:-8080}}"
    ai_swarm_status: "http://localhost:\${{TF_ADMIN_PORT:-8080}}/status"
    quantum_metrics: "http://localhost:\${{TF_ADMIN_PORT:-8080}}/metrics"