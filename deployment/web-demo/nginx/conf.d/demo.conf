# TerraFusion Government OS - Demo Nginx Configuration
# Optimized for terrafusionmarket.io live demo

upstream demo_frontend {
    server demo-frontend:80;
}

upstream demo_api_server {
    server demo-api-server:${TF_STATIC_PORT:-8080};
}

upstream terrafusion_frontend {
    server terrafusion-frontend:80;
}

upstream terrafusion_api {
    server terrafusion-api:80;
}

upstream operations_dashboard {
    server operations-dashboard:${TF_API_PORT:-5046};
}

upstream ai_swarm {
    server ai-swarm-service:${TF_STATIC_PORT:-8080};
}

upstream quantum_engine {
    server quantum-engine:9090;
}

# Main Demo Site Configuration
server {
    listen 80;
    server_name terrafusionmarket.io www.terrafusionmarket.io demo.terrafusionmarket.io;
    
    # Security Headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
    
    # Government OS Demo - Main Interface
    location / {
        proxy_pass http://demo_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Demo API Routes (Primary)
    location /api/ {
        proxy_pass http://demo_api_server/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API-specific settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS for demo
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
    }
    
    # Backend API Routes (Legacy)
    location /legacy-api/ {
        proxy_pass http://terrafusion_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API-specific settings
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # CORS for demo
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
    }
    
    # Operations Dashboard
    location /dashboard/ {
        proxy_pass http://operations_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for real-time dashboard
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # AI Swarm Status & Control
    location /ai-swarm/ {
        proxy_pass http://ai_swarm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Quantum Performance Metrics
    location /quantum/ {
        proxy_pass http://quantum_engine/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Demo-specific endpoints
    location /demo-info {
        return 200 '{"title":"TerraFusion Government OS Demo","status":"operational","county":"Benton County","properties":89247,"ai_agents":1008,"performance_multiplier":"949x","features":["Property Assessment","GIS Mapping","Tax Management","AI Assistant","Real-time Dashboard","Quantum Optimization"]}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "TerraFusion Government OS Demo - Operational\n";
        add_header Content-Type text/plain;
    }
    
    # Demo statistics endpoint  
    location /demo-stats {
        proxy_pass http://terrafusion_api/api/demo/stats;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin *;
    }
}

# SSL Configuration (if certificates available)
server {
    listen 443 ssl http2;
    server_name terrafusionmarket.io www.terrafusionmarket.io demo.terrafusionmarket.io;
    
    # SSL certificates (update paths as needed)
    ssl_certificate /etc/nginx/ssl/terrafusionmarket.io.crt;
    ssl_private_key /etc/nginx/ssl/terrafusionmarket.io.key;
    
    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    
    # Same configuration as HTTP version above
    # (Include all location blocks from above)
    
    location / {
        proxy_pass http://terrafusion_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    location /api/ {
        proxy_pass http://terrafusion_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }
}