version: '3.8'

services:
  terrafusion-backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
    container_name: terrafusion-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/terrafusion.db
    volumes:
      - terrafusion_data:/app/data
      - terrafusion_logs:/app/logs
    networks:
      - terrafusion-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  terrafusion-frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
    container_name: terrafusion-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - NODE_ENV=production
    depends_on:
      terrafusion-backend:
        condition: service_healthy
    networks:
      - terrafusion-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: terrafusion-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - terrafusion-backend
      - terrafusion-frontend
    networks:
      - terrafusion-network
    restart: unless-stopped

volumes:
  terrafusion_data:
    driver: local
  terrafusion_logs:
    driver: local

networks:
  terrafusion-network:
    driver: bridge
