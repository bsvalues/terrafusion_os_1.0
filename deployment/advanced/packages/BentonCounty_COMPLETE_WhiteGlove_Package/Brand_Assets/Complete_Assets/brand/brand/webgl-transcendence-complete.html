<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion OS - WebGL Transcendence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 100%);
        }

        .transcendence-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, rgba(0,153,255,0.2), rgba(0,255,238,0.2));
            border: 1px solid rgba(0,255,238,0.5);
            border-radius: 50px;
            margin-bottom: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .hero-headline {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #0099ff, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            filter: drop-shadow(0 0 30px rgba(0,255,238,0.5));
        }

        .hero-subhead {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 300;
            color: rgba(255,255,255,0.9);
            text-align: center;
            max-width: 800px;
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        .cta-group {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cta-primary, .cta-secondary {
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-primary {
            background: linear-gradient(135deg, #0099ff, #00ffee);
            color: #000;
            box-shadow: 0 10px 30px rgba(0,255,238,0.4), 0 0 60px rgba(0,153,255,0.2);
        }

        .cta-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,255,238,0.6), 0 0 80px rgba(0,153,255,0.3);
        }

        .cta-secondary {
            background: transparent;
            color: #00ffee;
            border: 2px solid #00ffee;
        }

        .cta-secondary:hover {
            background: rgba(0,255,238,0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,255,238,0.3);
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            transform: scale(0);
            animation: ripple-effect 0.6s ease-out;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .metrics-bar {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 3rem;
            padding: 1.5rem 2rem;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,255,238,0.3);
            border-radius: 100px;
            z-index: 20;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffee, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .metric-label {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.6);
            margin-top: 0.25rem;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="webgl-container">
        <canvas id="transcendence-canvas"></canvas>
    </div>

    <div class="hero-content">
        <div class="transcendence-badge">
            <span>✨</span>
            <span>WEBGL ENHANCED</span>
        </div>
        
        <h1 class="hero-headline">Government. Transcended.</h1>
        <p class="hero-subhead">
            Experience the future of county operations with real-time WebGL visualization 
            showing data flowing through your unified ecosystem
        </p>
        
        <div class="cta-group">
            <a href="#" class="cta-primary" onclick="handleCTA(event, 'primary')">
                Begin Transcendence
            </a>
            <a href="#" class="cta-secondary" onclick="handleCTA(event, 'secondary')">
                Watch It Flow
            </a>
        </div>
    </div>

    <div class="metrics-bar">
        <div class="metric">
            <div class="metric-value" id="speed-metric">379M×</div>
            <div class="metric-label">Faster Processing</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="adoption-metric">98%</div>
            <div class="metric-label">User Adoption</div>
        </div>
        <div class="metric">
            <div class="metric-value" id="savings-metric">$2.3M</div>
            <div class="metric-label">Annual Savings</div>
        </div>
    </div>

    <script>
        // WebGL Transcendence Engine
        const canvas = document.getElementById('transcendence-canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        
        // Resize canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Vertex shader - creates the flowing grid
        const vertexShaderSource = `
            attribute vec2 a_position;
            uniform vec2 u_resolution;
            uniform float u_time;
            varying vec2 v_uv;
            
            void main() {
                v_uv = a_position;
                vec2 position = a_position;
                
                // Add wave distortion
                position.y += sin(position.x * 10.0 + u_time * 2.0) * 0.02;
                position.x += cos(position.y * 8.0 + u_time * 1.5) * 0.02;
                
                vec2 clipSpace = ((position / u_resolution) * 2.0 - 1.0) * vec2(1, -1);
                gl_Position = vec4(clipSpace, 0, 1);
            }
        `;

        // Fragment shader - creates the transcendence colors
        const fragmentShaderSource = `
            precision mediump float;
            uniform float u_time;
            uniform vec2 u_mouse;
            uniform vec2 u_resolution;
            varying vec2 v_uv;
            
            void main() {
                vec2 st = v_uv / u_resolution;
                vec2 mouse = u_mouse / u_resolution;
                
                // Create flowing energy lines
                float energy = 0.0;
                for(float i = 0.0; i < 5.0; i++) {
                    vec2 pos = vec2(
                        sin(u_time * 0.5 + i * 1.5) * 0.3 + 0.5,
                        cos(u_time * 0.7 + i * 2.1) * 0.3 + 0.5
                    );
                    float dist = distance(st, pos);
                    energy += 0.01 / (dist + 0.01);
                }
                
                // Mouse interaction
                float mouseDist = distance(st, mouse);
                float mouseGlow = 0.05 / (mouseDist + 0.05);
                
                // Transcendence gradient
                vec3 color1 = vec3(0.0, 0.6, 1.0);  // Trust blue
                vec3 color2 = vec3(0.0, 1.0, 0.933); // Transcendence cyan
                vec3 color3 = vec3(0.0, 1.0, 0.667); // Success green
                
                vec3 finalColor = mix(color1, color2, st.x + sin(u_time) * 0.1);
                finalColor = mix(finalColor, color3, st.y + cos(u_time * 0.8) * 0.1);
                
                // Combine everything
                finalColor += energy * 0.3;
                finalColor += mouseGlow * vec3(0.2, 0.8, 1.0);
                
                // Grid overlay
                float grid = step(0.98, sin(st.x * 50.0)) + step(0.98, sin(st.y * 50.0));
                finalColor += grid * 0.05;
                
                // Fade edges
                float fade = 1.0 - distance(st, vec2(0.5, 0.5)) * 1.5;
                fade = clamp(fade, 0.0, 1.0);
                
                gl_FragColor = vec4(finalColor * fade * 0.3, 1.0);
            }
        `;

        // Compile shader
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        // Create program
        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
        
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        // Get locations
        const positionLocation = gl.getAttribLocation(program, 'a_position');
        const resolutionLocation = gl.getUniformLocation(program, 'u_resolution');
        const timeLocation = gl.getUniformLocation(program, 'u_time');
        const mouseLocation = gl.getUniformLocation(program, 'u_mouse');

        // Create buffer
        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        const positions = [
            0, 0,
            canvas.width, 0,
            0, canvas.height,
            canvas.width, canvas.height,
        ];
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

        // Mouse tracking
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Animation loop
        let startTime = Date.now();
        function render() {
            const time = (Date.now() - startTime) * 0.001;
            
            gl.clearColor(0, 0, 0, 1);
            gl.clear(gl.COLOR_BUFFER_BIT);
            
            gl.useProgram(program);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
            
            gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
            gl.uniform1f(timeLocation, time);
            gl.uniform2f(mouseLocation, mouseX, mouseY);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            
            requestAnimationFrame(render);
        }
        render();

        // CTA Ripple Effect
        function handleCTA(event, type) {
            event.preventDefault();
            const button = event.currentTarget;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = event.clientX - rect.left - size / 2;
            const y = event.clientY - rect.top - size / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x + 'px';
            ripple.style.top = y + 'px';
            
            button.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
            
            console.log(`${type} CTA clicked - Transcendence initiated`);
        }

        // Animate metrics
        function animateMetrics() {
            const speedMetric = document.getElementById('speed-metric');
            const adoptionMetric = document.getElementById('adoption-metric');
            const savingsMetric = document.getElementById('savings-metric');
            
            let speed = 1;
            let adoption = 0;
            let savings = 0;
            
            const speedInterval = setInterval(() => {
                if (speed < 379000000) {
                    speed = Math.min(speed * 1.5, 379000000);
                    speedMetric.textContent = speed < 1000000 ? 
                        Math.floor(speed) + '×' : 
                        Math.floor(speed / 1000000) + 'M×';
                } else {
                    clearInterval(speedInterval);
                }
            }, 50);
            
            const adoptionInterval = setInterval(() => {
                if (adoption < 98) {
                    adoption = Math.min(adoption + 2, 98);
                    adoptionMetric.textContent = adoption + '%';
                } else {
                    clearInterval(adoptionInterval);
                }
            }, 30);
            
            const savingsInterval = setInterval(() => {
                if (savings < 2.3) {
                    savings = Math.min(savings + 0.05, 2.3);
                    savingsMetric.textContent = '$' + savings.toFixed(1) + 'M';
                } else {
                    clearInterval(savingsInterval);
                }
            }, 40);
        }
        
        // Start metric animation after 1 second
        setTimeout(animateMetrics, 1000);
    </script>
</body>
</html>
