[package]
name = "terrafusion_marketplace"
version = "1.0.0"
description = "TerraFusion Terra Fusion Dashboard - Native Desktop Application"
authors = ["TerraFusion Championship Team"]
license = "MIT"
repository = "https://github.com/terrafusion/tauri-master-workspace"
default-run = "terrafusion_marketplace"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["dialog-all", "fs-all", "notification-all", "shell-open", "system-tray", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sysinfo = "0.30"
chrono = { workspace = true }
dirs = { workspace = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
