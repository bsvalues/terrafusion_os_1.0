[package]
name = "terra-fusion-sync"
version = "3.0.0"
description = "TerraFusionSync - Real-time Data Synchronization Platform"
authors = ["TerraFusion Team"]
license = "MIT"
repository = "https://github.com/terrafusion/terra-fusion-sync"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["window-unmaximize", "window-hide", "window-minimize", "window-close", "window-unminimize", "window-start-dragging", "shell-open", "window-maximize", "window-show"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tokio-tungstenite = "0.20"
futures-util = "0.3"
dashmap = { workspace = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

