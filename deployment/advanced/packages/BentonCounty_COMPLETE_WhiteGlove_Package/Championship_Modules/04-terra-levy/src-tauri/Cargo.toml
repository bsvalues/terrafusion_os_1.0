[package]
name = "terra-levy"
version = "1.5.0"
description = "TerraLevy - Advanced Tax Calculation & Levy Management System"
authors = ["TerraFusion Team"]
license = "MIT"
repository = "https://github.com/terrafusion/terra-levy"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["window-minimize", "window-hide", "window-start-dragging", "shell-open", "window-close", "window-unminimize", "window-unmaximize", "window-maximize", "window-show"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { version = "1.32", features = ["serde-float"] }
anyhow = { workspace = true }
thiserror = { workspace = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

