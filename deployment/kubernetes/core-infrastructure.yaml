apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-core-infrastructure
  namespace: terrafusion-os
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terrafusion-core
      tier: infrastructure
  template:
    metadata:
      labels:
        app: terrafusion-core
        tier: infrastructure
        government-compliance: fisma-high
    spec:
      containers:
      - name: costforge-ai
        image: terrafusion/costforge-ai:latest
        ports:
        - containerPort: 5000
        env:
        - name: TERRAFUSION_SERVICE
          value: "costforge-ai"
        - name: AI_MODE
          value: "quantum_enhanced"
        - name: GOVERNMENT_COMPLIANCE
          value: "FISMA_HIGH"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-core-service
  namespace: terrafusion-os
spec:
  selector:
    app: terrafusion-core
    tier: infrastructure
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP
