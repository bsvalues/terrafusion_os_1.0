# Protocol Buffer Build Configuration for TerraFusion OS
# Generates gRPC stubs for Rust, .NET, and TypeScript

# Phase 0 - Core decisions implemented:
# - Protocol Buffers (proto3) as single source of truth
# - tonic for Rust services
# - Grpc.AspNetCore for .NET services  
# - @grpc/grpc-js + ts-proto for TypeScript
# - mTLS for service-to-service auth
# - JWT in metadata for user/context auth

version: "1.0"

# Proto source configuration
proto_sources:
  - path: "protos/terrafusion"
    package_prefix: "terrafusion"

# Build targets
targets:
  rust:
    output_dir: "rust-performance-engine/crates/grpc-clients/src/generated"
    dependencies:
      - tonic = { version = "0.12", features = ["tls"] }
      - prost = "0.13"
      - tokio-stream = "0.1"
    features:
      - client
      - server
      - tls
      
  dotnet:
    output_dir: "backend/TerraFusion.Grpc/Generated"
    namespace: "TerraFusion.Grpc"
    dependencies:
      - Grpc.AspNetCore = "2.57.0"
      - Grpc.Net.Client = "2.57.0"
      - Google.Protobuf = "3.25.0"
    features:
      - client
      - server
      
  typescript:
    output_dir: "sdk/typescript/src/generated"
    dependencies:
      - "@grpc/grpc-js": "^1.9.0"
      - "@grpc/proto-loader": "^0.7.0"
      - "ts-proto": "^1.156.0"
    features:
      - client
      - types

# gRPC services to implement
services:
  valuation:
    proto: "terrafusion/valuation/v1/valuation.proto"
    priority: "high"
    implementation: "rust" # CostForge AI engine
    
  ai_swarm:
    proto: "terrafusion/ai/v1/swarm.proto" 
    priority: "critical"
    implementation: "rust" # Agent coordination engine
    
  modules:
    proto: "terrafusion/modules/v1/modules.proto"
    priority: "high"
    implementation: "dotnet" # Module management API
    
  auth:
    proto: "terrafusion/auth/v1/auth.proto"
    priority: "critical"
    implementation: "dotnet" # Authentication service

# Build commands
build_commands:
  rust:
    - cargo install protoc-gen-tonic
    - protoc --tonic_out=rust-performance-engine/crates/grpc-clients/src/generated --proto_path=protos protos/terrafusion/**/*.proto
    
  dotnet:
    - dotnet add package Grpc.AspNetCore
    - dotnet add package Grpc.Tools
    # Auto-generated via .csproj Protobuf items
    
  typescript:
    - npm install ts-proto @grpc/grpc-js @grpc/proto-loader
    - npx protoc --plugin=protoc-gen-ts_proto=./node_modules/.bin/protoc-gen-ts_proto --ts_proto_out=sdk/typescript/src/generated --proto_path=protos protos/terrafusion/**/*.proto

# Performance targets (Phase 1)
performance:
  latency_targets:
    p50: "< 10ms"
    p95: "< 50ms" 
    p99: "< 100ms"
  throughput_targets:
    valuation_service: "1000 req/sec"
    ai_coordination: "10000 msg/sec"
    module_management: "500 req/sec"

# Security configuration
security:
  mTLS:
    enabled: true
    cert_path: "certs/services"
    ca_cert: "certs/ca.pem"
  jwt:
    enabled: true
    metadata_key: "authorization"
    prefix: "Bearer "
  
# Observability  
observability:
  tracing:
    enabled: true
    exporter: "otlp"
    endpoint: "http://localhost:4317"
  metrics:
    enabled: true
    prometheus_endpoint: "/metrics"
  logging:
    level: "info"
    format: "json"