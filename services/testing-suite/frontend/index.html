<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terrafusion-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TerraFusion Testing Suite - Automated Testing Dashboard for Quality Assurance" />
    <meta name="keywords" content="TerraFusion, Testing, Quality Assurance, Automation, Dashboard" />
    <meta name="author" content="TerraFusion OS" />
    
    <!-- TerraFusion Brand Colors -->
    <meta name="theme-color" content="#0099ff" />
    <meta name="msapplication-TileColor" content="#0099ff" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TerraFusion Testing Suite" />
    <meta property="og:description" content="Automated Testing Dashboard for Quality Assurance" />
    <meta property="og:url" content="http://localhost:4000" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="TerraFusion Testing Suite" />
    <meta property="twitter:description" content="Automated Testing Dashboard for Quality Assurance" />
    
    <!-- Preconnect to optimize loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Government Notice Banner Styles -->
    <style>
      /* Critical CSS for immediate rendering */
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #0a1a2a 0%, #1a2f4a 100%);
        color: #ffffff;
        min-height: 100vh;
        overflow-x: hidden;
      }
      
      .initial-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0a1a2a 0%, #1a2f4a 100%);
        color: #ffffff;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 153, 255, 0.3);
        border-top: 4px solid #0099ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 1.2rem;
        opacity: 0.8;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      
      .tf-logo {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(45deg, #0099ff, #00ffaa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
    </style>
    
    <title>TerraFusion Testing Suite - Port 4000</title>
  </head>
  <body>
    <!-- Government Notice Banner -->
    <div style="
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      color: #ffffff;
      padding: 0.5rem 1rem;
      text-align: center;
      font-size: 0.85rem;
      border-bottom: 2px solid #0099ff;
      backdrop-filter: blur(10px);
      z-index: 10000;
    ">
      🏛️ TerraFusion Government OS - Testing Suite Dashboard 
      <span style="color: #00ffaa; font-weight: 600;">
        | Quality Assurance & Automation Center
      </span>
      <span style="color: #0099ff; margin-left: 1rem;">
        Port 4000 - Secure Testing Environment
      </span>
    </div>

    <div id="root">
      <!-- Initial loading screen -->
      <div class="initial-loading">
        <div class="tf-logo">TerraFusion Testing Suite</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Initializing testing dashboard...</div>
        <div style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.6;">
          Loading automated testing and quality assurance tools
        </div>
      </div>
    </div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('TerraFusion Testing Suite SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('TerraFusion Testing Suite SW registration failed: ', registrationError);
            });
        });
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
