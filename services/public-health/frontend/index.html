<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TerraFusion Public Health Services - Comprehensive health monitoring and social services coordination for Benton County" />
    <meta name="keywords" content="public health, health services, social services, Benton County, TerraFusion, health monitoring, disease surveillance" />
    <meta name="author" content="TerraFusion OS" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- CSP Header (Content Security Policy) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-src 'none';" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/health-icon.svg" />
    <link rel="alternate icon" href="/health-favicon.ico" />
    <link rel="apple-touch-icon" href="/health-apple-touch-icon.png" />
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Primary fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0b1020" />
    <meta name="msapplication-TileColor" content="#0b1020" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://terrafusion-os.gov/public-health/" />
    <meta property="og:title" content="TerraFusion Public Health Services" />
    <meta property="og:description" content="Comprehensive health monitoring and social services coordination for Benton County" />
    <meta property="og:image" content="/health-og-image.png" />
    <meta property="og:site_name" content="TerraFusion OS" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://terrafusion-os.gov/public-health/" />
    <meta property="twitter:title" content="TerraFusion Public Health Services" />
    <meta property="twitter:description" content="Comprehensive health monitoring and social services coordination for Benton County" />
    <meta property="twitter:image" content="/health-twitter-image.png" />
    
    <!-- Government Compliance -->
    <meta name="government.agency" content="Benton County" />
    <meta name="government.department" content="Public Health Services" />
    <meta name="government.contact" content="health@bentoncountywa.gov" />
    <meta name="accessibility.compliance" content="WCAG 2.1 AA" />
    <meta name="security.classification" content="Public" />
    
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//localhost:${TF_API_PORT:-5046}" />
    <link rel="preload" href="/health-logo.svg" as="image" type="image/svg+xml" />
    
    <title>TerraFusion Public Health Services | Benton County Health Monitoring</title>
    
    <!-- Health-specific styling variables -->
    <style>
      :root {
        --tf-health-primary: #00ff88;
        --tf-health-secondary: #0099ff;
        --tf-health-accent: #00ccff;
        --tf-health-emergency: #ff6b6b;
        --tf-health-warning: #ffa726;
        --tf-health-success: #4caf50;
        --tf-health-background: #0b1020;
        --tf-health-surface: #1a1f3a;
      }
      
      /* Loading screen */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, var(--tf-health-background) 0%, var(--tf-health-surface) 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .loading-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 24px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      .loading-text {
        color: var(--tf-health-primary);
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 8px;
      }
      
      .loading-subtitle {
        color: rgba(255, 255, 255, 0.7);
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 400;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(0, 255, 136, 0.3);
        border-top: 3px solid var(--tf-health-primary);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 20px;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Hide loading screen when app loads */
      .loaded .loading-screen {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
      <div class="loading-logo">🏥</div>
      <div class="loading-text">TerraFusion Public Health Services</div>
      <div class="loading-subtitle">Initializing Health Monitoring System</div>
      <div class="loading-spinner"></div>
    </div>
    
    <!-- Main Application -->
    <div id="root"></div>
    
    <!-- Service Worker Registration -->
    <script>
      // Register service worker for PWA functionality
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Health Services SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('Health Services SW registration failed: ', registrationError);
            });
        });
      }
      
      // Hide loading screen when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
          setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
              loadingScreen.remove();
            }
          }, 500);
        }, 1000);
      });
      
      // Emergency accessibility features
      document.addEventListener('keydown', (e) => {
        // Emergency alert shortcut (Ctrl+Shift+E)
        if (e.ctrlKey && e.shiftKey && e.key === 'E') {
          e.preventDefault();
          console.log('Emergency alert activated');
          // This will be handled by the React app
          window.dispatchEvent(new CustomEvent('emergency-alert'));
        }
        
        // High contrast toggle (Ctrl+Shift+H)
        if (e.ctrlKey && e.shiftKey && e.key === 'H') {
          e.preventDefault();
          document.body.classList.toggle('high-contrast-mode');
        }
      });
      
      // Performance monitoring
      window.addEventListener('load', () => {
        if ('performance' in window) {
          const perfData = performance.getEntriesByType('navigation')[0];
          const loadTime = perfData.loadEventEnd - perfData.loadEventStart;
          console.log(`Public Health Services load time: ${loadTime}ms`);
          
          // Report to analytics if configured
          if (window.gtag) {
            window.gtag('event', 'page_load_time', {
              event_category: 'Performance',
              event_label: 'Public Health Services',
              value: Math.round(loadTime)
            });
          }
        }
      });
    </script>
    
    <!-- Module entry point -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Fallback for browsers that don't support modules -->
    <noscript>
      <div style="text-align: center; padding: 50px; color: #fff; background: #0b1020;">
        <h1>🏥 TerraFusion Public Health Services</h1>
        <p>This application requires JavaScript to function properly.</p>
        <p>Please enable JavaScript in your browser and refresh the page.</p>
        <p>For assistance, contact your system administrator.</p>
      </div>
    </noscript>
  </body>
</html>
