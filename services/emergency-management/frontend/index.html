<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/terrafusion-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TerraFusion Emergency Management & Disaster Response - Advanced incident command, emergency notifications, disaster response coordination, and crisis management for Benton County Washington" />
    <meta name="keywords" content="TerraFusion OS, Emergency Management, Disaster Response, Incident Command, Crisis Management, Emergency Alerts, Benton County, Emergency Services, Public Safety, Disaster Preparedness" />
    <meta name="author" content="TerraFusion OS - Government Operating System" />
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: http:; connect-src 'self' ws: wss: https:; font-src 'self' https://fonts.gstatic.com;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    
    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Leaflet CSS for mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
    
    <!-- Emergency Management specific meta tags -->
    <meta name="emergency-contact" content="Benton County Emergency Management: (509) 628-2600" />
    <meta name="coverage-area" content="Benton County, Washington - 1,703.4 square miles" />
    <meta name="emergency-director" content="David Blazer" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:5280/" />
    <meta property="og:title" content="TerraFusion Emergency Management" />
    <meta property="og:description" content="Advanced disaster response, incident command, and crisis management for government operations" />
    <meta property="og:image" content="/terrafusion-emergency-og.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="http://localhost:5280/" />
    <meta property="twitter:title" content="TerraFusion Emergency Management" />
    <meta property="twitter:description" content="Advanced disaster response, incident command, and crisis management for government operations" />
    <meta property="twitter:image" content="/terrafusion-emergency-og.png" />
    
    <!-- PWA Configuration -->
    <meta name="theme-color" content="#dc2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TerraFusion Emergency" />
    
    <!-- Manifest for PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <title>TerraFusion Emergency Management & Disaster Response</title>
    
    <!-- Critical CSS for emergency styling -->
    <style>
      /* Critical emergency notification styles */
      .emergency-critical {
        background: #dc2626 !important;
        color: white !important;
        font-weight: bold !important;
        animation: emergency-pulse 1s infinite !important;
      }
      
      .emergency-alert {
        background: #ea580c !important;
        color: white !important;
        font-weight: bold !important;
      }
      
      @keyframes emergency-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      
      /* Loading screen for emergency system */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0d1421 0%, #1a2538 50%, #243448 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
      }
      
      .loading-content {
        text-align: center;
      }
      
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(220, 38, 38, 0.3);
        border-top: 4px solid #dc2626;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1.5rem;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-text {
        font-size: 1.2rem;
        font-weight: 600;
        color: #dc2626;
        margin-bottom: 0.5rem;
      }
      
      .loading-subtext {
        font-size: 0.9rem;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <!-- Emergency Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-text">🚨 Emergency Management System</div>
        <div class="loading-subtext">Initializing Crisis Response Platform...</div>
      </div>
    </div>
    
    <!-- Main Application Root -->
    <div id="root"></div>
    
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
    
    <!-- Loading screen management -->
    <script>
      // Remove loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.5s ease';
            setTimeout(function() {
              loadingScreen.remove();
            }, 500);
          }
        }, 1500); // Slightly longer for emergency system
      });
      
      // Emergency notification API (mock)
      window.emergencyAPI = {
        sendAlert: function(message, severity) {
          console.log(`EMERGENCY ALERT [${severity}]: ${message}`);
        },
        activateSirens: function() {
          console.log('EMERGENCY: Activating warning sirens');
        },
        evacuationOrder: function(zones) {
          console.log(`EVACUATION ORDER: ${zones.join(', ')}`);
        }
      };
      
      // Error handling for emergency system
      window.addEventListener('error', function(e) {
        console.error('Emergency System Error:', e.error);
        // In production, this would alert emergency management
      });
      
      // Service Worker for offline emergency capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/emergency-sw.js')
            .then(function(registration) {
              console.log('Emergency SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('Emergency SW registration failed: ', registrationError);
            });
        });
      }
      
      // Emergency performance monitoring
      if (window.performance && window.performance.mark) {
        window.performance.mark('emergency-management-start');
      }
    </script>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
