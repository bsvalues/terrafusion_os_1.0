<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TerraFusion Research Engine - Autonomous AI-driven research coordination and management platform for government operations" />
  <meta name="keywords" content="TerraFusion, Research Engine, AI Agents, Government, Autonomous Research, Data Analysis" />
  <meta name="author" content="TerraFusion Technologies" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#0099ff" />
  
  <!-- Apple touch icon -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
  <!-- Open Graph meta tags for social sharing -->
  <meta property="og:title" content="TerraFusion Research Engine" />
  <meta property="og:description" content="Autonomous AI-driven research coordination and management platform" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://research.terrafusion.gov" />
  <meta property="og:image" content="/og-image.png" />
  
  <!-- Twitter Card meta tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TerraFusion Research Engine" />
  <meta name="twitter:description" content="Autonomous AI-driven research coordination and management platform" />
  <meta name="twitter:image" content="/twitter-image.png" />
  
  <!-- Preconnect to external domains for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Security headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss:; script-src 'self' 'unsafe-eval';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  
  <title>TerraFusion Research Engine - Autonomous AI Research Platform</title>
</head>
<body>
  <!-- Skip to main content link for accessibility -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-primary focus:text-white focus:rounded">
    Skip to main content
  </a>
  
  <!-- Main application container -->
  <div id="root" role="application" aria-label="TerraFusion Research Engine">
    <!-- Loading fallback for users with JavaScript disabled -->
    <noscript>
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
      ">
        <div style="
          max-width: 600px;
          background: rgba(0, 0, 0, 0.4);
          padding: 3rem;
          border-radius: 12px;
          border: 1px solid rgba(255, 255, 255, 0.1);
        ">
          <h1 style="
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #0099ff, #00ffaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
          ">
            TerraFusion Research Engine
          </h1>
          <p style="font-size: 1.1rem; margin-bottom: 2rem; color: rgba(255, 255, 255, 0.8);">
            JavaScript is required to access the TerraFusion Research Engine platform.
          </p>
          <p style="font-size: 0.9rem; color: rgba(255, 255, 255, 0.6);">
            Please enable JavaScript in your browser settings and refresh the page to continue.
          </p>
          <div style="margin-top: 2rem; padding: 1rem; background: rgba(255, 107, 107, 0.1); border: 1px solid rgba(255, 107, 107, 0.3); border-radius: 8px;">
            <strong style="color: #ff6b6b;">Government Notice:</strong>
            <span style="color: rgba(255, 255, 255, 0.8);">
              This platform requires modern browser capabilities for security and functionality.
            </span>
          </div>
        </div>
      </div>
    </noscript>
    
    <!-- Initial loading state -->
    <div id="initial-loading" style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    ">
      <div style="text-align: center;">
        <div style="
          width: 60px;
          height: 60px;
          margin: 0 auto 2rem;
          border: 4px solid rgba(0, 153, 255, 0.3);
          border-top: 4px solid #0099ff;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>
        <h2 style="
          font-size: 1.5rem;
          font-weight: 600;
          margin-bottom: 0.5rem;
          background: linear-gradient(45deg, #0099ff, #00ffaa);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        ">
          TerraFusion Research Engine
        </h2>
        <p style="color: rgba(255, 255, 255, 0.7); font-size: 1rem;">
          Initializing autonomous research platform...
        </p>
      </div>
      
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>
  
  <!-- Application script -->
  <script type="module" src="/src/main.tsx"></script>
  
  <!-- Hide initial loading once React takes over -->
  <script>
    // Hide initial loading state once React mounts
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const loadingElement = document.getElementById('initial-loading');
        if (loadingElement && document.querySelector('[data-reactroot], #root > div')) {
          loadingElement.style.display = 'none';
        }
      }, 100);
    });
  </script>
</body>
</html>
