# TerraFusion RabbitMQ Configuration
# Government-grade messaging for 50,000+ AI agents

# Clustering and High Availability
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-cluster-1

# Memory Management
vm_memory_high_watermark.relative = 0.6
vm_memory_high_watermark_paging_ratio = 0.8
disk_free_limit.relative = 2.0

# Network Configuration
listeners.tcp.default = 5672
management.tcp.port = 15672
cluster.listeners.tcp = 25672

# Security and Authentication
auth_backends.1 = rabbit_auth_backend_internal
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN

# SSL/TLS Configuration (for production)
# ssl_options.cacertfile = /etc/rabbitmq/ssl/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/ssl/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/ssl/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true

# Government Compliance
# Enable audit logging
log.console = true
log.console.level = info
log.file = /var/log/rabbitmq/rabbit.log
log.file.level = info
log.file.rotation.date = $D0
log.file.rotation.size = 100MB

# Performance Tuning for 50,000+ agents
# Channel limits
channel_max = 10000
connection_max = 50000

# Message handling
message_store_file_size_limit = 16777216
queue_index_embed_msgs_below = 4096

# Heartbeat
heartbeat = 60

# Management Plugin Configuration
management.rates_mode = basic
management.disable_stats = false
management.enable_queue_totals = true

# Federation (for multi-site deployments)
# federation.upstream_set_max_attempts = 3
# federation.upstream_set_retry_delay = 1000

# Dead Letter Exchange Configuration
default_user = terrafusion
default_pass = government_secure_2024
default_vhost = /terrafusion
default_user_tags.administrator = true
default_permissions.configure = .*
default_permissions.write = .*
default_permissions.read = .*

# Queue defaults for government workloads
queue_master_locator = min-masters
ha_mode = all
ha_sync_mode = automatic

# Resource limits
total_memory_available_override_value = 2GB

# Plugins to enable
enabled_plugins_file = /etc/rabbitmq/enabled_plugins