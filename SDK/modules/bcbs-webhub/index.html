  <!-- Accessibility Enhancements -->
  <script>
    // Remove loading state when React loads
    window.addEventListener('DOMContentLoaded', function() {
      const root = document.getElementById('root');
      const loadingState = document.getElementById('terra-loading-state');
      
      // Add preload class for smooth transition
      if (root) {
        root.classList.add('terra-preload');
      }
      
      // Check if React has loaded (simplified check)
      const checkReactLoaded = setInterval(function() {
        if (root && root.children.length > 1) {
          if (loadingState) {
            loadingState.style.display = 'none';
          }
          root.classList.add('terra-loaded');
          clearInterval(checkReactLoaded);
        }
      }, 100);
      
      // Timeout fallback to hide loading state
      setTimeout(function() {
        if (loadingState) {
          loadingState.style.display = 'none';
        }
        if (root) {
          root.classList.add('terra-loaded');
        }
        clearInterval(checkReactLoaded);
      }, 5000);
    });
    
    // Accessibility: Keyboard navigation helper
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        document.body.classList.add('keyboard-navigation');
      }
    });
    
    document.addEventListener('mousedown', function() {
      document.body.classList.remove('keyboard-navigation');
    });
    
    // Performance: Preload critical resources
    if ('requestIdleCallback' in window) {
      requestIdleCallback(function() {
        // Preload common TerraFusion assets
        const preloadImages = [
          '/terra-sphere-icon.svg',
          '/terra-sphere-32.png'
        ];
        
        preloadImages.forEach(function(src) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.href = src;
          document.head.appendChild(link);
        });
      });
    }
    
    // Error boundary for critical failures
    window.addEventListener('error', function(e) {
      console.error('BCBSWebHub Critical Error:', e.error);
      
      // Show user-friendly error if React fails to load
      const root = document.getElementById('root');
      const loadingState = document.getElementById('terra-loading-state');
      
      if (root && loadingState && !root.classList.contains('terra-loaded')) {
        loadingState.innerHTML = `
          <div style="text-align: center; color: #ef4444;">
            <div style="font-size: 2rem; margin-bottom: 1rem;">⚠️</div>
            <h2 style="color: #ef4444; margin-bottom: 0.5rem;">Application Error</h2>
            <p style="color: #94a3b8; margin-bottom: 1rem;">
              BCBSWebHub encountered an initialization error.
            </p>
            <button onclick="window.location.reload()" style="
              background: linear-gradient(135deg, #0099ff, #00ffff);
              color: white;
              border: none;
              padding: 0.75rem 1.5rem;
              border-radius: 0.5rem;
              font-weight: 600;
              cursor: pointer;
            ">
              Reload Application
            </button>
            <div style="margin-top: 1rem; color: #64748b; font-size: 0.75rem;">
              Government. Transcended. | TerraFusion Elite Government OS
            </div>
          </div>
        `;
      }
    });
  </script>
