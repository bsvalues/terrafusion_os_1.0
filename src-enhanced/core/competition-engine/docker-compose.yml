version: '3.8'

# 🌍 TERRAFUSION EMPIRE ORCHESTRATION
# Complete Production Stack

services:
  # Main TerraFusion Application
  terrafusion:
    build: .
    container_name: terrafusion-main
    ports:
      - "3000:3000"
      - "1420:1420"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=/app/data/terrafusionsync_94k.db
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - ai-service
    networks:
      - terrafusion-network
    restart: unless-stopped

  # AI Service Container
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: terrafusion-ai
    ports:
      - "8000:8000"
    volumes:
      - ./hybrid-llm-real:/app
      - ./models:/models
    environment:
      - OLLAMA_HOST=ollama:11434
      - CHROMADB_HOST=chromadb:8001
    depends_on:
      - ollama
      - chromadb
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Ollama for Local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: terrafusion-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - terrafusion-network
    restart: unless-stopped

  # ChromaDB for RAG
  chromadb:
    image: chromadb/chroma:latest
    container_name: terrafusion-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Redis for Caching
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: terrafusion-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - terrafusion
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=terrafusion100b
      - GF_INSTALL_PLUGINS=redis-datasource
    depends_on:
      - prometheus
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Backup Service
  backup:
    image: alpine:latest
    container_name: terrafusion-backup
    volumes:
      - ./data:/data
      - ./backups:/backups
    environment:
      - BACKUP_SCHEDULE="0 2 * * *"
    command: |
      sh -c 'while true; do
        echo "Backing up databases..."
        tar -czf /backups/backup-$$(date +%Y%m%d-%H%M%S).tar.gz /data/*.db
        find /backups -name "backup-*.tar.gz" -mtime +7 -delete
        sleep 86400
      done'
    networks:
      - terrafusion-network
    restart: unless-stopped

networks:
  terrafusion-network:
    driver: bridge

volumes:
  ollama-data:
  chroma-data:
  redis-data:
  prometheus-data:
  grafana-data: