[package]
name = "terrafusion-competition-engine"
version = "1.0.0"
description = "TerraFusion Competition Engine - Government Desktop Applications"
authors = ["TerraFusion Government Solutions"]
license = "Proprietary"
repository = "https://github.com/TerraFusion/terrafusion-os"
default-run = "terrafusion-competition-engine"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.7.2", features = [ "window-unmaximize", "window-close", "path-all", "window-start-dragging", "window-show", "system-tray", "dialog-all", "fs-all", "shell-open", "window-minimize", "window-maximize", "notification-all", "window-unminimize", "http-all", "window-hide"] }

[[bin]]
name = "terrafusion-competition-engine"
path = "src/main.rs"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
