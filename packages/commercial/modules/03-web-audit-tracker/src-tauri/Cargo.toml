[package]
name = "web_audit_tracker"
version = "1.2.0"
description = "TerraFusion Web Audit Tracker - Native Desktop Application"
authors = ["TerraFusion Championship Team"]
license = "MIT"
repository = "https://github.com/terrafusion/tauri-master-workspace"
default-run = "web_audit_tracker"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["dialog-all", "fs-all", "notification-all", "shell-open", "window-close", "window-hide", "window-maximize", "window-minimize", "window-show", "window-start-dragging", "window-unmaximize", "window-unminimize", "system-tray"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }

# TerraFusion Core - Tesla-grade shared services
terrafusion-core = { path = "../../../shared/rust-services/placeholder" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]