version: '3.8'

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  consul-data:
    driver: local
  kong-db-data:
    driver: local
  rabbitmq-data:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local
  terrafusion-logs:
    driver: local

services:
  # PostgreSQL for Kong
  kong-database:
    image: postgres:13
    container_name: terrafusion-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kongpass
      POSTGRES_DB: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kong Database Migration
  kong-migration:
    image: kong:3.0
    container_name: terrafusion-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
    networks:
      - terrafusion-network
    depends_on:
      kong-database:
        condition: service_healthy
    restart: "no"

  # Consul Service Discovery
  consul:
    image: consul:1.16
    container_name: terrafusion-consul
    hostname: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: >
      consul agent 
      -server 
      -bootstrap-expect=1 
      -ui-config-enabled 
      -data-dir=/consul/data 
      -config-dir=/consul/config 
      -log-level=INFO
    volumes:
      - consul-data:/consul/data
      - ./consul-config:/consul/config
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.10
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kong API Gateway
  kong:
    image: kong:3.0
    container_name: terrafusion-kong
    ports:
      - "8000:8000"  # HTTP
      - "8443:8443"  # HTTPS
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin API HTTPS
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:${TF_SERVICE_8001_PORT:-8001}"
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.20
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: terrafusion-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: terrafusion
      RABBITMQ_DEFAULT_PASS: tfpassword123
      RABBITMQ_DEFAULT_VHOST: /terrafusion
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit log_levels [{connection,info}]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq-config:/etc/rabbitmq
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: terrafusion-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_LOGGERS: "org.apache.zookeeper=WARN"
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.40
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Kafka Message Streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: terrafusion-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${TF_PORT_9092:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG4J_LOGGERS: "kafka.controller=WARN,kafka.producer.async.DefaultEventHandler=WARN,kafka.request.logger=WARN,kafka.network.RequestChannel=WARN,kafka.network.Processor=WARN,kafka.server.KafkaApis=WARN,kafka.log.LogCleaner=WARN,kafka.log.LogCleanerManager=WARN"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.50
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:${TF_PORT_9092:-9092}"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Redis Cache and Session Store
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --appendonly yes 
      --requirepass tfredispass123
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.60
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tfredispass123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TerraFusion Message Coordinator
  message-coordinator:
    build:
      context: ./message-coordinator
      dockerfile: Dockerfile
    container_name: terrafusion-message-coordinator
    ports:
      - "3002:${TF_DESKTOP_PORT:-3104}"
    environment:
      - NODE_ENV=production
      - CONSUL_HOST=consul
      - CONSUL_PORT=${TF_CONSUL_PORT:-8500}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${TF_RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=terrafusion
      - RABBITMQ_PASS=tfpassword123
      - RABBITMQ_VHOST=/terrafusion
      - KAFKA_BROKERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=${TF_REDIS_PORT:-6379}
      - REDIS_PASSWORD=tfredispass123
      - LOG_LEVEL=info
    volumes:
      - terrafusion-logs:/app/logs
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.70
    depends_on:
      consul:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TF_PORT_9092:-9092}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # TerraFusion Implementation Progress Monitor
  progress-monitor:
    build:
      context: ./progress-monitor
      dockerfile: Dockerfile
    container_name: terrafusion-progress-monitor
    ports:
      - "3001:${TF_SHELL_PORT:-3103}"
    environment:
      - NODE_ENV=production
      - CONSUL_HOST=consul
      - CONSUL_PORT=${TF_CONSUL_PORT:-8500}
      - LOG_LEVEL=info
    volumes:
      - terrafusion-logs:/app/logs
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.80
    depends_on:
      consul:
        condition: service_healthy
      message-coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TF_PORT_9092:-9092}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # AI Swarm Supreme Commander Interface
  supreme-commander:
    build:
      context: ./ai-swarm-supreme-commander
      dockerfile: Dockerfile
    container_name: terrafusion-supreme-commander
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - CONSUL_HOST=consul
      - CONSUL_PORT=${TF_CONSUL_PORT:-8500}
      - MESSAGE_COORDINATOR_HOST=message-coordinator
      - MESSAGE_COORDINATOR_PORT=${TF_CONSUL_PORT:-8500}
      - AGENT_COUNT=50000
      - FIELD_GENERALS=1220
      - OPERATIONAL_FORCES=48779
      - CRISIS_DETECTION_ENABLED=true
      - GOVERNMENT_COMPLIANCE=FISMA
      - LOG_LEVEL=info
    volumes:
      - terrafusion-logs:/app/logs
      - ./ai-swarm-config.json:/app/config/ai-swarm-config.json:ro
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.90
    depends_on:
      consul:
        condition: service_healthy
      message-coordinator:
        condition: service_healthy
      kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TF_PORT_9092:-9092}/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # System Health Monitor
  health-monitor:
    image: prom/prometheus:latest
    container_name: terrafusion-health-monitor
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.100
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    depends_on:
      - consul
      - kong
      - message-coordinator
    restart: unless-stopped

  # Log Aggregator
  log-aggregator:
    image: grafana/grafana:latest
    container_name: terrafusion-log-aggregator
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=tfgrafana123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    networks:
      terrafusion-network:
        ipv4_address: 172.20.0.110
    depends_on:
      - health-monitor
    restart: unless-stopped

  # Backup Manager
  backup-manager:
    build:
      context: ./backup-manager
      dockerfile: Dockerfile
    container_name: terrafusion-backup-manager
    environment:
      - BACKUP_SCHEDULE=0 2 * * *
      - RETENTION_DAYS=30
      - CONSUL_HOST=consul
      - POSTGRES_HOST=kong-database
      - POSTGRES_USER=kong
      - POSTGRES_PASSWORD=kongpass
    volumes:
      - ./backups:/backups
      - consul-data:/source/consul:ro
      - kong-db-data:/source/kong-db:ro
      - rabbitmq-data:/source/rabbitmq:ro
      - kafka-data:/source/kafka:ro
      - redis-data:/source/redis:ro
      - terrafusion-logs:/source/logs:ro
    networks:
      - terrafusion-network
    depends_on:
      - consul
      - kong-database
      - rabbitmq
      - kafka
      - redis
    restart: unless-stopped