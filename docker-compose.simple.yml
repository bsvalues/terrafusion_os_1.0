version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tf-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-terrafusion_marketplace}
      - POSTGRES_USER=${POSTGRES_USER:-terrafusion}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-TerraDB2025!}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - tf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion -d terrafusion_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tf-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-TerraRedis2025!}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - tf-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --requirepass ${REDIS_PASSWORD:-TerraRedis2025!}

  # TerraFusion API (Build from source)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.production.simple
    container_name: tf-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=terrafusion_marketplace;Username=terrafusion;Password=${POSTGRES_PASSWORD:-TerraDB2025!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-TerraRedis2025!}
      - Security__JwtSecret=${JWT_SECRET:-TerraJWTSecret2025ProductionKey!}
    ports:
      - "5000:8080"
    volumes:
      - ./logs:/app/logs
    networks:
      - tf-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  tf-net:
    driver: bridge
