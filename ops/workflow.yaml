# TerraFusion Workflow Definitions
# Declarative orchestration of complex operational procedures
version: "2.0"
last_updated: "2025-09-13T18:00:00Z"

workflows:
  # =============================================================================
  # Pre-Demo Preparation Workflows
  # =============================================================================

  pre_demo_check:
    name: "pre_demo_check"
    description: "Complete pre-demonstration system validation"
    timeout: 1800
    continue_on_error: false
    steps:
      - name: "system_health"
        script: "structure_monitor"
        description: "Validate system structure and organization"
        timeout: 300
        
      - name: "ai_agents_status"
        script: "monitor_agents" 
        description: "Verify AI agent swarm operational status"
        timeout: 300
        
      - name: "security_validation"
        script: "security_audit"
        description: "Run security audit and compliance checks"
        timeout: 1200
        
      - name: "test_suite"
        script: "run_full_test_suite"
        description: "Execute abbreviated test suite"
        timeout: 1800
        parameters:
          test_level: "integration"
          coverage_threshold: 75

  pre_production_validation:
    name: "pre_production_validation"
    description: "Comprehensive pre-production validation workflow"
    timeout: 7200
    continue_on_error: false
    steps:
      - name: "backup_creation"
        script: "backup_create"
        description: "Create comprehensive pre-deployment backup"
        timeout: 1800
        parameters:
          backup_type: "full"
          
      - name: "ai_training"
        script: "ai_agent_training"
        description: "Complete AI agent training and validation"
        timeout: 3600
        parameters:
          training_mode: "validation"
          
      - name: "full_test_suite"
        script: "run_full_test_suite"
        description: "Execute complete test suite"
        timeout: 7200
        parameters:
          test_level: "full"
          coverage_threshold: 90
          
      - name: "ultimate_validation"
        script: "ultimate_validation"
        description: "11-layer protection system validation"
        timeout: 1800
        
      - name: "compliance_check"
        script: "compliance_check"
        description: "Government compliance validation"
        timeout: 1800

  # =============================================================================
  # County Demonstration Workflows
  # =============================================================================

  demo_benton_full:
    name: "demo_benton_full"
    description: "Complete Benton County demonstration with white-glove service"
    timeout: 5400
    continue_on_error: false
    steps:
      - name: "pre_demo_validation"
        workflow: "pre_demo_check"
        description: "Validate system readiness"
        
      - name: "benton_demo_execution"
        script: "demo_benton_county"
        description: "Execute Benton County demonstration"
        timeout: 2700
        parameters:
          demo_mode: "white_glove"
          data_mode: "production"
          
      - name: "ai_swarm_showcase"
        script: "deploy_ai_swarms"
        description: "Demonstrate AI swarm capabilities"
        timeout: 1800
        parameters:
          agent_count: 10000
          orchestration_level: 11

  demo_yakima_full:
    name: "demo_yakima_full" 
    description: "Complete Yakima County demonstration"
    timeout: 4500
    continue_on_error: false
    steps:
      - name: "pre_demo_validation"
        workflow: "pre_demo_check"
        description: "Validate system readiness"
        
      - name: "yakima_demo_execution"
        script: "demo_yakima_county"
        description: "Execute Yakima County demonstration"
        timeout: 2700
        parameters:
          demo_mode: "full"

  demo_franklin_full:
    name: "demo_franklin_full"
    description: "Complete Franklin County demonstration"
    timeout: 4500
    continue_on_error: false
    steps:
      - name: "pre_demo_validation"
        workflow: "pre_demo_check"
        description: "Validate system readiness"
        
      - name: "franklin_demo_execution"
        script: "demo_franklin_county"
        description: "Execute Franklin County demonstration"
        timeout: 2700

  # =============================================================================
  # Production Deployment Workflows
  # =============================================================================

  prod_deploy_and_verify:
    name: "prod_deploy_and_verify"
    description: "Production deployment with comprehensive verification"
    timeout: 10800
    continue_on_error: false
    steps:
      - name: "pre_deployment_validation"
        workflow: "pre_production_validation"
        description: "Complete pre-production validation"
        
      - name: "production_deployment"
        script: "deploy_production"
        description: "Execute production deployment"
        timeout: 3600
        parameters:
          deployment_strategy: "blue_green"
          environment: "production"
          
      - name: "post_deploy_verification"
        script: "run_full_test_suite"
        description: "Post-deployment verification tests"
        timeout: 3600
        parameters:
          test_level: "integration"
          coverage_threshold: 85
          
      - name: "ai_swarm_deployment"
        script: "deploy_ai_swarms"
        description: "Deploy production AI swarm"
        timeout: 1800
        parameters:
          agent_count: 50000
          orchestration_level: 11
          
      - name: "final_validation"
        script: "ultimate_validation"
        description: "Final production validation"
        timeout: 1800

  marketplace_deploy_full:
    name: "marketplace_deploy_full"
    description: "Complete marketplace platform deployment"
    timeout: 6000
    continue_on_error: false
    steps:
      - name: "pre_deploy_backup"
        script: "backup_create"
        description: "Create pre-deployment backup"
        timeout: 1800
        parameters:
          backup_type: "full"
          
      - name: "marketplace_deployment"
        script: "deploy_marketplace"
        description: "Deploy marketplace platform"
        timeout: 2400
        
      - name: "marketplace_validation"
        script: "run_full_test_suite"
        description: "Validate marketplace functionality"
        timeout: 1800
        parameters:
          test_level: "integration"
          coverage_threshold: 80

  # =============================================================================
  # Maintenance & Recovery Workflows
  # =============================================================================

  daily_maintenance:
    name: "daily_maintenance"
    description: "Daily system maintenance and health checks"
    timeout: 3600
    continue_on_error: true
    steps:
      - name: "structure_monitoring"
        script: "structure_monitor"
        description: "Monitor codebase structure"
        timeout: 300
        continue_on_error: true
        
      - name: "ai_health_check"
        script: "monitor_agents"
        description: "Check AI agent swarm health"
        timeout: 300
        continue_on_error: true
        
      - name: "auto_correction"
        script: "auto_correct"
        description: "Automated system corrections"
        timeout: 900
        continue_on_error: true
        
      - name: "backup_creation"
        script: "backup_create"
        description: "Create daily backup"
        timeout: 1800
        parameters:
          backup_type: "incremental"
        continue_on_error: true

  emergency_recovery:
    name: "emergency_recovery"
    description: "Emergency system recovery procedures"
    timeout: 7200
    continue_on_error: false
    steps:
      - name: "system_assessment"
        script: "structure_monitor"
        description: "Assess system damage"
        timeout: 300
        
      - name: "disaster_recovery"
        script: "disaster_recovery"
        description: "Execute disaster recovery procedures"
        timeout: 3600
        
      - name: "structure_enforcement"
        script: "structure_enforce"
        description: "Enforce proper system structure"
        timeout: 600
        
      - name: "ai_agent_retraining"
        script: "ai_agent_training"
        description: "Retrain AI agents after recovery"
        timeout: 3600
        parameters:
          training_mode: "full"
          
      - name: "validation_suite"
        script: "run_full_test_suite"
        description: "Validate system recovery"
        timeout: 3600
        parameters:
          test_level: "full"
          coverage_threshold: 80

  # =============================================================================
  # CI/CD Integration Workflows
  # =============================================================================

  continuous_integration:
    name: "continuous_integration"
    description: "Continuous integration validation workflow"
    timeout: 5400
    continue_on_error: false
    steps:
      - name: "structure_validation"
        script: "structure_monitor"
        description: "Validate codebase structure"
        timeout: 300
        
      - name: "security_scan"
        script: "security_audit"
        description: "Security vulnerability scan"
        timeout: 1200
        
      - name: "test_execution"
        script: "run_full_test_suite"
        description: "Execute CI test suite"
        timeout: 3600
        parameters:
          test_level: "integration"
          coverage_threshold: 85
          
      - name: "compliance_validation"
        script: "compliance_check"
        description: "Government compliance check"
        timeout: 1800

# =============================================================================
# Workflow Categories
# =============================================================================
categories:
  validation:
    description: "System validation and verification workflows"
    color: "#4CAF50"
    
  demonstration:
    description: "County demonstration workflows"
    color: "#2196F3"
    
  deployment:
    description: "Production deployment workflows"  
    color: "#F44336"
    
  maintenance:
    description: "System maintenance and operations"
    color: "#FF9800"
    
  emergency:
    description: "Emergency response and recovery"
    color: "#9C27B0"
    
  integration:
    description: "CI/CD integration workflows"
    color: "#607D8B"

# =============================================================================
# Global Workflow Configuration
# =============================================================================
config:
  max_parallel_workflows: 3
  default_timeout: 3600
  notification_on_failure: true
  notification_on_success: false
  log_retention_days: 90
  enable_dry_run: true
  
  # TerraFusion-specific workflow settings
  terrafusion:
    enable_ai_orchestration: true
    max_agent_deployment: 50000
    compliance_enforcement: true
    government_mode: true
    white_glove_service: true