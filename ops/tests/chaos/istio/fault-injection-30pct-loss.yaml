# TerraFusion OS — Istio Fault Injection: 30% Packet Loss (Abort Simulation)
# Phase 4.9 Week 1 Day 7 — Fault F2
# Apply: kubectl apply -f fault-injection-30pct-loss.yaml
# Cleanup: kubectl delete virtualservice api-packet-loss-30pct

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-packet-loss-30pct
  namespace: terrafusion
  labels:
    test: chaos
    fault: f2-packet-loss
spec:
  hosts:
    - api.terrafusion.local
    - api.terrafusion.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /v1/properties
    route:
    - destination:
        host: api.terrafusion.svc.cluster.local
        port:
          number: 80
    fault:
      abort:
        httpStatus: 503
        percentage:
          value: 30.0
    retries:
      attempts: 2
      perTryTimeout: 500ms
      retryOn: 5xx,connect-failure,reset,refused-stream
    timeout: 5s
  - route:
    - destination:
        host: api.terrafusion.svc.cluster.local
        port:
          number: 80
    retries:
      attempts: 2
      perTryTimeout: 500ms
      retryOn: 5xx,connect-failure,reset
    timeout: 5s
---
# Observability: Track circuit breaker state during packet loss
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: chaos-f2-telemetry
  namespace: terrafusion
spec:
  accessLogging:
    - providers:
      - name: envoy
  tracing:
    - providers:
      - name: jaeger
      randomSamplingPercentage: 100.0
      customTags:
        chaos_fault:
          literal:
            value: "f2-packet-loss-30pct"
        circuit_breaker_state:
          header:
            name: X-Circuit-Breaker-State
