# TerraFusion OS — Prometheus Alerts (Chaos Test)
# Phase 4.9 Week 1 Day 7
# Apply: kubectl apply -f chaos-alerts.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-chaos-alerts
  namespace: observability
  labels:
    app: prometheus
    test: chaos
data:
  chaos-alerts.yml: |
    groups:
    - name: chaos-alerts
      interval: 30s
      rules:
      # Alert: P95 latency exceeds 500ms threshold
      - alert: BrownoutP95Exceeded
        expr: job:http_request_duration_seconds:p95{job="api"} > 0.5
        for: 2m
        labels:
          severity: warning
          test: chaos
        annotations:
          summary: "API P95 latency exceeded 500ms during chaos test"
          description: "API service {{ $labels.job }} P95 latency is {{ $value | humanizeDuration }}, exceeding 500ms threshold for 2 minutes."
          runbook_url: "https://terrafusion.local/runbooks/high-latency"
      
      # Alert: Error rate spike (>1%)
      - alert: ErrorRateSpike
        expr: api:error_rate{job="api"} > 0.01
        for: 2m
        labels:
          severity: critical
          test: chaos
        annotations:
          summary: "API 5xx error rate >1% during chaos test"
          description: "API service {{ $labels.job }} error rate is {{ $value | humanizePercentage }}, exceeding 1% threshold for 2 minutes."
          runbook_url: "https://terrafusion.local/runbooks/error-spike"
      
      # Alert: Circuit breaker open for extended period
      - alert: CircuitBreakerStuck
        expr: circuit_breaker_state{state="OPEN"} > 0
        for: 5m
        labels:
          severity: warning
          test: chaos
        annotations:
          summary: "Circuit breaker stuck OPEN for >5min"
          description: "Circuit breaker for service {{ $labels.service }} has been OPEN for more than 5 minutes, indicating sustained failures."
          runbook_url: "https://terrafusion.local/runbooks/circuit-breaker"
      
      # Alert: Kafka consumer lag growing
      - alert: KafkaConsumerLagGrowing
        expr: delta(kafka:consumer_lag[5m]) > 1000
        for: 3m
        labels:
          severity: warning
          test: chaos
        annotations:
          summary: "Kafka consumer lag growing rapidly"
          description: "Consumer lag for topic {{ $labels.topic }} group {{ $labels.group }} increased by {{ $value }} messages in 5 minutes."
          runbook_url: "https://terrafusion.local/runbooks/kafka-lag"
      
      # Alert: Redis cache hit rate drop
      - alert: RedisCacheHitRateDrop
        expr: redis:cache_hit_rate < 0.50
        for: 5m
        labels:
          severity: info
          test: chaos
        annotations:
          summary: "Redis cache hit rate dropped below 50%"
          description: "Redis cache hit rate is {{ $value | humanizePercentage }}, indicating potential brownout or failover."
          runbook_url: "https://terrafusion.local/runbooks/redis-cache"
