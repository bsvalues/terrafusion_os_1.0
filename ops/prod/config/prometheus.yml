global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'terrafusion-iron'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['terrafusion-iron:5000']
  - job_name: 'terrafusion-cortex'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['terrafusion-cortex:8006']
