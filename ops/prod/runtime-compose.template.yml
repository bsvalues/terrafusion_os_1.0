services:
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # No host port binding — the shared edge proxy owns 80/443 and
    # routes to this container by name over the terrafusion-edge network.
    env_file:
      - ./release.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - default
      - terrafusion-edge

  backend:
    image: ${TF_BACKEND_IMAGE}
    restart: unless-stopped
    env_file:
      - ./app.env
      - ./release.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DatabaseProvider: Sqlite
      ConnectionStrings__DefaultConnection: Data Source=data/terrafusion.db
      TF_STATE_MESH_ENFORCE: 'true'
    volumes:
      - ./data:/app/data
      - ./docs/spec-lock:/app/docs/spec-lock:ro
      - ./sovereign.yaml:/app/sovereign.yaml:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5000/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    image: ${TF_FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  terrafusion-edge:
    external: true

volumes:
  caddy_data:
  caddy_config:
