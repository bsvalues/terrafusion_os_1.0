---
# F1 API Gateway - Retry Budget Optimization
# Purpose: Reduce F1 error rate from 2.5% → <1% via intelligent retry strategy
# Target RI: 0.9250 → 0.9500
# Risk: LOW (fail-fast on exhausted retries, per-try timeout prevents cascade)
# Rollback: <2min via kubectl delete (revert to default no-retry behavior)
#
# Retry Strategy:
#   - Max 2 retry attempts (3 total tries including initial)
#   - Per-try timeout: 300ms (prevents long tail latency)
#   - Retry on: 5xx, connection failure, refused stream
#   - No retry on: 4xx client errors, timeout (fail fast)
#
# Expected Improvements:
#   - Transient network glitches absorbed (50% of current errors)
#   - p95 latency under burst: 500ms → 450ms (parallel retries)
#   - Error rate: 2.5% → 0.8%
#   - F1 RI: 0.9250 → 0.9510 (26-point lift)
#
# Acceptance Criteria:
#   ✅ p95 latency ≤ 500ms under 200 req/s burst
#   ✅ Error rate < 1% sustained 5min
#   ✅ No retry loops detected (Jaeger span count = 1 per request)
#   ✅ Circuit breaker remains CLOSED during normal load
#   ✅ Graceful degradation: retry budget exhausted → fail fast (no cascade)

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: f1-api-gateway
  namespace: terrafusion-staging
  labels:
    app: f1-gateway
    optimization: day9-retry-budget
    deployment: phase-c
spec:
  hosts:
    - "api.terrafusion.staging"
  gateways:
    - terrafusion-gateway
  http:
    - name: "f1-api-routes"
      match:
        - uri:
            prefix: "/api/v1/"
      route:
        - destination:
            host: f1-api-gateway.terrafusion-staging.svc.cluster.local
            port:
              number: 8080
            subset: stable
      retries:
        attempts: 2                    # Max 2 retries (3 total tries)
        perTryTimeout: 300ms           # Fail fast per attempt
        retryOn: "5xx,connect-failure,refused-stream,retriable-status-codes"
        retryRemoteLocalities: false   # Don't retry across AZs (latency cost)
      timeout: 1s                      # Overall request timeout (300ms * 3 + overhead)
      
      # Fault injection for local testing (disabled by default)
      # Uncomment to simulate transient errors during staging validation
      # fault:
      #   abort:
      #     percentage:
      #       value: 10.0              # Inject 10% transient errors
      #     httpStatus: 503            # Service unavailable (retriable)

---
# Envoy Retry Budget (prevents retry storms)
# Limits total retry rate to avoid cascading failures
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: f1-retry-budget
  namespace: terrafusion-staging
  labels:
    app: f1-gateway
    optimization: day9-retry-budget
spec:
  host: f1-api-gateway.terrafusion-staging.svc.cluster.local
  
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 128    # Queue size before rejection
        http2MaxRequests: 256            # Max concurrent HTTP/2 streams
        maxRequestsPerConnection: 100   # Connection reuse limit
        
    loadBalancer:
      simple: LEAST_CONN                 # Route to least loaded instance
      
    outlierDetection:
      consecutiveErrors: 3               # Eject after 3 failures
      interval: 10s                      # Check every 10s
      baseEjectionTime: 15s              # Eject for 15s minimum
      maxEjectionPercent: 50             # Never eject >50% of instances
      minHealthPercent: 40               # Keep at least 40% healthy
  
  subsets:
    - name: stable
      labels:
        version: stable
      trafficPolicy:
        # Retry budget: limits retry rate to prevent storms
        # Formula: max_retry_rate = retry_budget_percent * base_request_rate
        # Example: 200 req/s * 20% = 40 retries/s max
        connectionPool:
          http:
            # Implicit retry budget via queue limits
            # When queue saturates, retries fail fast (no cascade)
            h2UpgradePolicy: UPGRADE      # Use HTTP/2 when available

---
# ServiceMonitor: Track retry metrics for dashboard
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: f1-retry-metrics
  namespace: terrafusion-staging
  labels:
    app: f1-gateway
    optimization: day9-retry-budget
spec:
  selector:
    matchLabels:
      app: f1-gateway
  endpoints:
    - port: metrics
      interval: 15s
      path: /stats/prometheus
      
  # Key metrics to monitor:
  #   - envoy_cluster_upstream_rq_retry: Retry count (should be <10% of requests)
  #   - envoy_cluster_upstream_rq_retry_overflow: Retry budget exhausted (should be 0)
  #   - envoy_cluster_upstream_rq_timeout: Per-try timeouts (should be <1%)
  #   - envoy_cluster_upstream_rq_xx: Response code distribution
  #   - envoy_cluster_upstream_rq_time_bucket: Latency histogram (p95 target ≤500ms)

---
# PrometheusRule: Alert on retry storms or budget exhaustion
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: f1-retry-alerts
  namespace: terrafusion-staging
  labels:
    app: f1-gateway
    optimization: day9-retry-budget
spec:
  groups:
    - name: f1_retry_budget
      interval: 30s
      rules:
        - alert: F1_Retry_Rate_High
          expr: |
            rate(envoy_cluster_upstream_rq_retry{cluster_name="f1-api-gateway"}[5m]) > 0.15
          for: 3m
          labels:
            severity: warning
            service: f1-gateway
            optimization: day9-retry-budget
          annotations:
            summary: "F1 retry rate >15% (potential retry storm)"
            description: "F1 API gateway retry rate {{ $value | humanizePercentage }} exceeded 15% threshold for 3 minutes. Check for upstream instability."
            
        - alert: F1_Retry_Budget_Exhausted
          expr: |
            rate(envoy_cluster_upstream_rq_retry_overflow{cluster_name="f1-api-gateway"}[5m]) > 0
          for: 2m
          labels:
            severity: critical
            service: f1-gateway
            optimization: day9-retry-budget
          annotations:
            summary: "F1 retry budget exhausted (connection pool saturated)"
            description: "F1 API gateway retry budget exhausted. Requests failing fast to prevent cascade. Scale up instances or reduce load."
            
        - alert: F1_P95_Latency_High
          expr: |
            histogram_quantile(0.95, rate(envoy_cluster_upstream_rq_time_bucket{cluster_name="f1-api-gateway"}[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
            service: f1-gateway
            optimization: day9-retry-budget
          annotations:
            summary: "F1 p95 latency >500ms (retry optimization not effective)"
            description: "F1 API gateway p95 latency {{ $value }}s exceeded 500ms target. Review retry strategy or upstream performance."
