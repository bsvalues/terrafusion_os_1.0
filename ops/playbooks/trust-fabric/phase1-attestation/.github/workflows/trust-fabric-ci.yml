name: Trust Fabric Build & Attestation

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  SIGSTORE_EXPERIMENTAL: 1
  
jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Trust Fabric Tools
        run: |
          # Install Syft for SBOM
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
          # Install Cosign for signing
          curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -o cosign
          chmod +x cosign && sudo mv cosign /usr/local/bin/
          
          # Install Rekor CLI
          curl -sSfL https://github.com/sigstore/rekor/releases/latest/download/rekor-cli-linux-amd64 -o rekor-cli
          chmod +x rekor-cli && sudo mv rekor-cli /usr/local/bin/
      
      - name: Generate SBOM
        id: sbom
        run: |
          syft dir:. -o cyclonedx-json > sbom.json
          echo "sbom_hash=$(sha256sum sbom.json | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          
      - name: Build TerraFusion
        run: |
          # Backend build
          cd backend
          dotnet build -c Release
          
          # Frontend build
          cd ../frontend
          npm ci
          npm run build
          
      - name: Sign Artifacts
        run: |
          # Sign backend
          cosign sign-blob --yes \
            --output-signature backend.sig \
            --output-certificate backend.crt \
            backend/bin/Release/net9.0/TerraFusion.API.dll
            
          # Sign frontend
          tar czf frontend.tar.gz frontend/dist/
          cosign sign-blob --yes \
            --output-signature frontend.sig \
            --output-certificate frontend.crt \
            frontend.tar.gz
            
      - name: Attest SBOM
        run: |
          cosign attest-blob --yes \
            --predicate sbom.json \
            --type cyclonedx \
            --output-file sbom.attestation.json \
            backend/bin/Release/net9.0/TerraFusion.API.dll
            
      - name: Submit to Transparency Log
        run: |
          # Submit to Rekor
          rekor-cli upload \
            --artifact backend/bin/Release/net9.0/TerraFusion.API.dll \
            --signature backend.sig \
            --public-key backend.crt \
            --format json > rekor-entry.json
            
          echo "Rekor Log Index: $(jq -r .LogIndex rekor-entry.json)"
          
      - name: Generate Trust Bundle
        run: |
          # Create trust bundle for deployment
          mkdir -p trust-bundle
          cp sbom.json trust-bundle/
          cp *.sig trust-bundle/
          cp *.crt trust-bundle/
          cp rekor-entry.json trust-bundle/
          
          # Create verification script
          cat > trust-bundle/verify.sh << 'EOF'
          #!/bin/bash
          echo "🔐 Verifying TerraFusion Trust Fabric..."
          cosign verify-blob \
            --certificate backend.crt \
            --signature backend.sig \
            backend/bin/Release/net9.0/TerraFusion.API.dll
          echo "✅ Verification complete"
          EOF
          
          chmod +x trust-bundle/verify.sh
          
      - name: Upload Trust Bundle
        uses: actions/upload-artifact@v3
        with:
          name: trust-bundle-${{ github.sha }}
          path: trust-bundle/

      - name: TerraFusion Trust Fabric Report
        run: |
          echo "🔐 TRUST FABRIC ATTESTATION COMPLETE"
          echo "=================================="
          echo "📦 SBOM Hash: $(cat sbom.json | sha256sum | cut -d' ' -f1)"
          echo "✍️ Backend Signature: $(ls -la backend.sig)"
          echo "✍️ Frontend Signature: $(ls -la frontend.sig)"
          echo "📝 Rekor Entry: $(jq -r .LogIndex rekor-entry.json)"
          echo "🎯 Trust Bundle: trust-bundle-${{ github.sha }}"
          echo ""
          echo "✅ TerraFusion is now CRYPTOGRAPHICALLY PROVABLE"
