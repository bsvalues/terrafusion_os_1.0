# TerraFusion Ops Inventory
# Canonical registry of all operational scripts and their metadata
version: "2.0"
last_updated: "2025-09-13T18:00:00Z"

scripts:
  # =============================================================================
  # AI & Agent Management
  # =============================================================================
  
  deploy_ai_swarms:
    name: "deploy_ai_swarms"
    description: "Deploy and activate TerraFusion AI swarm (50,000+ agents)"
    path: "./scripts/ai-orchestration-layer-11.mjs"
    category: "ai"
    timeout_default: 1800
    retries_default: 2
    parameters:
      - name: "agent_count"
        type: "integer"
        default: "50000"
        description: "Number of agents to deploy"
      - name: "orchestration_level"
        type: "integer"
        default: "11"
        description: "Protection layer level (1-11)"

  ai_agent_training:
    name: "ai_agent_training"
    description: "Complete AI agent training and validation pipeline"
    path: "./scripts/ai-agent-training.ps1"
    category: "ai"
    timeout_default: 3600
    retries_default: 1
    parameters:
      - name: "training_mode"
        type: "string"
        default: "full"
        description: "Training mode: full, incremental, validation"

  monitor_agents:
    name: "monitor_agents"
    description: "Real-time monitoring of AI agent swarm health"
    path: "./scripts/ai-health-check.mjs"
    category: "ai"
    timeout_default: 300
    retries_default: 0

  # =============================================================================
  # Testing & Validation
  # =============================================================================

  run_full_test_suite:
    name: "run_full_test_suite"
    description: "Execute comprehensive test suite (unit, integration, E2E)"
    path: "./scripts/run-all-tests.sh"
    category: "testing"
    timeout_default: 7200
    retries_default: 1
    parameters:
      - name: "test_level"
        type: "string"
        default: "full"
        description: "Test level: unit, integration, e2e, full"
      - name: "coverage_threshold"
        type: "integer"
        default: "80"
        description: "Minimum coverage percentage"

  ultimate_validation:
    name: "ultimate_validation"
    description: "Ultimate validation with 11-layer protection system"
    path: "./scripts/ultimate-ai-firewall.mjs"
    category: "validation"
    timeout_default: 1800
    retries_default: 0

  auto_correct:
    name: "auto_correct"
    description: "Automated correction and cleanup processes"
    path: "./scripts/auto-correct.sh"
    category: "maintenance"
    timeout_default: 900
    retries_default: 2

  # =============================================================================
  # County Demonstrations
  # =============================================================================

  demo_benton_county:
    name: "demo_benton_county"
    description: "Complete Benton County demonstration workflow"
    path: "./scripts/demo-benton-county.sh"
    category: "demo"
    timeout_default: 2700
    retries_default: 1
    parameters:
      - name: "demo_mode"
        type: "string"
        default: "full"
        description: "Demo mode: quick, standard, full, white_glove"
      - name: "data_mode"
        type: "string"
        default: "production"
        description: "Data mode: synthetic, staging, production"

  demo_yakima_county:
    name: "demo_yakima_county"
    description: "Complete Yakima County demonstration workflow"
    path: "./scripts/demo-yakima-county.sh"
    category: "demo"
    timeout_default: 2700
    retries_default: 1
    parameters:
      - name: "demo_mode"
        type: "string"
        default: "full"
        description: "Demo mode: quick, standard, full"

  demo_franklin_county:
    name: "demo_franklin_county"
    description: "Complete Franklin County demonstration workflow"
    path: "./scripts/demo-franklin-county.sh"
    category: "demo"
    timeout_default: 2700
    retries_default: 1

  # =============================================================================
  # Deployment & Infrastructure
  # =============================================================================

  deploy_production:
    name: "deploy_production"
    description: "Production deployment with blue-green strategy"
    path: "./Deploy-Production.ps1"
    category: "deployment"
    timeout_default: 3600
    retries_default: 0
    parameters:
      - name: "deployment_strategy"
        type: "string"
        default: "blue_green"
        description: "Deployment strategy: blue_green, rolling, canary"
      - name: "environment"
        type: "string"
        default: "production"
        description: "Target environment"

  deploy_marketplace:
    name: "deploy_marketplace"
    description: "Deploy TerraFusion Marketplace Platform"
    path: "./Deploy-Marketplace-Platform.ps1"
    category: "deployment"
    timeout_default: 2400
    retries_default: 1

  deploy_with_credentials:
    name: "deploy_with_credentials"
    description: "Secure deployment with credential validation"
    path: "./DEPLOY_WITH_CORRECT_CREDENTIALS.bat"
    category: "deployment"
    timeout_default: 1800
    retries_default: 0

  # =============================================================================
  # Security & Compliance
  # =============================================================================

  security_audit:
    name: "security_audit"
    description: "Comprehensive security audit and compliance check"
    path: "./scripts/security-audit-complete.sh"
    category: "validation"
    timeout_default: 2400
    retries_default: 0

  compliance_check:
    name: "compliance_check"
    description: "FISMA, NIST 800-53, and Section 508 compliance validation"
    path: "./scripts/compliance-validator.sh"
    category: "validation"
    timeout_default: 1800
    retries_default: 1

  # =============================================================================
  # Maintenance & Operations
  # =============================================================================

  structure_monitor:
    name: "structure_monitor"
    description: "Monitor codebase structure and organization"
    path: "./scripts/organization/monitor-chaos.sh"
    category: "maintenance"
    timeout_default: 300
    retries_default: 0

  structure_enforce:
    name: "structure_enforce"
    description: "Enforce proper codebase structure and organization"
    path: "./scripts/organization/enforce-structure.sh"
    category: "maintenance"
    timeout_default: 600
    retries_default: 1

  backup_create:
    name: "backup_create"
    description: "Create comprehensive system backup"
    path: "./scripts/create-backup.sh"
    category: "maintenance"
    timeout_default: 1800
    retries_default: 1
    parameters:
      - name: "backup_type"
        type: "string"
        default: "full"
        description: "Backup type: full, incremental, critical"

  disaster_recovery:
    name: "disaster_recovery"
    description: "Emergency disaster recovery procedures"
    path: "./scripts/disaster-recovery.sh"
    category: "maintenance"
    timeout_default: 3600
    retries_default: 0

# =============================================================================
# Script Categories
# =============================================================================
categories:
  ai:
    description: "AI agent management and orchestration"
    color: "#4CAF50"
    priority: "high"
  
  testing:
    description: "Test execution and validation"
    color: "#2196F3"
    priority: "high"
  
  validation:
    description: "Security, compliance, and system validation"
    color: "#FF9800"
    priority: "critical"
  
  demo:
    description: "County demonstrations and presentations"
    color: "#9C27B0"
    priority: "medium"
  
  deployment:
    description: "Production deployment and infrastructure"
    color: "#F44336"
    priority: "critical"
  
  maintenance:
    description: "System maintenance and operations"
    color: "#607D8B"
    priority: "medium"

# =============================================================================
# Global Configuration
# =============================================================================
config:
  log_directory: "./var/log/ops"
  max_concurrent_jobs: 5
  default_timeout: 3600
  default_retries: 1
  job_retention_days: 30
  enable_notifications: true
  notification_channels:
    - "slack"
    - "email"
    - "webhook"
  
  # TerraFusion-specific settings
  terrafusion:
    agent_count: 50000
    orchestration_layers: 11
    marketplace_revenue_target: 5400000
    counties_supported: ["benton", "yakima", "franklin", "king", "pierce"]
    compliance_standards: ["FISMA", "NIST-800-53", "Section-508"]