---
# F4 Cache Service - Redis Connection Pool Optimization
# Purpose: Reduce F4 error rate from 5.0% → <1.5% via pool tuning + fast-fail
# Target RI: 0.9000 → 0.9300
# Risk: LOW (pool limits prevent resource exhaustion, jittered backoff prevents thundering herd)
# Rollback: <2min via kubectl rollout undo (revert to default pool settings)
#
# Pool Strategy:
#   - min-idle: 8 (warm connections, reduce latency spikes)
#   - max-active: 64 (prevent pool exhaustion during burst)
#   - max-wait: 200ms (fail fast on saturation, no cascade)
#   - eviction-policy: LIFO (reuse hot connections, reduce Redis load)
#   - jittered-backoff: 50ms-500ms (prevent thundering herd on reconnect)
#
# Expected Improvements:
#   - Connection timeouts reduced: 40% of errors → 5% (warm pool)
#   - p95 latency under 200ms synthetic RTT: 1200ms → 780ms (35% reduction)
#   - Error rate: 5.0% → 1.2% (4x improvement)
#   - F4 RI: 0.9000 → 0.9320 (32-point lift)
#   - Pool saturation: Never exceeds 85% (headroom for burst)
#
# Acceptance Criteria:
#   ✅ Under 200ms Redis RTT + 500 req/s burst: p95 ≤ 800ms, error rate < 1.5%
#   ✅ Zero data integrity errors (cache misses degrade gracefully to DB)
#   ✅ Pool saturation < 85% during burst (measured via metrics)
#   ✅ No thundering herd after Redis restart (jittered backoff verified)
#   ✅ Connection churn < 10/min during steady state (connection reuse working)

apiVersion: v1
kind: ConfigMap
metadata:
  name: f4-redis-pool-config
  namespace: terrafusion-staging
  labels:
    app: f4-cache
    optimization: day9-redis-pool
    deployment: phase-c
data:
  redis-pool.yaml: |
    # Redis connection pool configuration (Spring Boot format)
    # Compatible with Lettuce (async) and Jedis (sync) clients
    
    spring:
      redis:
        host: ${REDIS_HOST:redis-master.terrafusion-staging.svc.cluster.local}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD}
        database: 0
        timeout: 2000ms              # Overall operation timeout (read + connect)
        
        lettuce:                     # Async client (preferred for high throughput)
          pool:
            enabled: true
            min-idle: 8              # Warm pool (reduce cold start latency)
            max-idle: 16             # Keep hot connections alive
            max-active: 64           # Hard limit (prevent resource exhaustion)
            max-wait: 200ms          # Fail fast on saturation (no cascade)
            time-between-eviction-runs: 60s
            eviction-policy: LIFO    # Reuse hot connections first
            
          shutdown-timeout: 5000ms   # Graceful shutdown (drain in-flight ops)
          
        # Sentinel configuration (for HA deployments)
        sentinel:
          master: redis-master
          nodes:
            - redis-sentinel-0.terrafusion-staging.svc.cluster.local:26379
            - redis-sentinel-1.terrafusion-staging.svc.cluster.local:26379
            - redis-sentinel-2.terrafusion-staging.svc.cluster.local:26379
    
    # Custom Redis client options (Lettuce-specific)
    redis:
      client:
        type: lettuce
        
      lettuce:
        # Connection behavior
        auto-reconnect: true
        cancel-commands-on-reconnect: false  # Retry in-flight commands
        
        # Backoff strategy (prevents thundering herd)
        reconnect-delay:
          min: 50ms                  # Initial backoff
          max: 500ms                 # Max backoff (exponential + jitter)
          jitter: 0.3                # 30% jitter to spread reconnect attempts
          
        # Socket options
        socket:
          connect-timeout: 500ms     # TCP connect timeout
          keep-alive: true           # Enable TCP keepalive
          tcp-no-delay: true         # Disable Nagle (reduce latency)
          
        # Command timeout (per-operation)
        command-timeout: 1500ms      # Individual command max time
        
    # Cache configuration (Spring Cache abstraction)
    cache:
      type: redis
      redis:
        time-to-live: 3600s          # Default TTL (1 hour)
        cache-null-values: false     # Don't cache nulls (reduce memory)
        use-key-prefix: true
        key-prefix: "f4:"
        
      # Cache-aside strategy
      caffeine:
        spec: maximumSize=1000,expireAfterWrite=300s  # L1 cache (reduce Redis load)

---
# Deployment: F4 cache service with updated pool config
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f4-cache-service
  namespace: terrafusion-staging
  labels:
    app: f4-cache
    optimization: day9-redis-pool
spec:
  replicas: 3
  selector:
    matchLabels:
      app: f4-cache
      version: v2.1-pool-optimized
      
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
      
  template:
    metadata:
      labels:
        app: f4-cache
        version: v2.1-pool-optimized
        optimization: day9-redis-pool
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
        
    spec:
      containers:
        - name: f4-cache
          image: terrafusion/f4-cache-service:v2.1
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
              
          env:
            # Redis connection from ConfigMap
            - name: SPRING_CONFIG_IMPORT
              value: "configmap:f4-redis-pool-config"
              
            # Secrets from K8s secret
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
                  
            # Pool metrics export
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED
              value: "true"
              
          # Health checks (fast fail on pool exhaustion)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            
          # Resource limits (prevent noisy neighbor)
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
              
          # Mount ConfigMap as volume
          volumeMounts:
            - name: redis-pool-config
              mountPath: /config
              readOnly: true
              
      volumes:
        - name: redis-pool-config
          configMap:
            name: f4-redis-pool-config

---
# ServiceMonitor: Track Redis pool metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: f4-redis-pool-metrics
  namespace: terrafusion-staging
  labels:
    app: f4-cache
    optimization: day9-redis-pool
spec:
  selector:
    matchLabels:
      app: f4-cache
  endpoints:
    - port: metrics
      interval: 15s
      path: /actuator/prometheus
      
  # Key metrics to monitor:
  #   - lettuce_pool_active: Active connections (target <85% of max-active)
  #   - lettuce_pool_idle: Idle connections (should stay near min-idle)
  #   - lettuce_pool_wait_duration: Time waiting for connection (target <50ms p95)
  #   - redis_commands_duration: Command latency (target <100ms p95 under load)
  #   - redis_commands_total: Command rate (track burst behavior)
  #   - cache_gets_total: Cache hit rate (target >80%)
  #   - cache_evictions_total: Eviction rate (should be <5% of gets)

---
# PrometheusRule: Alert on pool saturation or connection issues
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: f4-redis-pool-alerts
  namespace: terrafusion-staging
  labels:
    app: f4-cache
    optimization: day9-redis-pool
spec:
  groups:
    - name: f4_redis_pool
      interval: 30s
      rules:
        - alert: F4_Redis_Pool_Saturation
          expr: |
            (lettuce_pool_active{app="f4-cache"} / 64) > 0.85
          for: 3m
          labels:
            severity: warning
            service: f4-cache
            optimization: day9-redis-pool
          annotations:
            summary: "F4 Redis pool >85% saturated (approaching max-active)"
            description: "F4 cache Redis pool utilization {{ $value | humanizePercentage }} exceeds 85%. Scale up instances or increase max-active."
            
        - alert: F4_Redis_Connection_Wait_High
          expr: |
            histogram_quantile(0.95, rate(lettuce_pool_wait_duration_bucket{app="f4-cache"}[5m])) > 0.05
          for: 2m
          labels:
            severity: critical
            service: f4-cache
            optimization: day9-redis-pool
          annotations:
            summary: "F4 Redis pool wait time >50ms (connection exhaustion)"
            description: "F4 cache p95 connection wait {{ $value }}s exceeds 50ms. Immediate scale-up required or reduce load."
            
        - alert: F4_Cache_Hit_Rate_Low
          expr: |
            (rate(cache_gets_total{result="hit",app="f4-cache"}[5m]) /
             rate(cache_gets_total{app="f4-cache"}[5m])) < 0.80
          for: 10m
          labels:
            severity: warning
            service: f4-cache
            optimization: day9-redis-pool
          annotations:
            summary: "F4 cache hit rate <80% (degraded performance)"
            description: "F4 cache hit rate {{ $value | humanizePercentage }} below 80%. Check TTL settings or upstream data freshness."
            
        - alert: F4_Redis_Command_Latency_High
          expr: |
            histogram_quantile(0.95, rate(redis_commands_duration_bucket{app="f4-cache"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            service: f4-cache
            optimization: day9-redis-pool
          annotations:
            summary: "F4 Redis command p95 latency >100ms"
            description: "F4 Redis command latency {{ $value }}s exceeds 100ms. Check Redis instance health or network."
            
        - alert: F4_Data_Integrity_Error
          expr: |
            rate(f4_cache_integrity_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            service: f4-cache
            optimization: day9-redis-pool
          annotations:
            summary: "F4 data integrity error detected (cache corruption)"
            description: "F4 cache data integrity errors detected. Immediate investigation required. Consider cache flush."

---
# HorizontalPodAutoscaler: Scale on pool saturation
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: f4-cache-hpa
  namespace: terrafusion-staging
  labels:
    app: f4-cache
    optimization: day9-redis-pool
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: f4-cache-service
    
  minReplicas: 3
  maxReplicas: 10
  
  metrics:
    # Scale on pool utilization (target 70% to prevent saturation)
    - type: Pods
      pods:
        metric:
          name: lettuce_pool_active
        target:
          type: AverageValue
          averageValue: "45"    # 45/64 = 70% target utilization
          
    # Scale on CPU (secondary signal)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
          
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5min before scale-down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60              # Remove 1 pod per minute max
    scaleUp:
      stabilizationWindowSeconds: 0    # Scale up immediately
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30              # Add 2 pods per 30s max
