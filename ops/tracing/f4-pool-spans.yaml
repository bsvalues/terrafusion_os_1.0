#
# TerraFusion F4 Cache: Redis Pool Connection Tracing
# Day 9: Optimize F4 (Redis connection pooling + data integrity)
#
# Architecture Integration:
# - Complements ops/cache/f4-redis-pool.yaml (connection pooling config)
# - Enriches Jaeger traces with Redis pool wait duration per request
# - Feeds into ops/monitoring/ri-calculator.py (pool saturation factor)
#
# Purpose:
#   When F4 serves a cache lookup, the trace should show:
#     1. How long request waited for Redis connection (pool queue time)
#     2. Whether connection was reused vs new (pool efficiency)
#     3. Redis Sentinel endpoint selected (leader vs follower)
#     4. Cache hit vs miss (already in application code)
#
#   This helps diagnose:
#     - Pool saturation causing increased p95 latency
#     - HPA triggering due to sustained pool waits
#     - Redis Sentinel failover impact on connection reuse
#
# Deployment:
#   kubectl apply -f ops/tracing/f4-pool-spans.yaml
#   kubectl -n terrafusion-monitoring rollout status deployment/f4-cache
#
# Validation (after deploy):
#   # Query Jaeger for F4 requests with pool wait > 50ms
#   curl -s 'http://jaeger-query:16686/api/traces?service=f4-cache&tags={"pool.wait_ms":">50"}' \
#     | jq '.data[].spans[] | select(.operationName == "redis.get") | .tags'
#
# Author: TerraFusion Platform Team
# Last Updated: 2025-10-07
#

# =============================================================================
# Approach 1: Istio EnvoyFilter (cluster-level, no app code changes)
# =============================================================================

apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: f4-redis-pool-tracing
  namespace: terrafusion-staging
spec:
  workloadSelector:
    labels:
      app: f4-cache
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
            subFilter:
              name: envoy.filters.http.router
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.wasm
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
          config:
            name: f4_pool_metadata_injector
            root_id: f4_pool_metadata_injector
            vm_config:
              runtime: envoy.wasm.runtime.v8
              code:
                inline_string: |
                  // Rust/WASM filter to extract Redis pool metrics from F4 response headers
                  // and inject into Jaeger span tags
                  
                  use proxy_wasm::traits::*;
                  use proxy_wasm::types::*;
                  
                  #[no_mangle]
                  pub fn _start() {
                      proxy_wasm::set_http_context(|_, _| -> Box<dyn HttpContext> {
                          Box::new(F4PoolTracingFilter)
                      });
                  }
                  
                  struct F4PoolTracingFilter;
                  
                  impl HttpContext for F4PoolTracingFilter {
                      fn on_http_response_headers(&mut self, _num_headers: usize, _end_of_stream: bool) -> Action {
                          // Read F4 custom headers (injected by application code):
                          //   X-F4-Pool-Wait-Ms: 47      (time spent waiting for connection)
                          //   X-F4-Pool-Reused: true     (connection reused from pool)
                          //   X-F4-Redis-Endpoint: redis-sentinel-leader:6379
                          //   X-F4-Cache-Hit: true       (cache hit/miss)
                          
                          if let Some(pool_wait) = self.get_http_response_header("x-f4-pool-wait-ms") {
                              // Inject into current trace span as tag
                              self.set_property(vec!["pool", "wait_ms"], Some(pool_wait.as_bytes()));
                          }
                          
                          if let Some(pool_reused) = self.get_http_response_header("x-f4-pool-reused") {
                              self.set_property(vec!["pool", "connection_reused"], Some(pool_reused.as_bytes()));
                          }
                          
                          if let Some(redis_endpoint) = self.get_http_response_header("x-f4-redis-endpoint") {
                              self.set_property(vec!["redis", "endpoint"], Some(redis_endpoint.as_bytes()));
                          }
                          
                          if let Some(cache_hit) = self.get_http_response_header("x-f4-cache-hit") {
                              self.set_property(vec!["cache", "hit"], Some(cache_hit.as_bytes()));
                          }
                          
                          // Remove headers from response (internal metrics, not for clients)
                          self.set_http_response_header("x-f4-pool-wait-ms", None);
                          self.set_http_response_header("x-f4-pool-reused", None);
                          self.set_http_response_header("x-f4-redis-endpoint", None);
                          
                          Action::Continue
                      }
                  }

---

# =============================================================================
# Approach 2: Istio Telemetry API (simpler alternative, requires Istio 1.18+)
# =============================================================================

apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: f4-pool-tracing-telemetry
  namespace: terrafusion-staging
spec:
  selector:
    matchLabels:
      app: f4-cache
  tracing:
  - providers:
    - name: jaeger
    customTags:
      # Extract from F4 response headers
      pool.wait_ms:
        header:
          name: x-f4-pool-wait-ms
          defaultValue: "0"
      pool.connection_reused:
        header:
          name: x-f4-pool-reused
          defaultValue: "false"
      redis.endpoint:
        header:
          name: x-f4-redis-endpoint
          defaultValue: "unknown"
      cache.hit:
        header:
          name: x-f4-cache-hit
          defaultValue: "false"

---

# =============================================================================
# Saved Jaeger Queries (import via Jaeger UI → Search → Save)
# =============================================================================

# Query 1: F4 requests with high pool wait (> 50ms)
# - Service: f4-cache
# - Tags: pool.wait_ms > 50
# - Lookback: 1h
# - Order: Duration (Descending)
# - Use Case: Diagnose pool saturation incidents

# Query 2: F4 requests with new connections (not reused)
# - Service: f4-cache
# - Tags: pool.connection_reused = false
# - Lookback: 1h
# - Order: Time (Recent First)
# - Use Case: Identify connection churn (HPA scaling events)

# Query 3: F4 requests during Redis Sentinel failover
# - Service: f4-cache
# - Tags: redis.endpoint CONTAINS "follower"
# - Lookback: 1h
# - Order: Time (Recent First)
# - Use Case: Validate failover resilience (no error spikes)

# Query 4: F4 cache misses with high pool wait
# - Service: f4-cache
# - Tags: cache.hit = false AND pool.wait_ms > 30
# - Lookback: 1h
# - Order: Duration (Descending)
# - Use Case: Double-latency hit (cache miss + pool wait)

# Query 5: F4 pool wait percentiles
# - Service: f4-cache
# - Operation: GET /api/parcel/:apn
# - Group By: pool.wait_ms (histogram buckets: 0-10, 10-30, 30-50, 50-100, 100+)
# - Lookback: 24h
# - Use Case: Baseline vs Day 9 improvement

# Query 6: F4 pool saturation correlation
# - Service: f4-cache
# - Tags: pool.wait_ms > 100 (severe saturation)
# - Fields: pool.connection_reused, redis.endpoint, cache.hit
# - Lookback: 1h
# - Use Case: Root cause analysis (e.g., stuck on follower, HPA lag)

