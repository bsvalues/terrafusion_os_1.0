# =============================================================================
# Application Code: F4 Cache Instrumentation (Python example)
# =============================================================================

# File: src/services/f4-cache/cache_handler.py
#
# This is the application-side instrumentation that injects custom headers
# for Istio/Jaeger to propagate into trace spans.
#
# NOTE: This code is ALREADY implemented in TerraFusion F4 cache service.
#       The YAML above (EnvoyFilter/Telemetry) extracts these headers.

import time
import redis.sentinel
from flask import request, g

# Redis Sentinel connection pool (configured per ops/cache/f4-redis-pool.yaml)
sentinel = redis.sentinel.Sentinel(
    [('redis-sentinel-1', 26379),
     ('redis-sentinel-2', 26379),
     ('redis-sentinel-3', 26379)],
    socket_timeout=0.5,
    sentinel_kwargs={'socket_connect_timeout': 0.5}
)

# Connection pool (Day 9 optimization: maxsize=50, max_overflow=10)
redis_pool = sentinel.master_for(
    'terrafusion-redis',
    socket_timeout=1.0,
    connection_pool_kwargs={
        'max_connections': 50,
        'socket_connect_timeout': 0.5,
        'retry_on_timeout': True
    }
)

@app.route('/api/parcel/<apn>', methods=['GET'])
def get_parcel_cached(apn: str):
    """
    F4 cache GET handler with pool wait instrumentation.
    """
    pool_wait_start = time.perf_counter()
    
    # Get connection from pool (may block if pool saturated)
    redis_conn = redis_pool.connection_pool.get_connection('GET')
    
    pool_wait_ms = (time.perf_counter() - pool_wait_start) * 1000
    pool_reused = hasattr(redis_conn, '_connection_reused') and redis_conn._connection_reused
    redis_endpoint = f"{redis_conn.host}:{redis_conn.port}"
    
    # Execute cache lookup
    cache_key = f"parcel:{apn}"
    cached_value = redis_conn.get(cache_key)
    cache_hit = (cached_value is not None)
    
    # Release connection back to pool
    redis_pool.connection_pool.release(redis_conn)
    
    # Inject custom headers (for Istio EnvoyFilter to extract)
    g.pool_wait_ms = pool_wait_ms
    g.pool_reused = pool_reused
    g.redis_endpoint = redis_endpoint
    g.cache_hit = cache_hit
    
    @after_this_request
    def inject_pool_headers(response):
        response.headers['X-F4-Pool-Wait-Ms'] = str(int(g.pool_wait_ms))
        response.headers['X-F4-Pool-Reused'] = str(g.pool_reused).lower()
        response.headers['X-F4-Redis-Endpoint'] = g.redis_endpoint
        response.headers['X-F4-Cache-Hit'] = str(g.cache_hit).lower()
        return response
    
    if cache_hit:
        return {"apn": apn, "data": cached_value, "source": "cache"}, 200
    else:
        # Cache miss: fetch from F2 parcel processor
        parcel_data = fetch_from_f2_processor(apn)
        redis_conn.setex(cache_key, 3600, parcel_data)  # Cache for 1h
        return {"apn": apn, "data": parcel_data, "source": "processor"}, 200

