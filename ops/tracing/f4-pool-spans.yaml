# =============================================================================
# CLI Example: Query Jaeger for F4 pool wait duration
# =============================================================================

# 1. Get all F4 traces with pool wait > 50ms (last 1h)
curl -s 'http://jaeger-query.terrafusion-monitoring:16686/api/traces?service=f4-cache&tags=%7B%22pool.wait_ms%22%3A%22%3E50%22%7D&limit=100&lookback=1h' \
  | jq '.data[].spans[] | select(.operationName == "GET /api/parcel/:apn") | {
      traceId: .traceID,
      duration_ms: (.duration / 1000),
      pool_wait_ms: (.tags[] | select(.key == "pool.wait_ms") | .value),
      pool_reused: (.tags[] | select(.key == "pool.connection_reused") | .value),
      redis_endpoint: (.tags[] | select(.key == "redis.endpoint") | .value),
      cache_hit: (.tags[] | select(.key == "cache.hit") | .value)
    }'

# 2. Calculate average pool wait for cache hits vs misses
curl -s 'http://jaeger-query.terrafusion-monitoring:16686/api/traces?service=f4-cache&lookback=24h&limit=1000' \
  | jq '.data[].spans[] 
      | select(.operationName == "GET /api/parcel/:apn") 
      | {
          cache_hit: (.tags[] | select(.key == "cache.hit") | .value),
          pool_wait_ms: (.tags[] | select(.key == "pool.wait_ms") | .value | tonumber)
        }' \
  | jq -s 'group_by(.cache_hit) 
      | map({
          cache_hit: .[0].cache_hit,
          avg_pool_wait_ms: (map(.pool_wait_ms) | add / length),
          count: length
        })'

# Output example:
# [
#   {
#     "cache_hit": "false",
#     "avg_pool_wait_ms": 67.3,
#     "count": 142
#   },
#   {
#     "cache_hit": "true",
#     "avg_pool_wait_ms": 12.1,
#     "count": 1858
#   }
# ]

# 3. Detect pool saturation events (pool wait > 100ms sustained)
curl -s 'http://prometheus.terrafusion-monitoring:9090/api/v1/query' \
  --data-urlencode 'query=count_over_time((histogram_quantile(0.95, rate(istio_request_duration_milliseconds_bucket{app="f4-cache"}[1m])) > 100)[10m:1m]) > 5' \
  | jq -r '.data.result[] | "Pool saturation event detected at \(.value[0] | strftime("%Y-%m-%d %H:%M:%S"))"'

