# =============================================================================
# Integration with RI Calculator (ops/monitoring/ri-calculator.py)
# =============================================================================

# The RI calculator already queries terrafusion:f4:pool_saturation_pct from
# recording rules (ops/monitoring/ri-recording-rules.yaml). This tracing config
# provides the DEEP DIVE capability when pool saturation is detected:
#
# Decision Tree:
#   1. RI calculator detects F4 RI drop (0.9320 → 0.9100)
#   2. Check pool saturation metric: 88% (above 85% target)
#   3. Query Jaeger for traces with pool.wait_ms > 50 (last 5min)
#   4. Group by redis.endpoint: 70% to follower (Sentinel failover?)
#   5. Root cause: Redis leader died, clients queuing on follower connections
#   6. Mitigation: HPA scales 3→5 pods, pool saturation drops to 62%

# This closed-loop diagnostic is what MIT/PhD systems engineers mean by
# "observability as a first-class system primitive" (not just metrics).

