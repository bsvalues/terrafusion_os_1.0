# RabbitMQ Configuration for TerraFusion OS
# Government-grade messaging configuration

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Clustering
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq

# Memory and disk thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 2GB

# Message TTL and persistence
default_vhost = /terrafusion
default_user = terrafusion
default_pass = tfpassword123
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# High availability
ha-mode = all
ha-sync-mode = automatic

# Performance tuning for 50,000+ agents
channel_max = 2048
connection_max = 10000
heartbeat = 600

# Government compliance
auth_backends.1 = internal
reverse_dns_lookups = false

# Logging
log.console = true
log.console.level = info
log.file = false

# TLS (disabled for internal development)
ssl_options = none