[package]
name = "terrafusion-county-demo-system"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion Team <team@terrafusion.io>"]
description = "Advanced county data scraping and demo generation system for TerraFusion"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

[dev-dependencies]
tokio-test = "0.4"

