apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terrafusion-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: terrafusion-api
    app.kubernetes.io/instance: terrafusion
    app.kubernetes.io/part-of: terrafusion-os
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: argocd
spec:
  project: terrafusion
  source:
    repoURL: https://github.com/terrafusion/terrafusion-os
    targetRevision: HEAD
    path: devops/helm/terrafusion-api
    helm:
      values: |
        replicaCount: 3
        image:
          repository: ghcr.io/terrafusion/terrafusion-os/api
          tag: "{{.Values.imageTag}}"
        resources:
          limits:
            cpu: 2000m
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 1Gi
        autoscaling:
          enabled: true
          minReplicas: 3
          maxReplicas: 10
        env:
          - name: ASPNETCORE_ENVIRONMENT
            value: "Production"
          - name: ASPNETCORE_URLS
            value: "http://+:${TF_API_PORT:-5046}"
        ingress:
          enabled: true
          hosts:
            - host: api.terrafusion.ai
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: terrafusion
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  syncWindow:
    - kind: allow
      schedule: "0 0 * * *"
      duration: 1h
      applications:
        - terrafusion-api


