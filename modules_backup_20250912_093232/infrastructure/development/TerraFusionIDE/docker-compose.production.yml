# TerraFusion IDE - Production Docker Compose Configuration
# Government-Grade Multi-Service Architecture
# Version: 2.0.0 Production Ready

version: '3.8'

services:
  # TerraFusion Backend API - .NET 8.0 Core
  terrafusion-backend:
    image: terrafusion/backend:2.0.0
    container_name: terrafusion-backend-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5000:${TF_API_PORT:-5046}"
      - "5001:5001"
    environment:
      # Core Configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:5001;http://+:${TF_API_PORT:-5046}
      - DOTNET_ENVIRONMENT=Production
      
      # TerraFusion Specific
      - TERRAFUSION_VARIANT=enterprise
      - AI_SWARM_SIZE=1008
      - QUANTUM_OPTIMIZATION=enabled
      - HARRIS_PACS_VERSION=12.4.7
      - BENTON_COUNTY_MODE=true
      - GOVERNMENT_TRANSCENDED=true
      
      # Database Configuration
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=terrafusion_production;Username=terrafusion;Password_File=/run/secrets/db_password
      - ConnectionStrings__Redis=redis:6379
      
      # AI Provider Configuration
      - OLLAMA_ENDPOINT=http://ollama:11434
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
      
      # Security Configuration
      - SECURITY_CLASSIFICATION_ENABLED=true
      - GOVERNMENT_COMPLIANCE_LEVEL=FISMA_GRADE_A
      - AUDIT_LOGGING=COMPREHENSIVE
      - ENCRYPTION_STANDARD=AES256_GOVERNMENT
      
      # Performance Configuration
      - DOTNET_GCServer=1
      - DOTNET_GCConcurrent=1
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=6
      
    volumes:
      - terrafusion_data:/app/data
      - terrafusion_logs:/app/logs
      - terrafusion_uploads:/app/uploads
      - ./ssl:/app/ssl:ro
    secrets:
      - db_password
      - openai_api_key
      - anthropic_api_key
      - jwt_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:\${{TF_API_HTTPS_PORT:-5001}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        
  # TerraFusion IDE Frontend - React 18
  terrafusion-ide:
    image: terrafusion/ide:2.0.0
    container_name: terrafusion-ide-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5173:${TF_DEV_VITE_PORT:-3102}"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://terrafusion-backend:5001
      - VITE_APP_ENV=production
      - VITE_TERRAFUSION_VARIANT=enterprise
      - VITE_AI_SWARM_SIZE=1008
      - VITE_COUNTY_NAME=BENTON
      - VITE_COUNTY_STATE=WASHINGTON
      - VITE_GOVERNMENT_MODE=true
    volumes:
      - terrafusion_ide_data:/app/data
    depends_on:
      terrafusion-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_API_HTTPS_PORT:-5001}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
          
  # PostgreSQL 15 - Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terrafusion_production
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./database/backup:/backup
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion -d terrafusion_production"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      
  # Redis 7 - Caching and Session Storage
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
          
  # Ollama - Local AI Processing for RED Classification
  ollama:
    image: ollama/ollama:latest
    container_name: terrafusion-ollama-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '8'
        reservations:
          memory: 8G
          cpus: '4'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_API_HTTPS_PORT:-5001}}/api/tags"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      
  # Nginx - Reverse Proxy and SSL Termination
  nginx:
    image: nginx:alpine
    container_name: terrafusion-nginx-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - terrafusion-backend
      - terrafusion-ide
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'
          
  # Prometheus - Monitoring and Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:\${{TF_API_HTTPS_PORT:-5001}}/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
        reservations:
          memory: 1G
          cpus: '0.5'
          
  # Grafana - Dashboards and Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana-prod
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_admin_password
      - GF_SERVER_ROOT_URL=https://monitoring.terrafusion.gov
      - GF_SECURITY_SECRET_KEY_FILE=/run/secrets/grafana_secret_key
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_ALERTING_ENABLED=true
      - GF_ALERTING_EXECUTE_ALERTS=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    secrets:
      - grafana_admin_password
      - grafana_secret_key
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:\${{TF_API_HTTPS_PORT:-5001}}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'

# Volumes for persistent data
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/postgres
      
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/redis
      
  ollama_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/ollama
      
  terrafusion_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/data/app
      
  terrafusion_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/logs
      
  terrafusion_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/terrafusion/uploads
      
  terrafusion_ide_data:
    driver: local
    
  prometheus_data:
    driver: local
    
  grafana_data:
    driver: local
    
  nginx_logs:
    driver: local

# Networks
networks:
  terrafusion-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: terrafusion-bridge
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500

# Secrets for sensitive data
secrets:
  db_password:
    file: ./secrets/db_password.txt
    
  openai_api_key:
    file: ./secrets/openai_api_key.txt
    
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
    
  jwt_secret:
    file: ./secrets/jwt_secret.txt
    
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
    
  grafana_secret_key:
    file: ./secrets/grafana_secret_key.txt