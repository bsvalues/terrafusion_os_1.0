version: '3.8'

services:
  levy-backend:
    build: .
    container_name: terra-levy-backend
    ports:
      - "5001:${TF_API_PORT:-5046}"  # Use port \${{TF_API_HTTPS_PORT:-5001}} to avoid conflicts with main TerraFusion API
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/levy_db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - levy-network

  postgres:
    image: postgres:15
    container_name: terra-levy-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=levy_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Use non-default port to avoid conflicts
    restart: unless-stopped
    networks:
      - levy-network

  redis:
    image: redis:7-alpine
    container_name: terra-levy-redis
    ports:
      - "6380:6379"  # Use non-default port to avoid conflicts
    restart: unless-stopped
    networks:
      - levy-network

volumes:
  postgres_data:

networks:
  levy-network:
    driver: bridge