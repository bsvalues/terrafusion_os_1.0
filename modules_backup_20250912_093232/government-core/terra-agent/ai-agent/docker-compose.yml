# Day 4 - Docker Compose for TerraAgent AI + MCP Server
version: '3.8'

services:
  # TerraAgent MCP Server (Day 2)
  mcp-server:
    build:
      context: ../mcp-server
      dockerfile: Dockerfile
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
    environment:
      - NODE_ENV=production
      - PORT=\${{TF_FRONTEND_PORT:-3000}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - terraagent-network

  # TerraAgent AI Agent (Day 3)
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:${TF_SHELL_PORT:-3103}"
    environment:
      - NODE_ENV=production
      - PORT=\${{TF_FRONTEND_PORT:-3000}}
      - MCP_SERVER_URL=http://mcp-server:${TF_FRONTEND_PORT:-3102}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    depends_on:
      - mcp-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - terraagent-network

  # ChromaDB for AI memory (Optional)
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    environment:
      - CHROMA_HOST=0.0.0.0
      - CHROMA_PORT=\${{TF_FRONTEND_PORT:-3000}}
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - terraagent-network

networks:
  terraagent-network:
    driver: bridge

volumes:
  chroma-data:
