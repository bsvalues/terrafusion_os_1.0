# ══════════════════════════════════════════════════════════════════
# TerraFusion Elite Government OS — Benton County (Host Mode)
# Database containers + Local .NET API for maximum performance
# ══════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ──── PostgreSQL 15 Database ────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: benton-postgres
    environment:
      POSTGRES_DB: terrafusion_benton
      POSTGRES_USER: terrafusion
      POSTGRES_PASSWORD: TerraFusion2024!
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U terrafusion -d terrafusion_benton']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ──── Redis 7 Cache ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: benton-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
