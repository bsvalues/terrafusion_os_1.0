
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grfe
spec:
  replicas: 2
  selector:
    matchLabels: { app: grfe }
  template:
    metadata:
      labels: { app: grfe }
    spec:
      containers:
        - name: grfe
          image: terrafusion/grfe:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef: { name: grfe-config, key: RUST_LOG }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
