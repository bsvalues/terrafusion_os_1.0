# SPIRE Server Configuration for TerraFusion Trust Fabric

server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    socket_path = "/spire-server/spire-server.sock"
    trust_domain = "terrafusion.local"
    data_dir = "/opt/spire/data"
    log_level = "INFO"
    ca_subject = {
        country = ["US"],
        organization = ["TerraFusion OS"],
        common_name = "TerraFusion Trust Domain",
    }
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "postgres"
            connection_string = "postgresql://spire:${SPIRE_DB_PASSWORD}@postgres:5432/spire"
        }
    }

    NodeAttestor "docker" {
        plugin_data {
            docker_socket_path = "/var/run/docker.sock"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys"
        }
    }

    Notifier "k8sbundle" {
        plugin_data {
            namespace = "spire"
            config_map = "trust-bundle"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "0.0.0.0"
    bind_port = "8080"
    live_path = "/live"
    ready_path = "/ready"
}
