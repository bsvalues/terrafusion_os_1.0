# Layer 1: Infrastructure - Docker Compose Production Configuration
# Handles process management, resource allocation, health checks, and restarts

version: '3.9'

services:
  # TerraFusion Backend API
  terrafusion-backend:
    image: terrafusion/backend:${VERSION:-latest}
    container_name: tf-backend
    deploy:
      replicas: 3
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "8080:${TF_STATIC_PORT:-8080}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:\${{TF_ADMIN_PORT:-8080}}
      - DATABASE_URL=postgresql://tf_user:${DB_PASSWORD}@postgres:5432/terrafusion
      - REDIS_URL=redis://redis:6379
      - CONSUL_URL=http://consul:8500
      - VAULT_URL=http://vault:8200
      - SPIRE_SOCKET_PATH=/spire/agent.sock
    volumes:
      - spire-agent-socket:/spire
      - app-logs:/app/logs
    networks:
      - terrafusion-mesh
      - database-net
    configs:
      - source: backend-config
        target: /app/appsettings.Production.json
    secrets:
      - db-password
      - api-keys
      - jwt-secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TerraFusion Frontend
  terrafusion-frontend:
    image: terrafusion/frontend:${VERSION:-latest}
    container_name: tf-frontend
    deploy:
      replicas: 2
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://terrafusion-backend:${TF_STATIC_PORT:-8080}
      - CONSUL_URL=http://consul:8500
    volumes:
      - spire-agent-socket:/spire
    networks:
      - terrafusion-mesh
    depends_on:
      terrafusion-backend:
        condition: service_healthy
      consul:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: tf-postgres
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf_user -d terrafusion"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terrafusion
      - POSTGRES_USER=tf_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - database-net
    secrets:
      - db-password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: tf-redis
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - terrafusion-mesh
      - database-net
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# Layer 2: Service Mesh - Consul for Service Discovery
  consul:
    image: consul:1.16.1
    container_name: tf-consul
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
    volumes:
      - consul-data:/consul/data
      - consul-config:/consul/config:ro
    networks:
      - terrafusion-mesh
    command: >
      consul agent -server -bootstrap-expect=1 -ui -bind=0.0.0.0 -client=0.0.0.0
      -retry-join=consul -datacenter=terrafusion-dc
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# Layer 3: Trust Fabric - SPIRE Server (Identity & Attestation)
  spire-server:
    image: spiffe/spire-server:1.8.0
    container_name: tf-spire-server
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8081:8081"
    volumes:
      - spire-server-data:/opt/spire/data
      - spire-server-config:/opt/spire/conf:ro
      - spire-server-socket:/spire-server
    networks:
      - terrafusion-mesh
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # SPIRE Agent for Workload Identity
  spire-agent:
    image: spiffe/spire-agent:1.8.0
    container_name: tf-spire-agent
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/spire
      - spire-agent-config:/opt/spire/conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - terrafusion-mesh
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # HashiCorp Vault for Secrets Management
  vault:
    image: vault:1.15.0
    container_name: tf-vault
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_ROOT_TOKEN}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:\${{TF_ADMIN_PORT:-8080}}
    volumes:
      - vault-data:/vault/data
      - vault-config:/vault/config:ro
    networks:
      - terrafusion-mesh
    cap_add:
      - IPC_LOCK
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# Trust Fabric Attestation Service (Pure Cryptographic Focus)
  trust-fabric:
    image: terrafusion/trust-fabric:${VERSION:-latest}
    container_name: tf-trust-fabric
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "7000:7000"
    environment:
      - FABRIC_MODE=attestation_only
      - SPIRE_SOCKET_PATH=/spire/agent.sock
      - CONSUL_URL=http://consul:8500
      - VAULT_URL=http://vault:8200
    volumes:
      - spire-agent-socket:/spire
      - trust-fabric-data:/app/data
    networks:
      - terrafusion-mesh
    depends_on:
      spire-agent:
        condition: service_started
      consul:
        condition: service_healthy
      vault:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: tf-prometheus
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - prometheus-config:/etc/prometheus:ro
    networks:
      - terrafusion-mesh
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# Volumes for persistent data
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  consul-data:
    driver: local
  consul-config:
    driver: local
  spire-server-data:
    driver: local
  spire-server-config:
    driver: local
  spire-server-socket:
    driver: local
  spire-agent-socket:
    driver: local
  spire-agent-config:
    driver: local
  vault-data:
    driver: local
  vault-config:
    driver: local
  trust-fabric-data:
    driver: local
  prometheus-data:
    driver: local
  prometheus-config:
    driver: local
  app-logs:
    driver: local

# Networks with proper isolation
networks:
  terrafusion-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "com.terrafusion.network=mesh"
  database-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/16
    labels:
      - "com.terrafusion.network=database"

# Configuration files
configs:
  backend-config:
    file: ./config/backend.prod.json
  consul-config:
    file: ./config/consul.json
  prometheus-config:
    file: ./config/prometheus.yml

# Secrets (loaded from external secret management)
secrets:
  db-password:
    external: true
  api-keys:
    external: true
  jwt-secret:
    external: true
