{% extends "base.html" %}

{% block title %}Add New Property - TerraFusionBuild{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8 mx-auto">
        <h1><i class="fas fa-plus me-2"></i>Add New Property</h1>
        <p class="text-muted">Enter property details for Marshall & Swift cost calculation</p>

        <form method="POST" class="tf-card p-4">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="property_id" class="form-label">Property ID</label>
                        <input type="text" class="form-control" id="property_id" name="property_id" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="building_type" class="form-label">Building Type</label>
                        <select class="form-control" id="building_type" name="building_type" required>
                            <option value="">Select Type</option>
                            <option value="RES">Residential</option>
                            <option value="COM">Commercial</option>
                            <option value="IND">Industrial</option>
                            <option value="AGR">Agricultural</option>
                            <option value="MUL">Multi-Unit</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" required>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="zip_code" class="form-label">ZIP Code</label>
                        <input type="text" class="form-control" id="zip_code" name="zip_code" required>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="square_footage" class="form-label">Square Footage</label>
                        <input type="number" class="form-control" id="square_footage" name="square_footage" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="year_built" class="form-label">Year Built</label>
                        <input type="number" class="form-control" id="year_built" name="year_built" min="1800"
                            max="2025">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="region" class="form-label">Region</label>
                        <select class="form-control" id="region" name="region" required>
                            <option value="">Select Region</option>
                            <option value="BC-NORTH">Benton County North</option>
                            <option value="BC-CENTRAL">Benton County Central</option>
                            <option value="BC-SOUTH">Benton County South</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="quality" class="form-label">Quality Level</label>
                        <select class="form-control" id="quality" name="quality" required>
                            <option value="">Select Quality</option>
                            <option value="ECONOMY">Economy</option>
                            <option value="STANDARD">Standard</option>
                            <option value="CUSTOM">Custom</option>
                            <option value="LUXURY">Luxury</option>
                            <option value="PREMIUM">Premium</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label for="condition_rating" class="form-label">Condition</label>
                        <select class="form-control" id="condition_rating" name="condition_rating" required>
                            <option value="">Select Condition</option>
                            <option value="POOR">Poor</option>
                            <option value="FAIR">Fair</option>
                            <option value="AVERAGE">Average</option>
                            <option value="GOOD">Good</option>
                            <option value="EXCELLENT">Excellent</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="complexity" class="form-label">Complexity</label>
                <select class="form-control" id="complexity" name="complexity">
                    <option value="SIMPLE">Simple</option>
                    <option value="STANDARD" selected>Standard</option>
                    <option value="MODERATE">Moderate</option>
                    <option value="COMPLEX">Complex</option>
                </select>
            </div>

            <div class="d-flex justify-content-between">
                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Add Property & Calculate Cost
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
