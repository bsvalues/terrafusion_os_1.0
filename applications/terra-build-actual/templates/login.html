{% extends "base.html" %}

{% block title %}Login - TerraFusionBuild{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="tf-card p-4">
            <div class="text-center mb-4">
                <h2><i class="fas fa-calculator me-2"></i>TerraFusionBuild</h2>
                <p class="text-muted">Marshall & Swift Replacement System</p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Login
                    </button>
                </div>
            </form>

            <hr>

            <div class="text-center">
                <small class="text-muted">
                    Default Admin: <strong>admin</strong> / <strong>admin123</strong>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
