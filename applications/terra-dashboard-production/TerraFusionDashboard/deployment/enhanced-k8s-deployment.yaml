apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion
  labels:
    name: terrafusion
    environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-secrets
  namespace: terrafusion
type: Opaque
data:
  postgres-password: dGVycmFmdXNpb25fcGFzcw==
  jwt-secret: dGVycmFmdXNpb25fanNvbl93ZWJfdG9rZW4=
  openai-api-key: eW91cl9vcGVuYWlfYXBpX2tleQ==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terrafusion-config
  namespace: terrafusion
data:
  NODE_ENV: 'production'
  DATABASE_URL: 'postgresql://terrafusion:terrafusion_pass@postgres-service:5432/terrafusion'
  REDIS_URL: 'redis://redis-service:6379/0'
  API_RATE_LIMIT: '1000'
  LOG_LEVEL: 'INFO'
  ENABLE_MONITORING: 'true'
  ENABLE_WEBSOCKETS: 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-app
  namespace: terrafusion
  labels:
    app: terrafusion-app
    version: '2.0.0'
spec:
  replicas: 3
  selector:
    matchLabels:
      app: terrafusion-app
  template:
    metadata:
      labels:
        app: terrafusion-app
        version: '2.0.0'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '5000'
        prometheus.io/path: '/metrics'
    spec:
      containers:
        - name: terrafusion-app
          image: terrafusion/app:2.0.0
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: NODE_ENV
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: terrafusion-config
                  key: DATABASE_URL
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: jwt-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: openai-api-key
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '2Gi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /api/system/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/system/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-service
  namespace: terrafusion
  labels:
    app: terrafusion-app
spec:
  selector:
    app: terrafusion-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: terrafusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: 'terrafusion'
            - name: POSTGRES_USER
              value: 'terrafusion'
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - terrafusion
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - terrafusion
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: terrafusion
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: terrafusion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: terrafusion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: '128Mi'
              cpu: '50m'
            limits:
              memory: '512Mi'
              cpu: '200m'
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: terrafusion
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: terrafusion-hpa
  namespace: terrafusion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: terrafusion-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  namespace: terrafusion
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/websocket-services: 'terrafusion-service'
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '86400'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '86400'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '86400'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  tls:
    - hosts:
        - terrafusion.gov
        - api.terrafusion.gov
      secretName: terrafusion-tls
  rules:
    - host: terrafusion.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-service
                port:
                  number: 80
    - host: api.terrafusion.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-service
                port:
                  number: 80
---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: terrafusion-metrics
  namespace: terrafusion
spec:
  selector:
    matchLabels:
      app: terrafusion-app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: terrafusion-pdb
  namespace: terrafusion
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: terrafusion-app
