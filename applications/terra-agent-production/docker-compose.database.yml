# 🏛️ TerraFusion Elite PostgreSQL Database
# Championship-Level Government Database with FISMA-HIGH Security
# County Data Sovereignty + Government-Grade Performance

version: '3.8'

networks:
  terrafusion-government:
    driver: bridge
    encrypted: true
    labels:
      - "classification=government"
      - "compliance=fisma-high"
      - "security=championship"

volumes:
  terrafusion-postgres-data:
    driver: local
    labels:
      - "classification=government-data"
      - "encryption=aes-256"
      - "retention=7-years"
  terrafusion-postgres-logs:
    driver: local
    labels:
      - "type=audit-logs"
      - "retention=7-years"

services:
  # 🏛️ Elite PostgreSQL Database
  terrafusion-postgres:
    image: postgres:15-alpine
    container_name: terrafusion-elite-postgres
    restart: always

    # Government-Grade Security Configuration
    environment:
      POSTGRES_DB: terrafusion_government
      POSTGRES_USER: terrafusion_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TerraFusion_Elite_2025!}
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      PGDATA: /var/lib/postgresql/data/pgdata

      # Security Environment Variables
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_SSL_MODE: require

    # Elite Port Configuration
    ports:
      - "5432:5432"

    # Government-Grade Volume Mapping
    volumes:
      - terrafusion-postgres-data:/var/lib/postgresql/data
      - terrafusion-postgres-logs:/var/log/postgresql
      - ./terrafusion_elite_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./postgres-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres-config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

    # FISMA-HIGH Security Configuration
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/server.crt
      -c ssl_key_file=/etc/ssl/private/server.key
      -c ssl_ca_file=/etc/ssl/certs/ca.crt
      -c log_destination=stderr
      -c log_statement=all
      -c log_duration=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_hostname=on
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

    # Government Security Labels
    labels:
      - "classification=government"
      - "compliance=fisma-high"
      - "security=championship"
      - "data-sovereignty=county-isolated"
      - "audit-retention=7-years"
      - "encryption=aes-256-gcm"

    # Health Check for Government Operations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion_admin -d terrafusion_government"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Security and Resource Limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    # Network Configuration
    networks:
      - terrafusion-government

    # Security Options
    security_opt:
      - no-new-privileges:true

    # User Mapping for Security
    user: "999:999"

    # Read-only root filesystem for security
    read_only: false
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # 🔍 Government Database Monitoring
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: terrafusion-postgres-monitor
    restart: always

    environment:
      DATA_SOURCE_NAME: "postgresql://terrafusion_admin:${POSTGRES_PASSWORD:-TerraFusion_Elite_2025!}@terrafusion-postgres:5432/terrafusion_government?sslmode=require"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"

    ports:
      - "9187:9187"

    volumes:
      - ./monitoring/postgres-queries.yaml:/etc/postgres_exporter/queries.yaml:ro

    depends_on:
      terrafusion-postgres:
        condition: service_healthy

    networks:
      - terrafusion-government

    labels:
      - "classification=monitoring"
      - "compliance=fisma-high"
      - "purpose=database-monitoring"

  # 🛡️ Government Database Backup Service
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: terrafusion-postgres-backup
    restart: always

    environment:
      POSTGRES_HOST: terrafusion-postgres
      POSTGRES_DB: terrafusion_government
      POSTGRES_USER: terrafusion_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TerraFusion_Elite_2025!}
      POSTGRES_EXTRA_OPTS: "--schema-only --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 2555  # 7 years retention
      BACKUP_KEEP_WEEKS: 365  # 7 years weekly
      BACKUP_KEEP_MONTHS: 84  # 7 years monthly
      HEALTHCHECK_PORT: 8080

    volumes:
      - ./backups:/backups

    depends_on:
      terrafusion-postgres:
        condition: service_healthy

    networks:
      - terrafusion-government

    labels:
      - "classification=backup"
      - "compliance=fisma-high"
      - "retention=7-years"
      - "purpose=government-backup"

  # 🔐 Government SSL Certificate Manager
  ssl-cert-generator:
    image: alpine:latest
    container_name: terrafusion-ssl-generator
    restart: "no"

    volumes:
      - ./ssl-certs:/ssl-output

    command: |
      sh -c "
        apk add --no-cache openssl &&
        mkdir -p /ssl-output &&
        openssl req -x509 -nodes -days 3650 -newkey rsa:4096
        -keyout /ssl-output/server.key
        -out /ssl-output/server.crt
        -subj '/C=US/ST=WA/L=Richland/O=TerraFusion Government/CN=terrafusion-postgres' &&
        chmod 600 /ssl-output/server.key &&
        chmod 644 /ssl-output/server.crt &&
        echo 'Government-grade SSL certificates generated successfully'
      "

    labels:
      - "classification=security"
      - "purpose=ssl-generation"
      - "compliance=fisma-high"
