<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion OS - {{PAGE_TITLE}}</title>
    <style>
        /* TerraFusion OS Official Brand Implementation */
        /* Brand Essence: "Government. Transcended." */
        /* Official Colors: Primary #0099ff, Accent #00ffaa, Transcend #00ffee */
        /* Brand Microcopy: "We do it right the first time." */
        
        :root {
            /* Official TerraFusion Brand Colors from tf-brand-config.json */
            --tf-primary: #0099ff;
            --tf-primary-dark: #0077cc;
            --tf-primary-light: #33aaff;
            
            --tf-accent: #00ffaa;
            --tf-accent-dark: #00cc88;
            --tf-accent-light: #33ffbb;
            
            --tf-transcend: #00ffee;
            --tf-transcend-dark: #00ccbb;
            --tf-transcend-light: #33ffff;
            
            /* Foundation Colors */
            --tf-dark: #0b1020;
            --tf-dark-lighter: #1a1f3a;
            --tf-dark-medium: #2d3561;
            
            --tf-light: #ffffff;
            --tf-gray: #888888;
            --tf-gray-light: #cccccc;
            --tf-gray-dark: #444444;
            
            /* Status Colors */
            --tf-success: #00ff88;
            --tf-error: #ff3333;
            --tf-warning: #ffaa00;
            --tf-info: #3399ff;
            
            /* Content Colors */
            --tf-clarity: #e0f7ff;
            --tf-content: #f0f4f8;
            
            /* Gradients */
            --tf-gradient-primary: linear-gradient(135deg, var(--tf-primary), var(--tf-primary-dark));
            --tf-gradient-accent: linear-gradient(135deg, var(--tf-accent), var(--tf-accent-dark));
            --tf-gradient-transcend: linear-gradient(135deg, var(--tf-transcend), var(--tf-primary));
            --tf-gradient-dark: linear-gradient(135deg, var(--tf-dark), var(--tf-dark-lighter));
            
            /* Shadows */
            --tf-shadow-primary: 0 4px 20px rgba(0, 153, 255, 0.3);
            --tf-shadow-accent: 0 4px 20px rgba(0, 255, 170, 0.3);
            --tf-shadow-transcend: 0 4px 20px rgba(0, 255, 238, 0.3);
            
            /* Typography */
            --tf-font-primary: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --tf-font-mono: 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--tf-gradient-dark);
            color: var(--tf-light);
            font-family: var(--tf-font-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* TerraFusion Header Component */
        .tf-header {
            background: linear-gradient(90deg, var(--tf-dark), var(--tf-primary-dark));
            padding: 2rem;
            text-align: center;
            border-bottom: 3px solid var(--tf-transcend);
            box-shadow: var(--tf-shadow-transcend);
            position: relative;
            overflow: hidden;
        }

        .tf-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 238, 0.1), transparent);
            animation: tf-scan 4s infinite;
        }

        @keyframes tf-scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .tf-header h1 {
            color: var(--tf-transcend);
            font-size: clamp(2rem, 5vw, 3rem);
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 255, 238, 0.5);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .tf-header .tf-tagline {
            color: var(--tf-accent);
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            margin: 0.5rem 0 0 0;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .tf-header .tf-subtitle {
            color: var(--tf-gray-light);
            font-size: clamp(0.8rem, 2vw, 1rem);
            margin: 0.5rem 0 0 0;
            opacity: 0.8;
        }

        /* TerraFusion Container */
        .tf-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* TerraFusion Card Components */
        .tf-card {
            background: rgba(26, 31, 58, 0.8);
            border: 1px solid var(--tf-primary);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tf-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: var(--tf-gradient-transcend);
            transition: left 0.5s ease;
        }

        .tf-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--tf-shadow-primary);
            border-color: var(--tf-transcend);
        }

        .tf-card:hover::before {
            left: 0;
        }

        .tf-card-title {
            color: var(--tf-primary);
            font-size: 1.3rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .tf-card-content {
            color: var(--tf-light);
            font-size: 1rem;
            line-height: 1.5;
        }

        /* TerraFusion Button Components */
        .tf-button {
            background: var(--tf-gradient-primary);
            color: var(--tf-light);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tf-button:hover {
            background: var(--tf-gradient-transcend);
            transform: translateY(-2px);
            box-shadow: var(--tf-shadow-transcend);
        }

        .tf-button.tf-button-accent {
            background: var(--tf-gradient-accent);
        }

        .tf-button.tf-button-accent:hover {
            background: var(--tf-gradient-transcend);
        }

        .tf-button.tf-button-outline {
            background: transparent;
            border: 2px solid var(--tf-primary);
            color: var(--tf-primary);
        }

        .tf-button.tf-button-outline:hover {
            background: var(--tf-primary);
            color: var(--tf-light);
        }

        /* TerraFusion Status Indicators */
        .tf-status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tf-status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: tf-pulse 2s infinite;
        }

        @keyframes tf-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .tf-status.tf-status-healthy {
            background: rgba(0, 255, 136, 0.2);
            color: var(--tf-success);
            border: 1px solid var(--tf-success);
        }

        .tf-status.tf-status-healthy .tf-status-indicator {
            background: var(--tf-success);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .tf-status.tf-status-error {
            background: rgba(255, 51, 51, 0.2);
            color: var(--tf-error);
            border: 1px solid var(--tf-error);
        }

        .tf-status.tf-status-error .tf-status-indicator {
            background: var(--tf-error);
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .tf-status.tf-status-warning {
            background: rgba(255, 170, 0, 0.2);
            color: var(--tf-warning);
            border: 1px solid var(--tf-warning);
        }

        .tf-status.tf-status-warning .tf-status-indicator {
            background: var(--tf-warning);
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        /* TerraFusion Grid System */
        .tf-grid {
            display: grid;
            gap: 2rem;
        }

        .tf-grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .tf-grid-3 {
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .tf-grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        /* TerraFusion Code/Terminal */
        .tf-code {
            background: var(--tf-dark);
            border: 1px solid var(--tf-gray-dark);
            border-radius: 8px;
            padding: 1rem;
            font-family: var(--tf-font-mono);
            font-size: 0.9rem;
            color: var(--tf-clarity);
            overflow-x: auto;
            white-space: pre-wrap;
        }

        /* TerraFusion Footer */
        .tf-footer {
            text-align: center;
            margin-top: 3rem;
            padding: 2rem;
            border-top: 1px solid var(--tf-dark-medium);
            color: var(--tf-gray-light);
        }

        .tf-footer .tf-microcopy {
            font-style: italic;
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .tf-footer .tf-signature {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .tf-container {
                padding: 1rem;
            }
            
            .tf-grid {
                gap: 1rem;
            }
            
            .tf-grid-2,
            .tf-grid-3,
            .tf-grid-4 {
                grid-template-columns: 1fr;
            }
        }

        /* Utility Classes */
        .tf-text-center { text-align: center; }
        .tf-text-left { text-align: left; }
        .tf-text-right { text-align: right; }

        .tf-mb-1 { margin-bottom: 0.5rem; }
        .tf-mb-2 { margin-bottom: 1rem; }
        .tf-mb-3 { margin-bottom: 1.5rem; }
        .tf-mb-4 { margin-bottom: 2rem; }

        .tf-mt-1 { margin-top: 0.5rem; }
        .tf-mt-2 { margin-top: 1rem; }
        .tf-mt-3 { margin-top: 1.5rem; }
        .tf-mt-4 { margin-top: 2rem; }

        .tf-p-1 { padding: 0.5rem; }
        .tf-p-2 { padding: 1rem; }
        .tf-p-3 { padding: 1.5rem; }
        .tf-p-4 { padding: 2rem; }

        .tf-w-full { width: 100%; }
        .tf-h-full { height: 100%; }

        .tf-hidden { display: none; }
        .tf-block { display: block; }
        .tf-flex { display: flex; }
        .tf-grid { display: grid; }

        .tf-items-center { align-items: center; }
        .tf-justify-center { justify-content: center; }
        .tf-justify-between { justify-content: space-between; }

        .tf-gap-1 { gap: 0.5rem; }
        .tf-gap-2 { gap: 1rem; }
        .tf-gap-3 { gap: 1.5rem; }
        .tf-gap-4 { gap: 2rem; }
    </style>
</head>
<body>
    <!-- TerraFusion OS Standard Header -->
    <header class="tf-header">
        <h1>TerraFusion OS</h1>
        <p class="tf-tagline">Government. Transcended.</p>
        <p class="tf-subtitle">{{PAGE_SUBTITLE}}</p>
    </header>

    <!-- Main Content Container -->
    <div class="tf-container">
        {{MAIN_CONTENT}}
    </div>

    <!-- TerraFusion OS Standard Footer -->
    <footer class="tf-footer">
        <div class="tf-microcopy">
            "We do it right the first time." - Every action, every day: simplicity, mastery, and confidence.
        </div>
        <div class="tf-signature">
            TerraFusion OS 1.0 • Complete Government Operating System • Elite Rust Performance Engine
        </div>
    </footer>

    <!-- TerraFusion OS Environment Variables -->
    <script>
        // Official TerraFusion Environment Configuration
        window.TF_CONFIG = {
            API_PORT: (() => {
                try { 
                    return window.TF_API_PORT || 
                           (typeof process !== 'undefined' ? process.env.TF_API_PORT : null) || 
                           '5046'; 
                } catch { return '5046'; }
            })(),
            FRONTEND_PORT: (() => {
                try { 
                    return window.TF_FRONTEND_PORT || 
                           (typeof process !== 'undefined' ? process.env.TF_FRONTEND_PORT : null) || 
                           '3102'; 
                } catch { return '3102'; }
            })(),
            EXPLAIN_PORT: (() => {
                try { 
                    return window.TF_EXPLAIN_PORT || 
                           (typeof process !== 'undefined' ? process.env.TF_EXPLAIN_PORT : null) || 
                           '5047'; 
                } catch { return '5047'; }
            })(),
            DASHBOARD_PORT: (() => {
                try { 
                    return window.TF_DASHBOARD_PORT || 
                           (typeof process !== 'undefined' ? process.env.TF_DASHBOARD_PORT : null) || 
                           '9999'; 
                } catch { return '9999'; }
            })()
        };

        // TerraFusion Brand Utilities
        window.TF_UTILS = {
            // Format uptime display
            formatUptime: function(milliseconds) {
                if (!milliseconds) return 'Unknown';
                const seconds = Math.floor(milliseconds / 1000);
                const minutes = Math.floor(seconds / 60);
                const hours = Math.floor(minutes / 60);
                const days = Math.floor(hours / 24);
                
                if (days > 0) return `${days}d ${hours % 24}h ${minutes % 60}m`;
                if (hours > 0) return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
                if (minutes > 0) return `${minutes}m ${seconds % 60}s`;
                return `${seconds}s`;
            },
            
            // Update status indicator
            updateStatus: function(elementId, status, text) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.className = `tf-status tf-status-${status}`;
                    if (text && element.querySelector('.tf-status-text')) {
                        element.querySelector('.tf-status-text').textContent = text;
                    }
                }
            },
            
            // Show notification
            showNotification: function(message, type = 'info') {
                // TerraFusion notification system
                console.log(`[TerraFusion OS] ${type.toUpperCase()}: ${message}`);
            }
        };
    </script>
</body>
</html>
