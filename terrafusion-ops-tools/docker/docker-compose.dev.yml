version: '3.8'

# Development override configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Development database with exposed port
  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: terrafusion_dev
      POSTGRES_USER: tf_dev
      POSTGRES_PASSWORD: dev_password

  # Development Redis with exposed port
  redis:
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"

  # Backend with hot reload
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    command: uvicorn main:app --reload --host 0.0.0.0 --port \${{TF_ADMIN_PORT:-8080}}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://tf_dev:dev_password@db:5432/terrafusion_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key
      DEBUG: "true"
      CORS_ORIGINS: "*"
    volumes:
      - ../backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    ports:
      - "8080:${TF_STATIC_PORT:-8080}"

  # AI Engine with hot reload
  ai-engine:
    build:
      context: ../ai_engine
      dockerfile: Dockerfile.dev
    command: python app.py --debug
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://tf_dev:dev_password@db:5432/terrafusion_dev
      REDIS_URL: redis://redis:6379/1
      DEBUG: "true"
    volumes:
      - ../ai_engine:/app
      - /app/__pycache__
      - /app/.pytest_cache
    ports:
      - "8001:8001"

  # Frontend with hot reload
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    command: npm start
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:\${{TF_ADMIN_PORT:-8080}}
      REACT_APP_AI_URL: http://localhost:\${{TF_ADMIN_PORT:-8080}}
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3003:${TF_FRONTEND_PORT:-3102}"

  # Disable some services in development
  worker:
    profiles: ["full"]
  
  scheduler:
    profiles: ["full"]
  
  prometheus:
    profiles: ["monitoring"]
  
  grafana:
    profiles: ["monitoring"]
  
  backup:
    profiles: ["never"]

  # Additional development tools
  adminer:
    image: adminer
    container_name: terrafusion-adminer
    restart: unless-stopped
    ports:
      - "8088:${TF_STATIC_PORT:-8080}"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - terrafusion-network

  mailhog:
    image: mailhog/mailhog
    container_name: terrafusion-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - terrafusion-network