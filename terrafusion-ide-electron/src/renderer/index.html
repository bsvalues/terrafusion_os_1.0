<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;">
    <title>TerraFusion IDE - Government Development Platform</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
        }

        #root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Loading screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b1020 0%, #1a1f3a 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-logo {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #0099ff 0%, #00ffee 50%, #00ffaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2rem;
        }

        .loading-text {
            font-size: 1rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .loading-progress {
            width: 300px;
            height: 4px;
            background: rgba(0, 153, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #0099ff, #00ffee);
            width: 0%;
            transition: width 0.3s ease;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Hide scrollbars but keep functionality */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        ::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen" id="loading-screen">
            <div class="loading-logo">TerraFusion IDE</div>
            <div class="loading-text">Government. Transcended.</div>
            <div class="loading-progress">
                <div class="loading-progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Register TerraFusion IDE Service Worker for Elite Government Operations
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js', {
                        scope: '/'
                    });

                    console.log('🚀 TerraFusion IDE Service Worker registered:', registration.scope);
                    console.log('🤖 Supreme Commander Claude: Government-grade offline capabilities active');

                    // Listen for service worker messages
                    navigator.serviceWorker.addEventListener('message', (event) => {
                        const { type, message, capabilities } = event.data;

                        if (type === 'SW_ACTIVATED') {
                            console.log('⚡ Service Worker Message:', message);
                            console.log('🛡️ Government Capabilities:', capabilities);

                            // Notify IDE of offline capabilities
                            if (window.TerraFusionIDE) {
                                window.TerraFusionIDE.setOfflineMode(capabilities.offlineMode);
                                window.TerraFusionIDE.setGovernmentCompliance(capabilities.governmentCompliance);
                            }
                        }
                    });

                    // Handle service worker updates
                    registration.addEventListener('updatefound', () => {
                        console.log('🔄 TerraFusion IDE update available');
                        const newWorker = registration.installing;

                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('✨ TerraFusion IDE updated - Enhanced government features available');

                                // Optionally notify user of update
                                if (confirm('TerraFusion IDE has been updated with enhanced government capabilities. Reload to activate?')) {
                                    window.location.reload();
                                }
                            }
                        });
                    });

                } catch (error) {
                    console.error('🚨 Service Worker registration failed:', error);
                }
            });
        } else {
            console.warn('⚠️ Service Worker not supported - Limited offline capabilities');
        }

        // Enhanced loading animation with government operations
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const loadingText = document.querySelector('.loading-text');

        const loadingSteps = [
            'Initializing Supreme Commander Claude...',
            'Activating 50,000+ AI agents...',
            'Loading government compliance protocols...',
            'Establishing FISMA/NIST security...',
            'Configuring quantum performance engine...',
            'Preparing Monaco Editor with AI Copilot...',
            'Loading TerraFusion brand assets...',
            'Finalizing government operations...',
            'Government. Transcended.'
        ];

        let stepIndex = 0;
        const loadingInterval = setInterval(() => {
            progress += Math.random() * 12;

            // Update loading text based on progress
            const newStepIndex = Math.floor((progress / 100) * loadingSteps.length);
            if (newStepIndex !== stepIndex && newStepIndex < loadingSteps.length) {
                stepIndex = newStepIndex;
                loadingText.textContent = loadingSteps[stepIndex];
            }

            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                loadingText.textContent = 'Government. Transcended.';

                setTimeout(() => {
                    document.getElementById('loading-screen').style.opacity = '0';
                    document.getElementById('loading-screen').style.transition = 'opacity 0.5s ease';

                    setTimeout(() => {
                        document.getElementById('loading-screen').style.display = 'none';
                    }, 500);
                }, 1000);
            }
            progressBar.style.width = progress + '%';
        }, 150);

        // Global TerraFusion IDE interface for service worker communication
        window.TerraFusionIDE = {
            offlineMode: false,
            governmentCompliance: false,

            setOfflineMode: function(enabled) {
                this.offlineMode = enabled;
                console.log('🔄 Offline mode:', enabled ? 'ENABLED' : 'DISABLED');
            },

            setGovernmentCompliance: function(enabled) {
                this.governmentCompliance = enabled;
                console.log('🛡️ Government compliance:', enabled ? 'ACTIVE' : 'INACTIVE');
            },

            cacheGovernmentOperation: function(operation) {
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'CACHE_GOVERNMENT_OPERATION',
                        payload: operation
                    });
                }
            },

            getCacheStatus: function() {
                if (navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({
                        type: 'GET_CACHE_STATUS'
                    });
                }
            }
        };
    </script>
</body>
</html>
