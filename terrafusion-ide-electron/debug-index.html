<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion IDE - Debug Version</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        /* Simple debug info */
        .debug-info {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 10000;
        }

        /* Fallback loading indicator */
        .loading-fallback {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #0099ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="debug-info">
        <div>🚀 TerraFusion IDE Debug</div>
        <div id="debug-status">Loading...</div>
    </div>

    <div id="root">
        <div class="loading-fallback" id="fallback-loading">
            <div class="spinner"></div>
            <h2>🚀 TerraFusion IDE</h2>
            <p>Government. Transcended.</p>
            <p>Loading React application...</p>
            <div id="load-status">Initializing...</div>
        </div>
    </div>

    <script>
        console.log('🚀 TerraFusion IDE Debug Version Starting...');

        const debugStatus = document.getElementById('debug-status');
        const loadStatus = document.getElementById('load-status');

        // Debug logging
        function updateStatus(message) {
            console.log('📍 Status:', message);
            debugStatus.textContent = message;
            loadStatus.textContent = message;
        }

        updateStatus('HTML Loaded');

        // Check if React script loads
        const script = document.createElement('script');
        script.src = './renderer.js';
        script.defer = true;

        script.onload = function() {
            updateStatus('React Bundle Loaded');
            console.log('✅ renderer.js loaded successfully');

            // Give React time to mount
            setTimeout(() => {
                const root = document.getElementById('root');
                if (root && root.children.length > 1) {
                    updateStatus('React App Mounted');
                    document.getElementById('fallback-loading').style.display = 'none';
                } else {
                    updateStatus('React App Failed to Mount');
                    console.error('❌ React app did not mount properly');
                }
            }, 2000);
        };

        script.onerror = function() {
            updateStatus('Failed to Load React Bundle');
            console.error('❌ Failed to load renderer.js');
        };

        document.head.appendChild(script);

        // Fallback timer
        setTimeout(() => {
            if (loadStatus.textContent === 'Initializing...') {
                updateStatus('Timeout - Check Console');
            }
        }, 10000);

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('🚨 JavaScript Error:', e.error);
            updateStatus('JavaScript Error - Check Console');
        });

        window.addEventListener('unhandledrejection', (e) => {
            console.error('🚨 Unhandled Promise Rejection:', e.reason);
            updateStatus('Promise Error - Check Console');
        });
    </script>
</body>
</html>
