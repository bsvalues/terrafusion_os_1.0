# TerraFusion OS PostgreSQL Host-Based Authentication Configuration
# PhD-Level Security Configuration for Government Property Assessment Systems
# FISMA-Compliant Authentication with Multi-Level Security

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             terrafusion                            scram-sha-256
local   replication     postgres                                peer
local   replication     replicator                             scram-sha-256

# IPv4 local connections - Production Security
host    all             postgres        127.0.0.1/32           scram-sha-256
host    all             postgres        ::1/128                scram-sha-256

# TerraFusion OS Application Database Connections
# Primary application database access with certificate authentication
hostssl terrafusion     terrafusion     10.0.0.0/8             scram-sha-256 clientcert=verify-full
hostssl terrafusion     terrafusion     172.16.0.0/12          scram-sha-256 clientcert=verify-full
hostssl terrafusion     terrafusion     192.168.0.0/16         scram-sha-256 clientcert=verify-full

# Government facility secure networks
hostssl terrafusion     terrafusion     10.1.0.0/16            scram-sha-256 clientcert=verify-full
hostssl terrafusion     terrafusion     10.2.0.0/16            scram-sha-256 clientcert=verify-full
hostssl terrafusion     terrafusion     172.20.0.0/16          scram-sha-256 clientcert=verify-full

# Harris PACS Integration - Dedicated User with Network Restriction
hostssl terrafusion     harris_pacs     10.0.1.0/24            scram-sha-256 clientcert=verify-full
hostssl terrafusion     harris_pacs     192.168.100.0/24       scram-sha-256 clientcert=verify-full

# Tyler Technologies Integration
hostssl terrafusion     tyler_user      10.0.2.0/24            scram-sha-256 clientcert=verify-full
hostssl terrafusion     tyler_user      192.168.101.0/24       scram-sha-256 clientcert=verify-full

# Government Compliance - Audit and Monitoring Users
hostssl terrafusion     audit_reader    10.0.10.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     compliance_user 10.0.11.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     monitoring_user 10.0.12.0/24           scram-sha-256

# Read Replica Connections - Streaming Replication
# Primary to replica replication with certificate authentication
hostssl replication     replicator      10.0.100.0/24          scram-sha-256 clientcert=verify-full
hostssl replication     replicator      172.16.100.0/24        scram-sha-256 clientcert=verify-full
hostssl replication     replicator      192.168.200.0/24       scram-sha-256 clientcert=verify-full

# Backup and Recovery Operations
hostssl all             backup_user     10.0.200.0/24          scram-sha-256 clientcert=verify-full
hostssl replication     backup_user     10.0.200.0/24          scram-sha-256 clientcert=verify-full

# County-Specific Database Access
# Benton County Production Access (Primary Deployment)
hostssl benton_county   benton_user     10.10.0.0/16           scram-sha-256 clientcert=verify-full
hostssl benton_county   benton_admin    10.10.1.0/24           scram-sha-256 clientcert=verify-full

# Yakima County Access (Flagship County)
hostssl yakima_county   yakima_user     10.20.0.0/16           scram-sha-256 clientcert=verify-full
hostssl yakima_county   yakima_admin    10.20.1.0/24           scram-sha-256 clientcert=verify-full

# Cowlitz County Access 
hostssl cowlitz_county  cowlitz_user    10.30.0.0/16           scram-sha-256 clientcert=verify-full
hostssl cowlitz_county  cowlitz_admin   10.30.1.0/24           scram-sha-256 clientcert=verify-full

# AI Agent Database Connections - Restricted Network Access
hostssl terrafusion     ai_agent_brain  10.0.50.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     ai_agent_swarm  10.0.51.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     ai_advanced     10.0.52.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     consciousness   10.0.53.0/24           scram-sha-256 clientcert=verify-full

# Development and Testing - Separate Networks
# Development database access (less restrictive for development)
hostssl terrafusion_dev dev_user        10.100.0.0/16          scram-sha-256
hostssl terrafusion_dev test_user       10.101.0.0/16          scram-sha-256

# Testing environments
hostssl terrafusion_test test_runner    10.102.0.0/16          scram-sha-256
hostssl terrafusion_test integration    10.103.0.0/16          scram-sha-256

# Load Balancer and Proxy Connections
# HAProxy health check connections
host    terrafusion     healthcheck     10.0.254.0/24          scram-sha-256
host    terrafusion     healthcheck     172.16.254.0/24        scram-sha-256

# Application server connections through load balancer
hostssl terrafusion     app_user        10.0.1.0/24            scram-sha-256 clientcert=verify-full
hostssl terrafusion     app_user        172.16.1.0/24          scram-sha-256 clientcert=verify-full
hostssl terrafusion     app_user        192.168.1.0/24         scram-sha-256 clientcert=verify-full

# Connection Pooling (PgBouncer) Access
hostssl terrafusion     pgbouncer       10.0.3.0/24            scram-sha-256 clientcert=verify-full
hostssl terrafusion     pgbouncer       172.16.3.0/24          scram-sha-256 clientcert=verify-full

# Redis Integration for Negative Caching
host    terrafusion     redis_user      10.0.4.0/24            scram-sha-256

# Prometheus Monitoring
host    postgres        postgres_exporter 10.0.5.0/24          scram-sha-256

# Database Administration - Highly Restricted
# Database administrator access from secure management network
hostssl all             dba_admin       10.0.255.1/32          scram-sha-256 clientcert=verify-full
hostssl replication     dba_admin       10.0.255.1/32          scram-sha-256 clientcert=verify-full

# Emergency Access (Break-glass)
local   all             postgres                                peer map=emergency
hostssl all             emergency_admin 10.0.255.254/32        scram-sha-256 clientcert=verify-full

# Government Security Compliance
# FISMA compliance requires specific access controls
hostssl terrafusion     fisma_auditor   10.0.13.0/24           scram-sha-256 clientcert=verify-full
hostssl all             security_scan   10.0.14.0/24           scram-sha-256

# Multi-Factor Authentication Support
# Users requiring MFA will be handled at application level
# Database provides certificate-based authentication

# Read-Only Analytics Users
hostssl terrafusion     analytics_ro    10.0.60.0/24           scram-sha-256 clientcert=verify-full
hostssl terrafusion     reporting_user  10.0.61.0/24           scram-sha-256 clientcert=verify-full

# External System Integration
# Property valuation systems
hostssl terrafusion     valuation_sys   10.0.70.0/24           scram-sha-256 clientcert=verify-full

# Geographic Information Systems
hostssl terrafusion     gis_user        10.0.71.0/24           scram-sha-256 clientcert=verify-full

# Document management systems
hostssl terrafusion     document_sys    10.0.72.0/24           scram-sha-256 clientcert=verify-full

# Deny all other connections - Security by Default
# Any connection not explicitly allowed above will be denied
host    all             all             0.0.0.0/0              reject
host    all             all             ::/0                   reject