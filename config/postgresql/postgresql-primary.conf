# TerraFusion OS PostgreSQL Primary Server Configuration
# PhD-Level Database Configuration for Government Property Assessment Systems
# Optimized for High-Performance Government Workloads with Negative Caching Integration

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 500
superuser_reserved_connections = 10

# Memory Configuration - Government Grade Performance
shared_buffers = 2GB                    # 25% of available RAM for production
effective_cache_size = 6GB              # 75% of available RAM
work_mem = 32MB                         # For complex queries and sorting
maintenance_work_mem = 512MB            # For maintenance operations
huge_pages = try                        # Use huge pages when available
temp_buffers = 32MB                     # Temporary table buffer size

# Write-Ahead Logging (WAL) - Critical for Replication
wal_level = replica                     # Enable streaming replication
wal_log_hints = on                     # Required for pg_rewind
max_wal_senders = 10                   # Number of concurrent WAL senders
max_replication_slots = 10             # Maximum replication slots
wal_keep_size = 2GB                    # Keep WAL files for replication
wal_sender_timeout = 60s               # WAL sender timeout

# WAL Archiving for Point-in-Time Recovery
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/15/archive/%f'
archive_timeout = 60s                  # Force WAL file switch every minute

# Checkpointing - Optimized for Government Workloads
checkpoint_timeout = 15min             # Checkpoint interval
checkpoint_completion_target = 0.9     # Spread checkpoint I/O
checkpoint_warning = 30s               # Warn if checkpoints too frequent
max_wal_size = 4GB                     # Maximum WAL size before checkpoint
min_wal_size = 1GB                     # Minimum WAL size to keep

# Query Planner Configuration - Property Assessment Optimized
random_page_cost = 1.1                 # SSD-optimized random page cost
effective_io_concurrency = 200         # SSD concurrent I/O capability
maintenance_io_concurrency = 10       # Maintenance I/O concurrency
default_statistics_target = 100       # Statistics collection target
constraint_exclusion = partition      # Enable partition pruning

# Logging Configuration - Government Compliance
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Government-Grade Logging Settings
log_connections = on                   # Log all connections
log_disconnections = on               # Log all disconnections
log_duration = on                     # Log query duration
log_statement = 'mod'                 # Log all modifying statements
log_min_duration_statement = 5000     # Log slow queries (5+ seconds)
log_checkpoints = on                  # Log checkpoint activity
log_lock_waits = on                   # Log lock waits
log_temp_files = 10MB                 # Log temp files > 10MB
log_autovacuum_min_duration = 0       # Log all autovacuum activity

# Security Configuration - FISMA Compliant
ssl = on
ssl_cert_file = '/etc/ssl/certs/terrafusion-db.crt'
ssl_key_file = '/etc/ssl/private/terrafusion-db.key'
ssl_ca_file = '/etc/ssl/certs/terrafusion-ca.crt'
ssl_ciphers = 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Authentication and Access Control
password_encryption = scram-sha-256    # Strong password encryption
row_security = on                      # Enable row-level security
log_statement_stats = off              # Disable for performance

# Connection Pooling Support
tcp_keepalives_idle = 600             # TCP keepalive settings
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# Vacuum Configuration - Property Data Optimized
autovacuum = on
autovacuum_max_workers = 6            # Maximum autovacuum workers
autovacuum_naptime = 30s              # Time between autovacuum runs
autovacuum_vacuum_threshold = 500     # Minimum tuples before vacuum
autovacuum_analyze_threshold = 250    # Minimum tuples before analyze
autovacuum_vacuum_scale_factor = 0.1  # Vacuum when 10% of table changes
autovacuum_analyze_scale_factor = 0.05 # Analyze when 5% of table changes
autovacuum_freeze_max_age = 200000000 # Freeze tuples to prevent wraparound
autovacuum_multixact_freeze_max_age = 400000000

# Background Writer - I/O Distribution
bgwriter_delay = 200ms                # Background writer sleep time
bgwriter_lru_maxpages = 100           # Maximum pages to write per round
bgwriter_lru_multiplier = 2.0         # Multiplier for next round pages
bgwriter_flush_after = 512kB          # Force OS flush after amount

# Performance Monitoring
track_activities = on                  # Track running queries
track_counts = on                     # Track table/index usage
track_io_timing = on                  # Track I/O timing
track_functions = pl                  # Track PL/pgSQL functions
compute_query_id = on                 # Enable query ID computation

# Replication Configuration
hot_standby = on                      # Enable queries on standby
hot_standby_feedback = on             # Send feedback to primary
max_standby_archive_delay = 30s       # Max delay before canceling queries
max_standby_streaming_delay = 30s     # Max delay for streaming
wal_receiver_status_interval = 10s    # Status update interval
wal_receiver_timeout = 60s            # Receiver timeout
wal_retrieve_retry_interval = 5s      # Retry interval for WAL retrieval

# Performance Optimization for Property Assessment Queries
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
enable_indexscan = on
enable_indexonlyscan = on
enable_bitmapscan = on
enable_seqscan = on
enable_sort = on

# Government-Specific Performance Settings
from_collapse_limit = 8               # FROM list collapse limit
join_collapse_limit = 8               # JOIN collapse limit
geqo = on                            # Genetic query optimization
geqo_threshold = 12                  # Use GEQO for joins > 12 tables
geqo_effort = 5                      # GEQO effort (1-10)
geqo_pool_size = 0                   # Auto pool size
geqo_generations = 0                 # Auto generations
default_statistics_target = 100      # Statistics target

# Lock Configuration
max_locks_per_transaction = 64        # Locks per transaction
max_pred_locks_per_transaction = 64   # Predicate locks per transaction
max_pred_locks_per_relation = -2      # Auto predicate locks per relation
max_pred_locks_per_page = 2           # Predicate locks per page

# Harris PACS Integration Optimization
statement_timeout = 300000            # 5 minute statement timeout
lock_timeout = 30000                  # 30 second lock timeout
idle_in_transaction_session_timeout = 600000  # 10 minute idle timeout
tcp_user_timeout = 30000              # 30 second TCP timeout

# Custom Settings for TerraFusion OS
custom_variable_classes = 'terrafusion'
terrafusion.cache_miss_tracking = on
terrafusion.property_query_optimization = on
terrafusion.harris_pacs_integration = on
terrafusion.audit_level = 'government'

# Locale and Character Set
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# TimeZone
timezone = 'America/Los_Angeles'       # Pacific Time for Washington State
log_timezone = 'America/Los_Angeles'

# Dynamic Shared Memory
dynamic_shared_memory_type = posix