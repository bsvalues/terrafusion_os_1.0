# TerraFusion OS PostgreSQL Read Replica Configuration
# PhD-Level Read Replica Configuration for Government Property Assessment Systems
# Optimized for Query Distribution and Negative Caching Support

# Connection Settings - Replica Specific
listen_addresses = '*'
port=\${{TF_POSTGRES_PORT:-5432}}
max_connections = 300                  # Fewer connections for read-only workload
superuser_reserved_connections = 5

# Memory Configuration - Read-Optimized
shared_buffers = 1GB                   # Smaller than primary for read workload
effective_cache_size = 6GB             # Same as primary for query planning
work_mem = 64MB                        # Larger for read-heavy analytical queries
maintenance_work_mem = 256MB           # Smaller maintenance window
huge_pages = try
temp_buffers = 64MB                    # Larger temp buffers for complex queries

# Hot Standby Configuration - Critical for Read Replicas
hot_standby = on                       # Enable read-only queries
hot_standby_feedback = on              # Send feedback to prevent conflicts
max_standby_archive_delay = 30s        # Max delay before canceling queries
max_standby_streaming_delay = 30s      # Max streaming delay
wal_receiver_status_interval = 10s     # Frequent status updates
wal_receiver_timeout = 60s             # Connection timeout
wal_retrieve_retry_interval = 5s       # Quick retry for WAL retrieval

# WAL Configuration for Replica
wal_level = replica                    # Same as primary
wal_log_hints = on                     # Required for pg_rewind
max_wal_senders = 0                    # No WAL senders needed on replica
wal_keep_size = 1GB                    # Smaller WAL retention
wal_receiver_create_temp_slot = off    # Don't create temp slots

# Replication Settings
primary_conninfo = 'host=terrafusion-db-primary port=\${{TF_POSTGRES_PORT:-5432}} user=replicator password=TF_Replica_2025! sslmode=require sslcert=/etc/ssl/certs/replica.crt sslkey=/etc/ssl/private/replica.key sslrootcert=/etc/ssl/certs/ca.crt'
primary_slot_name = 'replica_1'        # Replication slot name
promote_trigger_file = '/tmp/promote_replica'  # File to trigger promotion
recovery_target_timeline = 'latest'    # Follow timeline changes

# Query Planner - Read-Optimized
random_page_cost = 1.1                 # SSD-optimized
seq_page_cost = 1.0                    # Sequential read cost
effective_io_concurrency = 300         # Higher for read workload
maintenance_io_concurrency = 5         # Lower for replica
default_statistics_target = 100        # Same statistics target
constraint_exclusion = partition       # Enable partition pruning

# Checkpointing - Replica Specific
checkpoint_timeout = 30min             # Longer checkpoint interval
checkpoint_completion_target = 0.9
checkpoint_warning = 30s
max_wal_size = 2GB                     # Smaller WAL size
min_wal_size = 512MB

# Logging Configuration - Replica Specific
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-replica-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Read Replica Specific Logging
log_connections = on
log_disconnections = on
log_duration = on
log_statement = 'none'                 # Only log errors (read-only)
log_min_duration_statement = 10000     # Log very slow queries (10+ seconds)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 50MB                  # Log large temp files
log_autovacuum_min_duration = -1       # Disable autovacuum logging

# Security Configuration - Same as Primary
ssl = on
ssl_cert_file = '/etc/ssl/certs/terrafusion-db-replica.crt'
ssl_key_file = '/etc/ssl/private/terrafusion-db-replica.key'
ssl_ca_file = '/etc/ssl/certs/terrafusion-ca.crt'
ssl_ciphers = 'ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Authentication
password_encryption = scram-sha-256
row_security = on
log_statement_stats = off

# Connection Management
tcp_keepalives_idle = 600
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# Vacuum Configuration - Replica Specific
autovacuum = off                       # Disable autovacuum on replica
vacuum_cost_delay = 20ms               # Higher cost delay if manual vacuum needed
vacuum_cost_page_hit = 1
vacuum_cost_page_miss = 10
vacuum_cost_page_dirty = 20
vacuum_cost_limit = 200

# Background Writer - Read-Optimized
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 50             # Fewer pages for replica
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 256kB           # Smaller flush threshold

# Performance Monitoring
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl
compute_query_id = on

# Query Optimization - Read Workload Specific
enable_hashjoin = on
enable_mergejoin = on
enable_nestloop = on
enable_indexscan = on
enable_indexonlyscan = on
enable_bitmapscan = on
enable_seqscan = on                    # Allow sequential scans for analytics
enable_sort = on

# Read Replica Performance Tuning
from_collapse_limit = 12               # Higher for complex read queries
join_collapse_limit = 12               # Higher join collapse limit
geqo = on
geqo_threshold = 15                    # Use GEQO for larger joins
geqo_effort = 7                        # Higher effort for read optimization
geqo_pool_size = 0
geqo_generations = 0
default_statistics_target = 100

# Lock Configuration - Minimal for Read-Only
max_locks_per_transaction = 32         # Fewer locks needed
max_pred_locks_per_transaction = 32
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2

# Read-Only Timeout Configuration
statement_timeout = 600000             # 10 minute timeout for analytics
lock_timeout = 5000                    # 5 second lock timeout
idle_in_transaction_session_timeout = 300000  # 5 minute idle timeout
tcp_user_timeout = 30000

# Custom Settings for Read Replica
custom_variable_classes = 'terrafusion'
terrafusion.cache_miss_tracking = on
terrafusion.property_query_optimization = on
terrafusion.harris_pacs_integration = on
terrafusion.audit_level = 'government'
terrafusion.read_replica_mode = on
terrafusion.negative_cache_support = on

# Read Replica Specific Settings
default_transaction_isolation = 'read committed'
default_transaction_read_only = on     # Enforce read-only mode
transaction_read_only = on
default_transaction_deferrable = off

# Locale Settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# TimeZone
timezone = 'America/Los_Angeles'
log_timezone = 'America/Los_Angeles'

# Shared Memory
dynamic_shared_memory_type = posix

# Recovery Configuration
restore_command = 'cp /var/lib/postgresql/15/archive/%f %p'
recovery_target_timeline = 'latest'
standby_mode = on

# Replica-Specific Optimization
max_standby_archive_delay = 30s        # Cancel conflicting queries quickly
max_standby_streaming_delay = 30s      # Keep replica responsive
vacuum_defer_cleanup_age = 0           # Don't defer cleanup
old_snapshot_threshold = -1            # Disable old snapshot cleanup

# Statistics Collection - Read Workload Focused
log_parser_stats = off
log_planner_stats = off
log_executor_stats = off
log_statement_stats = off
track_commit_timestamp = off

# Archive Settings (if needed for cascading replication)
archive_mode = off                     # No archiving on replica by default
archive_command = ''
archive_timeout = 0