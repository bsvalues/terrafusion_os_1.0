[databases]
; TerraFusion OS PgBouncer Configuration
; PhD-Level Connection Pooling for Government Property Assessment Systems

; Primary database connections
terrafusion = host=terrafusion-db-primary port=5432 dbname=terrafusion pool_size=30 max_db_connections=100

; Read replica routing for negative caching optimization
terrafusion_readonly = host=terrafusion-db-replica1 port=5432 dbname=terrafusion pool_size=20 max_db_connections=50

; Analytics replica for complex queries
terrafusion_analytics = host=terrafusion-db-replica2 port=5432 dbname=terrafusion pool_size=15 max_db_connections=40

; County-specific databases (if using multi-tenant approach)
benton_county = host=terrafusion-db-primary port=5432 dbname=benton_county pool_size=10 max_db_connections=30
yakima_county = host=terrafusion-db-primary port=5432 dbname=yakima_county pool_size=10 max_db_connections=30
cowlitz_county = host=terrafusion-db-primary port=5432 dbname=cowlitz_county pool_size=10 max_db_connections=30

; Special purpose databases
postgres = host=terrafusion-db-primary port=5432 dbname=postgres pool_size=5 max_db_connections=10

[pgbouncer]
; Connection pooling configuration
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
unix_socket_mode = 0777
unix_socket_group =

; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT username, password FROM public.user_lookup($1)

; Pool settings optimized for negative caching
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100

; Connection limits per database
per_loop_maint = 120

; Government-grade security settings
server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_check_delay = 30
server_check_query = select 1
server_lifetime = 3600
server_idle_timeout = 600

; Client connection settings
client_idle_timeout = 300
client_login_timeout = 60
autodb_idle_timeout = 3600

; TLS/SSL Configuration for government compliance
server_tls_sslmode = require
server_tls_ca_file = /etc/ssl/certs/ca.crt
server_tls_key_file = /etc/ssl/private/pgbouncer.key
server_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
server_tls_protocols = secure
server_tls_ciphers = HIGH:!aNULL:!MD5

client_tls_sslmode = allow
client_tls_key_file = /etc/ssl/private/pgbouncer.key
client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
client_tls_ca_file = /etc/ssl/certs/ca.crt
client_tls_protocols = secure
client_tls_ciphers = HIGH:!aNULL:!MD5

; Logging configuration for audit compliance
syslog = 1
syslog_facility = local0
syslog_ident = pgbouncer

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; Performance optimization
server_round_robin = 1
query_timeout = 0
query_wait_timeout = 120
cancel_wait_timeout = 10
pkt_buf = 4096
listen_backlog = 128
sbuf_loopcnt = 5

; Government compliance logging
verbose = 0
admin_users = postgres, pgbouncer_admin
stats_users = postgres, pgbouncer_admin, monitoring_user

; DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15
dns_zone_check_period = 0

; Application name for connection tracking
application_name_add_host = 1

; Negative caching optimization
; Fast connection recycling for high-frequency property lookups
so_reuseport = 1
tcp_defer_accept = 45
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 0
tcp_keepidle = 0
tcp_keepintvl = 0
tcp_user_timeout = 0

; Harris PACS integration optimization
; Dedicated pool configuration for property assessment queries
; These settings optimize for the 30-second negative cache TTL pattern