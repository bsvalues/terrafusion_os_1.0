# TerraFusion OS OpenTelemetry Collector Configuration
# PhD-Level APM Configuration for Government Property Assessment Systems
# Comprehensive Observability with Custom Metrics and Distributed Tracing

# ===========================================================================
# RECEIVERS - Data Collection Endpoints
# ===========================================================================
receivers:
  # OTLP receiver for application traces and metrics
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size: 52428800  # 50MB
        read_buffer_size: 1048576    # 1MB
        write_buffer_size: 1048576   # 1MB
        tls:
          cert_file: /etc/ssl/certs/otel-collector.crt
          key_file: /etc/ssl/private/otel-collector.key
          ca_file: /etc/ssl/certs/terrafusion-ca.crt
          client_ca_file: /etc/ssl/certs/terrafusion-ca.crt
          
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:3000"
            - "https://*.terrafusion.gov"
            - "https://*.benton-county.gov"
          allowed_headers:
            - Accept
            - Accept-Language
            - Content-Type
            - Content-Language
            - Authorization
        tls:
          cert_file: /etc/ssl/certs/otel-collector.crt
          key_file: /etc/ssl/private/otel-collector.key

  # Prometheus scraping for infrastructure metrics
  prometheus:
    config:
      scrape_configs:
        # TerraFusion API metrics
        - job_name: 'terrafusion-api'
          static_configs:
            - targets: ['terrafusion-api-1:5000', 'terrafusion-api-2:5000', 'terrafusion-api-3:5000']
          scrape_interval: 15s
          scrape_timeout: 10s
          metrics_path: '/metrics'
          
        # PostgreSQL metrics
        - job_name: 'postgresql'
          static_configs:
            - targets: ['postgres-exporter:9187']
          scrape_interval: 30s
          
        # Redis metrics
        - job_name: 'redis'
          static_configs:
            - targets: ['redis-exporter:9121']
          scrape_interval: 15s
          
        # HAProxy metrics
        - job_name: 'haproxy'
          static_configs:
            - targets: ['haproxy-exporter:9101']
          scrape_interval: 15s
          
        # Node metrics
        - job_name: 'node'
          static_configs:
            - targets: ['node-exporter:9100']
          scrape_interval: 30s
          
        # AI Agent metrics
        - job_name: 'ai-agents'
          static_configs:
            - targets: ['ai-command-brain:3001', 'ai-swarm:3002', 'ai-advanced:3003', 'consciousness-layer:3004']
          scrape_interval: 15s
          metrics_path: '/metrics'

  # Jaeger receiver for legacy traces
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832

  # Zipkin receiver
  zipkin:
    endpoint: 0.0.0.0:9411

  # Host metrics for system monitoring
  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk:
        metrics:
          system.disk.operations:
            enabled: true
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network:
        metrics:
          system.network.dropped:
            enabled: true
      process:
        mute_process_name_error: true

  # Windows performance counters (if running on Windows)
  windowsperfcounters:
    collection_interval: 30s
    perfcounters:
      - object: "Process"
        counters:
          - name: "% Processor Time"
          - name: "Private Bytes"
        instances: ["terrafusion*"]

# ===========================================================================
# PROCESSORS - Data Processing Pipeline
# ===========================================================================
processors:
  # Batch processor for performance optimization
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter to prevent OOM
  memory_limiter:
    limit_mib: 2048
    spike_limit_mib: 512
    check_interval: 5s

  # Resource processor for adding environment metadata
  resource:
    attributes:
      - key: environment
        value: production
        action: upsert
      - key: service.namespace
        value: terrafusion-os
        action: upsert
      - key: deployment.environment
        value: government-production
        action: upsert
      - key: compliance.level
        value: fisma-moderate
        action: upsert

  # Attributes processor for government compliance
  attributes:
    actions:
      # Add government classification
      - key: government.classification
        value: "unclassified"
        action: insert
      - key: government.system
        value: "property-assessment"
        action: insert
      - key: compliance.framework
        value: "fisma"
        action: insert
      
      # Remove sensitive information
      - key: user.email
        action: delete
      - key: user.ssn
        action: delete
      - key: property.owner_info
        action: hash
      
      # Normalize service names
      - key: service.name
        from_attribute: service_name
        action: upsert

  # Span processor for trace enhancement
  span:
    name:
      # Rename spans for better organization
      from_attributes: ["http.method", "http.route"]
      separator: " "
    
  # Probabilistic sampler for high-volume traces
  probabilistic_sampler:
    sampling_percentage: 10.0  # Sample 10% of traces in production
    hash_seed: 22

  # Tail sampling for intelligent trace collection
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 10
    policies:
      # Always sample errors
      - name: error_policy
        type: status_code
        status_code: {status_codes: [ERROR]}
        
      # Always sample slow requests (>1 second)
      - name: slow_requests
        type: latency
        latency: {threshold_ms: 1000}
        
      # Sample Harris PACS integration traces
      - name: harris_pacs_traces
        type: string_attribute
        string_attribute: {key: service.name, values: ["harris-pacs-integration"]}
        
      # Sample negative caching traces
      - name: negative_cache_traces
        type: string_attribute
        string_attribute: {key: operation.type, values: ["cache_miss", "negative_cache_hit"]}
        
      # Sample government compliance operations
      - name: compliance_traces
        type: string_attribute
        string_attribute: {key: compliance.operation, values: ["audit", "security_check"]}

  # Transform processor for custom metrics
  transform:
    metric_statements:
      # Create negative caching effectiveness metric
      - context: metric
        statements:
          - set(description, "TerraFusion negative cache effectiveness") where name == "negative_cache_hits"
          - set(unit, "percent") where name == "cache_hit_ratio"
          
      # Government performance metrics
      - context: metric
        statements:
          - set(attributes["government.metric"], "true") where name starts_with "terrafusion_"
          - set(attributes["compliance.required"], "true") where name starts_with "audit_"

# ===========================================================================
# EXPORTERS - Data Output Destinations
# ===========================================================================
exporters:
  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: terrafusion
    const_labels:
      environment: production
      system: property-assessment
      compliance: fisma-moderate
    send_timestamps: true
    metric_expiration: 180m
    enable_open_metrics: true

  # Prometheus remote write for long-term storage
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
    namespace: terrafusion
    external_labels:
      environment: production
      system: terrafusion-os
      region: us-west-2
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Jaeger exporter for distributed tracing
  jaeger:
    endpoint: jaeger-collector:14250
    tls:
      insecure: false
      cert_file: /etc/ssl/certs/jaeger-client.crt
      key_file: /etc/ssl/private/jaeger-client.key
      ca_file: /etc/ssl/certs/terrafusion-ca.crt
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  # OTLP exporter for external APM systems
  otlp:
    endpoint: https://otel.terrafusion.gov:4317
    tls:
      cert_file: /etc/ssl/certs/otel-client.crt
      key_file: /etc/ssl/private/otel-client.key
      ca_file: /etc/ssl/certs/terrafusion-ca.crt
    compression: gzip
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Elasticsearch exporter for log aggregation
  elasticsearch:
    endpoints: ["https://elasticsearch:9200"]
    index: "terrafusion-telemetry"
    pipeline: "government-telemetry-pipeline"
    username: "otel_user"
    password: "TF_ElasticSearch_2025_Secure!"
    tls:
      cert_file: /etc/ssl/certs/elasticsearch-client.crt
      key_file: /etc/ssl/private/elasticsearch-client.key
      ca_file: /etc/ssl/certs/elasticsearch-ca.crt
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s

  # File exporter for audit compliance
  file:
    path: /var/log/otel/government-audit.jsonl
    format: json
    compression: gzip
    max_file_size: 100
    max_backup_files: 10

  # Logging exporter for debugging (development only)
  logging:
    loglevel: info
    sampling_initial: 2
    sampling_thereafter: 500

# ===========================================================================
# EXTENSIONS - Additional Functionality
# ===========================================================================
extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133
    tls:
      cert_file: /etc/ssl/certs/otel-collector.crt
      key_file: /etc/ssl/private/otel-collector.key

  # Performance profiling
  pprof:
    endpoint: 0.0.0.0:1777

  # zpages for debugging
  zpages:
    endpoint: 0.0.0.0:55679

  # File storage for buffering
  file_storage:
    directory: /tmp/otel-data
    timeout: 10s

  # Memory ballast for stable memory usage
  memory_ballast:
    size_mib: 512

# ===========================================================================
# SERVICE PIPELINE CONFIGURATION
# ===========================================================================
service:
  extensions: [health_check, pprof, zpages, file_storage, memory_ballast]
  
  pipelines:
    # Traces pipeline for distributed tracing
    traces:
      receivers: [otlp, jaeger, zipkin]
      processors: [memory_limiter, resource, attributes, span, tail_sampling, batch]
      exporters: [jaeger, otlp, file]
      
    # Metrics pipeline for performance monitoring
    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [memory_limiter, resource, attributes, transform, batch]
      exporters: [prometheus, prometheusremotewrite, file]
      
    # Logs pipeline for government audit requirements
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [elasticsearch, file, logging]

  # Telemetry configuration
  telemetry:
    logs:
      level: info
      development: false
      encoding: json
      disable_caller: false
      disable_stacktrace: false
      output_paths: ["stdout", "/var/log/otel/collector.log"]
      error_output_paths: ["stderr", "/var/log/otel/collector-error.log"]
      initial_fields:
        service: "otel-collector"
        environment: "production"
        compliance: "fisma"
        
    metrics:
      level: detailed
      address: 0.0.0.0:8888
      
    traces:
      level: detailed