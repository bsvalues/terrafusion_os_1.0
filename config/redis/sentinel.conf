# TerraFusion OS Redis Sentinel Configuration
# PhD-Level High Availability Configuration for Government Property Assessment Systems
# Provides Automatic Failover for Redis Master-Replica Setup

# Sentinel Configuration
port 26379
bind 0.0.0.0

# Security
requirepass TF_Sentinel_2025_Secure!
sentinel auth-pass terrafusion-master TF_Redis_Master_2025_Secure!

# Monitor Configuration for TerraFusion Redis Master
# Monitors the master and triggers failover when needed
sentinel monitor terrafusion-master terrafusion-redis-master 6379 2
sentinel down-after-milliseconds terrafusion-master 5000
sentinel parallel-syncs terrafusion-master 1
sentinel failover-timeout terrafusion-master 10000

# Government-Grade Notification Configuration
# Integrate with government monitoring systems
sentinel notification-script terrafusion-master /opt/redis-sentinel/notify-government-ops.sh
sentinel client-reconfig-script terrafusion-master /opt/redis-sentinel/reconfig-government-clients.sh

# Logging for Government Compliance
logfile /var/log/redis/sentinel.log
syslog-enabled yes
syslog-ident terrafusion-redis-sentinel
syslog-facility local0
loglevel notice

# Advanced Sentinel Configuration
sentinel deny-scripts-reconfig yes
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Performance Configuration
sentinel myid 40d72ef7f42c3ea0f6bc7f6b7e8e4e8e3f0a0e0b

# TLS Configuration for Government Compliance  
tls-port 26380
tls-cert-file /etc/ssl/certs/sentinel.crt
tls-key-file /etc/ssl/private/sentinel.key
tls-ca-cert-file /etc/ssl/certs/redis-ca.crt
tls-dh-params-file /etc/ssl/certs/redis-dhparams.pem
tls-protocols "TLSv1.2 TLSv1.3"
tls-prefer-server-ciphers yes

# Configuration Persistence
dir /data

# Sentinel Network Configuration
tcp-keepalive 60
sentinel announce-ip 10.0.2.100
sentinel announce-port 26379