# TerraFusion OS Redis Replica Configuration
# PhD-Level Read Replica Configuration for Government Property Assessment Systems
# Optimized for Read-Heavy Negative Caching Workloads

# Network Configuration
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security Configuration
requirepass TF_Redis_Replica_2025_Secure!
masterauth TF_Redis_Master_2025_Secure!

# TLS Configuration
tls-port 6380
tls-cert-file /etc/ssl/certs/redis-replica.crt
tls-key-file /etc/ssl/private/redis-replica.key
tls-ca-cert-file /etc/ssl/certs/redis-ca.crt
tls-dh-params-file /etc/ssl/certs/redis-dhparams.pem
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
tls-prefer-server-ciphers yes

# Memory Configuration - Read-Optimized
maxmemory 3gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Replication Configuration - Replica Specific
slaveof terrafusion-redis-master 6379
slave-serve-stale-data yes
slave-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-slave-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600
slave-priority 90

# Data Structure Optimization for Read Workloads
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Persistence Configuration - Replica Specific
# Reduced persistence requirements for read replica
appendonly yes
appendfilename "terrafusion-redis-replica.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB Configuration - Backup Purposes
save 3600 1
save 1800 10
save 300 100
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename terrafusion-redis-replica.rdb
dir /data

# Client Configuration for Read Workloads
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance Configuration
databases 16
maxclients 15000
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
notify-keyspace-events ""

# Read Optimization Settings
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Lazy Freeing for Better Performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
slave-lazy-flush yes

# Logging Configuration
syslog-enabled yes
syslog-ident terrafusion-redis-replica
syslog-facility local0
loglevel notice
logfile /var/log/redis/redis-replica.log

# Connection Management
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security - Read-Only Commands Only
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command SHUTDOWN ""

# Advanced Configuration for Read Replicas
lua-time-limit 5000

# Read Replica Specific Optimizations
# Focus on serving read requests efficiently
# Optimized for negative cache lookups and miss sentinel checks