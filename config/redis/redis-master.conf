# TerraFusion OS Redis Master Configuration
# PhD-Level Caching Configuration for Government Property Assessment Systems
# Optimized for Negative Caching with Miss Sentinel Integration

# Network Configuration
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Government-Grade Security Configuration
requirepass TF_Redis_Master_2025_Secure!
masterauth TF_Redis_Master_2025_Secure!

# TLS Configuration for Government Compliance
tls-port 6380
tls-cert-file /etc/ssl/certs/redis-master.crt
tls-key-file /etc/ssl/private/redis-master.key
tls-ca-cert-file /etc/ssl/certs/redis-ca.crt
tls-dh-params-file /etc/ssl/certs/redis-dhparams.pem
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
tls-prefer-server-ciphers yes
tls-session-caching no
tls-session-cache-size 5000
tls-session-cache-timeout 60

# Memory Configuration - Optimized for Property Data Caching
maxmemory 4gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Miss Sentinel Optimization Settings
# Optimized for 30-second TTL miss sentinels with high throughput
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Persistence Configuration - Government Data Integrity
# AOF for transaction-level durability
appendonly yes
appendfilename "terrafusion-redis-master.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# RDB Configuration for Point-in-Time Recovery
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename terrafusion-redis-master.rdb
dir /data

# Replication Configuration
# Enable replication for high availability
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-slave-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 1mb
repl-backlog-ttl 3600
slave-priority 100
min-slaves-to-write 1
min-slaves-max-lag 10

# Negative Caching Optimization
# Custom configurations for miss sentinel pattern
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Performance Configuration
databases 16
maxclients 10000
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
notify-keyspace-events Ex

# Property Assessment Workload Optimization
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Harris PACS Integration Optimization
# Optimized for property lookup patterns
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
slave-lazy-flush yes

# Government Compliance Logging
syslog-enabled yes
syslog-ident terrafusion-redis-master
syslog-facility local0
loglevel notice
logfile /var/log/redis/redis-master.log

# Connection Management
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Advanced Configuration
lua-time-limit 5000
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG TF_CONFIG_SECURE_2025
rename-command EVAL TF_EVAL_SECURE_2025
rename-command DEBUG TF_DEBUG_SECURE_2025

# Negative Cache Specific Settings
