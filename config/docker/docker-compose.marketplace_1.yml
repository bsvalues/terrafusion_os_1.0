# 🏪 TerraFusion Marketplace Platform - Production Deployment
# Government Plugin Economy Infrastructure
# Revenue-Sharing Platform for County Collaboration

services:
  # TerraFusion Core API - Plugin Runtime Engine
  terrafusion-api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    image: terrafusion/os-api:1.0.0-production
    container_name: terrafusion-core-api
    restart: unless-stopped
    environment:
      # Core Configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      
      # Database Configuration
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-terrafusion_prod};Username=${POSTGRES_USER:-terrafusion};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      
      # County Configuration
      - County__Name=${COUNTY_NAME:-Benton County}
      - County__State=${COUNTY_STATE:-WA}
      - County__Code=${COUNTY_CODE:-053}
      
      # Security Configuration
      - Security__JwtSecret=${JWT_SECRET}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      
      # AI Swarm Configuration (1,008 Agents)
      - AI__SwarmSize=${AI_SWARM_SIZE:-1008}
      - AI__ProcessingMode=${AI_PROCESSING_MODE:-production}
      - AI__QuantumCoherence=${AI_QUANTUM_COHERENCE:-0.94}
      
      # MARKETPLACE PLATFORM CORE CONFIGURATION
      - Marketplace__PlatformMode=GovernmentEconomy
      - Marketplace__RevenueSharing__Platform=0.30
      - Marketplace__RevenueSharing__Developer=0.70
      - Marketplace__Security__SandboxMode=GovernmentGrade
      - Marketplace__Compliance__FISMA=true
      - Marketplace__Compliance__FedRAMP=true
      - Marketplace__CrossCounty__Enabled=true
      - Marketplace__PluginValidation__Government=strict
      
    ports:
      - "5000:8080"   # Core API HTTP
      - "5001:8080"   # Core API HTTP (Alt)
    volumes:
      - ./infrastructure/marketplace-enhanced:/app/marketplace-platform:ro
      - ./modules:/app/government-modules
      - marketplace_plugins:/app/marketplace/plugins
      - marketplace_revenue:/app/marketplace/revenue
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - government-plugin-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # TerraFusion Marketplace Platform - Government App Store
  marketplace-platform:
    build:
      context: ./infrastructure/marketplace-enhanced
      dockerfile: Dockerfile
    image: terrafusion/marketplace-platform:1.0.0
    container_name: terrafusion-marketplace-platform
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MARKETPLACE_MODE=GovernmentEconomy
      - MARKETPLACE_API_URL=http://terrafusion-core-api:8080/api/marketplace
      - MARKETPLACE_TITLE=TerraFusion Government Plugin Economy
      - REVENUE_SHARING_ENABLED=true
      - CROSS_COUNTY_COLLABORATION=true
      - GOVERNMENT_SECURITY_SANDBOX=true
      - PLUGIN_CERTIFICATION_REQUIRED=true
    ports:
      - "3000:3000"   # Government Marketplace Portal
    volumes:
      - ./infrastructure/marketplace-enhanced:/app:ro
    networks:
      - government-plugin-network
    depends_on:
      - terrafusion-api
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # Government Plugin Security Sandbox
  plugin-sandbox:
    image: alpine:3.18
    container_name: terrafusion-plugin-sandbox
    restart: unless-stopped
    environment:
      - SANDBOX_MODE=government
      - SECURITY_LEVEL=FISMA_HIGH
      - ISOLATION_LEVEL=complete
    volumes:
      - plugin_sandbox:/sandbox
      - ./security/sandbox-config:/config:ro
    networks:
      - government-plugin-network
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m

  # PostgreSQL Database - Government Grade
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres-gov
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-terrafusion_marketplace}
      - POSTGRES_USER=${POSTGRES_USER:-terrafusion}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gov:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - government-plugin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrafusion}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache - Plugin Performance
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis-cache
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_gov:/data
      - ./cache/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - government-plugin-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: [
      "redis-server",
      "/usr/local/etc/redis/redis.conf",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes",
      "--appendfsync", "everysec"
    ]

  # Monitoring Stack - Government Compliance
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus-gov
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_gov:/prometheus
    networks:
      - government-plugin-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  # Grafana Dashboards - Revenue Analytics
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana-gov
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data_gov:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - government-plugin-network
    depends_on:
      - prometheus

# Volumes - Government Plugin Economy Data
volumes:
  postgres_data_gov:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres-gov
  redis_data_gov:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis-gov
  marketplace_plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/marketplace/plugins
  marketplace_revenue:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/marketplace/revenue
  marketplace_analytics:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/marketplace/analytics
  plugin_sandbox:
    driver: local
  prometheus_data_gov:
    driver: local
  grafana_data_gov:
    driver: local

# Networks - Government Plugin Economy Network
networks:
  government-plugin-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
    driver_opts:
      com.docker.network.bridge.name: gov-plugin-net
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
