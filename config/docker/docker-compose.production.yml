# TerraFusion OS 1.0 - Production Docker Compose
# Government Operating System with 1,008 AI Agents
# FISMA/FedRAMP Compliant | Zero-Downtime Deployment

services:
  # TerraFusion OS Backend API - Government Grade with Marketplace
  terrafusion-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.production.simple
    image: terrafusion/os-api:1.0.0-production
    container_name: terrafusion-os-api
    restart: unless-stopped
    environment:
      # Core Configuration
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ASPNETCORE_HTTPS_PORT=8443
      - ASPNETCORE_HTTP_PORT=8080
      
      # Database Configuration
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-terrafusion_prod};Username=${POSTGRES_USER:-terrafusion};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD}
      
      # Government Configuration
      - County__Name=${COUNTY_NAME:-Benton County}
      - County__State=${COUNTY_STATE:-WA}
      - County__Code=${COUNTY_CODE:-053}
      
      # Harris PACS Integration
      - HarrisPacs__ConnectionString=${HARRIS_PACS_CONNECTION}
      - HarrisPacs__ApiEndpoint=${HARRIS_PACS_API_ENDPOINT}
      - HarrisPacs__ApiKey=${HARRIS_PACS_API_KEY}
      - HarrisPacs__Version=${HARRIS_PACS_VERSION:-12.4.7}
      
      # AI Swarm Configuration
      - AI__SwarmSize=${AI_SWARM_SIZE:-1008}
      - AI__ProcessingMode=${AI_PROCESSING_MODE:-production}
      - AI__QuantumCoherence=${AI_QUANTUM_COHERENCE:-0.94}
      - AI__ParallelProcessing=${AI_SWARM_PARALLEL_PROCESSING:-true}
      - AI__QuantumOptimization=${AI_SWARM_QUANTUM_OPTIMIZATION:-enabled}
      
      # Security Configuration
      - Security__JwtSecret=${JWT_SECRET}
      - Security__EncryptionKey=${ENCRYPTION_KEY}
      - Security__CertificatePassword=${CERT_PASSWORD}
      
      # Performance Configuration
      - Performance__MaxWorkerThreads=${MAX_WORKER_THREADS:-32}
      - Performance__MaxIOThreads=${MAX_IO_THREADS:-32}
      - Performance__ConnectionPoolSize=${CONNECTION_POOL_SIZE:-100}
      
      # Compliance Configuration
      - Compliance__FISMACompliance=${FISMA_COMPLIANCE:-true}
      - Compliance__AuditLogging=${AUDIT_LOGGING:-comprehensive}
      - Compliance__DataClassification=${DATA_CLASSIFICATION:-government_secure}
      - Compliance__RetentionDays=${RETENTION_DAYS:-2555}
      
      # Monitoring Configuration
      - Monitoring__PrometheusEnabled=${PROMETHEUS_ENABLED:-true}
      - Monitoring__HealthCheckInterval=30
      - Monitoring__MetricsEnabled=true
      
      # Logging Configuration
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.AspNetCore=Warning
      - Logging__LogLevel__TerraFusion=Debug
      - Serilog__MinimumLevel=Information
      
      # Marketplace Configuration
      - Marketplace__Enabled=${MARKETPLACE_ENABLED:-true}
      - Marketplace__BaseUrl=${MARKETPLACE_BASE_URL:-/api/marketplace}
      - Marketplace__PluginDirectory=/app/marketplace/plugins
      - Marketplace__ConfigPath=/app/marketplace/marketplace-config.json
      - Marketplace__CacheDirectory=/app/marketplace/cache
      - Marketplace__AutoLoadPlugins=${MARKETPLACE_AUTO_LOAD:-true}
      - Marketplace__HotReloadEnabled=${MARKETPLACE_HOT_RELOAD:-true}
      - Marketplace__MaxPluginSize=${MARKETPLACE_MAX_PLUGIN_SIZE:-50MB}
      - Marketplace__RevenueCommission=${MARKETPLACE_COMMISSION:-0.30}
      - Marketplace__LicenseValidation=${MARKETPLACE_LICENSE_VALIDATION:-true}
      
    ports:
      - "5000:8080"   # HTTP
      - "5001:8443"   # HTTPS
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - api_temp:/app/temp
      # Marketplace volumes
      - ./infrastructure/marketplace-enhanced:/app/marketplace:ro
      - ./modules:/app/modules
      - marketplace_plugins:/app/marketplace/plugins
      - marketplace_cache:/app/marketplace/cache
    networks:
      - terrafusion-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=100m

  # TerraFusion Marketplace Frontend - Government Module Store
  marketplace-frontend:
    build:
      context: ./infrastructure/marketplace-enhanced
      dockerfile: Dockerfile
    image: terrafusion/marketplace-frontend:1.0.0
    container_name: terrafusion-marketplace-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MARKETPLACE_API_URL=http://terrafusion-api:8080/api/marketplace
      - MARKETPLACE_TITLE=TerraFusion Government Marketplace
      - MARKETPLACE_VERSION=1.0.0
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/marketplace-enhanced:/app:ro
      - marketplace_cache:/app/cache
    networks:
      - terrafusion-production
    depends_on:
      - terrafusion-api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database - Government Grade
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-terrafusion_prod}
      - POSTGRES_USER=${POSTGRES_USER:-terrafusion}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/backups:/backups
      - postgres_logs:/var/log/postgresql
    networks:
      - terrafusion-production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrafusion} -d ${POSTGRES_DB:-terrafusion_prod}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    security_opt:
      - no-new-privileges:true
    command: [
      "postgres",
      "-c", "max_connections=200",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=1GB",
      "-c", "maintenance_work_mem=64MB",
      "-c", "checkpoint_completion_target=0.9",
      "-c", "wal_buffers=16MB",
      "-c", "default_statistics_target=100",
      "-c", "random_page_cost=1.1",
      "-c", "effective_io_concurrency=200",
      "-c", "work_mem=4MB",
      "-c", "min_wal_size=1GB",
      "-c", "max_wal_size=4GB",
      "-c", "logging_collector=on",
      "-c", "log_destination=stderr",
      "-c", "log_line_prefix=%m [%p] %q%u@%d "
    ]

  # Redis Cache - High Performance
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis-prod
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_logs:/var/log/redis
    networks:
      - terrafusion-production
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--save", "900", "1",
      "--save", "300", "10",
      "--save", "60", "10000",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--tcp-keepalive", "300",
      "--timeout", "0",
      "--tcp-backlog", "511"
    ]

  # Monitoring Stack - Production Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus-prod
    restart: unless-stopped
    environment:
      - PROMETHEUS_RETENTION_TIME=15d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terrafusion-production
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Grafana Dashboard - Government Monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana-prod
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - terrafusion-production
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

# Volumes - Persistent Government Data
volumes:
  postgres_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/postgres
  redis_data_prod:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/redis
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  postgres_logs:
    driver: local
  redis_logs:
    driver: local
  api_temp:
    driver: local
  ai_temp:
    driver: local
  # Marketplace volumes
  marketplace_plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/marketplace/plugins
  marketplace_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH:-./data}/marketplace/cache

# Networks - Secure Government Network
networks:
  terrafusion-production:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
    driver_opts:
      com.docker.network.bridge.name: terrafusion-prod
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
