[package]
name = "terrafusion-os-core"
version = "1.0.0"
edition = "2021"
description = "TerraFusion OS Core - Government Operating System Kernel (Minimal Test)"
authors = ["TerraFusion Elite Government OS Team"]
license = "PROPRIETARY"

[dependencies]
# Minimal web framework for testing
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"
