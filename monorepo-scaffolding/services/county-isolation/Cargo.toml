[package]
name = "terrafusion-county-isolation"
version = "1.0.0"
edition = "2021"
description = "TerraFusion County Isolation Service - Sovereign Data Boundaries"
authors = ["TerraFusion Elite Government OS Team"]
license = "PROPRIETARY"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-br"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Database with isolation
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# Authentication & Security
jsonwebtoken = "9.0"
bcrypt = "0.15"
ring = "0.17"

# Logging & Telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.23"
metrics = "0.23"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities and regex
futures = "0.3"
regex = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# API documentation
utoipa = { version = "4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.0", features = ["axum"] }

# Windows-Compatible Government Compliance
windows-service = "0.7"
windows = { version = "0.58", features = ["Win32_System_Services"] }

[dev-dependencies]
tokio-test = "0.4"
