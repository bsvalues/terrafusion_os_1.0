apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion
  labels:
    name: terrafusion
    tier: government-os
    compliance: fisma-high
---
# PostgreSQL Database ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: terrafusion
data:
  POSTGRES_DB: terrafusion
  POSTGRES_USER: terrafusion
  postgresql.conf: |
    # TerraFusion OS - Quantum-Enhanced PostgreSQL Configuration
    # Championship Performance Optimization

    # Connection Settings
    max_connections = 500
    superuser_reserved_connections = 3

    # Memory Configuration - Championship Level
    shared_buffers = 2GB
    effective_cache_size = 8GB
    work_mem = 64MB
    maintenance_work_mem = 512MB

    # Checkpoint Configuration - Quantum Optimized
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min
    max_wal_size = 4GB
    min_wal_size = 1GB

    # Query Optimization - Championship Performance
    random_page_cost = 1.1
    effective_io_concurrency = 300
    default_statistics_target = 500

    # Logging - FISMA Compliance
    log_destination = 'stderr'
    logging_collector = on
    log_directory = 'logs'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_statement = 'all'
    log_duration = on
    log_min_duration_statement = 1000

    # Lock Management - Government Grade
    deadlock_timeout = 1s
    max_locks_per_transaction = 256

    # Vacuum & Autovacuum - Quantum Maintenance
    autovacuum = on
    autovacuum_max_workers = 8
    autovacuum_naptime = 30s

    # Replication - High Availability
    wal_level = replica
    max_wal_senders = 10
    max_replication_slots = 10
---
# Redis Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: terrafusion
data:
  redis.conf: |
    # TerraFusion OS - Quantum-Enhanced Redis Configuration
    # Championship Performance Caching

    # Memory Management - Championship Level
    maxmemory 4gb
    maxmemory-policy allkeys-lru

    # Persistence - Government Grade
    save 900 1
    save 300 10
    save 60 10000
    rdbcompression yes
    rdbchecksum yes

    # Network - Quantum Optimized
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511

    # Logging - FISMA Compliance
    loglevel notice
    logfile /var/log/redis/redis-server.log

    # Performance - Championship Targets
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64

    # Security - Government Standards
    protected-mode yes
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command DEBUG ""
---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: terrafusion
  labels:
    app: postgres
    tier: database
    compliance: fisma-high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: database
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config-volume
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - terrafusion
                - -d
                - terrafusion
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - terrafusion
                - -d
                - terrafusion
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: '2Gi'
              cpu: '1'
            limits:
              memory: '4Gi'
              cpu: '2'
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-config-volume
          configMap:
            name: postgres-config
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: terrafusion
  labels:
    app: redis
    tier: cache
    compliance: fisma-high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: cache
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - /etc/redis/redis.conf
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config-volume
              mountPath: /etc/redis/redis.conf
              subPath: redis.conf
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: '512Mi'
              cpu: '0.5'
            limits:
              memory: '2Gi'
              cpu: '1'
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: redis-config-volume
          configMap:
            name: redis-config
---
# OS Core Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-core
  namespace: terrafusion
  labels:
    app: os-core
    tier: system-kernel
    compliance: fisma-high
spec:
  replicas: 3
  selector:
    matchLabels:
      app: os-core
  template:
    metadata:
      labels:
        app: os-core
        tier: system-kernel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: os-core
          image: terrafusion/os-core:latest
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: 'info'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-secret
                  key: url
            - name: REDIS_URL
              value: 'redis://redis:6379'
            - name: QUANTUM_FACTOR
              value: '951'
            - name: CONSCIOUSNESS_LEVEL
              value: '8'
            - name: SERVER_PORT
              value: '8080'
            - name: GOVERNMENT_COMPLIANCE
              value: 'true'
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: '512Mi'
              cpu: '0.5'
            limits:
              memory: '1Gi'
              cpu: '1'
