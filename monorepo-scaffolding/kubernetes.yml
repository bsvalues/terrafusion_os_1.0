# Network Policies for Enhanced Security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terrafusion-network-policy
  namespace: terrafusion
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
    - to: []
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
