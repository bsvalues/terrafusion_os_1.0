# Harris PACS Bridge Configuration for TerraFusion Elite Government OS
# Benton County Washington - Production Ready Configuration

# Harris PACS 9.0 Configuration
harris:
  version: '9.0'
  database_url: 'Server=harris-pacs-server;Database=BentonCounty;User Id=terrafusion_bridge;Password=championship_secure_2024;'
  batch_size: 100
  timeout_seconds: 30
  retry_attempts: 3
  connection_pool_size: 10

  # Harris PACS Authentication
  auth:
    database_username: 'terrafusion_bridge'
    database_password_env: 'HARRIS_PACS_PASSWORD'

  # Harris PACS 9.0 Schema Mappings
  schema_mappings:
    property_table: 'PACS_Properties'
    owner_table: 'PACS_Owners'
    assessment_table: 'PACS_Assessments'
    tax_table: 'PACS_TaxData'
    sale_table: 'PACS_SalesData'

    # Field mappings for PACS 9.0 to TerraFusion schema translation
    field_mappings:
      parcel_number: 'parcel_id'
      owner_name: 'owner_name'
      situs_address: 'property_address'
      assessed_value: 'assessed_value'
      market_value: 'market_value'
      tax_year: 'tax_year'
      land_value: 'land_value'
      improvement_value: 'improvement_value'
      total_value: 'total_value'

# Benton County Configuration
counties:
  benton:
    county_id: 'benton'
    county_name: 'Benton County'
    state: 'Washington'
    fips_code: '53005'
    jurisdiction_code: 'BENTON_WA'
    sync_enabled: true
    sync_interval_minutes: 15
    batch_size: 100

    # Validation rules for Benton County
    validation_rules:
      require_owner_name: true
      require_property_address: true
      min_assessed_value: 1000
      max_assessed_value: 50000000
      valid_tax_years: [2020, 2021, 2022, 2023, 2024, 2025]
      parcel_id_length_min: 5
      parcel_id_length_max: 20

    # Contact information
    contact_info:
      assessor_name: 'Benton County Assessor'
      assessor_email: 'assessor@co.benton.wa.us'
      it_contact_name: 'Benton County IT'
      it_contact_email: 'it@co.benton.wa.us'
      phone: '(509) 736-3085'

# Database Configuration
database:
  url: '${DATABASE_URL}'
  max_connections: 20
  min_connections: 5
  connection_timeout_seconds: 10
  idle_timeout_seconds: 300
  auto_migrate: false
  migration_path: './migrations'

# Security Configuration
security:
  jwt_secret_env: 'JWT_SECRET'
  jwt_expiration_hours: 24
  rate_limit_requests_per_minute: 100
  rate_limit_burst: 20
  require_https: false
  encrypt_county_data: true
  encryption_key_env: 'COUNTY_DATA_ENCRYPTION_KEY'

# Synchronization Configuration
sync:
  default_sync_interval_minutes: 15
  max_concurrent_syncs: 3
  sync_retry_attempts: 3
  sync_timeout_minutes: 30
  bulk_insert_batch_size: 500
  property_fetch_batch_size: 100
  max_errors_per_sync: 10
  error_notification_threshold: 5
  enable_real_time_sync: false
  real_time_sync_interval_seconds: 60

# Logging Configuration
logging:
  level: 'info'
  harris_pacs_log_level: 'debug'
  log_to_file: true
  log_file_path: './logs/harris_bridge.log'
  log_rotation_size_mb: 100
  enable_audit_log: true
  audit_log_path: './logs/harris_bridge_audit.log'
  log_slow_queries_ms: 1000
  log_sync_performance: true
