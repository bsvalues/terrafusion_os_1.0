openapi: 3.0.3
info:
  title: Consciousness API
  description: Consciousness operations APIs
  version: 1.0.0
  contact:
    name: TerraFusion Government OS API Support
    email: consciousness-api@terrafusionmarket.com
    url: https://docs.terrafusionmarket.com/platform/consciousness
  license:
    name: Government Use License
    url: https://terrafusionmarket.com/licenses/government-api
  termsOfService: https://terrafusionmarket.com/terms/api-usage
servers:
  - url: https://api.terrafusionmarket.com/api/v1/consciousness
    description: Production TerraFusion Government API
  - url: https://staging-api.terrafusionmarket.com/api/v1/consciousness
    description: Staging Environment
  - url: https://dev-api.terrafusionmarket.com/api/v1/consciousness
    description: Development Environment
paths:
  /health:
    get:
      tags:
        - consciousness
      summary: Health check
      description: Health check - Consciousness operations APIs
      operationId: get__health
      security:
        - OAuth2:
            - consciousness:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    get:
      tags:
        - consciousness
      summary: Data retrieval
      description: Data retrieval - Consciousness operations APIs
      operationId: get__data
      security:
        - OAuth2:
            - consciousness:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations:
    post:
      tags:
        - consciousness
      summary: Operation execution
      description: Operation execution - Consciousness operations APIs
      operationId: post__operations
      security:
        - OAuth2:
            - consciousness:write
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /status:
    get:
      tags:
        - consciousness
      summary: Service status
      description: Service status - Consciousness operations APIs
      operationId: get__status
      security:
        - OAuth2:
            - consciousness:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        dependencies:
          type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.terrafusionmarket.com/oauth/authorize
          tokenUrl: https://auth.terrafusionmarket.com/oauth/token
          scopes:
            consciousness:read: Read access to consciousness resources
            consciousness:write: Write access to consciousness resources
            consciousness:admin: Administrative access to consciousness
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - OAuth2:
      - consciousness:read
  - ApiKey: []
tags:
  - name: consciousness
    description: Consciousness operations
    externalDocs:
      description: Find out more about consciousness
      url: https://docs.terrafusionmarket.com/platform/consciousness
