openapi: 3.0.3
info:
  title: Government Core API
  description: Government Core operations APIs
  version: 1.0.0
  contact:
    name: TerraFusion Government OS API Support
    email: government-core-api@terrafusion.gov
    url: https://docs.terrafusion.gov/marketplace/government-core
  license:
    name: Government Use License
    url: https://terrafusion.gov/licenses/government-api
  termsOfService: https://terrafusion.gov/terms/api-usage
servers:
- url: https://api.terrafusion.gov/api/v1/government-core
  description: Production TerraFusion Government API
- url: https://staging-api.terrafusion.gov/api/v1/government-core
  description: Staging Environment
- url: https://dev-api.terrafusion.gov/api/v1/government-core
  description: Development Environment
paths:
  /health:
    get:
      tags:
      - government-core
      summary: Health check
      description: Health check - Government Core operations APIs
      operationId: get__health
      security:
      - OAuth2:
        - government-core:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    get:
      tags:
      - government-core
      summary: Data retrieval
      description: Data retrieval - Government Core operations APIs
      operationId: get__data
      security:
      - OAuth2:
        - government-core:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations:
    post:
      tags:
      - government-core
      summary: Operation execution
      description: Operation execution - Government Core operations APIs
      operationId: post__operations
      security:
      - OAuth2:
        - government-core:write
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /status:
    get:
      tags:
      - government-core
      summary: Service status
      description: Service status - Government Core operations APIs
      operationId: get__status
      security:
      - OAuth2:
        - government-core:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        dependencies:
          type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.terrafusion.gov/oauth/authorize
          tokenUrl: https://auth.terrafusion.gov/oauth/token
          scopes:
            government-core:read: Read access to government-core resources
            government-core:write: Write access to government-core resources
            government-core:admin: Administrative access to government-core
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
- OAuth2:
  - government-core:read
- ApiKey: []
tags:
- name: government-core
  description: Government Core operations
  externalDocs:
    description: Find out more about government-core
    url: https://docs.terrafusion.gov/marketplace/government-core
