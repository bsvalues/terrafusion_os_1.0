openapi: 3.0.3
info:
  title: Store API
  description: Store operations APIs
  version: 1.0.0
  contact:
    name: TerraFusion Government OS API Support
    email: store-api@terrafusionmarket.com
    url: https://docs.terrafusionmarket.com/marketplace/store
  license:
    name: Government Use License
    url: https://terrafusionmarket.com/licenses/government-api
  termsOfService: https://terrafusionmarket.com/terms/api-usage
servers:
  - url: https://api.terrafusionmarket.com/api/v1/store
    description: Production TerraFusion Government API
  - url: https://staging-api.terrafusionmarket.com/api/v1/store
    description: Staging Environment
  - url: https://dev-api.terrafusionmarket.com/api/v1/store
    description: Development Environment
paths:
  /health:
    get:
      tags:
        - store
      summary: Health check
      description: Health check - Store operations APIs
      operationId: get__health
      security:
        - OAuth2:
            - store:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    get:
      tags:
        - store
      summary: Data retrieval
      description: Data retrieval - Store operations APIs
      operationId: get__data
      security:
        - OAuth2:
            - store:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations:
    post:
      tags:
        - store
      summary: Operation execution
      description: Operation execution - Store operations APIs
      operationId: post__operations
      security:
        - OAuth2:
            - store:write
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /status:
    get:
      tags:
        - store
      summary: Service status
      description: Service status - Store operations APIs
      operationId: get__status
      security:
        - OAuth2:
            - store:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        dependencies:
          type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.terrafusionmarket.com/oauth/authorize
          tokenUrl: https://auth.terrafusionmarket.com/oauth/token
          scopes:
            store:read: Read access to store resources
            store:write: Write access to store resources
            store:admin: Administrative access to store
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
  - OAuth2:
      - store:read
  - ApiKey: []
tags:
  - name: store
    description: Store operations
    externalDocs:
      description: Find out more about store
      url: https://docs.terrafusionmarket.com/marketplace/store
