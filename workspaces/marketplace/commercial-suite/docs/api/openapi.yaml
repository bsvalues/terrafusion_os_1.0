openapi: 3.0.3
info:
  title: Commercial Suite API
  description: Commercial Suite operations APIs
  version: 1.0.0
  contact:
    name: TerraFusion Government OS API Support
    email: commercial-suite-api@terrafusion.gov
    url: https://docs.terrafusion.gov/marketplace/commercial-suite
  license:
    name: Government Use License
    url: https://terrafusion.gov/licenses/government-api
  termsOfService: https://terrafusion.gov/terms/api-usage
servers:
- url: https://api.terrafusion.gov/api/v1/commercial-suite
  description: Production TerraFusion Government API
- url: https://staging-api.terrafusion.gov/api/v1/commercial-suite
  description: Staging Environment
- url: https://dev-api.terrafusion.gov/api/v1/commercial-suite
  description: Development Environment
paths:
  /health:
    get:
      tags:
      - commercial-suite
      summary: Health check
      description: Health check - Commercial Suite operations APIs
      operationId: get__health
      security:
      - OAuth2:
        - commercial-suite:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    get:
      tags:
      - commercial-suite
      summary: Data retrieval
      description: Data retrieval - Commercial Suite operations APIs
      operationId: get__data
      security:
      - OAuth2:
        - commercial-suite:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations:
    post:
      tags:
      - commercial-suite
      summary: Operation execution
      description: Operation execution - Commercial Suite operations APIs
      operationId: post__operations
      security:
      - OAuth2:
        - commercial-suite:write
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /status:
    get:
      tags:
      - commercial-suite
      summary: Service status
      description: Service status - Commercial Suite operations APIs
      operationId: get__status
      security:
      - OAuth2:
        - commercial-suite:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        dependencies:
          type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.terrafusion.gov/oauth/authorize
          tokenUrl: https://auth.terrafusion.gov/oauth/token
          scopes:
            commercial-suite:read: Read access to commercial-suite resources
            commercial-suite:write: Write access to commercial-suite resources
            commercial-suite:admin: Administrative access to commercial-suite
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
- OAuth2:
  - commercial-suite:read
- ApiKey: []
tags:
- name: commercial-suite
  description: Commercial Suite operations
  externalDocs:
    description: Find out more about commercial-suite
    url: https://docs.terrafusion.gov/marketplace/commercial-suite
