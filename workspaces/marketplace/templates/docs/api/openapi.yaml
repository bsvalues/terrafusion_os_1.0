openapi: 3.0.3
info:
  title: Templates API
  description: Templates operations APIs
  version: 1.0.0
  contact:
    name: TerraFusion Government OS API Support
    email: templates-api@terrafusion.gov
    url: https://docs.terrafusion.gov/marketplace/templates
  license:
    name: Government Use License
    url: https://terrafusion.gov/licenses/government-api
  termsOfService: https://terrafusion.gov/terms/api-usage
servers:
- url: https://api.terrafusion.gov/api/v1/templates
  description: Production TerraFusion Government API
- url: https://staging-api.terrafusion.gov/api/v1/templates
  description: Staging Environment
- url: https://dev-api.terrafusion.gov/api/v1/templates
  description: Development Environment
paths:
  /health:
    get:
      tags:
      - templates
      summary: Health check
      description: Health check - Templates operations APIs
      operationId: get__health
      security:
      - OAuth2:
        - templates:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /data:
    get:
      tags:
      - templates
      summary: Data retrieval
      description: Data retrieval - Templates operations APIs
      operationId: get__data
      security:
      - OAuth2:
        - templates:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /operations:
    post:
      tags:
      - templates
      summary: Operation execution
      description: Operation execution - Templates operations APIs
      operationId: post__operations
      security:
      - OAuth2:
        - templates:write
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /status:
    get:
      tags:
      - templates
      summary: Service status
      description: Service status - Templates operations APIs
      operationId: get__status
      security:
      - OAuth2:
        - templates:read
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    HealthCheck:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - degraded
          - unhealthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
        dependencies:
          type: object
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.terrafusion.gov/oauth/authorize
          tokenUrl: https://auth.terrafusion.gov/oauth/token
          scopes:
            templates:read: Read access to templates resources
            templates:write: Write access to templates resources
            templates:admin: Administrative access to templates
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
security:
- OAuth2:
  - templates:read
- ApiKey: []
tags:
- name: templates
  description: Templates operations
  externalDocs:
    description: Find out more about templates
    url: https://docs.terrafusion.gov/marketplace/templates
