<!DOCTYPE html>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oriented Imagery Viewer</title>
  <style>
    html,
    body,
    #orientedImageryViewer {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }

    body.offline #orientedImageryViewer {
      display: none;
    }

    * {
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .esri-oriented-imagery-viewer--docked {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      top: 0px;
      bottom: 0px;
    }

    body.offline {
      background: #f8f8f8;
      color: #151515;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 24px;
    }

    body.offline.calcite-mode-dark {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #353535;
      color: #ffffff;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 24px;
    }
  </style>
  <link disabled id="arcgis-maps-sdk-theme-dark" rel="stylesheet"
    href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />

  <link disabled id="arcgis-maps-sdk-theme-light" rel="stylesheet"
    href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <script>
    var locationPath = location.pathname.replace(/\/[^/]*$/, "");
    function setMessage() {
      window.addEventListener("setViewerMessage", window.setViewerMessage);
      window.setViewerMessage = function (key, message) {
        document.body.classList.add("offline");
        const offlineDiv = document.createElement("div");
        offlineDiv.classList.add("esri-oriented-imagery-viewer--offline");
        offlineDiv.innerText = message;
        document.body.appendChild(offlineDiv);
        window.removeEventListener(
          "setViewerMessage",
          window.setViewerMessage
        );
      };

      window.chrome.webview.hostObjects.interopObject.GetMessage(
        "NoInternet"
      );
    }
    window.dojoConfig = {
      packages: [
        {
          name: "root",
          location: locationPath,
        },
      ],
    };
  </script>
  <script src="https://js.arcgis.com/4.30" onerror="setMessage(event)"></script>
</head>

<body>
  <div id="orientedImageryViewer"></div>
  <script>
    require(["root/interop"]);
  </script>
</body>

</html>
