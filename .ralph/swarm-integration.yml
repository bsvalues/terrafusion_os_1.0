# TerraFusion Swarm Integration: QC-019 Performance Team
# ========================================================
# This file defines how Ralph Loop coordinates with the AI Swarm
# Specifically: QC-019 (Performance Team, 50 agents)

schema_version: '1.0'
last_updated: '2026-01-30'

# ============================================================================
# SWARM HIERARCHY
# ============================================================================
hierarchy:
  supreme_orchestrator:
    id: 'SO-001'
    name: 'Claude Supreme Orchestrator'
    role: 'Final Reviewer & Quality Gate Validator'
    capabilities:
      - strategic_planning
      - phase_gate_approval
      - go_nogo_decisions

  ai_council:
    size: 5
    role: 'Strategic Oversight'
    members:
      - id: 'AC-001'
        specialization: 'Architecture'
      - id: 'AC-002'
        specialization: 'Security'
      - id: 'AC-003'
        specialization: 'Compliance'
      - id: 'AC-004'
        specialization: 'Performance'
      - id: 'AC-005'
        specialization: 'User Experience'

  quantum_commanders:
    total: 20

    # QC-019 is assigned to Ralph Loop
    QC-019:
      name: 'Performance Team'
      size: 50
      focus: 'System optimization'
      ralph_integration: true

      specializations:
        frontend_performance:
          agents: 15
          tasks:
            - 'LCP optimization'
            - 'Bundle size reduction'
            - 'Waterfall elimination'
            - 'React render optimization'

        backend_optimization:
          agents: 15
          tasks:
            - 'API response time'
            - 'Database query optimization'
            - 'Caching strategies'
            - 'Memory management'

        bundle_analysis:
          agents: 10
          tasks:
            - 'Tree shaking validation'
            - 'Code splitting'
            - 'Dynamic imports'
            - 'Dependency audit'

        waterfall_elimination:
          agents: 10
          tasks:
            - 'Sequential await detection'
            - 'Promise.all conversion'
            - 'Parallel data fetching'
            - 'Request batching'

# ============================================================================
# RALPH LOOP INTEGRATION
# ============================================================================
ralph_integration:
  enabled: true
  commander: 'QC-019'

  task_distribution:
    # How Ralph assigns tasks to QC-019 specialists
    waterfall_detection:
      assignee: 'waterfall_elimination'
      priority: 'critical'
      vercel_rules: ['1.1', '1.2', '1.3', '1.4']

    bundle_optimization:
      assignee: 'bundle_analysis'
      priority: 'critical'
      vercel_rules: ['2.1', '2.2', '2.3', '2.4']

    frontend_perf:
      assignee: 'frontend_performance'
      priority: 'high'
      vercel_rules: ['3.1', '3.2', '4.1', '4.2']

    backend_perf:
      assignee: 'backend_optimization'
      priority: 'high'
      codex_metrics: ['apiResponseTime', 'databaseQueryTime']

  coordination_protocol:
    name: 'QUANTUM_CONSENSUS'
    accuracy_target: 0.999
    latency_target_ms: 1

    steps:
      1: 'Ralph Loop detects Codex score < 11.5'
      2: 'Ralph queries perf-skill-audit for findings'
      3: 'Ralph assigns tasks to QC-019 specialists'
      4: 'Specialists execute within governance scope'
      5: 'Changes pass required gates'
      6: 'Ralph commits with evidence'
      7: 'Codex recalculates score'
      8: 'Repeat until Divine Balance (≥11.5)'

# ============================================================================
# TASK TEMPLATES FOR QC-019
# ============================================================================
task_templates:
  waterfall_fix:
    title: 'Eliminate Sequential Awaits'
    scope:
      - 'os-platform/core/pilot/**'
      - 'frontend-v2/shell/src/**'
    pattern_to_find: |
      // ANTI-PATTERN: Sequential awaits
      const a = await fetchA();
      const b = await fetchB();
      const c = await fetchC();
    pattern_to_apply: |
      // OPTIMIZED: Parallel fetching
      const [a, b, c] = await Promise.all([
        fetchA(),
        fetchB(),
        fetchC()
      ]);
    verification:
      - 'pnpm run type-check'
      - 'node --test os-platform/core/tests/phase83-tools.test.mjs'

  bundle_split:
    title: 'Implement Code Splitting'
    scope:
      - 'frontend-v2/shell/src/**'
    pattern_to_find: |
      // ANTI-PATTERN: Static import of heavy module
      import { HeavyComponent } from './HeavyComponent';
    pattern_to_apply: |
      // OPTIMIZED: Dynamic import with lazy loading
      const HeavyComponent = lazy(() => import('./HeavyComponent'));
    verification:
      - 'pnpm run build'
      - 'Check bundle size delta'

  cache_implementation:
    title: 'Add React.cache() for Deduplication'
    scope:
      - 'os-platform/core/pilot/**'
    pattern_to_find: |
      // ANTI-PATTERN: Uncached data fetch
      async function getData() {
        return await fetch('/api/data');
      }
    pattern_to_apply: |
      // OPTIMIZED: Cached and deduplicated
      const getData = cache(async () => {
        return await fetch('/api/data');
      });
    verification:
      - 'pnpm run type-check'

# ============================================================================
# REPORTING
# ============================================================================
reporting:
  format: 'json'
  output_path: 'logs/ralph/swarm-activity.json'

  metrics:
    - tasks_assigned
    - tasks_completed
    - tasks_failed
    - codex_score_delta
    - time_to_divine_balance

  integration:
    codex_api: '/api/codex/ultimate-power'
    perf_audit: 'tools/registry/perf-skill-audit/out/perf-audit-report.json'

# ============================================================================
# EMERGENCY PROTOCOLS
# ============================================================================
emergency:
  halt_triggers:
    - 'Codex score drops below 6.0'
    - 'More than 3 consecutive gate failures'
    - 'Modification detected in forbidden paths'

  escalation:
    P0:
      description: 'Critical system degradation'
      action: 'Halt Ralph Loop, notify Supreme Orchestrator'
      contacts: ['@ai-infrastructure-team', '@government-leads']

    P1:
      description: 'Significant performance regression'
      action: 'Pause optimization, review recent changes'
      contacts: ['@platform-team']
