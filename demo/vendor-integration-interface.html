<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion cOS - Vendor Integration Interface</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tf-gradient { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .tf-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .tf-sidebar { background: rgba(30, 41, 59, 0.98); backdrop-filter: blur(20px); }
        .sync-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .status-indicator {
            animation: statusBlink 3s ease-in-out infinite;
        }
        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .metric-card:hover { transform: translateY(-2px); transition: all 0.3s ease; }
        .vendor-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }
        .vendor-card:hover {
            transform: scale(1.02);
            border-color: #667eea;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const {
            Terminal, Database, Map, Bot, Globe, BarChart3, GitBranch, Settings,
            Play, Save, FolderOpen, Search, Zap, Shield, Code, Package, Brain,
            Activity, Network, Cpu, HardDrive, Security, Cloud, Workflow,
            Container, Layers, Server, MonitorSpeaker, MessageSquare, Sparkles,
            FileText, RefreshCw, CheckCircle, AlertCircle, Lightbulb, Wand2,
            ExternalLink, Users, Gauge, TrendingUp, Clock, AlertTriangle
        } = lucide;

        // TerraFusion Sync Integration Hook (connects to existing service)
        const useTerraFusionSync = () => {
            const [syncStatus, setSyncStatus] = useState({
                isActive: false,
                currentOperation: 'Idle',
                lastSyncTime: null,
                activeConnections: 0,
                metrics: {}
            });

            const [legacySystems, setLegacySystems] = useState([]);
            const [counties, setCounties] = useState([]);
            const [recentEvents, setRecentEvents] = useState([]);

            useEffect(() => {
                // Connect to existing TerraFusion Sync API
                const fetchSyncStatus = async () => {
                    try {
                        // This connects to the real TerraFusionSyncIntegrationService
                        const response = await fetch('/api/sync/status');
                        const status = await response.json();
                        setSyncStatus(status);
                    } catch (error) {
                        console.log('Demo mode - using simulated data');
                        setSyncStatus({
                            isActive: true,
                            currentOperation: 'Real-time synchronization active',
                            lastSyncTime: new Date().toISOString(),
                            activeConnections: 3,
                            metrics: {
                                TotalSystems: 3,
                                ActiveCounties: 1,
                                UptimeSeconds: 14520
                            }
                        });
                    }
                };

                const fetchLegacySystems = async () => {
                    try {
                        const response = await fetch('/api/sync/legacy-systems');
                        const systems = await response.json();
                        setLegacySystems(systems);
                    } catch (error) {
                        // Demo data matching real service configuration
                        setLegacySystems([
                            {
                                systemId: 'harris_pacs_12_4_7',
                                systemName: 'Harris PACS v12.4.7',
                                systemType: 'harris_pacs',
                                version: 'v12.4.7',
                                isAvailable: true,
                                isConfigured: true,
                                lastHealthCheck: new Date().toISOString(),
                                capabilities: {
                                    AutoSync: true,
                                    SyncInterval: 15,
                                    HasApiEndpoint: true
                                }
                            },
                            {
                                systemId: 'tyler_iasworld',
                                systemName: 'Tyler iasWorld',
                                systemType: 'tyler_iasworld',
                                version: 'v8.2.1',
                                isAvailable: true,
                                isConfigured: false,
                                lastHealthCheck: new Date().toISOString(),
                                capabilities: {
                                    AutoSync: false,
                                    SyncInterval: 60,
                                    HasApiEndpoint: false
                                }
                            },
                            {
                                systemId: 'aumentum_cama',
                                systemName: 'Aumentum CAMA',
                                systemType: 'aumentum_cama',
                                version: 'v7.1.3',
                                isAvailable: false,
                                isConfigured: false,
                                lastHealthCheck: new Date(Date.now() - 3600000).toISOString(),
                                capabilities: {
                                    AutoSync: false,
                                    SyncInterval: 120,
                                    HasApiEndpoint: true
                                }
                            }
                        ]);
                    }
                };

                const fetchCounties = async () => {
                    try {
                        const response = await fetch('/api/sync/counties');
                        const countyData = await response.json();
                        setCounties(countyData);
                    } catch (error) {
                        // Demo data matching real service
                        setCounties([
                            {
                                countyName: 'Benton',
                                state: 'WA',
                                legacySystemId: 'harris_pacs_12_4_7',
                                legacySystemType: 'harris_pacs',
                                isConfigured: true,
                                isActive: true,
                                totalParcels: 89247,
                                lastSync: new Date().toISOString(),
                                configuration: {
                                    SyncInterval: 15,
                                    EnableAutoSync: true
                                }
                            }
                        ]);
                    }
                };

                const fetchRecentEvents = async () => {
                    try {
                        const response = await fetch('/api/sync/events');
                        const events = await response.json();
                        setRecentEvents(events);
                    } catch (error) {
                        // Demo events matching real service structure
                        setRecentEvents([
                            {
                                timestamp: new Date().toISOString(),
                                eventType: 'Completed',
                                countyName: 'Benton',
                                legacySystem: 'Harris PACS v12.4.7',
                                message: 'Sync completed successfully',
                                details: {
                                    Duration: '00:00:45',
                                    RecordsProcessed: 1200,
                                    BatchNumber: 1
                                }
                            },
                            {
                                timestamp: new Date(Date.now() - 900000).toISOString(),
                                eventType: 'Warning',
                                countyName: 'Benton',
                                legacySystem: 'Harris PACS v12.4.7',
                                message: 'Slow response detected',
                                details: {
                                    Duration: '00:01:20',
                                    RecordsProcessed: 1100,
                                    BatchNumber: 2
                                }
                            }
                        ]);
                    }
                };

                fetchSyncStatus();
                fetchLegacySystems();
                fetchCounties();
                fetchRecentEvents();

                // Update every 30 seconds
                const interval = setInterval(() => {
                    fetchSyncStatus();
                    fetchRecentEvents();
                }, 30000);

                return () => clearInterval(interval);
            }, []);

            const startSync = async (countyName) => {
                try {
                    await fetch('/api/sync/start', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ countyName })
                    });
                } catch (error) {
                    console.log('Demo mode - simulating sync start');
                }
            };

            return {
                syncStatus,
                legacySystems,
                counties,
                recentEvents,
                startSync
            };
        };

        // Vendor Integration Status Component
        const VendorIntegrationStatus = () => {
            const { syncStatus, legacySystems, counties, recentEvents, startSync } = useTerraFusionSync();
            const [selectedSystem, setSelectedSystem] = useState(null);

            // Vendor integration patterns matching existing architecture
            const vendorIntegrationTypes = [
                {
                    id: 'sidecar',
                    name: 'Sidecar Pattern',
                    description: 'Containerized vendor app alongside platform',
                    status: 'active',
                    examples: ['ACME Assessment Pro', 'GovGIS Solutions'],
                    icon: Container,
                    color: 'green'
                },
                {
                    id: 'api_gateway',
                    name: 'API Gateway Pattern',
                    description: 'Vendor integration via API routing',
                    status: 'active',
                    examples: ['PaymentPro Government', 'PermitFlow'],
                    icon: Network,
                    color: 'blue'
                },
                {
                    id: 'event_driven',
                    name: 'Event-Driven Pattern',
                    description: 'Real-time event streaming integration',
                    status: 'active',
                    examples: ['ElectionTech', 'CitizenPortal'],
                    icon: Zap,
                    color: 'purple'
                },
                {
                    id: 'database_sync',
                    name: 'Database Sync Pattern',
                    description: 'Direct database synchronization',
                    status: 'syncing',
                    examples: ['Harris PACS', 'Tyler iasWorld'],
                    icon: Database,
                    color: 'orange'
                }
            ];

            return (
                <div className="space-y-6">
                    {/* TerraFusion Sync Status */}
                    <div className="tf-card rounded-xl p-6 border shadow-sm">
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="text-lg font-semibold flex items-center gap-2">
                                <RefreshCw className={`w-5 h-5 text-blue-600 ${syncStatus.isActive ? 'animate-spin' : ''}`} />
                                TerraFusion Sync Service
                            </h3>
                            <div className={`px-3 py-1 rounded-full text-xs font-medium ${
                                syncStatus.isActive
                                    ? 'bg-green-100 text-green-800'
                                    : 'bg-gray-100 text-gray-600'
                            }`}>
                                {syncStatus.isActive ? 'ACTIVE' : 'IDLE'}
                            </div>
                        </div>

                        <div className="grid md:grid-cols-3 gap-4 mb-4">
                            <div className="metric-card bg-blue-50 rounded-lg p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-2xl font-bold text-blue-600">
                                            {syncStatus.activeConnections}
                                        </div>
                                        <div className="text-sm text-blue-600">Active Systems</div>
                                    </div>
                                    <Database className="w-8 h-8 text-blue-400" />
                                </div>
                            </div>

                            <div className="metric-card bg-green-50 rounded-lg p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-2xl font-bold text-green-600">
                                            {counties.length}
                                        </div>
                                        <div className="text-sm text-green-600">Counties</div>
                                    </div>
                                    <Map className="w-8 h-8 text-green-400" />
                                </div>
                            </div>

                            <div className="metric-card bg-purple-50 rounded-lg p-4">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <div className="text-2xl font-bold text-purple-600">
                                            {Math.floor((syncStatus.metrics.UptimeSeconds || 0) / 3600)}h
                                        </div>
                                        <div className="text-sm text-purple-600">Uptime</div>
                                    </div>
                                    <Clock className="w-8 h-8 text-purple-400" />
                                </div>
                            </div>
                        </div>

                        <div className="text-sm text-gray-600">
                            <strong>Status:</strong> {syncStatus.currentOperation}
                        </div>
                    </div>

                    {/* Vendor Integration Patterns */}
                    <div className="tf-card rounded-xl p-6 border shadow-sm">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                            <Package className="w-5 h-5 text-purple-600" />
                            Vendor Integration Patterns
                        </h3>

                        <div className="grid md:grid-cols-2 gap-4">
                            {vendorIntegrationTypes.map((pattern) => (
                                <div key={pattern.id} className="vendor-card p-4 rounded-lg border bg-white">
                                    <div className="flex items-start gap-3">
                                        <div className={`p-2 rounded-lg bg-${pattern.color}-100`}>
                                            <pattern.icon className={`w-5 h-5 text-${pattern.color}-600`} />
                                        </div>
                                        <div className="flex-1">
                                            <div className="flex items-center gap-2 mb-1">
                                                <h4 className="font-medium">{pattern.name}</h4>
                                                <div className={`status-indicator w-2 h-2 rounded-full ${
                                                    pattern.status === 'active'
                                                        ? 'bg-green-400'
                                                        : pattern.status === 'syncing'
                                                        ? 'bg-orange-400'
                                                        : 'bg-gray-400'
                                                }`}></div>
                                            </div>
                                            <p className="text-sm text-gray-600 mb-2">{pattern.description}</p>
                                            <div className="text-xs text-gray-500">
                                                <strong>Examples:</strong> {pattern.examples.join(', ')}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Legacy Systems Status */}
                    <div className="tf-card rounded-xl p-6 border shadow-sm">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                            <Server className="w-5 h-5 text-orange-600" />
                            Legacy System Connections
                        </h3>

                        <div className="space-y-3">
                            {legacySystems.map((system) => (
                                <div key={system.systemId}
                                     className="flex items-center justify-between p-4 border rounded-lg hover:bg-gray-50">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-3 h-3 rounded-full ${
                                            system.isAvailable ? 'bg-green-400' : 'bg-red-400'
                                        }`}></div>
                                        <div>
                                            <div className="font-medium">{system.systemName}</div>
                                            <div className="text-sm text-gray-500">
                                                {system.systemType} • {system.version}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className={`px-2 py-1 rounded text-xs ${
                                            system.isConfigured
                                                ? 'bg-green-100 text-green-700'
                                                : 'bg-yellow-100 text-yellow-700'
                                        }`}>
                                            {system.isConfigured ? 'Configured' : 'Pending Setup'}
                                        </div>
                                        <button className="text-blue-600 hover:text-blue-800">
                                            <Settings className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* County Configuration */}
                    <div className="tf-card rounded-xl p-6 border shadow-sm">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                            <Map className="w-5 h-5 text-green-600" />
                            County Configuration
                        </h3>

                        {counties.map((county) => (
                            <div key={county.countyName} className="border rounded-lg p-4">
                                <div className="flex items-center justify-between mb-3">
                                    <div>
                                        <h4 className="font-medium">{county.countyName} County, {county.state}</h4>
                                        <div className="text-sm text-gray-500">
                                            {county.totalParcels.toLocaleString()} parcels • {county.legacySystemType}
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <div className={`px-3 py-1 rounded-full text-xs ${
                                            county.isActive
                                                ? 'bg-green-100 text-green-700'
                                                : 'bg-gray-100 text-gray-600'
                                        }`}>
                                            {county.isActive ? 'Auto-Sync ON' : 'Manual Only'}
                                        </div>
                                        <button
                                            onClick={() => startSync(county.countyName)}
                                            className="px-3 py-1 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 text-xs"
                                        >
                                            Sync Now
                                        </button>
                                    </div>
                                </div>
                                <div className="text-xs text-gray-500">
                                    Last sync: {new Date(county.lastSync).toLocaleString()}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Recent Sync Events */}
                    <div className="tf-card rounded-xl p-6 border shadow-sm">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2">
                            <Activity className="w-5 h-5 text-indigo-600" />
                            Recent Sync Events
                        </h3>

                        <div className="space-y-3">
                            {recentEvents.map((event, index) => (
                                <div key={index} className="flex items-start gap-3 p-3 border-l-4 border-l-blue-200 bg-blue-50 rounded-r">
                                    <div className={`w-2 h-2 rounded-full mt-2 ${
                                        event.eventType === 'Completed' ? 'bg-green-400' :
                                        event.eventType === 'Warning' ? 'bg-yellow-400' :
                                        'bg-red-400'
                                    }`}></div>
                                    <div className="flex-1">
                                        <div className="font-medium text-sm">{event.message}</div>
                                        <div className="text-xs text-gray-500">
                                            {event.countyName} County • {event.legacySystem} •
                                            {new Date(event.timestamp).toLocaleTimeString()}
                                        </div>
                                        <div className="text-xs text-gray-400 mt-1">
                                            Duration: {event.details.Duration} •
                                            Records: {event.details.RecordsProcessed}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // Main Application Component
        const VendorIntegrationDemo = () => {
            const [activeTab, setActiveTab] = useState('status');

            const tabs = [
                { id: 'status', label: 'Integration Status', icon: Activity },
                { id: 'vendors', label: 'Vendor Marketplace', icon: Package },
                { id: 'workflows', label: 'TerraFlow', icon: Workflow },
                { id: 'security', label: 'Security & Compliance', icon: Shield }
            ];

            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Header */}
                    <header className="tf-gradient text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <div className="w-8 h-8 bg-white/20 rounded-lg flex items-center justify-center">
                                        <Zap className="w-5 h-5" />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold">TerraFusion cOS</h1>
                                        <p className="text-sm opacity-90">County Operating System - Vendor Integration Interface</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="text-sm opacity-90">
                                        Benton County, WA • Production Demo
                                    </div>
                                    <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-8">
                                {tabs.map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 py-4 px-1 border-b-2 font-medium text-sm transition-colors ${
                                            activeTab === tab.id
                                                ? 'border-blue-500 text-blue-600'
                                                : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
                                        }`}
                                    >
                                        <tab.icon className="w-4 h-4" />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === 'status' && <VendorIntegrationStatus />}

                        {activeTab === 'vendors' && (
                            <div className="tf-card rounded-xl p-8 border shadow-sm text-center">
                                <Package className="w-16 h-16 text-gray-400 mx-auto mb-4" />
                                <h2 className="text-xl font-semibold mb-2">Vendor Marketplace</h2>
                                <p className="text-gray-600 mb-4">
                                    Connect with government vendors using TerraFusion's zero-rewrite integration patterns.
                                </p>
                                <div className="text-sm text-blue-600">
                                    <a href="#" className="hover:underline">Browse Available Integrations →</a>
                                </div>
                            </div>
                        )}

                        {activeTab === 'workflows' && (
                            <div className="tf-card rounded-xl p-8 border shadow-sm text-center">
                                <Workflow className="w-16 h-16 text-gray-400 mx-auto mb-4" />
                                <h2 className="text-xl font-semibold mb-2">TerraFlow Workflows</h2>
                                <p className="text-gray-600 mb-4">
                                    Automated government processes powered by AI agents and workflow orchestration.
                                </p>
                                <div className="text-sm text-blue-600">
                                    <a href="#" className="hover:underline">Open TerraFlow Designer →</a>
                                </div>
                            </div>
                        )}

                        {activeTab === 'security' && (
                            <div className="tf-card rounded-xl p-8 border shadow-sm text-center">
                                <Shield className="w-16 h-16 text-gray-400 mx-auto mb-4" />
                                <h2 className="text-xl font-semibold mb-2">Security & Compliance</h2>
                                <p className="text-gray-600 mb-4">
                                    FISMA-compliant security framework with government-grade audit trails.
                                </p>
                                <div className="text-sm text-blue-600">
                                    <a href="#" className="hover:underline">View Security Dashboard →</a>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<VendorIntegrationDemo />, document.getElementById('root'));
    </script>
</body>
</html>
