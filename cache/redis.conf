# TerraFusion Marketplace Platform - Redis Configuration
# Government Plugin Economy Caching

# Basic Configuration
bind 0.0.0.0
port \${{TF_REDIS_PORT:-6379}}
timeout 300
tcp-keepalive 300

# Memory Management for Plugin Data
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence for Revenue Data
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security for Government Data
protected-mode yes
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Plugin Performance Optimization
tcp-backlog 511
databases 16

# Logging for Compliance
loglevel notice
syslog-enabled yes
syslog-ident terrafusion-marketplace

# Government Security (TLS disabled for initial deployment)
# tls-port \${{TF_REDIS_PORT:-6379}}
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-protocols "TLSv1.2 TLSv1.3"
