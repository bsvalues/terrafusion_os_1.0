replicaCount: 2
image:
  repository: REPLACE_IMAGE
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi
ingress:
  enabled: true
  className: ""
  hosts:
    - host: REPLACE_DOMAIN
      paths:
        - path: /
          pathType: Prefix
  tls: []
env: []

prometheus:
  scrape: true
  path: /metrics
  port: 8080

