<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion Command Portal - Complete System</title>
    
    <!-- React and dependencies for air-gapped deployment -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* TerraFusion Complete UI System Styles */
        :root {
            --tf-primary: #1e40af;
            --tf-secondary: #7c3aed;
            --tf-success: #059669;
            --tf-warning: #d97706;
            --tf-danger: #dc2626;
            --tf-dark: #111827;
            --tf-light: #f9fafb;
            --tf-gradient: linear-gradient(135deg, #1e40af 0%, #7c3aed 100%);
            --tf-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tf-dark);
            color: white;
            overflow-x: hidden;
        }

        /* TerraFusion Header System */
        .tf-header {
            background: var(--tf-gradient);
            padding: 15px 30px;
            box-shadow: var(--tf-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .tf-header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }

        .tf-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .tf-logo-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tf-nav {
            display: flex;
            gap: 25px;
        }

        .tf-nav-item {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }

        .tf-nav-item:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .tf-nav-item.active {
            background: rgba(255,255,255,0.3);
        }

        /* Main Layout System */
        .tf-main-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: calc(100vh - 70px);
        }

        .tf-sidebar {
            background: rgba(0,0,0,0.3);
            padding: 25px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .tf-content {
            padding: 30px;
            background: rgba(0,0,0,0.1);
        }

        /* Sidebar Navigation */
        .tf-sidebar-section {
            margin-bottom: 30px;
        }

        .tf-sidebar-title {
            font-size: 14px;
            font-weight: bold;
            color: rgba(255,255,255,0.7);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tf-sidebar-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tf-sidebar-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .tf-sidebar-item.active {
            background: var(--tf-gradient);
        }

        /* Content Area Cards */
        .tf-grid {
            display: grid;
            gap: 25px;
            margin-bottom: 30px;
        }

        .tf-grid-2 { grid-template-columns: 1fr 1fr; }
        .tf-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
        .tf-grid-4 { grid-template-columns: repeat(4, 1fr); }

        .tf-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }

        .tf-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--tf-shadow);
        }

        .tf-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .tf-card-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* Status Indicators */
        .tf-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .tf-status-online {
            background: rgba(5, 150, 105, 0.2);
            color: #10b981;
        }

        .tf-status-warning {
            background: rgba(217, 119, 6, 0.2);
            color: #f59e0b;
        }

        .tf-status-offline {
            background: rgba(220, 38, 38, 0.2);
            color: #ef4444;
        }

        /* Interactive Controls */
        .tf-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tf-btn-primary {
            background: var(--tf-gradient);
            color: white;
        }

        .tf-btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tf-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Map Container */
        .tf-map-container {
            height: 400px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #tf-map {
            height: 100%;
            width: 100%;
        }

        /* Real-time Data Display */
        .tf-metric {
            text-align: center;
        }

        .tf-metric-value {
            font-size: 32px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .tf-metric-label {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        /* Form Controls */
        .tf-form-group {
            margin-bottom: 20px;
        }

        .tf-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: rgba(255,255,255,0.9);
        }

        .tf-input, .tf-select, .tf-textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 14px;
        }

        .tf-input:focus, .tf-select:focus, .tf-textarea:focus {
            outline: none;
            border-color: var(--tf-primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }

        /* Console Output */
        .tf-console {
            background: #000;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
            height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Loading States */
        .tf-spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-left: 2px solid var(--tf-primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .tf-main-container {
                grid-template-columns: 1fr;
            }
            
            .tf-sidebar {
                display: none;
            }

            .tf-grid-2, .tf-grid-3, .tf-grid-4 {
                grid-template-columns: 1fr;
            }
        }

        /* Animation Effects */
        .tf-fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="tf-root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // TerraFusion Complete Portal Application
        function TerraFusionCompletePortal() {
            const [activeSection, setActiveSection] = useState('overview');
            const [systemStatus, setSystemStatus] = useState({});
            const [realTimeData, setRealTimeData] = useState({});
            const [federationData, setFederationData] = useState({});
            const [consoleOutput, setConsoleOutput] = useState('');

            // Initialize system on load
            useEffect(() => {
                initializeTerraFusion();
                startRealTimeUpdates();
            }, []);

            const initializeTerraFusion = async () => {
                try {
                    // Check backend status
                    const response = await axios.get('http://localhost:8787/health');
                    setSystemStatus(prev => ({
                        ...prev,
                        backend: 'online',
                        lastCheck: new Date().toISOString()
                    }));
                    
                    addConsoleLog('✓ TerraFusion Backend Online');
                    addConsoleLog('✓ Initializing Command Portal...');
                    addConsoleLog('✓ Loading Federation Data...');
                    
                    // Load initial data
                    await loadFederationData();
                    await initializeMapping();
                    
                } catch (error) {
                    setSystemStatus(prev => ({
                        ...prev,
                        backend: 'offline'
                    }));
                    addConsoleLog('✗ Backend connection failed');
                }
            };

            const loadFederationData = async () => {
                // Simulate 7-County Washington Federation data
                setFederationData({
                    counties: [
                        { name: 'King County', properties: 89247, status: 'online' },
                        { name: 'Pierce County', properties: 67543, status: 'online' },
                        { name: 'Snohomish County', properties: 54321, status: 'online' },
                        { name: 'Spokane County', properties: 43210, status: 'online' },
                        { name: 'Clark County', properties: 38765, status: 'warning' },
                        { name: 'Thurston County', properties: 32101, status: 'online' },
                        { name: 'Kitsap County', properties: 31260, status: 'online' }
                    ],
                    totalProperties: 356447,
                    activeNodes: 7,
                    syncStatus: 'synchronized'
                });
            };

            const initializeMapping = () => {
                setTimeout(() => {
                    if (document.getElementById('tf-map')) {
                        const map = L.map('tf-map').setView([47.6062, -122.3321], 8);
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '© OpenStreetMap contributors'
                        }).addTo(map);

                        // Add federation markers
                        const counties = [
                            [47.6062, -122.3321, 'Seattle - King County HQ'],
                            [47.2529, -122.4443, 'Tacoma - Pierce County'],
                            [47.9779, -122.2021, 'Everett - Snohomish County'],
                            [47.6587, -117.4260, 'Spokane County'],
                            [45.6387, -122.6615, 'Vancouver - Clark County'],
                            [47.0379, -122.9015, 'Olympia - Thurston County'],
                            [47.5615, -122.6426, 'Bremerton - Kitsap County']
                        ];

                        counties.forEach(([lat, lng, title]) => {
                            L.marker([lat, lng])
                                .addTo(map)
                                .bindPopup(title);
                        });
                    }
                }, 1000);
            };

            const startRealTimeUpdates = () => {
                const interval = setInterval(() => {
                    setRealTimeData({
                        cpuUsage: Math.floor(Math.random() * 30) + 20,
                        memoryUsage: Math.floor(Math.random() * 40) + 30,
                        networkTraffic: Math.floor(Math.random() * 100) + 50,
                        activeConnections: Math.floor(Math.random() * 500) + 1200,
                        privacyQueries: Math.floor(Math.random() * 50) + 150,
                        immersiveSessions: Math.floor(Math.random() * 25) + 45
                    });
                }, 3000);

                return () => clearInterval(interval);
            };

            const addConsoleLog = (message) => {
                const timestamp = new Date().toLocaleTimeString();
                setConsoleOutput(prev => 
                    prev + `[${timestamp}] ${message}\n`
                );
            };

            const executeCommand = (command) => {
                addConsoleLog(`> ${command}`);
                
                // Simulate command execution
                setTimeout(() => {
                    switch(command.toLowerCase()) {
                        case 'status':
                            addConsoleLog('System Status: All systems operational');
                            break;
                        case 'federation sync':
                            addConsoleLog('Federation synchronization initiated...');
                            addConsoleLog('✓ All 7 counties synchronized');
                            break;
                        case 'privacy audit':
                            addConsoleLog('Running privacy compliance audit...');
                            addConsoleLog('✓ All privacy controls validated');
                            break;
                        default:
                            addConsoleLog(`Command '${command}' executed successfully`);
                    }
                }, 1000);
            };

            const renderOverview = () => (
                <div className="tf-fade-in">
                    <h2 style={{marginBottom: '30px', fontSize: '28px'}}>TerraFusion Command Portal - System Overview</h2>
                    
                    {/* System Metrics */}
                    <div className="tf-grid tf-grid-4">
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#10b981'}}>{realTimeData.cpuUsage || 25}%</span>
                                <span className="tf-metric-label">CPU Usage</span>
                            </div>
                        </div>
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#3b82f6'}}>{realTimeData.memoryUsage || 35}%</span>
                                <span className="tf-metric-label">Memory Usage</span>
                            </div>
                        </div>
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#8b5cf6'}}>{realTimeData.activeConnections || 1250}</span>
                                <span className="tf-metric-label">Active Connections</span>
                            </div>
                        </div>
                        <div className="tf-card">
                            <div className="tf-metric">
                                <span className="tf-metric-value" style={{color: '#f59e0b'}}>{federationData.totalProperties || 356447}</span>
                                <span className="tf-metric-label">Total Properties</span>
                            </div>
                        </div>
                    </div>

                    {/* Federation Map and Console */}
                    <div className="tf-grid tf-grid-2">
                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">Washington State Federation Map</h3>
                                <span className="tf-status tf-status-online">● Online</span>
                            </div>
                            <div className="tf-map-container">
                                <div id="tf-map"></div>
                            </div>
                        </div>
                        
                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">System Console</h3>
                                <button 
                                    className="tf-btn tf-btn-secondary"
                                    onClick={() => setConsoleOutput('')}
                                >
                                    Clear
                                </button>
                            </div>
                            <div className="tf-console">
                                {consoleOutput}
                            </div>
                            <div style={{marginTop: '15px', display: 'flex', gap: '10px'}}>
                                <button className="tf-btn tf-btn-primary" onClick={() => executeCommand('status')}>
                                    Status Check
                                </button>
                                <button className="tf-btn tf-btn-primary" onClick={() => executeCommand('federation sync')}>
                                    Sync Federation
                                </button>
                                <button className="tf-btn tf-btn-primary" onClick={() => executeCommand('privacy audit')}>
                                    Privacy Audit
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* County Status Grid */}
                    <div className="tf-card">
                        <div className="tf-card-header">
                            <h3 className="tf-card-title">7-County Federation Status</h3>
                            <span className="tf-status tf-status-online">● {federationData.activeNodes || 7}/7 Online</span>
                        </div>
                        <div className="tf-grid tf-grid-3">
                            {federationData.counties?.map((county, index) => (
                                <div key={index} style={{
                                    padding: '15px',
                                    background: 'rgba(255,255,255,0.05)',
                                    borderRadius: '10px',
                                    border: '1px solid rgba(255,255,255,0.1)'
                                }}>
                                    <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px'}}>
                                        <strong>{county.name}</strong>
                                        <span className={`tf-status ${county.status === 'online' ? 'tf-status-online' : 'tf-status-warning'}`}>
                                            ● {county.status}
                                        </span>
                                    </div>
                                    <div style={{color: 'rgba(255,255,255,0.7)'}}>
                                        {county.properties.toLocaleString()} properties
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderPrivacyTier17 = () => (
                <div className="tf-fade-in">
                    <h2 style={{marginBottom: '30px', fontSize: '28px'}}>Tier 17: Advanced Privacy Systems</h2>
                    
                    <div className="tf-grid tf-grid-2">
                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">Differential Privacy Controls</h3>
                                <span className="tf-status tf-status-online">● Active</span>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Privacy Budget (ε)</label>
                                <input 
                                    type="range" 
                                    min="0.1" 
                                    max="2.0" 
                                    step="0.1" 
                                    defaultValue="1.0"
                                    className="tf-input"
                                />
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Query Type</label>
                                <select className="tf-select">
                                    <option>Count Query</option>
                                    <option>Sum Query</option>
                                    <option>Average Query</option>
                                    <option>Histogram Query</option>
                                </select>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Data Source</label>
                                <select className="tf-select">
                                    <option>Property Records</option>
                                    <option>Tax Assessment</option>
                                    <option>Demographics</option>
                                    <option>Zoning Data</option>
                                </select>
                            </div>
                            
                            <button className="tf-btn tf-btn-primary" style={{width: '100%'}}>
                                Execute Private Query
                            </button>
                        </div>

                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">Privacy Metrics</h3>
                            </div>
                            
                            <div className="tf-grid tf-grid-2" style={{marginBottom: '20px'}}>
                                <div className="tf-metric">
                                    <span className="tf-metric-value" style={{color: '#10b981'}}>{realTimeData.privacyQueries || 167}</span>
                                    <span className="tf-metric-label">Queries Today</span>
                                </div>
                                <div className="tf-metric">
                                    <span className="tf-metric-value" style={{color: '#3b82f6'}}>1.4</span>
                                    <span className="tf-metric-label">Budget Used (ε)</span>
                                </div>
                            </div>
                            
                            <div style={{
                                background: 'rgba(16, 185, 129, 0.1)',
                                border: '1px solid rgba(16, 185, 129, 0.3)',
                                borderRadius: '10px',
                                padding: '15px',
                                marginBottom: '15px'
                            }}>
                                <strong style={{color: '#10b981'}}>✓ Compliance Status</strong>
                                <div style={{marginTop: '5px', fontSize: '14px', color: 'rgba(255,255,255,0.8)'}}>
                                    All privacy controls active and validated
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="tf-card">
                        <div className="tf-card-header">
                            <h3 className="tf-card-title">Federated Learning Coordination</h3>
                            <span className="tf-status tf-status-online">● 7 Nodes Active</span>
                        </div>
                        
                        <div className="tf-grid tf-grid-3">
                            <div className="tf-form-group">
                                <label className="tf-label">Model Type</label>
                                <select className="tf-select">
                                    <option>Property Valuation</option>
                                    <option>Risk Assessment</option>
                                    <option>Market Prediction</option>
                                    <option>Compliance Detection</option>
                                </select>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Training Rounds</label>
                                <input type="number" className="tf-input" defaultValue="10" min="1" max="100" />
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Aggregation Method</label>
                                <select className="tf-select">
                                    <option>Federated Averaging</option>
                                    <option>Secure Aggregation</option>
                                    <option>Differential Privacy</option>
                                </select>
                            </div>
                        </div>
                        
                        <button className="tf-btn tf-btn-primary">
                            Initialize Federated Training
                        </button>
                    </div>
                </div>
            );

            const renderImmersiveTier18 = () => (
                <div className="tf-fade-in">
                    <h2 style={{marginBottom: '30px', fontSize: '28px'}}>Tier 18: Immersive Reality Platform</h2>
                    
                    <div className="tf-grid tf-grid-2">
                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">3D Environment Creator</h3>
                                <span className="tf-status tf-status-online">● Ready</span>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Environment Type</label>
                                <select className="tf-select">
                                    <option>Property Visualization</option>
                                    <option>City Planning 3D</option>
                                    <option>Virtual Courthouse</option>
                                    <option>Training Simulation</option>
                                </select>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Target Platform</label>
                                <div style={{display: 'flex', gap: '10px', flexWrap: 'wrap'}}>
                                    <button className="tf-btn tf-btn-secondary">VR Headset</button>
                                    <button className="tf-btn tf-btn-secondary">AR Mobile</button>
                                    <button className="tf-btn tf-btn-secondary">Desktop 3D</button>
                                    <button className="tf-btn tf-btn-secondary">Web XR</button>
                                </div>
                            </div>
                            
                            <div className="tf-form-group">
                                <label className="tf-label">Data Integration</label>
                                <textarea 
                                    className="tf-textarea" 
                                    rows="4" 
                                    placeholder="Specify data sources for 3D environment generation..."
                                ></textarea>
                            </div>
                            
                            <button className="tf-btn tf-btn-primary" style={{width: '100%'}}>
                                Create 3D Environment
                            </button>
                        </div>

                        <div className="tf-card">
                            <div className="tf-card-header">
                                <h3 className="tf-card-title">Active Sessions</h3>
                            </div>
                            
                            <div className="tf-metric" style={{marginBottom: '20px'}}>
                                <span className="tf-metric-value" style={{color: '#8b5cf6'}}>{realTimeData.immersiveSessions || 52}</span>
                                <span className="tf-metric-label">Current Sessions</span>
                            </div>
                            
                            <div style={{maxHeight: '300px', overflowY: 'auto'}}>
                                {[
                                    'King County - Property Tour VR',
                                    'Pierce County - Zoning Review 3D',
