[package]
name = "tf-designctl"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion Team"]
description = "TerraFusion Design Token CLI - Sovereign Rust implementation"
license = "MIT"

[[bin]]
name = "tf-designctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1"
anyhow = "1.0"
