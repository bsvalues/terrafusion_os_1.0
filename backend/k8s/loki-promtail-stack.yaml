# ============================================================================
# TerraFusion OS - Loki Log Aggregation Stack
# Government. Transcended. - Championship-Level Log Management
# ============================================================================
# Purpose: Deploy Loki + Promtail for centralized log aggregation
# Features: Structured logging, label extraction, Grafana integration
# Components: Loki server, Promtail DaemonSet, parsing rules
# Retention: 7 days, 20GB storage
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    name: logging
    compliance: fisma-high
    environment: production

---
# ============================================================================
# Loki Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
data:
  loki.yaml: |
    # ========================================================================
    # Loki Server Configuration
    # ========================================================================
    auth_enabled: false

    # Server Configuration
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    # Ingester Configuration
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_transfer_retries: 0
      wal:
        enabled: true
        dir: /loki/wal

    # Schema Configuration
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    # Storage Configuration
    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache
        shared_store: filesystem
      filesystem:
        directory: /loki/chunks

    # Limits Configuration
    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_entries_limit_per_query: 10000
      max_query_length: 721h
      max_query_parallelism: 32

    # Chunk Store Configuration
    chunk_store_config:
      max_look_back_period: 168h

    # Table Manager Configuration
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h

    # Query Configuration
    query_range:
      align_queries_with_step: true
      max_retries: 5
      parallelise_shardable_queries: true
      cache_results: true

    # Compactor Configuration
    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

---
# ============================================================================
# Loki Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: log-aggregation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/name: loki
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3100'
        prometheus.io/path: '/metrics'
    spec:
      serviceAccountName: loki
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:2.9.0
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - containerPort: 3100
              name: http
              protocol: TCP
            - containerPort: 9096
              name: grpc
              protocol: TCP
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /loki
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-storage

---
# ============================================================================
# Loki Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '3100'
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      protocol: TCP
      name: http
    - port: 9096
      targetPort: 9096
      protocol: TCP
      name: grpc
  selector:
    app: loki

---
# ============================================================================
# Loki ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: logging
  labels:
    app.kubernetes.io/name: loki

---
# ============================================================================
# Loki PersistentVolumeClaim
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-storage
  namespace: logging
  labels:
    app.kubernetes.io/name: loki
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 20Gi

---
# ============================================================================
# Promtail Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: logging
  labels:
    app.kubernetes.io/name: promtail
data:
  promtail.yaml: |
    # ========================================================================
    # Promtail Agent Configuration
    # ========================================================================
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
      log_level: info

    # Positions file to track log file offsets
    positions:
      filename: /run/promtail/positions.yaml

    # Loki client configuration
    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
        batchwait: 1s
        batchsize: 1048576
        backoff_config:
          min_period: 500ms
          max_period: 5m
          max_retries: 10

    # Scrape configurations
    scrape_configs:
      # ======================================================================
      # Kubernetes Pod Logs
      # ======================================================================
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        
        pipeline_stages:
          # Extract metadata from Kubernetes labels
          - docker: {}
          
          # Parse JSON logs (TerraFusion services use structured logging)
          - json:
              expressions:
                timestamp: timestamp
                level: level
                message: message
                logger: logger
                trace_id: traceId
                span_id: spanId
                service: service
                county: county
          
          # Extract labels from parsed JSON
          - labels:
              level:
              logger:
              service:
              county:
          
          # Add trace_id for correlation with Jaeger
          - labels:
              trace_id:
              span_id:
          
          # Set log timestamp from parsed field
          - timestamp:
              source: timestamp
              format: RFC3339Nano
        
        relabel_configs:
          # Only scrape TerraFusion namespace pods
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: terrafusion
          
          # Add pod name as label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          
          # Add namespace as label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          
          # Add container name as label
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          
          # Add node name as label
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          
          # Add app label
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          
          # Set log file path
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
      
      # ======================================================================
      # System Logs (Node-level)
      # ======================================================================
      - job_name: system-logs
        static_configs:
          - targets:
              - localhost
            labels:
              job: system-logs
              __path__: /var/log/syslog
        
        pipeline_stages:
          # Parse syslog format
          - regex:
              expression: '^(?P<timestamp>\w+ \d+ \d+:\d+:\d+) (?P<hostname>\S+) (?P<program>\S+)(\[(?P<pid>\d+)\])?: (?P<message>.*)$'
          
          - labels:
              hostname:
              program:
          
          - timestamp:
              source: timestamp
              format: Jan _2 15:04:05

---
# ============================================================================
# Promtail DaemonSet (runs on every node)
# ============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: logging
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        app.kubernetes.io/name: promtail
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9080'
    spec:
      serviceAccountName: promtail
      securityContext:
        runAsNonRoot: true
        runAsUser: 0
      containers:
        - name: promtail
          image: grafana/promtail:2.9.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
              name: http-metrics
              protocol: TCP
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions
          hostPath:
            path: /var/lib/promtail/positions
            type: DirectoryOrCreate

---
# ============================================================================
# Promtail ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: logging
  labels:
    app.kubernetes.io/name: promtail

---
# ============================================================================
# Promtail ClusterRole (read pod logs)
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
rules:
  - apiGroups: ['']
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ['get', 'watch', 'list']

---
# ============================================================================
# Promtail ClusterRoleBinding
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: logging

---
# ============================================================================
# Promtail Service (for metrics)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: logging
  labels:
    app.kubernetes.io/name: promtail
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9080'
spec:
  type: ClusterIP
  ports:
    - port: 9080
      targetPort: 9080
      protocol: TCP
      name: http-metrics
  selector:
    app: promtail
# ============================================================================
# Apply Instructions
# ============================================================================
# 1. Apply Loki + Promtail stack:
#    kubectl apply -f loki-promtail-stack.yaml
#
# 2. Verify Loki deployment:
#    kubectl get pods -n logging
#    kubectl logs -n logging -l app=loki
#
# 3. Verify Promtail DaemonSet:
#    kubectl get daemonset -n logging
#    kubectl logs -n logging -l app=promtail
#
# 4. Port-forward Loki for testing:
#    kubectl port-forward -n logging svc/loki 3100:3100
#
# 5. Test Loki API:
#    curl http://localhost:3100/ready
#    curl http://localhost:3100/metrics
#
# 6. Query logs via LogQL:
#    # Get recent logs from API service
#    curl -G -s "http://localhost:3100/loki/api/v1/query" \
#      --data-urlencode 'query={app="terrafusion-api"}' | jq
#
#    # Get logs with specific trace_id
#    curl -G -s "http://localhost:3100/loki/api/v1/query" \
#      --data-urlencode 'query={trace_id="abc123"}' | jq
#
#    # Get error logs from Consciousness Engine
#    curl -G -s "http://localhost:3100/loki/api/v1/query" \
#      --data-urlencode 'query={app="terrafusion-consciousness",level="error"}' | jq
#
# 7. View logs in Grafana:
#    # Navigate to: Explore > Loki datasource
#    # LogQL queries:
#    #   {namespace="terrafusion"}
#    #   {app="terrafusion-api",level="error"}
#    #   {trace_id="xyz789"}
#    #   {county="benton"} |= "property assessment"
#
# 8. Trace-to-logs correlation:
#    # In Grafana, clicking on a trace in Jaeger will show related logs
#    # Logs with trace_id are automatically linked to Jaeger traces
# ============================================================================
