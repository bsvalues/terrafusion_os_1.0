# ============================================================================
# TerraFusion OS - Grafana Deployment
# Government. Transcended. - Championship-Level Observability Visualization
# ============================================================================
# Purpose: Deploy Grafana for TerraFusion OS monitoring visualization
# Features: Pre-configured dashboards, datasources, RBAC, persistent storage
# Datasources: Prometheus, Loki, Jaeger
# Version: Grafana 10.2.0
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    compliance: fisma-high
    environment: production

---
# ============================================================================
# Grafana Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  grafana.ini: |
    # ========================================================================
    # Global Settings
    # ========================================================================
    [paths]
    data = /var/lib/grafana
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [server]
    protocol = http
    http_port = 3000
    domain = grafana.terrafusion.gov
    root_url = %(protocol)s://%(domain)s:%(http_port)s/
    
    # ========================================================================
    # Security Settings (FISMA-High Compliance)
    # ========================================================================
    [security]
    admin_user = admin
    admin_password = ${GRAFANA_ADMIN_PASSWORD}
    secret_key = ${GRAFANA_SECRET_KEY}
    disable_gravatar = true
    cookie_secure = true
    cookie_samesite = strict
    allow_embedding = false
    
    # ========================================================================
    # Authentication (Azure AD SSO)
    # ========================================================================
    [auth]
    disable_login_form = false
    disable_signout_menu = false
    
    [auth.generic_oauth]
    enabled = true
    name = Azure AD
    allow_sign_up = true
    client_id = ${AZURE_AD_CLIENT_ID}
    client_secret = ${AZURE_AD_CLIENT_SECRET}
    scopes = openid email profile
    auth_url = https://login.microsoftonline.com/${AZURE_AD_TENANT_ID}/oauth2/v2.0/authorize
    token_url = https://login.microsoftonline.com/${AZURE_AD_TENANT_ID}/oauth2/v2.0/token
    api_url = https://graph.microsoft.com/v1.0/me
    
    # ========================================================================
    # Database (PostgreSQL backend for high availability)
    # ========================================================================
    [database]
    type = postgres
    host = ${POSTGRES_HOST}:5432
    name = grafana
    user = ${POSTGRES_USER}
    password = ${POSTGRES_PASSWORD}
    ssl_mode = require
    
    # ========================================================================
    # Session Management
    # ========================================================================
    [session]
    provider = postgres
    provider_config = ${POSTGRES_CONNECTION_STRING}
    cookie_name = grafana_session
    cookie_secure = true
    session_life_time = 86400
    
    # ========================================================================
    # Analytics & Reporting
    # ========================================================================
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    
    [dashboards]
    default_home_dashboard_path = /etc/grafana/dashboards/terrafusion-overview.json
    
    # ========================================================================
    # Logging
    # ========================================================================
    [log]
    mode = console
    level = info
    
    [log.console]
    level = info
    format = json

---
# ============================================================================
# Grafana Datasources Provisioning
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus Datasource
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
          queryTimeout: 60s
          httpMethod: POST
      
      # Loki Datasource (Logs)
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          maxLines: 1000
          derivedFields:
            - datasourceUid: jaeger
              matcherRegex: "traceID=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
      
      # Jaeger Datasource (Distributed Tracing)
      - name: Jaeger
        type: jaeger
        uid: jaeger
        access: proxy
        url: http://jaeger-query:16686
        editable: false
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            tags: ['trace_id']

---
# ============================================================================
# Grafana Deployment
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            # Admin Credentials
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: admin-password
            - name: GRAFANA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: secret-key
            
            # Azure AD OAuth
            - name: AZURE_AD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: azure-ad-client-id
            - name: AZURE_AD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: azure-ad-client-secret
            - name: AZURE_AD_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: azure-ad-tenant-id
            
            # PostgreSQL Backend
            - name: POSTGRES_HOST
              value: "postgres.database.svc.cluster.local"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: postgres-password
            - name: POSTGRES_CONNECTION_STRING
              value: "user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) host=$(POSTGRES_HOST) port=5432 dbname=grafana sslmode=require"
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /etc/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-provisioning
          configMap:
            name: grafana-dashboards-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage

---
# ============================================================================
# Grafana Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: grafana

---
# ============================================================================
# Grafana ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana

---
# ============================================================================
# Grafana PersistentVolumeClaim
# ============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# ============================================================================
# Grafana Secrets (Template - Replace with actual values)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  # Admin credentials (replace with secure values)
  admin-password: "REPLACE_WITH_SECURE_PASSWORD"
  secret-key: "REPLACE_WITH_SECURE_SECRET_KEY"
  
  # Azure AD OAuth credentials
  azure-ad-client-id: "REPLACE_WITH_AZURE_AD_CLIENT_ID"
  azure-ad-client-secret: "REPLACE_WITH_AZURE_AD_CLIENT_SECRET"
  azure-ad-tenant-id: "REPLACE_WITH_AZURE_AD_TENANT_ID"
  
  # PostgreSQL credentials
  postgres-user: "grafana"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"

---
# ============================================================================
# Grafana Dashboards Provisioning
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'TerraFusion OS Dashboards'
        orgId: 1
        folder: 'TerraFusion OS'
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /etc/grafana/dashboards

---
# ============================================================================
# Grafana Ingress (NGINX Ingress Controller)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.terrafusion.gov
      secretName: grafana-tls
  rules:
    - host: grafana.terrafusion.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

# ============================================================================
# Apply Instructions
# ============================================================================
# 1. Create secrets with actual values:
#    kubectl create secret generic grafana-secrets \
#      --from-literal=admin-password='YOUR_ADMIN_PASSWORD' \
#      --from-literal=secret-key='YOUR_SECRET_KEY' \
#      --from-literal=azure-ad-client-id='YOUR_CLIENT_ID' \
#      --from-literal=azure-ad-client-secret='YOUR_CLIENT_SECRET' \
#      --from-literal=azure-ad-tenant-id='YOUR_TENANT_ID' \
#      --from-literal=postgres-user='grafana' \
#      --from-literal=postgres-password='YOUR_POSTGRES_PASSWORD' \
#      -n monitoring
#
# 2. Apply Grafana deployment:
#    kubectl apply -f grafana-deployment.yaml
#
# 3. Port-forward for local access:
#    kubectl port-forward -n monitoring svc/grafana 3000:3000
#
# 4. Access Grafana UI:
#    http://localhost:3000
#    Login: admin / <your-admin-password>
#
# 5. Verify datasources:
#    # Navigate to: Configuration > Data sources
#    # Prometheus, Loki, Jaeger should be pre-configured
#
# 6. View dashboards:
#    # Navigate to: Dashboards > Browse
#    # TerraFusion OS folder should contain all pre-configured dashboards
# ============================================================================
