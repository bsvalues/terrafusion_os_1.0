# TerraFusion PostgreSQL - Kubernetes Production Setup
# StatefulSet with persistent storage and proper configuration

apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-db-secret
  namespace: terrafusion
type: Opaque
stringData:
  username: terrafusion_prod
  password: CHANGE_ME_PRODUCTION_PASSWORD # Replace in production
  database: terrafusion_prod
  connection-string: 'Server=terrafusion-postgres;Port=5432;Database=terrafusion_prod;User Id=terrafusion_prod;Password=CHANGE_ME_PRODUCTION_PASSWORD;'

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: terrafusion
data:
  init.sql: |
    -- Create database if not exists
    SELECT 'CREATE DATABASE terrafusion_prod' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'terrafusion_prod');

    -- Create extensions if needed
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Create audit table (if using database auditing)
    CREATE TABLE IF NOT EXISTS audit_logs (
        id SERIAL PRIMARY KEY,
        timestamp TIMESTAMPTZ DEFAULT NOW(),
        user_id TEXT,
        action TEXT,
        entity TEXT,
        entity_id TEXT,
        old_values JSONB,
        new_values JSONB,
        ip_address INET
    );

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: terrafusion-postgres
  namespace: terrafusion
  labels:
    app: postgresql
    component: database
spec:
  serviceName: terrafusion-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgresql
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: terrafusion-db-secret
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: terrafusion-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgresql
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # PostgreSQL needs to write to data directory
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init-config
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: 'fast-ssd' # Use appropriate storage class
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-postgres
  namespace: terrafusion
  labels:
    app: postgresql
    component: database
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: postgresql

---
# Redis for caching
apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-redis-secret
  namespace: terrafusion
type: Opaque
stringData:
  password: CHANGE_ME_REDIS_PASSWORD # Replace in production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrafusion-redis
  namespace: terrafusion
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - '256mb'
            - --maxmemory-policy
            - 'allkeys-lru'
            - --appendonly
            - 'yes'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-redis-secret
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-tmp
              mountPath: /tmp
      volumes:
        - name: redis-data
          emptyDir: {}
        - name: redis-tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: terrafusion-redis
  namespace: terrafusion
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis
