# ============================================================================
# TerraFusion OS - Kubernetes Ingress Configuration
# Government. Transcended. - Championship-Level Traffic Management
# ============================================================================
# Purpose: Expose TerraFusion services via HTTPS with TLS termination
# Features: Path-based routing, TLS/SSL, rate limiting, CORS
# Performance: <5ms routing overhead, load balancing, session affinity
# Security: FISMA-High compliance, TLS 1.3, certificate management
# ============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrafusion-ingress
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: terrafusion-platform
  annotations:
    # NGINX Ingress Controller Annotations
    kubernetes.io/ingress.class: 'nginx'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'

    # SSL/TLS Configuration
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-protocols: 'TLSv1.3'
    nginx.ingress.kubernetes.io/ssl-ciphers: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384'

    # CORS Configuration
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://terrafusionmarket.com,https://app.terrafusionmarket.com'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'Authorization,Content-Type,X-County-Id,X-Request-ID'
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'
    nginx.ingress.kubernetes.io/cors-max-age: '3600'

    # Rate Limiting
    nginx.ingress.kubernetes.io/rate-limit: '1000'
    nginx.ingress.kubernetes.io/limit-rps: '100'
    nginx.ingress.kubernetes.io/limit-connections: '100'

    # Connection and Timeout Configuration
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-body-size: '100m'
    nginx.ingress.kubernetes.io/client-body-buffer-size: '10m'

    # Load Balancing
    nginx.ingress.kubernetes.io/load-balance: 'ewma'
    nginx.ingress.kubernetes.io/upstream-hash-by: '$remote_addr'
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/session-cookie-name: 'TERRAFUSION_SESSION'
    nginx.ingress.kubernetes.io/session-cookie-path: '/'
    nginx.ingress.kubernetes.io/session-cookie-max-age: '10800'
    nginx.ingress.kubernetes.io/session-cookie-samesite: 'Strict'

    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.terrafusionmarket.com;";

    # Monitoring
    nginx.ingress.kubernetes.io/enable-access-log: 'true'
    nginx.ingress.kubernetes.io/enable-rewrite-log: 'false'

spec:
  tls:
    - hosts:
        - api.terrafusionmarket.com
        - app.terrafusionmarket.com
        - terrafusionmarket.com
      secretName: terrafusion-tls-secret

  rules:
    # ========================================================================
    # Gateway - Primary Entry Point
    # ========================================================================
    - host: api.terrafusionmarket.com
      http:
        paths:
          # Health check endpoint
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: terrafusion-gateway
                port:
                  number: 3002

          # API endpoints (routed through gateway)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: terrafusion-gateway
                port:
                  number: 3002

          # Consciousness endpoints (routed through gateway)
          - path: /consciousness
            pathType: Prefix
            backend:
              service:
                name: terrafusion-gateway
                port:
                  number: 3002

          # Operations endpoints (routed through gateway)
          - path: /operations
            pathType: Prefix
            backend:
              service:
                name: terrafusion-gateway
                port:
                  number: 3002

    # ========================================================================
    # Application Domain (Frontend)
    # ========================================================================
    - host: app.terrafusionmarket.com
      http:
        paths:
          # Frontend application (if hosted in cluster)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-frontend
                port:
                  number: 3000

    # ========================================================================
    # Root Domain (Marketing/Documentation Site)
    # ========================================================================
    - host: terrafusionmarket.com
      http:
        paths:
          # Main website
          - path: /
            pathType: Prefix
            backend:
              service:
                name: terrafusion-website
                port:
                  number: 80

---
# ============================================================================
# TLS Certificate - Let's Encrypt Certificate Issuer
# ============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: cert-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@terrafusionmarket.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ============================================================================
# TLS Certificate - Staging Issuer (for testing)
# ============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: cert-issuer
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@terrafusionmarket.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# ============================================================================
# TLS Certificate - Manual Certificate (if not using Let's Encrypt)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: terrafusion-tls-secret
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: tls-secret
type: kubernetes.io/tls
data:
  # Base64-encoded TLS certificate and private key
  # Replace with actual certificate data or use cert-manager
  tls.crt: LS0tLS1CRUdJTi... # Replace with base64-encoded certificate
  tls.key: LS0tLS1CRUdJTi... # Replace with base64-encoded private key

---
# ============================================================================
# NGINX Ingress Controller Configuration (ConfigMap)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-controller-config
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller-config
data:
  # Global NGINX Configuration
  use-forwarded-headers: 'true'
  compute-full-forwarded-for: 'true'
  use-proxy-protocol: 'false'

  # SSL Configuration
  ssl-protocols: 'TLSv1.3'
  ssl-ciphers: 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256'
  ssl-prefer-server-ciphers: 'on'
  ssl-session-cache: 'shared:SSL:10m'
  ssl-session-timeout: '10m'

  # Performance Tuning
  worker-processes: 'auto'
  max-worker-connections: '16384'
  upstream-keepalive-connections: '320'
  upstream-keepalive-timeout: '60'
  upstream-keepalive-requests: '10000'

  # Body Size Limits
  proxy-body-size: '100m'
  client-body-buffer-size: '10m'

  # Timeouts
  proxy-connect-timeout: '30'
  proxy-send-timeout: '30'
  proxy-read-timeout: '30'
  client-header-timeout: '60'
  client-body-timeout: '60'

  # Logging
  log-format-upstream: '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_length $request_time [$proxy_upstream_name] [$proxy_alternative_upstream_name] $upstream_addr $upstream_response_length $upstream_response_time $upstream_status $req_id'
  enable-access-log: 'true'

  # Rate Limiting
  limit-req-status-code: '429'
  limit-conn-status-code: '429'
# ============================================================================
# Apply Instructions
# ============================================================================
# Prerequisites:
#   1. Install NGINX Ingress Controller:
#      kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/cloud/deploy.yaml
#
#   2. Install cert-manager (for automated TLS):
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
#
# Apply Ingress configuration:
#   kubectl apply -f ingress.yaml
#
# View Ingress status:
#   kubectl get ingress -n terrafusion
#   kubectl describe ingress terrafusion-ingress -n terrafusion
#
# View TLS certificate status:
#   kubectl get certificate -n terrafusion
#   kubectl describe certificate terrafusion-tls-secret -n terrafusion
#
# Test HTTPS endpoints:
#   curl -v https://api.terrafusionmarket.com/health
#   curl -v https://api.terrafusionmarket.com/api/health
#   curl -v https://api.terrafusionmarket.com/consciousness/health
#
# View NGINX Ingress Controller logs:
#   kubectl logs -n ingress-nginx -l app.kubernetes.io/name=ingress-nginx
#
# Test TLS configuration:
#   openssl s_client -connect api.terrafusionmarket.com:443 -showcerts
#   nmap --script ssl-enum-ciphers -p 443 api.terrafusionmarket.com
#
# Force certificate renewal (cert-manager):
#   kubectl delete certificate terrafusion-tls-secret -n terrafusion
#   kubectl apply -f ingress.yaml
#
# View certificate details:
#   kubectl get secret terrafusion-tls-secret -n terrafusion -o yaml
#   kubectl get secret terrafusion-tls-secret -n terrafusion -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -text -noout
# ============================================================================
