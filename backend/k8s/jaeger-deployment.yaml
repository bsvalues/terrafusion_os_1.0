# ============================================================================
# TerraFusion OS - Jaeger Distributed Tracing
# Government. Transcended. - Championship Request Flow Analysis
# ============================================================================
# Purpose: Deploy Jaeger for distributed tracing across TerraFusion microservices
# Features: Request tracing, span correlation, performance analysis
# Components: Jaeger All-in-One, Agent, Collector, Query UI
# Storage: In-memory (dev) / Elasticsearch (prod)
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: tracing
  labels:
    name: tracing
    compliance: fisma-high
    environment: production

---
# ============================================================================
# Jaeger All-in-One Deployment (Development/Small Clusters)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        app.kubernetes.io/name: jaeger
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '14269'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.51
          ports:
            # Agent ports
            - containerPort: 6831
              name: jaeger-compact
              protocol: UDP
            - containerPort: 6832
              name: jaeger-binary
              protocol: UDP
            - containerPort: 5778
              name: config-rest
              protocol: TCP

            # Collector ports
            - containerPort: 14268
              name: jaeger-http
              protocol: TCP
            - containerPort: 14250
              name: jaeger-grpc
              protocol: TCP

            # Query/UI port
            - containerPort: 16686
              name: query-http
              protocol: TCP

            # Admin port
            - containerPort: 14269
              name: admin-http
              protocol: TCP
          env:
            # Collector settings
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: ':9411'
            - name: COLLECTOR_OTLP_ENABLED
              value: 'true'

            # Storage backend (in-memory for dev, can switch to Elasticsearch)
            - name: SPAN_STORAGE_TYPE
              value: 'memory'
            - name: MEMORY_MAX_TRACES
              value: '50000'

            # Query settings
            - name: QUERY_BASE_PATH
              value: '/'
            - name: QUERY_MAX_CLOCK_SKEW_ADJUSTMENT
              value: '1s'

            # Sampling configuration
            - name: SAMPLING_STRATEGIES_FILE
              value: '/etc/jaeger/sampling-strategies.json'
          volumeMounts:
            - name: jaeger-config
              mountPath: /etc/jaeger
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
      volumes:
        - name: jaeger-config
          configMap:
            name: jaeger-config

---
# ============================================================================
# Jaeger Service (Query UI + Collector)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: query
spec:
  type: ClusterIP
  ports:
    - port: 16686
      targetPort: 16686
      protocol: TCP
      name: query-http
  selector:
    app: jaeger

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: collector
spec:
  type: ClusterIP
  ports:
    - port: 14268
      targetPort: 14268
      protocol: TCP
      name: jaeger-http
    - port: 14250
      targetPort: 14250
      protocol: TCP
      name: jaeger-grpc
    - port: 9411
      targetPort: 9411
      protocol: TCP
      name: zipkin
  selector:
    app: jaeger

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-agent
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6831
      targetPort: 6831
      protocol: UDP
      name: jaeger-compact
    - port: 6832
      targetPort: 6832
      protocol: UDP
      name: jaeger-binary
    - port: 5778
      targetPort: 5778
      protocol: TCP
      name: config-rest
  selector:
    app: jaeger

---
# ============================================================================
# Jaeger Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
data:
  # Sampling strategies (adaptive sampling for high-volume services)
  sampling-strategies.json: |
    {
      "service_strategies": [
        {
          "service": "terrafusion-api",
          "type": "probabilistic",
          "param": 0.1,
          "operation_strategies": [
            {
              "operation": "/api/health",
              "type": "probabilistic",
              "param": 0.01
            }
          ]
        },
        {
          "service": "terrafusion-consciousness",
          "type": "probabilistic",
          "param": 0.05,
          "operation_strategies": [
            {
              "operation": "ai-agent-task",
              "type": "probabilistic",
              "param": 0.1
            }
          ]
        },
        {
          "service": "terrafusion-gateway",
          "type": "probabilistic",
          "param": 0.1
        },
        {
          "service": "terrafusion-operations",
          "type": "probabilistic",
          "param": 0.1
        }
      ],
      "default_strategy": {
        "type": "probabilistic",
        "param": 0.1
      }
    }

---
# ============================================================================
# Jaeger Ingress (NGINX Ingress Controller)
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ingress
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    nginx.ingress.kubernetes.io/rate-limit: '50'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jaeger.terrafusionmarket.com
      secretName: jaeger-tls
  rules:
    - host: jaeger.terrafusionmarket.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-query
                port:
                  number: 16686

---
# ============================================================================
# Production: Jaeger with Elasticsearch Backend
# ============================================================================
# For production deployments, use separate Jaeger components with Elasticsearch:
#
# 1. Elasticsearch StatefulSet (3 replicas for HA)
# 2. Jaeger Collector Deployment
# 3. Jaeger Query Deployment
# 4. Jaeger Agent DaemonSet (on every node)
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-production-config
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
    environment: production
data:
  elasticsearch-config.yaml: |
    # Elasticsearch configuration for Jaeger
    # Replace with actual Elasticsearch cluster details

    ES_SERVER_URLS: https://elasticsearch.tracing.svc.cluster.local:9200
    ES_USERNAME: jaeger
    ES_PASSWORD: ${ES_PASSWORD}
    ES_TLS_ENABLED: true
    ES_TLS_CA: /etc/ssl/certs/ca-certificates.crt
    ES_INDEX_PREFIX: jaeger
    ES_NUM_SHARDS: 5
    ES_NUM_REPLICAS: 1
    ES_BULK_SIZE: 5000000
    ES_BULK_WORKERS: 1
    ES_BULK_FLUSH_INTERVAL: 200ms

---
# ============================================================================
# Service Instrumentation Guide
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-instrumentation-guide
  namespace: tracing
  labels:
    app.kubernetes.io/name: jaeger
data:
  dotnet-instrumentation.md: |
    # TerraFusion .NET Service Instrumentation

    ## 1. Add OpenTelemetry Packages
    ```bash
    dotnet add package OpenTelemetry
    dotnet add package OpenTelemetry.Exporter.Jaeger
    dotnet add package OpenTelemetry.Instrumentation.AspNetCore
    dotnet add package OpenTelemetry.Instrumentation.Http
    ```

    ## 2. Configure OpenTelemetry in Program.cs
    ```csharp
    using OpenTelemetry.Resources;
    using OpenTelemetry.Trace;

    var builder = WebApplication.CreateBuilder(args);

    // Add OpenTelemetry tracing
    builder.Services.AddOpenTelemetry()
        .WithTracing(tracerProviderBuilder =>
        {
            tracerProviderBuilder
                .SetResourceBuilder(ResourceBuilder.CreateDefault()
                    .AddService("terrafusion-api")
                    .AddAttributes(new Dictionary<string, object>
                    {
                        ["deployment.environment"] = "production",
                        ["service.version"] = "1.0.0",
                        ["terrafusion.component"] = "backend-api"
                    }))
                .AddAspNetCoreInstrumentation(options =>
                {
                    options.RecordException = true;
                    options.Filter = (httpContext) => 
                        !httpContext.Request.Path.Value.Contains("/health");
                })
                .AddHttpClientInstrumentation()
                .AddSource("TerraFusion.*")
                .AddJaegerExporter(options =>
                {
                    options.AgentHost = "jaeger-agent.tracing.svc.cluster.local";
                    options.AgentPort = 6831;
                });
        });
    ```

    ## 3. Custom Span Creation
    ```csharp
    using System.Diagnostics;
    using OpenTelemetry;

    public class PropertyValuationService
    {
        private static readonly ActivitySource ActivitySource = 
            new ActivitySource("TerraFusion.PropertyValuation");
        
        public async Task<ValuationResult> ValuatePropertyAsync(Property property)
        {
            using var activity = ActivitySource.StartActivity("ValuateProperty");
            activity?.SetTag("property.id", property.Id);
            activity?.SetTag("property.county", property.CountyId);
            
            try
            {
                var result = await PerformValuationAsync(property);
                activity?.SetTag("valuation.result", result.EstimatedValue);
                return result;
            }
            catch (Exception ex)
            {
                activity?.SetStatus(ActivityStatusCode.Error, ex.Message);
                activity?.RecordException(ex);
                throw;
            }
        }
    }
    ```

    ## 4. AI Agent Trace Correlation
    ```csharp
    public class AIAgentCoordinator
    {
        private static readonly ActivitySource ActivitySource = 
            new ActivitySource("TerraFusion.AIAgentSwarm");
        
        public async Task<SwarmResult> CoordinateSwarmAsync(SwarmRequest request)
        {
            using var activity = ActivitySource.StartActivity("CoordinateAISwarm");
            activity?.SetTag("swarm.agent_count", 50000);
            activity?.SetTag("swarm.quantum_factor", 949);
            
            var traceId = Activity.Current?.TraceId.ToString();
            
            // Pass trace context to AI agents
            var agentTasks = Enumerable.Range(0, request.AgentCount)
                .Select(i => ExecuteAgentTaskAsync(i, traceId))
                .ToArray();
            
            await Task.WhenAll(agentTasks);
            
            activity?.SetTag("swarm.tasks_completed", agentTasks.Length);
            return new SwarmResult { /* ... */ };
        }
        
        private async Task ExecuteAgentTaskAsync(int agentId, string traceId)
        {
            using var activity = ActivitySource.StartActivity("AIAgentTask");
            activity?.SetTag("agent.id", agentId);
            activity?.SetTag("agent.trace_id", traceId);
            
            // AI agent processing logic
            await ProcessAITaskAsync();
        }
    }
    ```

  environment-variables.md: |
    # Environment Variables for Jaeger Tracing

    Add these to your service deployments:

    ```yaml
    env:
      # Jaeger configuration
      - name: JAEGER_AGENT_HOST
        value: "jaeger-agent.tracing.svc.cluster.local"
      - name: JAEGER_AGENT_PORT
        value: "6831"
      - name: JAEGER_SERVICE_NAME
        value: "terrafusion-api"
      - name: JAEGER_SAMPLER_TYPE
        value: "probabilistic"
      - name: JAEGER_SAMPLER_PARAM
        value: "0.1"
      - name: JAEGER_REPORTER_LOG_SPANS
        value: "true"
    ```

  trace-context-propagation.md: |
    # Trace Context Propagation Between Services

    ## HTTP Header Propagation (W3C Trace Context)
    ```csharp
    public class TraceContextPropagatingHandler : DelegatingHandler
    {
        protected override async Task<HttpResponseMessage> SendAsync(
            HttpRequestMessage request, 
            CancellationToken cancellationToken)
        {
            var activity = Activity.Current;
            if (activity != null)
            {
                // W3C Trace Context headers
                request.Headers.Add("traceparent", 
                    $"00-{activity.TraceId}-{activity.SpanId}-01");
                
                if (!string.IsNullOrEmpty(activity.TraceStateString))
                {
                    request.Headers.Add("tracestate", activity.TraceStateString);
                }
            }
            
            return await base.SendAsync(request, cancellationToken);
        }
    }
    ```

    ## Message Queue Propagation (RabbitMQ/Azure Service Bus)
    ```csharp
    public class TracedMessagePublisher
    {
        public async Task PublishAsync<T>(T message) where T : class
        {
            var activity = Activity.Current;
            var messageProperties = new Dictionary<string, object>();
            
            if (activity != null)
            {
                messageProperties["trace-id"] = activity.TraceId.ToString();
                messageProperties["span-id"] = activity.SpanId.ToString();
            }
            
            await _messageBus.PublishAsync(message, messageProperties);
        }
    }
    ```

  query-examples.md: |
    # Jaeger Query Examples

    ## 1. Find traces for specific service
    Service: terrafusion-api

    ## 2. Find traces with errors
    Tags: error=true

    ## 3. Find slow requests (>1s)
    Min Duration: 1s

    ## 4. Find AI agent coordination traces
    Service: terrafusion-consciousness
    Operation: CoordinateAISwarm
    Tags: swarm.agent_count=50000

    ## 5. Find traces by county
    Tags: property.county=benton

    ## 6. Trace correlation with logs
    Use trace ID from Jaeger UI to search logs in Loki:
    {service="terrafusion-api"} |= "trace-id=<TRACE_ID>"

# ============================================================================
# Apply Instructions
# ============================================================================
# 1. Apply Jaeger deployment:
#    kubectl apply -f jaeger-deployment.yaml
#
# 2. Port-forward Jaeger UI:
#    kubectl port-forward -n tracing svc/jaeger-query 16686:16686
#
# 3. Access Jaeger UI:
#    http://localhost:16686
#
# 4. Instrument services (see instrumentation guide):
#    kubectl get configmap jaeger-instrumentation-guide -n tracing -o yaml
#
# 5. View traces:
#    # In Jaeger UI, select service from dropdown
#    # Search traces by operation, tags, duration
#    # Click trace ID to view detailed span timeline
#
# 6. Verify tracing:
#    # Make requests to instrumented services
#    # Check Jaeger UI for traces within ~10 seconds
#
# 7. Production migration to Elasticsearch:
#    # Deploy Elasticsearch cluster
#    # Update SPAN_STORAGE_TYPE to "elasticsearch"
#    # Configure ES_SERVER_URLS in environment
# ============================================================================
