# ============================================================================
# TerraFusion OS - Kubernetes Namespace Configuration
# Government. Transcended. - Namespace Isolation for Production Deployment
# ============================================================================
# Purpose: Create isolated namespace for TerraFusion OS microservices
# Features: Resource quotas, network policies, RBAC isolation
# Security: FISMA-High compliance, multi-tenant isolation
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: terrafusion
  labels:
    name: terrafusion
    environment: production
    compliance: fisma-high
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/version: '1.0.0'
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: terrafusion-platform
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: 'TerraFusion OS Production Environment - Government. Transcended.'
    owner: 'TerraFusion Engineering'
    compliance: 'FISMA-High, NIST 800-53'

---
# ============================================================================
# Resource Quotas - Limit Resource Usage per Namespace
# ============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: terrafusion-quota
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: resource-quota
spec:
  hard:
    # Compute Resources
    requests.cpu: '50'
    requests.memory: 100Gi
    limits.cpu: '100'
    limits.memory: 200Gi

    # Storage Resources
    requests.storage: 500Gi
    persistentvolumeclaims: '20'

    # Object Counts
    pods: '100'
    services: '50'
    configmaps: '50'
    secrets: '50'
    replicationcontrollers: '20'
    services.loadbalancers: '5'
    services.nodeports: '10'

---
# ============================================================================
# Limit Ranges - Default and Maximum Resource Limits for Pods/Containers
# ============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: terrafusion-limits
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: limit-range
spec:
  limits:
    # Container Limits
    - type: Container
      max:
        cpu: '8'
        memory: 16Gi
      min:
        cpu: '100m'
        memory: 128Mi
      default:
        cpu: '1'
        memory: 1Gi
      defaultRequest:
        cpu: '500m'
        memory: 512Mi
      maxLimitRequestRatio:
        cpu: '4'
        memory: '4'

    # Pod Limits
    - type: Pod
      max:
        cpu: '16'
        memory: 32Gi
      min:
        cpu: '200m'
        memory: 256Mi

    # PersistentVolumeClaim Limits
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi

---
# ============================================================================
# Network Policy - Restrict Network Traffic Between Pods
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: terrafusion-network-policy
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: terrafusion-platform
  policyTypes:
    - Ingress
    - Egress

  # Ingress Rules - Allow Traffic From Specific Sources
  ingress:
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3002 # Gateway

    # Allow internal communication between TerraFusion services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: terrafusion-platform
      ports:
        - protocol: TCP
          port: 5000 # API
        - protocol: TCP
          port: 3004 # Consciousness
        - protocol: TCP
          port: 3002 # Gateway
        - protocol: TCP
          port: 5002 # Operations

    # Allow monitoring traffic from Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 8080 # Metrics endpoint

  # Egress Rules - Allow Traffic To Specific Destinations
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow communication to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

    # Allow communication to Redis
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379

    # Allow internal service communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: terrafusion-platform
      ports:
        - protocol: TCP
          port: 5000 # API
        - protocol: TCP
          port: 3004 # Consciousness
        - protocol: TCP
          port: 3002 # Gateway
        - protocol: TCP
          port: 5002 # Operations

    # Allow external HTTPS for API calls (if needed)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

---
# ============================================================================
# Service Account - RBAC for TerraFusion Services
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-service-account
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: service-account
automountServiceAccountToken: true

---
# ============================================================================
# Role - Define Permissions within Namespace
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: terrafusion-role
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: role
rules:
  # Allow reading ConfigMaps and Secrets
  - apiGroups: ['']
    resources: ['configmaps', 'secrets']
    verbs: ['get', 'list', 'watch']

  # Allow reading Services and Endpoints for service discovery
  - apiGroups: ['']
    resources: ['services', 'endpoints']
    verbs: ['get', 'list', 'watch']

  # Allow reading Pods for health checks
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']

  # Allow reading Events for troubleshooting
  - apiGroups: ['']
    resources: ['events']
    verbs: ['get', 'list', 'watch']

---
# ============================================================================
# RoleBinding - Bind Role to Service Account
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: terrafusion-role-binding
  namespace: terrafusion
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: role-binding
subjects:
  - kind: ServiceAccount
    name: terrafusion-service-account
    namespace: terrafusion
roleRef:
  kind: Role
  name: terrafusion-role
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================================
# Pod Security Policy - Enforce Security Standards (Optional)
# ============================================================================
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: terrafusion-psp
  labels:
    app.kubernetes.io/name: terrafusion-os
    app.kubernetes.io/component: pod-security-policy
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: false
# ============================================================================
# Apply Instructions
# ============================================================================
# Apply namespace and policies:
#   kubectl apply -f namespace.yaml
#
# Verify namespace creation:
#   kubectl get namespace terrafusion
#   kubectl describe namespace terrafusion
#
# View resource quotas:
#   kubectl get resourcequota -n terrafusion
#   kubectl describe resourcequota terrafusion-quota -n terrafusion
#
# View limit ranges:
#   kubectl get limitrange -n terrafusion
#   kubectl describe limitrange terrafusion-limits -n terrafusion
#
# View network policies:
#   kubectl get networkpolicy -n terrafusion
#   kubectl describe networkpolicy terrafusion-network-policy -n terrafusion
#
# View service account:
#   kubectl get serviceaccount -n terrafusion
#   kubectl describe serviceaccount terrafusion-service-account -n terrafusion
#
# Delete namespace (WARNING: Deletes all resources):
#   kubectl delete namespace terrafusion
# ============================================================================
