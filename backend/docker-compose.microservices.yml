# TerraFusion OS 1.0 Microservices Architecture
# Only services with real Dockerfiles are defined here.
# Phantom services removed per R7 Deployment Unblocker sprint.

x-common-variables: &common-variables
  TERRAFUSION_ENVIRONMENT: ${TERRAFUSION_ENVIRONMENT:-development}
  CONSUL_HOST: consul
  CONSUL_PORT: 8500
  REDIS_HOST: redis
  REDIS_PORT: 6379
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: terrafusion_os
  POSTGRES_USER: ${POSTGRES_USER:-terrafusion}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TerraFusion2024!}
  JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-for-development}
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

x-common-labels: &common-labels
  terrafusion.system: "microservices"
  terrafusion.version: "1.0"
  government.compliance: "FISMA-HIGH"

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  consul-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  # ==================================================
  # INFRASTRUCTURE SERVICES
  # ==================================================

  consul:
    image: consul:1.15
    container_name: terrafusion-consul
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
    environment:
      CONSUL_BIND_INTERFACE: eth0
    command: >
      consul agent
      -server
      -bootstrap-expect=1
      -datacenter=terrafusion-dc1
      -data-dir=/consul/data
      -bind=0.0.0.0
      -client=0.0.0.0
      -retry-join=consul
      -ui
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: terrafusion_os
      POSTGRES_USER: ${POSTGRES_USER:-terrafusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TerraFusion2024!}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion -d terrafusion_os"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-TerraFusion2024!}
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: terrafusion-rabbitmq
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-terrafusion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-TerraFusion2024!}
      RABBITMQ_DEFAULT_VHOST: terrafusion
    labels:
      <<: *common-labels
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================================================
  # MONITORING AND OBSERVABILITY
  # ==================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    labels:
      <<: *common-labels

  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-TerraFusion2024!}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    labels:
      <<: *common-labels

  # ==================================================
  # TERRAFUSION CORE SERVICES (real Dockerfiles only)
  # ==================================================

  # Kernel — TerraFusion.API (port 5000)
  api:
    build:
      context: .
      dockerfile: Dockerfile.API
    container_name: terrafusion-api
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "5000:5000"
    environment:
      <<: *common-variables
      SERVICE_NAME: api
      SERVICE_PORT: 5000
      ASPNETCORE_URLS: "http://+:5000"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Shell — TerraFusion.Gateway (port 3002)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.Gateway
    container_name: terrafusion-gateway
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "3002:3002"
    environment:
      <<: *common-variables
      SERVICE_NAME: gateway
      SERVICE_PORT: 3002
      ASPNETCORE_URLS: "http://+:3002"
    depends_on:
      consul:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Consciousness — AI Swarm Orchestration (port 3004)
  consciousness:
    build:
      context: .
      dockerfile: Dockerfile.Consciousness
    container_name: terrafusion-consciousness
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "3004:3004"
    environment:
      <<: *common-variables
      SERVICE_NAME: consciousness
      SERVICE_PORT: 3004
      ASPNETCORE_URLS: "http://+:3004"
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      <<: *common-labels
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================================================
  # DEVELOPMENT TOOLS (Optional — activate with --profile development)
  # ==================================================

  consul-ui:
    image: consul:1.15
    container_name: terrafusion-consul-ui
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "8501:8500"
    command: consul agent -dev -client=0.0.0.0 -ui
    profiles:
      - development
    labels:
      <<: *common-labels

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: terrafusion-redis-commander
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-TerraFusion2024!}
    depends_on:
      - redis
    profiles:
      - development
    labels:
      <<: *common-labels

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: terrafusion-pgadmin
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@terrafusion.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-TerraFusion2024!}
    depends_on:
      - postgres
    profiles:
      - development
    labels:
      <<: *common-labels
