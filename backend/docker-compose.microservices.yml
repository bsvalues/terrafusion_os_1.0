# TerraFusion OS 1.0 - Microservices Compose
# Real services only: API, Consciousness, Gateway, PostgreSQL, Redis

x-common-env: &common-env
  TERRAFUSION_ENVIRONMENT: ${TERRAFUSION_ENVIRONMENT:-development}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: terrafusion_os
  POSTGRES_USER: ${POSTGRES_USER:-terrafusion}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

networks:
  terrafusion-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  # ── Infrastructure ────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: terrafusion-postgres
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: terrafusion_os
      POSTGRES_USER: ${POSTGRES_USER:-terrafusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-terrafusion} -d terrafusion_os']
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Application Services ──────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: terrafusion-api
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - '5000:5000'
    environment:
      <<: *common-env
      SERVICE_NAME: api
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=terrafusion_os;Username=${POSTGRES_USER:-terrafusion};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  consciousness:
    build:
      context: .
      dockerfile: Dockerfile.Consciousness
    container_name: terrafusion-consciousness
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - '3004:3004'
    environment:
      <<: *common-env
      SERVICE_NAME: consciousness
      ASPNETCORE_URLS: http://+:3004
      ConnectionStrings__DefaultConnection: 'Host=postgres;Port=5432;Database=terrafusion_os;Username=${POSTGRES_USER:-terrafusion};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/health']
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.Gateway
    container_name: terrafusion-gateway
    restart: unless-stopped
    networks:
      - terrafusion-network
    ports:
      - '3002:3002'
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      ASPNETCORE_URLS: http://+:3002
      Gateway__API__Host: api
      Gateway__API__Port: '5000'
      Gateway__Consciousness__Host: consciousness
      Gateway__Consciousness__Port: '3004'
    depends_on:
      - api
      - consciousness
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/health']
      interval: 30s
      timeout: 10s
      retries: 3
