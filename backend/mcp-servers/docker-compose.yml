# MCP Servers Configuration for TerraFusion Special Teams Deployment

services:
  # MCP Document Server
  mcp-document-server:
    build:
      context: ./document-server
      dockerfile: Dockerfile
    environment:
      - MCP_SERVER_NAME=document-processor
      - MCP_SERVER_VERSION=1.0.0
      - DOCUMENT_PROCESSOR_URL=http://document-processor-api-gateway-1:8000
      - REDIS_URL=redis://document-processor-redis-1:6379
    ports:
      - "8100:${TF_STATIC_PORT:-8080}"
    networks:
      - terrafusion-network
      - document-processor_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Office365 Server
  mcp-office365-server:
    build:
      context: ./office365-server
      dockerfile: Dockerfile
    environment:
      - MCP_SERVER_NAME=office365-toolkit
      - MCP_SERVER_VERSION=1.0.0
      - OFFICE365_API_URL=http://office365-api:${TF_STATIC_PORT:-8080}
    ports:
      - "8101:${TF_STATIC_PORT:-8080}"
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Property Analytics Server
  mcp-property-server:
    build:
      context: ./property-server
      dockerfile: Dockerfile
    environment:
      - MCP_SERVER_NAME=property-analytics
      - MCP_SERVER_VERSION=1.0.0
      - TERRAFUSION_API_URL=http://gateway:${TF_STATIC_PORT:-8080}
      - POSTGRES_URL=postgresql://postgres:password@postgres:5432/terrafusion
    ports:
      - "8102:${TF_STATIC_PORT:-8080}"
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP API Gateway
  mcp-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - MCP_SERVERS=document-processor,office365-toolkit,property-analytics
      - CORS_ENABLED=true
      - AUTH_ENABLED=true
    ports:
      - "8200:${TF_STATIC_PORT:-8080}"
    depends_on:
      - mcp-document-server
      - mcp-office365-server
      - mcp-property-server
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_ADMIN_PORT:-8080}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  terrafusion-network:
    external: true
  document-processor_default:
    external: true