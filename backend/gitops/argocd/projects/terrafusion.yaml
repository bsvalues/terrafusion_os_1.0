apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: terrafusion
  namespace: argocd
  annotations:
    terrafusion.io/platform: "complete"
    terrafusion.io/compliance: "FISMA-High"
spec:
  description: |
    TerraFusion OS - Complete Government AI Platform
    Government. Transcended. - 50,000 AI Agents | 39 Counties
  
  # Source repositories
  sourceRepos:
    - 'https://github.com/terrafusion/terrafusion-os'
    - 'https://github.com/terrafusion/terrafusion-helm-charts'
    - 'ghcr.io/terrafusion/*'
  
  # Destination clusters and namespaces
  destinations:
    - namespace: 'terrafusion'
      server: 'https://kubernetes.default.svc'
      name: 'in-cluster'
    - namespace: 'terrafusion-dev'
      server: 'https://kubernetes.default.svc'
    - namespace: 'terrafusion-staging'
      server: 'https://kubernetes.default.svc'
    - namespace: 'monitoring'
      server: 'https://kubernetes.default.svc'
    - namespace: 'tracing'
      server: 'https://kubernetes.default.svc'
    - namespace: 'logging'
      server: 'https://kubernetes.default.svc'
  
  # Cluster resource allowlist
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
    - group: 'networking.k8s.io'
      kind: IngressClass
    - group: 'storage.k8s.io'
      kind: StorageClass
  
  # Namespace resource allowlist (all resources allowed)
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  
  # Roles for fine-grained access control
  roles:
    - name: admin
      description: Full admin access to TerraFusion applications
      policies:
        - p, proj:terrafusion:admin, applications, *, terrafusion/*, allow
        - p, proj:terrafusion:admin, repositories, *, *, allow
        - p, proj:terrafusion:admin, clusters, *, *, allow
      groups:
        - terrafusion-admins
        - platform-admins
    
    - name: developer
      description: Developer access to non-production environments
      policies:
        - p, proj:terrafusion:developer, applications, get, terrafusion/*, allow
        - p, proj:terrafusion:developer, applications, sync, terrafusion/*-dev, allow
        - p, proj:terrafusion:developer, applications, sync, terrafusion/*-staging, allow
        - p, proj:terrafusion:developer, applications, override, terrafusion/*-dev, allow
      groups:
        - terrafusion-developers
    
    - name: operator
      description: Operations team - can sync production
      policies:
        - p, proj:terrafusion:operator, applications, get, terrafusion/*, allow
        - p, proj:terrafusion:operator, applications, sync, terrafusion/*, allow
        - p, proj:terrafusion:operator, logs, get, terrafusion/*, allow
      groups:
        - terrafusion-operators
        - sre-team
    
    - name: viewer
      description: Read-only access to all environments
      policies:
        - p, proj:terrafusion:viewer, applications, get, terrafusion/*, allow
        - p, proj:terrafusion:viewer, logs, get, terrafusion/*, allow
      groups:
        - terrafusion-viewers
        - audit-team
  
  # Sync windows - maintenance windows
  syncWindows:
    - kind: allow
      schedule: '0 2 * * *'  # 2 AM daily
      duration: 2h
      applications:
        - '*-dev'
        - '*-staging'
      namespaces:
        - terrafusion-dev
        - terrafusion-staging
      clusters:
        - in-cluster
      manualSync: true
    
    - kind: deny
      schedule: '0 9-17 * * 1-5'  # Business hours (9 AM - 5 PM, Mon-Fri)
      duration: 8h
      applications:
        - 'terrafusion-platform-prod'
      namespaces:
        - terrafusion
      clusters:
        - in-cluster
      manualSync: false
  
  # Orphaned resources handling
  orphanedResources:
    warn: true
    ignore:
      - group: 'v1'
        kind: 'ConfigMap'
        name: 'argocd-cm'
      - group: 'v1'
        kind: 'Secret'
        name: 'argocd-secret'
  
  # Signature keys for commit verification
  signatureKeys:
    - keyID: '4AEE18F83AFDEB23'  # TerraFusion GPG key
