# Prometheus Configuration for TerraFusion OS 1.0
# Service names match docker-compose.microservices.yml definitions.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'terrafusion'
    environment: 'development'

scrape_configs:
  # TerraFusion API (Kernel) - port 5000
  - job_name: 'terrafusion-api'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'api'
          tier: 'kernel'
    metrics_path: '/metrics'

  # TerraFusion Gateway (Shell) - port 3002
  - job_name: 'terrafusion-gateway'
    static_configs:
      - targets: ['gateway:3002']
        labels:
          service: 'gateway'
          tier: 'shell'
    metrics_path: '/metrics'

  # TerraFusion Consciousness (AI Swarm) - port 3004
  - job_name: 'terrafusion-consciousness'
    static_configs:
      - targets: ['consciousness:3004']
        labels:
          service: 'consciousness'
          tier: 'ai'
    metrics_path: '/metrics'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
