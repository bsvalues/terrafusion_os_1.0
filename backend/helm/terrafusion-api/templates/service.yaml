{{/*
============================================================================
TerraFusion API - Service Template
Government. Transcended. - ClusterIP Service with Prometheus Metrics
============================================================================
*/}}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "terrafusion-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terrafusion-api.labels" . | nindent 4 }}
    terrafusion.io/component: api
    terrafusion.io/tier: core
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
    description: "TerraFusion OS Core API Service"
    compliance: "FISMA-High"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "terrafusion-api.selectorLabels" . | nindent 4 }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours for long-running operations
