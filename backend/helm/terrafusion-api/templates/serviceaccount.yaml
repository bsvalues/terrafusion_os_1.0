{{/*
============================================================================
TerraFusion API - ServiceAccount Template
Government. Transcended. - Kubernetes RBAC Service Account
============================================================================
*/}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terrafusion-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terrafusion-api.labels" . | nindent 4 }}
    terrafusion.io/component: api
    terrafusion.io/tier: core
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    description: "TerraFusion API Service Account"
    compliance: "FISMA-High"
  {{- end }}
{{- end }}
