# ============================================================================
# TerraFusion API - Helm Values Configuration
# Government. Transcended. - Multi-Environment Production Deployment
# ============================================================================
# This values file supports dev/staging/production environments with
# county-specific tenant configurations for 39 Washington State counties.
# ============================================================================

# ============================================================================
# Global Configuration
# ============================================================================
global:
  # Environment: dev, staging, production
  environment: production
  
  # TerraFusion domain
  domain: terrafusion.gov
  
  # Image registry
  imageRegistry: ghcr.io/terrafusion
  
  # Image pull secrets (for private registry)
  imagePullSecrets:
    - name: terrafusion-registry-secret

# ============================================================================
# Application Configuration
# ============================================================================
replicaCount: 3  # High availability with 3 replicas

image:
  repository: ghcr.io/terrafusion/terrafusion-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"  # Overridden by CI/CD pipeline

# Service configuration
service:
  type: ClusterIP
  port: 5000
  targetPort: 5000
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "5000"
    prometheus.io/path: "/metrics"

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: api.terrafusion.gov
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: terrafusion-api-tls
      hosts:
        - api.terrafusion.gov

# Resource limits (FISMA-High compliant)
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30

# Health check configuration
livenessProbe:
  httpGet:
    path: /health/live
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: 5000
  initialDelaySeconds: 0
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Security context (FISMA-High compliance)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# Node affinity for high-availability
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - terrafusion-api
          topologyKey: kubernetes.io/hostname

# Tolerations for dedicated nodes
tolerations: []

# Node selector for production workloads
nodeSelector:
  terrafusion.io/workload: production

# ============================================================================
# Environment Variables
# ============================================================================
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:5000"
  - name: TZ
    value: "America/Los_Angeles"  # Pacific Time (Washington State)
  - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
    value: "false"
  - name: DOTNET_gcServer
    value: "1"  # Server GC for better throughput
  - name: DOTNET_gcConcurrent
    value: "1"  # Concurrent GC for lower latency

# Secrets (referenced from Kubernetes secrets)
envFrom:
  - secretRef:
      name: terrafusion-api-secrets  # Database credentials, API keys, etc.
  - configMapRef:
      name: terrafusion-api-config   # Non-sensitive configuration

# ============================================================================
# Database Configuration
# ============================================================================
database:
  # PostgreSQL connection (secret reference)
  host: "postgres.terrafusion.svc.cluster.local"
  port: 5432
  name: "terrafusion"
  ssl: true
  poolSize: 100
  connectionTimeout: 30

# ============================================================================
# Redis Cache Configuration
# ============================================================================
redis:
  enabled: true
  host: "redis.terrafusion.svc.cluster.local"
  port: 6379
  database: 0
  ssl: true

# ============================================================================
# Integration Configuration
# ============================================================================
integrations:
  # TerraFusion Consciousness Engine
  consciousness:
    enabled: true
    url: "http://terrafusion-consciousness.terrafusion.svc.cluster.local:3004"
    timeout: 30000  # 30 seconds
  
  # TerraFusion Gateway
  gateway:
    enabled: true
    url: "http://terrafusion-gateway.terrafusion.svc.cluster.local:3002"
  
  # TerraFusion Operations
  operations:
    enabled: true
    url: "http://terrafusion-operations.terrafusion.svc.cluster.local:5003"

# ============================================================================
# Monitoring Configuration
# ============================================================================
monitoring:
  prometheus:
    enabled: true
    port: 5000
    path: "/metrics"
  
  jaeger:
    enabled: true
    agentHost: "jaeger-agent.tracing.svc.cluster.local"
    agentPort: 6831
    samplingRate: 0.1  # 10% sampling in production
  
  loki:
    enabled: true
    url: "http://loki.logging.svc.cluster.local:3100"

# ============================================================================
# Compliance Configuration (FISMA-High)
# ============================================================================
compliance:
  fisma:
    enabled: true
    level: "high"
    auditLogging: true
    dataEncryption: true
  
  # County data isolation
  multiTenancy:
    enabled: true
    isolationLevel: "strict"
    tenantIdHeader: "X-County-ID"

# ============================================================================
# County-Specific Configuration (39 Washington State Counties)
# ============================================================================
counties:
  # Major counties with specific configurations
  benton:
    enabled: true
    harrisPacs:
      jurisdiction: "BENTON_WA"
      syncInterval: 15  # minutes
    sla:
      availability: 0.999
      responseTime: 150  # ms P95
  
  king:
    enabled: true
    harrisPacs:
      jurisdiction: "KING_WA"
      syncInterval: 10  # minutes (larger volume)
    sla:
      availability: 0.999
      responseTime: 150
  
  pierce:
    enabled: true
    harrisPacs:
      jurisdiction: "PIERCE_WA"
      syncInterval: 12
    sla:
      availability: 0.999
      responseTime: 150
  
  spokane:
    enabled: true
    harrisPacs:
      jurisdiction: "SPOKANE_WA"
      syncInterval: 15
    sla:
      availability: 0.999
      responseTime: 150
  
  # Additional 35 counties (abbreviated for clarity)
  # Each county follows same structure with specific configurations

# ============================================================================
# Service Account Configuration
# ============================================================================
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/terrafusion-api"
  name: "terrafusion-api"

# ============================================================================
# ConfigMap Configuration
# ============================================================================
configMap:
  create: true
  data:
    appsettings.json: |
      {
        "Logging": {
          "LogLevel": {
            "Default": "Information",
            "Microsoft": "Warning",
            "Microsoft.Hosting.Lifetime": "Information"
          }
        },
        "AllowedHosts": "*",
        "Kestrel": {
          "Limits": {
            "MaxConcurrentConnections": 1000,
            "MaxRequestBodySize": 10485760
          }
        }
      }

# ============================================================================
# PodDisruptionBudget Configuration
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Ensure at least 2 pods always running

# ============================================================================
# NetworkPolicy Configuration (FISMA-High)
# ============================================================================
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 3004  # Consciousness
        - protocol: TCP
          port: 3002  # Gateway

# ============================================================================
# Environment-Specific Overrides
# ============================================================================

# Development environment values (values-dev.yaml)
# replicaCount: 1
# resources.requests.cpu: 100m
# resources.requests.memory: 256Mi
# autoscaling.enabled: false
# ingress.hosts[0].host: api-dev.terrafusion.gov

# Staging environment values (values-staging.yaml)
# replicaCount: 2
# resources.requests.cpu: 250m
# resources.requests.memory: 512Mi
# autoscaling.minReplicas: 2
# autoscaling.maxReplicas: 10
# ingress.hosts[0].host: api-staging.terrafusion.gov

# Production environment values (values-production.yaml)
# (Use defaults from this file)

# ============================================================================
# Advanced Features
# ============================================================================

# Circuit breaker configuration
circuitBreaker:
  enabled: true
  failureThreshold: 5
  timeout: 30
  resetTimeout: 60

# Rate limiting
rateLimiting:
  enabled: true
  requestsPerMinute: 1000
  burstSize: 100

# Caching
caching:
  enabled: true
  defaultTTL: 300  # 5 minutes
  
# AI Agent Configuration
aiAgent:
  enabled: true
  maxConcurrentRequests: 100
  timeout: 30000
  quantumOptimizationFactor: 949

# Property Assessment Configuration
propertyAssessment:
  enabled: true
  iaaoComplianceTarget: 0.999  # 99.9% accuracy
  maxPropertiesPerBatch: 1000
