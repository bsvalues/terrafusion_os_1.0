{{/*
============================================================================
TerraFusion Consciousness Engine - ServiceAccount Template
Government. Transcended. - Kubernetes RBAC for AI Agents
============================================================================
*/}}

{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "terrafusion-consciousness.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terrafusion-consciousness.labels" . | nindent 4 }}
    terrafusion.io/component: consciousness
    terrafusion.io/tier: ai
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
    description: "TerraFusion Consciousness Engine Service Account"
    compliance: "FISMA-High"
  {{- end }}
{{- end }}
