# ============================================================================
# TerraFusion Consciousness Engine - Helm Values Configuration
# Government. Transcended. - 50,000+ AI Agent Swarm with Quantum Optimization
# ============================================================================

# ============================================================================
# Global Configuration
# ============================================================================
global:
  environment: production
  domain: terrafusion.gov
  imageRegistry: ghcr.io/terrafusion
  imagePullSecrets:
    - name: terrafusion-registry-secret

# ============================================================================
# Application Configuration
# ============================================================================
replicaCount: 5  # High availability with 5 replicas for 50,000 agents

image:
  repository: ghcr.io/terrafusion/terrafusion-consciousness
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Service configuration
service:
  type: ClusterIP
  port: 3004
  targetPort: 3004
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3004"
    prometheus.io/path: "/metrics"

# Ingress configuration (WebSocket support for AI agents)
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"  # Larger for AI model data
    
    # WebSocket support for real-time AI agent communication
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: terrafusion-consciousness
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  hosts:
    - host: consciousness.terrafusion.gov
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: terrafusion-consciousness-tls
      hosts:
        - consciousness.terrafusion.gov

# Resource limits (optimized for 50,000 AI agents)
resources:
  requests:
    cpu: 4000m  # 4 cores for AI coordination
    memory: 16Gi  # 16GB for 50,000 agents + ML models
  limits:
    cpu: 16000m  # 16 cores burst capacity
    memory: 64Gi  # 64GB maximum for heavy AI workloads

# Autoscaling configuration (aggressive for AI load)
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50  # Scale to 50 pods for extreme AI load
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 min stabilization for AI agents
      policies:
        - type: Percent
          value: 25  # Slower scale-down to prevent agent disruption
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 5
          periodSeconds: 15

# Health check configuration (AI-aware)
livenessProbe:
  httpGet:
    path: /health/live
    port: 3004
  initialDelaySeconds: 60  # Longer for AI agent initialization
  periodSeconds: 15
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: 3004
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: 3004
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60  # 600s = 10 minutes for ML model loading

# Security context (FISMA-High compliance)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

# Node affinity for AI workloads (GPU nodes if available)
affinity:
  # Prefer GPU nodes for ML model inference
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: gpu.terrafusion.io/type
              operator: In
              values:
                - nvidia-tesla-t4
                - nvidia-a100
  
  # Anti-affinity to spread AI agents across nodes
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - terrafusion-consciousness
          topologyKey: kubernetes.io/hostname

# Tolerations for GPU nodes
tolerations:
  - key: "gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# Node selector for AI-optimized nodes
nodeSelector:
  terrafusion.io/workload: ai-intensive

# ============================================================================
# Environment Variables
# ============================================================================
env:
  - name: ASPNETCORE_ENVIRONMENT
    value: "Production"
  - name: ASPNETCORE_URLS
    value: "http://+:3004"
  - name: TZ
    value: "America/Los_Angeles"
  - name: DOTNET_gcServer
    value: "1"
  - name: DOTNET_gcConcurrent
    value: "1"
  
  # AI-specific environment variables
  - name: AI_AGENT_COUNT
    value: "50000"
  - name: QUANTUM_OPTIMIZATION_FACTOR
    value: "949"
  - name: ML_MODEL_CACHE_SIZE_MB
    value: "2048"
  - name: PARALLEL_PROCESSING_THREADS
    value: "8"

# ============================================================================
# AI Agent Configuration
# ============================================================================
aiAgent:
  # Total agent count
  totalAgents: 50000
  
  # Agent distribution per pod
  agentsPerPod: 10000
  
  # Quantum optimization
  quantumOptimizationFactor: 949
  
  # Agent types and counts
  agentTypes:
    propertyValuation: 15000
    dataAnalysis: 10000
    complianceValidation: 8000
    performanceMonitoring: 5000
    securityAudit: 4000
    userExperience: 3000
    dataSync: 2500
    healthCheck: 2500
  
  # Swarm coordination
  swarmIntelligence:
    enabled: true
    coordinationInterval: 1000  # ms
    consensusThreshold: 0.75
  
  # Agent communication
  communication:
    protocol: "websocket"
    heartbeatInterval: 5000  # ms
    timeout: 30000  # ms

# ============================================================================
# ML Model Configuration
# ============================================================================
mlModels:
  # Model cache
  cache:
    enabled: true
    sizeMB: 2048
    persistenceEnabled: true
  
  # Model registry
  registry:
    enabled: true
    url: "https://models.terrafusion.gov"
  
  # AutoML configuration
  automl:
    enabled: true
    algorithms:
      - FastTreeRegression
      - LightGbm
      - SdcaRegression
    experimentTime: 300  # seconds
  
  # Model versioning
  versioning:
    strategy: "semantic"
    defaultVersion: "1.0.0"

# ============================================================================
# Database Configuration
# ============================================================================
database:
  host: "postgres.terrafusion.svc.cluster.local"
  port: 5432
  name: "terrafusion_consciousness"
  ssl: true
  poolSize: 200  # Higher for AI agent coordination
  connectionTimeout: 30

# ============================================================================
# Redis Cache Configuration
# ============================================================================
redis:
  enabled: true
  host: "redis.terrafusion.svc.cluster.local"
  port: 6379
  database: 1  # Separate database from API
  ssl: true
  
  # AI agent state caching
  agentStateCaching:
    enabled: true
    ttl: 300  # 5 minutes

# ============================================================================
# Integration Configuration
# ============================================================================
integrations:
  # TerraFusion API
  api:
    enabled: true
    url: "http://terrafusion-api.terrafusion.svc.cluster.local:5000"
    timeout: 30000
  
  # TerraFusion Gateway
  gateway:
    enabled: true
    url: "http://terrafusion-gateway.terrafusion.svc.cluster.local:3002"
  
  # TerraFusion Operations
  operations:
    enabled: true
    url: "http://terrafusion-operations.terrafusion.svc.cluster.local:5003"

# ============================================================================
# Monitoring Configuration
# ============================================================================
monitoring:
  prometheus:
    enabled: true
    port: 3004
    path: "/metrics"
    
    # Custom AI metrics
    customMetrics:
      - ai_agent_count
      - ai_agent_active_count
      - ai_agent_queue_depth
      - quantum_optimization_score
      - ml_model_inference_latency
      - swarm_coordination_latency
  
  jaeger:
    enabled: true
    agentHost: "jaeger-agent.tracing.svc.cluster.local"
    agentPort: 6831
    samplingRate: 0.05  # 5% sampling for high-volume AI operations
  
  loki:
    enabled: true
    url: "http://loki.logging.svc.cluster.local:3100"

# ============================================================================
# Compliance Configuration (FISMA-High)
# ============================================================================
compliance:
  fisma:
    enabled: true
    level: "high"
    auditLogging: true
    dataEncryption: true
  
  # AI ethics and governance
  aiGovernance:
    enabled: true
    biasDetection: true
    explainability: true
    auditTrail: true

# ============================================================================
# Persistent Volume Claims (ML Model Cache)
# ============================================================================
persistence:
  enabled: true
  storageClass: "fast-ssd"
  size: 50Gi  # 50GB for ML model cache
  accessMode: ReadWriteOnce

# ============================================================================
# Service Account Configuration
# ============================================================================
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/terrafusion-consciousness"
  name: "terrafusion-consciousness"

# ============================================================================
# PodDisruptionBudget Configuration
# ============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 3  # Ensure at least 3 pods for 50,000 agents

# ============================================================================
# NetworkPolicy Configuration (FISMA-High)
# ============================================================================
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
      ports:
        - protocol: TCP
          port: 3004
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: terrafusion
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 5000  # API
        - protocol: TCP
          port: 3002  # Gateway
        - protocol: TCP
          port: 5003  # Operations

# ============================================================================
# County-Specific Configuration (39 Washington State Counties)
# ============================================================================
counties:
  benton:
    enabled: true
    aiAgents: 1500
  king:
    enabled: true
    aiAgents: 3000  # Larger county
  pierce:
    enabled: true
    aiAgents: 2000
  spokane:
    enabled: true
    aiAgents: 1500
