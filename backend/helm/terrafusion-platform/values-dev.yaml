# ============================================================================
# TerraFusion Platform - Development Environment
# Government. Transcended. - Lightweight Configuration for Local Development
# ============================================================================

global:
  environment: development
  domain: terrafusion.local
  imageRegistry: localhost:5000
  imagePullPolicy: Always
  
  tls:
    enabled: false
    
  monitoring:
    enabled: true
    prometheus:
      scrapeInterval: 30s
    grafana:
      enabled: true
    jaeger:
      enabled: true
    loki:
      enabled: false

# Component enablement
api:
  enabled: true

consciousness:
  enabled: true

gateway:
  enabled: true

operations:
  enabled: true

# TerraFusion API - Development
terrafusion-api:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 8Gi
      
  autoscaling:
    enabled: false
    
  ingress:
    enabled: false

# TerraFusion Consciousness - Development
terrafusion-consciousness:
  replicaCount: 1
  
  aiAgent:
    totalAgents: 1000
    agentsPerPod: 1000
    quantumOptimizationFactor: 949
    
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 4000m
      memory: 16Gi
      
  autoscaling:
    enabled: false
    
  persistence:
    enabled: false
    
  ingress:
    enabled: false

# TerraFusion Gateway - Development
terrafusion-gateway:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 4Gi
      
  autoscaling:
    enabled: false
    
  gateway:
    rateLimiting:
      enabled: false
      
  ingress:
    enabled: false

# TerraFusion Operations - Development
terrafusion-operations:
  replicaCount: 1
  
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 8Gi
      
  autoscaling:
    enabled: false
    
  counties:
    benton:
      enabled: true
      aiAgents: 100
    king:
      enabled: false
    pierce:
      enabled: false
    spokane:
      enabled: false
      
  ingress:
    enabled: false
