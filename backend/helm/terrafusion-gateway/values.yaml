# ============================================================================
# TerraFusion Gateway (Ocelot API Gateway) - Helm Chart Values
# Government. Transcended. - Port 3002
# ============================================================================

global:
  environment: production
  region: us-west-2
  domain: terrafusion.gov

replicaCount: 3

image:
  repository: ghcr.io/terrafusion/terrafusion-gateway
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/TerraFusionGatewayRole
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3002"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3002
  targetPort: http
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-burst: "2000"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://terrafusion.gov,https://*.terrafusion.gov"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: gateway.terrafusion.gov
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: terrafusion-gateway-tls
      hosts:
        - gateway.terrafusion.gov

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max

nodeSelector:
  terrafusion.io/workload: gateway

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - terrafusion-gateway
          topologyKey: kubernetes.io/hostname

# Ocelot Gateway Configuration
ocelot:
  globalConfiguration:
    baseUrl: https://gateway.terrafusion.gov
    requestIdKey: TerraFusion-Request-Id
    rateLimitOptions:
      disableRateLimitHeaders: false
      quotaExceededMessage: "Rate limit exceeded. Please retry after {0} seconds."
      httpStatusCode: 429
    qosOptions:
      exceptionsAllowedBeforeBreaking: 3
      durationOfBreak: 30000  # 30 seconds
      timeoutValue: 30000      # 30 seconds
    loadBalancerOptions:
      type: RoundRobin
      key: ""
      expiry: 0
  
  # Backend Routes
  routes:
    # TerraFusion API (port 5000)
    - downstreamPathTemplate: "/api/{everything}"
      downstreamScheme: http
      downstreamHostAndPorts:
        - host: terrafusion-api
          port: 5000
      upstreamPathTemplate: "/api/{everything}"
      upstreamHttpMethod:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
      rateLimitOptions:
        clientWhitelist: []
        enableRateLimiting: true
        period: 1s
        periodTimespan: 1
        limit: 100
      authenticationOptions:
        authenticationProviderKey: Bearer
      qosOptions:
        exceptionsAllowedBeforeBreaking: 3
        durationOfBreak: 30000
        timeoutValue: 30000
    
    # TerraFusion Consciousness Engine (port 3004)
    - downstreamPathTemplate: "/consciousness/{everything}"
      downstreamScheme: http
      downstreamHostAndPorts:
        - host: terrafusion-consciousness
          port: 3004
      upstreamPathTemplate: "/consciousness/{everything}"
      upstreamHttpMethod:
        - GET
        - POST
      rateLimitOptions:
        enableRateLimiting: true
        period: 1s
        periodTimespan: 1
        limit: 50
      authenticationOptions:
        authenticationProviderKey: Bearer
      qosOptions:
        exceptionsAllowedBeforeBreaking: 5
        durationOfBreak: 60000
        timeoutValue: 60000  # AI operations may take longer
    
    # TerraFusion Operations (port 5003)
    - downstreamPathTemplate: "/operations/{everything}"
      downstreamScheme: http
      downstreamHostAndPorts:
        - host: terrafusion-operations
          port: 5003
      upstreamPathTemplate: "/operations/{everything}"
      upstreamHttpMethod:
        - GET
        - POST
        - PUT
      rateLimitOptions:
        enableRateLimiting: true
        period: 1s
        periodTimespan: 1
        limit: 200
      authenticationOptions:
        authenticationProviderKey: Bearer
      qosOptions:
        exceptionsAllowedBeforeBreaking: 3
        durationOfBreak: 30000
        timeoutValue: 45000  # County sync operations

# Health checks
healthChecks:
  liveness:
    enabled: true
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Monitoring
monitoring:
  prometheus:
    enabled: true
    port: 3002
    path: /metrics
  jaeger:
    enabled: true
    agentHost: jaeger-agent.tracing.svc.cluster.local
    agentPort: 6831
    samplingRate: 0.1

# Logging
logging:
  level: Information
  structured: true
  loki:
    enabled: true
    url: http://loki.monitoring.svc.cluster.local:3100

# CORS Configuration
cors:
  enabled: true
  allowedOrigins:
    - https://terrafusion.gov
    - https://*.terrafusion.gov
    - https://localhost:5173  # Vite dev server
  allowedMethods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowedHeaders:
    - Authorization
    - Content-Type
    - X-Requested-With
  exposedHeaders:
    - X-Total-Count
    - X-Pagination
  allowCredentials: true
  maxAge: 3600

# Rate Limiting
rateLimiting:
  global:
    enabled: true
    requestsPerSecond: 1000
    burstMultiplier: 2
  perRoute:
    api:
      requestsPerSecond: 100
      burstMultiplier: 1.5
    consciousness:
      requestsPerSecond: 50
      burstMultiplier: 2
    operations:
      requestsPerSecond: 200
      burstMultiplier: 1.5

# Circuit Breaker
circuitBreaker:
  enabled: true
  exceptionsAllowedBeforeBreaking: 3
  durationOfBreak: 30000  # milliseconds
  timeoutValue: 30000     # milliseconds

# Load Balancing
loadBalancer:
  type: RoundRobin  # Options: RoundRobin, LeastConnection, NoLoadBalancer
  
# Compliance
compliance:
  fisma:
    level: HIGH
    auditLogging: true
    dataEncryption: true
  nist:
    enabled: true
    standards:
      - NIST-800-53

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Service Monitor (Prometheus Operator)
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
