{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "terrafusion-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "terrafusion-gateway.labels" . | nindent 4 }}
    prometheus: terrafusion
spec:
  selector:
    matchLabels:
      {{- include "terrafusion-gateway.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.prometheus.path }}
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_label_terrafusion_io_component]
          targetLabel: component
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - replacement: {{ .Values.global.environment }}
          targetLabel: environment
{{- end }}
