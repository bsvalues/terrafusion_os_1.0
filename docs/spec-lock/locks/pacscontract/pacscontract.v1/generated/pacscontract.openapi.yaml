openapi: 3.0.3
info:
  title: TerraFusion PACS Contract Proof API
  description: Runtime validation endpoint for PACS contract compliance
  version: 1.0.0
  contact:
    name: TerraFusion Elite Government OS Engineering

servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://api.terrafusion.gov
    description: Production

paths:
  /ops/pacs/proof:
    get:
      operationId: getPacsProof
      summary: Validate PACS contract compliance
      description: |
        Returns the current validation status of the PACS contract.
        This endpoint verifies that all required views, indexes, and procedures
        exist in the PACS database and that TerraFusion has appropriate permissions.
      tags:
        - Operations
        - PACS
      responses:
        '200':
          description: Contract validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacsProofResponse'
        '503':
          description: PACS unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacsProofResponse'
              example:
                contract_version: '1.0.0'
                validation_time: '2025-12-14T12:00:00Z'
                status: 'INVALID'
                errors:
                  - code: 'PACS_CONNECTION_FAILED'
                    message: 'Cannot connect to pacs_oltp database'
                    database: 'pacs_oltp'

components:
  schemas:
    PacsProofResponse:
      type: object
      required:
        - contract_version
        - validation_time
        - databases
        - status
      properties:
        contract_version:
          type: string
          example: '1.0.0'
          description: Semantic version of the PACS contract
        contract_hash:
          type: string
          example: 'sha256:abc123def456...'
          description: SHA-256 hash of the contract spec
        validation_time:
          type: string
          format: date-time
          example: '2025-12-14T12:00:00Z'
        databases:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DatabaseValidation'
        status:
          type: string
          enum: [VALID, INVALID, DEGRADED]
          description: |
            - VALID: All required objects present, all permissions granted
            - INVALID: Required view/procedure missing or permission denied
            - DEGRADED: Optional indexes missing, performance may be impacted
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'

    DatabaseValidation:
      type: object
      required:
        - connected
      properties:
        connected:
          type: boolean
        connection_time_ms:
          type: integer
        views_present:
          type: array
          items:
            type: string
        views_missing:
          type: array
          items:
            type: string
        indexes_present:
          type: array
          items:
            type: string
        indexes_missing:
          type: array
          items:
            type: string
        procedures_present:
          type: array
          items:
            type: string
        procedures_missing:
          type: array
          items:
            type: string

    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - PACS_VIEW_MISSING
            - PACS_COLUMN_MISSING
            - PACS_PERMISSION_DENIED
            - PACS_CONNECTION_FAILED
            - PACS_PROCEDURE_MISSING
        message:
          type: string
        object:
          type: string
        database:
          type: string

    ValidationWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - PACS_INDEX_MISSING
        message:
          type: string
        object:
          type: string

tags:
  - name: Operations
    description: Operational endpoints for system health and validation
  - name: PACS
    description: Harris PACS integration endpoints
