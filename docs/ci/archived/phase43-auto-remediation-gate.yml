name: Phase 43 - Auto-Remediation Wiring Quality Gate

on:
  pull_request:
    paths:
      - "backend/**RunbookExecution**"
      - "backend/**Runbooks/Execution/**"
      - "backend/**Runbooks/Remediation/**"
      - "backend/tests/**Phase43/**"
      - ".github/ai-prompts/breaker-phase43.md"
      - ".github/ai-prompts/reviewer-phase43.md"
  workflow_dispatch:
    inputs:
      run_breaker:
        description: "Run Phase 43 Breaker Agent?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      run_reviewer:
        description: "Run Phase 43 Reviewer Agent?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  auto-remediation-tests:
    name: Phase 43 Core Auto-Remediation Tests (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet-version: ["8.0.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix["dotnet-version"] }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Phase 43 Core Tests
        # Core wiring / behavior tests, EXCLUDING Breaker tests
        run: dotnet test --configuration Release --no-build --filter "Phase=43&Component=AutoRemediation&Category!=Breaker"

      - name: Upload Core Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase43-core-test-results-${{ matrix.os }}
          path: "**/TestResults/**/*.trx"

  breaker-phase43:
    name: Phase 43 Breaker (Auto-Remediation Red Team)
    runs-on: ubuntu-latest
    needs: auto-remediation-tests
    if: >
      contains(needs.*.result, 'failure') == false &&
      (github.event_name != 'workflow_dispatch' || inputs.run_breaker == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Phase 43 Breaker Tests
        # Only the adversarial tests
        run: dotnet test --configuration Release --no-build --filter "Phase=43&Component=AutoRemediation&Category=Breaker"

      - name: Upload Breaker Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase43-breaker-test-results
          path: "**/TestResults/**/*.trx"

      - name: Run Phase 43 Breaker Agent
        # 🔁 Replace this with your actual AI runner action
        if: always()
        uses: openai/chatgpt-action@v1
        with:
          model: gpt-5-1
          prompt-file: .github/ai-prompts/breaker-phase43.md
          repo-root: "."
          output-dir: phase43-breaker-output

      - name: Upload Breaker Agent Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase43-breaker-output
          path: phase43-breaker-output/

  reviewer-phase43:
    name: Phase 43 Reviewer (Auto-Remediation Governance)
    runs-on: ubuntu-latest
    needs: breaker-phase43
    if: >
      needs.breaker-phase43.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_reviewer == 'true')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Breaker Output
        uses: actions/download-artifact@v4
        with:
          name: phase43-breaker-output
          path: phase43-breaker-output/

      - name: Run Phase 43 Reviewer Agent
        # 🔁 Replace this with your actual AI runner action
        uses: openai/chatgpt-action@v1
        with:
          model: gpt-5-1
          prompt-file: .github/ai-prompts/reviewer-phase43.md
          repo-root: "."
          extra-context-path: phase43-breaker-output
          output-dir: phase43-reviewer-output

      - name: Post Reviewer Comment to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message-file: phase43-reviewer-output/review.md

      - name: Upload Reviewer Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase43-reviewer-output
          path: phase43-reviewer-output/

  quality-gate:
    name: Phase 43 Quality Gate Summary
    runs-on: ubuntu-latest
    needs:
      - auto-remediation-tests
      - breaker-phase43
      - reviewer-phase43
    if: always()

    steps:
      - name: Summarize Phase 43 Status
        run: |
          echo "Phase 43 Auto-Remediation Quality Gate"
          echo "Core Tests (matrix): ${{ needs.auto-remediation-tests.result }}"
          echo "Breaker:            ${{ needs.breaker-phase43.result }}"
          echo "Reviewer:           ${{ needs.reviewer-phase43.result }}"

          if [ "${{ needs.auto-remediation-tests.result }}" != "success" ]; then
            echo "Phase 43 gate FAILED: core matrix tests failing."
            exit 1
          fi

          if [ "${{ needs.breaker-phase43.result }}" == "failure" ]; then
            echo "Phase 43 gate FAILED: Breaker failed."
            exit 1
          fi

          if [ "${{ needs.reviewer-phase43.result }}" == "failure" ]; then
            echo "Phase 43 gate FAILED: Reviewer failed."
            exit 1
          fi

          echo "Phase 43 gate PASSED."
