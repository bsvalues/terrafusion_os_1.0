name: TerraFusion Integration & Readiness Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - dev
        - staging
        - prod
      county:
        description: 'Target county'
        required: true
        default: 'benton'
        type: choice
        options:
        - benton
        - yakima
        - cowlitz

env:
  COUNTY: ${{ github.event.inputs.county || 'benton' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0'

jobs:
  # Layer 1: AI Agent Training & Validation
  ai-training:
    name: "🤖 AI Agent Training & Validation"
    runs-on: ubuntu-latest
    outputs:
      training-passed: ${{ steps.training.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run AI Agent Training Pipeline
        id: training
        run: |
          npm run ai-training
          npm run ai-agent-briefing
          npm run validate-understanding
          echo "passed=true" >> $GITHUB_OUTPUT
          
      - name: Validate AI Agent Understanding
        run: |
          npm run monitor-agents
          npm run full-validation

  # Gate A: Build & Tests
  gate-a-build-tests:
    name: "🚪 Gate A - Build & Tests"
    needs: ai-training
    runs-on: ubuntu-latest
    if: needs.ai-training.outputs.training-passed == 'true'
    outputs:
      gate-a-passed: ${{ steps.tests.outputs.passed }}
      test-coverage: ${{ steps.tests.outputs.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build all modules
        run: |
          npm run build:all
          dotnet build backend/TerraFusion.API/TerraFusion.API.csproj
          
      - name: Run unit tests
        id: tests
        run: |
          npm run test:unit
          npm run test:integration
          coverage=$(npm run test:coverage --silent | grep "All files" | awk '{print $4}' | sed 's/%//')
          echo "coverage=$coverage" >> $GITHUB_OUTPUT
          if (( $(echo "$coverage >= 85" | bc -l) )); then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-gate-a
          path: |
            coverage/
            test-results/

  # Gate B: Security & Trust Fabric
  gate-b-security-trust:
    name: "🔒 Gate B - Security & Trust Fabric"
    needs: [ai-training, gate-a-build-tests]
    runs-on: ubuntu-latest
    if: needs.gate-a-build-tests.outputs.gate-a-passed == 'true'
    outputs:
      gate-b-passed: ${{ steps.security.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        
      - name: Install dependencies
        run: npm ci
        
      - name: Static security analysis
        run: |
          npm run scan:semgrep
          npm run scan:trivy
          npm run scan:gitleaks
          
      - name: Dependency vulnerability scan
        run: |
          npm audit --audit-level high
          npm run scan:deps
          
      - name: Generate SBOM
        run: |
          npm run sbom:gen
          
      - name: Sign containers and artifacts
        id: security
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          npm run sign:containers
          npm run verify:cosign
          echo "passed=true" >> $GITHUB_OUTPUT
          
      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts-gate-b
          path: |
            trust-fabric/sbom/
            trust-fabric/attest/

  # Gate C: UI/UX & Accessibility
  gate-c-ui-a11y:
    name: "🎨 Gate C - UI/UX & Accessibility"
    needs: [ai-training, gate-a-build-tests]
    runs-on: ubuntu-latest
    if: needs.gate-a-build-tests.outputs.gate-a-passed == 'true'
    outputs:
      gate-c-passed: ${{ steps.ui.outputs.passed }}
      lighthouse-score: ${{ steps.lighthouse.outputs.score }}
      a11y-score: ${{ steps.a11y.outputs.score }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build:frontend
        
      - name: Start application
        run: |
          npm run dev &
          npx wait-on http://localhost:\${{TF_FRONTEND_PORT:-3000}} --timeout 60000
          
      - name: Run Playwright E2E tests
        run: |
          npm run e2e
          
      - name: Run Lighthouse audit
        id: lighthouse
        run: |
          npm run lighthouse:audit
          score=$(cat reports/lighthouse-report.json | jq '.categories.accessibility.score * 100')
          echo "score=$score" >> $GITHUB_OUTPUT
          
      - name: Run accessibility tests
        id: a11y
        run: |
          npm run a11y:check
          npm run a11y:pa11y
          a11y_score=95  # Mock score - implement actual scoring
          echo "score=$a11y_score" >> $GITHUB_OUTPUT
          
      - name: Validate design system compliance
        id: ui
        run: |
          npm run design:validate
          npm run brand:check
          echo "passed=true" >> $GITHUB_OUTPUT
          
      - name: Upload UI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-gate-c
          path: |
            reports/lighthouse-report.html
            reports/a11y-report.html
            playwright-report/

  # Gate D: Data & Migrations
  gate-d-data:
    name: "🗄️ Gate D - Data & Migrations"
    needs: [ai-training, gate-a-build-tests]
    runs-on: ubuntu-latest
    if: needs.gate-a-build-tests.outputs.gate-a-passed == 'true'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      gate-d-passed: ${{ steps.data.outputs.passed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run database migrations (forward)
        run: |
          npm run db:migrate -- --env=test
          
      - name: Seed test data
        run: |
          npm run seed:demo-data -- --tenant=${{ env.COUNTY }}
          
      - name: Validate data integrity
        run: |
          npm run db:validate
          
      - name: Test rollback migrations
        id: data
        run: |
          npm run db:rollback -- --steps=1
          npm run db:migrate -- --env=test
          echo "passed=true" >> $GITHUB_OUTPUT

  # Gate E: Observability & SLOs
  gate-e-observability:
    name: "📊 Gate E - Observability & SLOs"
    needs: [ai-training, gate-a-build-tests]
    runs-on: ubuntu-latest
    if: needs.gate-a-build-tests.outputs.gate-a-passed == 'true'
    outputs:
      gate-e-passed: ${{ steps.slo.outputs.passed }}
      apdex-score: ${{ steps.slo.outputs.apdex }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Start monitoring stack
        run: |
          docker compose -f deploy/compose/monitoring.yml up -d
          npx wait-on http://localhost:\${{TF_FRONTEND_PORT:-3000}} --timeout 60000
          
      - name: Run performance benchmarks
        run: |
          npm run perf:benchmark
          npm run load:test
          
      - name: Validate SLO metrics
        id: slo
        run: |
          npm run check:slos
          apdex=$(cat reports/slo-validation.json | jq '.apdex')
          echo "apdex=$apdex" >> $GITHUB_OUTPUT
          if (( $(echo "$apdex >= 0.90" | bc -l) )); then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
      - name: Upload observability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: observability-artifacts-gate-e
          path: |
            reports/slo-validation.json
            reports/performance-report.html

  # Gate F: Final Go/No-Go Decision
  gate-f-go-no-go:
    name: "🎯 Gate F - Go/No-Go Decision"
    needs: [gate-a-build-tests, gate-b-security-trust, gate-c-ui-a11y, gate-d-data, gate-e-observability]
    runs-on: ubuntu-latest
    if: always()
    outputs:
      final-decision: ${{ steps.decision.outputs.decision }}
      weighted-score: ${{ steps.decision.outputs.score }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Calculate weighted readiness score
        id: decision
        env:
          GATE_A: ${{ needs.gate-a-build-tests.outputs.gate-a-passed }}
          GATE_B: ${{ needs.gate-b-security-trust.outputs.gate-b-passed }}
          GATE_C: ${{ needs.gate-c-ui-a11y.outputs.gate-c-passed }}
          GATE_D: ${{ needs.gate-d-data.outputs.gate-d-passed }}
          GATE_E: ${{ needs.gate-e-observability.outputs.gate-e-passed }}
          TEST_COVERAGE: ${{ needs.gate-a-build-tests.outputs.test-coverage }}
          LIGHTHOUSE_SCORE: ${{ needs.gate-c-ui-a11y.outputs.lighthouse-score }}
          A11Y_SCORE: ${{ needs.gate-c-ui-a11y.outputs.a11y-score }}
          APDEX_SCORE: ${{ needs.gate-e-observability.outputs.apdex-score }}
        run: |
          node scripts/calculate-readiness-score.js
          score=$(cat reports/weighted-score.json | jq '.total_score')
          echo "score=$score" >> $GITHUB_OUTPUT
          
          if (( $(echo "$score >= 0.97" | bc -l) )); then
            echo "decision=GO" >> $GITHUB_OUTPUT
          else
            echo "decision=NO-GO" >> $GITHUB_OUTPUT
          fi
          
      - name: Generate final report
        run: |
          node scripts/generate-audit-report.js
          
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-audit-report
          path: |
            reports/integration-readiness-summary.md
            reports/module-matrix.csv
            reports/security-trust-fabric-report.md
            reports/weighted-score.json

  # Conditional deployment to staging/prod
  deploy-staging:
    name: "🚀 Deploy to Staging"
    needs: gate-f-go-no-go
    runs-on: ubuntu-latest
    if: needs.gate-f-go-no-go.outputs.final-decision == 'GO' && github.event_name != 'pull_request'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to staging
        run: |
          kubectl apply -k deploy/k8s/overlays/staging
          kubectl rollout status deploy/*
          
      - name: Run staging smoke tests
        run: |
          npm run test:smoke -- --env=staging
          
      - name: Archive staging deployment
        run: |
          echo "Staging deployment successful for ${{ env.COUNTY }} county"

  # Promote to production (manual approval required)
  deploy-production:
    name: "🏛️ Deploy to Production"
    needs: [gate-f-go-no-go, deploy-staging]
    runs-on: ubuntu-latest
    if: needs.gate-f-go-no-go.outputs.final-decision == 'GO' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Deploy to production with progressive rollout
        run: |
          kubectl apply -k deploy/k8s/overlays/prod
          kubectl rollout status deploy/*
          
      - name: Archive provenance to trust fabric ledger
        run: |
          npm run trust-fabric:archive -- --deployment-id=${{ github.run_id }}
          
      - name: Notify stakeholders
        run: |
          echo "🎉 TerraFusion OS deployed to production for ${{ env.COUNTY }} County!"
          echo "Weighted Score: ${{ needs.gate-f-go-no-go.outputs.weighted-score }}"