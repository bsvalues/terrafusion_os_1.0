# =============================================================================
# Phase 38: Alert Rules Quality Gate
# =============================================================================
# Enforces CI validation for all alert rule changes:
# - .NET AlertRuleValidationTests (48 tests)
# - promtool syntax and unit tests
# - Breaker agent (red-team threshold fuzzing)
# - Reviewer agent (governance compliance)
#
# ALERT SPEC LOCK v1.0.0: 12 alerts (7 Atlas, 5 Swarm)
# =============================================================================

name: Phase 38 - Alert Rules Quality Gate

on:
    pull_request:
        paths:
            - "ops/observability/alerting/**"
            - ".github/ai-prompts/breaker-phase38.md"
            - ".github/ai-prompts/reviewer-phase38.md"
            - "backend/tests/TerraFusion.Integration.Tests/Phase38/**"
    push:
        branches:
            - main
        paths:
            - "ops/observability/alerting/**"
    workflow_dispatch:
        inputs:
            run_breaker:
                description: "Run Breaker agent (red-team)"
                type: boolean
                default: false
            run_reviewer:
                description: "Run Reviewer agent (governance)"
                type: boolean
                default: false

env:
    DOTNET_VERSION: "8.0.x"
    PROMETHEUS_VERSION: "2.55.0"

jobs:
    # ===========================================================================
    # Job 1: Alert Rule Validation (.NET + promtool)
    # ===========================================================================
    alert-tests:
        name: Alert Rule Validation (Phase 38 Tests)
        runs-on: ubuntu-latest
        outputs:
            test_result: ${{ steps.tests.outcome }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install promtool
              run: |
                  curl -L -o prom.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
                  tar -xzf prom.tar.gz
                  sudo mv "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
                  promtool --version

            - name: Validate Alert YAML Syntax
              run: |
                  echo "🔍 Validating Atlas alerts..."
                  promtool check rules ops/observability/alerting/phase38/atlas-alerts.yml
                  echo "🔍 Validating Swarm alerts..."
                  promtool check rules ops/observability/alerting/phase38/swarm-alerts.yml

            - name: Run promtool Unit Tests
              run: |
                  echo "🧪 Running Atlas alert tests..."
                  promtool test rules ops/observability/alerting/phase38/tests/atlas-alerts.test.yml
                  echo "🧪 Running Swarm alert tests..."
                  promtool test rules ops/observability/alerting/phase38/tests/swarm-alerts.test.yml

            - name: Restore .NET Dependencies
              run: dotnet restore backend/TerraFusion.sln

            - name: Build Solution
              run: dotnet build backend/TerraFusion.sln --configuration Release --no-restore

            - name: Run Phase 38 .NET Tests
              id: tests
              run: |
                  dotnet test backend/tests/TerraFusion.Integration.Tests/TerraFusion.Integration.Tests.csproj \
                    --configuration Release \
                    --no-build \
                    --filter "Category=Phase38" \
                    --logger "trx;LogFileName=phase38-results.trx" \
                    --results-directory ./TestResults

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: phase38-test-results
                  path: ./TestResults/

            - name: Generate Test Summary
              if: always()
              run: |
                  echo "## Phase 38 Alert Rules Quality Gate" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Test Results" >> $GITHUB_STEP_SUMMARY
                  echo "| Category | Status |" >> $GITHUB_STEP_SUMMARY
                  echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
                  echo "| YAML Syntax (promtool) | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
                  echo "| promtool Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
                  echo "| .NET AlertRuleValidationTests | ${{ steps.tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### ALERT SPEC LOCK v1.0.0" >> $GITHUB_STEP_SUMMARY
                  echo "- **Atlas Alerts**: 7 (2 critical, 5 warning)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Swarm Alerts**: 5 (1 critical, 3 warning, 1 info)" >> $GITHUB_STEP_SUMMARY

    # ===========================================================================
    # Job 2: Phase 38 Breaker (Alert Rules Red Team)
    # ===========================================================================
    breaker-phase38:
        name: Phase 38 Breaker (Alert Rules Red Team)
        runs-on: ubuntu-latest
        needs: alert-tests
        if: |
            always() &&
            needs.alert-tests.result == 'success' &&
            (github.event_name == 'pull_request' || github.event.inputs.run_breaker == 'true')
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Prepare Breaker Context
              run: |
                  mkdir -p phase38-breaker-output
                  echo "# Phase 38 Breaker Analysis" > phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  echo "## Alert Files Under Review" >> phase38-breaker-output/breaker-report.md
                  echo "\`\`\`" >> phase38-breaker-output/breaker-report.md
                  cat ops/observability/alerting/phase38/atlas-alerts.yml >> phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  cat ops/observability/alerting/phase38/swarm-alerts.yml >> phase38-breaker-output/breaker-report.md
                  echo "\`\`\`" >> phase38-breaker-output/breaker-report.md

            # =======================================================================
            # NOTE: Replace this placeholder with your actual AI runner
            # Options:
            # - GitHub Copilot for PRs (built-in)
            # - Azure OpenAI Action
            # - Custom AI agent runner
            # =======================================================================
            - name: Run Phase 38 Breaker Agent (Placeholder)
              run: |
                  echo "## Breaker Agent Checklist" >> phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  echo "### Threshold Fuzzing Attacks" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Test values at exact threshold boundaries" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Test rapid oscillation around thresholds" >> phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  echo "### False Positive/Negative Scenarios" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Maintenance windows with expected spikes" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Gradual degradation below thresholds" >> phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  echo "### Label Routing Attacks" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Missing countyId labels" >> phase38-breaker-output/breaker-report.md
                  echo "- [ ] Unknown county values" >> phase38-breaker-output/breaker-report.md
                  echo "" >> phase38-breaker-output/breaker-report.md
                  echo "See .github/ai-prompts/breaker-phase38.md for full attack matrix" >> phase38-breaker-output/breaker-report.md

            - name: Upload Breaker Output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: phase38-breaker-output
                  path: phase38-breaker-output/

    # ===========================================================================
    # Job 3: Phase 38 Reviewer (Alert Governance)
    # ===========================================================================
    reviewer-phase38:
        name: Phase 38 Reviewer (Alert Governance)
        runs-on: ubuntu-latest
        needs: [alert-tests, breaker-phase38]
        if: |
            always() &&
            needs.alert-tests.result == 'success' &&
            (github.event_name == 'pull_request' || github.event.inputs.run_reviewer == 'true')
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download Breaker Output
              uses: actions/download-artifact@v4
              with:
                  name: phase38-breaker-output
                  path: phase38-breaker-output/
              continue-on-error: true

            - name: Prepare Reviewer Context
              run: |
                  mkdir -p phase38-reviewer-output
                  echo "# Phase 38 Governance Review" > phase38-reviewer-output/review.md
                  echo "" >> phase38-reviewer-output/review.md
                  echo "## ALERT SPEC LOCK v1.0.0 Compliance" >> phase38-reviewer-output/review.md
                  echo "" >> phase38-reviewer-output/review.md

            # =======================================================================
            # NOTE: Replace this placeholder with your actual AI runner
            # =======================================================================
            - name: Run Phase 38 Reviewer Agent (Placeholder)
              run: |
                  echo "### Governance Checklist" >> phase38-reviewer-output/review.md
                  echo "" >> phase38-reviewer-output/review.md
                  echo "| Check | Status |" >> phase38-reviewer-output/review.md
                  echo "|-------|--------|" >> phase38-reviewer-output/review.md
                  echo "| Alert count matches spec (12) | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "| All alerts have government=true | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "| PromQL references valid metrics | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "| Severities correctly assigned | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "| Dashboard-alert alignment | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "| Runbook URLs present | ⏳ Pending |" >> phase38-reviewer-output/review.md
                  echo "" >> phase38-reviewer-output/review.md
                  echo "See .github/ai-prompts/reviewer-phase38.md for full review criteria" >> phase38-reviewer-output/review.md

            - name: Upload Reviewer Output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: phase38-reviewer-output
                  path: phase38-reviewer-output/

            - name: Post Review to PR
              if: github.event_name == 'pull_request'
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  recreate: true
                  header: phase38-review
                  path: phase38-reviewer-output/review.md

    # ===========================================================================
    # Job 4: Quality Gate Summary
    # ===========================================================================
    quality-gate:
        name: Phase 38 Quality Gate
        runs-on: ubuntu-latest
        needs: [alert-tests, breaker-phase38, reviewer-phase38]
        if: always()
        steps:
            - name: Check Quality Gate
              run: |
                  if [ "${{ needs.alert-tests.result }}" != "success" ]; then
                    echo "❌ Alert tests failed"
                    exit 1
                  fi
                  echo "✅ Phase 38 Quality Gate PASSED"
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## 🏆 Phase 38 Quality Gate: PASSED" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "All alert rule validations completed successfully." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Telemetry Arc Status**: Phases 34-38 CI-enforced ✅" >> $GITHUB_STEP_SUMMARY
