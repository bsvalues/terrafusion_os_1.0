name: Publish Test & Perf Reports

on:
  workflow_run:
    workflows: ["Frontend Tests"]   # <-- name of your main CI workflow
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write     # <-- allow committing README/badge/history
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gather-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download artifacts produced by your CI (names from earlier workflow examples)
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Download LHCI reports
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports

      - name: Download perf/a11y artifacts (optional)
        uses: actions/download-artifact@v4
        with:
          name: perf-a11y-artifacts
          path: perf-a11y-artifacts
        continue-on-error: true

      - name: Download Coverage HTML
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: Install (no audit)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Merge Lighthouse budgets to HTML+JSON
        run: |
          mkdir -p artifacts/lhci artifacts/reports artifacts
          cp -r lighthouse-reports/* artifacts/lhci/ || true
          node scripts/merge-lighthouse-budgets.mjs artifacts/lhci perf-budgets.json artifacts/reports

      - name: Stage perf/a11y artifacts
        run: |
          cp -r perf-a11y-artifacts/* artifacts/ || true

      - name: Stage Coverage HTML
        run: |
          cp -r coverage-html artifacts/coverage-html || true

      - name: Update history (JSONL)
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
        run: node scripts/update-history.mjs

      - name: Generate coverage badges (statements/branches)
        run: node scripts/generate-coverage-badges.mjs

      - name: Generate route-level budgets badge
        run: node scripts/generate-route-badge.mjs

      - name: Update README budget snapshot
        run: node scripts/update-readme-budgets-table.mjs

      - name: Build budget failure-diff page
        run: node scripts/build-budget-failures.mjs

      - name: Generate README badge and coverage badges (legacy)
        env:
          COVERAGE_TARGET: "0.97"
          LCP_TARGET: "2500"
          A11Y_TARGET: "0"
        run: |
          node scripts/generate-coverage-badge.mjs
          node scripts/update-readme-badge.mjs

      - name: Update budget table in README (legacy)
        run: node scripts/update-budget-table.mjs

      - name: Generate failure diff report (legacy)
        run: node scripts/generate-failure-diff.mjs

      - name: Commit README/badges/history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(reports): update badge & history after CI run"
          file_pattern: "README.md badges/*.svg reports/history/history.jsonl"

      - name: Build static site from artifacts
        run: |
          # rename artifact dirs to expected inputs for site builder
          mv artifacts/coverage-html coverage-html || true
          node scripts/build-reports-site.mjs

      # Upload & deploy Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Echo Pages URL
        run: echo "📣 Reports published at ${{ steps.deployment.outputs.page_url }}"

      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-slack.mjs