name: Build • Test • Compose Smoke

on:
  push: { branches: [main, develop, 'feature/**'] }
  pull_request: { branches: [main, develop] }

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'

      - name: Setup toolchains
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.x' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: docker/setup-buildx-action@v3

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln','**/*.csproj','global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache Buildx
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: buildx-${{ runner.os }}-

      - name: Build backends & images (CI path)
        run: make build-ci

      - name: Summarize Rust crates built
        if: always()
        run: |
          echo "## Rust crates built" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .ci/rust-manifests.txt ]; then
            sed 's/^/- /' .ci/rust-manifests.txt >> "$GITHUB_STEP_SUMMARY"
          else
            find backend -type f -name Cargo.toml | sort | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose up (infra)
        run: |
          docker compose -f docker-compose.dev.yml up -d db redis nats keycloak

      - name: Wait for Keycloak (max 15m)
        run: bash ops/ci/wait-for.sh "http://localhost:8080" 900

      - name: Compose up (apps)
        run: docker compose -f docker-compose.dev.yml up -d api valuation-worker gis-worker

      - name: Wait for API health (max 10m)
        run: bash ops/ci/wait-for.sh "http://localhost:5046/health" 600

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: k6 smoke
        run: k6 run ops/k6/smoke.js

      - name: Collect compose/system diagnostics
        if: always()
        run: |
          mkdir -p .ci_artifacts
          docker compose -f docker-compose.dev.yml ps --format json > .ci_artifacts/compose-ps.json || true
          docker ps --no-trunc > .ci_artifacts/docker-ps.txt || true
          docker compose -f docker-compose.dev.yml logs --no-color > .ci_artifacts/compose-logs.txt || true
          for c in $(docker ps --format '{{.Names}}'); do
            docker logs --timestamps "$c" > ".ci_artifacts/${c}.log" 2>&1 || true
          done
          cp docker-compose.dev.yml .ci_artifacts/ || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-and-docker-logs
          path: .ci_artifacts
          if-no-files-found: warn

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
