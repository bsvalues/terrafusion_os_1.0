version: '3.8'

# TerraFusion Phase 1: IDE-Dashboard Deep Integration
# Complete infrastructure stack for real-time performance monitoring

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres
    environment:
      POSTGRES_DB: terrafusion
      POSTGRES_USER: terrafusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-terrafusion2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - terrafusion-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-terrafusion2024}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - terrafusion-network

  # TerraFusion API Backend
  terrafusion-api:
    build:
      context: ../../../backend/TerraFusion.API
      dockerfile: Dockerfile
    container_name: terrafusion-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=terrafusion;Username=terrafusion;Password=${POSTGRES_PASSWORD:-terrafusion2024}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:-terrafusion2024}
      - SupremeCommander__Enabled=true
      - SupremeCommander__AgentCount=1008
      - RustEngine__Enabled=true
      - RustEngine__CrateArchitecture=7-crate
      - GoldenRatio__Enabled=true
      - Phase1__DashboardIntegration=true
    ports:
      - "${API_PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - api_logs:/app/logs
    networks:
      - terrafusion-network

  # Rust Performance Engine
  rust-performance-engine:
    build:
      context: ../../../rust-performance-engine
      dockerfile: Dockerfile
    container_name: rust-performance-engine
    environment:
      - RUST_LOG=info
      - PERFORMANCE_ENGINE_PORT=8080
      - GOLDEN_RATIO_ENABLED=true
      - AGENT_COORDINATION_ENABLED=true
      - FFI_BRIDGE_ENABLED=true
    ports:
      - "${RUST_ENGINE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - terrafusion-network

  # Frontend Dashboard
  frontend-dashboard:
    build:
      context: ../../../
      dockerfile: implementation/phase1/frontend/Dockerfile
      args:
        - VITE_API_URL=http://terrafusion-api:5001
        - VITE_WEBSOCKET_URL=ws://terrafusion-api:5001
    container_name: frontend-dashboard
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - terrafusion-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - terrafusion-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./monitoring/prometheus-dashboard.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - terrafusion-network
    depends_on:
      - terrafusion-api
      - rust-performance-engine

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/phase1-dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/phase1-dashboard.json
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - terrafusion-network
    depends_on:
      - prometheus

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - terrafusion-api
      - frontend-dashboard
      - grafana
    networks:
      - terrafusion-network

  # Supreme Commander Claude AI Orchestrator
  supreme-commander-claude:
    build:
      context: ../../../backend/ai-swarm
      dockerfile: Dockerfile.supreme-commander
    container_name: supreme-commander-claude
    environment:
      - CLAUDE_AGENT_COUNT=1008
      - COORDINATION_MODE=supreme
      - RUST_ENGINE_URL=http://rust-performance-engine:8080
      - API_URL=http://terrafusion-api:5001
      - GOLDEN_RATIO_OPTIMIZATION=true
    ports:
      - "${CLAUDE_PORT:-8001}:8000"
    depends_on:
      - terrafusion-api
      - rust-performance-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - terrafusion-network

  # AI Swarm Coordination Service
  ai-swarm-coordinator:
    build:
      context: ../../../backend/ai-swarm
      dockerfile: Dockerfile.coordinator
    container_name: ai-swarm-coordinator
    environment:
      - COORDINATION_LEVEL=swarm
      - AGENT_POOLS=8
      - SUPREME_COMMANDER_URL=http://supreme-commander-claude:8000
    ports:
      - "${AI_SWARM_PORT:-8002}:8000"
    depends_on:
      - supreme-commander-claude
    networks:
      - terrafusion-network

  # Performance Testing Service
  performance-tester:
    build:
      context: ../performance-testing
      dockerfile: Dockerfile
    container_name: performance-tester
    environment:
      - TARGET_URL=http://terrafusion-api:5001
      - WEBSOCKET_URL=ws://terrafusion-api:5001/hub/ide-dashboard
      - TEST_DURATION=300s
      - CONCURRENT_USERS=100
    depends_on:
      - terrafusion-api
    profiles:
      - testing
    networks:
      - terrafusion-network

  # Node Exporter for System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - terrafusion-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  api_logs:
    driver: local

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16