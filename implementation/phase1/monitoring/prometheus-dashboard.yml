# Prometheus Configuration for Phase 1 IDE Dashboard Monitoring
# Real-time performance metrics collection and Supreme Commander Claude coordination

global:
  scrape_interval: 1s       # Ultra-fast metrics collection for IDE dashboard
  evaluation_interval: 5s   # Rule evaluation for alerts
  external_labels:
    phase: 'phase1-ide-dashboard'
    environment: 'production'
    supreme_commander: 'claude'

# Rule files for alerting
rule_files:
  - "phase1-alerts.yml"
  - "supreme-commander-alerts.yml"
  - "rust-engine-alerts.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # TerraFusion API metrics
  - job_name: 'terrafusion-api'
    static_configs:
      - targets: ['terrafusion-api:5001']
    scrape_interval: 1s
    metrics_path: '/metrics'
    params:
      format: ['prometheus']

  # IDE Dashboard Hub metrics
  - job_name: 'ide-dashboard-hub'
    static_configs:
      - targets: ['terrafusion-api:5001']
    scrape_interval: 500ms    # Sub-second for real-time dashboard
    metrics_path: '/hub/ide-dashboard/metrics'
    params:
      format: ['prometheus']

  # Rust Performance Engine metrics
  - job_name: 'rust-performance-engine'
    static_configs:
      - targets: ['rust-engine:8080']
    scrape_interval: 100ms    # Ultra-fast for performance engine
    metrics_path: '/metrics'
    params:
      format: ['prometheus']

  # Supreme Commander Claude AI Swarm metrics
  - job_name: 'supreme-commander-claude'
    static_configs:
      - targets: ['ai-swarm:8001', 'ai-swarm:8002', 'ai-swarm:8003']
    scrape_interval: 250ms
    metrics_path: '/api/v1/metrics'
    params:
      format: ['prometheus']

  # Golden Ratio Engine metrics
  - job_name: 'golden-ratio-engine'
    static_configs:
      - targets: ['rust-engine:8080']
    scrape_interval: 100ms
    metrics_path: '/gre/metrics'
    params:
      format: ['prometheus']

  # PostgreSQL database metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 5s

  # Redis cache metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 2s

  # Node.js frontend metrics
  - job_name: 'frontend-dashboard'
    static_configs:
      - targets: ['frontend:3000']
    scrape_interval: 1s
    metrics_path: '/api/metrics'

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 5s

  # Kubernetes metrics (if deployed on K8s)
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - terrafusion-production
            - terrafusion-development
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

  # Custom IDE performance metrics
  - job_name: 'ide-performance-custom'
    static_configs:
      - targets: ['performance-collector:8080']
    scrape_interval: 200ms
    metrics_path: '/ide/metrics'
    params:
      format: ['prometheus']
      labels: ['phase1', 'ide-dashboard', 'real-time']

# Remote write configuration for long-term storage
remote_write:
  - url: "https://prometheus-remote.terrafusion.gov/api/v1/write"
    basic_auth:
      username: terrafusion
      password_file: /etc/prometheus/remote-write-password
    queue_config:
      max_samples_per_send: 10000
      max_shards: 200
      capacity: 500000

# Recording rules for performance optimization
recording_rules:
  # IDE Dashboard performance rules
  - record: ide:dashboard:response_time_99p
    expr: histogram_quantile(0.99, rate(ide_dashboard_request_duration_seconds_bucket[1m]))
    labels:
      phase: "phase1"
      component: "dashboard"

  - record: ide:dashboard:active_connections
    expr: sum(ide_dashboard_active_connections)
    labels:
      phase: "phase1"
      component: "websocket"

  # Supreme Commander Claude coordination metrics
  - record: claude:coordination:agent_response_time
    expr: histogram_quantile(0.95, rate(claude_agent_coordination_duration_seconds_bucket[30s]))
    labels:
      supreme_commander: "claude"
      agents: "1008"

  - record: claude:coordination:success_rate
    expr: rate(claude_coordination_success_total[1m]) / rate(claude_coordination_total[1m])
    labels:
      supreme_commander: "claude"

  # Rust Performance Engine metrics
  - record: rust:engine:golden_ratio_optimization
    expr: golden_ratio_engine_optimization_phi_value
    labels:
      engine: "rust"
      optimization: "golden-ratio"

  - record: rust:engine:agent_coordination_latency
    expr: histogram_quantile(0.50, rate(rust_agent_coordination_duration_seconds_bucket[10s]))
    labels:
      engine: "rust"
      component: "coordination"

  # Phase 1 success metrics
  - record: phase1:success:development_efficiency
    expr: (
      (ide:dashboard:response_time_99p < 0.1) * 0.3 +
      (claude:coordination:success_rate > 0.99) * 0.3 +
      (rust:engine:agent_coordination_latency < 0.05) * 0.4
    ) * 100
    labels:
      phase: "phase1"
      target: "300_percent_improvement"

  - record: phase1:success:user_adoption
    expr: (ide:dashboard:active_connections / 1000) * 100
    labels:
      phase: "phase1"
      target: "80_percent_adoption"

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 500GB
    wal-compression: true

# Global external labels for federation
external_labels:
  cluster: 'terrafusion-production'
  phase: 'phase1-ide-dashboard'
  supreme_commander: 'claude'
  rust_engine: '7-crate-architecture'
  golden_ratio: 'phi-optimization'