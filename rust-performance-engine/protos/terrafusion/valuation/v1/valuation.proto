syntax = "proto3";

package terrafusion.valuation.v1;

service ValuationService {
  // Get property valuation for a single parcel
  rpc GetPropertyValuation(PropertyValuationRequest) returns (PropertyValuationResponse);
  
  // Stream live valuation updates
  rpc StreamValuationUpdates(stream ValuationUpdateRequest) returns (stream ValuationUpdateResponse);
  
  // Batch valuation for multiple properties
  rpc BatchValuation(BatchValuationRequest) returns (BatchValuationResponse);
  
  // Get market conditions analysis
  rpc GetMarketConditions(MarketConditionsRequest) returns (MarketConditionsResponse);
}

message PropertyValuationRequest {
  string parcel_id = 1;
  ValuationMethodology methodology = 2;
  bool include_comparables = 3;
  bool include_market_analysis = 4;
}

message PropertyValuationResponse {
  string parcel_id = 1;
  PropertyData property = 2;
  ValuationResult valuation = 3;
  repeated ComparableSale comparables = 4;
  MarketConditions market_conditions = 5;
  string timestamp = 6;
}

message ValuationUpdateRequest {
  repeated string parcel_ids = 1;
  int32 update_interval_seconds = 2;
}

message ValuationUpdateResponse {
  string parcel_id = 1;
  ValuationResult valuation = 2;
  string timestamp = 3;
  ValuationChangeReason change_reason = 4;
}

message BatchValuationRequest {
  repeated string parcel_ids = 1;
  ValuationMethodology methodology = 2;
  bool include_comparables = 3;
}

message BatchValuationResponse {
  repeated PropertyValuationResponse valuations = 1;
  BatchStatistics statistics = 2;
}

message MarketConditionsRequest {
  string geographic_area = 1;
  string property_type = 2;
  int32 days_back = 3;
}

message MarketConditionsResponse {
  MarketConditions conditions = 1;
  repeated MarketTrend trends = 2;
  string analysis_period = 3;
}

message PropertyData {
  string parcel_id = 1;
  string owner_name = 2;
  string property_address = 3;
  string legal_description = 4;
  int32 land_area_sqft = 5;
  int32 building_area_sqft = 6;
  int32 year_built = 7;
  string property_type = 8;
  int32 bedrooms = 9;
  int32 bathrooms = 10;
  repeated string features = 11;
}

message ValuationResult {
  int64 market_value = 1;
  int64 land_value = 2;
  int64 improvement_value = 3;
  double confidence_score = 4;
  repeated ComparableSale comparable_sales = 5;
  map<string, string> factors = 6;
  repeated string compliance_notes = 7;
}

message ComparableSale {
  string parcel_id = 1;
  string address = 2;
  int64 sale_price = 3;
  string sale_date = 4;
  int32 square_footage = 5;
  double price_per_sqft = 6;
  double adjustment_factor = 7;
  string adjustment_reason = 8;
}

message MarketConditions {
  double price_trend = 1;
  int32 days_on_market = 2;
  double inventory_months = 3;
  int32 total_sales = 4;
  double median_price = 5;
  string market_temperature = 6;
}

message MarketTrend {
  string period = 1;
  double price_change_percent = 2;
  int32 volume_change_percent = 3;
  string trend_direction = 4;
}

message BatchStatistics {
  int32 total_processed = 1;
  int32 successful_valuations = 2;
  int32 failed_valuations = 3;
  double average_processing_time_ms = 4;
}

enum ValuationMethodology {
  VALUATION_METHODOLOGY_UNSPECIFIED = 0;
  VALUATION_METHODOLOGY_SALES_COMPARISON = 1;
  VALUATION_METHODOLOGY_COST_APPROACH = 2;
  VALUATION_METHODOLOGY_INCOME_APPROACH = 3;
  VALUATION_METHODOLOGY_AUTOMATED_VALUATION = 4;
}

enum ValuationChangeReason {
  VALUATION_CHANGE_REASON_UNSPECIFIED = 0;
  VALUATION_CHANGE_REASON_MARKET_UPDATE = 1;
  VALUATION_CHANGE_REASON_PROPERTY_IMPROVEMENT = 2;
  VALUATION_CHANGE_REASON_COMPARABLE_SALE = 3;
  VALUATION_CHANGE_REASON_ASSESSMENT_CYCLE = 4;
}