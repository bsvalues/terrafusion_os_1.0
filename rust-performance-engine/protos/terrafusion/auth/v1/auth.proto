syntax = "proto3";

package terrafusion.auth.v1;

service AuthenticationService {
  // Authenticate user with credentials
  rpc Authenticate(AuthenticationRequest) returns (AuthenticationResponse);
  
  // Validate JWT token
  rpc ValidateToken(TokenValidationRequest) returns (TokenValidationResponse);
  
  // Refresh JWT token
  rpc RefreshToken(TokenRefreshRequest) returns (TokenRefreshResponse);
  
  // Get user permissions
  rpc GetUserPermissions(UserPermissionsRequest) returns (UserPermissionsResponse);
  
  // Stream security events
  rpc StreamSecurityEvents(SecurityEventRequest) returns (stream SecurityEventResponse);
}

message AuthenticationRequest {
  string username = 1;
  string password = 2;
  string client_id = 3;
  repeated string requested_scopes = 4;
  string mfa_token = 5;
}

message AuthenticationResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 expires_in = 4;
  UserProfile user_profile = 5;
  repeated string granted_scopes = 6;
  string session_id = 7;
}

message TokenValidationRequest {
  string token = 1;
  repeated string required_scopes = 2;
  string resource = 3;
}

message TokenValidationResponse {
  bool valid = 1;
  string user_id = 2;
  repeated string scopes = 3;
  int64 expires_at = 4;
  string validation_message = 5;
}

message TokenRefreshRequest {
  string refresh_token = 1;
  string client_id = 2;
}

message TokenRefreshResponse {
  bool success = 1;
  string new_access_token = 2;
  string new_refresh_token = 3;
  int64 expires_in = 4;
}

message UserPermissionsRequest {
  string user_id = 1;
  string resource = 2;
}

message UserPermissionsResponse {
  repeated Permission permissions = 1;
  repeated string roles = 2;
  SecurityClearance clearance = 3;
}

message SecurityEventRequest {
  repeated string event_types = 1;
  string user_id = 2;
  int32 update_interval_seconds = 3;
}

message SecurityEventResponse {
  SecurityEvent event = 1;
  string timestamp = 2;
  string correlation_id = 3;
}

message UserProfile {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string full_name = 4;
  repeated string roles = 5;
  SecurityClearance clearance_level = 6;
  string department = 7;
  bool mfa_enabled = 8;
  string last_login = 9;
}

message Permission {
  string resource = 1;
  repeated string actions = 2;
  repeated string conditions = 3;
  string scope = 4;
}

message SecurityEvent {
  string event_id = 1;
  SecurityEventType event_type = 2;
  string user_id = 3;
  string description = 4;
  string source_ip = 5;
  string user_agent = 6;
  map<string, string> metadata = 7;
  SecurityEventSeverity severity = 8;
}

enum SecurityClearance {
  SECURITY_CLEARANCE_UNSPECIFIED = 0;
  SECURITY_CLEARANCE_PUBLIC = 1;
  SECURITY_CLEARANCE_INTERNAL = 2;
  SECURITY_CLEARANCE_CONFIDENTIAL = 3;
  SECURITY_CLEARANCE_SECRET = 4;
  SECURITY_CLEARANCE_TOP_SECRET = 5;
}

enum SecurityEventType {
  SECURITY_EVENT_TYPE_UNSPECIFIED = 0;
  SECURITY_EVENT_TYPE_LOGIN_SUCCESS = 1;
  SECURITY_EVENT_TYPE_LOGIN_FAILURE = 2;
  SECURITY_EVENT_TYPE_LOGOUT = 3;
  SECURITY_EVENT_TYPE_TOKEN_REFRESH = 4;
  SECURITY_EVENT_TYPE_PERMISSION_DENIED = 5;
  SECURITY_EVENT_TYPE_SUSPICIOUS_ACTIVITY = 6;
  SECURITY_EVENT_TYPE_MFA_CHALLENGE = 7;
  SECURITY_EVENT_TYPE_PASSWORD_CHANGE = 8;
}

enum SecurityEventSeverity {
  SECURITY_EVENT_SEVERITY_UNSPECIFIED = 0;
  SECURITY_EVENT_SEVERITY_INFO = 1;
  SECURITY_EVENT_SEVERITY_WARNING = 2;
  SECURITY_EVENT_SEVERITY_ERROR = 3;
  SECURITY_EVENT_SEVERITY_CRITICAL = 4;
}