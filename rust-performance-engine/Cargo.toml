[workspace]
resolver = "2"
members = [
    "crates/agent-coordination",
    "crates/geospatial-engine", 
    "crates/ffi-bridge",
    "crates/valuation-kernel",
    "crates/security-layer",
    "crates/performance-monitor",
    "crates/grpc-services",
    # Unreachable Advantage Enhancement Crates
    "crates/financial-engine",
    "crates/network-overlay",
    "crates/education-platform",
    "crates/terranet-secure",
    "crates/legal-processor", 
    "crates/federated-analytics",
    "crates/crypto-post-quantum",
    # Golden Ratio Fibonacci Engine (7th Core Component)
    "crates/golden-core",
    "crates/golden-graph", 
    "crates/golden-opt",
    "crates/golden-service",
    "crates/golden-tn",
    "tests",
    "core-test",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bsvalues/terrafusion_os_1.0"
authors = ["TerraFusion Engineering Team"]

[workspace.dependencies]
# High-Performance Async Runtime
tokio = { version = "1.37", features = ["full", "tracing"] }
tokio-util = { version = "0.7", features = ["full"] }

# Lock-Free Concurrency
crossbeam = { version = "0.8", features = ["std"] }
dashmap = "5.5"
parking_lot = "0.12"

# Serialization & APIs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["full"] }

# Security & Cryptography  
ring = "0.17"
rustls = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.22"
opentelemetry-otlp = "0.15"

# Geospatial & Math (simplified for Windows)
geo = "0.28"
nalgebra = "0.32"

# Valuation & Financial Math
ordered-float = "4.3"
rust_decimal = { version = "1.36", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
statrs = "0.17"
fiscal-year = "0.2"

# FFI & WASM
cbindgen = "0.26"
wasm-bindgen = "0.2"
napi = { version = "2.16", features = ["full"] }
napi-derive = "2.16"

# Testing & Validation
proptest = "1.4"
quickcheck = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
cargo-fuzz = "0.11"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Golden Ratio Engine Dependencies
ndarray = "0.15"
rand = "0.8"

# Government Compliance
audit = "0.2"
cargo-deny = "0.14"

[profile.release]
# Government-grade optimization
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
inherits = "release"
debug = true

# Security configurations
[workspace.metadata.audit]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
deny = ["yanked"]

[workspace.metadata.deny]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" }
]