[dependencies]
# Test framework dependencies
tokio = { version = "1.0", features = ["full"] }
tokio-test = "0.4"
futures = "0.3"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.0", features = ["v4"] }

# TerraFusion performance engine components
agent-coordination = { path = "../crates/agent-coordination" }
geospatial-engine = { path = "../crates/geospatial-engine" }
valuation-kernel = { path = "../crates/valuation-kernel" }
security-layer = { path = "../crates/security-layer" }
performance-monitor = { path = "../crates/performance-monitor" }
ffi-bridge = { path = "../crates/ffi-bridge" }

[package]
name = "terrafusion-integration-tests"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion OS Team"]
description = "Comprehensive integration tests for TerraFusion OS Elite Performance Engine"

[[test]]
name = "integration_tests"
path = "integration_tests.rs"

[[test]]
name = "load_tests"
path = "load_tests.rs"

[[test]]
name = "compliance_tests"
path = "compliance_tests.rs"