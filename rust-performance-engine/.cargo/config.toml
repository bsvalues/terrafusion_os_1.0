[build]
target-dir = "target"

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "opt-level=3",
    "-C", "target-cpu=native"
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "opt-level=3",
    "-C", "target-cpu=native"
]

# Government compliance settings
[env]
RUST_LOG = "debug"
RUST_BACKTRACE = "1"
CARGO_NET_RETRY = "3"

# Security-first build flags
[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true

# Government audit profile
[profile.audit]
inherits = "release"
debug = true
debug-assertions = true
overflow-checks = true

# Benchmarking profile
[profile.bench]
inherits = "release"
debug = true