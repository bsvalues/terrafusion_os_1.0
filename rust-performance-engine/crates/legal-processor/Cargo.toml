[package]
name = "legal-processor"
version = "1.0.0"
edition = "2021"
description = "TerraJustice Legal Processor - Government legal workflow automation"
license = "MIT"
authors = ["TerraFusion Engineering Team"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
sha2 = "0.10"
tracing = "0.1"
thiserror = "1.0"

[features]
default = []