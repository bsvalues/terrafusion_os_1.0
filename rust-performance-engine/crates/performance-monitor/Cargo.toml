[package]
name = "performance-monitor"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion OS Team <dev@terrafusion.org>"]
description = "Elite performance monitoring and observability for TerraFusion OS Rust engine"
license = "MIT"

[dependencies]
# Core libraries
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
uuid = { version = "1.0", features = ["v4"] }

# Observability and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics and monitoring
prometheus = "0.13.4"

# System monitoring
sysinfo = "0.30"

# Async and concurrency
tokio = { version = "1.0", features = ["full", "tracing"] }
parking_lot = "0.12"
dashmap = "5.5"

# Serialization and APIs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time and duration
chrono = { version = "0.4", features = ["serde"] }

# Local dependencies
geospatial-engine = { path = "../geospatial-engine" }
agent-coordination = { path = "../agent-coordination" }
valuation-kernel = { path = "../valuation-kernel" }
security-layer = { path = "../security-layer" }

[features]
default = ["system-metrics", "prometheus-export"]
system-metrics = []
prometheus-export = []
government-monitoring = ["system-metrics", "prometheus-export"]

[dev-dependencies]
criterion = "0.5"
tempfile = "3.0"
env_logger = "0.10"
tokio-test = "0.4"