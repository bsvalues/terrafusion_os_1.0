[package]
name = "federated-analytics"
version = "1.0.0"
edition = "2021"
description = "TerraSync Intelligence Analytics - Privacy-preserving government analytics and threat intelligence"
license = "MIT"
authors = ["TerraFusion Engineering Team"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
thiserror = "1.0"
sha2 = "0.10"
once_cell = "1.0"

[features]
default = []