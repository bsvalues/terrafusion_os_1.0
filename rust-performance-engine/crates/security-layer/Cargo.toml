[package]
name = "security-layer"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion OS Team <dev@terrafusion.org>"]
description = "Government-grade security validation and encryption for TerraFusion OS"
license = "MIT"

[dependencies]
# Cryptography and security
ring = "0.17"
sha2 = "0.10"
aes-gcm = "0.10"
x25519-dalek = "2.0"
ed25519-dalek = "2.1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand_core = "0.6"

# Serialization and encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"

# Async and concurrency
tokio = { version = "1.0", features = ["full"] }
parking_lot = "0.12"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Time and UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Testing
proptest = { version = "1.0", optional = true }
quickcheck = { version = "1.0", optional = true }

# Local dependencies
geospatial-engine = { path = "../geospatial-engine" }
agent-coordination = { path = "../agent-coordination" }

[features]
default = ["security-testing"]
security-testing = ["proptest", "quickcheck"]
audit-logging = []
quantum-ready = []
government-mode = ["audit-logging"]

[dev-dependencies]
proptest = "1.0"
quickcheck = "1.0"
criterion = "0.5"
tempfile = "3.0"
env_logger = "0.10"