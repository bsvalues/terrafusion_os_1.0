[package]
name = "financial-engine"
version = "1.0.0"
edition = "2021"
description = "TerraBank Financial Infrastructure - Government-grade payment processing and banking operations"
license = "MIT"
authors = ["TerraFusion Engineering Team"]

[dependencies]
# High-Performance Async Runtime
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serialization & APIs
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }

# Security & Cryptography
ring = { workspace = true }
sha2 = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }

# Concurrency & Performance
crossbeam = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Financial & Compliance
rust_decimal = "1.33"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

# Banking API Integration
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Database & Persistence
sqlx = { version = "0.8.1", features = ["runtime-tokio-rustls", "sqlite", "postgres", "chrono", "uuid", "rust_decimal"] }

# Government Compliance & Audit
security-layer = { path = "../security-layer" }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["sponsor-bank", "fednow", "compliance"]
sponsor-bank = []  # Sponsor bank integration for MVP
fednow = []        # FedNow real-time payments
ach = []           # ACH processing
wires = []         # Wire transfers
compliance = []    # Full compliance reporting via security-layer