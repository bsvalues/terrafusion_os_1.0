[package]
name = "grpc-services"
version = "0.1.0"
edition = "2021"
description = "TerraFusion gRPC services implementation"

[dependencies]
tonic = { version = "0.12", features = ["tls"] }
tonic-reflection = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tower = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.0"
bcrypt = "0.15"
anyhow = "1.0"
thiserror = "1.0"

[build-dependencies]
tonic-build = "0.12"

[lib]
name = "grpc_services"
path = "src/lib.rs"

[[bin]]
name = "grpc-server"
path = "src/bin/server.rs"

[[bin]]
name = "grpc-client"
path = "src/bin/client.rs"

[[bin]]
name = "performance-test"
path = "src/bin/performance-test.rs"