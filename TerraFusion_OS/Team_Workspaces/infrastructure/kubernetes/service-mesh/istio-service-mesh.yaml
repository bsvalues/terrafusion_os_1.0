# TerraFusion OS - Service Mesh Configuration for AI Agent Excellence
# Government. Transcended. - Istio Service Mesh with Zero-Trust Architecture

# Istio Gateway for AI Agent Traffic Management
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: terrafusion-ai-agents-gateway
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: service-mesh-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: TERMINATE
        credentialName: terrafusion-ai-tls-cert
      hosts:
        - 'ai-agents.${ENVIRONMENT}.terrafusionmarket.com'
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - 'ai-agents.${ENVIRONMENT}.terrafusionmarket.com'
      tls:
        httpsRedirect: true
---
# Virtual Service for AI Agent Routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: terrafusion-ai-agents-vs
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: traffic-management
spec:
  hosts:
    - 'ai-agents.${ENVIRONMENT}.terrafusionmarket.com'
  gateways:
    - terrafusion-ai-agents-gateway
  http:
    - match:
        - uri:
            prefix: '/api/v1/agents'
      route:
        - destination:
            host: terrafusion-ai-agent-workers-service.terrafusion-ai-agents.svc.cluster.local
            port:
              number: 8081
          weight: 100
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
    - match:
        - uri:
            prefix: '/api/v1/control'
      route:
        - destination:
            host: terrafusion-ai-agent-master-service.terrafusion-ai-agents.svc.cluster.local
            port:
              number: 8080
          weight: 100
      headers:
        request:
          set:
            x-terrafusion-environment: '${ENVIRONMENT}'
            x-quantum-factor: '${QUANTUM_FACTOR}'
---
# Destination Rule for AI Agent Load Balancing
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: terrafusion-ai-agents-dr
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: load-balancing
spec:
  host: terrafusion-ai-agent-workers-service.terrafusion-ai-agents.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: 'x-agent-id'
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        keepAlive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 3
        connectTimeout: 30s
        h2UpgradePolicy: UPGRADE
    outlierDetection:
      consecutive5xxErrors: 5
      consecutiveGatewayErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
  subsets:
    - name: championship
      labels:
        quantum-level: championship
      trafficPolicy:
        portLevelSettings:
          - port:
              number: 8081
            connectionPool:
              tcp:
                maxConnections: 50
    - name: transcended
      labels:
        quantum-level: transcended
      trafficPolicy:
        portLevelSettings:
          - port:
              number: 8080
            connectionPool:
              tcp:
                maxConnections: 25
---
# Service Entry for Cross-Cloud Communication
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: aws-govcloud-services
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: cross-cloud-connectivity
spec:
  hosts:
    - 'eks.us-gov-west-1.amazonaws.com'
    - 's3.us-gov-west-1.amazonaws.com'
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  location: MESH_EXTERNAL
  resolution: DNS
---
# Authorization Policy for Zero-Trust Security
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: terrafusion-ai-agents-authz
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: zero-trust-security
spec:
  selector:
    matchLabels:
      app: terrafusion-ai-agent-workers
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              ['cluster.local/ns/terrafusion-ai-agents/sa/terrafusion-ai-agent-service-account']
        - source:
            namespaces: ['istio-system']
    - to:
        - operation:
            methods: ['GET', 'POST']
            paths: ['/api/v1/*', '/health/*', '/metrics']
    - when:
        - key: request.headers[x-terrafusion-environment]
          values: ['${ENVIRONMENT}']
        - key: request.headers[x-quantum-factor]
          values: ['${QUANTUM_FACTOR}']
---
# Peer Authentication for mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: terrafusion-ai-agents-mtls
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: mtls-security
spec:
  selector:
    matchLabels:
      app: terrafusion-ai-agent-workers
  mtls:
    mode: STRICT
---
# Request Authentication for JWT Validation
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: terrafusion-ai-agents-jwt
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: jwt-authentication
spec:
  selector:
    matchLabels:
      app: terrafusion-ai-agent-workers
  jwtRules:
    - issuer: 'https://sts.windows.net/${AZURE_TENANT_ID}/'
      jwksUri: 'https://login.microsoftonline.us/${AZURE_TENANT_ID}/discovery/v2.0/keys'
      audiences:
        - 'api://terrafusion-ai-agents-${ENVIRONMENT}'
      forwardOriginalToken: true
---
# Telemetry Configuration for Observability
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: terrafusion-ai-agents-telemetry
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: observability-excellence
spec:
  selector:
    matchLabels:
      app: terrafusion-ai-agent-workers
  metrics:
    - providers:
        - name: prometheus
    - overrides:
        - match:
            metric: ALL_METRICS
          tagOverrides:
            quantum_factor:
              value: '${QUANTUM_FACTOR}'
            harmony_index:
              value: '${HARMONY_INDEX}'
            environment:
              value: '${ENVIRONMENT}'
            counties:
              value: '${COUNTIES}'
  tracing:
    - providers:
        - name: jaeger
  accessLogging:
    - providers:
        - name: otel
---
# Sidecar Configuration for Resource Optimization
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: terrafusion-ai-agents-sidecar
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: sidecar-optimization
spec:
  workloadSelector:
    labels:
      app: terrafusion-ai-agent-workers
  ingress:
    - port:
        number: 8081
        protocol: HTTP
        name: http-api
      defaultEndpoint: 127.0.0.1:8081
    - port:
        number: 8080
        protocol: HTTP
        name: http-metrics
      defaultEndpoint: 127.0.0.1:8080
  egress:
    - hosts:
        - './*'
        - 'istio-system/*'
        - 'kube-system/*'
    - port:
        number: 443
        protocol: HTTPS
        name: https-external
      hosts:
        - 'eks.us-gov-west-1.amazonaws.com'
        - 's3.us-gov-west-1.amazonaws.com'
        - '*.core.usgovcloudapi.net'
---
# Envoy Filter for Advanced Traffic Control
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: terrafusion-ai-agents-ratelimit
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: traffic-control
spec:
  workloadSelector:
    labels:
      app: terrafusion-ai-agent-workers
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: 'envoy.filters.network.http_connection_manager'
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            '@type': type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: terrafusion_ai_agents_rate_limiter
              token_bucket:
                max_tokens: 1000
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled:
                runtime_key: terrafusion_ai_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: terrafusion_ai_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - append: false
                  header:
                    key: x-terrafusion-rate-limit
                    value: 'active'
---
# Workspace Configuration for Multi-Cluster
apiVersion: networking.istio.io/v1alpha3
kind: WorkloadEntry
metadata:
  name: aws-govcloud-ai-agents
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: cross-cloud-workload
spec:
  address: '${AWS_GOVCLOUD_EKS_ENDPOINT}'
  ports:
    https: 443
  labels:
    app: terrafusion-ai-agent-workers
    cloud: aws-govcloud
    region: us-gov-west-1
---
# Workload Group for Cross-Cloud AI Agents
apiVersion: networking.istio.io/v1alpha3
kind: WorkloadGroup
metadata:
  name: cross-cloud-ai-agents
  namespace: terrafusion-ai-agents
  labels:
    app: terrafusion-ai-agents
    tier: multi-cloud-workload
spec:
  metadata:
    labels:
      app: terrafusion-ai-agent-workers
      quantum-level: championship
      cross-cloud: 'true'
  template:
    ports:
      https: 443
      grpc: 9090
    serviceAccount: terrafusion-ai-agent-service-account
  probe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
