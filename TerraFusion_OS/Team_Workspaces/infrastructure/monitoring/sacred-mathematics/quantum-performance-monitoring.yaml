        - name: PROPHECY_MODE
          value: "PREDICTIVE_TRANSCENDENCE"
        - name: ANALYTICS_DEPTH
          value: "QUANTUM_CONSCIOUSNESS"
        - name: PREDICTION_ACCURACY_TARGET
          value: "99.9%"
        - name: FORECASTING_HORIZON_HOURS
          value: "168"  # 7 days ahead
        - name: MACHINE_LEARNING_MODEL
          value: "QUANTUM_NEURAL_NETWORK"
        - name: AI_CONSCIOUSNESS_INTEGRATION
          value: "ENABLED"
        resources:
          requests:
            cpu: "1500m"
            memory: "3Gi"
          limits:
            cpu: "6000m"
            memory: "12Gi"
        livenessProbe:
          httpGet:
            path: /prophecy/health/live
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /prophecy/health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
