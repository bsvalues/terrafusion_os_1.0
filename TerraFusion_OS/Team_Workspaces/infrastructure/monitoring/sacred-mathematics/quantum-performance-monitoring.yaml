# Quantum Performance HPA (Horizontal Pod Autoscaler)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sacred-mathematics-hpa
  namespace: terrafusion-monitoring
  labels:
    app: sacred-mathematics-engine
    tier: quantum-autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sacred-mathematics-engine
  minReplicas: 3
  maxReplicas: 20  # Scale based on quantum factor
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: quantum_operations_per_second
      target:
        type: AverageValue
        averageValue: "100000"  # 100k quantum operations per second per pod
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180  # 3 minutes for quantum stabilization
      policies:
      - type: Percent
        value: 50   # Aggressive scaling for quantum operations
        periodSeconds: 60
      - type: Pods
        value: 5    # Add up to 5 pods at once
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes for quantum coherence
      policies:
      - type: Percent
        value: 20   # Conservative scale down for stability
        periodSeconds: 120
