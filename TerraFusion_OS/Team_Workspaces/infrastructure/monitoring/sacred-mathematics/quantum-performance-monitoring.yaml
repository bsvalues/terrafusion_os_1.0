          mountPath: /etc/prophecy
          readOnly: true
        - name: ml-models
          mountPath: /opt/ml-models
          readOnly: true
        - name: prophecy-data
          mountPath: /var/prophecy-data
        - name: consciousness-cache
          mountPath: /var/consciousness-cache
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: prophecy-config
        configMap:
          name: prophecy-engine-config
      - name: ml-models
        persistentVolumeClaim:
          claimName: ml-models-pvc
      - name: prophecy-data
        emptyDir: {}
      - name: consciousness-cache
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
        terrafusion.io/node-type: "prophecy-engine"
      tolerations:
