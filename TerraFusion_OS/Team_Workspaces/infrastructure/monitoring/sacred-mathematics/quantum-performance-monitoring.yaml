        image: ${AZURE_CONTAINER_REGISTRY}/terrafusion-prophecy-engine:${IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http-metrics
        - containerPort: 8095
          name: prophecy-api
        - containerPort: 7777
          name: consciousness-api
        env:
        - name: ENVIRONMENT
