name: 🔒 Security Report
description: Report a security vulnerability (Private)
title: "[SECURITY] "
labels: ["security", "critical"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **IMPORTANT**: If this is a critical security vulnerability, please email security@bsvalues.com instead of creating a public issue.

  - type: dropdown
    id: severity
    attributes:
      label: Severity Level
      description: How severe is this security issue?
      options:
        - Critical (Remote Code Execution, Data Breach)
        - High (Privilege Escalation, Authentication Bypass)
        - Medium (Information Disclosure, CSRF)
        - Low (Security Hardening, Best Practices)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which component has the security issue?
      options:
        - Authentication/Authorization
        - API Endpoints
        - Database Access
        - File Upload/Download
        - AI Model Security
        - Infrastructure/DevOps
        - Frontend/UI
        - Third-party Dependencies
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Vulnerability Description
      description: Describe the security vulnerability
      placeholder: What is the security issue?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Potential Impact
      description: What could an attacker achieve?
      placeholder: Describe the potential damage or data exposure...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Proof of Concept
      description: Steps to reproduce (if safe to share)
      placeholder: |
        1. Access endpoint...
        2. Send malicious payload...
        3. Observe unauthorized access...
    validations:
      required: false

  - type: textarea
    id: mitigation
    attributes:
      label: Suggested Mitigation
      description: How can this be fixed?
    validations:
      required: false

  - type: checkboxes
    id: compliance
    attributes:
      label: Compliance Impact
      description: Which compliance standards might be affected?
      options:
        - label: FISMA
        - label: NIST Cybersecurity Framework
        - label: SOC 2
        - label: FedRAMP
        - label: GDPR/Privacy
        - label: Other Government Standards

  - type: checkboxes
    id: checklist
    attributes:
      label: Security Checklist
      options:
        - label: I have not disclosed this vulnerability publicly
          required: true
        - label: This affects government data or operations
          required: false
        - label: I have contacted security@bsvalues.com for critical issues
          required: false
