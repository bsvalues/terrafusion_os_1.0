name: Security follow-up
description: Track non-sensitive security work after private disclosure or rotation
title: '[SECURITY] '
labels: ['security', 'needs-triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for live exploit details or unrotated credentials.
        For sensitive disclosures, email security@bsvalues.com first.

  - type: dropdown
    id: class
    attributes:
      label: Security area
      options:
        - Secret exposure / rotation follow-up
        - AuthN / AuthZ hardening
        - Workflow or supply-chain hardening
        - Infrastructure / deploy access
        - Documentation / policy cleanup
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      placeholder: What needs to be fixed or tracked?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      placeholder: What could be affected?
    validations:
      required: true

  - type: textarea
    id: containment
    attributes:
      label: Containment already completed
      placeholder: Repo made private, key rotated, package deleted, etc.

  - type: textarea
    id: remaining
    attributes:
      label: Remaining remediation
      placeholder: What still needs to happen?

  - type: checkboxes
    id: safeguards
    attributes:
      label: Confirmations
      options:
        - label: I did not include live secrets, tokens, or private keys
          required: true
        - label: Sensitive details were disclosed privately first if needed
          required: true
