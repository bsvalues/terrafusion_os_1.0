name: Feature request
description: Propose a change to product behavior, repo workflow, or operations
title: '[FEATURE] '
labels: ['enhancement', 'needs-review']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template for concrete, reviewable requests. Tie the request to a
        real repo surface or operational need.

  - type: dropdown
    id: type
    attributes:
      label: Request type
      options:
        - Core governance / pilot tools
        - GitHub workflows / release automation
        - Backend API
        - Frontend / OS Shell
        - Operations / deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      placeholder: What is missing or painful today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      placeholder: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact and risk
      placeholder: Which systems, workflows, or environments would this affect?

  - type: checkboxes
    id: surfaces
    attributes:
      label: Potentially affected surfaces
      options:
        - label: 'Protected `main` branch rules'
        - label: '`.github/workflows/**`'
        - label: '`os-platform/core/**`'
        - label: Deployment runbook
        - label: Staging environment
        - label: Production environment

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched for duplicates
          required: true
        - label: I described the desired outcome, not just the implementation
          required: true
