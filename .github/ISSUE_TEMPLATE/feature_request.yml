name: ✨ Feature Request
description: Suggest a new feature for TerraFusion OS 1.0
title: "[FEATURE] "
labels: ["enhancement", "needs-review"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature for TerraFusion OS 1.0! Please provide detailed information about your request.

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature relate to?
      options:
        - AI/Machine Learning
        - Performance Optimization
        - User Interface
        - API/Integration
        - Security/Compliance
        - DevOps/Deployment
        - Analytics/Reporting
        - Government Workflow
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (Blocking Government Operations)
        - High (Significant Value Add)
        - Medium (Nice to Have)
        - Low (Future Enhancement)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the current limitation or challenge...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
      placeholder: How should this feature work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
    validations:
      required: false

  - type: textarea
    id: use_cases
    attributes:
      label: Use Cases
      description: Specific scenarios where this feature would be valuable
      placeholder: |
        1. Government user needs to...
        2. Administrator wants to...
        3. System should automatically...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know this feature is complete?
      placeholder: |
        - [ ] User can...
        - [ ] System validates...
        - [ ] Performance meets...
    validations:
      required: false

  - type: checkboxes
    id: impact
    attributes:
      label: Impact Areas
      description: Which areas might be affected by this feature?
      options:
        - label: User Experience
        - label: Performance
        - label: Security
        - label: Compliance
        - label: Database Schema
        - label: API Changes
        - label: Documentation

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: This feature aligns with government requirements
          required: true
        - label: I have provided clear use cases and acceptance criteria
          required: true
