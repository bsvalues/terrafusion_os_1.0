name: Bug report
description: Report a defect in the current TerraFusion OS repo or release lane
title: '[BUG] '
labels: ['bug', 'needs-triage']
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this template for normal defects. Do not paste live secrets, private
        keys, or exploitable details here. Use the security route for that.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core governance / pilot tools
        - GitHub workflows / CI
        - Release lane / rollback
        - Backend API
        - Frontend / OS Shell
        - Operations runbook / docs
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - GitHub Actions
        - Staging
        - Production
        - Documentation only
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      placeholder: What is broken?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run or open ...
        2. Trigger ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: input
    id: sha
    attributes:
      label: Commit SHA or branch
      placeholder: 864d651a8b49ec1b2dc2cbca137091dbc1c3b29b

  - type: input
    id: correlation
    attributes:
      label: correlationId (if available)
      placeholder: corr-..., net-..., ebnd-...

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, workflow runs, or evidence artifact
      placeholder: Paste the relevant error text, run URL, or artifact name

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for duplicates
          required: true
        - label: I did not include live secrets or private keys
          required: true
