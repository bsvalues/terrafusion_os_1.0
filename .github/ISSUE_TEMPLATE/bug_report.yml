name: 🐛 Bug Report
description: Report a bug in TerraFusion OS 1.0
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in TerraFusion OS 1.0! Please fill out the following information to help us resolve the issue quickly.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - AI Swarm Intelligence
        - Quantum Performance Engine
        - Probabilistic Computing
        - Frontend UI
        - Backend API
        - Database Layer
        - DevOps/Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (System Down)
        - High (Major Feature Broken)
        - Medium (Feature Partially Working)
        - Low (Minor Issue)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: System information
      placeholder: |
        - OS: [e.g. Windows 11, Ubuntu 22.04]
        - Browser: [e.g. Chrome 120, Firefox 121]
        - TerraFusion Version: [e.g. 1.0.0]
        - Deployment: [e.g. Local, Docker, Kubernetes]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Add any relevant logs, error messages, or screenshots
      placeholder: Paste logs here or drag and drop screenshots

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: This issue affects government operations or compliance
          required: false
