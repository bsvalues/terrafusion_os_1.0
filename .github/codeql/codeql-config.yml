name: 'TerraFusion OS Government CodeQL Configuration'
# Government-grade static analysis configuration for FISMA compliance
# Scoped to production code only - excludes legacy/vendor/deployment artifacts

disable-default-queries: false

queries:
  - uses: security-extended
  - uses: security-and-quality

# Only scan the real production code
paths:
  - backend
  - frontend

paths-ignore:
  # Standard build artifacts
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/coverage/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/publish/**'
  - '**/*.min.js'
  - '**/*.bundle.js'

  # Test files (scanned separately)
  - '**/*.test.js'
  - '**/*.test.ts'
  - '**/*.spec.js'
  - '**/*.spec.ts'

  # Legacy / vendor / deployment directories (contain malformed JSON, huge files)
  - 'workspaces/**'
  - 'deployment/**'
  - 'os-platform/**'
  - 'marketplace/**'
  - 'monorepo-scaffolding/**'
  - 'costforge-ai-workspace/**'
  - 'applications/**'
  - 'tests/marketplace/**'
  - 'TerraFusion_Command_Portal_Starter/**'

  # Archived / backup directories
  - '**/*.archived/**'
  - '**/*-backup-*/**'

  # Large generated/vendor files (45MB+ JS file)
  - '**/report-player-core*.js'
