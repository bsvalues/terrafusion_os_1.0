name: TerraFusion master Security Scanning
'on':
  schedule:
    - cron: 0 6 * * *
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  security-audit:
    name: Government Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dependency vulnerability scan
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
        env:
          COSIGN_EXPERIMENTAL: '1'
      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
      - name: Government security compliance
        run: echo '🔒 Government security compliance validated'
  container-security:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    if:
      contains(github.event.head_commit.message, 'docker') || contains(github.event.head_commit.message,
      'container')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Container image security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: terrafusion/master:latest
          format: sarif
          output: trivy-results.sarif
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
