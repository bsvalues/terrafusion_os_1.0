name: 🔒 Security & Compliance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        default: 'comprehensive'
        type: choice
        options:
        - comprehensive
        - vulnerability
        - compliance
        - dependency
        - secrets

env:
  SECURITY_REPORT_RETENTION: 90

jobs:
  # =============================================================================
  # VULNERABILITY SCANNING
  # =============================================================================
  vulnerability-scan:
    name: 🛡️ Vulnerability Scanning
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'vulnerability' || github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Docker image vulnerability scan
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🐳 Scanning Docker images for vulnerabilities..."
          
          # Build test image for scanning
          docker build -t terrafusion-security-scan:latest .
          
          # Scan with Trivy
          trivy image --exit-code 1 --severity HIGH,CRITICAL terrafusion-security-scan:latest

      - name: Generate vulnerability report
        if: always()
        run: |
          echo "# 🛡️ Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f "trivy-results.sarif" ]]; then
            echo "📊 Trivy scan completed - results uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No vulnerability scan results found" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # DEPENDENCY ANALYSIS
  # =============================================================================
  dependency-check:
    name: 📦 Dependency Security Check
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'dependency' || github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend dependency check
        if: matrix.component == 'backend'
        working-directory: backend
        run: |
          echo "🔍 Checking .NET dependencies for known vulnerabilities..."
          
          # Install security analysis tools
          dotnet tool install --global security-scan --version 5.6.7
          
          # Run security scan
          security-scan TerraFusion.sln --excl-proj=**/*Test*.csproj

      - name: Frontend dependency check
        if: matrix.component == 'frontend'
        working-directory: frontend
        run: |
          echo "🔍 Checking npm dependencies for known vulnerabilities..."
          
          # Install dependencies
          npm ci
          
          # Run npm audit
          npm audit --audit-level high
          
          # Run additional security checks
          npx audit-ci --high

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-scan-${{ matrix.component }}
          path: |
            **/security-report.*
            **/audit-results.*
          retention-days: ${{ env.SECURITY_REPORT_RETENTION }}

  # =============================================================================
  # SECRETS DETECTION
  # =============================================================================
  secrets-scan:
    name: 🕵️ Secrets Detection
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'secrets' || github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for comprehensive scan

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog secrets scan
        run: |
          echo "🔍 Scanning for exposed secrets..."
          
          trufflehog git file://. \
            --branch=main \
            --fail \
            --no-verification \
            --json > secrets-scan-results.json || true
          
          # Check if any secrets were found
          if [[ -s secrets-scan-results.json ]]; then
            echo "⚠️ Potential secrets detected!"
            cat secrets-scan-results.json
            exit 1
          else
            echo "✅ No secrets detected"
          fi

      - name: Scan for common secret patterns
        run: |
          echo "🔍 Scanning for common secret patterns..."
          
          # Define patterns for common secrets
          secret_patterns=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api_key\s*=\s*['\"][^'\"]+['\"]"
            "secret\s*=\s*['\"][^'\"]+['\"]"
            "token\s*=\s*['\"][^'\"]+['\"]"
            "-----BEGIN RSA PRIVATE KEY-----"
            "-----BEGIN PRIVATE KEY-----"
          )
          
          violations=0
          for pattern in "${secret_patterns[@]}"; do
            matches=$(grep -r -i -E "$pattern" . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github || true)
            if [[ -n "$matches" ]]; then
              echo "⚠️ Potential secret pattern found: $pattern"
              echo "$matches"
              violations=$((violations + 1))
            fi
          done
          
          if [[ $violations -gt 0 ]]; then
            echo "❌ Found $violations potential secret violations"
            exit 1
          else
            echo "✅ No secret patterns detected"
          fi

  # =============================================================================
  # STATIC APPLICATION SECURITY TESTING (SAST)
  # =============================================================================
  sast-analysis:
    name: 🔬 Static Security Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,csharp,python
          queries: +security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript,csharp,python'

      - name: ESLint Security Analysis
        working-directory: frontend
        run: |
          echo "🔍 Running ESLint security analysis..."
          
          npm ci
          npm run lint:security || true

      - name: .NET Security Analysis
        working-directory: backend
        run: |
          echo "🔍 Running .NET security analysis..."
          
          # Install security analyzer
          dotnet add package Microsoft.CodeAnalysis.NetAnalyzers
          
          # Run analysis
          dotnet build --configuration Release --verbosity normal

  # =============================================================================
  # COMPLIANCE VALIDATION
  # =============================================================================
  compliance-check:
    name: 📋 Compliance Validation
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'compliance' || github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FISMA Compliance Check
        run: |
          echo "🛡️ Running FISMA compliance validation..."
          
          compliance_checks=(
            ".github/SECURITY.md:Security policy documented"
            "docs/COMPLIANCE.md:Compliance documentation exists"
            ".github/dependabot.yml:Dependency scanning configured"
            "README.md:Project documentation includes security information"
            "docs/DEPLOYMENT.md:Deployment security procedures documented"
          )
          
          violations=0
          for check in "${compliance_checks[@]}"; do
            file=$(echo $check | cut -d: -f1)
            desc=$(echo $check | cut -d: -f2)
            
            if [[ -f "$file" ]]; then
              echo "✅ $desc"
            else
              echo "❌ Missing: $desc ($file)"
              violations=$((violations + 1))
            fi
          done
          
          # Check for security headers in configuration
          security_configs=(
            "backend/TerraFusion.API/appsettings.json"
            "frontend/public/index.html"
            "nginx.conf"
          )
          
          for config in "${security_configs[@]}"; do
            if [[ -f "$config" ]]; then
              echo "✅ Security configuration file exists: $config"
            else
              echo "⚠️ Security configuration file missing: $config"
            fi
          done
          
          if [[ $violations -gt 0 ]]; then
            echo "❌ FISMA compliance violations found: $violations"
            exit 1
          else
            echo "✅ FISMA compliance checks passed"
          fi

      - name: GDPR Compliance Check
        run: |
          echo "🇪🇺 Running GDPR compliance validation..."
          
          # Check for privacy-related documentation
          privacy_files=(
            "docs/PRIVACY.md"
            "docs/DATA_PROTECTION.md"
            "legal/PRIVACY_POLICY.md"
          )
          
          for file in "${privacy_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "✅ Privacy documentation found: $file"
            else
              echo "⚠️ Privacy documentation missing: $file"
            fi
          done

  # =============================================================================
  # SECURITY CONFIGURATION VALIDATION
  # =============================================================================
  security-config:
    name: ⚙️ Security Configuration
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'comprehensive' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker security
        run: |
          echo "🐳 Validating Docker security configurations..."
          
          # Check Dockerfile for security best practices
          if [[ -f "Dockerfile" ]]; then
            echo "🔍 Analyzing Dockerfile security..."
            
            # Check for non-root user
            if grep -q "USER " Dockerfile; then
              echo "✅ Non-root user configured"
            else
              echo "⚠️ Consider using non-root user"
            fi
            
            # Check for specific versions
            if grep -q "latest" Dockerfile; then
              echo "⚠️ Consider pinning specific versions instead of 'latest'"
            else
              echo "✅ Specific versions used"
            fi
          fi

      - name: Validate web security headers
        run: |
          echo "🌐 Validating web security headers configuration..."
          
          required_headers=(
            "X-Content-Type-Options"
            "X-Frame-Options"
            "X-XSS-Protection"
            "Strict-Transport-Security"
            "Content-Security-Policy"
          )
          
          # Check if security headers are configured
          config_files=(
            "backend/TerraFusion.API/Program.cs"
            "backend/TerraFusion.API/Startup.cs"
            "nginx.conf"
          )
          
          for file in "${config_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "🔍 Checking security headers in $file..."
              
              for header in "${required_headers[@]}"; do
                if grep -q "$header" "$file"; then
                  echo "✅ $header configured in $file"
                else
                  echo "⚠️ $header not found in $file"
                fi
              done
            fi
          done

  # =============================================================================
  # SECURITY REPORT GENERATION
  # =============================================================================
  security-report:
    name: 📊 Security Report
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, dependency-check, secrets-scan, sast-analysis, compliance-check, security-config]
    if: always()
    steps:
      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-results/

      - name: Generate comprehensive security report
        run: |
          echo "# 🔒 Security Assessment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "**Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🎯 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|----------------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          # Report status of each security job
          echo "| Vulnerability Scan | ${{ needs.vulnerability-scan.result }} | Trivy filesystem and container scan |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Check | ${{ needs.dependency-check.result }} | Backend and frontend dependency analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-scan.result }} | TruffleHog and pattern-based scanning |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST Analysis | ${{ needs.sast-analysis.result }} | CodeQL static analysis |" >> $GITHUB_STEP_SUMMARY
          echo "| Compliance Check | ${{ needs.compliance-check.result }} | FISMA and GDPR compliance validation |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Config | ${{ needs.security-config.result }} | Docker and web security configuration |" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- Review security scan results in the Security tab" >> $GITHUB_STEP_SUMMARY
          echo "- Address any high or critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure all compliance requirements are met" >> $GITHUB_STEP_SUMMARY
          echo "- Regular security assessments should be conducted" >> $GITHUB_STEP_SUMMARY

      - name: Upload consolidated security report
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-report
          path: security-results/
          retention-days: ${{ env.SECURITY_REPORT_RETENTION }}

      - name: Security status check
        run: |
          failed_jobs=(
            "${{ needs.vulnerability-scan.result }}"
            "${{ needs.dependency-check.result }}"
            "${{ needs.secrets-scan.result }}"
            "${{ needs.sast-analysis.result }}"
            "${{ needs.compliance-check.result }}"
            "${{ needs.security-config.result }}"
          )
          
          for result in "${failed_jobs[@]}"; do
            if [[ "$result" == "failure" ]]; then
              echo "❌ Security assessment failed - critical security issues detected"
              exit 1
            fi
          done
          
          echo "✅ Security assessment completed successfully"
