name: 📸 Visual Regression Testing

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/src/components/**'
      - 'frontend/src/styles/**'
      - 'tests/e2e/frontend/visual/**'
      - '.github/workflows/visual-regression.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    name: 📸 Visual Regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2] # Shard index (out of 2 total)
        include:
          - browser: chromium
            project: 'Desktop Chrome'
          - browser: firefox
            project: 'Desktop Firefox'
          - browser: webkit
            project: 'Desktop Safari'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for baseline comparison

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: 📦 Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: 🚀 Start preview server
        working-directory: ./frontend
        run: |
          pnpm run preview &
          pnpm exec wait-on http://localhost:4173 -t 60000

      - name: 📸 Run visual regression tests
        run: |
          npx playwright test tests/e2e/frontend/visual --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/2
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: 📊 Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-2
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: 📸 Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-2
          path: test-results/**/*-diff.png
          retention-days: 14

      - name: 💬 Comment on PR with visual diffs
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find all diff images
            const testResultsDir = 'test-results';
            let diffCount = 0;

            if (fs.existsSync(testResultsDir)) {
              const files = fs.readdirSync(testResultsDir, { recursive: true });
              diffCount = files.filter(f => f.endsWith('-diff.png')).length;
            }

            const comment = `## 📸 Visual Regression Test Failed (${context.payload.pull_request.head.sha.substring(0, 7)})

            **Browser:** ${{ matrix.browser }}
            **Shard:** ${{ matrix.shard }}
            **Differences Found:** ${diffCount} screenshot(s)

            ⚠️ Visual changes detected! Please review the screenshot diffs in the workflow artifacts.

            ### Next Steps:
            1. Review the diff images in the [workflow run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. If changes are intentional, update baseline screenshots: \`npm run test:e2e:update-snapshots\`
            3. If changes are bugs, fix the visual issues and re-run tests

            **THE TERRAFUSION WAY: Visual consistency matters! 🎨**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  visual-regression-report:
    name: 📊 Visual Regression Report
    runs-on: ubuntu-latest
    needs: [visual-regression]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: 📊 Generate visual regression summary
        run: |
          echo "## 📸 Visual Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.visual-regression.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.visual-regression.result }}" == "success" ]; then
            echo "✅ All visual regression tests passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No visual differences detected across:" >> $GITHUB_STEP_SUMMARY
            echo "- Chromium (Chrome, Edge)" >> $GITHUB_STEP_SUMMARY
            echo "- Firefox" >> $GITHUB_STEP_SUMMARY
            echo "- WebKit (Safari)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Visual differences detected!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the screenshot diffs in the workflow artifacts." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**THE TERRAFUSION WAY: Pixel-perfect consistency! 🎨**" >> $GITHUB_STEP_SUMMARY

  update-baselines:
    name: 🔄 Update Visual Baselines
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: 📦 Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: 🏗️ Build frontend
        working-directory: ./frontend
        run: pnpm run build

      - name: 🚀 Start preview server
        working-directory: ./frontend
        run: |
          pnpm run preview &
          pnpm exec wait-on http://localhost:4173 -t 60000

      - name: 📸 Update baseline screenshots
        run: |
          pnpm exec playwright test tests/e2e/frontend/visual --update-snapshots
        env:
          CI: true

      - name: 📤 Commit updated baselines
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add tests/e2e/frontend/visual/**/*.png
          git diff --staged --quiet || git commit -m "chore: update visual regression baselines [skip ci]"
          git push
