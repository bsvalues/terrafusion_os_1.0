name: Frontend CI (sanity)

on:
  push:
    branches: [ feature/e2e-ci-strict ]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hello
        run: |
          echo "Workflow parsed. Runner is alive."
          node -v || true
          npm -v || true
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0
          clean: true

      - name: Guard: no gitlinks allowed
        run: |
          BAD="$(git ls-files -s | awk '$1==160000{print $4}')"
          if [ -n "$BAD" ]; then
            echo "ERROR: gitlink (submodule) detected:"; echo "$BAD"; exit 1
          fi

      - name: Setup cache and install
        run: |
          if [ -f terrafusion-cos/frontend_engine/pnpm-lock.yaml ]; then
            cd terrafusion-cos/frontend_engine
            npm ci
          elif [ -f terrafusion-cos/frontend_engine/package-lock.json ]; then
        run: |
        run: |
          echo '--- workspace listing after download ---'
          ls -laR . | sed -n '1,300p' || true
              name: Playwright smoke
              needs: build-ui
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    submodules: 'false'
                    fetch-depth: 0
                    clean: true

                - name: Guard: no gitlinks allowed
                  run: |
                    BAD="$(git ls-files -s | awk '$1==160000{print $4}')"
                    if [ -n "$BAD" ]; then
                      echo "ERROR: gitlink (submodule) detected:"; echo "$BAD"; exit 1
                    fi

                - name: Download UI artifact
                  uses: actions/download-artifact@v4
                  with:
                    name: ui-artifact

                - name: List downloaded artifacts (debug)
                  run: |
                    echo '--- workspace listing after download ---'
                    ls -laR . | sed -n '1,300p' || true

                - name: Extract UI (robust)
                  run: |
                    mkdir -p ui
                    found=$(find . -type f -name 'ui.tar.gz' -print -quit || true)
                    echo "found: $found"
                    playwright-smoke:
                      name: Playwright smoke
                      needs: build-ui
                      runs-on: ubuntu-latest
                      steps:
                        - uses: actions/checkout@v4
                          with:
                            submodules: 'false'
                            fetch-depth: 0
                            clean: true

                        - name: Guard: no gitlinks allowed
                          run: |
                            BAD="$(git ls-files -s | awk '$1==160000{print $4}')"
                            if [ -n "$BAD" ]; then
                              echo "ERROR: gitlink (submodule) detected:"; echo "$BAD"; exit 1
                            fi

                        - name: Download UI artifact
                          uses: actions/download-artifact@v4
                          with:
                            name: ui-artifact

                        - name: List downloaded artifacts (debug)
                          run: |
                            echo '--- workspace listing after download ---'
                            ls -laR . | sed -n '1,300p' || true

                        - name: Extract UI (robust)
                          run: |
                            mkdir -p ui
                            found=$(find . -type f -name 'ui.tar.gz' -print -quit || true)
                            echo "found: $found"
                            if [ -n "$found" ]; then
                              tar -xzf "$found" -C ui
                            else
                              echo "ui.tar.gz not found after download"
                              exit 2
                            fi

                        - name: Serve UI (background)
                          run: |
                            npx http-server ui -p 8080 &> server.log &
                            for i in {1..30}; do
                              if curl -sS http://127.0.0.1:8080 >/dev/null; then
                                echo server ready
                                break
                              fi
                              sleep 1
                            done

                        - name: Install Playwright
                          run: |
                            npm install -g npm@latest
                            npm install -g playwright@1.40.0 || true
                            npx playwright install --with-deps || true

                        - name: Run Playwright smoke test
                          env:
                            UI_BASE_URL: http://127.0.0.1:8080
                          run: |
                            mkdir -p terrafusion-cos/logs/artifacts
                            npx playwright test terrafusion-cos/e2e/smoke.spec.js --reporter=list || true

                        - name: Upload renderer screenshot (always)
                          if: always()
                          uses: actions/upload-artifact@v4
                          with:
                            name: renderer-screenshot
                            path: terrafusion-cos/logs/artifacts/renderer-screenshot.png

