name: Frontend CI (isolated)

on:
  push:
    branches: [ main, feature/e2e-ci-strict ]
  workflow_dispatch:

jobs:
  pack-ui:
    name: Build and package UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0
          clean: true

      - name: Guard: no gitlinks allowed
        run: |
          BAD="$(git ls-files -s | awk '$1==160000{print $4}')"
          if [ -n "$BAD" ]; then
            echo "ERROR: gitlink (submodule) detected:"; echo "$BAD"; exit 1
          fi

      - name: Build UI
        run: |
          set -e
          if [ -d terrafusion-cos/frontend_engine ]; then
            cd terrafusion-cos/frontend_engine
            if [ -f pnpm-lock.yaml ] || [ -f package-lock.json ] || [ -f yarn.lock ]; then
              npm ci || true
            fi
            npm run build || true
            cd ../../
          fi

      - name: Package UI deterministically
        run: |
          mkdir -p terrafusion-cos/.ci_artifacts
          # Prefer dist folder, fall back to ui or frontend dir
          if [ -d terrafusion-cos/frontend_engine/dist ]; then
            tar -C terrafusion-cos/frontend_engine/dist -czf terrafusion-cos/.ci_artifacts/ui.tar.gz .
          elif [ -d terrafusion-cos/ui ]; then
            tar -C terrafusion-cos/ui -czf terrafusion-cos/.ci_artifacts/ui.tar.gz .
          else
            # create a minimal index.html as fallback
            mkdir -p terrafusion-cos/.ci_artifacts/ui
            echo '<!doctype html><html><head><meta charset="utf-8"><title>TerraFusion UI</title></head><body><h1>TerraFusion UI (fallback)</h1></body></html>' > terrafusion-cos/.ci_artifacts/ui/index.html
            tar -C terrafusion-cos/.ci_artifacts -czf terrafusion-cos/.ci_artifacts/ui.tar.gz ui
          fi
          sha256sum terrafusion-cos/.ci_artifacts/ui.tar.gz | awk '{print $1}' > terrafusion-cos/.ci_artifacts/ui.sha256 || true

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifact
          path: terrafusion-cos/.ci_artifacts/ui.tar.gz

      - name: Upload UI sha256
        uses: actions/upload-artifact@v4
        with:
          name: ui-sha256
          path: terrafusion-cos/.ci_artifacts/ui.sha256

  playwright-smoke:
    name: Playwright smoke
    needs: pack-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
          fetch-depth: 0
          clean: true

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-artifact

      - name: List downloaded artifacts (debug)
        run: |
          echo '--- workspace listing after download ---'
          ls -laR . | sed -n '1,300p' || true

      - name: Extract UI
        run: |
          mkdir -p ui
          found=$(find . -type f -name 'ui.tar.gz' -print -quit || true)
          echo "found: $found"
          if [ -n "$found" ]; then
            tar -xzf "$found" -C ui
          else
            echo "ui.tar.gz not found after download"
            exit 2
          fi

      - name: Serve UI (background)
        run: |
          # start a simple static server in background; ignore errors if it can't start
          npx http-server ui -p 8080 &> server.log & || true
          for i in $(seq 1 30); do
            if curl -sS http://127.0.0.1:8080 >/dev/null; then
              echo server ready
              break
            fi
            sleep 1
          done

      - name: Install Playwright
        run: |
          npm install -g npm@latest
          npm i -D playwright || true
          npx playwright install --with-deps || true

      - name: Run Playwright smoke test
        env:
          UI_BASE_URL: http://127.0.0.1:8080
        run: |
          mkdir -p terrafusion-cos/logs/artifacts
          npx playwright test terrafusion-cos/e2e/smoke.spec.js --reporter=list || true

      - name: Upload renderer screenshot (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-screenshot
          path: terrafusion-cos/logs/artifacts/renderer-screenshot.png