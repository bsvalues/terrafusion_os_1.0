name: Frontend CI (isolated)

on:
  push:
    branches: [ feature/e2e-ci-strict ]
  pull_request:
    branches: [ main ]

jobs:
  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    container:
      # Replace with your pinned container image (GHCR/Azure) with Node 22 and pinned libs
      image: node:22-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache and install
        run: |
          # Prefer your lockfile (pnpm or npm/yarn). Adjust as needed.
          if [ -f terrafusion-cos/frontend_engine/pnpm-lock.yaml ]; then
            cd terrafusion-cos/frontend_engine
            npm ci
          elif [ -f terrafusion-cos/frontend_engine/package-lock.json ]; then
            cd terrafusion-cos/frontend_engine
            npm ci
          else
            cd terrafusion-cos/frontend_engine
            npm install
          fi

      - name: Build UI
        working-directory: terrafusion-cos/frontend_engine
        run: npm run ci:build

      - name: Pack UI artifact and produce checksum
        working-directory: terrafusion-cos
        run: |
          mkdir -p .ci_artifacts
          tar -C ui -czf .ci_artifacts/ui.tar.gz .
          sha256sum .ci_artifacts/ui.tar.gz | awk '{print $1}' > .ci_artifacts/ui.tar.gz.sha256

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifact
          path: terrafusion-cos/.ci_artifacts/

  playwright-smoke:
    name: Playwright smoke
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-artifact

      - name: Extract UI
        run: |
          mkdir -p ui
          tar -xzf terrafusion-cos/.ci_artifacts/ui.tar.gz -C ui

      - name: Serve UI (background)
        run: |
          # Use a lightweight static server
          npx http-server ui -p 8080 &> server.log &
          # wait for server ready
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8080 >/dev/null; then
              echo server ready
              break
            fi
            sleep 1
          done

      - name: Install Playwright
        run: |
          npm install -g npm@latest
          npm install -g playwright@1.40.0 || true
          npx playwright install --with-deps || true

      - name: Run Playwright smoke test
        env:
          UI_BASE_URL: http://127.0.0.1:8080
        run: |
          # Ensure tests write to the canonical artifact path
          mkdir -p terrafusion-cos/logs/artifacts
          npx playwright test terrafusion-cos/e2e/smoke.spec.js --reporter=list || true

      - name: Ensure screenshot path exists and upload (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-screenshot
          path: terrafusion-cos/logs/artifacts/renderer-screenshot.png
