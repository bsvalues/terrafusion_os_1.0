name: Release Branch Validation

# Triggers only on release branches
on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
  pull_request:
    branches:
      - main
    # Only when PR is from a release branch
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Gate 1: Backend Build Validation
  # ═══════════════════════════════════════════════════════════════
  backend-build:
    name: '🔵 Backend Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore backend/TerraFusion.sln

      - name: Build Backend
        run: dotnet build backend/TerraFusion.sln --no-restore --configuration Release

  # ═══════════════════════════════════════════════════════════════
  # Gate 1b: Backend Tests (Canonical)
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: '🔵 Backend Tests'
    needs: backend-build
    uses: ./.github/workflows/dotnet-test.yml
    with:
      dotnet_version: '8.0.x'
      solution: 'backend/TerraFusion.sln'

  # ═══════════════════════════════════════════════════════════════
  # Gate 2: Frontend Build Validation
  # ═══════════════════════════════════════════════════════════════
  frontend-build:
    name: '🟢 Frontend Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # No cache - package-lock.json is gitignored

      - name: Install Dependencies (Root)
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps
        continue-on-error: true

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        continue-on-error: true

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --passWithNoTests
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Gate 3: OS Shell Validation (Desktop Shell)
  # ═══════════════════════════════════════════════════════════════
  os-shell-build:
    name: '🖥️ OS Shell Build'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2

      - name: Install OS Shell Dependencies
        working-directory: frontend/apps/os-shell
        run: pnpm install --no-frozen-lockfile

      - name: Build OS Shell
        working-directory: frontend/apps/os-shell
        run: pnpm build
        continue-on-error: true

      - name: Run OS Shell Tests
        working-directory: frontend/apps/os-shell
        run: pnpm test -- --passWithNoTests
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Gate 4: Release Summary
  # ═══════════════════════════════════════════════════════════════
  release-summary:
    name: '📋 Release Summary'
    runs-on: ubuntu-latest
    needs: [backend-build, backend-tests, frontend-build, os-shell-build]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Release Branch Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Build | ${{ needs.backend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Build | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OS Shell Build | ${{ needs.os-shell-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Check Results
        run: |
          if [[ "${{ needs.backend-build.result }}" == "failure" ]]; then
            echo "⚠️ Backend build failed - review before merge"
          fi
          if [[ "${{ needs.backend-tests.result }}" == "failure" ]]; then
            echo "⚠️ Backend tests failed - review before merge"
          fi
          if [[ "${{ needs.frontend-build.result }}" == "failure" ]]; then
            echo "⚠️ Frontend build failed - review before merge"
          fi
          if [[ "${{ needs.os-shell-build.result }}" == "failure" ]]; then
            echo "⚠️ OS Shell build failed - review before merge"
          fi
          echo "✅ Release validation complete"
