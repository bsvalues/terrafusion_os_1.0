# Autonomy Incident Publisher (Phase 4N9)
#
# Publishes evidence bundles to the 7-year incident retention channel.
# This workflow promotes merged PR evidence when the 'incident' label is applied.
#
# TRIGGER CONDITIONS (all must be true):
# - PR merged to main
# - PR has label 'incident'
# - Evidence bundle verifies strict
#
# EVENTS:
# - pull_request.closed (merged) - primary path
# - pull_request.labeled - secondary path (retroactive promotion)
#
# SECURITY POSTURE (Non-negotiable):
# - Same minimal permissions as 4N8
# - Strict verification BEFORE publish
# - Never modifies original monthly release
# - Never overwrites existing incident entry for same PR
#
# RETENTION:
# - Incident channel: autonomy-incident/YYYY
# - Retention: 7 years

name: Autonomy Incident Publisher

on:
  pull_request:
    types: [closed, labeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OUT_DIR: tools/registry/perf-skill-audit/out
  VIEWER_DIR: tools/registry/autonomy-viewer/dist
  INCIDENT_LABEL: incident

jobs:
  # ==========================================================================
  # Gate: Only proceed if PR merged AND has incident label
  # ==========================================================================
  gate:
    name: Incident Gate
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      run_id: ${{ steps.check.outputs.run_id }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_title: ${{ steps.check.outputs.pr_title }}
    steps:
      - name: Check incident conditions
        id: check
        run: |
          echo "🔒 Phase 4N9: Incident Publisher Gate Check"
          echo ""

          # Check if PR is merged
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "::notice::PR is not merged - skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if target is main
          if [[ "${{ github.base_ref }}" != "main" ]]; then
            echo "::notice::PR was not merged to main - skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for incident label
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          echo "PR Labels: $LABELS"

          if [[ ! "$LABELS" =~ (^|,)incident(,|$) ]]; then
            echo "::notice::PR does not have 'incident' label - skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Generate incident release tag (yearly format for 7-year retention)
          YEAR=$(date +%Y)
          RELEASE_TAG="autonomy-incident/${YEAR}"
          RUN_ID="${{ github.run_id }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "should_publish=true" >> $GITHUB_OUTPUT

          echo "✅ Incident gate passed"
          echo "   Release Tag: $RELEASE_TAG"
          echo "   PR: #$PR_NUMBER"
          echo "   Run ID: $RUN_ID"

  # ==========================================================================
  # Publish: Generate/verify evidence and publish to Incident Release
  # ==========================================================================
  publish:
    name: Publish to Incident Channel
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # Phase 4N16: Required for keyless OIDC signing

    # Phase 4N20: Signature identity pins (deterministic)
    env:
      TF_SIG_ISSUER: https://token.actions.githubusercontent.com
      TF_SIG_REPO: ${{ github.repository }}
      TF_SIG_REF: refs/heads/main
      TF_SIG_WORKFLOW: .github/workflows/autonomy-incident-publisher.yml
      TF_SIG_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/autonomy-incident-publisher.yml@refs/heads/main
      TF_SIG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C tools/registry/perf-skill-audit install

      # Phase 4N16: Install cosign for keyless signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      # ========================================================================
      # Step 1: Generate fresh evidence artifacts (deterministic)
      # ========================================================================
      - name: Generate performance plan
        run: |
          echo "📊 Generating performance plan..."
          npx tsx tools/registry/perf-skill-audit/src/index.ts || true

          if [ -f "${{ env.OUT_DIR }}/perf.plan.json" ]; then
            echo "✅ Performance plan generated"
          else
            echo "⚠️ No performance plan (may be empty run)"
          fi

      - name: Generate CIO Dashboard
        run: |
          echo "📊 Generating County CIO Dashboard..."
          mkdir -p ${{ env.VIEWER_DIR }}

          npx tsx tools/registry/autonomy-viewer/src/generate.ts \
            --artifacts=${{ env.OUT_DIR }} \
            --output=${{ env.VIEWER_DIR }} \
            --emit-json \
            --verbose || echo "::warning::Dashboard generation failed (non-fatal)"

      - name: Generate Evidence Bundle (Incident)
        id: bundle
        run: |
          echo "📦 Generating Evidence Bundle (Incident)..."
          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"
          BUNDLE_NAME="autonomy-incident-pr${PR_NUMBER}-${RUN_ID}"

          npx tsx tools/registry/autonomy-viewer/src/bundle.ts \
            --in ${{ env.OUT_DIR }} \
            --in ${{ env.VIEWER_DIR }} \
            --out ${{ env.VIEWER_DIR }} \
            --name "$BUNDLE_NAME" \
            --run-id "$RUN_ID" \
            --emit-manifest \
            --verbose

          # Capture manifest SHA256
          if [ -f "${{ env.VIEWER_DIR }}/MANIFEST.json" ]; then
            MANIFEST_SHA=$(sha256sum ${{ env.VIEWER_DIR }}/MANIFEST.json | cut -d' ' -f1)
            echo "manifest_sha=$MANIFEST_SHA" >> $GITHUB_OUTPUT
            echo "bundle_name=${BUNDLE_NAME}.zip" >> $GITHUB_OUTPUT
            echo "bundle_path=${{ env.VIEWER_DIR }}/${BUNDLE_NAME}.zip" >> $GITHUB_OUTPUT
            echo "✅ Incident bundle generated: ${BUNDLE_NAME}.zip"
          else
            echo "::error::MANIFEST.json not found"
            exit 1
          fi

      # ========================================================================
      # Step 2: Verify bundle (STRICT - non-negotiable before publish)
      # ========================================================================
      - name: Verify Evidence Bundle (strict)
        id: verify
        run: |
          echo "🔐 Verifying Incident Evidence Bundle (strict mode)..."
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-bundle.ts \
            --zip "$BUNDLE_PATH" \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "verify_ok=true" >> $GITHUB_OUTPUT
            echo "✅ Bundle verification PASSED (strict)"
          else
            echo "verify_ok=false" >> $GITHUB_OUTPUT
            echo "::error::Bundle verification FAILED - cannot publish to incident channel"
            exit 1
          fi

      # ========================================================================
      # Step 2a: Phase 4N16 - Keyless Signatures for Incident Evidence
      # ========================================================================
      - name: Sign Incident Evidence Artifacts (Keyless)
        id: sign
        run: |
          echo "🔏 Phase 4N16: Signing incident evidence artifacts (keyless OIDC)..."
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"
          SIGN_DIR="${{ env.VIEWER_DIR }}/signatures"
          mkdir -p "$SIGN_DIR"

          # List of primary artifacts to sign
          ARTIFACTS_TO_SIGN=(
            "$BUNDLE_PATH"
            "${{ env.VIEWER_DIR }}/MANIFEST.json"
          )

          SIGNED_COUNT=0
          for ARTIFACT in "${ARTIFACTS_TO_SIGN[@]}"; do
            if [ -f "$ARTIFACT" ]; then
              BASENAME=$(basename "$ARTIFACT")
              echo "  Signing: $BASENAME"

              # Keyless signing with Sigstore/Fulcio
              cosign sign-blob "$ARTIFACT" \
                --yes \
                --bundle "${ARTIFACT}.bundle" \
                --output-signature "${ARTIFACT}.sig" \
                --output-certificate "${ARTIFACT}.crt"

              # Copy signature files to sign dir for later
              cp "${ARTIFACT}.bundle" "$SIGN_DIR/"
              cp "${ARTIFACT}.sig" "$SIGN_DIR/"
              cp "${ARTIFACT}.crt" "$SIGN_DIR/"

              SIGNED_COUNT=$((SIGNED_COUNT + 1))
              echo "  ✅ Signed: $BASENAME"
            else
              echo "  ⚠️ Skipping (not found): $ARTIFACT"
            fi
          done

          echo "signed_count=$SIGNED_COUNT" >> $GITHUB_OUTPUT
          echo "sign_dir=$SIGN_DIR" >> $GITHUB_OUTPUT
          echo "✅ Signed $SIGNED_COUNT incident artifacts with keyless OIDC"

      - name: Generate Evidence Index (Incident)
        run: |
          echo "📋 Generating Evidence Index (Incident tier)..."

          # Phase 4N20: Include SHA for identity pinning
          npx tsx tools/registry/autonomy-viewer/src/evidence-index.ts \
            --out ${{ env.VIEWER_DIR }}/autonomy-evidence-index.json \
            --artifacts ${{ env.OUT_DIR }} \
            --bundle "${{ steps.bundle.outputs.bundle_name }}" \
            --manifest-sha "${{ steps.bundle.outputs.manifest_sha }}" \
            --verify-ok \
            --verify-strict \
            --run-id "${{ needs.gate.outputs.run_id }}" \
            --workflow "autonomy-incident-publisher" \
            --repo "${{ github.repository }}" \
            --ref "refs/heads/main" \
            --sha "${{ github.sha }}" \
            --incident \
            --incident-pr "${{ needs.gate.outputs.pr_number }}" \
            --retention-tier "incident" \
            --release-tag "${{ needs.gate.outputs.release_tag }}" \
            --verbose

      - name: Generate Incident Evidence Ledger
        run: |
          echo "📋 Generating Incident Evidence Ledger..."

          npx tsx tools/registry/autonomy-viewer/src/evidence-ledger-viewer.ts \
            --in ${{ env.VIEWER_DIR }} \
            --out ${{ env.VIEWER_DIR }}/autonomy-incident-ledger.html \
            --title "TerraFusion Incident Ledger - ${{ needs.gate.outputs.release_tag }}" \
            --verbose

      - name: Generate Chain of Custody (Incident)
        run: |
          echo "🔗 Generating Chain of Custody (Incident)..."

          # Create minimal apply-proofs for publisher context
          echo '[{"planItemId":"incident-pr${{ needs.gate.outputs.pr_number }}","outcome":"noop","allowedSurfaceCheck":{"passed":true},"forbiddenPathCheck":{"passed":true}}]' > ${{ env.OUT_DIR }}/apply-proofs.json

          npx tsx tools/registry/autonomy-viewer/src/custody-cli.ts \
            --proof ${{ env.OUT_DIR }}/apply-proofs.json \
            --plan ${{ env.OUT_DIR }}/perf.plan.json \
            --evidence-index ${{ env.VIEWER_DIR }}/autonomy-evidence-index.json \
            --out ${{ env.VIEWER_DIR }}/autonomy-custody.html \
            --emit-json \
            --verbose || echo "::warning::Chain of custody generation failed (non-fatal)"

      # ========================================================================
      # Step 2b: Generate and Verify Custody Attestation (Phase 4N13/4N14)
      # ========================================================================
      - name: Generate Custody Attestation (Incident)
        run: |
          echo "🔐 Generating Custody Attestation (Incident)..."

          npx tsx tools/registry/autonomy-viewer/src/custody-attest.ts \
            --in ${{ env.VIEWER_DIR }} \
            --out ${{ env.VIEWER_DIR }}/custody-attestation.json \
            --verbose

          echo "✅ Custody attestation generated"

      - name: Verify Custody Attestation (strict)
        run: |
          echo "🔒 Verifying Custody Attestation (strict mode)..."

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-custody.ts \
            --in ${{ env.VIEWER_DIR }} \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "✅ Custody attestation verification PASSED (strict)"
          else
            echo "::error::Custody attestation verification FAILED - cannot publish to incident channel"
            exit 1
          fi

      # ========================================================================
      # Step 2c: Phase 4N20 - Strict Pin Verification (Pre-Publish Gate)
      # ========================================================================
      - name: Verify Signature Pins (Phase 4N20)
        run: |
          echo "🔏 Phase 4N20: Verifying signature pins (strict mode - incident tier)..."

          # Display expected pins
          echo "📌 Expected pins:"
          echo "   Issuer: $TF_SIG_ISSUER"
          echo "   Repo: $TF_SIG_REPO"
          echo "   Ref: $TF_SIG_REF"
          echo "   Workflow: $TF_SIG_WORKFLOW"
          echo "   Identity: $TF_SIG_IDENTITY"
          echo "   SHA: $TF_SIG_SHA (required for incident tier)"

          # Verify bundle with policy from evidence index
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"
          INDEX_PATH="${{ env.VIEWER_DIR }}/autonomy-evidence-index.json"

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-bundle.ts \
            --zip "$BUNDLE_PATH" \
            --verify-signatures \
            --policy-from-index "$INDEX_PATH" \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "✅ Phase 4N20: Pin verification PASSED (incident tier)"
          else
            echo "::error::Phase 4N20: Pin verification FAILED - cannot publish to incident channel"
            echo "::error::Signature identity does not match expected pins (7-year retention requires strict verification)"
            exit 1
          fi

      # ========================================================================
      # Step 3: Publish to Incident Release Channel
      # ========================================================================
      - name: Prepare incident release assets
        id: assets
        run: |
          echo "📦 Preparing incident release assets (Phase 4N14/4N16: Canonical naming + signatures)..."
          ASSETS_DIR="${{ env.VIEWER_DIR }}/incident-assets"
          mkdir -p "$ASSETS_DIR"

          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"

          # Phase 4N14: Use canonical asset names for immutable URL generation
          # Incident bundles use pr-prefixed names for traceability
          BUNDLE_NAME="autonomy-incident-bundle-pr${PR_NUMBER}-${RUN_ID}.zip"
          MANIFEST_NAME="autonomy-incident-manifest-pr${PR_NUMBER}-${RUN_ID}.json"

          cp "${{ steps.bundle.outputs.bundle_path }}" "$ASSETS_DIR/${BUNDLE_NAME}"
          cp "${{ env.VIEWER_DIR }}/MANIFEST.json" "$ASSETS_DIR/${MANIFEST_NAME}"
          cp "${{ env.VIEWER_DIR }}/autonomy-evidence-index.json" "$ASSETS_DIR/autonomy-incident-index-pr${PR_NUMBER}.json"
          cp "${{ env.VIEWER_DIR }}/autonomy-dashboard.html" "$ASSETS_DIR/autonomy-incident-dashboard-pr${PR_NUMBER}.html" || true
          cp "${{ env.VIEWER_DIR }}/autonomy-incident-ledger.html" "$ASSETS_DIR/" || true
          cp "${{ env.VIEWER_DIR }}/autonomy-custody.html" "$ASSETS_DIR/autonomy-incident-custody-pr${PR_NUMBER}.html" || true
          cp "${{ env.VIEWER_DIR }}/custody-attestation.json" "$ASSETS_DIR/custody-attestation-pr${PR_NUMBER}.json" || true

          # Phase 4N16: Copy signature files for primary artifacts
          echo "📎 Including signature files..."

          # Bundle signatures
          if [ -f "${{ steps.bundle.outputs.bundle_path }}.sig" ]; then
            cp "${{ steps.bundle.outputs.bundle_path }}.sig" "$ASSETS_DIR/${BUNDLE_NAME}.sig"
            cp "${{ steps.bundle.outputs.bundle_path }}.crt" "$ASSETS_DIR/${BUNDLE_NAME}.crt"
            cp "${{ steps.bundle.outputs.bundle_path }}.bundle" "$ASSETS_DIR/${BUNDLE_NAME}.bundle"
            echo "  ✅ ${BUNDLE_NAME} signature files"
          fi

          # Manifest signatures
          if [ -f "${{ env.VIEWER_DIR }}/MANIFEST.json.sig" ]; then
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.sig" "$ASSETS_DIR/${MANIFEST_NAME}.sig"
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.crt" "$ASSETS_DIR/${MANIFEST_NAME}.crt"
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.bundle" "$ASSETS_DIR/${MANIFEST_NAME}.bundle"
            echo "  ✅ ${MANIFEST_NAME} signature files"
          fi

          echo "assets_dir=$ASSETS_DIR" >> $GITHUB_OUTPUT

          echo "✅ Incident release assets prepared (canonical naming + signatures):"
          ls -la "$ASSETS_DIR/"

      # ========================================================================
      # Step 3a: Phase 4N17 - Verify Signature Triplet Parity
      # ========================================================================
      - name: Verify Signature Triplet Parity (Phase 4N17)
        id: triplet
        run: |
          echo "🔏 Phase 4N17: Verifying signature triplet parity (incident)..."
          ASSETS_DIR="${{ steps.assets.outputs.assets_dir }}"

          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"
          BUNDLE_NAME="autonomy-incident-bundle-pr${PR_NUMBER}-${RUN_ID}.zip"
          MANIFEST_NAME="autonomy-incident-manifest-pr${PR_NUMBER}-${RUN_ID}.json"

          # Primary signed assets - MUST have complete triplet
          PRIMARY_SIGNED=(
            "$BUNDLE_NAME"
            "$MANIFEST_NAME"
          )

          TRIPLET_OK=true
          MISSING_TRIPLETS=()

          for ASSET in "${PRIMARY_SIGNED[@]}"; do
            SIG_FILE="${ASSET}.sig"
            CRT_FILE="${ASSET}.crt"
            BUNDLE_FILE="${ASSET}.bundle"

            MISSING=()
            if [ ! -f "$ASSETS_DIR/$SIG_FILE" ]; then MISSING+=("$SIG_FILE"); fi
            if [ ! -f "$ASSETS_DIR/$CRT_FILE" ]; then MISSING+=("$CRT_FILE"); fi
            if [ ! -f "$ASSETS_DIR/$BUNDLE_FILE" ]; then MISSING+=("$BUNDLE_FILE"); fi

            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "  ❌ $ASSET: Missing ${MISSING[*]}"
              TRIPLET_OK=false
              MISSING_TRIPLETS+=("$ASSET")
            else
              echo "  ✅ $ASSET: Complete triplet (.sig, .crt, .bundle)"
            fi
          done

          if [ "$TRIPLET_OK" = false ]; then
            echo ""
            echo "::error::Phase 4N17 FAILED: Signature triplet parity check failed (incident)"
            echo "::error::Missing triplets for: ${MISSING_TRIPLETS[*]}"
            echo "::error::All primary signed assets must have .sig, .crt, and .bundle files"
            exit 1
          fi

          echo ""
          echo "triplet_verified=true" >> $GITHUB_OUTPUT
          echo "✅ Phase 4N17: All signature triplets verified (incident channel)"

      - name: Create or Update Incident Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          name: 'Autonomy Incident Evidence Archive - ${{ needs.gate.outputs.release_tag }}'
          body: |
            ## 🚨 Autonomy Incident Evidence Archive (Phase 4N16)

            This release contains evidence bundles from autonomy PRs marked as **incident**.
            All bundles are **cryptographically signed** for courtroom-grade integrity.

            **Retention Tier:** 7 years (incident)
            **Policy:** autonomy-evidence-retention.v1
            **Signing:** Keyless OIDC (Sigstore/Fulcio)

            ---

            ### Incident: PR #${{ needs.gate.outputs.pr_number }}

            **Title:** ${{ needs.gate.outputs.pr_title }}

            | Field | Value |
            |-------|-------|
            | **Bundle** | `${{ steps.bundle.outputs.bundle_name }}` |
            | **Manifest SHA256** | `${{ steps.bundle.outputs.manifest_sha }}` |
            | **Verification** | ✅ Passed (strict) |
            | **Keyless Signature** | ✅ Signed (Phase 4N16) |
            | **PR** | #${{ needs.gate.outputs.pr_number }} |
            | **Merged By** | @${{ github.event.pull_request.merged_by.login }} |
            | **Merged At** | ${{ github.event.pull_request.merged_at }} |
            | **Incident Label Applied** | ${{ github.event.action == 'labeled' && 'After merge (retroactive)' || 'Before merge' }} |

            ---

            ### Verify Offline

            ```bash
            # Verify bundle integrity (hash-based)
            pnpm perf:verify-bundle --zip ${{ steps.bundle.outputs.bundle_name }}

            # Verify cryptographic signature (Phase 4N16)
            pnpm perf:verify-signature \
              --artifact ${{ steps.bundle.outputs.bundle_name }} \
              --bundle ${{ steps.bundle.outputs.bundle_name }}.bundle \
              --identity "https://github.com/${{ github.repository }}/.github/workflows/autonomy-incident-publisher.yml@refs/heads/main"
            ```

            ### Rollback (if applicable)

            ```bash
            pnpm perf:rollback --proof <proof-id> --dry-run  # preview
            pnpm perf:rollback --proof <proof-id>            # execute
            ```

            ---

            ### Retention Statement

            **This evidence bundle is retained for 7 years** in accordance with 
            FISMA compliance requirements and county incident retention policies.

            Do NOT delete without explicit legal/compliance authorization.

            ---

            *TerraFusion Autonomy v1 — Government. Transcended.*
          draft: false
          prerelease: false
          files: |
            ${{ steps.assets.outputs.assets_dir }}/*
          make_latest: false

      # ========================================================================
      # Step 4: Phase 4N15 - Verify Asset Existence (Reality Check)
      # ========================================================================
      - name: Verify Incident Release Assets Exist (Phase 4N15)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Phase 4N15: Verifying incident release assets exist..."

          RELEASE_TAG="${{ needs.gate.outputs.release_tag }}"
          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"

          # Expected canonical asset names for incident channel
          EXPECTED_ASSETS=(
            "autonomy-incident-bundle-pr${PR_NUMBER}-${RUN_ID}.zip"
            "autonomy-incident-manifest-pr${PR_NUMBER}-${RUN_ID}.json"
            "autonomy-incident-index-pr${PR_NUMBER}.json"
            "autonomy-incident-dashboard-pr${PR_NUMBER}.html"
            "autonomy-incident-ledger.html"
            "autonomy-incident-custody-pr${PR_NUMBER}.html"
            "custody-attestation-pr${PR_NUMBER}.json"
          )

          # Get actual assets from release
          echo "Fetching assets for release: $RELEASE_TAG"
          ACTUAL_ASSETS=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' 2>/dev/null || echo "")

          if [ -z "$ACTUAL_ASSETS" ]; then
            echo "::error::Failed to retrieve release assets for $RELEASE_TAG"
            exit 1
          fi

          echo "Found assets:"
          echo "$ACTUAL_ASSETS"
          echo ""

          # Check each expected asset exists (some may be optional)
          MISSING=()
          OPTIONAL=("autonomy-incident-dashboard-pr${PR_NUMBER}.html" "autonomy-incident-ledger.html" "autonomy-incident-custody-pr${PR_NUMBER}.html")

          for ASSET in "${EXPECTED_ASSETS[@]}"; do
            if echo "$ACTUAL_ASSETS" | grep -q "^${ASSET}$"; then
              echo "  ✅ $ASSET"
            else
              # Check if optional
              IS_OPTIONAL=false
              for OPT in "${OPTIONAL[@]}"; do
                if [ "$ASSET" = "$OPT" ]; then
                  IS_OPTIONAL=true
                  break
                fi
              done

              if [ "$IS_OPTIONAL" = true ]; then
                echo "  ⚠️ $ASSET (optional, not present)"
              else
                echo "  ❌ $ASSET (MISSING - required)"
                MISSING+=("$ASSET")
              fi
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::Phase 4N15 FAILED: Missing ${#MISSING[@]} required assets"
            echo "Missing: ${MISSING[*]}"
            exit 1
          fi

          echo ""
          echo "✅ Phase 4N15: All required incident assets verified"

      - name: Incident Publish Summary
        run: |
          PR_NUMBER="${{ needs.gate.outputs.pr_number }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"
          echo "## 🚨 Incident Evidence Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${{ needs.gate.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Tier:** 7 years (incident)" >> $GITHUB_STEP_SUMMARY
          echo "**Keyless Signature:** ✅ Signed (${{ steps.sign.outputs.signed_count }} artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PR Details" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
