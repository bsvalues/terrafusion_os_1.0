name: TerraForge Suite CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'applications/terraforge-suite/**'
      - '.github/workflows/terraforge-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'applications/terraforge-suite/**'
      - '.github/workflows/terraforge-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: applications/terraforge-suite/harness

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: applications/terraforge-suite/harness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript lint check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: applications/terraforge-suite/harness/coverage
          retention-days: 7

  golden-workflow-stub:
    name: Golden Workflow (Stub Mode)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: applications/terraforge-suite/harness/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Golden Workflow (Stub)
        run: npm run golden:stub
        env:
          TEST_MODE: stub

      - name: Verify determinism
        run: |
          echo "✅ Golden Workflow Stub Mode: All Systems GREEN"

