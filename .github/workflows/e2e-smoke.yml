name: E2E Smoke - TerraFusion cOS

on:
  workflow_dispatch:

  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: |
            terrafusion-cos/frontend_engine/pnpm-lock.yaml
            terrafusion-cos/e2e/pnpm-lock.yaml

      - name: Install frontend deps
        if: ${{ hashFiles('terrafusion-cos/ui/index.html') == '' }}
        working-directory: terrafusion-cos/frontend_engine
        run: |
          pnpm install --frozen-lockfile --ignore-workspace

      - name: Build frontend
        if: ${{ hashFiles('terrafusion-cos/ui/index.html') == '' }}
        working-directory: terrafusion-cos/frontend_engine
        run: |
          pnpm run build

      - name: Install E2E deps
        working-directory: terrafusion-cos/e2e
        run: |
          pnpm install --frozen-lockfile --ignore-workspace

      - name: Install Playwright browsers
        working-directory: terrafusion-cos/e2e
        run: |
          pnpm exec playwright install --with-deps

      - name: Run smoke test
        working-directory: terrafusion-cos/e2e
        run: |
          pnpm exec playwright test smoke.spec.js --config=playwright.config.js --project=chromium
        env:
          CI: true

      - name: Upload artifacts (screenshot + logs)
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: |
            terrafusion-cos/logs/artifacts/renderer-screenshot.png
            terrafusion-cos/logs/electron-main.log
