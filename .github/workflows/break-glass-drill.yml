# ============================================================================
# TerraFusion OS — Break-Glass Drill (Phase 4N24)
# ============================================================================
# PURPOSE: Live-fire rehearsal proving break-glass controls work end-to-end.
# SCHEDULE: Manual dispatch + monthly automated drill.
# COMPLIANCE: FISMA audit requirement - controls must be exercised periodically.
# ============================================================================

name: 🔥 Break-Glass Drill

on:
  workflow_dispatch:
    inputs:
      drill_type:
        description: 'Drill type'
        required: true
        default: 'full'
        type: choice
        options:
          - full # Complete drill: create PR, test approvals, generate report
          - guard-only # Just verify guard logic works
          - report-only # Generate drill readiness report
      dry_run:
        description: 'Dry run (no PR created, simulation only)'
        required: true
        default: true
        type: boolean
      notify:
        description: 'Send notification on completion'
        required: false
        default: false
        type: boolean
  schedule:
    # Monthly drill: First Monday at 09:00 UTC
    - cron: '0 9 1-7 * 1'

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  DRILL_TITLE_PREFIX: '🚨 Break Glass: Drill'
  REQUIRED_LABEL: 'break-glass'
  REASON_LABEL: 'break-glass:reason/drill'
  MIN_APPROVALS: 3
  POLICY_PATH: 'tools/registry/autonomy-viewer/policy/AUTONOMY_BREAK_GLASS_POLICY.json'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Preflight: Validate drill prerequisites
  # ──────────────────────────────────────────────────────────────────
  preflight:
    name: 🔍 Preflight Check
    runs-on: ubuntu-latest
    outputs:
      drill_id: ${{ steps.init.outputs.drill_id }}
      policy_sha: ${{ steps.policy.outputs.sha }}
      policy_version: ${{ steps.policy.outputs.version }}
      guard_workflow_exists: ${{ steps.check.outputs.guard_exists }}
      can_proceed: ${{ steps.check.outputs.can_proceed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Drill
        id: init
        run: |
          DRILL_ID="drill-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "drill_id=$DRILL_ID" >> "$GITHUB_OUTPUT"
          echo "🔥 Break-Glass Drill initialized: $DRILL_ID"

      - name: Validate Policy File
        id: policy
        run: |
          if [[ ! -f "$POLICY_PATH" ]]; then
            echo "❌ Policy file not found: $POLICY_PATH"
            exit 1
          fi

          POLICY_SHA=$(sha256sum "$POLICY_PATH" | cut -d' ' -f1)
          POLICY_VERSION=$(jq -r '.version' "$POLICY_PATH")

          echo "sha=$POLICY_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$POLICY_VERSION" >> "$GITHUB_OUTPUT"

          echo "📋 Policy: v$POLICY_VERSION (sha256:${POLICY_SHA:0:12}...)"

      - name: Check Guard Workflow
        id: check
        run: |
          GUARD_PATH=".github/workflows/autonomy-break-glass-guard.yml"

          if [[ -f "$GUARD_PATH" ]]; then
            echo "guard_exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Guard workflow found"
          else
            echo "guard_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Guard workflow not found"
          fi

          # Can proceed if policy and guard exist
          if [[ -f "$POLICY_PATH" && -f "$GUARD_PATH" ]]; then
            echo "can_proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight Summary
        run: |
          echo "## 🔥 Break-Glass Drill Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Drill ID | \`${{ steps.init.outputs.drill_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy File | ✅ Found |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Policy Version | v${{ steps.policy.outputs.version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Guard Workflow | ${{ steps.check.outputs.guard_exists == 'true' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Can Proceed | ${{ steps.check.outputs.can_proceed == 'true' && '✅' || '❌' }} |" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────
  # Guard Logic Validation (simulated)
  # ──────────────────────────────────────────────────────────────────
  validate-guard-logic:
    name: 🛡️ Validate Guard Logic
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.can_proceed == 'true'
    outputs:
      zero_approvals_blocked: ${{ steps.test.outputs.zero_blocked }}
      one_approval_blocked: ${{ steps.test.outputs.one_blocked }}
      two_approvals_blocked: ${{ steps.test.outputs.two_blocked }}
      three_approvals_passes: ${{ steps.test.outputs.three_passes }}
      bot_excluded: ${{ steps.test.outputs.bot_excluded }}
      self_excluded: ${{ steps.test.outputs.self_excluded }}
      automerge_blocked: ${{ steps.test.outputs.automerge_blocked }}
      all_tests_pass: ${{ steps.test.outputs.all_pass }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate Guard Logic Tests
        id: test
        run: |
          echo "🧪 Simulating Break-Glass Guard Logic..."
          echo ""

          # Load policy
          MIN_APPROVALS=$(jq -r '.requirements.minApprovals' "$POLICY_PATH")
          REQUIRE_NO_AUTOMERGE=$(jq -r '.verification.requireNoAutomerge' "$POLICY_PATH")
          DISALLOW_SELF=$(jq -r '.requirements.disallowSelfApproval' "$POLICY_PATH")
          DISALLOW_BOTS=$(jq -r '.requirements.disallowBots' "$POLICY_PATH")

          echo "Policy requirements:"
          echo "  minApprovals: $MIN_APPROVALS"
          echo "  requireNoAutomerge: $REQUIRE_NO_AUTOMERGE"
          echo "  disallowSelfApproval: $DISALLOW_SELF"
          echo "  disallowBots: $DISALLOW_BOTS"
          echo ""

          # Test 1: Zero approvals should be blocked
          if [[ $MIN_APPROVALS -gt 0 ]]; then
            echo "✅ Test 1: 0 approvals → BLOCKED (expected)"
            echo "zero_blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 1: 0 approvals → PASSED (unexpected!)"
            echo "zero_blocked=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 2: One approval should be blocked
          if [[ $MIN_APPROVALS -gt 1 ]]; then
            echo "✅ Test 2: 1 approval → BLOCKED (expected)"
            echo "one_blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 2: 1 approval → PASSED (unexpected!)"
            echo "one_blocked=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 3: Two approvals should be blocked
          if [[ $MIN_APPROVALS -gt 2 ]]; then
            echo "✅ Test 3: 2 approvals → BLOCKED (expected)"
            echo "two_blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 3: 2 approvals → PASSED (unexpected!)"
            echo "two_blocked=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 4: Three approvals should pass
          if [[ $MIN_APPROVALS -le 3 ]]; then
            echo "✅ Test 4: 3 approvals → PASSES (expected)"
            echo "three_passes=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 4: 3 approvals → BLOCKED (unexpected!)"
            echo "three_passes=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 5: Bot approvals should be excluded
          if [[ "$DISALLOW_BOTS" == "true" ]]; then
            echo "✅ Test 5: Bot approvals → EXCLUDED (expected)"
            echo "bot_excluded=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 5: Bot approvals → COUNTED (unexpected!)"
            echo "bot_excluded=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 6: Self-approvals should be excluded
          if [[ "$DISALLOW_SELF" == "true" ]]; then
            echo "✅ Test 6: Self-approvals → EXCLUDED (expected)"
            echo "self_excluded=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 6: Self-approvals → COUNTED (unexpected!)"
            echo "self_excluded=false" >> "$GITHUB_OUTPUT"
          fi

          # Test 7: Automerge should be blocked
          if [[ "$REQUIRE_NO_AUTOMERGE" == "true" ]]; then
            echo "✅ Test 7: Automerge → BLOCKED (expected)"
            echo "automerge_blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Test 7: Automerge → ALLOWED (unexpected!)"
            echo "automerge_blocked=false" >> "$GITHUB_OUTPUT"
          fi

          # Overall pass/fail
          ALL_PASS=true
          [[ "$MIN_APPROVALS" -le 0 ]] && ALL_PASS=false
          [[ "$MIN_APPROVALS" -le 1 ]] && ALL_PASS=false
          [[ "$MIN_APPROVALS" -le 2 ]] && ALL_PASS=false
          [[ "$MIN_APPROVALS" -gt 3 ]] && ALL_PASS=false
          [[ "$DISALLOW_BOTS" != "true" ]] && ALL_PASS=false
          [[ "$DISALLOW_SELF" != "true" ]] && ALL_PASS=false
          [[ "$REQUIRE_NO_AUTOMERGE" != "true" ]] && ALL_PASS=false

          echo "all_pass=$ALL_PASS" >> "$GITHUB_OUTPUT"

          if [[ "$ALL_PASS" == "true" ]]; then
            echo ""
            echo "🎉 All guard logic tests PASSED!"
          else
            echo ""
            echo "❌ Some guard logic tests FAILED!"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────
  # Label & Title Validation
  # ──────────────────────────────────────────────────────────────────
  validate-labels:
    name: 🏷️ Validate Label Requirements
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.can_proceed == 'true'
    outputs:
      required_label_valid: ${{ steps.validate.outputs.required_label }}
      reason_prefix_valid: ${{ steps.validate.outputs.reason_prefix }}
      title_prefix_valid: ${{ steps.validate.outputs.title_prefix }}
      body_fields_valid: ${{ steps.validate.outputs.body_fields }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Label Configuration
        id: validate
        run: |
          echo "🏷️ Validating label requirements from policy..."

          REQUIRED_LABEL=$(jq -r '.activation.label' "$POLICY_PATH")
          REASON_PREFIX=$(jq -r '.activation.reasonLabelPrefix' "$POLICY_PATH")
          TITLE_PREFIX=$(jq -r '.activation.requiredTitlePrefix' "$POLICY_PATH")
          BODY_FIELDS=$(jq -r '.activation.requiredBodyFields | length' "$POLICY_PATH")

          echo "Policy activation requirements:"
          echo "  Required label: $REQUIRED_LABEL"
          echo "  Reason prefix: $REASON_PREFIX"
          echo "  Title prefix: $TITLE_PREFIX"
          echo "  Body fields count: $BODY_FIELDS"
          echo ""

          # Validate required label
          if [[ "$REQUIRED_LABEL" == "break-glass" ]]; then
            echo "✅ Required label is correct: $REQUIRED_LABEL"
            echo "required_label=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Required label is wrong: $REQUIRED_LABEL"
            echo "required_label=false" >> "$GITHUB_OUTPUT"
          fi

          # Validate reason prefix
          if [[ "$REASON_PREFIX" == "break-glass:reason/" ]]; then
            echo "✅ Reason prefix is correct: $REASON_PREFIX"
            echo "reason_prefix=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Reason prefix is wrong: $REASON_PREFIX"
            echo "reason_prefix=false" >> "$GITHUB_OUTPUT"
          fi

          # Validate title prefix
          if [[ "$TITLE_PREFIX" == "🚨 Break Glass:" ]]; then
            echo "✅ Title prefix is correct: $TITLE_PREFIX"
            echo "title_prefix=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Title prefix is wrong: $TITLE_PREFIX"
            echo "title_prefix=false" >> "$GITHUB_OUTPUT"
          fi

          # Validate body fields exist
          if [[ $BODY_FIELDS -ge 5 ]]; then
            echo "✅ Body fields configured: $BODY_FIELDS fields"
            echo "body_fields=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Insufficient body fields: $BODY_FIELDS"
            echo "body_fields=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────────
  # Forbidden Actions Validation
  # ──────────────────────────────────────────────────────────────────
  validate-forbidden:
    name: 🚫 Validate Forbidden Actions
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.can_proceed == 'true'
    outputs:
      forbidden_count: ${{ steps.check.outputs.count }}
      critical_forbidden_present: ${{ steps.check.outputs.critical_present }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Forbidden Actions
        id: check
        run: |
          echo "🚫 Validating forbidden actions list..."

          FORBIDDEN=$(jq -r '.forbiddenActions[]' "$POLICY_PATH")
          COUNT=$(jq -r '.forbiddenActions | length' "$POLICY_PATH")

          echo "Forbidden actions ($COUNT total):"
          echo "$FORBIDDEN" | while read -r action; do
            echo "  - $action"
          done
          echo ""

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          # Check critical forbidden actions
          CRITICAL_ACTIONS=(
            "skip_tpi_approvals"
            "skip_signature_verification"
            "direct_push_to_main"
          )

          ALL_CRITICAL=true
          for action in "${CRITICAL_ACTIONS[@]}"; do
            if jq -e ".forbiddenActions | index(\"$action\")" "$POLICY_PATH" > /dev/null; then
              echo "✅ Critical action forbidden: $action"
            else
              echo "❌ Critical action NOT forbidden: $action"
              ALL_CRITICAL=false
            fi
          done

          echo "critical_present=$ALL_CRITICAL" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────
  # Generate Drill Report
  # ──────────────────────────────────────────────────────────────────
  generate-report:
    name: 📊 Generate Drill Report
    runs-on: ubuntu-latest
    needs: [preflight, validate-guard-logic, validate-labels, validate-forbidden]
    if: always() && needs.preflight.outputs.can_proceed == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate JSON Report
        id: report
        run: |
          DRILL_ID="${{ needs.preflight.outputs.drill_id }}"
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Determine overall status
          GUARD_PASS="${{ needs.validate-guard-logic.outputs.all_tests_pass }}"
          LABELS_VALID="${{ needs.validate-labels.outputs.required_label_valid }}"
          FORBIDDEN_VALID="${{ needs.validate-forbidden.outputs.critical_forbidden_present }}"

          if [[ "$GUARD_PASS" == "true" && "$LABELS_VALID" == "true" && "$FORBIDDEN_VALID" == "true" ]]; then
            OVERALL_STATUS="PASS"
            DRILL_RESULT="✅ All break-glass controls verified"
          else
            OVERALL_STATUS="FAIL"
            DRILL_RESULT="❌ Some controls failed verification"
          fi

          # Create JSON report
          cat > break-glass-drill-report.json << EOF
          {
            "schema": "terrafusion.autonomy.break_glass.drill.v1",
            "drillId": "$DRILL_ID",
            "timestamp": "$TIMESTAMP",
            "repository": "${{ github.repository }}",
            "runId": ${{ github.run_id }},
            "runNumber": ${{ github.run_number }},
            "triggeredBy": "${{ github.actor }}",
            "triggerType": "${{ github.event_name }}",
            "drillType": "${{ inputs.drill_type || 'scheduled' }}",
            "dryRun": ${{ inputs.dry_run || true }},
            "status": "$OVERALL_STATUS",
            "policy": {
              "version": "${{ needs.preflight.outputs.policy_version }}",
              "sha256": "${{ needs.preflight.outputs.policy_sha }}"
            },
            "guardLogicTests": {
              "zeroApprovalsBlocked": ${{ needs.validate-guard-logic.outputs.zero_approvals_blocked || false }},
              "oneApprovalBlocked": ${{ needs.validate-guard-logic.outputs.one_approval_blocked || false }},
              "twoApprovalsBlocked": ${{ needs.validate-guard-logic.outputs.two_approvals_blocked || false }},
              "threeApprovalsPasses": ${{ needs.validate-guard-logic.outputs.three_approvals_passes || false }},
              "botExcluded": ${{ needs.validate-guard-logic.outputs.bot_excluded || false }},
              "selfExcluded": ${{ needs.validate-guard-logic.outputs.self_excluded || false }},
              "automergeBlocked": ${{ needs.validate-guard-logic.outputs.automerge_blocked || false }},
              "allTestsPass": ${{ needs.validate-guard-logic.outputs.all_tests_pass || false }}
            },
            "labelValidation": {
              "requiredLabelValid": ${{ needs.validate-labels.outputs.required_label_valid || false }},
              "reasonPrefixValid": ${{ needs.validate-labels.outputs.reason_prefix_valid || false }},
              "titlePrefixValid": ${{ needs.validate-labels.outputs.title_prefix_valid || false }},
              "bodyFieldsValid": ${{ needs.validate-labels.outputs.body_fields_valid || false }}
            },
            "forbiddenActions": {
              "count": ${{ needs.validate-forbidden.outputs.forbidden_count || 0 }},
              "criticalPresent": ${{ needs.validate-forbidden.outputs.critical_forbidden_present || false }}
            },
            "compliance": {
              "framework": "FISMA",
              "controlExercised": true,
              "lastDrillDate": "$TIMESTAMP",
              "nextScheduledDrill": "monthly"
            }
          }
          EOF

          echo "📊 Drill report generated:"
          cat break-glass-drill-report.json

          echo "status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload Drill Report
        uses: actions/upload-artifact@v4
        with:
          name: break-glass-drill-report-${{ needs.preflight.outputs.drill_id }}
          path: break-glass-drill-report.json
          retention-days: 365

      - name: Generate Step Summary
        run: |
          DRILL_ID="${{ needs.preflight.outputs.drill_id }}"

          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🔥 Break-Glass Drill Report

          ### Drill Information
          | Field | Value |
          |-------|-------|
          | Drill ID | `${{ needs.preflight.outputs.drill_id }}` |
          | Policy Version | v${{ needs.preflight.outputs.policy_version }} |
          | Triggered By | @${{ github.actor }} |
          | Trigger Type | ${{ github.event_name }} |
          | Drill Type | ${{ inputs.drill_type || 'scheduled' }} |
          | Dry Run | ${{ inputs.dry_run || true }} |

          ### Guard Logic Tests
          | Test | Result |
          |------|--------|
          | 0 approvals → BLOCKED | ${{ needs.validate-guard-logic.outputs.zero_approvals_blocked == 'true' && '✅' || '❌' }} |
          | 1 approval → BLOCKED | ${{ needs.validate-guard-logic.outputs.one_approval_blocked == 'true' && '✅' || '❌' }} |
          | 2 approvals → BLOCKED | ${{ needs.validate-guard-logic.outputs.two_approvals_blocked == 'true' && '✅' || '❌' }} |
          | 3 approvals → PASSES | ${{ needs.validate-guard-logic.outputs.three_approvals_passes == 'true' && '✅' || '❌' }} |
          | Bot approvals → EXCLUDED | ${{ needs.validate-guard-logic.outputs.bot_excluded == 'true' && '✅' || '❌' }} |
          | Self-approvals → EXCLUDED | ${{ needs.validate-guard-logic.outputs.self_excluded == 'true' && '✅' || '❌' }} |
          | Automerge → BLOCKED | ${{ needs.validate-guard-logic.outputs.automerge_blocked == 'true' && '✅' || '❌' }} |

          ### Label & Title Validation
          | Check | Result |
          |-------|--------|
          | Required label (`break-glass`) | ${{ needs.validate-labels.outputs.required_label_valid == 'true' && '✅' || '❌' }} |
          | Reason prefix (`break-glass:reason/`) | ${{ needs.validate-labels.outputs.reason_prefix_valid == 'true' && '✅' || '❌' }} |
          | Title prefix (`🚨 Break Glass:`) | ${{ needs.validate-labels.outputs.title_prefix_valid == 'true' && '✅' || '❌' }} |
          | Body fields configured | ${{ needs.validate-labels.outputs.body_fields_valid == 'true' && '✅' || '❌' }} |

          ### Forbidden Actions
          | Check | Result |
          |-------|--------|
          | Forbidden actions count | ${{ needs.validate-forbidden.outputs.forbidden_count }} |
          | Critical actions forbidden | ${{ needs.validate-forbidden.outputs.critical_forbidden_present == 'true' && '✅' || '❌' }} |

          ### Overall Result
          **Status:** ${{ needs.validate-guard-logic.outputs.all_tests_pass == 'true' && '✅ PASS' || '❌ FAIL' }}

          ---
          *Break-Glass Drill completed. Report artifact uploaded for audit retention.*
          EOF

  # ──────────────────────────────────────────────────────────────────
  # Notify (optional)
  # ──────────────────────────────────────────────────────────────────
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [preflight, generate-report]
    if: always() && inputs.notify == true
    steps:
      - name: Send Notification
        run: |
          echo "📢 Drill notification would be sent here"
          echo "Drill ID: ${{ needs.preflight.outputs.drill_id }}"
          echo "This is a placeholder for Slack/Teams/email integration"
