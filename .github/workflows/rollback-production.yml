name: rollback-production

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: Exact previously approved release SHA to restore
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: terrafusion-runtime-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back production to explicit approved SHA
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_ENV: production
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      APP_ROOT: ${{ vars.APP_ROOT }}
    steps:
      - name: Validate environment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Rollback must be dispatched from the protected main workflow definition"
            exit 1
          fi

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/${TARGET_ENV}}"
          PUBLIC_URL="${PUBLIC_URL%/}"

          for required in DEPLOY_HOST DEPLOY_USER PUBLIC_URL DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required environment configuration: ${required}"
              exit 1
            fi
          done

          PUBLIC_HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"
          DEPLOYED_AT="$(date -u +%FT%TZ)"
          ASPNETCORE_ENV_LABEL="Production"

          {
            printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT"
            printf 'APP_ROOT=%s\n' "$APP_ROOT"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST"
            printf 'DEPLOYED_AT=%s\n' "$DEPLOYED_AT"
            printf 'ASPNETCORE_ENV_LABEL=%s\n' "$ASPNETCORE_ENV_LABEL"
          } >> "$GITHUB_ENV"

      - name: Configure pinned SSH host trust
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          if ! ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null &&
             ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "Protected DEPLOY_SSH_KNOWN_HOSTS does not contain the deployment host"
            exit 1
          fi

          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Preflight - public DNS resolution
        shell: bash
        run: |
          set -euo pipefail
          nslookup "$PUBLIC_HOST"
          echo "DNS resolved OK"

      - name: Preflight - remote host access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SSH preflight attempt $attempt/3..."
            set +e
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "APP_ROOT='$APP_ROOT' bash -s" <<'SSH'
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version >/dev/null
          test -d "$APP_ROOT"
          test -f "$APP_ROOT/app.env"
          test -f "$APP_ROOT/runtime-compose.yml"
          test -f "$APP_ROOT/release.env"
          test -f "$APP_ROOT/current.sha"
          SSH
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "SSH preflight succeeded on attempt $attempt"
              exit 0
            fi
            echo "SSH attempt $attempt failed (exit $rc), waiting 15s..."
            sleep 15
          done
          echo "ERROR: SSH preflight failed after 3 attempts"
          exit 1

      - name: Validate explicit rollback target and immutable artifact
        id: shas
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/current.sha'")"
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          SNAPSHOT_ROOT="$APP_ROOT/releases/$ROLLBACK_SHA"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -f '$SNAPSHOT_ROOT/release.sha' && test -f '$SNAPSHOT_ROOT/artifact.env' && test -f '$SNAPSHOT_ROOT/runtime-compose.yml' && test -f '$SNAPSHOT_ROOT/Caddyfile' && test -f '$SNAPSHOT_ROOT/sovereign.yaml' && test -d '$SNAPSHOT_ROOT/docs/spec-lock' && test -d '$SNAPSHOT_ROOT/config'"
          SNAPSHOT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$SNAPSHOT_ROOT/release.sha'")"
          RELEASE_ENV_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sed -n 's/^TF_RELEASE_SHA=//p' '$SNAPSHOT_ROOT/artifact.env'")"
          BACKEND_IMAGE="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sed -n 's/^TF_BACKEND_IMAGE=//p' '$SNAPSHOT_ROOT/artifact.env'")"
          FRONTEND_IMAGE="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "sed -n 's/^TF_FRONTEND_IMAGE=//p' '$SNAPSHOT_ROOT/artifact.env'")"
          test "$SNAPSHOT_SHA" = "$ROLLBACK_SHA"
          test "$RELEASE_ENV_SHA" = "$ROLLBACK_SHA"
          [[ "$BACKEND_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]
          ! ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "grep -qE '^(TERRAFUSION_BOOTSTRAP_|.*PASSWORD|.*TOKEN|.*SECRET)' '$SNAPSHOT_ROOT/artifact.env'"
          ROLLBACK_NOOP=false
          if [ "$CURRENT_SHA" = "$ROLLBACK_SHA" ] && ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' SNAPSHOT_ROOT='$SNAPSHOT_ROOT' BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          cmp "$SNAPSHOT_ROOT/artifact.env" release.env
          for file in runtime-compose.yml Caddyfile sovereign.yaml; do
            cmp "$SNAPSHOT_ROOT/$file" "$file"
          done
          diff -qr "$SNAPSHOT_ROOT/docs/spec-lock" docs/spec-lock >/dev/null
          diff -qr "$SNAPSHOT_ROOT/config" config >/dev/null
          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null
          BACKEND_CONTAINER="$(docker compose -f runtime-compose.yml --env-file release.env ps -q backend)"
          FRONTEND_CONTAINER="$(docker compose -f runtime-compose.yml --env-file release.env ps -q frontend)"
          test -n "$BACKEND_CONTAINER"
          test -n "$FRONTEND_CONTAINER"
          test "$(docker inspect --format '{{.Config.Image}}' "$BACKEND_CONTAINER")" = "$BACKEND_IMAGE"
          test "$(docker inspect --format '{{.Config.Image}}' "$FRONTEND_CONTAINER")" = "$FRONTEND_IMAGE"
          SSH
          then
            ROLLBACK_NOOP=true
            ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "printf '%s\n' '$ROLLBACK_SHA' > '$APP_ROOT/requested.sha'"
          fi
          echo "ROLLBACK_NOOP=$ROLLBACK_NOOP" >> "$GITHUB_ENV"
          echo "ROLLBACK_RUN_TOKEN=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          {
            printf 'current_sha=%s\n' "$CURRENT_SHA"
            printf 'rollback_sha=%s\n' "$ROLLBACK_SHA"
            printf 'backend_image=%s\n' "$BACKEND_IMAGE"
            printf 'frontend_image=%s\n' "$FRONTEND_IMAGE"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'CURRENT_SHA=%s\n' "$CURRENT_SHA"
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
          } >> "$GITHUB_ENV"

      - name: Prove GHCR pull on VPS
        if: env.ROLLBACK_NOOP != 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null 2>&1
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" <<'SSH'
          set -euo pipefail
          echo "Pulling backend image..."
          docker pull "$BACKEND_IMAGE"
          echo "Pulling frontend image..."
          docker pull "$FRONTEND_IMAGE"
          SSH

      - name: Ensure governed edge proxy is running
        if: env.ROLLBACK_NOOP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'SSH'
          set -euo pipefail
          docker network inspect terrafusion-edge >/dev/null 2>&1 || docker network create terrafusion-edge
          if [ -f /opt/terrafusion/edge-proxy/docker-compose.yml ]; then
            cd /opt/terrafusion/edge-proxy && docker compose up -d
            docker compose exec -T edge caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null || true
          fi
          SSH

      - name: Restore exact artifact bundle transactionally
        id: rollback-runtime
        if: env.ROLLBACK_NOOP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' CURRENT_SHA='$CURRENT_SHA' ROLLBACK_SHA='$ROLLBACK_SHA' RUN_TOKEN='$ROLLBACK_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          SNAPSHOT_ROOT="$APP_ROOT/releases/$ROLLBACK_SHA"
          test "$(cat "$SNAPSHOT_ROOT/release.sha")" = "$ROLLBACK_SHA"
          test "$(sed -n 's/^TF_RELEASE_SHA=//p' "$SNAPSHOT_ROOT/artifact.env")" = "$ROLLBACK_SHA"
          BACKEND_IMAGE="$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$SNAPSHOT_ROOT/artifact.env")"
          FRONTEND_IMAGE="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$SNAPSHOT_ROOT/artifact.env")"
          [[ "$BACKEND_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]
          ! grep -qE '^(TERRAFUSION_BOOTSTRAP_|.*PASSWORD|.*TOKEN|.*SECRET)' "$SNAPSHOT_ROOT/artifact.env"

          INCOMING="$APP_ROOT/.rollback-incoming-$RUN_TOKEN"
          BACKUP="$APP_ROOT/.rollback-backup-$RUN_TOKEN"
          test ! -e "$INCOMING"
          test ! -e "$BACKUP"
          install -d -m 0700 "$INCOMING/docs/spec-lock" "$INCOMING/config" "$BACKUP"
          install -m 0600 "$SNAPSHOT_ROOT/artifact.env" "$INCOMING/release.env"
          for file in runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$SNAPSHOT_ROOT/$file" "$INCOMING/$file"
            install -m 0600 "$file" "$BACKUP/$file"
          done
          install -m 0600 release.env "$BACKUP/release.env"
          cp -a "$SNAPSHOT_ROOT/docs/spec-lock/." "$INCOMING/docs/spec-lock/"
          cp -a "$SNAPSHOT_ROOT/config/." "$INCOMING/config/"
          cp -a docs/spec-lock "$BACKUP/spec-lock"
          cp -a config "$BACKUP/config"
          ln -s "$APP_ROOT/app.env" "$INCOMING/app.env"
          docker compose -f "$INCOMING/runtime-compose.yml" --env-file "$INCOMING/release.env" config >/dev/null
          rm -f "$INCOMING/app.env"
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$BACKUP/$file"
          done
          test -d "$BACKUP/spec-lock"
          test -d "$BACKUP/config"
          if [ -f requested.sha ]; then
            install -m 0600 requested.sha "$BACKUP/requested.sha"
          else
            touch "$BACKUP/requested.absent"
          fi
          test -f "$BACKUP/requested.sha" || test -f "$BACKUP/requested.absent"
          touch "$BACKUP/backup.ready"

          restore_previous() {
            trap - ERR
            set +e
            failed=0
            rm -rf docs/spec-lock config || failed=1
            cp -a "$BACKUP/spec-lock" docs/spec-lock || failed=1
            cp -a "$BACKUP/config" config || failed=1
            for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
              install -m 0600 "$BACKUP/$file" "$file" || failed=1
            done
            if [ -f "$BACKUP/requested.sha" ]; then
              install -m 0600 "$BACKUP/requested.sha" requested.sha || failed=1
            elif [ -f "$BACKUP/requested.absent" ]; then
              rm -f requested.sha || failed=1
            else
              failed=1
            fi
            docker compose -f runtime-compose.yml --env-file release.env config >/dev/null || failed=1
            docker compose -f runtime-compose.yml --env-file release.env pull || failed=1
            docker compose -f runtime-compose.yml --env-file release.env up -d || failed=1
            if [ "$failed" -ne 0 ]; then
              echo "Automatic rollback restore failed; preserving $BACKUP for governed recovery" >&2
              exit 1
            fi
            rm -rf "$INCOMING" "$BACKUP"
            exit 1
          }
          trap restore_previous ERR

          rm -rf docs/spec-lock config
          mv "$INCOMING/docs/spec-lock" docs/spec-lock
          mv "$INCOMING/config" config
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$INCOMING/$file" "$file"
          done
          printf '%s\n' "$ROLLBACK_SHA" > requested.sha
          docker compose -f runtime-compose.yml --env-file release.env pull
          docker compose -f runtime-compose.yml --env-file release.env up -d
          trap - ERR
          SSH

      - name: Verify public health and release header
        shell: bash
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL}/health"
          success=0

          for attempt in $(seq 1 18); do
            if curl -fsS -o /dev/null -D curl_headers.txt "$URL" 2>/dev/null; then
              HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
              if [ "$HEADER_SHA" = "$ROLLBACK_SHA" ]; then
                success=1
                break
              fi
            fi

            echo "Waiting for $URL to report X-Release-Sha=$ROLLBACK_SHA (attempt $attempt/18)"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Rollback health endpoint never reported the rollback SHA."
            exit 1
          fi

          grep -iE '^HTTP/.* 200' curl_headers.txt

      - name: Finalize explicit idempotent rollback identity
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' CURRENT_SHA='$CURRENT_SHA' ROLLBACK_SHA='$ROLLBACK_SHA' ROLLBACK_RUN_TOKEN='$ROLLBACK_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          test "$(cat requested.sha)" = "$ROLLBACK_SHA"
          if [ "$CURRENT_SHA" != "$ROLLBACK_SHA" ]; then
            printf '%s\n' "$CURRENT_SHA" > last-rollback-from.sha
          fi
          printf '%s\n' "$ROLLBACK_SHA" > current.sha
          rm -rf "$APP_ROOT/.rollback-incoming-$ROLLBACK_RUN_TOKEN" "$APP_ROOT/.rollback-backup-$ROLLBACK_RUN_TOKEN"
          SSH

      - name: Restore pre-rollback runtime if rollback did not commit
        if: failure() && env.ROLLBACK_NOOP != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' CURRENT_SHA='$CURRENT_SHA' ROLLBACK_SHA='$ROLLBACK_SHA' RUN_TOKEN='$ROLLBACK_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          if [ -f current.sha ] && [ "$(cat current.sha)" = "$ROLLBACK_SHA" ]; then
            exit 0
          fi
          BACKUP="$APP_ROOT/.rollback-backup-$RUN_TOKEN"
          INCOMING="$APP_ROOT/.rollback-incoming-$RUN_TOKEN"
          if [ ! -e "$BACKUP" ]; then
            exit 0
          fi
          if [ ! -f "$BACKUP/backup.ready" ]; then
            echo "Incomplete rollback backup retained at $BACKUP; live state was not mutated" >&2
            exit 1
          fi
          set +e
          failed=0
          rm -rf docs/spec-lock config || failed=1
          cp -a "$BACKUP/spec-lock" docs/spec-lock || failed=1
          cp -a "$BACKUP/config" config || failed=1
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$BACKUP/$file" "$file" || failed=1
          done
          if [ -f "$BACKUP/requested.sha" ]; then
            install -m 0600 "$BACKUP/requested.sha" requested.sha || failed=1
          elif [ -f "$BACKUP/requested.absent" ]; then
            rm -f requested.sha || failed=1
          else
            failed=1
          fi
          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null || failed=1
          docker compose -f runtime-compose.yml --env-file release.env pull || failed=1
          docker compose -f runtime-compose.yml --env-file release.env up -d || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "Rollback recovery failed; preserving $BACKUP for governed recovery" >&2
            exit 1
          fi
          rm -rf "$INCOMING" "$BACKUP"
          SSH

      - name: Verify requested/current/header invariant
        shell: bash
        run: |
          set -euo pipefail
          HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
          REQUESTED_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/requested.sha'")"
          FINAL_CURRENT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/current.sha'")"

          test "$REQUESTED_SHA" = "$ROLLBACK_SHA"
          test "$FINAL_CURRENT_SHA" = "$ROLLBACK_SHA"
          test "$HEADER_SHA" = "$ROLLBACK_SHA"

          {
            printf 'REQUESTED_SHA=%s\n' "$REQUESTED_SHA"
            printf 'FINAL_CURRENT_SHA=%s\n' "$FINAL_CURRENT_SHA"
            printf 'HEADER_SHA=%s\n' "$HEADER_SHA"
          } >> "$GITHUB_ENV"

      - name: Collect rollback evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp curl_headers.txt evidence/curl_headers.txt

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env ps" > evidence/compose_ps.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "uptime" > evidence/uptime.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 backend" > evidence/logs_backend.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 proxy" > evidence/logs_proxy.txt

          cat > evidence/evidence.txt <<EOF
          operation=rollback
          target_env=${TARGET_ENV}
          aspnetcore_environment=${ASPNETCORE_ENV_LABEL}
          public_url=${PUBLIC_URL}
          rollback_sha=${ROLLBACK_SHA}
          pre_rollback_current_sha=${CURRENT_SHA}
          requested_sha=${REQUESTED_SHA}
          current_sha=${FINAL_CURRENT_SHA}
          header_sha=${HEADER_SHA}
          backend_image=${BACKEND_IMAGE}
          frontend_image=${FRONTEND_IMAGE}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          deployed_at_utc=${DEPLOYED_AT}
          EOF

          cat > evidence/evidence.json <<EOF
          {
            "operation": "rollback",
            "targetEnv": "${TARGET_ENV}",
            "aspnetcoreEnvironment": "${ASPNETCORE_ENV_LABEL}",
            "publicUrl": "${PUBLIC_URL}",
            "rollbackSha": "${ROLLBACK_SHA}",
            "preRollbackCurrentSha": "${CURRENT_SHA}",
            "requestedSha": "${REQUESTED_SHA}",
            "currentSha": "${FINAL_CURRENT_SHA}",
            "headerSha": "${HEADER_SHA}",
            "backendImage": "${BACKEND_IMAGE}",
            "frontendImage": "${FRONTEND_IMAGE}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "deployedAtUtc": "${DEPLOYED_AT}"
          }
          EOF

      - name: Validate evidence schema
        shell: bash
        run: |
          set -euo pipefail
          for required in evidence.json evidence.txt curl_headers.txt compose_ps.txt uptime.txt logs_backend.txt logs_proxy.txt; do
            test -s "evidence/$required"
          done

      - name: Upload rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: rollback-evidence-production-${{ steps.shas.outputs.rollback_sha }}
          path: evidence/
          if-no-files-found: error
