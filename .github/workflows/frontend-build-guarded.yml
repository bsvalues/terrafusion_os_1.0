name: Frontend Build Guarded

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/apps/os-shell/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-build-guarded.yml'
      # include docs so classifier can decide to skip quickly
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - 'frontend/apps/os-shell/**'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/frontend-build-guarded.yml'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: frontend-build-guarded-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_count: ${{ steps.classify.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify docs-only vs code changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Handle first push / empty before
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
          fi

          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          COUNT="${#CHANGED[@]}"
          echo "changed_count=$COUNT" >> "$GITHUB_OUTPUT"

          {
            echo "## Change Classification"
            echo ""
            echo "- Base: \`$BASE_SHA\`"
            echo "- Head: \`$HEAD_SHA\`"
            echo "- Changed files: \`$COUNT\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "✅ No changed files; treating as docs-only/skip." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          docs_only=true
          for f in "${CHANGED[@]}"; do
            # Allowed docs-only patterns:
            # - markdown files anywhere
            # - docs/ tree
            # - github markdown docs/meta
            if [[ "$f" == docs/* || "$f" == *.md || "$f" == .github/*.md || "$f" == .github/**/*.md ]]; then
              :
            else
              docs_only=false
              break
            fi
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          {
            echo "- Docs-only: \`$docs_only\`"
            echo ""
            echo "<details><summary>Changed files</summary>"
            printf '\n'
            for f in "${CHANGED[@]}"; do
              echo "- \`$f\`"
            done
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-build:
    name: Frontend Build (mode-guarded)
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: frontend

    env:
      NODE_VERSION: '20'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Assert frontend data mode policy
        env:
          REF_NAME: ${{ github.ref_name }}
          VITE_DATA_MODE: ${{ env.VITE_DATA_MODE }}
          VITE_ALLOW_NON_LIVE_MODE: ${{ env.VITE_ALLOW_NON_LIVE_MODE }}
        run: |
          set -euo pipefail

          REF_NAME="${REF_NAME:-}"
          MODE="${VITE_DATA_MODE:-}"
          ALLOW="${VITE_ALLOW_NON_LIVE_MODE:-}"

          case "$MODE" in
            ""|"live") NORMALIZED_MODE="live" ;;
            "snapshot"|"fixtures") NORMALIZED_MODE="$MODE" ;;
            *) NORMALIZED_MODE="live" ;;
          esac

          {
            echo "## Frontend Data Mode Guard"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Branch | \`$REF_NAME\` |"
            echo "| VITE_DATA_MODE (raw) | \`${MODE:-<unset>}\` |"
            echo "| VITE_ALLOW_NON_LIVE_MODE | \`${ALLOW:-<unset>}\` |"
            echo "| Effective mode | \`$NORMALIZED_MODE\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$REF_NAME" == "main" ]]; then
            if [[ "$NORMALIZED_MODE" == "snapshot" || "$NORMALIZED_MODE" == "fixtures" ]]; then
              echo "❌ main forbids non-live mode" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "✅ main policy pass" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$NORMALIZED_MODE" == "snapshot" || "$NORMALIZED_MODE" == "fixtures" ]]; then
            if [[ "$ALLOW" != "1" ]]; then
              echo "❌ non-main requires VITE_ALLOW_NON_LIVE_MODE=1 for $NORMALIZED_MODE" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "⚠️ explicit non-live mode allowed on non-main" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "✅ live-default mode" >> "$GITHUB_STEP_SUMMARY"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Run data mode contract tests
        run: |
          npx vitest run \
            apps/os-shell/src/__tests__/forge/dataProvider.modeResolution.contract.test.ts \
            apps/os-shell/src/__tests__/forge/useDataMode.unifiedSource.contract.test.ts \
            apps/os-shell/src/__tests__/forge/forgeSuiteSourceHonesty.contract.test.tsx \
            apps/os-shell/src/__tests__/forge/forgeSuiteHome.contract.test.tsx \
            2>&1 | tee vitest-output.txt

          RESULT=$(grep -E "Tests\s+[0-9]+" vitest-output.txt | tail -1 || echo "result unavailable")
          {
            echo "## Data Mode Contract Tests"
            echo ""
            echo "\`\`\`"
            echo "$RESULT"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture build metadata
        run: |
          set -euo pipefail
          DIST_DIR="../native-shell/ui/dist"
          [[ -d "$DIST_DIR" ]] || DIST_DIR="dist"
          [[ -d "$DIST_DIR" ]] || { echo "❌ Build output not found" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          FILE_COUNT=$(find "$DIST_DIR" -type f | wc -l | tr -d ' ')
          BYTE_SIZE=$(du -sh "$DIST_DIR" | awk '{print $1}')
          {
            echo "## Build Output"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Output dir | \`$DIST_DIR\` |"
            echo "| Files | \`$FILE_COUNT\` |"
            echo "| Size | \`$BYTE_SIZE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: |
            native-shell/ui/dist
            frontend/dist
          if-no-files-found: warn
          retention-days: 7

  docs-only-summary:
    name: Docs-only fast path
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Emit docs-only summary
        run: |
          {
            echo "## Frontend Build Skipped"
            echo ""
            echo "- Reason: docs-only change set"
            echo "- Changed files: ${{ needs.classify.outputs.changed_count }}"
            echo "- Build job intentionally not executed."
          } >> "$GITHUB_STEP_SUMMARY"
