name: contract-compat

on:
  pull_request:
    paths:
      - 'backend/src/TerraFusion.Abstractions/**'
      - 'scripts/contracts/**'
      - '.github/workflows/contract-compat.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/TerraFusion.Abstractions/**'
      - 'scripts/contracts/**'
      - '.github/workflows/contract-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify shared-contract freeze
        run: node --test scripts/contracts/verify-contract-freeze.test.mjs
