name: TerraFusion OS - Production CI/CD Pipeline

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip checks)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  PROD_API_IMAGE: ghcr.io/bsvalues/terrafusion-os-prod-api-internal
  PROD_FRONTEND_IMAGE: ghcr.io/bsvalues/terrafusion-os-prod-frontend-internal
  PROD_AI_SWARM_IMAGE: ghcr.io/bsvalues/terrafusion-os-prod-ai-swarm-internal
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'
  PYTHON_VERSION: '3.11'

jobs:
  # Security and Compliance Scan
  # Skip for Snyk/Dependabot PRs - they use deps-fast-lane + seal-gate-fast instead
  security-scan:
    name: Security & Compliance Analysis
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.head_ref || github.ref_name, 'snyk-') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: FISMA Compliance Check
        run: |
          echo "🔒 Running FISMA compliance verification..."
          # Check for security configurations
          if [ ! -f "backend/TerraFusion.Security/ProductionAuthenticationService.cs" ]; then
            echo "❌ Production authentication service not found"
            exit 1
          fi

          # Verify audit logging
          if ! grep -r "AuditLog" backend/; then
            echo "❌ Audit logging not properly implemented"
            exit 1
          fi

          # Check encryption configuration
          if ! grep -r "encryption" backend/ --include="*.cs"; then
            echo "❌ Encryption configuration missing"
            exit 1
          fi

          echo "✅ FISMA compliance checks passed"

      - name: SAST with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'csharp,javascript'
          config-file: ./.github/codeql/codeql-config.yml
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  # Frontend Testing and Build
  frontend-pipeline:
    name: Frontend Pipeline (React 18 + Electron)
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend linting
        run: |
          cd frontend
          npm run lint

      - name: Run frontend type checking
        run: |
          cd frontend
          npm run type-check

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test

      - name: Run accessibility tests
        run: |
          cd frontend
          npm run test:a11y || echo "Accessibility tests completed with warnings"

      - name: Build frontend for production
        run: |
          cd frontend
          npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: native-shell/ui/dist
          retention-days: 30

  # Backend Testing and Build
  backend-pipeline:
    name: Backend Pipeline (.NET 8 API)
    runs-on: ubuntu-latest
    needs: [security-scan]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET dependencies
        run: |
          cd backend
          dotnet restore

      - name: Build backend
        run: |
          cd backend
          dotnet build --configuration Release --no-restore

      - name: Publish backend
        run: |
          cd backend
          dotnet publish TerraFusion.API/TerraFusion.API.csproj -c Release -o ./publish

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/publish
          retention-days: 30

  # Backend Unit Tests (Canonical)
  backend-unit-tests:
    name: Backend Unit Tests
    needs: [security-scan]
    uses: ./.github/workflows/dotnet-test.yml
    with:
      dotnet_version: '8.0.x'
      solution: 'backend/TerraFusion.sln'
      enable_coverage: true
      upload_test_results: true

  # Backend Integration Tests (Canonical)
  backend-integration-tests:
    name: Backend Integration Tests
    needs: [security-scan]
    uses: ./.github/workflows/dotnet-test.yml
    with:
      dotnet_version: '8.0.x'
      solution: 'backend/TerraFusion.sln'
      test_project: 'backend/TerraFusion.API.Tests/TerraFusion.API.Tests.csproj'
      connection_string: 'Server=localhost;Port=5432;Database=test_db;User Id=test_user;Password=test_password;'

  # AI Models Testing
  ai-models-pipeline:
    name: AI Models & Swarm Testing
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AI dependencies
        run: |
          cd backend/ai-models
          pip install -r requirements.txt

      - name: Run AI model tests
        run: |
          cd backend/ai-models
          python -m pytest tests/ --verbose

      - name: Validate AI Swarm configuration
        run: |
          cd backend/ai-swarm
          python -m pytest tests/ --verbose

      - name: Performance benchmarking
        run: |
          cd backend/quantum-performance
          python quantum_performance_benchmark.py

  # E2E Testing
  e2e-testing:
    name: End-to-End Testing
    runs-on: ubuntu-latest
    needs: [frontend-pipeline, backend-pipeline, backend-unit-tests, backend-integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          npm install -g @playwright/test
          npx playwright install

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: native-shell/ui/dist

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/publish

      - name: Start test environment
        run: |
          # Start backend API
          cd backend/publish
          nohup dotnet TerraFusion.API.dll &

          # Start frontend dev server
          cd ../../frontend
          npm install
          nohup npm run preview &

          # Wait for services to start
          sleep 30

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: playwright-report/

  # Container Build and Registry Push
  container-build:
    name: Container Build & Registry Push
    runs-on: ubuntu-latest
    needs:
      [
        frontend-pipeline,
        backend-pipeline,
        backend-unit-tests,
        backend-integration-tests,
        ai-models-pipeline,
      ]
    if: github.event_name == 'push' || github.event.inputs.force_deploy == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PROD_API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: native-shell/ui/dist

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/publish

      - name: Build and push API container
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push Frontend container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ env.PROD_FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Swarm container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infrastructure/docker/Dockerfile.ai-swarm
          push: true
          tags: ${{ env.PROD_AI_SWARM_IMAGE }}:${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Infrastructure Deployment
  infrastructure-deployment:
    name: Infrastructure Deployment (Terraform)
    runs-on: ubuntu-latest
    needs: [container-build]
    if: false
    environment:
      name: staging-deprecated
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform
          terraform plan -var="environment=${{ github.event.inputs.deploy_environment || 'staging' }}"

      - name: Terraform Apply
        if: false
        run: |
          cd infrastructure/terraform
          terraform apply -var="environment=${{ github.event.inputs.deploy_environment || 'staging' }}"

  # ArgoCD Deployment
  argocd-deployment:
    name: ArgoCD Application Deployment
    runs-on: ubuntu-latest
    needs: [infrastructure-deployment, container-build]
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --region us-west-2 --name terrafusion-production-primary

      - name: Deploy with ArgoCD
        run: |
          # Install ArgoCD CLI
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd

          # Login to ArgoCD
          argocd login argocd.terrafusionmarket.com --username admin --password ${{ secrets.ARGOCD_PASSWORD }}

          # Deploy applications
          argocd app sync terrafusion-api
          argocd app sync terrafusion-frontend
          argocd app sync terrafusion-ai-swarm

          # Wait for deployment
          argocd app wait terrafusion-api --health
          argocd app wait terrafusion-frontend --health
          argocd app wait terrafusion-ai-swarm --health

  # Post-Deployment Testing
  post-deployment-testing:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [argocd-deployment]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Health Check API
        run: |
          # Wait for deployment to stabilize
          sleep 60

          # Check API health
          curl -f https://api.terrafusionmarket.com/health || exit 1

          # Check AI Swarm health
          curl -f https://api.terrafusionmarket.com/ai-swarm/health || exit 1

          # Verify 1,008 agents are active
          AGENT_COUNT=$(curl -s https://api.terrafusionmarket.com/ai-swarm/agents/count | jq '.count')
          if [ "$AGENT_COUNT" -ne 1008 ]; then
            echo "❌ Expected 1008 agents, got $AGENT_COUNT"
            exit 1
          fi

      - name: Performance Testing
        run: |
          # Run load tests against production
          npx k6 run infrastructure/k6/load-test.js

      - name: Security Validation
        run: |
          # Verify HTTPS is enforced
          curl -I http://api.terrafusionmarket.com | grep -q "301\|302" || exit 1

          # Check security headers
          curl -I https://api.terrafusionmarket.com | grep -q "Strict-Transport-Security" || exit 1

  # Notification
  notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [post-deployment-testing]
    if: always()
    steps:
      - name: Notify Slack
        if: needs.post-deployment-testing.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🚀 TerraFusion OS Production Deployment Successful!

            ✅ 39 modules deployed
            ✅ 1,008 AI agents operational
            ✅ Government-grade security active
            ✅ All health checks passed

            Environment: Production
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify on Failure
        if: needs.post-deployment-testing.result == 'failure'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ TerraFusion OS Deployment Failed

            Environment: Production
            Commit: ${{ github.sha }}
            Build: #${{ github.run_number }}

            Please check the logs and retry deployment.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
