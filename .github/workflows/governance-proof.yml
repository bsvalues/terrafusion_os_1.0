name: governance-proof

on:
  workflow_dispatch:

  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect governance policy/proof changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            governance:
              - '.github/workflows/governance-proof.yml'
              - 'policy/**'
              - 'governance/**'
              - 'package.json'
              - 'pnpm-lock.yaml'

      - name: No relevant changes
        if: steps.changes.outputs.governance != 'true'
        run: echo "No governance/policy changes detected — governance proof skipped."

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.governance == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.governance == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install
        if: steps.changes.outputs.governance == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Governance Proof (log)
        if: steps.changes.outputs.governance == 'true'
        run: pnpm run ci:governance-proof:log
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-proof-${{ github.run_id }}
          path: |
            ci_governance_proof.log
            governance-snapshot.json
