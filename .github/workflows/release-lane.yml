name: release-lane

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Full git SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.release_sha }} to ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      TF_AUTH_BOOTSTRAP_EMAIL: ${{ secrets.TF_AUTH_BOOTSTRAP_EMAIL }}
      TF_AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.TF_AUTH_BOOTSTRAP_PASSWORD }}
      TF_AUTH_BOOTSTRAP_ROLES: ${{ secrets.TF_AUTH_BOOTSTRAP_ROLES }}
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify immutable candidate checkout
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase 40-character git SHA"
            exit 1
          fi

          # Protected deployment assets may execute with host privileges. Only a
          # commit already contained in the canonical main branch is eligible.
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          TRUSTED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "$TRUSTED_MAIN_SHA"; then
            echo "release_sha is not contained in trusted origin/main; refusing protected deployment"
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          test "$CHECKED_OUT_SHA" = "$RELEASE_SHA"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Candidate checkout is not clean; refusing to build a release image"
            git status --short
            exit 1
          fi

          for path in ops/proxy/Caddyfile ops/prod/runtime-compose.template.yml ops/edge-proxy/Caddyfile ops/edge-proxy/docker-compose.yml frontend/Dockerfile backend/Dockerfile; do
            test -f "$path" || {
              echo "Candidate is missing required release asset: $path"
              exit 1
            }
          done

          {
            printf 'CHECKED_OUT_SHA=%s\n' "$CHECKED_OUT_SHA"
            printf 'CANDIDATE_TREE_SHA=%s\n' "$CANDIDATE_TREE_SHA"
            printf 'TRUSTED_MAIN_SHA=%s\n' "$TRUSTED_MAIN_SHA"
          } >> "$GITHUB_ENV"

      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/${TARGET_ENV}}"
          PUBLIC_URL="${PUBLIC_URL%/}"

          for required in DEPLOY_HOST DEPLOY_USER PUBLIC_URL DEPLOY_SSH_KEY TF_AUTH_BOOTSTRAP_EMAIL TF_AUTH_BOOTSTRAP_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required environment configuration: ${required}"
              exit 1
            fi
          done

          TF_AUTH_BOOTSTRAP_ROLES="${TF_AUTH_BOOTSTRAP_ROLES:-GovernmentUser,Administrator,FullSystemAccess}"

          PUBLIC_HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BACKEND_IMAGE="ghcr.io/${OWNER}/terrafusion-os-backend-internal:${RELEASE_SHA}"
          FRONTEND_IMAGE="ghcr.io/${OWNER}/terrafusion-os-frontend-internal:${RELEASE_SHA}"
          DEPLOYED_AT="$(date -u +%FT%TZ)"
          case "$TARGET_ENV" in
            staging) ASPNETCORE_ENV_LABEL="Staging" ;;
            production) ASPNETCORE_ENV_LABEL="Production" ;;
            *)
              echo "Unsupported TARGET_ENV for ASPNETCORE_ENV_LABEL: $TARGET_ENV"
              exit 1
              ;;
          esac

          {
            printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT"
            printf 'APP_ROOT=%s\n' "$APP_ROOT"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST"
            printf 'OWNER=%s\n' "$OWNER"
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'DEPLOYED_AT=%s\n' "$DEPLOYED_AT"
            printf 'ASPNETCORE_ENV_LABEL=%s\n' "$ASPNETCORE_ENV_LABEL"
            printf 'TF_AUTH_BOOTSTRAP_ROLES=%s\n' "$TF_AUTH_BOOTSTRAP_ROLES"
          } >> "$GITHUB_ENV"

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Keyscan with retries — GitHub Actions runners sometimes need
          # longer to reach Hostinger VPS (NAT, firewalls, transient DNS).
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done

          # Global SSH options: faster timeout + keepalive for Hostinger VPS
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
          SSHCFG

          # Fallback: if keyscan still failed, accept new keys on first connect
          if ! grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts 2>/dev/null; then
            echo "WARNING: ssh-keyscan returned no keys; using StrictHostKeyChecking=accept-new"
            printf '  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          fi
          chmod 600 ~/.ssh/config

      - name: Preflight - public DNS resolution
        shell: bash
        run: |
          set -euo pipefail
          nslookup "$PUBLIC_HOST"
          echo "DNS resolved OK"

      - name: Preflight - remote host access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SSH preflight attempt $attempt/3..."
            set +e
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "APP_ROOT='$APP_ROOT' TARGET_ENV='$TARGET_ENV' bash -s" <<'SSH'
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version >/dev/null
          test -d "$APP_ROOT"
          test -w "$APP_ROOT"
          test -f "$APP_ROOT/app.env"
          if ! grep -q '^ConnectionStrings__DefaultConnection=' "$APP_ROOT/app.env"; then
            echo "APP_ENV_MISSING_CONNECTION_STRING"
            exit 1
          fi
          if ! grep -q '^DatabaseProvider=' "$APP_ROOT/app.env"; then
            echo "APP_ENV_MISSING_DATABASE_PROVIDER"
            exit 1
          fi

          provider="$(grep '^DatabaseProvider=' "$APP_ROOT/app.env" | tail -n1 | cut -d= -f2- | tr -d '\r' | xargs)"
          provider_key="$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]')"
          connection="$(grep '^ConnectionStrings__DefaultConnection=' "$APP_ROOT/app.env" | tail -n1 | cut -d= -f2- | tr -d '\r')"
          connection_key="$(printf '%s' "$connection" | tr '[:upper:]' '[:lower:]')"

          if [ "$TARGET_ENV" = "production" ]; then
            case "$provider_key" in
              postgres|postgresql|npgsql) ;;
              sqlite)
                echo "APP_ENV_PRODUCTION_DB_PROVIDER_SQLITE"
                exit 1
                ;;
              *)
                echo "APP_ENV_PRODUCTION_DB_PROVIDER_UNSUPPORTED_FOR_RELEASE_LANE"
                exit 1
                ;;
            esac

            case "$connection_key" in
              *"data source="*".db"*|*"data source="*"/app/data/"*|*"data source="*"\\app\\data\\"*)
                echo "APP_ENV_PRODUCTION_DB_CONNECTION_SQLITE"
                exit 1
                ;;
            esac

            case "$connection_key" in
              *"host="*|*"server="*) ;;
              *)
                echo "APP_ENV_PRODUCTION_DB_CONNECTION_NOT_SERVER_BACKED"
                exit 1
                ;;
            esac
          fi
          SSH
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "SSH preflight succeeded on attempt $attempt"
              exit 0
            fi
            echo "SSH attempt $attempt failed (exit $rc), waiting 15s..."
            sleep 15
          done
          echo "ERROR: SSH preflight failed after 3 attempts"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify immutable candidate before image builds
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_OUT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --target runtime \
            --build-arg GIT_SHA="$RELEASE_SHA" \
            --label "org.opencontainers.image.revision=$CHECKED_OUT_SHA" \
            --label "org.terrafusion.candidate.tree=$CANDIDATE_TREE_SHA" \
            -f backend/Dockerfile -t "$BACKEND_IMAGE" backend
          docker push "$BACKEND_IMAGE"
          BACKEND_IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BACKEND_IMAGE")"
          BACKEND_IMAGE_DIGEST="${BACKEND_IMAGE_DIGEST##*@}"
          [[ "$BACKEND_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          BACKEND_IMAGE_REF="${BACKEND_IMAGE}@${BACKEND_IMAGE_DIGEST}"
          {
            printf 'BACKEND_IMAGE_DIGEST=%s\n' "$BACKEND_IMAGE_DIGEST"
            printf 'BACKEND_IMAGE_REF=%s\n' "$BACKEND_IMAGE_REF"
          } >> "$GITHUB_ENV"

      - name: Reclaim runner disk before frontend image
        shell: bash
        run: |
          set -euo pipefail
          echo "Docker disk usage before cleanup:"
          docker system df || true

          # The backend image is already pushed to GHCR. Hosted runners can run
          # out of disk when the frontend install/build starts with backend
          # layers and BuildKit cache still resident.
          docker image rm "$BACKEND_IMAGE" || true
          docker builder prune -af || true
          docker image prune -af || true

          echo "Docker disk usage after cleanup:"
          docker system df || true

      - name: Build and push frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --target production \
            --build-arg VITE_BUILD_SHA="$RELEASE_SHA" \
            --label "org.opencontainers.image.revision=$CHECKED_OUT_SHA" \
            --label "org.terrafusion.candidate.tree=$CANDIDATE_TREE_SHA" \
            -f frontend/Dockerfile -t "$FRONTEND_IMAGE" .
          docker push "$FRONTEND_IMAGE"
          FRONTEND_IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$FRONTEND_IMAGE")"
          FRONTEND_IMAGE_DIGEST="${FRONTEND_IMAGE_DIGEST##*@}"
          [[ "$FRONTEND_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          FRONTEND_IMAGE_REF="${FRONTEND_IMAGE}@${FRONTEND_IMAGE_DIGEST}"
          {
            printf 'FRONTEND_IMAGE_DIGEST=%s\n' "$FRONTEND_IMAGE_DIGEST"
            printf 'FRONTEND_IMAGE_REF=%s\n' "$FRONTEND_IMAGE_REF"
          } >> "$GITHUB_ENV"

      - name: Prepare runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime edge-proxy evidence curl_headers.txt
          mkdir -p runtime/docs/spec-lock runtime/config
          cp ops/proxy/Caddyfile runtime/Caddyfile
          cp ops/prod/runtime-compose.template.yml runtime/runtime-compose.yml
          cp -R docs/spec-lock/. runtime/docs/spec-lock/
          cp sovereign.yaml runtime/sovereign.yaml
          if ! grep -q './sovereign.yaml:/app/sovereign.yaml:ro' runtime/runtime-compose.yml; then
            sed -i '/- \.\/docs\/spec-lock:\/app\/docs\/spec-lock:ro/a\      - ./sovereign.yaml:/app/sovereign.yaml:ro' runtime/runtime-compose.yml
          fi
          sed -i "s/ASPNETCORE_ENVIRONMENT: Production/ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV_LABEL}/" runtime/runtime-compose.yml
          if [ "$TARGET_ENV" = "staging" ]; then
            cat > runtime/config/appsettings.Staging.json <<'EOF'
          {}
          EOF
            sed -i '/- \.\/docs\/spec-lock:\/app\/docs\/spec-lock:ro/a\      - ./config/appsettings.Staging.json:/app/appsettings.Staging.json:ro' runtime/runtime-compose.yml
          fi

          # Edge proxy bundle (shared across environments)
          mkdir -p edge-proxy
          cp ops/edge-proxy/Caddyfile edge-proxy/Caddyfile
          cp ops/edge-proxy/docker-compose.yml edge-proxy/docker-compose.yml

          cat > runtime/release.env <<EOF
          COMPOSE_PROJECT_NAME=terrafusion-${TARGET_ENV}
          TF_RELEASE_SHA=${RELEASE_SHA}
          TF_RELEASE_ENV=${TARGET_ENV}
          TF_RELEASE_DEPLOYED_AT=${DEPLOYED_AT}
          TF_PUBLIC_URL=${PUBLIC_URL}
          TF_PUBLIC_HOST=${PUBLIC_HOST}
          TF_BACKEND_IMAGE=${BACKEND_IMAGE_REF}
          TF_FRONTEND_IMAGE=${FRONTEND_IMAGE_REF}
          TERRAFUSION_BOOTSTRAP_EMAIL=${TF_AUTH_BOOTSTRAP_EMAIL}
          TERRAFUSION_BOOTSTRAP_PASSWORD=${TF_AUTH_BOOTSTRAP_PASSWORD}
          TERRAFUSION_BOOTSTRAP_ROLES=${TF_AUTH_BOOTSTRAP_ROLES}
          EOF

      - name: Preserve exact current release bundle for rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'SSH'
          set -euo pipefail
          if [ ! -f "$APP_ROOT/current.sha" ]; then
            exit 0
          fi

          CURRENT_SHA="$(cat "$APP_ROOT/current.sha")"
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          SNAPSHOT_ROOT="$APP_ROOT/releases/$CURRENT_SHA"
          if [ -e "$SNAPSHOT_ROOT" ]; then
            test -d "$SNAPSHOT_ROOT"
            for file in release.sha release.env runtime-compose.yml Caddyfile sovereign.yaml; do
              test -f "$SNAPSHOT_ROOT/$file"
            done
            test -d "$SNAPSHOT_ROOT/docs/spec-lock"
            test -d "$SNAPSHOT_ROOT/config"
            for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
              cmp -s "$APP_ROOT/$file" "$SNAPSHOT_ROOT/$file"
            done
            diff -qr "$APP_ROOT/docs/spec-lock" "$SNAPSHOT_ROOT/docs/spec-lock" >/dev/null
            if [ -d "$APP_ROOT/config" ]; then
              diff -qr "$APP_ROOT/config" "$SNAPSHOT_ROOT/config" >/dev/null
            fi
            test "$(cat "$SNAPSHOT_ROOT/release.sha")" = "$CURRENT_SHA"
            test "$(sed -n 's/^TF_RELEASE_SHA=//p' "$SNAPSHOT_ROOT/release.env")" = "$CURRENT_SHA"
            BACKEND_IMAGE_REF="$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$SNAPSHOT_ROOT/release.env")"
            FRONTEND_IMAGE_REF="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$SNAPSHOT_ROOT/release.env")"
            [[ "$BACKEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
            [[ "$FRONTEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]
            exit 0
          fi

          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$APP_ROOT/$file"
          done
          test "$(sed -n 's/^TF_RELEASE_SHA=//p' "$APP_ROOT/release.env")" = "$CURRENT_SHA"
          BACKEND_IMAGE_REF="$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$APP_ROOT/release.env")"
          FRONTEND_IMAGE_REF="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$APP_ROOT/release.env")"
          [[ "$BACKEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]
          install -d -m 0700 "$SNAPSHOT_ROOT"
          printf '%s\n' "$CURRENT_SHA" > "$SNAPSHOT_ROOT/release.sha"
          chmod 0600 "$SNAPSHOT_ROOT/release.sha"
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$APP_ROOT/$file" "$SNAPSHOT_ROOT/$file"
          done
          install -d -m 0700 "$SNAPSHOT_ROOT/docs/spec-lock" "$SNAPSHOT_ROOT/config"
          test -d "$APP_ROOT/docs/spec-lock"
          cp -a "$APP_ROOT/docs/spec-lock/." "$SNAPSHOT_ROOT/docs/spec-lock/"
          if [ -d "$APP_ROOT/config" ]; then
            cp -a "$APP_ROOT/config/." "$SNAPSHOT_ROOT/config/"
          fi
          SSH

      - name: Upload runtime bundle to VPS
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -r runtime/* "$DEPLOY_USER@$DEPLOY_HOST:$APP_ROOT/"

      - name: Bootstrap shared edge proxy
        shell: bash
        run: |
          set -euo pipefail
          # Ensure shared Docker network exists
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker network inspect terrafusion-edge >/dev/null 2>&1 || docker network create terrafusion-edge"

          # Stop the current per-env stack gracefully so the edge proxy can
          # claim host ports 80/443.  On the very first edge-proxy deploy the
          # old stack still has host port bindings; after that this is a no-op
          # because per-env stacks no longer bind host ports.
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          if [ -f runtime-compose.yml ] && [ -f release.env ]; then
            docker compose -f runtime-compose.yml --env-file release.env down --timeout 30 || true
          fi
          SSH

          # Deploy/update edge proxy (owns host 80/443, routes by hostname)
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/terrafusion/edge-proxy"
          scp -P "$DEPLOY_PORT" edge-proxy/* "$DEPLOY_USER@$DEPLOY_HOST:/opt/terrafusion/edge-proxy/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/terrafusion/edge-proxy && docker compose up -d && docker compose exec -T edge caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile 2>/dev/null || true"

      - name: Preflight - GHCR pull on VPS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate deploy user to GHCR (token is short-lived, expires after workflow run)
          # Pipe token directly to docker login (no 'cat' intermediary — it hangs on SSH EOF).
          # Trailing newline ensures --password-stdin reads the complete token immediately.
          printf '%s\n' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null 2>&1
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' bash -s" <<'SSH'
          set -euo pipefail

          print_release_disk() {
            echo "Docker disk usage:"
            docker system df || true

            local docker_root
            docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"

            echo "Filesystem free space:"
            for path in "$docker_root" /var/lib/containerd /; do
              if [ -e "$path" ]; then
                df -h "$path" || true
              fi
            done
          }

          available_kb_for_path() {
            local path="$1"
            local available

            if [ -z "$path" ] || [ ! -e "$path" ]; then
              echo 0
              return
            fi

            available="$(df -Pk "$path" 2>/dev/null | awk 'NR==2 && $4 ~ /^[0-9]+$/ {print $4}' || true)"
            if [ -z "$available" ]; then
              echo 0
              return
            fi

            echo "$available"
          }

          require_release_disk() {
            local min_kb="${MIN_RELEASE_DISK_KB:-6291456}"
            local docker_root
            local docker_kb
            local containerd_kb

            docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
            docker_kb="$(available_kb_for_path "$docker_root")"
            containerd_kb="$(available_kb_for_path /var/lib/containerd)"

            if [ "$docker_kb" -lt "$min_kb" ] && [ "$containerd_kb" -lt "$min_kb" ]; then
              echo "ERROR: VPS does not have enough Docker/containerd disk for release image pull."
              echo "Required free space on Docker root or /var/lib/containerd: ${min_kb} KiB."
              echo "Observed Docker root (${docker_root:-unknown}) free: ${docker_kb} KiB."
              echo "Observed /var/lib/containerd free: ${containerd_kb} KiB."
              print_release_disk
              exit 1
            fi
          }

          echo "Release disk state before safe cleanup:"
          print_release_disk

          # Safe release cleanup only. This removes stopped containers, build
          # cache, dangling layers, and unused images older than 24h. It does
          # not prune Docker volumes or application data.
          docker container prune -f || true
          docker builder prune -af || true
          docker image prune -f || true
          docker image prune -af --filter "until=24h" || true

          echo "Release disk state after safe cleanup:"
          print_release_disk
          require_release_disk

          echo "Pulling backend image..."
          docker pull "$BACKEND_IMAGE_REF"
          echo "Pulling frontend image..."
          docker pull "$FRONTEND_IMAGE_REF"
          SSH

      - name: Deploy runtime bundle on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          install -d data docs/spec-lock
          printf '%s\n' "$RELEASE_SHA" > requested.sha
          if [ -f current.sha ]; then
            cp current.sha previous.sha
          fi

          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null
          docker compose -f runtime-compose.yml --env-file release.env pull
          docker compose -f runtime-compose.yml --env-file release.env up -d
          SSH

      - name: Provision DB-backed operator account
        shell: bash
        run: |
          set -euo pipefail
          PROVISION_OUTPUT="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          docker compose -f runtime-compose.yml --env-file release.env run --rm --no-deps \
            --entrypoint sh \
            backend \
            -c 'set -eu
              : "${DatabaseProvider:?DatabaseProvider missing from runtime environment}"
              : "${ConnectionStrings__DefaultConnection:?ConnectionStrings__DefaultConnection missing from runtime environment}"
              dotnet /app/tools/TerraFusion.AuthProvisioner/TerraFusion.AuthProvisioner.dll \
                --email "$TERRAFUSION_BOOTSTRAP_EMAIL" \
                --password-env TERRAFUSION_BOOTSTRAP_PASSWORD \
                --roles "${TERRAFUSION_BOOTSTRAP_ROLES:-GovernmentUser,Administrator,FullSystemAccess}" \
                --permissions "runtime:read,county:read,workbench:access" \
                --county-name Benton \
                --county-state WA \
                --county-fips 53005 \
                --create-county'
          SSH
          )"
          PROVISION_JSON="$(printf '%s\n' "$PROVISION_OUTPUT" | awk '/^\{/{line=$0} END{print line}')"
          PROVISION_JSON="$PROVISION_JSON" node <<'NODE'
          const receipt = JSON.parse(process.env.PROVISION_JSON || "{}");
          if (!receipt.passwordHashStored) {
            throw new Error("AuthProvisioner did not store a password hash");
          }
          if (!receipt.countyId) {
            throw new Error("AuthProvisioner did not bind the operator to a county");
          }
          console.log(`DB-backed operator account ${receipt.result}; password hash stored; county bound.`);
          NODE

      - name: Verify public health and release header
        shell: bash
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL}/health"
          success=0

          for attempt in $(seq 1 18); do
            if curl -fsS -o /dev/null -D curl_headers.txt "$URL" 2>/dev/null; then
              HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
              if [ "$HEADER_SHA" = "$RELEASE_SHA" ]; then
                success=1
                break
              fi
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "--- Diagnostic: verbose public curl ---"
              curl -vk "$URL" 2>&1 | head -40 || true
              echo "--- End diagnostic ---"
            fi

            echo "Waiting for $URL to report X-Release-Sha=$RELEASE_SHA (attempt $attempt/18)"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Health endpoint never reported the requested release SHA."
            exit 1
          fi

          grep -iE '^HTTP/.* 200' curl_headers.txt

      - name: Shell route contract smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Shell route contract smoke ==="

          # Derive the public host from the same PUBLIC_URL env var used by the health check step
          HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"

          probe() {
            local path="$1"
            local status
            status=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "https://${HOST}${path}" 2>/dev/null || echo "000")
            echo "  $path -> HTTP $status"
            if [[ "$status" =~ ^[23] ]]; then
              echo "  OK"
            else
              echo "::error::Shell route smoke failed: $path returned HTTP $status"
              exit 1
            fi
          }

          probe "/"
          probe "/property"
          echo "Shell route contract intact after deploy"

      - name: Provisioned auth contract smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Provisioned auth contract smoke ==="

          POLICY_JSON="$(curl -fsS --max-time 10 "${PUBLIC_URL}/api/auth/access-policy")"
          POLICY_JSON="$POLICY_JSON" node <<'NODE'
          const policy = JSON.parse(process.env.POLICY_JSON || "{}");
          if (policy.signupMode !== "provisioned_access_only") {
            throw new Error(`Expected signupMode=provisioned_access_only, got ${policy.signupMode}`);
          }
          if (policy.publicSignupEnabled !== false) {
            throw new Error("Expected publicSignupEnabled=false");
          }
          console.log("Access policy is provisioned-access-only");
          NODE

          LOGIN_PAYLOAD="$(node <<'NODE'
          process.stdout.write(JSON.stringify({
            email: process.env.TF_AUTH_BOOTSTRAP_EMAIL,
            password: process.env.TF_AUTH_BOOTSTRAP_PASSWORD
          }));
          NODE
          )"

          LOGIN_RESPONSE=""
          LOGIN_STATUS=1
          LOGIN_BODY="$(mktemp)"
          LOGIN_ERROR="$(mktemp)"
          trap 'rm -f "$LOGIN_BODY" "$LOGIN_ERROR"' EXIT

          for attempt in $(seq 1 12); do
            : > "$LOGIN_BODY"
            : > "$LOGIN_ERROR"

            CURL_EXIT=0
            HTTP_CODE="$(curl -sS --max-time 30 \
              -H 'Content-Type: application/json' \
              -d "$LOGIN_PAYLOAD" \
              -o "$LOGIN_BODY" \
              -w '%{http_code}' \
              "${PUBLIC_URL}/api/auth/login" 2>"$LOGIN_ERROR")" || CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [[ "$HTTP_CODE" =~ ^2 ]]; then
              LOGIN_RESPONSE="$(cat "$LOGIN_BODY")"
              LOGIN_STATUS=0
              echo "Provisioned auth login responded on attempt $attempt/12"
              break
            fi

            if [[ "$HTTP_CODE" =~ ^(400|401|403|404|405)$ ]]; then
              echo "::error::Provisioned auth login failed with non-retryable HTTP $HTTP_CODE."
              head -5 "$LOGIN_BODY"
              exit 1
            fi

            echo "Provisioned auth login not ready on attempt $attempt/12 (curl=$CURL_EXIT http=${HTTP_CODE:-000})"
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Provisioned auth login did not succeed after retry window."
              head -5 "$LOGIN_ERROR"
              exit 1
            fi

            sleep 10
          done

          rm -f "$LOGIN_BODY" "$LOGIN_ERROR"
          trap - EXIT

          if [ "$LOGIN_STATUS" -ne 0 ] || [ -z "$LOGIN_RESPONSE" ]; then
            echo "::error::Provisioned auth smoke did not receive a login response."
            exit 1
          fi

          LOGIN_RESPONSE="$LOGIN_RESPONSE" node <<'NODE'
          const response = JSON.parse(process.env.LOGIN_RESPONSE || "{}");
          const token = response.token || response.Token;
          const email = response.email || response.Email || response.user?.email || response.User?.Email;
          const roles = response.roles || response.Roles || response.user?.roles || response.User?.Roles || [];
          if (!token) {
            throw new Error("Provisioned auth smoke did not receive a token");
          }
          if (email !== process.env.TF_AUTH_BOOTSTRAP_EMAIL) {
            throw new Error(`Provisioned auth smoke returned unexpected email: ${email}`);
          }
          console.log(`Provisioned login returned token for ${email} with ${Array.isArray(roles) ? roles.length : 0} roles`);
          NODE

      - name: Finalize current SHA on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          test "$(cat requested.sha)" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_RELEASE_SHA=//p' release.env)" = "$RELEASE_SHA"
          BACKEND_IMAGE_REF="$(sed -n 's/^TF_BACKEND_IMAGE=//p' release.env)"
          FRONTEND_IMAGE_REF="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' release.env)"
          [[ "$BACKEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]

          SNAPSHOT_ROOT="$APP_ROOT/releases/$RELEASE_SHA"
          if [ ! -e "$SNAPSHOT_ROOT" ]; then
            install -d -m 0700 "$SNAPSHOT_ROOT/docs/spec-lock" "$SNAPSHOT_ROOT/config"
            printf '%s\n' "$RELEASE_SHA" > "$SNAPSHOT_ROOT/release.sha"
            chmod 0600 "$SNAPSHOT_ROOT/release.sha"
            for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
              install -m 0600 "$file" "$SNAPSHOT_ROOT/$file"
            done
            cp -a docs/spec-lock/. "$SNAPSHOT_ROOT/docs/spec-lock/"
            cp -a config/. "$SNAPSHOT_ROOT/config/"
          fi
          for file in release.sha release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$SNAPSHOT_ROOT/$file"
          done
          test -d "$SNAPSHOT_ROOT/docs/spec-lock"
          test -d "$SNAPSHOT_ROOT/config"
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            cmp -s "$file" "$SNAPSHOT_ROOT/$file"
          done
          diff -qr docs/spec-lock "$SNAPSHOT_ROOT/docs/spec-lock" >/dev/null
          diff -qr config "$SNAPSHOT_ROOT/config" >/dev/null
          test "$(cat "$SNAPSHOT_ROOT/release.sha")" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_RELEASE_SHA=//p' "$SNAPSHOT_ROOT/release.env")" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$SNAPSHOT_ROOT/release.env")" = "$BACKEND_IMAGE_REF"
          test "$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$SNAPSHOT_ROOT/release.env")" = "$FRONTEND_IMAGE_REF"
          printf '%s\n' "$RELEASE_SHA" > current.sha
          SSH

      - name: Verify requested/current/header invariant
        shell: bash
        run: |
          set -euo pipefail
          HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
          REQUESTED_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/requested.sha'")"
          CURRENT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/current.sha'")"

          test "$REQUESTED_SHA" = "$RELEASE_SHA"
          test "$CURRENT_SHA" = "$RELEASE_SHA"
          test "$HEADER_SHA" = "$RELEASE_SHA"

          {
            printf 'REQUESTED_SHA=%s\n' "$REQUESTED_SHA"
            printf 'CURRENT_SHA=%s\n' "$CURRENT_SHA"
            printf 'HEADER_SHA=%s\n' "$HEADER_SHA"
          } >> "$GITHUB_ENV"

      - name: Collect deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp curl_headers.txt evidence/curl_headers.txt

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env ps" > evidence/compose_ps.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "uptime" > evidence/uptime.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 backend" > evidence/logs_backend.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 proxy" > evidence/logs_proxy.txt

          cat > evidence/evidence.txt <<EOF
          operation=deploy
          target_env=${TARGET_ENV}
          aspnetcore_environment=${ASPNETCORE_ENV_LABEL}
          public_url=${PUBLIC_URL}
          release_sha=${RELEASE_SHA}
          checked_out_sha=${CHECKED_OUT_SHA}
          candidate_tree_sha=${CANDIDATE_TREE_SHA}
          trusted_main_sha=${TRUSTED_MAIN_SHA}
          requested_sha=${REQUESTED_SHA}
          current_sha=${CURRENT_SHA}
          header_sha=${HEADER_SHA}
          backend_image=${BACKEND_IMAGE}
          backend_image_digest=${BACKEND_IMAGE_DIGEST}
          backend_image_ref=${BACKEND_IMAGE_REF}
          frontend_image=${FRONTEND_IMAGE}
          frontend_image_digest=${FRONTEND_IMAGE_DIGEST}
          frontend_image_ref=${FRONTEND_IMAGE_REF}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          deployed_at_utc=${DEPLOYED_AT}
          EOF

          cat > evidence/evidence.json <<EOF
          {
            "operation": "deploy",
            "targetEnv": "${TARGET_ENV}",
            "aspnetcoreEnvironment": "${ASPNETCORE_ENV_LABEL}",
            "publicUrl": "${PUBLIC_URL}",
            "releaseSha": "${RELEASE_SHA}",
            "checkedOutSha": "${CHECKED_OUT_SHA}",
            "candidateTreeSha": "${CANDIDATE_TREE_SHA}",
            "trustedMainSha": "${TRUSTED_MAIN_SHA}",
            "requestedSha": "${REQUESTED_SHA}",
            "currentSha": "${CURRENT_SHA}",
            "headerSha": "${HEADER_SHA}",
            "backendImage": "${BACKEND_IMAGE}",
            "backendImageDigest": "${BACKEND_IMAGE_DIGEST}",
            "backendImageRef": "${BACKEND_IMAGE_REF}",
            "frontendImage": "${FRONTEND_IMAGE}",
            "frontendImageDigest": "${FRONTEND_IMAGE_DIGEST}",
            "frontendImageRef": "${FRONTEND_IMAGE_REF}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "deployedAtUtc": "${DEPLOYED_AT}"
          }
          EOF

      - name: Validate evidence schema
        shell: bash
        run: |
          set -euo pipefail
          for required in evidence.json evidence.txt curl_headers.txt compose_ps.txt uptime.txt logs_backend.txt logs_proxy.txt; do
            test -s "evidence/$required"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('evidence/evidence.json', 'utf8'));
          const shaPattern = /^[0-9a-f]{40}$/;
          const digestPattern = /^sha256:[0-9a-f]{64}$/;

          if (!shaPattern.test(evidence.releaseSha)) {
            throw new Error('releaseSha is not a full git SHA');
          }
          for (const field of ['checkedOutSha', 'requestedSha', 'currentSha', 'headerSha']) {
            if (evidence[field] !== evidence.releaseSha) {
              throw new Error(`${field} does not match releaseSha`);
            }
          }
          if (!shaPattern.test(evidence.candidateTreeSha)) {
            throw new Error('candidateTreeSha is not a full git tree SHA');
          }
          if (!shaPattern.test(evidence.trustedMainSha)) {
            throw new Error('trustedMainSha is not a full git SHA');
          }
          for (const [imageField, digestField, refField] of [
            ['backendImage', 'backendImageDigest', 'backendImageRef'],
            ['frontendImage', 'frontendImageDigest', 'frontendImageRef'],
          ]) {
            if (!digestPattern.test(evidence[digestField])) {
              throw new Error(`${digestField} is not a registry image digest`);
            }
            if (evidence[refField] !== `${evidence[imageField]}@${evidence[digestField]}`) {
              throw new Error(`${refField} is not bound to the recorded image and digest`);
            }
          }
          NODE

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ inputs.target_env }}-${{ inputs.release_sha }}
          path: evidence/
          if-no-files-found: error
