name: release-lane

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Full git SHA to deploy
        required: true
        type: string
      compliance_run_id:
        description: Successful technical compliance run; backend distribution approval remains protected
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: terrafusion-runtime-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.release_sha }} to ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      BACKEND_DISTRIBUTION_APPROVAL_ID: ${{ vars.BACKEND_DISTRIBUTION_APPROVAL_ID }}
      BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA: ${{ vars.BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA }}
      BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST: ${{ vars.BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST }}
      BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256: ${{ vars.BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256 }}
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify immutable candidate checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "release-lane must be dispatched from the protected main workflow definition"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase 40-character git SHA"
            exit 1
          fi

          # Protected deployment assets may execute with host privileges. Only a
          # commit already contained in the canonical main branch is eligible.
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          TRUSTED_MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "$TRUSTED_MAIN_SHA"; then
            echo "release_sha is not contained in trusted origin/main; refusing protected deployment"
            exit 1
          fi

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
          test "$CHECKED_OUT_SHA" = "$RELEASE_SHA"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Candidate checkout is not clean; refusing to build a release image"
            git status --short
            exit 1
          fi

          for path in ops/proxy/Caddyfile ops/prod/runtime-compose.template.yml frontend/Dockerfile backend/Dockerfile; do
            test -f "$path" || {
              echo "Candidate is missing required release asset: $path"
              exit 1
            }
          done

          {
            printf 'CHECKED_OUT_SHA=%s\n' "$CHECKED_OUT_SHA"
            printf 'CANDIDATE_TREE_SHA=%s\n' "$CANDIDATE_TREE_SHA"
            printf 'TRUSTED_MAIN_SHA=%s\n' "$TRUSTED_MAIN_SHA"
          } >> "$GITHUB_ENV"

      - name: Resolve technically approved artifacts (backend distribution approval still required)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPLIANCE_RUN_ID: ${{ inputs.compliance_run_id }}
        run: |
          set -euo pipefail
          [[ "$COMPLIANCE_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPLIANCE_RUN_ID")"
          RUN_JSON="$RUN_JSON" RELEASE_SHA="$RELEASE_SHA" node <<'NODE'
          const run = JSON.parse(process.env.RUN_JSON);
          if (run.status !== 'completed' || run.conclusion !== 'success') {
            throw new Error('Compliance run is not successfully completed');
          }
          if (run.head_sha !== process.env.RELEASE_SHA) {
            throw new Error('Compliance run head SHA does not match release_sha');
          }
          if (run.path !== '.github/workflows/release-compliance.yml') {
            throw new Error('Run is not the canonical release-compliance workflow');
          }
          NODE

          ARTIFACTS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPLIANCE_RUN_ID/artifacts")"
          ARTIFACT_ID="$(ARTIFACTS_JSON="$ARTIFACTS_JSON" node <<'NODE'
          const payload = JSON.parse(process.env.ARTIFACTS_JSON);
          const matches = payload.artifacts.filter(
            (artifact) => artifact.name === 'approved-release-images' && !artifact.expired
          );
          if (matches.length !== 1) {
            throw new Error('Compliance run must contain exactly one unexpired approved-release-images artifact');
          }
          process.stdout.write(String(matches[0].id));
          NODE
          )"

          APPROVED_DIR="$RUNNER_TEMP/approved-release-images"
          install -d "$APPROVED_DIR"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/approved-release-images.zip"
          unzip -q "$RUNNER_TEMP/approved-release-images.zip" -d "$APPROVED_DIR"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          node scripts/ci/release_image_manifest.mjs verify \
            --manifest "$APPROVED_DIR/release-images.json" \
            --release-sha "$RELEASE_SHA" \
            --backend-image "ghcr.io/$OWNER/terrafusion-os-backend-internal" \
            --frontend-image "ghcr.io/$OWNER/terrafusion-os-frontend-internal" \
            --backend-license-evidence "$APPROVED_DIR/backend-runtime-license-evidence.json" \
            --forge-image "ghcr.io/bsvalues/terrafusion-forge-valuation-kernel" \
            --forge-digest "sha256:0701e52e2b48fe2ceb614ee3c8f3c26992425096f014a0995704fc04a7a70066" \
            --forge-producer-commit "3fc296da17aaca4c32dd9b727ab62d2d3725d789" \
            --forge-canonical-source-commit "24059c3642339f36877cb454ca63683180915b71" \
            --forge-artifact-type "terraforge.valuation-kernel.linux-x64-musl@1" \
            --forge-producer-manifest "$APPROVED_DIR/forge-valuation-kernel-producer-manifest.json" \
            --forge-executable-sha256 "a371d8f421b66cd2f83073ed108c885facc97323f9a351547d7293259978c298" \
            --github-env "$GITHUB_ENV"
          echo "BACKEND_LICENSE_EVIDENCE_PATH=$APPROVED_DIR/backend-runtime-license-evidence.json" >> "$GITHUB_ENV"
          echo "FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_PATH=$APPROVED_DIR/forge-valuation-kernel-producer-manifest.json" >> "$GITHUB_ENV"
          echo "BACKEND LEGAL WALL: technical artifact approval is not backend distribution-license approval." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "COMPLIANCE_RUN_ID=$COMPLIANCE_RUN_ID"
            echo "COMPLIANCE_RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$COMPLIANCE_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Enforce protected backend distribution approval binding
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            BACKEND_DISTRIBUTION_APPROVAL_ID \
            BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA \
            BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST \
            BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256; do
            if [ -z "${!required:-}" ]; then
              echo "Missing protected environment approval binding: ${required}"
              exit 1
            fi
          done
          if [[ ! "$BACKEND_DISTRIBUTION_APPROVAL_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$ ]]; then
            echo "BACKEND_DISTRIBUTION_APPROVAL_ID has an invalid format"
            exit 1
          fi
          [[ "$BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA" = "$RELEASE_SHA"
          test "$BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST" = "$BACKEND_IMAGE_DIGEST"
          test "$BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256" = "$BACKEND_LICENSE_EVIDENCE_SHA256"
          echo "BACKEND_DISTRIBUTION_APPROVAL_VALIDATED=true" >> "$GITHUB_ENV"
          echo "Backend distribution approval is exactly bound to this release SHA, backend digest, and license-evidence hash." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate environment configuration
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TF_AUTH_BOOTSTRAP_EMAIL: ${{ secrets.TF_AUTH_BOOTSTRAP_EMAIL }}
          TF_AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.TF_AUTH_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/${TARGET_ENV}}"
          PUBLIC_URL="${PUBLIC_URL%/}"

          for required in DEPLOY_HOST DEPLOY_USER PUBLIC_URL DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS TF_AUTH_BOOTSTRAP_EMAIL TF_AUTH_BOOTSTRAP_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required environment configuration: ${required}"
              exit 1
            fi
          done

          PUBLIC_HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"
          DEPLOYED_AT="$(date -u +%FT%TZ)"
          case "$TARGET_ENV" in
            staging) ASPNETCORE_ENV_LABEL="Staging" ;;
            production) ASPNETCORE_ENV_LABEL="Production" ;;
            *)
              echo "Unsupported TARGET_ENV for ASPNETCORE_ENV_LABEL: $TARGET_ENV"
              exit 1
              ;;
          esac

          {
            printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT"
            printf 'APP_ROOT=%s\n' "$APP_ROOT"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST"
            printf 'DEPLOYED_AT=%s\n' "$DEPLOYED_AT"
            printf 'ASPNETCORE_ENV_LABEL=%s\n' "$ASPNETCORE_ENV_LABEL"
          } >> "$GITHUB_ENV"

      - name: Configure pinned SSH host trust
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          if ! ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f ~/.ssh/known_hosts >/dev/null &&
             ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "Protected DEPLOY_SSH_KNOWN_HOSTS does not contain the deployment host"
            exit 1
          fi

          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Preflight - public DNS resolution
        shell: bash
        run: |
          set -euo pipefail
          nslookup "$PUBLIC_HOST"
          echo "DNS resolved OK"

      - name: Preflight - remote host access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "SSH preflight attempt $attempt/3..."
            set +e
            ssh -o ConnectTimeout=30 -o ServerAliveInterval=15 \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
                "APP_ROOT='$APP_ROOT' TARGET_ENV='$TARGET_ENV' bash -s" <<'SSH'
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version >/dev/null
          test -d "$APP_ROOT"
          test -w "$APP_ROOT"
          test -f "$APP_ROOT/app.env"
          if ! grep -q '^ConnectionStrings__DefaultConnection=' "$APP_ROOT/app.env"; then
            echo "APP_ENV_MISSING_CONNECTION_STRING"
            exit 1
          fi
          if ! grep -q '^DatabaseProvider=' "$APP_ROOT/app.env"; then
            echo "APP_ENV_MISSING_DATABASE_PROVIDER"
            exit 1
          fi

          provider="$(grep '^DatabaseProvider=' "$APP_ROOT/app.env" | tail -n1 | cut -d= -f2- | tr -d '\r' | xargs)"
          provider_key="$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]')"
          connection="$(grep '^ConnectionStrings__DefaultConnection=' "$APP_ROOT/app.env" | tail -n1 | cut -d= -f2- | tr -d '\r')"
          connection_key="$(printf '%s' "$connection" | tr '[:upper:]' '[:lower:]')"

          if [ "$TARGET_ENV" = "production" ]; then
            case "$provider_key" in
              postgres|postgresql|npgsql) ;;
              sqlite)
                echo "APP_ENV_PRODUCTION_DB_PROVIDER_SQLITE"
                exit 1
                ;;
              *)
                echo "APP_ENV_PRODUCTION_DB_PROVIDER_UNSUPPORTED_FOR_RELEASE_LANE"
                exit 1
                ;;
            esac

            case "$connection_key" in
              *"data source="*".db"*|*"data source="*"/app/data/"*|*"data source="*"\\app\\data\\"*)
                echo "APP_ENV_PRODUCTION_DB_CONNECTION_SQLITE"
                exit 1
                ;;
            esac

            case "$connection_key" in
              *"host="*|*"server="*) ;;
              *)
                echo "APP_ENV_PRODUCTION_DB_CONNECTION_NOT_SERVER_BACKED"
                exit 1
                ;;
            esac
          fi
          SSH
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              echo "SSH preflight succeeded on attempt $attempt"
              exit 0
            fi
            echo "SSH attempt $attempt failed (exit $rc), waiting 15s..."
            sleep 15
          done
          echo "ERROR: SSH preflight failed after 3 attempts"
          exit 1

      - name: Reverify immutable candidate before packaging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CHECKED_OUT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime evidence curl_headers.txt
          mkdir -p runtime/docs/spec-lock runtime/config
          cp ops/proxy/Caddyfile runtime/Caddyfile
          cp ops/prod/runtime-compose.template.yml runtime/runtime-compose.yml
          cp -R docs/spec-lock/. runtime/docs/spec-lock/
          cp sovereign.yaml runtime/sovereign.yaml
          if ! grep -q './sovereign.yaml:/app/sovereign.yaml:ro' runtime/runtime-compose.yml; then
            sed -i '/- \.\/docs\/spec-lock:\/app\/docs\/spec-lock:ro/a\      - ./sovereign.yaml:/app/sovereign.yaml:ro' runtime/runtime-compose.yml
          fi
          sed -i "s/ASPNETCORE_ENVIRONMENT: Production/ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV_LABEL}/" runtime/runtime-compose.yml
          if [ "$TARGET_ENV" = "staging" ]; then
            cat > runtime/config/appsettings.Staging.json <<'EOF'
          {}
          EOF
            sed -i '/- \.\/docs\/spec-lock:\/app\/docs\/spec-lock:ro/a\      - ./config/appsettings.Staging.json:/app/appsettings.Staging.json:ro' runtime/runtime-compose.yml
          fi


          cat > runtime/release.env <<EOF
          COMPOSE_PROJECT_NAME=terrafusion-${TARGET_ENV}
          TF_RELEASE_SHA=${RELEASE_SHA}
          TF_RELEASE_ENV=${TARGET_ENV}
          TF_SKIP_AUTO_MIGRATE=false
          TF_AUTO_MIGRATE_MODE=validate-only
          TF_RELEASE_DEPLOYED_AT=${DEPLOYED_AT}
          TF_PUBLIC_URL=${PUBLIC_URL}
          TF_PUBLIC_HOST=${PUBLIC_HOST}
          TF_BACKEND_IMAGE=${BACKEND_IMAGE_REF}
          TF_FRONTEND_IMAGE=${FRONTEND_IMAGE_REF}
          EOF

      - name: Preserve exact current artifact bundle for rollback
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' RUN_ID='$GITHUB_RUN_ID' bash -s" <<'SSH'
          set -euo pipefail

          validate_artifact_env() {
            local env_file="$1"
            local expected_sha="$2"
            local backend frontend
            test "$(sed -n 's/^TF_RELEASE_SHA=//p' "$env_file")" = "$expected_sha"
            backend="$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$env_file")"
            frontend="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$env_file")"
            [[ "$backend" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-backend-internal@sha256:[0-9a-f]{64}$ ]]
            [[ "$frontend" =~ ^ghcr\.io/[a-z0-9_.-]+/terrafusion-os-frontend-internal@sha256:[0-9a-f]{64}$ ]]
            ! grep -qE '^(TERRAFUSION_BOOTSTRAP_|.*PASSWORD|.*TOKEN|.*SECRET)' "$env_file"
          }

          resolve_running_ref() {
            local service="$1"
            local configured_ref="$2"
            if [[ "$configured_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              printf '%s\n' "$configured_ref"
              return
            fi
            local image_base container_id image_id resolved
            image_base="${configured_ref%:*}"
            container_id="$(docker compose -f "$APP_ROOT/runtime-compose.yml" --env-file "$APP_ROOT/release.env" ps -q "$service")"
            test -n "$container_id"
            image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
            resolved="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image_id" | grep -F "${image_base}@sha256:" | grep -E '@sha256:[0-9a-f]{64}$' | head -n1)"
            test -n "$resolved"
            printf '%s\n' "$resolved"
          }

          validate_snapshot() {
            local snapshot="$1"
            local sha="$2"
            for file in release.sha artifact.env runtime-compose.yml Caddyfile sovereign.yaml; do
              test -f "$snapshot/$file"
            done
            test -d "$snapshot/docs/spec-lock"
            test -d "$snapshot/config"
            test "$(cat "$snapshot/release.sha")" = "$sha"
            validate_artifact_env "$snapshot/artifact.env" "$sha"
          }

          TARGET_SNAPSHOT="$APP_ROOT/releases/$RELEASE_SHA"
          if [ -e "$TARGET_SNAPSHOT" ]; then
            validate_snapshot "$TARGET_SNAPSHOT" "$RELEASE_SHA"
            test "$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$TARGET_SNAPSHOT/artifact.env")" = "$BACKEND_IMAGE_REF"
            test "$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$TARGET_SNAPSHOT/artifact.env")" = "$FRONTEND_IMAGE_REF"
          fi

          if [ ! -f "$APP_ROOT/current.sha" ]; then
            exit 0
          fi
          CURRENT_SHA="$(cat "$APP_ROOT/current.sha")"
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          SNAPSHOT_ROOT="$APP_ROOT/releases/$CURRENT_SHA"
          if [ -e "$SNAPSHOT_ROOT" ]; then
            validate_snapshot "$SNAPSHOT_ROOT" "$CURRENT_SHA"
            exit 0
          fi

          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$APP_ROOT/$file"
          done
          test -d "$APP_ROOT/docs/spec-lock"
          CURRENT_BACKEND="$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$APP_ROOT/release.env")"
          CURRENT_FRONTEND="$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$APP_ROOT/release.env")"
          RESOLVED_BACKEND="$(resolve_running_ref backend "$CURRENT_BACKEND")"
          RESOLVED_FRONTEND="$(resolve_running_ref frontend "$CURRENT_FRONTEND")"
          if [ "$CURRENT_SHA" = "$RELEASE_SHA" ]; then
            test "$RESOLVED_BACKEND" = "$BACKEND_IMAGE_REF"
            test "$RESOLVED_FRONTEND" = "$FRONTEND_IMAGE_REF"
          fi

          INCOMING="$APP_ROOT/releases/.incoming-$CURRENT_SHA-$RUN_ID"
          test ! -e "$INCOMING"
          install -d -m 0700 "$INCOMING/docs/spec-lock" "$INCOMING/config"
          printf '%s\n' "$CURRENT_SHA" > "$INCOMING/release.sha"
          awk -F= '/^(COMPOSE_PROJECT_NAME|TF_RELEASE_SHA|TF_RELEASE_ENV|TF_SKIP_AUTO_MIGRATE|TF_AUTO_MIGRATE_MODE|TF_RELEASE_DEPLOYED_AT|TF_PUBLIC_URL|TF_PUBLIC_HOST)=/ { print }' \
            "$APP_ROOT/release.env" > "$INCOMING/artifact.env"
          printf 'TF_BACKEND_IMAGE=%s\nTF_FRONTEND_IMAGE=%s\n' "$RESOLVED_BACKEND" "$RESOLVED_FRONTEND" >> "$INCOMING/artifact.env"
          for file in runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$APP_ROOT/$file" "$INCOMING/$file"
          done
          cp -a "$APP_ROOT/docs/spec-lock/." "$INCOMING/docs/spec-lock/"
          if [ -d "$APP_ROOT/config" ]; then
            cp -a "$APP_ROOT/config/." "$INCOMING/config/"
          fi
          chmod 0600 "$INCOMING/release.sha" "$INCOMING/artifact.env"
          validate_snapshot "$INCOMING" "$CURRENT_SHA"
          mv "$INCOMING" "$SNAPSHOT_ROOT"
          SSH

      - name: Stage and validate exact runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          RUN_TOKEN="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          INCOMING="$APP_ROOT/.release-incoming-$RUN_TOKEN"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test ! -e '$INCOMING' && install -d -m 0700 '$INCOMING'"
          scp -P "$DEPLOY_PORT" -r runtime/. "$DEPLOY_USER@$DEPLOY_HOST:$INCOMING/"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' INCOMING='$INCOMING' bash -s" <<'SSH'
          set -euo pipefail
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$INCOMING/$file"
          done
          test -d "$INCOMING/docs/spec-lock"
          test -d "$INCOMING/config"
          ln -s "$APP_ROOT/app.env" "$INCOMING/app.env"
          trap 'rm -f "$INCOMING/app.env"' EXIT
          docker compose -f "$INCOMING/runtime-compose.yml" --env-file "$INCOMING/release.env" config >/dev/null
          SSH
          {
            echo "RUNTIME_MUTATION_ARMED=true"
            echo "RUNTIME_RUN_TOKEN=$RUN_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Verify shared edge proxy is already governed
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'SSH'
          set -euo pipefail
          test -f /opt/terrafusion/edge-proxy/docker-compose.yml
          test -f /opt/terrafusion/edge-proxy/Caddyfile
          docker network inspect terrafusion-edge >/dev/null 2>&1 || docker network create terrafusion-edge
          cd /opt/terrafusion/edge-proxy
          docker compose up -d
          SSH

      - name: Preflight - GHCR pull on VPS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate deploy user to GHCR (token is short-lived, expires after workflow run)
          # Pipe token directly to docker login (no 'cat' intermediary — it hangs on SSH EOF).
          # Trailing newline ensures --password-stdin reads the complete token immediately.
          printf '%s\n' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null 2>&1
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' bash -s" <<'SSH'
          set -euo pipefail

          print_release_disk() {
            echo "Docker disk usage:"
            docker system df || true

            local docker_root
            docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"

            echo "Filesystem free space:"
            for path in "$docker_root" /var/lib/containerd /; do
              if [ -e "$path" ]; then
                df -h "$path" || true
              fi
            done
          }

          available_kb_for_path() {
            local path="$1"
            local available

            if [ -z "$path" ] || [ ! -e "$path" ]; then
              echo 0
              return
            fi

            available="$(df -Pk "$path" 2>/dev/null | awk 'NR==2 && $4 ~ /^[0-9]+$/ {print $4}' || true)"
            if [ -z "$available" ]; then
              echo 0
              return
            fi

            echo "$available"
          }

          require_release_disk() {
            local min_kb="${MIN_RELEASE_DISK_KB:-6291456}"
            local docker_root
            local docker_kb
            local containerd_kb

            docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)"
            docker_kb="$(available_kb_for_path "$docker_root")"
            containerd_kb="$(available_kb_for_path /var/lib/containerd)"

            if [ "$docker_kb" -lt "$min_kb" ] && [ "$containerd_kb" -lt "$min_kb" ]; then
              echo "ERROR: VPS does not have enough Docker/containerd disk for release image pull."
              echo "Required free space on Docker root or /var/lib/containerd: ${min_kb} KiB."
              echo "Observed Docker root (${docker_root:-unknown}) free: ${docker_kb} KiB."
              echo "Observed /var/lib/containerd free: ${containerd_kb} KiB."
              print_release_disk
              exit 1
            fi
          }

          echo "Release disk state before safe cleanup:"
          print_release_disk

          # Safe release cleanup only. This removes stopped containers, build
          # cache, dangling layers, and unused images older than 24h. It does
          # not prune Docker volumes or application data.
          docker container prune -f || true
          docker image prune -f || true
          docker image prune -af --filter "until=24h" || true

          echo "Release disk state after safe cleanup:"
          print_release_disk
          require_release_disk

          echo "Pulling backend image..."
          docker pull "$BACKEND_IMAGE_REF"
          echo "Pulling frontend image..."
          docker pull "$FRONTEND_IMAGE_REF"
          SSH

      - name: Deploy staged runtime bundle transactionally
        id: deploy-runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' RUN_TOKEN='$RUNTIME_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          INCOMING="$APP_ROOT/.release-incoming-$RUN_TOKEN"
          BACKUP="$APP_ROOT/.release-backup-$RUN_TOKEN"
          test -d "$INCOMING"
          test ! -e "$BACKUP"
          install -d -m 0700 "$BACKUP"
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$file"
            install -m 0600 "$file" "$BACKUP/$file"
          done
          test -d docs/spec-lock
          test -d config
          cp -a docs/spec-lock "$BACKUP/spec-lock"
          cp -a config "$BACKUP/config"
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$BACKUP/$file"
          done
          test -d "$BACKUP/spec-lock"
          test -d "$BACKUP/config"
          if [ -f requested.sha ]; then
            install -m 0600 requested.sha "$BACKUP/requested.sha"
          else
            touch "$BACKUP/requested.absent"
          fi
          test -f "$BACKUP/requested.sha" || test -f "$BACKUP/requested.absent"
          touch "$BACKUP/backup.ready"

          restore_previous() {
            trap - ERR HUP INT TERM
            set +e
            failed=0
            rm -rf docs/spec-lock config || failed=1
            cp -a "$BACKUP/spec-lock" docs/spec-lock || failed=1
            cp -a "$BACKUP/config" config || failed=1
            for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
              install -m 0600 "$BACKUP/$file" "$file" || failed=1
            done
            if [ -f "$BACKUP/requested.sha" ]; then
              install -m 0600 "$BACKUP/requested.sha" requested.sha || failed=1
            elif [ -f "$BACKUP/requested.absent" ]; then
              rm -f requested.sha || failed=1
            else
              failed=1
            fi
            docker compose -f runtime-compose.yml --env-file release.env config >/dev/null || failed=1
            docker compose -f runtime-compose.yml --env-file release.env pull || failed=1
            docker compose -f runtime-compose.yml --env-file release.env up -d || failed=1
            if [ "$failed" -ne 0 ]; then
              echo "Automatic restore failed; preserving $BACKUP for governed recovery" >&2
              exit 1
            fi
            rm -rf "$INCOMING" "$BACKUP"
            exit 1
          }
          trap restore_previous ERR HUP INT TERM

          rm -rf docs/spec-lock config
          mv "$INCOMING/docs/spec-lock" docs/spec-lock
          mv "$INCOMING/config" config
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$INCOMING/$file" "$file"
          done
          printf '%s\n' "$RELEASE_SHA" > requested.sha
          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null
          docker compose -f runtime-compose.yml --env-file release.env pull
          docker compose -f runtime-compose.yml --env-file release.env up -d
          BACKEND_CONTAINER="$(docker compose -f runtime-compose.yml --env-file release.env ps -q backend)"
          test -n "$BACKEND_CONTAINER"
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$BACKEND_CONTAINER" \
            | grep -Fx 'TF_SKIP_AUTO_MIGRATE=false'
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$BACKEND_CONTAINER" \
            | grep -Fx 'TF_AUTO_MIGRATE_MODE=validate-only'
          trap - ERR HUP INT TERM
          SSH

      - name: Verify public health and release header
        shell: bash
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL}/health"
          success=0

          for attempt in $(seq 1 18); do
            if curl -fsS -o /dev/null -D curl_headers.txt "$URL" 2>/dev/null; then
              HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
              if [ "$HEADER_SHA" = "$RELEASE_SHA" ]; then
                success=1
                break
              fi
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "--- Diagnostic: verbose public curl ---"
              curl -vk "$URL" 2>&1 | head -40 || true
              echo "--- End diagnostic ---"
            fi

            echo "Waiting for $URL to report X-Release-Sha=$RELEASE_SHA (attempt $attempt/18)"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Health endpoint never reported the requested release SHA."
            exit 1
          fi

          grep -iE '^HTTP/.* 200' curl_headers.txt

      - name: Verify migration validation executed
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color backend" \
            | grep -F 'AutoMigrate validate-only: no pending migrations'

      - name: Shell route contract smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Shell route contract smoke ==="

          # Derive the public host from the same PUBLIC_URL env var used by the health check step
          HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"

          probe() {
            local path="$1"
            local status
            status=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 "https://${HOST}${path}" 2>/dev/null || echo "000")
            echo "  $path -> HTTP $status"
            if [[ "$status" =~ ^[23] ]]; then
              echo "  OK"
            else
              echo "::error::Shell route smoke failed: $path returned HTTP $status"
              exit 1
            fi
          }

          probe "/"
          probe "/property"
          echo "Shell route contract intact after deploy"

      - name: Protected account read-only verifier smoke
        shell: bash
        env:
          TF_RELEASE_SMOKE_EMAIL: ${{ secrets.TF_AUTH_BOOTSTRAP_EMAIL }}
          TF_RELEASE_SMOKE_PASSWORD: ${{ secrets.TF_AUTH_BOOTSTRAP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Protected account read-only verifier smoke ==="

          POLICY_JSON="$(curl -fsS --max-time 10 "${PUBLIC_URL}/api/auth/access-policy")"
          POLICY_JSON="$POLICY_JSON" node <<'NODE'
          const policy = JSON.parse(process.env.POLICY_JSON || "{}");
          if (policy.signupMode !== "provisioned_access_only") {
            throw new Error(`Expected signupMode=provisioned_access_only, got ${policy.signupMode}`);
          }
          if (policy.publicSignupEnabled !== false) {
            throw new Error("Expected publicSignupEnabled=false");
          }
          console.log("Access policy is provisioned-access-only");
          NODE

          if [ -z "$TF_RELEASE_SMOKE_EMAIL" ] || [ -z "$TF_RELEASE_SMOKE_PASSWORD" ]; then
            echo "::error::Protected account verifier secrets are not configured."
            exit 1
          fi

          printf -v SMOKE_EMAIL_Q '%q' "$TF_RELEASE_SMOKE_EMAIL"
          if ! printf '%s\n' "$TF_RELEASE_SMOKE_PASSWORD" | ssh -T -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env run -T --no-deps --entrypoint dotnet backend /app/tools/TerraFusion.AuthProvisioner/TerraFusion.AuthProvisioner.dll --verify-only --password-stdin --email $SMOKE_EMAIL_Q"; then
            echo "::error::Protected account read-only verification failed."
            exit 1
          fi
          echo "Protected account credentials verified without creating a session or mutating auth state"

      - name: Finalize immutable artifact snapshot and current SHA
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' BACKEND_IMAGE_REF='$BACKEND_IMAGE_REF' FRONTEND_IMAGE_REF='$FRONTEND_IMAGE_REF' RUN_ID='$GITHUB_RUN_ID' RUN_TOKEN='$RUNTIME_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          test "$(cat requested.sha)" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_RELEASE_SHA=//p' release.env)" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_BACKEND_IMAGE=//p' release.env)" = "$BACKEND_IMAGE_REF"
          test "$(sed -n 's/^TF_FRONTEND_IMAGE=//p' release.env)" = "$FRONTEND_IMAGE_REF"
          ! grep -qE '^(TERRAFUSION_BOOTSTRAP_|.*PASSWORD|.*TOKEN|.*SECRET)' release.env

          SNAPSHOT_ROOT="$APP_ROOT/releases/$RELEASE_SHA"
          if [ ! -e "$SNAPSHOT_ROOT" ]; then
            INCOMING="$APP_ROOT/releases/.incoming-$RELEASE_SHA-$RUN_ID"
            test ! -e "$INCOMING"
            install -d -m 0700 "$INCOMING/docs/spec-lock" "$INCOMING/config"
            printf '%s\n' "$RELEASE_SHA" > "$INCOMING/release.sha"
            install -m 0600 release.env "$INCOMING/artifact.env"
            for file in runtime-compose.yml Caddyfile sovereign.yaml; do
              install -m 0600 "$file" "$INCOMING/$file"
            done
            cp -a docs/spec-lock/. "$INCOMING/docs/spec-lock/"
            cp -a config/. "$INCOMING/config/"
            chmod 0600 "$INCOMING/release.sha"
            mv "$INCOMING" "$SNAPSHOT_ROOT"
          fi
          for file in release.sha artifact.env runtime-compose.yml Caddyfile sovereign.yaml; do
            test -f "$SNAPSHOT_ROOT/$file"
          done
          test "$(cat "$SNAPSHOT_ROOT/release.sha")" = "$RELEASE_SHA"
          test "$(sed -n 's/^TF_BACKEND_IMAGE=//p' "$SNAPSHOT_ROOT/artifact.env")" = "$BACKEND_IMAGE_REF"
          test "$(sed -n 's/^TF_FRONTEND_IMAGE=//p' "$SNAPSHOT_ROOT/artifact.env")" = "$FRONTEND_IMAGE_REF"
          printf '%s\n' "$RELEASE_SHA" > current.sha
          rm -rf "$APP_ROOT/.release-incoming-$RUN_TOKEN" "$APP_ROOT/.release-backup-$RUN_TOKEN"
          SSH

      - name: Restore prior runtime if deployment did not commit
        if: (failure() || cancelled()) && env.RUNTIME_MUTATION_ARMED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' RUN_TOKEN='$RUNTIME_RUN_TOKEN' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          if [ -f current.sha ] && [ "$(cat current.sha)" = "$RELEASE_SHA" ]; then
            exit 0
          fi
          BACKUP="$APP_ROOT/.release-backup-$RUN_TOKEN"
          INCOMING="$APP_ROOT/.release-incoming-$RUN_TOKEN"
          if [ ! -e "$BACKUP" ]; then
            exit 0
          fi
          if [ ! -f "$BACKUP/backup.ready" ]; then
            echo "Incomplete release backup retained at $BACKUP; live state was not mutated" >&2
            exit 1
          fi
          set +e
          failed=0
          rm -rf docs/spec-lock config || failed=1
          cp -a "$BACKUP/spec-lock" docs/spec-lock || failed=1
          cp -a "$BACKUP/config" config || failed=1
          for file in release.env runtime-compose.yml Caddyfile sovereign.yaml; do
            install -m 0600 "$BACKUP/$file" "$file" || failed=1
          done
          if [ -f "$BACKUP/requested.sha" ]; then
            install -m 0600 "$BACKUP/requested.sha" requested.sha || failed=1
          elif [ -f "$BACKUP/requested.absent" ]; then
            rm -f requested.sha || failed=1
          else
            failed=1
          fi
          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null || failed=1
          docker compose -f runtime-compose.yml --env-file release.env pull || failed=1
          docker compose -f runtime-compose.yml --env-file release.env up -d || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "Release recovery failed; preserving $BACKUP for governed recovery" >&2
            exit 1
          fi
          rm -rf "$INCOMING" "$BACKUP"
          SSH
      - name: Verify requested/current/header invariant
        shell: bash
        run: |
          set -euo pipefail
          HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
          REQUESTED_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/requested.sha'")"
          CURRENT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/current.sha'")"

          test "$REQUESTED_SHA" = "$RELEASE_SHA"
          test "$CURRENT_SHA" = "$RELEASE_SHA"
          test "$HEADER_SHA" = "$RELEASE_SHA"

          {
            printf 'REQUESTED_SHA=%s\n' "$REQUESTED_SHA"
            printf 'CURRENT_SHA=%s\n' "$CURRENT_SHA"
            printf 'HEADER_SHA=%s\n' "$HEADER_SHA"
          } >> "$GITHUB_ENV"

      - name: Collect deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp curl_headers.txt evidence/curl_headers.txt

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env ps" > evidence/compose_ps.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "uptime" > evidence/uptime.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 backend" > evidence/logs_backend.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml --env-file release.env logs --no-color --tail=200 proxy" > evidence/logs_proxy.txt

          cat > evidence/evidence.txt <<EOF
          operation=deploy
          target_env=${TARGET_ENV}
          aspnetcore_environment=${ASPNETCORE_ENV_LABEL}
          public_url=${PUBLIC_URL}
          release_sha=${RELEASE_SHA}
          checked_out_sha=${CHECKED_OUT_SHA}
          candidate_tree_sha=${CANDIDATE_TREE_SHA}
          trusted_main_sha=${TRUSTED_MAIN_SHA}
          compliance_run_id=${COMPLIANCE_RUN_ID}
          compliance_run_url=${COMPLIANCE_RUN_URL}
          requested_sha=${REQUESTED_SHA}
          current_sha=${CURRENT_SHA}
          header_sha=${HEADER_SHA}
          backend_image=${BACKEND_IMAGE}
          backend_image_digest=${BACKEND_IMAGE_DIGEST}
          backend_image_ref=${BACKEND_IMAGE_REF}
          backend_distribution_approval_required=${BACKEND_DISTRIBUTION_APPROVAL_REQUIRED}
          backend_distribution_approval_validated=${BACKEND_DISTRIBUTION_APPROVAL_VALIDATED}
          backend_distribution_approval_id=${BACKEND_DISTRIBUTION_APPROVAL_ID}
          backend_distribution_approval_release_sha=${BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA}
          backend_distribution_approval_image_digest=${BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST}
          backend_distribution_approval_evidence_sha256=${BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256}
          backend_license_evidence_sha256=${BACKEND_LICENSE_EVIDENCE_SHA256}
          frontend_image=${FRONTEND_IMAGE}
          frontend_image_digest=${FRONTEND_IMAGE_DIGEST}
          frontend_image_ref=${FRONTEND_IMAGE_REF}
          forge_valuation_kernel_image=${FORGE_VALUATION_KERNEL_IMAGE}
          forge_valuation_kernel_digest=${FORGE_VALUATION_KERNEL_DIGEST}
          forge_valuation_kernel_ref=${FORGE_VALUATION_KERNEL_REF}
          forge_valuation_kernel_producer_commit=${FORGE_VALUATION_KERNEL_PRODUCER_COMMIT}
          forge_valuation_kernel_canonical_source_commit=${FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT}
          forge_valuation_kernel_producer_manifest_sha256=${FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_SHA256}
          forge_valuation_kernel_executable_sha256=${FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256}
          forge_valuation_kernel_platform_attestation=${FORGE_VALUATION_KERNEL_PLATFORM_ATTESTATION}
          forge_valuation_contract_crosscut_audit_sha256=3a098f290ed21fb1b713ae4879b407d045c26f73ac88d7b009a2496266b3b86c
          forge_valuation_contract_forge_valuation_sha256=0e7db3fa3e01db4ba446ae67dbd8266384834e31cbe5ee6e699e7a44ca6c75cc
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          deployed_at_utc=${DEPLOYED_AT}
          EOF

          cat > evidence/evidence.json <<EOF
          {
            "operation": "deploy",
            "targetEnv": "${TARGET_ENV}",
            "aspnetcoreEnvironment": "${ASPNETCORE_ENV_LABEL}",
            "publicUrl": "${PUBLIC_URL}",
            "releaseSha": "${RELEASE_SHA}",
            "checkedOutSha": "${CHECKED_OUT_SHA}",
            "candidateTreeSha": "${CANDIDATE_TREE_SHA}",
            "trustedMainSha": "${TRUSTED_MAIN_SHA}",
            "complianceRunId": "${COMPLIANCE_RUN_ID}",
            "complianceRunUrl": "${COMPLIANCE_RUN_URL}",
            "requestedSha": "${REQUESTED_SHA}",
            "currentSha": "${CURRENT_SHA}",
            "headerSha": "${HEADER_SHA}",
            "backendImage": "${BACKEND_IMAGE}",
            "backendImageDigest": "${BACKEND_IMAGE_DIGEST}",
            "backendImageRef": "${BACKEND_IMAGE_REF}",
            "backendDistributionApprovalRequired": true,
            "backendDistributionApprovalValidated": true,
            "backendDistributionApprovalId": "${BACKEND_DISTRIBUTION_APPROVAL_ID}",
            "backendDistributionApprovalReleaseSha": "${BACKEND_DISTRIBUTION_APPROVAL_RELEASE_SHA}",
            "backendDistributionApprovalImageDigest": "${BACKEND_DISTRIBUTION_APPROVAL_IMAGE_DIGEST}",
            "backendDistributionApprovalEvidenceSha256": "${BACKEND_DISTRIBUTION_APPROVAL_EVIDENCE_SHA256}",
            "backendLicenseEvidenceSha256": "${BACKEND_LICENSE_EVIDENCE_SHA256}",
            "frontendImage": "${FRONTEND_IMAGE}",
            "frontendImageDigest": "${FRONTEND_IMAGE_DIGEST}",
            "frontendImageRef": "${FRONTEND_IMAGE_REF}",
            "forgeValuationKernelImage": "${FORGE_VALUATION_KERNEL_IMAGE}",
            "forgeValuationKernelDigest": "${FORGE_VALUATION_KERNEL_DIGEST}",
            "forgeValuationKernelRef": "${FORGE_VALUATION_KERNEL_REF}",
            "forgeValuationKernelProducerCommit": "${FORGE_VALUATION_KERNEL_PRODUCER_COMMIT}",
            "forgeValuationKernelCanonicalSourceCommit": "${FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT}",
            "forgeValuationKernelProducerManifestSha256": "${FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_SHA256}",
            "forgeValuationKernelExecutableSha256": "${FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256}",
            "forgeValuationKernelPlatformAttestation": "${FORGE_VALUATION_KERNEL_PLATFORM_ATTESTATION}",
            "forgeValuationKernelContracts": {
              "crosscut.audit@1.0.0": "3a098f290ed21fb1b713ae4879b407d045c26f73ac88d7b009a2496266b3b86c",
              "forge.valuation@1.0.0": "0e7db3fa3e01db4ba446ae67dbd8266384834e31cbe5ee6e699e7a44ca6c75cc"
            },
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "deployedAtUtc": "${DEPLOYED_AT}"
          }
          EOF
          cp "$BACKEND_LICENSE_EVIDENCE_PATH" evidence/backend-runtime-license-evidence.json
          cp "$FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_PATH" evidence/forge-valuation-kernel-producer-manifest.json

      - name: Validate evidence schema
        shell: bash
        run: |
          set -euo pipefail
          for required in evidence.json evidence.txt backend-runtime-license-evidence.json forge-valuation-kernel-producer-manifest.json curl_headers.txt compose_ps.txt uptime.txt logs_backend.txt logs_proxy.txt; do
            test -s "evidence/$required"
          done

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const evidence = JSON.parse(fs.readFileSync('evidence/evidence.json', 'utf8'));
          const backendLicenseEvidence = fs.readFileSync(
            'evidence/backend-runtime-license-evidence.json'
          );
          const forgeProducerManifest = fs.readFileSync(
            'evidence/forge-valuation-kernel-producer-manifest.json'
          );
          const shaPattern = /^[0-9a-f]{40}$/;
          const digestPattern = /^sha256:[0-9a-f]{64}$/;

          if (!shaPattern.test(evidence.releaseSha)) {
            throw new Error('releaseSha is not a full git SHA');
          }
          for (const field of ['checkedOutSha', 'requestedSha', 'currentSha', 'headerSha']) {
            if (evidence[field] !== evidence.releaseSha) {
              throw new Error(`${field} does not match releaseSha`);
            }
          }
          if (evidence.backendDistributionApprovalRequired !== true) {
            throw new Error('backend distribution approval wall is missing');
          }
          if (
            evidence.backendDistributionApprovalValidated !== true ||
            !/^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$/.test(
              evidence.backendDistributionApprovalId ?? ''
            ) ||
            evidence.backendDistributionApprovalReleaseSha !== evidence.releaseSha ||
            evidence.backendDistributionApprovalImageDigest !== evidence.backendImageDigest ||
            evidence.backendDistributionApprovalEvidenceSha256 !==
              evidence.backendLicenseEvidenceSha256
          ) {
            throw new Error('backend distribution approval is not exactly bound to deploy evidence');
          }
          const backendEvidenceHash = crypto
            .createHash('sha256')
            .update(backendLicenseEvidence)
            .digest('hex');
          if (backendEvidenceHash !== evidence.backendLicenseEvidenceSha256) {
            throw new Error('backend license evidence is detached from deploy evidence');
          }
          const forgeManifestHash = crypto
            .createHash('sha256')
            .update(forgeProducerManifest)
            .digest('hex');
          const expectedForge = {
            image: 'ghcr.io/bsvalues/terrafusion-forge-valuation-kernel',
            digest: 'sha256:0701e52e2b48fe2ceb614ee3c8f3c26992425096f014a0995704fc04a7a70066',
            producerCommit: '3fc296da17aaca4c32dd9b727ab62d2d3725d789',
            canonicalSourceCommit: '24059c3642339f36877cb454ca63683180915b71',
            producerManifestSha256: '3d83a4a998eabb30b2993e6c777ae5924ca2a7e6f1bd915f7698606fd077fcd6',
            executableSha256: 'a371d8f421b66cd2f83073ed108c885facc97323f9a351547d7293259978c298',
          };
          if (
            evidence.forgeValuationKernelImage !== expectedForge.image ||
            evidence.forgeValuationKernelDigest !== expectedForge.digest ||
            evidence.forgeValuationKernelRef !== `${expectedForge.image}@${expectedForge.digest}` ||
            evidence.forgeValuationKernelProducerCommit !== expectedForge.producerCommit ||
            evidence.forgeValuationKernelCanonicalSourceCommit !== expectedForge.canonicalSourceCommit ||
            evidence.forgeValuationKernelProducerManifestSha256 !== expectedForge.producerManifestSha256 ||
            evidence.forgeValuationKernelExecutableSha256 !== expectedForge.executableSha256 ||
            forgeManifestHash !== expectedForge.producerManifestSha256 ||
            evidence.forgeValuationKernelPlatformAttestation !== 'unavailable' ||
            evidence.forgeValuationKernelContracts?.['crosscut.audit@1.0.0'] !==
              '3a098f290ed21fb1b713ae4879b407d045c26f73ac88d7b009a2496266b3b86c' ||
            evidence.forgeValuationKernelContracts?.['forge.valuation@1.0.0'] !==
              '0e7db3fa3e01db4ba446ae67dbd8266384834e31cbe5ee6e699e7a44ca6c75cc'
          ) {
            throw new Error('Forge valuation payload is detached from deploy evidence');
          }
          if (!shaPattern.test(evidence.candidateTreeSha)) {
            throw new Error('candidateTreeSha is not a full git tree SHA');
          }
          if (!shaPattern.test(evidence.trustedMainSha)) {
            throw new Error('trustedMainSha is not a full git SHA');
          }
          if (!/^[0-9]+$/.test(evidence.complianceRunId)) {
            throw new Error('complianceRunId is not numeric');
          }
          const expectedComplianceUrl =
            `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${evidence.complianceRunId}`;
          if (evidence.complianceRunUrl !== expectedComplianceUrl) {
            throw new Error('complianceRunUrl is not bound to complianceRunId');
          }
          for (const [imageField, digestField, refField] of [
            ['backendImage', 'backendImageDigest', 'backendImageRef'],
            ['frontendImage', 'frontendImageDigest', 'frontendImageRef'],
          ]) {
            if (!digestPattern.test(evidence[digestField])) {
              throw new Error(`${digestField} is not a registry image digest`);
            }
            if (evidence[refField] !== `${evidence[imageField]}@${evidence[digestField]}`) {
              throw new Error(`${refField} is not bound to the recorded image and digest`);
            }
          }
          NODE

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v7
        with:
          name: evidence-${{ inputs.target_env }}-${{ inputs.release_sha }}
          path: evidence/
          if-no-files-found: error
