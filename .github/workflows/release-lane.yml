name: release-lane

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Deploy target environment
        required: true
        type: choice
        options:
          - staging
          - production
      release_sha:
        description: Full git SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.release_sha }} to ${{ inputs.target_env }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_env }}
    env:
      TARGET_ENV: ${{ inputs.target_env }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout requested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Overlay deploy infrastructure from default branch
        shell: bash
        run: |
          set -euo pipefail
          # Deploy infrastructure (Caddyfile, compose template) lives on the default
          # branch and must match the pipeline expectations (service names, health
          # headers, etc.).  Always overlay from main — old release SHAs may have
          # incompatible versions (e.g. wrong service names in Caddyfile).
          git fetch origin main --no-tags --depth=1 2>/dev/null || true
          for path in ops/proxy/Caddyfile ops/prod/runtime-compose.template.yml frontend/Dockerfile backend/Dockerfile; do
            dir="$(dirname "$path")"
            mkdir -p "$dir"
            echo "Overlaying $path from origin/main"
            git show "origin/main:$path" > "$path"
          done

          # Old SHAs restore from TerraFusion.sln which requires test projects
          # that are excluded by .dockerignore.  Switch to project-level restore
          # which resolves transitive deps without needing test .csproj files.
          if grep -q 'dotnet restore TerraFusion.sln' backend/Dockerfile; then
            echo "Patching Dockerfile: sln restore → project restore"
            sed -i 's|dotnet restore TerraFusion\.sln|dotnet restore src/TerraFusion.API/TerraFusion.API.csproj|g' backend/Dockerfile
          fi

      - name: Validate environment configuration
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/${TARGET_ENV}}"
          PUBLIC_URL="${PUBLIC_URL%/}"

          for required in DEPLOY_HOST DEPLOY_USER PUBLIC_URL DEPLOY_SSH_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "Missing required environment configuration: ${required}"
              exit 1
            fi
          done

          PUBLIC_HOST="$(node -e "const url = new URL(process.env.PUBLIC_URL); process.stdout.write(url.hostname);")"
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BACKEND_IMAGE="ghcr.io/${OWNER}/terrafusion-os-backend:${RELEASE_SHA}"
          FRONTEND_IMAGE="ghcr.io/${OWNER}/terrafusion-os-frontend:${RELEASE_SHA}"
          DEPLOYED_AT="$(date -u +%FT%TZ)"

          {
            printf 'DEPLOY_PORT=%s\n' "$DEPLOY_PORT"
            printf 'APP_ROOT=%s\n' "$APP_ROOT"
            printf 'PUBLIC_URL=%s\n' "$PUBLIC_URL"
            printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST"
            printf 'OWNER=%s\n' "$OWNER"
            printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE"
            printf 'FRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE"
            printf 'DEPLOYED_AT=%s\n' "$DEPLOYED_AT"
          } >> "$GITHUB_ENV"

      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Keyscan with retries — GitHub Actions runners sometimes need
          # longer to reach Hostinger VPS (NAT, firewalls, transient DNS).
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done

          # Fallback: if keyscan still failed, accept new keys on first connect
          if ! grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts 2>/dev/null; then
            echo "WARNING: ssh-keyscan returned no keys; using StrictHostKeyChecking=accept-new"
            printf 'Host %s\n  StrictHostKeyChecking accept-new\n' "$DEPLOY_HOST" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          fi

      - name: Preflight - public DNS resolution
        shell: bash
        run: |
          set -euo pipefail
          nslookup "$PUBLIC_HOST"

      - name: Preflight - remote host access
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'SSH'
          set -euo pipefail
          command -v docker >/dev/null
          docker compose version >/dev/null
          test -d "$APP_ROOT"
          test -w "$APP_ROOT"
          test -f "$APP_ROOT/app.env"
          SSH

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --target runtime -f backend/Dockerfile -t "$BACKEND_IMAGE" backend
          docker push "$BACKEND_IMAGE"

      - name: Build and push frontend image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --target production -f frontend/Dockerfile -t "$FRONTEND_IMAGE" .
          docker push "$FRONTEND_IMAGE"

      - name: Prepare runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime evidence curl_headers.txt
          mkdir -p runtime/docs/spec-lock
          cp ops/proxy/Caddyfile runtime/Caddyfile
          cp ops/prod/runtime-compose.template.yml runtime/runtime-compose.yml
          cp -R docs/spec-lock/. runtime/docs/spec-lock/

          cat > runtime/release.env <<EOF
          COMPOSE_PROJECT_NAME=terrafusion-${TARGET_ENV}
          TF_RELEASE_SHA=${RELEASE_SHA}
          TF_RELEASE_ENV=${TARGET_ENV}
          TF_RELEASE_DEPLOYED_AT=${DEPLOYED_AT}
          TF_PUBLIC_URL=${PUBLIC_URL}
          TF_PUBLIC_HOST=${PUBLIC_HOST}
          TF_BACKEND_IMAGE=${BACKEND_IMAGE}
          TF_FRONTEND_IMAGE=${FRONTEND_IMAGE}
          EOF

      - name: Upload runtime bundle to VPS
        shell: bash
        run: |
          set -euo pipefail
          scp -P "$DEPLOY_PORT" -r runtime/* "$DEPLOY_USER@$DEPLOY_HOST:$APP_ROOT/"

      - name: Preflight - GHCR pull on VPS
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Authenticate deploy user to GHCR (token is short-lived, expires after workflow run)
          # Pipe token directly to docker login (no 'cat' intermediary — it hangs on SSH EOF).
          # Trailing newline ensures --password-stdin reads the complete token immediately.
          printf '%s\n' "$GHCR_TOKEN" | ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin" >/dev/null 2>&1
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "BACKEND_IMAGE='$BACKEND_IMAGE' FRONTEND_IMAGE='$FRONTEND_IMAGE' bash -s" <<'SSH'
          set -euo pipefail
          echo "Pulling backend image..."
          docker pull "$BACKEND_IMAGE"
          echo "Pulling frontend image..."
          docker pull "$FRONTEND_IMAGE"
          SSH

      - name: Deploy runtime bundle on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          install -d data docs/spec-lock
          printf '%s\n' "$RELEASE_SHA" > requested.sha
          if [ -f current.sha ]; then
            cp current.sha previous.sha
          fi

          docker compose -f runtime-compose.yml --env-file release.env config >/dev/null
          docker compose -f runtime-compose.yml --env-file release.env pull
          docker compose -f runtime-compose.yml --env-file release.env up -d
          SSH

      - name: Verify public health and release header
        shell: bash
        run: |
          set -euo pipefail
          URL="${PUBLIC_URL}/health"
          success=0

          for attempt in $(seq 1 18); do
            if curl -fsS -o /dev/null -D curl_headers.txt "$URL"; then
              HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
              if [ "$HEADER_SHA" = "$RELEASE_SHA" ]; then
                success=1
                break
              fi
            fi

            echo "Waiting for $URL to report X-Release-Sha=$RELEASE_SHA (attempt $attempt/18)"
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Health endpoint never reported the requested release SHA."
            exit 1
          fi

          grep -iE '^HTTP/.* 200' curl_headers.txt

      - name: Finalize current SHA on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'SSH'
          set -euo pipefail
          cd "$APP_ROOT"
          test "$(cat requested.sha)" = "$RELEASE_SHA"
          printf '%s\n' "$RELEASE_SHA" > current.sha
          SSH

      - name: Verify requested/current/header invariant
        shell: bash
        run: |
          set -euo pipefail
          HEADER_SHA="$(awk 'BEGIN{IGNORECASE=1} /^x-release-sha:/ {print $2}' curl_headers.txt | tr -d '\r')"
          REQUESTED_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/requested.sha'")"
          CURRENT_SHA="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cat '$APP_ROOT/current.sha'")"

          test "$REQUESTED_SHA" = "$RELEASE_SHA"
          test "$CURRENT_SHA" = "$RELEASE_SHA"
          test "$HEADER_SHA" = "$RELEASE_SHA"

          {
            printf 'REQUESTED_SHA=%s\n' "$REQUESTED_SHA"
            printf 'CURRENT_SHA=%s\n' "$CURRENT_SHA"
            printf 'HEADER_SHA=%s\n' "$HEADER_SHA"
          } >> "$GITHUB_ENV"

      - name: Collect deploy evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp curl_headers.txt evidence/curl_headers.txt

          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml ps" > evidence/compose_ps.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "uptime" > evidence/uptime.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml logs --no-color --tail=200 backend" > evidence/logs_backend.txt
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$APP_ROOT' && docker compose -f runtime-compose.yml logs --no-color --tail=200 proxy" > evidence/logs_proxy.txt

          cat > evidence/evidence.txt <<EOF
          operation=deploy
          target_env=${TARGET_ENV}
          public_url=${PUBLIC_URL}
          release_sha=${RELEASE_SHA}
          requested_sha=${REQUESTED_SHA}
          current_sha=${CURRENT_SHA}
          header_sha=${HEADER_SHA}
          backend_image=${BACKEND_IMAGE}
          frontend_image=${FRONTEND_IMAGE}
          workflow_run_id=${GITHUB_RUN_ID}
          workflow_run_attempt=${GITHUB_RUN_ATTEMPT}
          deployed_at_utc=${DEPLOYED_AT}
          EOF

          cat > evidence/evidence.json <<EOF
          {
            "operation": "deploy",
            "targetEnv": "${TARGET_ENV}",
            "publicUrl": "${PUBLIC_URL}",
            "releaseSha": "${RELEASE_SHA}",
            "requestedSha": "${REQUESTED_SHA}",
            "currentSha": "${CURRENT_SHA}",
            "headerSha": "${HEADER_SHA}",
            "backendImage": "${BACKEND_IMAGE}",
            "frontendImage": "${FRONTEND_IMAGE}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "deployedAtUtc": "${DEPLOYED_AT}"
          }
          EOF

      - name: Validate evidence schema
        shell: bash
        run: |
          set -euo pipefail
          for required in evidence.json evidence.txt curl_headers.txt compose_ps.txt uptime.txt logs_backend.txt logs_proxy.txt; do
            test -s "evidence/$required"
          done

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ inputs.target_env }}-${{ inputs.release_sha }}
          path: evidence/
          if-no-files-found: error
