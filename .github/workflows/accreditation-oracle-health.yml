# Accreditation Oracle Health
# ============================
# Scheduled job to verify accreditation system integrity.
# Mirrors oracle-health.yml pattern for county accreditation layer.
#
# What it checks:
# 1. Reference lock file integrity
# 2. Fresh packet generation still matches contract
# 3. Verifier accepts fresh packets
# 4. Cross-OS determinism (if both matrix entries pass)
#
# Schedule: Weekly (Sundays at 04:00 UTC)

name: Accreditation Oracle Health

on:
  schedule:
    - cron: '0 4 * * 0' # Weekly on Sunday at 04:00 UTC
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Enable verbose output'
        required: false
        default: 'false'
        type: boolean

defaults:
  run:
    working-directory: tools/registry/autonomy-viewer

jobs:
  oracle-health:
    name: Accreditation Oracle Health (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate reference lock exists
        run: |
          if [ ! -f "ACCREDITATION_REFERENCE.lock.json" ]; then
            echo "::error::ACCREDITATION_REFERENCE.lock.json not found"
            exit 1
          fi
          echo "✅ Reference lock file exists"
        shell: bash

      - name: Validate lock file schema
        run: |
          node -e "
            const fs = require('fs');
            const lock = JSON.parse(fs.readFileSync('ACCREDITATION_REFERENCE.lock.json', 'utf8'));
            
            const required = ['lockVersion', 'contract', 'determinismRules', 'upgradePolicy', 'referencePacket'];
            const missing = required.filter(f => !(f in lock));
            
            if (missing.length > 0) {
              console.error('::error::Missing required fields:', missing.join(', '));
              process.exit(1);
            }
            
            console.log('✅ Lock file schema valid');
            console.log('   Schema version:', lock.contract.schemaVersion);
            console.log('   Supported versions:', lock.contract.supportedVersions.join(', '));
            console.log('   Required files:', lock.contract.requiredFiles.length);
          "

      - name: Generate fresh accreditation packet
        run: |
          mkdir -p dist/oracle-health
          pnpm run accreditation -- --profile oracle-health-${{ matrix.os }} --out ./dist/oracle-health
          echo "✅ Fresh packet generated"

      - name: Verify fresh packet
        id: verify
        run: |
          pnpm run accreditation:verify -- --dir ./dist/oracle-health --json > verify-result.json
          cat verify-result.json

          if ! grep -q '"ok": true' verify-result.json; then
            echo "::error::Verification failed"
            exit 1
          fi
          echo "✅ Verification passed"
        shell: bash

      - name: Run compat tests
        run: npx tsx --test test/accreditation-compat.test.ts

      - name: Determinism check
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('dist/oracle-health/manifest.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('ACCREDITATION_REFERENCE.lock.json', 'utf8'));
            
            // Verify determinism rules are still in effect
            if (manifest.\$schema !== lock.contract.manifestSchemaId) {
              console.error('::error::Manifest schema mismatch');
              process.exit(1);
            }
            
            // Check all required files are present
            const presentPaths = manifest.files.map(f => f.path);
            const missingFiles = lock.referencePacket.expectedFileList.filter(f => !presentPaths.includes(f));
            
            if (missingFiles.length > 0) {
              console.error('::error::Missing expected files:', missingFiles.join(', '));
              process.exit(1);
            }
            
            console.log('✅ Determinism check passed');
            console.log('   Files verified:', manifest.fileCount);
            console.log('   Total bytes:', manifest.totalBytes);
          "

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-health-${{ matrix.os }}
          path: |
            tools/registry/autonomy-viewer/dist/oracle-health/
            tools/registry/autonomy-viewer/verify-result.json
          retention-days: 30

  summary:
    name: Oracle Health Summary
    runs-on: ubuntu-latest
    needs: oracle-health
    if: always()

    steps:
      - name: Check matrix results
        run: |
          echo "## Accreditation Oracle Health Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.oracle-health.result }}" == "success" ]; then
            echo "| Ubuntu | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "| Windows | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Two-tier oracle model verified:**" >> $GITHUB_STEP_SUMMARY
            echo "- OS evidence-plane oracle: ✅" >> $GITHUB_STEP_SUMMARY
            echo "- County accreditation oracle: ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Matrix | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Action Required:** Investigate oracle health failure" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Accreditation Oracle Health check failed. Review the matrix job logs."
