# Perf Skill Audit (Informational)
#
# Phase 4G/4M5: Non-blocking performance audit lane with rehearsal
#
# GOVERNANCE:
# - NEVER required for merge (SEAL remains the only required check)
# - Runs nightly + manual dispatch only
# - Cancel-safe with concurrency
# - Read-only, no mutations
#
# Phase 4M5: Adds nightly rehearsal (--auto --dry-run --explain --emit-proof)
# The rehearsal demonstrates what ralph-apply would do without applying changes.

name: Perf Skill Audit (Informational)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Ref/SHA to audit (blank = current)'
        required: false
        default: ''
      enable_rehearsal:
        description: 'Run ralph-apply rehearsal (dry-run)'
        type: boolean
        required: false
        default: true
  schedule:
    # 02:15 PST (10:15 UTC) - outside peak hours
    - cron: '15 10 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf_audit:
    # Skip for dependency bot PRs (belt + suspenders)
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.ref_name, 'snyk-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install audit tool dependencies
        run: pnpm -C tools/registry/perf-skill-audit install

      - name: Run performance skill audit (read-only)
        run: npx tsx tools/registry/perf-skill-audit/src/index.ts
        env:
          PERF_AUDIT_MAX_FINDINGS: '200'
          PERF_AUDIT_SEVERITY_THRESHOLD: 'medium'

      - name: Upload audit artifacts (Phase 4M4)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-skill-audit-${{ github.run_number }}
          path: |
            tools/registry/perf-skill-audit/out/perf-audit-report.md
            tools/registry/perf-skill-audit/out/perf-audit-report.json
            tools/registry/perf-skill-audit/out/perf-audit-report.full.json
            tools/registry/perf-skill-audit/out/perf-audit-report.actionable.json
            tools/registry/perf-skill-audit/out/perf.plan.json
            tools/registry/perf-skill-audit/out/waterfalls.plan.json
            tools/registry/perf-skill-audit/out/apply-proofs.json
          retention-days: 30

  # ============================================================================
  # Phase 4M5: Nightly Rehearsal (Informational)
  #
  # Runs ralph-apply --auto in dry-run mode to demonstrate what would happen
  # if the autonomy envelope were triggered. Produces ApplyProof for review.
  #
  # NON-NEGOTIABLE: This is DRY-RUN ONLY (no actual changes)
  # ============================================================================
  rehearsal:
    name: Ralph Apply Rehearsal (dry-run)
    needs: perf_audit
    if: ${{ github.event.inputs.enable_rehearsal != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install audit tool dependencies
        run: pnpm -C tools/registry/perf-skill-audit install

      - name: Download perf.plan.json from audit job
        uses: actions/download-artifact@v4
        with:
          name: perf-skill-audit-${{ github.run_number }}
          path: tools/registry/perf-skill-audit/out/

      - name: Ralph Apply Rehearsal (--auto --dry-run --explain --emit-proof)
        id: rehearsal
        run: |
          echo "🤖 Phase 4M5: Ralph Apply Rehearsal (DRY-RUN ONLY)"
          echo "=================================================="
          echo ""
          echo "This demonstrates what ralph-apply --auto would do."
          echo "No changes are applied (--dry-run mode)."
          echo ""
          npx tsx tools/registry/perf-skill-audit/src/ralph-apply.ts \
            --auto \
            --dry-run \
            --explain \
            --emit-proof \
            --verbose || true
        env:
          # Ensure we're on a non-protected branch for safety rail demo
          GIT_BRANCH: ${{ github.ref_name }}

      - name: Upload rehearsal proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ralph-apply-rehearsal-${{ github.run_number }}
          path: |
            tools/registry/perf-skill-audit/out/apply-proofs.json
          retention-days: 30

      - name: Rehearsal Summary
        if: always()
        run: |
          echo "## 🤖 Ralph Apply Rehearsal Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** \`--auto --dry-run --explain --emit-proof\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "tools/registry/perf-skill-audit/out/apply-proofs.json" ]; then
            echo "### ApplyProof Generated" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat tools/registry/perf-skill-audit/out/apply-proofs.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No apply-proofs.json generated (may be noop)" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Phase 4M9: County CIO Dashboard
  #
  # Generates an offline HTML dashboard from autonomy artifacts.
  # This is the "governance telemetry viewer" that county staff can download
  # and open locally without any CLI access.
  # ============================================================================
  dashboard:
    name: Generate CIO Dashboard
    needs: rehearsal
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download audit artifacts
        uses: actions/download-artifact@v4
        with:
          name: perf-skill-audit-${{ github.run_number }}
          path: tools/registry/perf-skill-audit/out/

      - name: Download rehearsal proof (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ralph-apply-rehearsal-${{ github.run_number }}
          path: tools/registry/perf-skill-audit/out/

      - name: Generate Autonomy Dashboard (HTML)
        run: |
          echo "📊 Phase 4M9: Generating County CIO Dashboard..."
          npx tsx tools/registry/autonomy-viewer/src/generate.ts \
            --artifacts=tools/registry/perf-skill-audit/out \
            --output=tools/registry/autonomy-viewer/dist \
            --emit-json \
            --verbose

      - name: Upload Dashboard Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-dashboard-${{ github.run_number }}
          path: |
            tools/registry/autonomy-viewer/dist/autonomy-dashboard.html
            tools/registry/autonomy-viewer/dist/autonomy-dashboard.json
          retention-days: 90

      - name: Dashboard Summary
        if: always()
        run: |
          echo "## 🏛️ County CIO Dashboard Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`autonomy-dashboard-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the HTML file and open it locally (no server required)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dashboard Contents:" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Executive Summary" >> $GITHUB_STEP_SUMMARY
          echo "- 🛡️ Safety Rails Status" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Rollback Panel (commands + gates)" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Findings & Plan Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Proof Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- 🚫 Governance Limits" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Phase 4N3: Autonomy Evidence Bundle
  #
  # Creates a single ZIP file containing all artifacts needed for audit sign-off.
  # "One download = one audit packet" for county CIO/auditors.
  # Includes deterministic hashing, manifest with SHA256, and rollback instructions.
  # ============================================================================
  bundle:
    name: Generate Evidence Bundle
    needs: dashboard
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download audit artifacts
        uses: actions/download-artifact@v4
        with:
          name: perf-skill-audit-${{ github.run_number }}
          path: tools/registry/perf-skill-audit/out/

      - name: Download dashboard artifacts
        uses: actions/download-artifact@v4
        with:
          name: autonomy-dashboard-${{ github.run_number }}
          path: tools/registry/autonomy-viewer/dist/

      - name: Generate Evidence Bundle (ZIP)
        run: |
          echo "📦 Phase 4N3: Generating Autonomy Evidence Bundle..."
          npx tsx tools/registry/autonomy-viewer/src/bundle.ts \
            --in tools/registry/perf-skill-audit/out \
            --in tools/registry/autonomy-viewer/dist \
            --out tools/registry/autonomy-viewer/dist \
            --name "autonomy-evidence-bundle-${{ github.run_number }}" \
            --run-id "${{ github.run_id }}" \
            --emit-manifest \
            --verbose

      - name: Upload Evidence Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-evidence-bundle-${{ github.run_number }}
          path: |
            tools/registry/autonomy-viewer/dist/*.zip
            tools/registry/autonomy-viewer/dist/MANIFEST.json
          retention-days: 90

      - name: Bundle Summary
        if: always()
        run: |
          echo "## 📦 Autonomy Evidence Bundle Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`autonomy-evidence-bundle-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One download = one audit packet. Open ZIP and double-click HTML." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Contents:" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 autonomy-dashboard.html (offline viewer)" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 perf.plan.json (performance plan)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 apply-proofs.json (cryptographic proofs)" >> $GITHUB_STEP_SUMMARY
          echo "- 📜 GOVERNANCE_CONTRACT.md (governance terms)" >> $GITHUB_STEP_SUMMARY
          echo "- 📖 README_AUDIT_PACKET.md (rollback instructions)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔐 MANIFEST.json (SHA256 hashes)" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Phase 4N6: Evidence Index (System-of-Record)
  #
  # Generates a JSON evidence index that serves as the audit ledger for this run.
  # The index tracks: what was done, when, by whom, bundle integrity, retention policy.
  # This is the "system-of-record" that makes Autonomy discoverable at county scale.
  # ============================================================================
  evidence_index:
    name: Generate Evidence Index
    needs: bundle
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download audit artifacts
        uses: actions/download-artifact@v4
        with:
          name: perf-skill-audit-${{ github.run_number }}
          path: tools/registry/perf-skill-audit/out/

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: autonomy-evidence-bundle-${{ github.run_number }}
          path: tools/registry/autonomy-viewer/dist/

      - name: Verify Evidence Bundle
        id: verify
        run: |
          echo "🔐 Verifying Evidence Bundle integrity..."
          BUNDLE_PATH="tools/registry/autonomy-viewer/dist/autonomy-evidence-bundle-${{ github.run_number }}.zip"

          if [ ! -f "$BUNDLE_PATH" ]; then
            echo "::warning::Bundle not found, skipping verification"
            echo "verify_ok=false" >> $GITHUB_OUTPUT
            echo "verify_strict=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-bundle.ts \
            --zip "$BUNDLE_PATH" \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "verify_ok=true" >> $GITHUB_OUTPUT
            echo "verify_strict=true" >> $GITHUB_OUTPUT
            echo "✅ Bundle verification passed (strict)"
          elif [ $VERIFY_EXIT -eq 1 ]; then
            echo "verify_ok=true" >> $GITHUB_OUTPUT
            echo "verify_strict=false" >> $GITHUB_OUTPUT
            echo "⚠️ Bundle verification passed (non-strict)"
          else
            echo "verify_ok=false" >> $GITHUB_OUTPUT
            echo "verify_strict=false" >> $GITHUB_OUTPUT
            echo "::warning::Bundle verification failed"
          fi

      - name: Compute Manifest SHA256
        id: manifest
        run: |
          if [ -f "tools/registry/autonomy-viewer/dist/MANIFEST.json" ]; then
            MANIFEST_SHA=$(sha256sum tools/registry/autonomy-viewer/dist/MANIFEST.json | cut -d' ' -f1)
            echo "sha=$MANIFEST_SHA" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi

      - name: Generate Evidence Index
        run: |
          echo "📋 Phase 4N6: Generating Evidence Index (system-of-record)..."
          npx tsx tools/registry/autonomy-viewer/src/evidence-index.ts \
            --out tools/registry/autonomy-viewer/dist/autonomy-evidence-index.json \
            --artifacts tools/registry/perf-skill-audit/out \
            --bundle "autonomy-evidence-bundle-${{ github.run_number }}.zip" \
            --manifest-sha "${{ steps.manifest.outputs.sha }}" \
            --verify-ok "${{ steps.verify.outputs.verify_ok || 'false' }}" \
            --verify-strict "${{ steps.verify.outputs.verify_strict || 'false' }}" \
            --run-id "${{ github.run_id }}" \
            --workflow "perf-skill-audit" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --verbose

      - name: Upload Evidence Index
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autonomy-evidence-index-${{ github.run_number }}
          path: |
            tools/registry/autonomy-viewer/dist/autonomy-evidence-index.json
          retention-days: 90

      - name: Evidence Index Summary
        if: always()
        run: |
          echo "## 📋 Evidence Index Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`autonomy-evidence-index-${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Schema:** \`terrafusion.autonomy.evidence.index.v1\`" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Policy:** \`autonomy-evidence-retention.v1\`" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Days:** 90 (default)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The Evidence Index is the system-of-record for this autonomy run." >> $GITHUB_STEP_SUMMARY
          echo "It links: workflow → bundle → proofs → retention policy." >> $GITHUB_STEP_SUMMARY
