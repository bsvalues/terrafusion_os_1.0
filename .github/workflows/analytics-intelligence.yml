          - **Strategic Planning**: TerraFusion Strategy Team
          
          EOF
          
          # Replace placeholders
          sed -i "s/REPLACE_TIMESTAMP/$(date -u +%Y-%m-%dT%H:%M:%SZ)/g" analytics_dashboard.md
          sed -i "s/REPLACE_TIME_RANGE/${{ github.event.inputs.time_range || '30-days' }}/g" analytics_dashboard.md
          sed -i "s/SUCCESS_STATUS/${{ needs.repository-analytics.result }}/g" analytics_dashboard.md
          sed -i "s/TREND_STATUS/${{ needs.trend-analysis.result }}/g" analytics_dashboard.md
          sed -i "s/COMPETITIVE_STATUS/${{ needs.competitive-analysis.result }}/g" analytics_dashboard.md
          
          # Append individual reports if they exist
          if [[ -f repository-analytics.md ]]; then
            echo "" >> analytics_dashboard.md
            echo "---" >> analytics_dashboard.md
            echo "" >> analytics_dashboard.md
            cat repository-analytics.md >> analytics_dashboard.md
          fi
          
          if [[ -f trend_analysis.md ]]; then
            echo "" >> analytics_dashboard.md
            echo "---" >> analytics_dashboard.md
            echo "" >> analytics_dashboard.md
            cat trend_analysis.md >> analytics_dashboard.md
          fi
          
          if [[ -f competitive_analysis.md ]]; then
            echo "" >> analytics_dashboard.md
            echo "---" >> analytics_dashboard.md
            echo "" >> analytics_dashboard.md
            cat competitive_analysis.md >> analytics_dashboard.md
          fi

      - name: Export analytics in requested format
        run: |
          export_format="${{ github.event.inputs.export_format || 'markdown' }}"
          
          case $export_format in
            "json")
              echo "📊 Exporting analytics to JSON format..."
              # Convert key metrics to JSON
              cat > analytics_data.json << 'EOF'
              {
                "timestamp": "CURRENT_TIME",
                "repository": "${{ github.repository }}",
                "analytics_scope": "${{ github.event.inputs.analytics_scope || 'comprehensive' }}",
                "modules": {
                  "repository_analytics": "${{ needs.repository-analytics.result }}",
                  "trend_analysis": "${{ needs.trend-analysis.result }}",
                  "competitive_analysis": "${{ needs.competitive-analysis.result }}"
                },
                "export_format": "json"
              }
              EOF
              sed -i "s/CURRENT_TIME/$(date -u +%Y-%m-%dT%H:%M:%SZ)/g" analytics_data.json
              ;;
            "csv")
              echo "📊 Exporting analytics to CSV format..."
              cat > analytics_data.csv << 'EOF'
              Metric,Value,Status,Timestamp
              Repository Analytics,${{ needs.repository-analytics.result }},Complete,CURRENT_TIME
              Trend Analysis,${{ needs.trend-analysis.result }},Complete,CURRENT_TIME
              Competitive Analysis,${{ needs.competitive-analysis.result }},Complete,CURRENT_TIME
              EOF
              sed -i "s/CURRENT_TIME/$(date -u +%Y-%m-%dT%H:%M:%SZ)/g" analytics_data.csv
              ;;
            "html")
              echo "📊 Converting markdown to HTML..."
              # Simple markdown to HTML conversion (basic)
              sed 's/^# \(.*\)/<h1>\1<\/h1>/g; s/^## \(.*\)/<h2>\1<\/h2>/g; s/^### \(.*\)/<h3>\1<\/h3>/g' analytics_dashboard.md > analytics_dashboard.html
              ;;
            *)
              echo "📊 Using default markdown format"
              ;;
          esac

      - name: Upload comprehensive analytics dashboard
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-analytics-dashboard
          path: |
            analytics_dashboard.md
            analytics_data.json
            analytics_data.csv
            analytics_dashboard.html
          retention-days: ${{ env.ANALYTICS_RETENTION }}

      - name: Add analytics summary to step output
        run: |
          echo "# 📊 TerraFusion Analytics Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calculate overall analytics score
          job_results=("${{ needs.repository-analytics.result }}" "${{ needs.trend-analysis.result }}" "${{ needs.competitive-analysis.result }}")
          successful_jobs=0
          total_jobs=${#job_results[@]}
          
          for result in "${job_results[@]}"; do
            if [[ "$result" == "success" ]]; then
              successful_jobs=$((successful_jobs + 1))
            fi
          done
          
          analytics_score=$(( (successful_jobs * 100) / total_jobs ))
          
          echo "**Analytics Completion**: $analytics_score% ($successful_jobs/$total_jobs modules)" >> $GITHUB_STEP_SUMMARY
          echo "**Report Format**: ${{ github.event.inputs.export_format || 'markdown' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Analysis Period**: ${{ github.event.inputs.time_range || '30-days' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ -f analytics_dashboard.md ]]; then
            echo "## 📈 Key Insights" >> $GITHUB_STEP_SUMMARY
            echo "- Comprehensive repository health assessment completed" >> $GITHUB_STEP_SUMMARY
            echo "- Trend analysis and predictive insights generated" >> $GITHUB_STEP_SUMMARY
            echo "- Competitive positioning analysis performed" >> $GITHUB_STEP_SUMMARY
            echo "- Strategic recommendations formulated" >> $GITHUB_STEP_SUMMARY
          fi
