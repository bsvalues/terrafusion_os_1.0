# Push trigger disabled — non-required workflow, infrastructure/ is quarantined.
name: TerraFusion Infrastructure CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
env:
  TF_VERSION: '1.5.0'
  TF_VAR_region: 'us-east-1'
  TF_VAR_environment: 'production'

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check AWS credentials
        id: aws
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && [ -n "${{ secrets.TF_STATE_BUCKET }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.aws.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_region }}

      - name: Terraform Format
        run: |
          if [ ! -d infrastructure/terraform ]; then
            echo "infrastructure/terraform is not present; skipping terraform format."
            exit 0
          fi
          terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Terraform Validate
        if: steps.aws.outputs.ready == 'true'
        run: |
          if [ ! -d infrastructure/terraform ]; then
            echo "infrastructure/terraform is not present; skipping terraform validate."
            exit 0
          fi
          terraform -chdir=infrastructure/terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          terraform -chdir=infrastructure/terraform validate

      - name: Terraform Plan
        if: steps.aws.outputs.ready == 'true'
        run: |
          if [ ! -d infrastructure/terraform ]; then
            echo "infrastructure/terraform is not present; skipping terraform plan."
            exit 0
          fi
          terraform -chdir=infrastructure/terraform plan -no-color -out=tfplan
          terraform -chdir=infrastructure/terraform show -no-color tfplan

      - name: Skip Terraform (missing credentials)
        if: steps.aws.outputs.ready != 'true'
        run: echo "Missing AWS credentials or TF_STATE_BUCKET; skipping terraform validate/plan."

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Setup Kubernetes tools
        uses: azure/setup-kubectl@v3

      - name: Add Helm repositories
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping helm repository setup."
            exit 0
          fi
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Build Helm dependencies
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping helm dependencies."
            exit 0
          fi
          helm dependency build infrastructure/helm/charts/terrafusion-backend
          helm dependency build infrastructure/helm/charts/terrafusion-frontend
          helm dependency build infrastructure/helm/charts/terrafusion-ai-swarm
          # Umbrella chart has file:// dependency path issues - build optional
          helm dependency build infrastructure/helm/charts/terrafusion || echo "⚠️  Umbrella chart dependencies skipped (non-critical)"

      - name: Lint Helm charts
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping helm lint."
            exit 0
          fi
          helm lint infrastructure/helm/charts/terrafusion-backend
          helm lint infrastructure/helm/charts/terrafusion-frontend
          helm lint infrastructure/helm/charts/terrafusion-ai-swarm
          helm lint infrastructure/helm/charts/terrafusion

      - name: Template Helm charts
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping helm template."
            exit 0
          fi
          helm template test-backend infrastructure/helm/charts/terrafusion-backend
          helm template test-frontend infrastructure/helm/charts/terrafusion-frontend
          helm template test-ai-swarm infrastructure/helm/charts/terrafusion-ai-swarm
          helm template test-terrafusion infrastructure/helm/charts/terrafusion

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-helm]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Checkov Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./infrastructure/
          framework: terraform
          output_format: cli
          output_file_path: console,checkov-results.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-helm, security-scan]
    if: false
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials for staging
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ env.TF_VAR_region }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Setup Kubernetes tools
        uses: azure/setup-kubectl@v3

      - name: Deploy Infrastructure
        run: |
          if [ ! -d infrastructure/terraform ]; then
            echo "infrastructure/terraform is not present; skipping staging infrastructure deploy."
            exit 0
          fi
          terraform -chdir=infrastructure/terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_STAGING }}"
          terraform -chdir=infrastructure/terraform workspace select staging || terraform -chdir=infrastructure/terraform workspace new staging
          terraform -chdir=infrastructure/terraform plan -out=tfplan
          terraform -chdir=infrastructure/terraform apply tfplan

      - name: Get EKS cluster credentials
        run: |
          aws eks update-kubeconfig --region ${{ env.TF_VAR_region }} --name terrafusion-staging

      - name: Deploy Helm charts
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping staging helm deploy."
            exit 0
          fi
          helm upgrade --install terrafusion-staging infrastructure/helm/charts/terrafusion \
            --namespace terrafusion-staging \
            --create-namespace \
            --values infrastructure/helm/charts/terrafusion/values-staging.yaml \
            --wait \
            --timeout 600s

      - name: Run tests
        run: |
          kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-backend -n terrafusion-staging
          kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-frontend -n terrafusion-staging
          kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-ai-swarm -n terrafusion-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: false
    environment:
      name: production-deprecated

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials for production
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.TF_VAR_region }}

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Setup Kubernetes tools
        uses: azure/setup-kubectl@v3

      - name: Deploy Infrastructure
        run: |
          if [ ! -d infrastructure/terraform ]; then
            echo "infrastructure/terraform is not present; skipping production infrastructure deploy."
            exit 0
          fi
          terraform -chdir=infrastructure/terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_PROD }}"
          terraform -chdir=infrastructure/terraform workspace select production || terraform -chdir=infrastructure/terraform workspace new production
          terraform -chdir=infrastructure/terraform plan -out=tfplan
          terraform -chdir=infrastructure/terraform apply tfplan

      - name: Get EKS cluster credentials
        run: |
          aws eks update-kubeconfig --region ${{ env.TF_VAR_region }} --name terrafusion-production

      - name: Deploy Helm charts
        run: |
          if [ ! -d infrastructure/helm ]; then
            echo "infrastructure/helm is not present; skipping production helm deploy."
            exit 0
          fi
          helm upgrade --install terrafusion-production infrastructure/helm/charts/terrafusion \
            --namespace terrafusion-production \
            --create-namespace \
            --values infrastructure/helm/charts/terrafusion/values-production.yaml \
            --wait \
            --timeout 900s

      - name: Run production tests
        run: |
          kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-backend -n terrafusion-production
          kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-frontend -n terrafusion-production
          kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-ai-swarm -n terrafusion-production

      - name: Health check
        run: |
          # Backend health check
          kubectl run health-check-backend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-backend.terrafusion-production.svc.cluster.local/health

          # Frontend health check
          kubectl run health-check-frontend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-frontend.terrafusion-production.svc.cluster.local/health

          # AI Swarm health check
          kubectl run health-check-ai-swarm --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-ai-swarm.terrafusion-production.svc.cluster.local/health

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Setup Kubernetes tools
        uses: azure/setup-kubectl@v3

      - name: Rollback deployment
        run: |
          helm rollback terrafusion-production -n terrafusion-production || true

      - name: Notify on failure
        uses: 8398a7/action-slack@v3
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        with:
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
