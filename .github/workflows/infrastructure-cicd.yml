name: TerraFusion Infrastructure CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/**'

env:
  TF_VERSION: '1.5.0'
  TF_VAR_region: 'us-east-1'
  TF_VAR_environment: 'production'

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/terraform

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.TF_VAR_region }}

    - name: Terraform Format
      run: terraform fmt -check -recursive

    - name: Terraform Validate
      run: |
        terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
        terraform validate

    - name: Terraform Plan
      run: |
        terraform plan -no-color -out=tfplan
        terraform show -no-color tfplan

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/helm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
        helm repo add grafana https://grafana.github.io/helm-charts
        helm repo update

    - name: Lint Helm charts
      run: |
        helm lint charts/terrafusion-backend
        helm lint charts/terrafusion-frontend
        helm lint charts/terrafusion-ai-swarm
        helm lint charts/terrafusion

    - name: Template Helm charts
      run: |
        helm template test-backend charts/terrafusion-backend
        helm template test-frontend charts/terrafusion-frontend
        helm template test-ai-swarm charts/terrafusion-ai-swarm
        helm template test-terrafusion charts/terrafusion

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-helm]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Checkov Security Scan
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ./infrastructure/
        framework: terraform
        output_format: cli
        output_file_path: console,checkov-results.json

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate-terraform, validate-helm, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials for staging
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
        aws-region: ${{ env.TF_VAR_region }}

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Deploy Infrastructure
      working-directory: ./infrastructure/terraform
      run: |
        terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_STAGING }}"
        terraform workspace select staging || terraform workspace new staging
        terraform plan -out=tfplan
        terraform apply -auto-approve tfplan

    - name: Get EKS cluster credentials
      run: |
        aws eks update-kubeconfig --region ${{ env.TF_VAR_region }} --name terrafusion-staging

    - name: Deploy Helm charts
      working-directory: ./infrastructure/helm
      run: |
        helm upgrade --install terrafusion-staging ./charts/terrafusion \
          --namespace terrafusion-staging \
          --create-namespace \
          --values ./charts/terrafusion/values-staging.yaml \
          --wait \
          --timeout 600s

    - name: Run tests
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-backend -n terrafusion-staging
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-frontend -n terrafusion-staging
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-ai-swarm -n terrafusion-staging

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Configure AWS credentials for production
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        aws-region: ${{ env.TF_VAR_region }}

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Deploy Infrastructure
      working-directory: ./infrastructure/terraform
      run: |
        terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_PROD }}"
        terraform workspace select production || terraform workspace new production
        terraform plan -out=tfplan
        terraform apply -auto-approve tfplan

    - name: Get EKS cluster credentials
      run: |
        aws eks update-kubeconfig --region ${{ env.TF_VAR_region }} --name terrafusion-production

    - name: Deploy Helm charts
      working-directory: ./infrastructure/helm
      run: |
        helm upgrade --install terrafusion-production ./charts/terrafusion \
          --namespace terrafusion-production \
          --create-namespace \
          --values ./charts/terrafusion/values-production.yaml \
          --wait \
          --timeout 900s

    - name: Run production tests
      run: |
        kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-backend -n terrafusion-production
        kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-frontend -n terrafusion-production
        kubectl wait --for=condition=available --timeout=600s deployment/terrafusion-ai-swarm -n terrafusion-production

    - name: Health check
      run: |
        # Backend health check
        kubectl run health-check-backend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-backend.terrafusion-production.svc.cluster.local/health

        # Frontend health check
        kubectl run health-check-frontend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-frontend.terrafusion-production.svc.cluster.local/health

        # AI Swarm health check
        kubectl run health-check-ai-swarm --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-ai-swarm.terrafusion-production.svc.cluster.local/health

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure() && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Rollback deployment
      run: |
        helm rollback terrafusion-production -n terrafusion-production || true

    - name: Notify on failure
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
