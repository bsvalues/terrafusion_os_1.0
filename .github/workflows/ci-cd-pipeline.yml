name: 🚀 TerraFusion OS - Revolutionary CI/CD Pipeline Excellence

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly builds at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_security_scan:
        description: 'Run comprehensive security scan'
        required: false
        default: true
        type: boolean
      run_penetration_test:
        description: 'Run penetration testing'
        required: false
        default: false
        type: boolean
      run_compliance_validation:
        description: 'Run government compliance validation'
        required: false
        default: true
        type: boolean

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TERRAFUSION_VERSION: '1.0.0'
  AZURE_WEBAPP_NAME: terrafusion-os
  AZURE_WEBAPP_PACKAGE_PATH: '.'

jobs:
  # Code Quality and Security Scanning
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Restore .NET dependencies
        run: |
          cd backend
          dotnet restore

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript type checking
        run: |
          cd frontend
          npm run type-check

      - name: Run .NET code analysis
        run: |
          cd backend
          dotnet build --configuration Release --no-restore --verbosity normal

      - name: Run security scan with CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, csharp

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run dependency vulnerability scan
        run: |
          cd frontend
          npm audit --audit-level moderate
          cd ../backend
          dotnet list package --vulnerable --include-transitive

  # Unit and Integration Tests
  test:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests
    needs: code-quality

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Restore backend dependencies
        run: |
          cd backend
          dotnet restore

      - name: Run frontend unit tests
        run: |
          cd frontend
          npm run test:unit -- --coverage --watchAll=false

      - name: Run backend unit tests
        run: |
          cd backend
          dotnet test --configuration Release --no-restore --verbosity normal --collect:"XPlat Code Coverage"

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Database=terrafusion_test;Username=postgres;Password=postgres'
          ConnectionStrings__Redis: 'localhost:6379'
        run: |
          cd backend
          dotnet test TerraFusion.IntegrationTests --configuration Release --verbosity normal

      - name: Run AI Agent tests
        run: |
          cd modules/terra-agent
          npm ci
          npm run test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            frontend/coverage/
            backend/TestResults/
            modules/terra-agent/coverage/

  # Build and Package
  build:
    runs-on: ubuntu-latest
    name: Build & Package
    needs: test

    outputs:
      frontend-artifact: ${{ steps.build-frontend.outputs.artifact-name }}
      backend-artifact: ${{ steps.build-backend.outputs.artifact-name }}
      agent-artifact: ${{ steps.build-agent.outputs.artifact-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build frontend
        id: build-frontend
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run build:production
          echo "artifact-name=frontend-build-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build backend
        id: build-backend
        run: |
          cd backend
          dotnet restore
          dotnet publish --configuration Release --output ./publish --no-restore
          echo "artifact-name=backend-build-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build AI Agent modules
        id: build-agent
        run: |
          cd modules/terra-agent
          npm ci --prefer-offline --no-audit
          npm run build:all
          echo "artifact-name=agent-build-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-frontend.outputs.artifact-name }}
          path: frontend/dist/

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-backend.outputs.artifact-name }}
          path: backend/publish/

      - name: Upload AI Agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-agent.outputs.artifact-name }}
          path: modules/terra-agent/dist/

  # Docker Build and Push
  docker:
    runs-on: ubuntu-latest
    name: Docker Build & Push
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-build-*'
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for AI Agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-agent
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push AI Agent Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./modules/terra-agent
          file: ./docker/agent/Dockerfile
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Performance Testing
  performance-test:
    runs-on: ubuntu-latest
    name: Performance Testing
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install performance testing tools
        run: |
          npm install -g artillery autocannon clinic

      - name: Run API performance tests
        run: |
          cd tests/performance
          artillery run api-load-test.yml --output report.json

      - name: Run frontend performance tests
        run: |
          cd tests/performance
          npm run lighthouse:ci

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: tests/performance/reports/

  # Deploy to Development
  deploy-dev:
    runs-on: ubuntu-latest
    name: Deploy to Development
    needs: [docker, performance-test]
    if: github.ref == 'refs/heads/develop'
    environment: development

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Container Apps - Frontend
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-frontend-dev
          resourceGroup: terrafusion-dev-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-frontend:develop

      - name: Deploy to Azure Container Apps - Backend
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-backend-dev
          resourceGroup: terrafusion-dev-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-backend:develop

      - name: Deploy to Azure Container Apps - AI Agent
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-agent-dev
          resourceGroup: terrafusion-dev-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-agent:develop

      - name: Run health checks
        run: |
          echo "Running health checks..."
          curl -f https://terrafusion-backend-dev.azurecontainerapps.io/health || exit 1
          curl -f https://terrafusion-frontend-dev.azurecontainerapps.io/health || exit 1

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STAGING }}

      - name: Deploy to Azure Container Apps - Frontend
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-frontend-staging
          resourceGroup: terrafusion-staging-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-frontend:main

      - name: Deploy to Azure Container Apps - Backend
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-backend-staging
          resourceGroup: terrafusion-staging-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-backend:main

      - name: Deploy to Azure Container Apps - AI Agent
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-agent-staging
          resourceGroup: terrafusion-staging-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-agent:main

      - name: Run smoke tests
        run: |
          cd tests/smoke
          npm ci
          npm run test:staging

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Create deployment slot
        uses: azure/CLI@v1
        with:
          azcliversion: 2.53.0
          inlineScript: |
            az containerapp revision copy \
              --name terrafusion-backend-prod \
              --resource-group terrafusion-prod-rg \
              --from-revision latest

      - name: Deploy to production with blue-green strategy
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: terrafusion-backend-prod
          resourceGroup: terrafusion-prod-rg
          imageToDeploy: ${{ secrets.AZURE_CONTAINER_REGISTRY }}/terrafusion-backend:main
          revisionSuffix: prod-${{ github.sha }}

      - name: Run production health checks
        run: |
          echo "Running production health checks..."
          for i in {1..30}; do
            if curl -f https://api.terrafusion.com/health; then
              echo "Health check passed"
              break
            fi
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
          done

      - name: Activate new revision
        uses: azure/CLI@v1
        with:
          azcliversion: 2.53.0
          inlineScript: |
            az containerapp ingress traffic set \
              --name terrafusion-backend-prod \
              --resource-group terrafusion-prod-rg \
              --revision-weight latest=100

      - name: Run post-deployment tests
        run: |
          cd tests/e2e
          npm ci
          npm run test:production

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'TerraFusion OS 1.0 successfully deployed to production! 🚀'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Rollback on Failure
  rollback:
    runs-on: ubuntu-latest
    name: Emergency Rollback
    if: failure() && github.ref == 'refs/heads/main'
    needs: deploy-production
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Rollback to previous revision
        uses: azure/CLI@v1
        with:
          azcliversion: 2.53.0
          inlineScript: |
            # Get previous revision
            PREVIOUS_REVISION=$(az containerapp revision list \
              --name terrafusion-backend-prod \
              --resource-group terrafusion-prod-rg \
              --query '[1].name' -o tsv)

            # Rollback to previous revision
            az containerapp ingress traffic set \
              --name terrafusion-backend-prod \
              --resource-group terrafusion-prod-rg \
              --revision-weight $PREVIOUS_REVISION=100

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'TerraFusion OS 1.0 deployment failed. Rollback completed. 🔄'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
