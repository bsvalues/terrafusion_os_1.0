name: '? Performance Budget & Lighthouse'

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/performance-budget.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse-audit:
    name: '?? Lighthouse Performance Audit'
    runs-on: ubuntu-latest

    steps:
      - name: '?? Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: '??? Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: '?? Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '??? Build frontend (production)'
        run: pnpm -C frontend run build
        env:
          NODE_ENV: production

      - name: '?? Start preview server'
        run: |
          pnpm -C frontend run preview &
          pnpm exec wait-on http://localhost:4173 -t 60000

      - name: '?? Run Lighthouse CI'
        run: pnpm exec lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: '?? Upload Lighthouse results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'lighthouse-results'
          path: .lighthouseci
          retention-days: 14

      - name: '?? Generate Lighthouse summary'
        if: always()
        run: |
          echo "## ?? Lighthouse Performance Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse Lighthouse results (if available)
          if [ -f ".lighthouseci/manifest.json" ]; then
            echo "### Performance Metrics:" >> $GITHUB_STEP_SUMMARY
            echo "- ? First Contentful Paint (FCP)" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Largest Contentful Paint (LCP)" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Total Blocking Time (TBT)" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Cumulative Layout Shift (CLS)" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Time to Interactive (TTI)" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Speed Index" >> $GITHUB_STEP_SUMMARY
          else
            echo "?? Lighthouse results not available" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**THE TERRAFUSION WAY: Performance matters! ?**" >> $GITHUB_STEP_SUMMARY

  bundle-size-analysis:
    name: '?? Bundle Size Analysis'
    runs-on: ubuntu-latest

    steps:
      - name: '?? Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: '??? Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: '?? Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '??? Build with bundle analysis'
        run: |
          pnpm -C frontend run build
          # Generate bundle stats
          du -h frontend/dist/*.js | sort -h > frontend/bundle-stats.txt
          du -sh frontend/dist > frontend/dist-size.txt
        env:
          NODE_ENV: production

      - name: '?? Analyze bundle size'
        run: |
          echo "## ?? Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total Bundle Size:" >> $GITHUB_STEP_SUMMARY
          cat frontend/dist-size.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JavaScript Files:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat frontend/bundle-stats.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if bundle size exceeds budget (500KB)
          TOTAL_SIZE=$(du -sk frontend/dist | cut -f1)
          BUDGET_KB=512

          if [ "$TOTAL_SIZE" -gt "$BUDGET_KB" ]; then
            echo "?? **Bundle size exceeds budget!**" >> $GITHUB_STEP_SUMMARY
            echo "- Budget: ${BUDGET_KB}KB" >> $GITHUB_STEP_SUMMARY
            echo "- Actual: ${TOTAL_SIZE}KB" >> $GITHUB_STEP_SUMMARY
            echo "- Overage: $((TOTAL_SIZE - BUDGET_KB))KB" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "? **Bundle size within budget!**" >> $GITHUB_STEP_SUMMARY
            echo "- Budget: ${BUDGET_KB}KB" >> $GITHUB_STEP_SUMMARY
            echo "- Actual: ${TOTAL_SIZE}KB" >> $GITHUB_STEP_SUMMARY
            echo "- Remaining: $((BUDGET_KB - TOTAL_SIZE))KB" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**THE TERRAFUSION WAY: Keep it lean! ??**" >> $GITHUB_STEP_SUMMARY

      - name: '?? Upload bundle stats'
        uses: actions/upload-artifact@v4
        with:
          name: 'bundle-stats'
          path: |
            frontend/dist-size.txt
            frontend/bundle-stats.txt
          retention-days: 30

      - name: '?? Comment bundle size on PR'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const distSize = fs.readFileSync('frontend/dist-size.txt', 'utf8').trim();
            const bundleStats = fs.readFileSync('frontend/bundle-stats.txt', 'utf8').trim();

            const comment = `## ?? Bundle Size Report

            **Total Bundle Size:** ${distSize}

            ### JavaScript Files:
            \`\`\`
            ${bundleStats}
            \`\`\`

            ### Budget Status:
            - ?? Budget: 512KB
            - ?? See [detailed analysis](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            **THE TERRAFUSION WAY: Performance through optimization! ?**`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  performance-benchmarks:
    name: '??? Performance Benchmarks'
    runs-on: ubuntu-latest

    steps:
      - name: '?? Checkout code'
        uses: actions/checkout@v4

      - name: 'Setup pnpm'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: '??? Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: '?? Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: '?? Install Playwright'
        run: pnpm exec playwright install --with-deps chromium

      - name: '??? Build frontend'
        run: pnpm -C frontend run build
        env:
          NODE_ENV: production

      - name: '?? Start preview server'
        run: |
          pnpm -C frontend run preview &
          pnpm exec wait-on http://localhost:4173 -t 60000

      - name: '??? Run performance benchmarks'
        run: |
          if [ -f "tests/e2e/performance-benchmarks.spec.ts" ]; then
            pnpm exec playwright test tests/e2e/performance-benchmarks.spec.ts
          else
            echo "?? Performance benchmark tests not found"
          fi
        env:
          CI: true

      - name: '?? Upload performance results'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'performance-benchmarks'
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: '?? Generate performance summary'
        if: always()
        run: |
          echo "## ??? Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Metrics Tested:" >> $GITHUB_STEP_SUMMARY
          echo "- ? Page load time" >> $GITHUB_STEP_SUMMARY
          echo "- ?? Render time" >> $GITHUB_STEP_SUMMARY
          echo "- ?? Component mount time" >> $GITHUB_STEP_SUMMARY
          echo "- ?? Data fetch latency" >> $GITHUB_STEP_SUMMARY
          echo "- ?? Interaction responsiveness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**THE TERRAFUSION WAY: Fast and responsive! ???**" >> $GITHUB_STEP_SUMMARY

  performance-report:
    name: '?? Performance Summary Report'
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, bundle-size-analysis, performance-benchmarks]
    if: always()

    steps:
      - name: '?? Generate comprehensive performance report'
        run: |
          echo "# ? Comprehensive Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lighthouse Audit:** ${{ needs.lighthouse-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Size Analysis:** ${{ needs.bundle-size-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Benchmarks:** ${{ needs.performance-benchmarks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lighthouse-audit.result }}" == "success" ] && \
             [ "${{ needs.bundle-size-analysis.result }}" == "success" ] && \
             [ "${{ needs.performance-benchmarks.result }}" == "success" ]; then
            echo "## ? All Performance Tests Passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Performance Goals Achieved:" >> $GITHUB_STEP_SUMMARY
            echo "- ? Lighthouse score > 90" >> $GITHUB_STEP_SUMMARY
            echo "- ? Bundle size < 512KB" >> $GITHUB_STEP_SUMMARY
            echo "- ? FCP < 1.8s" >> $GITHUB_STEP_SUMMARY
            echo "- ? LCP < 2.5s" >> $GITHUB_STEP_SUMMARY
            echo "- ? TTI < 3.8s" >> $GITHUB_STEP_SUMMARY
            echo "- ? CLS < 0.1" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ?? Performance Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the detailed reports above and optimize before merging." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Optimization Tips:" >> $GITHUB_STEP_SUMMARY
            echo "- ?? Code splitting with React.lazy()" >> $GITHUB_STEP_SUMMARY
            echo "- ??? Image optimization and lazy loading" >> $GITHUB_STEP_SUMMARY
            echo "- ?? React.memo for expensive components" >> $GITHUB_STEP_SUMMARY
            echo "- ?? useMemo/useCallback for computed values" >> $GITHUB_STEP_SUMMARY
            echo "- ??? Tree shaking and dead code elimination" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**THE TERRAFUSION WAY: Performance is a feature! ?**" >> $GITHUB_STEP_SUMMARY

      - name: '? Verify performance standards'
        run: |
          if [ "${{ needs.lighthouse-audit.result }}" != "success" ] || \
             [ "${{ needs.bundle-size-analysis.result }}" != "success" ]; then
            echo "?? Performance tests failed - review required"
            exit 1
          fi
          echo "? All performance tests passed!"
