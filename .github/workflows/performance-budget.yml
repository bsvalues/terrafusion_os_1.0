name: 'Performance Budget & Lighthouse'

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/performance-budget.yml'
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lighthouse Performance Audit ──────────────────────────────────
  # Builds the frontend, starts a Vite preview server on
  # TF_FRONTEND_PORT (default 4173), and runs Lighthouse CI against
  # that server using lighthouserc.cjs.
  lighthouse-audit:
    name: 'Lighthouse Performance Audit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (production)
        run: pnpm -C frontend run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -f "native-shell/ui/dist/index.html" ]; then
            echo "::error::Build output missing: native-shell/ui/dist/index.html"
            exit 1
          fi
          echo "Build output verified at native-shell/ui/dist/"

      - name: Start preview server
        run: |
          PREVIEW_PORT="${TF_FRONTEND_PORT:-4173}"
          pnpm -C frontend run preview -- --port "$PREVIEW_PORT" --strict-port &
          pnpm exec wait-on "http://localhost:${PREVIEW_PORT}" -t 60000

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --config=frontend/lighthouserc.cjs
        env:
          TF_FRONTEND_PORT: ${{ vars.TF_FRONTEND_PORT || '4173' }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'lighthouse-results'
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Lighthouse summary
        if: always()
        run: |
          echo "## Lighthouse Performance Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ".lighthouseci/manifest.json" ]; then
            echo "### Performance Metrics:" >> $GITHUB_STEP_SUMMARY
            echo "- First Contentful Paint (FCP)" >> $GITHUB_STEP_SUMMARY
            echo "- Largest Contentful Paint (LCP)" >> $GITHUB_STEP_SUMMARY
            echo "- Total Blocking Time (TBT)" >> $GITHUB_STEP_SUMMARY
            echo "- Cumulative Layout Shift (CLS)" >> $GITHUB_STEP_SUMMARY
            echo "- Time to Interactive (TTI)" >> $GITHUB_STEP_SUMMARY
            echo "- Speed Index" >> $GITHUB_STEP_SUMMARY
          else
            echo "Lighthouse results not available" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Bundle Size Analysis ──────────────────────────────────────────
  # Measures JS-only file sizes (excluding source maps) against a
  # realistic budget.  The BUDGET_KB threshold should be ratcheted
  # down as optimizations land.
  bundle-size-analysis:
    name: 'Bundle Size Analysis'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with bundle analysis
        run: |
          pnpm -C frontend run build

          # Generate bundle stats — JS only, excluding source maps
          find native-shell/ui/dist/assets -name '*.js' ! -name '*.map' \
            -exec du -h {} \; 2>/dev/null \
            | sort -h > frontend/bundle-stats.txt

          # find exits 0 even with no matches, so check file content
          if [ ! -s frontend/bundle-stats.txt ]; then
            echo "No JS files found" > frontend/bundle-stats.txt
          fi

          du -sh native-shell/ui/dist > frontend/dist-size.txt
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "native-shell/ui/dist/assets" ]; then
            echo "::error::Build output missing: native-shell/ui/dist/assets/"
            exit 1
          fi

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Total dist directory:" >> $GITHUB_STEP_SUMMARY
          cat frontend/dist-size.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### JavaScript Files (no source maps):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat frontend/bundle-stats.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Budget: measure JS-only size (no source maps, no CSS, no HTML)
          # Sum of all .js files (excluding .js.map) in KB
          JS_SIZE_KB=$(find native-shell/ui/dist/assets -name '*.js' ! -name '*.map' \
            -exec du -sk {} + 2>/dev/null \
            | awk '{sum+=$1}END{print sum+0}')
          BUDGET_KB=2048

          echo "### JS Budget Check:" >> $GITHUB_STEP_SUMMARY
          echo "- JS total: ${JS_SIZE_KB}KB" >> $GITHUB_STEP_SUMMARY
          echo "- Budget:   ${BUDGET_KB}KB" >> $GITHUB_STEP_SUMMARY

          if [ "$JS_SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "- **OVER BUDGET by $((JS_SIZE_KB - BUDGET_KB))KB**" >> $GITHUB_STEP_SUMMARY
            echo "::error::JS bundle size ${JS_SIZE_KB}KB exceeds budget ${BUDGET_KB}KB"
            exit 1
          else
            echo "- Remaining: $((BUDGET_KB - JS_SIZE_KB))KB" >> $GITHUB_STEP_SUMMARY
            echo "JS bundle size ${JS_SIZE_KB}KB is within budget ${BUDGET_KB}KB"
          fi

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'bundle-stats'
          path: |
            frontend/dist-size.txt
            frontend/bundle-stats.txt
          retention-days: 30

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const distSize = fs.readFileSync('frontend/dist-size.txt', 'utf8').trim();
            const bundleStats = fs.readFileSync('frontend/bundle-stats.txt', 'utf8').trim();

            const comment = [
              '## Bundle Size Report',
              '',
              `**Total dist size:** ${distSize}`,
              '',
              '### JavaScript Files (no source maps):',
              '```',
              bundleStats,
              '```',
              '',
              '### Budget Status:',
              '- Budget: 2048KB (JS only)',
              `- See [detailed analysis](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

  # ── Performance Benchmarks ────────────────────────────────────────
  # Runs Playwright performance tests against the preview server.
  # These tests are aspirational — they require a full backend (.NET)
  # that is NOT available in CI.  The job gracefully skips when the
  # backend webServer cannot start and does NOT block the pipeline.
  performance-benchmarks:
    name: 'Performance Benchmarks'
    runs-on: ubuntu-latest
    # Benchmarks are informational; do not block the pipeline
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check benchmark prerequisites
        id: prereq
        run: |
          READY=true

          if [ ! -f "tests/e2e/performance-benchmarks.spec.ts" ]; then
            echo "::notice::Performance benchmark spec not found — skipping"
            READY=false
          fi

          # The root playwright.config.ts requires a .NET backend project.
          # It tries 'cd backend/Terrafusion.API' — check that exact path.
          if [ ! -d "backend/Terrafusion.API" ]; then
            echo "::notice::Backend project directory (backend/Terrafusion.API) not found — webServer cannot start, skipping benchmarks"
            READY=false
          fi

          echo "ready=$READY" >> $GITHUB_OUTPUT

      - name: Install Playwright
        if: steps.prereq.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        if: steps.prereq.outputs.ready == 'true'
        run: pnpm -C frontend run build
        env:
          NODE_ENV: production

      - name: Run performance benchmarks
        if: steps.prereq.outputs.ready == 'true'
        run: |
          pnpm exec playwright test tests/e2e/performance-benchmarks.spec.ts \
            --project='Performance Testing'
        env:
          CI: true

      - name: Upload performance results
        if: always() && steps.prereq.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 'performance-benchmarks'
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate performance summary
        if: always()
        run: |
          echo "## Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prereq.outputs.ready }}" != "true" ]; then
            echo "Benchmarks skipped — prerequisites not met (see notices above)." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Metrics Tested:" >> $GITHUB_STEP_SUMMARY
            echo "- Page load time" >> $GITHUB_STEP_SUMMARY
            echo "- Render time" >> $GITHUB_STEP_SUMMARY
            echo "- Component mount time" >> $GITHUB_STEP_SUMMARY
            echo "- Data fetch latency" >> $GITHUB_STEP_SUMMARY
            echo "- Interaction responsiveness" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Summary Report ────────────────────────────────────────────────
  # Gates on lighthouse + bundle-size only (benchmarks are informational).
  performance-report:
    name: 'Performance Summary Report'
    runs-on: ubuntu-latest
    needs: [lighthouse-audit, bundle-size-analysis, performance-benchmarks]
    if: always()

    steps:
      - name: Generate comprehensive performance report
        run: |
          echo "# Comprehensive Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results:" >> $GITHUB_STEP_SUMMARY
          echo "- **Lighthouse Audit:** ${{ needs.lighthouse-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Size Analysis:** ${{ needs.bundle-size-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Benchmarks:** ${{ needs.performance-benchmarks.result }} (informational)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lighthouse-audit.result }}" == "success" ] && \
             [ "${{ needs.bundle-size-analysis.result }}" == "success" ]; then
            echo "## All Performance Gates Passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Performance Issues Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the detailed reports above and optimize before merging." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify performance standards
        run: |
          if [ "${{ needs.lighthouse-audit.result }}" != "success" ] || \
             [ "${{ needs.bundle-size-analysis.result }}" != "success" ]; then
            echo "::error::Performance gates failed — review required"
            exit 1
          fi
          echo "All performance gates passed"
