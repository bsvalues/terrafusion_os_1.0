# Tier-1 UI Harness Suite - Universal PR gate (branch protection enforced)
# Target: All PRs to main (required check per branch protection)
# Philosophy: Comprehensive coverage of page-level component suites

name: Tier-1 UI Harness Suite

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter pattern (default: all Tier-1 suites)'
        required: false
        type: string
        default: 'tier1'
  push:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC (9pm ET / 6pm PT)
    - cron: '0 2 * * *'

permissions:
  contents: read # For creating issue on failure

concurrency:
  group: tier1-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  tier1-harness:
    name: 🧪 Tier-1 UI Harness Validation
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard against expect(value, message) smell
        id: expect-guard
        shell: bash
        run: |
          set -euo pipefail
          echo "🔒 Checking for invalid expect(value, message) pattern..."

          # Pattern: expect(value, "message"); without matcher (double-quoted only for simplicity)
          # Matches: expect(x, "msg");
          # Excludes: expect([a, b]).toContain(), expect(value).toMatch("x")
          # Note: Single quotes/backticks tolerated (manual review) to avoid shell quoting complexity
          if grep -Rn --include="*.test.ts" --include="*.test.tsx" \
            -E 'expect\([^[{]+, *"[^"]*"\);' \
            frontend/apps/os-shell/src/__tests__/ 2>/dev/null | head -n 5; then
            echo "❌ Found invalid expect(value, message) pattern"
            echo "Use error-first: if (!condition) throw new Error(message); expect(value).matcher();"
            exit 1
          fi

          echo "✅ No invalid expect() patterns detected"

      - name: Run Tier-1 test suites
        id: tests
        shell: bash
        run: |
          set -euo pipefail

          TEST_FILTER="${{ inputs.test_filter }}"

          if [ "$TEST_FILTER" = "tier1" ] || [ -z "$TEST_FILTER" ]; then
            echo "🧪 Running Tier-1 harness suites (ShellHome/StandaloneHome + registry)..."
            pnpm -C frontend run test:tier1
          else
            echo "🧪 Running custom test filter: $TEST_FILTER"
            pnpm -C frontend test -- "$TEST_FILTER"
          fi

      - name: Upload test results on failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: tier1-test-results-${{ github.sha }}
          path: |
            frontend/coverage/
            frontend/test-results/
          retention-days: 7

      - name: Tier-1 Summary
        if: always()
        shell: bash
        run: |
          echo "## 🧪 Tier-1 UI Harness Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Audit Trail**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "> ✅ **Tier-1 PASSED** - Release gate satisfied" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All page-level harness suites validated successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ❌ **Tier-1 FAILED** - Blocks v1.0.0 tag" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Failing Suites (expected during stabilization):**" >> $GITHUB_STEP_SUMMARY
            echo "- \`suiteTiles.accessibility.test.tsx\` - ShellHome rendering + osActions mocks" >> $GITHUB_STEP_SUMMARY
            echo "- \`suiteTiles.routing.test.tsx\` - ShellHome routing harness" >> $GITHUB_STEP_SUMMARY
            echo "- \`standaloneHomes.qualityGate.test.tsx\` - StandaloneHome quality enforcement" >> $GITHUB_STEP_SUMMARY
            echo "- \`standaloneHomes.accessibility.test.tsx\` - StandaloneHome a11y harness" >> $GITHUB_STEP_SUMMARY
            echo "- \`standaloneHomes.navigation.test.tsx\` - StandaloneHome navigation" >> $GITHUB_STEP_SUMMARY
            echo "- \`registryConsistency.test.ts\` - Module registry validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Tracked Work:** 'Stabilize ShellHome/StandaloneHome harness mocks' (4-6h est.)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Impact:** Does NOT block PR merges (Tier-0 SEAL still gates). Blocks v1.0.0 tag until resolved." >> $GITHUB_STEP_SUMMARY
          fi
