name: 🚀 Release Compliance Gate

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'
  SYFT_VERSION: 'v1.51.0'
  GRYPE_VERSION: 'v0.99.1'
  FORGE_VALUATION_KERNEL_IMAGE: 'ghcr.io/bsvalues/terrafusion-forge-valuation-kernel'
  FORGE_VALUATION_KERNEL_DIGEST: 'sha256:0701e52e2b48fe2ceb614ee3c8f3c26992425096f014a0995704fc04a7a70066'
  FORGE_VALUATION_KERNEL_REF: 'ghcr.io/bsvalues/terrafusion-forge-valuation-kernel@sha256:0701e52e2b48fe2ceb614ee3c8f3c26992425096f014a0995704fc04a7a70066'
  FORGE_VALUATION_KERNEL_PRODUCER_COMMIT: '3fc296da17aaca4c32dd9b727ab62d2d3725d789'
  FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT: '24059c3642339f36877cb454ca63683180915b71'
  FORGE_VALUATION_KERNEL_ARTIFACT_TYPE: 'terraforge.valuation-kernel.linux-x64-musl@1'
  FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_SHA256: '3d83a4a998eabb30b2993e6c777ae5924ca2a7e6f1bd915f7698606fd077fcd6'
  FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256: 'a371d8f421b66cd2f83073ed108c885facc97323f9a351547d7293259978c298'

jobs:
  full-tests:
    name: 🧪 Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: terrafusion_test
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          dotnet restore backend/TerraFusion.sln
      - name: Build
        run: |
          pnpm run build
          dotnet build backend/TerraFusion.sln -c Release --no-restore
      - name: Frontend unit tests
        run: pnpm run test:unit
      - name: Release lifecycle contract tests
        run: pnpm run test:release-lifecycle
      - name: Backend tests (all)
        run: dotnet test backend/TerraFusion.sln -c Release --no-build -v:normal
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Database=terrafusion_test;Username=postgres;Password=terrafusion_test'
      - name: Authenticated property Workbench release smoke
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run smoke:workbench
        env:
          CI: true

  sbom-compliance:
    name: 📦 Publish Once, SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.publish-refs.outputs.backend_image }}
      backend-digest: ${{ steps.publish-refs.outputs.backend_digest }}
      backend-ref: ${{ steps.publish-refs.outputs.backend_ref }}
      frontend-image: ${{ steps.publish-refs.outputs.frontend_image }}
      frontend-digest: ${{ steps.publish-refs.outputs.frontend_digest }}
      frontend-ref: ${{ steps.publish-refs.outputs.frontend_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install SBOM policy dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact Forge valuation producer payload
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$FORGE_VALUATION_KERNEL_REF"
          FORGE_CONTAINER="$(docker create "$FORGE_VALUATION_KERNEL_REF")"
          cleanup_forge_container() {
            docker rm -f "$FORGE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_forge_container EXIT
          docker cp "$FORGE_CONTAINER:/manifest.json" forge-valuation-kernel-producer-manifest.json
          docker cp "$FORGE_CONTAINER:/terraforge-kernel-valuation" forge-valuation-kernel-executable
          test -s forge-valuation-kernel-producer-manifest.json
          test -s forge-valuation-kernel-executable
          echo "$FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_SHA256  forge-valuation-kernel-producer-manifest.json" | sha256sum -c -
          echo "$FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256  forge-valuation-kernel-executable" | sha256sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateForgeProducerManifestDocument } from './scripts/ci/release_image_manifest.mjs';
          validateForgeProducerManifestDocument(
            JSON.parse(fs.readFileSync('forge-valuation-kernel-producer-manifest.json', 'utf8'))
          );
          NODE
          chmod 0555 forge-valuation-kernel-executable
          ACCEPTED="$(printf '%s' '{"contractPackVersion":"1.0.0","moduleApiVersion":"1.0.0","requestId":"release-forge-accepted","action":"valuate","payload":{"subject":{"parcelId":"RELEASE-SYNTHETIC","attributes":{}},"costBreakdown":{"replacementCost":100,"depreciation":10,"rcnld":90},"model":{"landValue":30,"adjustmentFactors":null}}}' | ./forge-valuation-kernel-executable)"
          REJECTED="$(printf '%s' '{"contractPackVersion":"1.0.0","moduleApiVersion":"1.0.0","requestId":"release-forge-rejected","action":"not-admitted","payload":{}}' | ./forge-valuation-kernel-executable)"
          jq -e '.success == true and .data.totalValue == 120' <<<"$ACCEPTED" >/dev/null
          jq -e '.success == false and (.data == null)' <<<"$REJECTED" >/dev/null
          cleanup_forge_container
          trap - EXIT
      - name: Resolve canonical image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=ghcr.io/${OWNER}/terrafusion-os-backend-internal" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/terrafusion-os-frontend-internal" >> "$GITHUB_OUTPUT"
      - name: Publish backend runtime image
        id: backend-build
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.images.outputs.backend }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          build-contexts: |
            forge-valuation-kernel=docker-image://ghcr.io/bsvalues/terrafusion-forge-valuation-kernel@sha256:0701e52e2b48fe2ceb614ee3c8f3c26992425096f014a0995704fc04a7a70066
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish frontend production image
        id: frontend-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Bind published digest references
        id: publish-refs
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_IMAGE="${{ steps.images.outputs.backend }}"
          FRONTEND_IMAGE="${{ steps.images.outputs.frontend }}"
          BACKEND_DIGEST="${{ steps.backend-build.outputs.digest }}"
          FRONTEND_DIGEST="${{ steps.frontend-build.outputs.digest }}"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "backend_image=$BACKEND_IMAGE"
            echo "backend_digest=$BACKEND_DIGEST"
            echo "backend_ref=$BACKEND_IMAGE@$BACKEND_DIGEST"
            echo "frontend_image=$FRONTEND_IMAGE"
            echo "frontend_digest=$FRONTEND_DIGEST"
            echo "frontend_ref=$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          } >> "$GITHUB_OUTPUT"
          {
            echo "BACKEND_IMAGE_REF=$BACKEND_IMAGE@$BACKEND_DIGEST"
            echo "FRONTEND_IMAGE_REF=$FRONTEND_IMAGE@$FRONTEND_DIGEST"
          } >> "$GITHUB_ENV"
      - name: Install pinned Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/2293641e3bd628a01bb37639318d62c0ebe89b39/install.sh | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version
      - name: Install pinned Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/6e1807dd7130c9eff23c1bad19a96cc6afef33aa/install.sh | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          grype version
      - name: Generate backend runtime and frontend browser/build dependency SBOMs
        run: |
          set -euo pipefail
          syft "registry:$BACKEND_IMAGE_REF" -o spdx-json=sbom-backend-runtime-spdx.json -o cyclonedx-json=sbom-backend-runtime-cyclonedx.json

          docker pull "$BACKEND_IMAGE_REF"
          BACKEND_CONTAINER="$(docker create "$BACKEND_IMAGE_REF")"
          cleanup_backend_container() {
            docker rm -f "$BACKEND_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_backend_container EXIT
          test ! -e backend-runtime-root
          mkdir backend-runtime-root
          docker cp "$BACKEND_CONTAINER:/app/." backend-runtime-root/
          test -n "$(find backend-runtime-root -type f -print -quit)"
          EMBEDDED_FORGE_ROOT="backend-runtime-root/.terrafusion/runtime/forge/valuation"
          test -x "$EMBEDDED_FORGE_ROOT/terraforge-kernel-valuation"
          test -s "$EMBEDDED_FORGE_ROOT/producer-manifest.json"
          echo "$FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256  $EMBEDDED_FORGE_ROOT/terraforge-kernel-valuation" | sha256sum -c -
          echo "$FORGE_VALUATION_KERNEL_PRODUCER_MANIFEST_SHA256  $EMBEDDED_FORGE_ROOT/producer-manifest.json" | sha256sum -c -
          cmp forge-valuation-kernel-producer-manifest.json "$EMBEDDED_FORGE_ROOT/producer-manifest.json"
          cp "$EMBEDDED_FORGE_ROOT/producer-manifest.json" forge-valuation-kernel-producer-manifest.json
          cleanup_backend_container
          trap - EXIT

          docker pull "$FRONTEND_IMAGE_REF"
          FRONTEND_CONTAINER="$(docker create "$FRONTEND_IMAGE_REF")"
          cleanup_frontend_container() {
            docker rm -f "$FRONTEND_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_frontend_container EXIT
          docker cp             "$FRONTEND_CONTAINER:/usr/share/terrafusion/sbom/frontend-dependencies.spdx.json"             sbom-frontend-dependencies-spdx.json
          docker cp             "$FRONTEND_CONTAINER:/usr/share/terrafusion/sbom/frontend-build-dependencies.spdx.json"             sbom-frontend-build-dependencies-spdx.json
          test -s sbom-frontend-dependencies-spdx.json
          test -s sbom-frontend-build-dependencies-spdx.json
          cleanup_frontend_container
          trap - EXIT
      - name: Guard exact published backend dependency identities
        run: node scripts/ci/backend_published_deps_guard.mjs backend-runtime-root
      - name: Guard exact Semantic Kernel advisory suppression
        run: node scripts/ci/backend_semantic_kernel_advisory_guard.mjs sbom-backend-runtime-spdx.json backend-runtime-root backend
      - name: Generate backend runtime license evidence summary
        run: |
          node scripts/ci/backend_runtime_license_evidence.mjs \
            sbom-backend-runtime-spdx.json \
            backend-runtime-license-evidence.json \
            "${GITHUB_SHA}" \
            "${{ steps.publish-refs.outputs.backend_image }}" \
            "${{ steps.publish-refs.outputs.backend_digest }}" \
            "${BACKEND_IMAGE_REF}"
      - name: Blocking vulnerability policy
        run: |
          set -euo pipefail
          grype --config scripts/ci/grype-release.yaml sbom:sbom-backend-runtime-spdx.json -o table --fail-on critical
          grype sbom:sbom-frontend-dependencies-spdx.json -o table --fail-on high
          grype sbom:sbom-frontend-build-dependencies-spdx.json -o table --fail-on high
      - name: Blocking frontend dependency license policy
        run: node scripts/ci/release_sbom_policy.mjs sbom-frontend-dependencies-spdx.json sbom-frontend-build-dependencies-spdx.json
      - name: Create immutable release image manifest
        run: |
          node scripts/ci/release_image_manifest.mjs create \
            --release-sha "${GITHUB_SHA}" \
            --backend-image "${{ steps.publish-refs.outputs.backend_image }}" \
            --backend-digest "${{ steps.publish-refs.outputs.backend_digest }}" \
            --frontend-image "${{ steps.publish-refs.outputs.frontend_image }}" \
            --frontend-digest "${{ steps.publish-refs.outputs.frontend_digest }}" \
            --backend-license-evidence backend-runtime-license-evidence.json \
            --forge-image "$FORGE_VALUATION_KERNEL_IMAGE" \
            --forge-digest "$FORGE_VALUATION_KERNEL_DIGEST" \
            --forge-producer-commit "$FORGE_VALUATION_KERNEL_PRODUCER_COMMIT" \
            --forge-canonical-source-commit "$FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT" \
            --forge-artifact-type "$FORGE_VALUATION_KERNEL_ARTIFACT_TYPE" \
            --forge-producer-manifest forge-valuation-kernel-producer-manifest.json \
            --forge-executable-sha256 "$FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256" \
            --out release-images.json
      - name: Upload full SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: |
            sbom-*.json
            backend-runtime-license-evidence.json
            forge-valuation-kernel-producer-manifest.json
          retention-days: 365
      - name: Upload technical release inputs (backend distribution approval remains required)
        uses: actions/upload-artifact@v4
        with:
          name: release-image-inputs
          path: |
            release-images.json
            backend-runtime-license-evidence.json
            forge-valuation-kernel-producer-manifest.json
          retention-days: 365

  container-security:
    name: 🐳 Container Security
    needs: [sbom-compliance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ${{ needs.sbom-compliance.outputs.backend-ref }}
          - component: frontend
            image: ${{ needs.sbom-compliance.outputs.frontend-ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy exact release image scan (${{ matrix.component }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: 'sarif'
          output: 'container-trivy-${{ matrix.component }}.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
          timeout: '15m'
          version: 'v0.70.0'
          trivyignores: '.trivyignore.yaml'
      - name: Upload container security results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'container-trivy-${{ matrix.component }}.sarif'
          category: 'release-container-${{ matrix.component }}'

  security-deep-scan:
    name: 🔒 Security Deep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript,csharp
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Trivy canonical backend vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-fs-backend-vulnerabilities.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
          version: 'v0.70.0'
          skip-dirs: 'backend/ai-models,backend/publish,backend/src/TerraFusion.API/publish'
      - name: Upload backend vulnerability results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-backend-vulnerabilities.sarif'
          category: 'release-source-backend-vulnerabilities'
      - name: Trivy all-tracked backend secret scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-fs-backend-secrets.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          exit-code: '1'
          version: 'v0.70.0'
      - name: Upload backend secret results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-backend-secrets.sarif'
          category: 'release-source-backend-secrets'

  provenance:
    name: 🔏 Image Digest Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [full-tests, sbom-compliance, container-security, security-deep-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Attest backend image digest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ needs.sbom-compliance.outputs.backend-image }}
          subject-digest: ${{ needs.sbom-compliance.outputs.backend-digest }}
          push-to-registry: true
      - name: Attest frontend image digest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ needs.sbom-compliance.outputs.frontend-image }}
          subject-digest: ${{ needs.sbom-compliance.outputs.frontend-digest }}
          push-to-registry: true
      - name: Create truthful release summary
        run: |
          echo "# 🚀 Release Compliance Summary: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Unit, backend, and authenticated property Workbench release smoke passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend browser-production and exact Docker-build dependency license policies passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend runtime SBOM was recorded and passed the blocking CRITICAL vulnerability gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- BACKEND LEGAL WALL: runtime license inventory is evidence-only; protected release/legal approval is required before RC promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Exact images passed blocking vulnerability scans" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Backend: ${{ needs.sbom-compliance.outputs.backend-ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Frontend: ${{ needs.sbom-compliance.outputs.frontend-ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Forge valuation payload: $FORGE_VALUATION_KERNEL_REF (producer $FORGE_VALUATION_KERNEL_PRODUCER_COMMIT; canonical source $FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Forge producer platform attestation: unavailable; this gate makes no Workbench-adoption or county-readiness claim" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Image-digest provenance published for the TerraFusion backend and frontend images" >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    name: 🚀 Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [full-tests, sbom-compliance, container-security, security-deep-scan, provenance]
    permissions:
      contents: read
    steps:
      - name: Check all blocking gates
        run: |
          set -euo pipefail
          FAILED=0
          for gate in \
            "Full Tests:${{ needs.full-tests.result }}" \
            "SBOM Compliance:${{ needs.sbom-compliance.result }}" \
            "Container Security:${{ needs.container-security.result }}" \
            "Security Deep Scan:${{ needs.security-deep-scan.result }}" \
            "Provenance:${{ needs.provenance.result }}"; do
            NAME="${gate%%:*}"
            RESULT="${gate#*:}"
            if [ "$RESULT" != success ]; then
              echo "❌ $NAME: $RESULT"
              FAILED=1
            else
              echo "✅ $NAME: passed"
            fi
          done
          test "$FAILED" -eq 0
      - uses: actions/checkout@v4
      - name: Download release image inputs
        uses: actions/download-artifact@v4
        with:
          name: release-image-inputs
          path: approved-inputs
      - name: Verify approved manifest against job outputs
        run: |
          node scripts/ci/release_image_manifest.mjs verify \
            --manifest approved-inputs/release-images.json \
            --release-sha "${GITHUB_SHA}" \
            --backend-image "${{ needs.sbom-compliance.outputs.backend-image }}" \
            --backend-digest "${{ needs.sbom-compliance.outputs.backend-digest }}" \
            --frontend-image "${{ needs.sbom-compliance.outputs.frontend-image }}" \
            --frontend-digest "${{ needs.sbom-compliance.outputs.frontend-digest }}" \
            --backend-license-evidence approved-inputs/backend-runtime-license-evidence.json \
            --forge-image "$FORGE_VALUATION_KERNEL_IMAGE" \
            --forge-digest "$FORGE_VALUATION_KERNEL_DIGEST" \
            --forge-producer-commit "$FORGE_VALUATION_KERNEL_PRODUCER_COMMIT" \
            --forge-canonical-source-commit "$FORGE_VALUATION_KERNEL_CANONICAL_SOURCE_COMMIT" \
            --forge-artifact-type "$FORGE_VALUATION_KERNEL_ARTIFACT_TYPE" \
            --forge-producer-manifest approved-inputs/forge-valuation-kernel-producer-manifest.json \
            --forge-executable-sha256 "$FORGE_VALUATION_KERNEL_EXECUTABLE_SHA256"
      - name: Publish technically approved release artifacts (not backend distribution-license approval)
        uses: actions/upload-artifact@v4
        with:
          name: approved-release-images
          path: |
            approved-inputs/release-images.json
            approved-inputs/backend-runtime-license-evidence.json
          retention-days: 365
