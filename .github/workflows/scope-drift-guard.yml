name: Scope Drift Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scope-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: CI tooling preflight
        run: |
          node --version
          echo "Running zero-dependency preflight check..."
          node scripts/ci/toolingPreflight.js

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Scope Proof (Tests + Generation + Drift Check)
        run: pnpm run ci:scope-proof
