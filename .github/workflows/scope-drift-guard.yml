name: Scope Drift Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scope-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Scope classifier tests
        run: pnpm -C tools/scope-classifier test

      - name: Generate deterministic scope outputs
        run: pnpm tf:scope -- --solidBase=567fbcec5 --archAnchor=9af5bb291

      - name: Drift guard (must be clean)
        run: git diff --exit-code
