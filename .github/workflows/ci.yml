name: TerraFusion OS 1.0 - Continuous Integration

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  NODE_VERSION: '18'
  DOTNET_VERSION: '8.0.x'

jobs:
  quality-gate:
    name: Quality Gate Validation
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled - package-lock.json is gitignored

      - name: 🔵 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          npm install
          dotnet restore

      - name: 🔍 Code Quality Check
        run: |
          npm run lint
          npm run type-check

      - name: 🧪 Run Tests
        run: |
          npm run test:unit
          dotnet test --no-restore --verbosity normal

      - name: 🛡️ Security Scan
        run: |
          npm audit --audit-level moderate
          dotnet list package --vulnerable

      - name: 🤖 AI Model Validation
        run: npm run validate:ai-models

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🔵 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore Dependencies
        run: dotnet restore

      - name: 🔨 Build Backend
        run: dotnet build --no-restore

      - name: 🧪 Run Integration Tests
        run: dotnet test --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: 'Host=localhost;Database=terrafusion_test;Username=postgres;Password=postgres'

      - name: 📊 Generate Coverage Report
        run: |
          dotnet test --collect:"XPlat Code Coverage"
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:Html

  frontend-tests:
    name: Frontend React Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled - package-lock.json is gitignored

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔨 Build Frontend
        run: npm run build

      - name: 🧪 Run React Tests
        run: npm run test:coverage

      - name: 🎭 Run E2E Tests
        run: npm run test:e2e

  ai-validation:
    name: AI System Validation
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled - package-lock.json is gitignored

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🤖 Validate AI Agents
        run: npm run validate:agents

      - name: 🧠 Test AI Model Hub
        run: npm run test:ai-models

      - name: ⚡ Quantum Performance Test
        run: npm run test:quantum

      - name: 🏛️ Government Compliance Check
        run: npm run validate:compliance

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📋 Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔐 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'csharp,javascript'

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-validation, security-scan]

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled - package-lock.json is gitignored

      - name: 🔵 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Install Dependencies
        run: |
          npm install
          dotnet restore

      - name: 🔨 Build Application
        run: |
          npm run build:production
          dotnet publish -c Release -o ./publish

      - name: 🐳 Build Docker Images
        run: |
          docker build -t terrafusion-os:latest .
          docker build -f Dockerfile.ai -t terrafusion-ai:latest .

      - name: 📦 Create Release Package
        run: |
          tar -czf terrafusion-os-1.0.tar.gz ./publish ./frontend/dist
          zip -r terrafusion-os-1.0.zip ./publish ./frontend/dist

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terrafusion-os-build
          path: |
            terrafusion-os-1.0.tar.gz
            terrafusion-os-1.0.zip
            ./publish
            ./frontend/dist

  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-and-package

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled - package-lock.json is gitignored

      - name: 📦 Install Dependencies
        run: npm install

      - name: ⚡ Run Performance Tests
        run: npm run test:performance

      - name: 📊 Generate Performance Report
        run: npm run report:performance

      - name: 📈 Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: ./performance-reports/

  # ═══════════════════════════════════════════════════════════════════════════
  # 🔒 TERRAFUSION SEAL GATE - SINGLE SOURCE OF TRUTH
  # ═══════════════════════════════════════════════════════════════════════════
  # "GitHub Actions is not your CI system. TerraFusion is your CI system."
  # See: docs/ci/CI_CONSTITUTION.md
  # ═══════════════════════════════════════════════════════════════════════════
  seal-gate:
    name: 🔒 TerraFusion Seal Gate
    runs-on: ubuntu-latest
    needs:
      [
        backend-tests,
        frontend-tests,
        ai-validation,
        security-scan,
        build-and-package,
        performance-test,
      ]

    env:
      RUNTIMECERT_COUNTY: benton
      RUNTIMECERT_STRICT: 'true'
      # RUNTIMECERT_BASE_URL: ${{ secrets.PROD_API_URL }}  # Enable for live certification

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🔵 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore .NET Dependencies
        run: dotnet restore

      - name: 🔒 TerraFusion Seal Gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci-seal-gate.ps1

      - name: 📤 Upload Seal Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrafusion-seal-artifacts
          path: |
            artifacts/**
            docs/spec-lock/INDEX.md
          if-no-files-found: warn
