name: TerraFusion OS 1.0 - Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

env:
  NODE_VERSION: '18'
  DOTNET_VERSION: '8.0.x'

jobs:
  quality-gate:
    name: Quality Gate Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Detect Node lockfile and validate submodules to avoid CI fatal errors
    - name: Detect Node lockfile
      id: node_lock
      run: |
        set -euo pipefail
        for f in package-lock.json npm-shrinkwrap.json yarn.lock pnpm-lock.yaml; do
          if git ls-files -- "$f" | grep -q .; then
            echo "found=$f" >> $GITHUB_OUTPUT
            echo "Detected lockfile: $f"
            exit 0
          fi
        done
        echo "found=" >> $GITHUB_OUTPUT
        echo "No Node lockfile found; Node cache/install steps will be skipped."

    - name: Validate submodule URLs
      id: submods
      run: |
        set -euo pipefail
        missing=0
        if [ -f .gitmodules ]; then
          while read -r section; do
            path=$(git config -f .gitmodules --get "${section}.path" || true)
            url=$(git config -f .gitmodules --get "${section}.url" || true)
            if [ -n "${path}" ] && [ -z "${url}" ]; then
              echo "::warning::Submodule '${path}' is missing 'url' in .gitmodules – skipping submodule init."
              missing=1
            fi
          done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path' | sed 's/\.path$//')
        fi
        echo "missing=$missing" >> $GITHUB_OUTPUT

    - name: Submodule sync/init
      if: steps.submods.outputs.missing == '0'
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive

    - name: Skip submodule init due to invalid entries
      if: steps.submods.outputs.missing == '1'
      run: |
        echo "Skipping submodule init; invalid .gitmodules entries detected (warnings above)."

    - name: 🟢 Setup Node.js
      if: steps.node_lock.outputs.found != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 🔵 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Install Dependencies
      run: |
        set -euo pipefail
        # Install Node deps only when we detected a lockfile
        if [ "${{ steps.node_lock.outputs.found }}" != "" ]; then
          case "${{ steps.node_lock.outputs.found }}" in
            package-lock.json|npm-shrinkwrap.json)
              npm ci
              ;;
            yarn.lock)
              yarn install --frozen-lockfile
              ;;
            pnpm-lock.yaml)
              pnpm i --frozen-lockfile
              ;;
          esac
        else
          echo "No Node lockfile detected, skipping Node install."
        fi

        # .NET restore always
        dotnet restore

    - name: 🔍 Code Quality Check
      run: |
        npm run lint
        npm run type-check

    - name: 🧪 Run Tests
      run: |
        npm run test:unit
        dotnet test --no-restore --verbosity normal

    - name: 🛡️ Security Scan
      run: |
        npm audit --audit-level moderate
        dotnet list package --vulnerable

    - name: 🤖 AI Model Validation
      run: npm run validate:ai-models

    - name: Job summary
      if: always()
      env:
        NODE_LOCK_FOUND: ${{ steps.node_lock.outputs.found }}
        SUBMODS_MISSING: ${{ steps.submods.outputs.missing }}
      run: |
        set -euo pipefail
        echo "### Quality Gate summary" >> $GITHUB_STEP_SUMMARY
        if [ -z "$NODE_LOCK_FOUND" ]; then
          echo "- Node lockfile: not found — Node install steps skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Node lockfile: found ($NODE_LOCK_FOUND)" >> $GITHUB_STEP_SUMMARY
        fi
        if [ "$SUBMODS_MISSING" = "1" ]; then
          echo "- Submodules: invalid entries detected — submodule init skipped (see warnings above)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- Submodules: validated OK (no missing URLs)" >> $GITHUB_STEP_SUMMARY
        fi

  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🔵 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore Dependencies
      run: dotnet restore

    - name: 🔨 Build Backend
      run: dotnet build --no-restore

    - name: 🧪 Run Integration Tests
      run: dotnet test --no-build --verbosity normal
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Database=terrafusion_test;Username=postgres;Password=postgres"

    - name: 📊 Generate Coverage Report
      run: |
        dotnet test --collect:"XPlat Code Coverage"
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:Html

  frontend-tests:
    name: Frontend React Tests
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔨 Build Frontend
      run: npm run build

    - name: 🧪 Run React Tests
      run: npm run test:coverage

    - name: 🎭 Run E2E Tests
      run: npm run test:e2e

  ai-validation:
    name: AI System Validation
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🤖 Validate AI Agents
      run: npm run validate:agents

    - name: 🧠 Test AI Model Hub
      run: npm run test:ai-models

    - name: ⚡ Quantum Performance Test
      run: npm run test:quantum

    - name: 🏛️ Government Compliance Check
      run: npm run validate:compliance

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality-gate
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🛡️ Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📋 Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: 🔐 CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: 'csharp,javascript'

    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  build-and-package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, ai-validation, security-scan]
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 🔵 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Install Dependencies
      run: |
        npm ci
        dotnet restore

    - name: 🔨 Build Application
      run: |
        npm run build:production
        dotnet publish -c Release -o ./publish

    - name: 🐳 Build Docker Images
      run: |
        docker build -t terrafusion-os:latest .
        docker build -f Dockerfile.ai -t terrafusion-ai:latest .

    - name: 📦 Create Release Package
      run: |
        tar -czf terrafusion-os-1.0.tar.gz ./publish ./frontend/dist
        zip -r terrafusion-os-1.0.zip ./publish ./frontend/dist

    - name: 📤 Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: terrafusion-os-build
        path: |
          terrafusion-os-1.0.tar.gz
          terrafusion-os-1.0.zip
          ./publish
          ./frontend/dist

  performance-test:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: build-and-package
    
    steps:
    - name: 🔄 Checkout Code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: ⚡ Run Performance Tests
      run: npm run test:performance

    - name: 📊 Generate Performance Report
      run: npm run report:performance

    - name: 📈 Upload Performance Results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: ./performance-reports/
