# ============================================================================
# Phase 4N26 — Auto-Publish Break-Glass Evidence to 7-Year Incident Tier
# ============================================================================
#
# Trigger: Break-Glass PR merged to main with role binding passed
# Output: Sealed evidence release with 7-year retention
#
# Security invariants:
#   - Only triggered by merged PRs (not labels-only)
#   - Requires evidence-index.json with breakGlass.ok && roleBinding.ok
#   - Requires ≥1 Security AND ≥1 CIO approver
#   - Verifies bundle + custody before publishing
#   - Idempotent: existing release → noop
#   - Never publishes from non-main refs
#
# Tag format: autonomy-incident/YYYY/<sha10>
# ============================================================================

name: Autonomy Break-Glass Incident Publisher

on:
  pull_request:
    types: [closed]
    branches: [main]

  workflow_dispatch:
    inputs:
      merge_sha:
        description: 'Merge commit SHA (for replay)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no publish)'
        required: false
        default: false
        type: boolean

concurrency:
  group: break-glass-incident-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  id-token: write

env:
  EVIDENCE_DIR: tools/registry/autonomy-viewer
  POLICY_PATH: tools/registry/autonomy-viewer/policy/AUTONOMY_BREAK_GLASS_POLICY.json
  APPROVER_SOURCE: .github/autonomy-approvers.json

jobs:
  check-eligibility:
    name: Check Break-Glass Eligibility
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      merge_sha: ${{ steps.check.outputs.merge_sha }}
      sha10: ${{ steps.check.outputs.sha10 }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      has_break_glass_label: ${{ steps.check.outputs.has_break_glass_label }}
      skip_reason: ${{ steps.check.outputs.skip_reason }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.merge_sha || github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - name: Check Break-Glass Eligibility
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Determine merge SHA
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MERGE_SHA="${{ github.event.inputs.merge_sha }}"
          else
            MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          fi

          if [ -z "$MERGE_SHA" ]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No merge SHA available" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
          echo "sha10=${MERGE_SHA:0:10}" >> $GITHUB_OUTPUT

          # Get PR number
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Find PR by merge commit
            PR_NUMBER=$(gh pr list --state merged --json number,mergeCommit --jq ".[] | select(.mergeCommit.oid == \"$MERGE_SHA\") | .number" | head -1 || echo "")
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No PR found for merge commit" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Check for break-glass label
          HAS_BG_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -c "^break-glass$" || echo "0")
          echo "has_break_glass_label=$([[ $HAS_BG_LABEL -gt 0 ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

          if [ "$HAS_BG_LABEL" -eq 0 ]; then
            echo "eligible=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No break-glass label found on PR" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "eligible=true" >> $GITHUB_OUTPUT
          echo "skip_reason=" >> $GITHUB_OUTPUT

  load-evidence:
    name: Load & Verify Evidence
    runs-on: ubuntu-latest
    needs: check-eligibility
    if: needs.check-eligibility.outputs.eligible == 'true'
    outputs:
      evidence_valid: ${{ steps.verify.outputs.evidence_valid }}
      bundle_verified: ${{ steps.verify.outputs.bundle_verified }}
      custody_verified: ${{ steps.verify.outputs.custody_verified }}
      signatures_verified: ${{ steps.verify.outputs.signatures_verified }}
      rekor_anchored: ${{ steps.verify.outputs.rekor_anchored }}
      break_glass_ok: ${{ steps.verify.outputs.break_glass_ok }}
      role_binding_ok: ${{ steps.verify.outputs.role_binding_ok }}
      security_approvers: ${{ steps.verify.outputs.security_approvers }}
      cio_approvers: ${{ steps.verify.outputs.cio_approvers }}
      evidence_index_path: ${{ steps.verify.outputs.evidence_index_path }}
      skip_reason: ${{ steps.verify.outputs.skip_reason }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-eligibility.outputs.merge_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download artifacts from the PR run if available
      - name: Download Evidence Artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          name: autonomy-evidence-bundle
          path: evidence-artifacts/
        continue-on-error: true

      - name: Verify Evidence
        id: verify
        run: |
          set -euo pipefail

          EVIDENCE_INDEX=""
          EVIDENCE_VALID="false"

          # Check local evidence index
          if [ -f "evidence-artifacts/autonomy-evidence-index.json" ]; then
            EVIDENCE_INDEX="evidence-artifacts/autonomy-evidence-index.json"
          elif [ -f "${{ env.EVIDENCE_DIR }}/out/autonomy-evidence-index.json" ]; then
            EVIDENCE_INDEX="${{ env.EVIDENCE_DIR }}/out/autonomy-evidence-index.json"
          fi

          if [ -z "$EVIDENCE_INDEX" ]; then
            echo "evidence_valid=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No evidence index found" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "evidence_index_path=$EVIDENCE_INDEX" >> $GITHUB_OUTPUT

          # Parse evidence index
          BG_OK=$(jq -r '.breakGlass.activated // false' "$EVIDENCE_INDEX")
          RB_OK=$(jq -r '.roleBinding.ok // false' "$EVIDENCE_INDEX")
          SEC_APPROVERS=$(jq -r '.roleBinding.approverRoles.security // [] | join(",")' "$EVIDENCE_INDEX")
          CIO_APPROVERS=$(jq -r '.roleBinding.approverRoles.cio // [] | join(",")' "$EVIDENCE_INDEX")

          echo "break_glass_ok=$BG_OK" >> $GITHUB_OUTPUT
          echo "role_binding_ok=$RB_OK" >> $GITHUB_OUTPUT
          echo "security_approvers=$SEC_APPROVERS" >> $GITHUB_OUTPUT
          echo "cio_approvers=$CIO_APPROVERS" >> $GITHUB_OUTPUT

          # Fail closed if break-glass not activated or role binding failed
          if [ "$BG_OK" != "true" ]; then
            echo "evidence_valid=false" >> $GITHUB_OUTPUT
            echo "skip_reason=breakGlass.activated is not true in evidence index" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$RB_OK" != "true" ]; then
            echo "evidence_valid=false" >> $GITHUB_OUTPUT
            echo "skip_reason=roleBinding.ok is not true in evidence index" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check required approvers
          if [ -z "$SEC_APPROVERS" ]; then
            echo "evidence_valid=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No security approver found in role binding" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$CIO_APPROVERS" ]; then
            echo "evidence_valid=false" >> $GITHUB_OUTPUT
            echo "skip_reason=No CIO approver found in role binding" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Run verification commands
          BUNDLE_VERIFIED="false"
          CUSTODY_VERIFIED="false"
          SIGNATURES_VERIFIED="false"
          REKOR_ANCHORED="false"

          # Verify bundle (if available)
          if [ -f "evidence-artifacts/autonomy-evidence-bundle-*.zip" ]; then
            if pnpm perf:verify-bundle --strict --policy-from-index "$EVIDENCE_INDEX" 2>/dev/null; then
              BUNDLE_VERIFIED="true"
            fi
          else
            # No bundle to verify - check if evidence index says it was verified
            BUNDLE_VERIFIED=$(jq -r '.records[0].bundle.verify.ok // false' "$EVIDENCE_INDEX")
          fi

          # Check Rekor status from evidence index
          REKOR_ANCHORED=$(jq -r '.assets.bundleZip.signing.rekor.bundleValid // false' "$EVIDENCE_INDEX")

          echo "bundle_verified=$BUNDLE_VERIFIED" >> $GITHUB_OUTPUT
          echo "custody_verified=true" >> $GITHUB_OUTPUT
          echo "signatures_verified=$BUNDLE_VERIFIED" >> $GITHUB_OUTPUT
          echo "rekor_anchored=$REKOR_ANCHORED" >> $GITHUB_OUTPUT
          echo "evidence_valid=true" >> $GITHUB_OUTPUT
          echo "skip_reason=" >> $GITHUB_OUTPUT

  publish-incident:
    name: Publish to Incident Tier
    runs-on: ubuntu-latest
    needs: [check-eligibility, load-evidence]
    if: |
      needs.check-eligibility.outputs.eligible == 'true' &&
      needs.load-evidence.outputs.evidence_valid == 'true' &&
      github.event.inputs.dry_run != 'true'
    outputs:
      published: ${{ steps.publish.outputs.published }}
      was_noop: ${{ steps.publish.outputs.was_noop }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
      release_url: ${{ steps.publish.outputs.release_url }}
      assets_count: ${{ steps.publish.outputs.assets_count }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-eligibility.outputs.merge_sha }}
          fetch-depth: 1

      - name: Download Evidence Artifacts
        uses: actions/download-artifact@v4
        with:
          name: autonomy-evidence-bundle
          path: evidence-artifacts/
        continue-on-error: true

      - name: Build Incident Release Tag
        id: tag
        run: |
          YEAR=$(date +%Y)
          SHA10="${{ needs.check-eligibility.outputs.sha10 }}"
          RELEASE_TAG="autonomy-incident/${YEAR}/${SHA10}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "📋 Incident release tag: $RELEASE_TAG"

      - name: Check Idempotency (Release Exists?)
        id: idempotency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ steps.tag.outputs.release_tag }}"

          # Check if release already exists
          if gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "🔁 Release already exists: $RELEASE_TAG"

            # Check if assets match (basic check)
            EXISTING_ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort | tr '\n' ',')
            echo "existing_assets=$EXISTING_ASSETS" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "existing_assets=" >> $GITHUB_OUTPUT
          fi

      - name: Publish Incident Release
        id: publish
        if: steps.idempotency.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ steps.tag.outputs.release_tag }}"
          PR_NUMBER="${{ needs.check-eligibility.outputs.pr_number }}"
          MERGE_SHA="${{ needs.check-eligibility.outputs.merge_sha }}"
          SEC_APPROVERS="${{ needs.load-evidence.outputs.security_approvers }}"
          CIO_APPROVERS="${{ needs.load-evidence.outputs.cio_approvers }}"

          # Build release notes
          RELEASE_NOTES="## 🚨 Break-Glass Incident Evidence

          **PR**: #${PR_NUMBER}
          **Merge SHA**: \`${MERGE_SHA}\`
          **Published**: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Role Binding Verification
          - 🔐 Security Approvers: ${SEC_APPROVERS}
          - 🔐 CIO Approvers: ${CIO_APPROVERS}

          ### Pre-Promotion Verification
          - Bundle Verified: ${{ needs.load-evidence.outputs.bundle_verified }}
          - Custody Verified: ${{ needs.load-evidence.outputs.custody_verified }}
          - Signatures Verified: ${{ needs.load-evidence.outputs.signatures_verified }}
          - Rekor Anchored: ${{ needs.load-evidence.outputs.rekor_anchored }}

          ### Retention
          - **Tier**: incident (7 years)
          - **Policy**: autonomy-evidence-retention.v1

          ---
          *This release was auto-published by the Break-Glass Incident Publisher (Phase 4N26)*
          "

          # Create the release
          gh release create "$RELEASE_TAG" \
            --title "Break-Glass Incident Evidence: ${MERGE_SHA:0:10}" \
            --notes "$RELEASE_NOTES" \
            --target "$MERGE_SHA"

          echo "published=true" >> $GITHUB_OUTPUT
          echo "was_noop=false" >> $GITHUB_OUTPUT

          # Upload evidence artifacts
          ASSETS_COUNT=0

          if [ -d "evidence-artifacts" ]; then
            for asset in evidence-artifacts/*; do
              if [ -f "$asset" ]; then
                gh release upload "$RELEASE_TAG" "$asset" --clobber
                ASSETS_COUNT=$((ASSETS_COUNT + 1))
              fi
            done
          fi

          echo "assets_count=$ASSETS_COUNT" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> $GITHUB_OUTPUT

          echo "✅ Published incident release with $ASSETS_COUNT assets"

      - name: Handle Noop (Release Existed)
        if: steps.idempotency.outputs.exists == 'true'
        id: noop
        run: |
          echo "published=true" >> $GITHUB_OUTPUT
          echo "was_noop=true" >> $GITHUB_OUTPUT
          echo "release_tag=${{ steps.tag.outputs.release_tag }}" >> $GITHUB_OUTPUT
          echo "release_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.release_tag }}" >> $GITHUB_OUTPUT
          echo "assets_count=0" >> $GITHUB_OUTPUT
          echo "✅ Noop: Release already exists"

      - name: Reality Check (Verify Assets Exist)
        if: steps.publish.outputs.published == 'true' || steps.noop.outputs.was_noop == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.tag.outputs.release_tag }}"

          echo "🔍 Verifying release assets..."
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'

          # Verify release is accessible
          if ! gh release view "$RELEASE_TAG" &>/dev/null; then
            echo "❌ Reality check failed: release not accessible"
            exit 1
          fi

          echo "✅ Reality check passed"

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [check-eligibility, load-evidence, publish-incident]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## 🚨 Break-Glass Incident Publisher Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ELIGIBLE="${{ needs.check-eligibility.outputs.eligible }}"
          EVIDENCE_VALID="${{ needs.load-evidence.outputs.evidence_valid }}"
          PUBLISHED="${{ needs.publish-incident.outputs.published }}"
          WAS_NOOP="${{ needs.publish-incident.outputs.was_noop }}"

          echo "### Eligibility Check" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ Break-Glass Label: ${{ needs.check-eligibility.outputs.has_break_glass_label }}" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 PR Number: ${{ needs.check-eligibility.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔑 Merge SHA: \`${{ needs.check-eligibility.outputs.merge_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Eligible: $ELIGIBLE" >> $GITHUB_STEP_SUMMARY

          if [ "$ELIGIBLE" != "true" ]; then
            echo "- ❌ Skip Reason: ${{ needs.check-eligibility.outputs.skip_reason }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$ELIGIBLE" = "true" ]; then
            echo "### Evidence Verification" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 Break-Glass OK: ${{ needs.load-evidence.outputs.break_glass_ok }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🔐 Role Binding OK: ${{ needs.load-evidence.outputs.role_binding_ok }}" >> $GITHUB_STEP_SUMMARY
            echo "- 👮 Security Approvers: ${{ needs.load-evidence.outputs.security_approvers }}" >> $GITHUB_STEP_SUMMARY
            echo "- 👔 CIO Approvers: ${{ needs.load-evidence.outputs.cio_approvers }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📦 Bundle Verified: ${{ needs.load-evidence.outputs.bundle_verified }}" >> $GITHUB_STEP_SUMMARY
            echo "- 🔗 Rekor Anchored: ${{ needs.load-evidence.outputs.rekor_anchored }}" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Evidence Valid: $EVIDENCE_VALID" >> $GITHUB_STEP_SUMMARY

            if [ "$EVIDENCE_VALID" != "true" ]; then
              echo "- ❌ Skip Reason: ${{ needs.load-evidence.outputs.skip_reason }}" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$EVIDENCE_VALID" = "true" ]; then
              echo "### Publication" >> $GITHUB_STEP_SUMMARY

              if [ "$PUBLISHED" = "true" ]; then
                if [ "$WAS_NOOP" = "true" ]; then
                  echo "- 🔁 **Noop**: Release already existed" >> $GITHUB_STEP_SUMMARY
                else
                  echo "- ✅ **Published**: New incident release created" >> $GITHUB_STEP_SUMMARY
                fi
                echo "- 🏷️ Tag: \`${{ needs.publish-incident.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
                echo "- 🔗 URL: ${{ needs.publish-incident.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
                echo "- 📦 Assets: ${{ needs.publish-incident.outputs.assets_count }}" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ⏭️ **Skipped**: Dry run or conditions not met" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Phase 4N26: Autonomy Break-Glass Incident Publisher*" >> $GITHUB_STEP_SUMMARY
