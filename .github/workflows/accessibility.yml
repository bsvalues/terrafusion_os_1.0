name: Accessibility Tests

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'src/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

jobs:
  a11y:
    name: Playwright Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers (with system deps)
        run: pnpm -C frontend exec playwright install --with-deps

      - name: Run Playwright accessibility tests
        env:
          # Ensure consistent Vite port and baseURL used by playwright.config.ts
          VITE_PORT: '5173'
        run: pnpm -C frontend run test:e2e -- tests/accessibility/a11y.spec.ts --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
