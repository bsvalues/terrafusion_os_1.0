# TerraFusion OS - Quick Validation Workflow
# Runs on every push and PR for quick feedback

name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Backend - Restore and Build
        working-directory: backend
        run: |
          dotnet restore
          dotnet build --no-restore

      - name: Frontend - Install and Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Check Docker files
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile || true
          docker run --rm -i hadolint/hadolint < Dockerfile.frontend || true

      - name: Validate docker-compose
        run: |
          docker-compose config -q

      - name: Report Status
        if: always()
        run: |
          echo "✅ Validation complete!"
          echo "Backend build: ${{ steps.backend.outcome }}"
          echo "Frontend build: ${{ steps.frontend.outcome }}"
