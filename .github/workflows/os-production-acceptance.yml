name: os-production-acceptance

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Deployed release SHA expected from /health
        required: true
        type: string
      base_url:
        description: Production public URL; defaults to production PUBLIC_URL variable
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: TerraFusion OS production acceptance
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      INPUT_BASE_URL: ${{ inputs.base_url }}
      PRODUCTION_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify acceptance harness contains production smoke scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/terraforge-production-matrix-smoke.mjs || {
            echo "Harness SHA does not contain scripts/terraforge-production-matrix-smoke.mjs"
            exit 1
          }
          test -f os-platform/core/pilot/os-production-acceptance-smoke.mjs || {
            echo "Harness SHA does not contain os-platform/core/pilot/os-production-acceptance-smoke.mjs"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve production proof inputs
        shell: bash
        run: |
          set -euo pipefail
          base_url="${INPUT_BASE_URL:-${PRODUCTION_PUBLIC_URL:-}}"
          base_url="${base_url%/}"
          trusted_url="${PRODUCTION_PUBLIC_URL:-}"
          trusted_url="${trusted_url%/}"

          if [ -z "$base_url" ]; then
            echo "Missing production base URL. Set workflow input base_url or production PUBLIC_URL variable."
            exit 1
          fi

          if [ -z "$trusted_url" ]; then
            echo "Missing production PUBLIC_URL variable; refusing to run production proof with secrets."
            exit 1
          fi

          if [[ "$base_url" != https://* ]]; then
            echo "Production base URL must use https."
            exit 1
          fi

          if [ "$base_url" != "$trusted_url" ]; then
            echo "base_url must match production PUBLIC_URL before using production secrets."
            exit 1
          fi

          if [ -z "${RELEASE_SHA:-}" ]; then
            echo "Missing required production proof input: RELEASE_SHA"
            exit 1
          fi

          {
            printf 'TF_PRODUCTION_BASE_URL=%s\n' "$base_url"
            printf 'TF_EXPECTED_RELEASE_SHA=%s\n' "$RELEASE_SHA"
          } >> "$GITHUB_ENV"

      - name: Run TerraForge production matrix smoke
        shell: bash
        env:
          TF_PROVISIONED_AUTH_EMAIL: ${{ secrets.TF_PROVISIONED_AUTH_EMAIL }}
          TF_PROVISIONED_AUTH_PASSWORD: ${{ secrets.TF_PROVISIONED_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/terraforge-production-matrix-smoke.mjs \
            --base-url "$TF_PRODUCTION_BASE_URL" \
            --expected-sha "$TF_EXPECTED_RELEASE_SHA" \
            --output "artifacts/terraforge-production-matrix/${TF_EXPECTED_RELEASE_SHA}"

      - name: Run TerraFusion OS production acceptance smoke
        shell: bash
        env:
          TF_PROVISIONED_AUTH_EMAIL: ${{ secrets.TF_PROVISIONED_AUTH_EMAIL }}
          TF_PROVISIONED_AUTH_PASSWORD: ${{ secrets.TF_PROVISIONED_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          node os-platform/core/pilot/os-production-acceptance-smoke.mjs \
            --base-url "$TF_PRODUCTION_BASE_URL" \
            --expected-sha "$TF_EXPECTED_RELEASE_SHA" \
            --output "artifacts/os-production-acceptance/${TF_EXPECTED_RELEASE_SHA}"

      - name: Upload TerraFusion OS production acceptance proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: os-production-acceptance-${{ inputs.release_sha }}
          path: |
            artifacts/terraforge-production-matrix/${{ inputs.release_sha }}/
            artifacts/os-production-acceptance/${{ inputs.release_sha }}/
          if-no-files-found: error
