name: c-county-rows-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  county-rows:
    name: Production county rows read-only probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Observe exact live county rows without writes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/production}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          backend="$(docker ps --format '{{.Names}}' | grep -E 'terrafusion-production.*backend|production.*backend' | head -n1 || true)"
          test -n "$backend"
          test -f "$APP_ROOT/app.env"
          DATA_SOURCE="$(python3 - "$APP_ROOT/app.env" <<'PY'
          import pathlib, sys
          for line in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if not line.startswith('ConnectionStrings__DefaultConnection='):
                  continue
              raw = line.split('=', 1)[1].strip()
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'"', "'"}:
                  raw = raw[1:-1]
              for part in [p.strip() for p in raw.split(';') if p.strip()]:
                  if '=' in part and part.split('=',1)[0].strip().lower().replace(' ','') == 'datasource':
                      print(part.split('=',1)[1].strip())
                      raise SystemExit(0)
          raise SystemExit('DATA_SOURCE_NOT_FOUND')
          PY
          )"
          MOUNTS_JSON="$(docker inspect "$backend" --format '{{json .Mounts}}')"
          HOST_DB="$(DATA_SOURCE="$DATA_SOURCE" MOUNTS_JSON="$MOUNTS_JSON" APP_ROOT="$APP_ROOT" python3 - <<'PY'
          import json, os, pathlib
          source=os.environ['DATA_SOURCE']; mounts=json.loads(os.environ['MOUNTS_JSON'])
          cp=pathlib.PurePosixPath(source) if source.startswith('/') else pathlib.PurePosixPath('/app')/source
          best=None
          for m in mounts:
              dest=pathlib.PurePosixPath(m.get('Destination') or '/')
              try: rel=cp.relative_to(dest)
              except ValueError: continue
              score=len(dest.parts)
              if best is None or score>best[0]: best=(score,pathlib.Path(m['Source'])/pathlib.Path(str(rel)))
          print(best[1] if best else pathlib.Path(os.environ['APP_ROOT'])/str(cp).removeprefix('/app/'))
          PY
          )"
          test -f "$HOST_DB"
          python3 - "$HOST_DB" <<'PY'
          import sqlite3, sys, urllib.parse
          uri='file:'+urllib.parse.quote(sys.argv[1],safe='/')+'?mode=ro'
          con=sqlite3.connect(uri,uri=True,timeout=10)
          con.execute('PRAGMA query_only=ON')
          assert con.execute('PRAGMA query_only').fetchone()[0] == 1
          rows=con.execute('SELECT Id, Name, FipsCode FROM Counties ORDER BY Name').fetchall()
          print('COUNTY_ROWS='+str(len(rows)))
          for _id,name,fips in rows:
              print(f'{name}|{fips or ""}')
          con.close()
          PY
          REMOTE
