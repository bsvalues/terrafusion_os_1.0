name: c-lineage-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  lineage:
    name: Production lineage read-only schema probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "MISSING_${required}"
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          if ! grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts 2>/dev/null; then
            echo "DEPLOY_HOST_KEY_UNAVAILABLE"
            exit 1
          fi
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Observe production Sync lineage schema through read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/production}"

          DB_JSON="$(ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          command -v python3 >/dev/null || { echo "REMOTE_PYTHON3_REQUIRED" >&2; exit 21; }
          test -f "$APP_ROOT/app.env" || { echo "APP_ENV_NOT_FOUND" >&2; exit 22; }
          python3 - "$APP_ROOT/app.env" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.parse

          path = pathlib.Path(sys.argv[1])
          raw = None
          for line in path.read_text(encoding='utf-8').splitlines():
              if line.startswith('ConnectionStrings__DefaultConnection='):
                  raw = line.split('=', 1)[1].strip()
          if raw is None:
              raise SystemExit('DEFAULT_CONNECTION_NOT_FOUND')
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'\"', "'"}:
              raw = raw[1:-1]

          def normalize(key):
              return ''.join(ch for ch in key.lower() if ch.isalnum())

          values = {}
          if raw.lower().startswith(('postgres://', 'postgresql://')):
              parsed = urllib.parse.urlparse(raw)
              values = {
                  'host': parsed.hostname,
                  'port': parsed.port or 5432,
                  'database': parsed.path.lstrip('/'),
                  'username': urllib.parse.unquote(parsed.username or ''),
                  'password': urllib.parse.unquote(parsed.password or ''),
                  'sslmode': urllib.parse.parse_qs(parsed.query).get('sslmode', [''])[0],
              }
          else:
              parts = []
              buf = []
              quote = None
              i = 0
              while i < len(raw):
                  ch = raw[i]
                  if quote is not None:
                      if ch == quote:
                          if i + 1 < len(raw) and raw[i + 1] == quote:
                              buf.append(ch)
                              i += 2
                              continue
                          quote = None
                      else:
                          buf.append(ch)
                  else:
                      if ch in {'\"', "'"}:
                          quote = ch
                      elif ch == ';':
                          parts.append(''.join(buf))
                          buf = []
                      else:
                          buf.append(ch)
                  i += 1
              parts.append(''.join(buf))
              pairs = {}
              for part in parts:
                  if not part.strip() or '=' not in part:
                      continue
                  key, value = part.split('=', 1)
                  pairs[normalize(key)] = value.strip()
              def first(*keys, default=''):
                  for key in keys:
                      value = pairs.get(normalize(key))
                      if value not in (None, ''):
                          return value
                  return default
              values = {
                  'host': first('Host', 'Server', 'Data Source'),
                  'port': int(first('Port', default='5432')),
                  'database': first('Database', 'Initial Catalog'),
                  'username': first('Username', 'User ID', 'User'),
                  'password': first('Password', 'Pwd'),
                  'sslmode': first('SSL Mode', 'SslMode'),
              }

          missing = [k for k in ('host', 'database', 'username') if not values.get(k)]
          if missing:
              raise SystemExit('CONNECTION_FIELDS_MISSING:' + ','.join(missing))
          print(json.dumps(values, separators=(',', ':')))
          PY
          REMOTE
          )"

          DB_HOST="$(jq -er '.host' <<<"$DB_JSON")"
          DB_PORT="$(jq -er '.port' <<<"$DB_JSON")"
          DB_NAME="$(jq -er '.database' <<<"$DB_JSON")"
          DB_USER="$(jq -er '.username' <<<"$DB_JSON")"
          DB_PASSWORD="$(jq -r '.password // ""' <<<"$DB_JSON")"
          DB_SSLMODE="$(jq -r '.sslmode // ""' <<<"$DB_JSON" | tr '[:upper:]' '[:lower:]' | tr -d ' ')"
          echo "::add-mask::$DB_PASSWORD"

          case "$DB_SSLMODE" in
            '') PGSSLMODE=prefer ;;
            require|prefer|allow|disable|verify-ca|verify-full) PGSSLMODE="$DB_SSLMODE" ;;
            verifyca) PGSSLMODE=verify-ca ;;
            verifyfull) PGSSLMODE=verify-full ;;
            *)
              echo "UNSUPPORTED_SSL_MODE_FOR_READONLY_PROBE:$DB_SSLMODE"
              exit 23
              ;;
          esac

          TUNNEL_TARGET="$DB_HOST"
          case "${DB_HOST,,}" in
            localhost|127.0.0.1|::1|host.docker.internal) TUNNEL_TARGET=127.0.0.1 ;;
          esac

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

          LOCAL_PORT=65432
          ssh -fNT -o ExitOnForwardFailure=yes \
            -L "${LOCAL_PORT}:${TUNNEL_TARGET}:${DB_PORT}" \
            -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
          trap 'pkill -f "ssh.*${LOCAL_PORT}:" 2>/dev/null || true' EXIT

          export PGHOST="$DB_HOST"
          export PGHOSTADDR=127.0.0.1
          export PGPORT="$LOCAL_PORT"
          export PGDATABASE="$DB_NAME"
          export PGUSER="$DB_USER"
          export PGPASSWORD="$DB_PASSWORD"
          export PGSSLMODE
          export PGCONNECT_TIMEOUT=10
          export PGAPPNAME=terrafusion-c-lineage-readonly

          psql -X -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          BEGIN TRANSACTION READ ONLY;

          \echo '=== CONNECTION / READ-ONLY PROOF ==='
          SELECT
            current_database() AS database,
            current_user AS db_user,
            current_setting('transaction_read_only') AS transaction_read_only,
            current_setting('server_version') AS server_version;

          \echo '=== RELEVANT TABLE INVENTORY ==='
          SELECT
            n.nspname AS table_schema,
            c.relname AS table_name,
            c.reltuples::bigint AS estimated_rows
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relkind IN ('r','p')
            AND (
              n.nspname = 'sync_bridge'
              OR (n.nspname = 'canonical_tf' AND c.relname IN ('tf_parcel','tf_owner','tf_sale'))
            )
          ORDER BY n.nspname, c.relname;

          \echo '=== LIVE COLUMN VOCABULARY ==='
          SELECT
            table_schema,
            table_name,
            ordinal_position,
            column_name,
            data_type,
            is_nullable
          FROM information_schema.columns
          WHERE
            table_schema = 'sync_bridge'
            OR (table_schema = 'canonical_tf' AND table_name IN ('tf_parcel','tf_owner','tf_sale'))
          ORDER BY table_schema, table_name, ordinal_position;

          ROLLBACK;
          SQL
