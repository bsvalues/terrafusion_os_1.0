name: c-lineage-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  lineage:
    name: Alternate production DB connection shape probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Observe connection-string shapes without values
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/production}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          python3 - "$APP_ROOT/app.env" <<'PY'
          import pathlib, sys, urllib.parse
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          values = {}
          for line in lines:
              if not line or line.lstrip().startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              if key in {'ConnectionStrings__DefaultConnection','ConnectionStrings__TerraFusionDatabase','DatabaseProvider'}:
                  values[key] = value.strip()

          print('DatabaseProvider=' + values.get('DatabaseProvider','<unset>'))
          for key in ('ConnectionStrings__DefaultConnection','ConnectionStrings__TerraFusionDatabase'):
              raw = values.get(key)
              print(f'=== {key} ===')
              if raw is None:
                  print('PRESENT=false')
                  continue
              print('PRESENT=true')
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'\"', "'"}:
                  raw = raw[1:-1]
              print(f'LENGTH={len(raw)}')
              if raw.lower().startswith(('postgres://','postgresql://')):
                  p = urllib.parse.urlparse(raw)
                  print('FORMAT=url')
                  fields = []
                  for name, present in [('hostname',p.hostname),('port',p.port),('database',p.path and p.path != '/'),('username',p.username),('password',p.password),('query',p.query)]:
                      if present:
                          fields.append(name)
                  print('FIELDS=' + ','.join(fields))
              else:
                  print('FORMAT=key-value')
                  fields = []
                  for part in raw.split(';'):
                      if '=' in part:
                          fields.append(part.split('=',1)[0].strip())
                  print('FIELDS=' + ','.join(fields))
          PY
          REMOTE
