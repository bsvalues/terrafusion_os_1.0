name: c-lineage-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  lineage:
    name: Live SQLite runtime characterization read-only probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Characterize exact mounted SQLite database without writes
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/production}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          command -v python3 >/dev/null
          backend="$(docker ps --format '{{.Names}}' | grep -E 'terrafusion-production.*backend|production.*backend' | head -n1 || true)"
          test -n "$backend"
          test -f "$APP_ROOT/app.env"

          DATA_SOURCE="$(python3 - "$APP_ROOT/app.env" <<'PY'
          import pathlib, sys
          for line in pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              if not line.startswith('ConnectionStrings__DefaultConnection='):
                  continue
              raw = line.split('=', 1)[1].strip()
              if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'\"', "'"}:
                  raw = raw[1:-1]
              for part in [p.strip() for p in raw.split(';') if p.strip()]:
                  if '=' not in part:
                      continue
                  key, value = part.split('=', 1)
                  if key.strip().lower().replace(' ', '') == 'datasource':
                      print(value.strip())
                      raise SystemExit(0)
          raise SystemExit('DATA_SOURCE_NOT_FOUND')
          PY
          )"

          MOUNTS_JSON="$(docker inspect "$backend" --format '{{json .Mounts}}')"
          HOST_DB="$(DATA_SOURCE="$DATA_SOURCE" MOUNTS_JSON="$MOUNTS_JSON" APP_ROOT="$APP_ROOT" python3 - <<'PY'
          import json, os, pathlib
          source = os.environ['DATA_SOURCE']
          mounts = json.loads(os.environ['MOUNTS_JSON'])
          container_path = pathlib.PurePosixPath(source) if source.startswith('/') else pathlib.PurePosixPath('/app') / source
          best = None
          for mount in mounts:
              dest = pathlib.PurePosixPath(mount.get('Destination') or '/')
              try:
                  rel = container_path.relative_to(dest)
              except ValueError:
                  continue
              score = len(dest.parts)
              if best is None or score > best[0]:
                  best = (score, pathlib.Path(mount['Source']) / pathlib.Path(str(rel)))
          candidate = best[1] if best else pathlib.Path(os.environ['APP_ROOT']) / str(container_path).removeprefix('/app/')
          print(candidate)
          PY
          )"
          test -f "$HOST_DB"

          python3 - "$HOST_DB" <<'PY'
          import sqlite3, sys, urllib.parse
          db = sys.argv[1]
          uri = 'file:' + urllib.parse.quote(db, safe='/') + '?mode=ro'
          con = sqlite3.connect(uri, uri=True, timeout=10)
          con.execute('PRAGMA query_only=ON')
          assert con.execute('PRAGMA query_only').fetchone()[0] == 1

          tables = [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
          print('=== ALL LIVE TABLE NAMES ===')
          for name in tables:
              print(name)

          print('=== SELECTED LIVE ROW COUNTS ===')
          for name in ('Counties','Properties','ComparableSales','EtlSyncJobs','PacsProperties','PacsOwners','PacsAssessments','PacsSales','TfParcels','TfOwners','TfSales','ProductLoadReceipts'):
              if name not in tables:
                  print(f'{name}=ABSENT')
                  continue
              safe = name.replace('"','""')
              count = con.execute(f'SELECT COUNT(*) FROM "{safe}"').fetchone()[0]
              print(f'{name}={count}')

          print('=== ETL SYNC JOB SUMMARY ===')
          if 'EtlSyncJobs' in tables:
              rows = con.execute('''
                  SELECT SourceSystem, EntityType, Direction, Status,
                         COUNT(*) AS jobs,
                         COALESCE(SUM(TotalRecords),0) AS total_records,
                         COALESCE(SUM(ProcessedRecords),0) AS processed_records,
                         COALESCE(SUM(FailedRecords),0) AS failed_records,
                         COALESCE(SUM(SkippedRecords),0) AS skipped_records
                  FROM EtlSyncJobs
                  GROUP BY SourceSystem, EntityType, Direction, Status
                  ORDER BY SourceSystem, EntityType, Direction, Status
              ''').fetchall()
              if not rows:
                  print('EMPTY')
              for row in rows:
                  print('|'.join(str(x) for x in row))

          print('=== EF MIGRATION HISTORY ===')
          if '__EFMigrationsHistory' not in tables:
              print('ABSENT')
          else:
              history = con.execute('SELECT MigrationId, ProductVersion FROM __EFMigrationsHistory ORDER BY MigrationId').fetchall()
              print(f'COUNT={len(history)}')
              if history:
                  print(f'EARLIEST={history[0][0]}|{history[0][1]}')
                  print(f'LATEST={history[-1][0]}|{history[-1][1]}')

          con.close()
          PY
          REMOTE
