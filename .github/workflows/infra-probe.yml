name: c-lineage-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  lineage:
    name: Running production DB identity probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Observe running backend provider and DB truth
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          backend="$(docker ps --format '{{.Names}}' | grep -E 'terrafusion-production.*backend|production.*backend' | head -n1 || true)"
          if [ -z "$backend" ]; then
            echo 'BACKEND_CONTAINER_NOT_FOUND'
            exit 31
          fi

          echo '=== RUNNING CONFIGURATION CLAIM ==='
          provider="$(docker inspect "$backend" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | awk -F= '$1=="DatabaseProvider" {sub(/^[^=]*=/, ""); print; exit}')"
          printf 'DatabaseProvider=%s\n' "${provider:-<unset>}"

          echo '=== OBSERVED RUNTIME DB IDENTITY ==='
          docker exec "$backend" wget -qO- --timeout=15 \
            http://127.0.0.1:5000/api/runtime/truth/db-identity
          echo

          echo '=== OBSERVED RUNTIME DB CONTENT ==='
          docker exec "$backend" wget -qO- --timeout=15 \
            http://127.0.0.1:5000/api/runtime/truth/db-content
          echo
          REMOTE
