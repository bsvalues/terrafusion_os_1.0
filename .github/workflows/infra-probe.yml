name: c-lineage-readonly-probe

on:
  push:
    branches:
      - diag/c-lineage-readonly-20260825

permissions:
  contents: read

jobs:
  lineage:
    name: Production DB configuration vocabulary probe
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      APP_ROOT: ${{ vars.APP_ROOT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Configure bounded SSH access
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519,rsa -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done
          grep -q "$DEPLOY_HOST" ~/.ssh/known_hosts
          cat > ~/.ssh/config <<SSHCFG
          Host $DEPLOY_HOST
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          SSHCFG
          chmod 600 ~/.ssh/config

      - name: Observe key names only
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          APP_ROOT="${APP_ROOT:-/opt/terrafusion/production}"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "APP_ROOT='$APP_ROOT' bash -s" <<'REMOTE'
          set -euo pipefail
          test -f "$APP_ROOT/app.env"
          command -v python3 >/dev/null
          python3 - "$APP_ROOT/app.env" <<'PY'
          import pathlib
          import sys
          import urllib.parse

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(encoding='utf-8').splitlines()
          interesting = []
          raw = None
          for line in lines:
              if not line or line.lstrip().startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              key = key.strip()
              upper = key.upper()
              if key == 'ConnectionStrings__DefaultConnection':
                  raw = value.strip()
              if (
                  key == 'ConnectionStrings__DefaultConnection'
                  or key == 'DatabaseProvider'
                  or 'POSTGRES' in upper
                  or upper.startswith('PG')
                  or upper.startswith('DB_')
                  or upper.endswith('_DB')
                  or 'DATABASE' in upper
              ):
                  interesting.append(key)

          print('=== APP.ENV RELEVANT VARIABLE NAMES (VALUES REDACTED) ===')
          for key in sorted(set(interesting)):
              print(key)

          if raw is None:
              print('DEFAULT_CONNECTION_FORMAT=missing')
              raise SystemExit(0)
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in {'\"', "'"}:
              raw = raw[1:-1]
          print(f'DEFAULT_CONNECTION_LENGTH={len(raw)}')
          if raw.lower().startswith(('postgres://', 'postgresql://')):
              parsed = urllib.parse.urlparse(raw)
              print('DEFAULT_CONNECTION_FORMAT=url')
              print('DEFAULT_CONNECTION_URL_FIELDS=' + ','.join(
                  name for name, present in [
                      ('hostname', bool(parsed.hostname)),
                      ('port', bool(parsed.port)),
                      ('path', bool(parsed.path and parsed.path != '/')),
                      ('username', bool(parsed.username)),
                      ('password', bool(parsed.password)),
                      ('query', bool(parsed.query)),
                  ] if present
              ))
          else:
              print('DEFAULT_CONNECTION_FORMAT=key-value')
              parts = []
              buf = []
              quote = None
              i = 0
              while i < len(raw):
                  ch = raw[i]
                  if quote is not None:
                      if ch == quote:
                          if i + 1 < len(raw) and raw[i + 1] == quote:
                              buf.append(ch)
                              i += 2
                              continue
                          quote = None
                      else:
                          buf.append(ch)
                  else:
                      if ch in {'\"', "'"}:
                          quote = ch
                      elif ch == ';':
                          parts.append(''.join(buf))
                          buf = []
                      else:
                          buf.append(ch)
                  i += 1
              parts.append(''.join(buf))
              keys = []
              for part in parts:
                  if '=' in part:
                      keys.append(part.split('=', 1)[0].strip())
              print('DEFAULT_CONNECTION_FIELD_NAMES=' + ','.join(keys))
          PY

          echo '=== RUNNING BACKEND ENV VARIABLE NAMES (VALUES REDACTED) ==='
          backend="$(docker ps --format '{{.Names}}' | grep -E 'terrafusion-production.*backend|production.*backend' | head -n1 || true)"
          if [ -n "$backend" ]; then
            docker inspect "$backend" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | cut -d= -f1 \
              | grep -E '^(ConnectionStrings__|DatabaseProvider|PG|POSTGRES|DB_|.*DATABASE)' \
              | sort -u || true
          else
            echo 'BACKEND_CONTAINER_NOT_FOUND'
          fi
          REMOTE
