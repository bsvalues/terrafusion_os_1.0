name: TerraFusion Gatekeeper
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: gatekeeper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

env:
  TF_ENV: ${{ github.event_name == 'pull_request' && 'dev' || 'stage' }}
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:5046' }}
  LOAD_TEST_URL: ${{ vars.LOAD_TEST_URL || vars.BASE_URL || 'http://localhost:5046' }}
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER || 'none' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip python3
      - name: Gate A — Preflight
        run: |
          make preflight
      - name: Upload Preflight
        uses: actions/upload-artifact@v4
        with: { name: preflight, path: artifacts }

  security:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          sudo apt-get update && sudo apt-get install -y jq
      - name: Gate B — Security Baseline & Secret Hygiene
        run: |
          make security
      - name: Upload Security
        uses: actions/upload-artifact@v4
        with: { name: security, path: artifacts }

  core:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains
        run: |
          sudo apt-get update && sudo apt-get install -y jq zip pkg-config libssl-dev
          sudo snap install helm --classic || true
          sudo snap install dotnet-sdk --classic --channel=8.0 || true
          dotnet --info || true
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Gate C — Core Bring‑Up (Helm + dependencies)
        run: |
          if [[ -d "iac/helm/terrafusion" ]]; then
            helm dependency update iac/helm/terrafusion
          fi
          make core
      - name: Upload Core
        uses: actions/upload-artifact@v4
        with: { name: core, path: artifacts }

  api:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - name: Gate E — API Surface
        run: |
          make api
      - name: Upload API
        uses: actions/upload-artifact@v4
        with: { name: api, path: artifacts }

  swarm:
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - name: Gate D — Swarm Online
        run: |
          make swarm
      - name: Upload Swarm
        uses: actions/upload-artifact@v4
        with: { name: swarm, path: artifacts }

  validate:
    runs-on: ubuntu-latest
    needs: swarm
    steps:
      - uses: actions/checkout@v4
      - name: Install test & policy deps (Playwright, k6, kubeconform, conftest)
        run: |
          sudo apt-get update && sudo apt-get install -y jq zip gpg curl
          # k6
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
          # Playwright
          npm i -g npm@latest || true
          npx --yes playwright install --with-deps
          # kubeconform
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          # conftest (OPA)
          curl -L https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
      - name: Apply CRDs (lint only; dry-run)
        run: |
          if [[ -d "iac/crds" ]]; then
            kubeconform -strict -summary iac/crds/*.yaml
          fi
      - name: Policy check (OPA/Rego via conftest)
        run: |
          if [[ -d "policies" ]]; then
            conftest test policies --all-namespaces
          fi
      - name: Gate F — Validation Matrix (env-aware)
        env:
          TF_ENV: ${{ env.TF_ENV }}
          BASE_URL: ${{ env.BASE_URL }}
          LOAD_TEST_URL: ${{ env.LOAD_TEST_URL }}
        run: |
          make validate
      - name: Gate F+ — 12‑Power Index
        run: |
          if [[ -f "ops/scripts/power-index.py" ]]; then
            python3 ops/scripts/power-index.py
          fi
      - name: Harmonic integration check
        run: |
          if [[ -f "ops/scripts/harmonic-check.sh" ]]; then
            bash ops/scripts/harmonic-check.sh
          fi
      - name: AI-Swarm readiness
        run: |
          if [[ -f "ops/scripts/ai-swarm-readiness.sh" ]]; then
            bash ops/scripts/ai-swarm-readiness.sh
          fi
      - name: Deploy team packages (non-prod)
        if: ${{ env.TF_ENV != 'prod' }}
        run: |
          if [[ -f "ops/scripts/deploy-team-packages.sh" ]]; then
            bash ops/scripts/deploy-team-packages.sh
          fi
      - name: Perfect-Power soak guard
        if: ${{ env.TF_ENV == 'stage' || github.ref == 'refs/heads/main' }}
        run: |
          if [[ -f "ops/scripts/soak-guard.sh" ]]; then
            bash ops/scripts/soak-guard.sh
          fi
      - name: Build Edge Bundle
        run: |
          make bundle || true
      - name: Upload Validation
        uses: actions/upload-artifact@v4
        with: { name: validation, path: artifacts }

  package:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4
      - name: Package Artifacts
        run: |
          make package
      - name: Upload Final Bundle
        uses: actions/upload-artifact@v4
        with: { name: artifacts-bundle, path: artifacts }

  promote:
    runs-on: ubuntu-latest
    needs: package
    if: ${{ success() }}
    environment:
      name: production
      url: https://terrafusion.example.gov
    steps:
      - uses: actions/checkout@v4
      # OIDC examples (choose provider via repo vars/secrets)
      - name: Configure cloud OIDC (AWS)
        if: ${{ vars.CLOUD_PROVIDER == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: tf-oidc-${{ github.run_id }}
      - name: Configure cloud OIDC (Azure)
        if: ${{ vars.CLOUD_PROVIDER == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure cloud OIDC (GCP)
        if: ${{ vars.CLOUD_PROVIDER == 'gcp' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Release — all gates green
        run: |
          echo "All gates green. Releasing per environment rules."
