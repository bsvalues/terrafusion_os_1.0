name: CI • Rust Verify

on:
  workflow_dispatch: {}

  push:
    branches: [main]
permissions:
  contents: read

jobs:
  rust-verify:
    name: Rust verify (per-crate metadata + build)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [stable, nightly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'false'

      - name: Detect Rust workspace
        id: rust
        shell: bash
        run: |
          if [ -f "monorepo-scaffolding/Cargo.toml" ]; then
            echo "dir=monorepo-scaffolding" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Rust
        if: steps.rust.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Ensure cargo is available
        if: steps.rust.outputs.found == 'true'
        run: cargo --version

      - name: Cache cargo registry + target
        if: steps.rust.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Primary key uses nearest Cargo.lock; restore keys widen the scope to increase hit rate
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
            ${{ runner.os }}-cargo-${{ matrix.toolchain }}-
            ${{ runner.os }}-cargo-

      - name: Rust verify (workspace)
        if: steps.rust.outputs.found == 'true'
        working-directory: ${{ steps.rust.outputs.dir }}
        shell: bash
        run: |
          cargo build --workspace --locked --verbose
          cargo test  --workspace --locked --verbose

      - name: Rust verify (no workspace)
        if: steps.rust.outputs.found != 'true'
        run: echo "No Rust workspace found; skipping rust verify."

      - name: Collect built binaries
        if: always()
        run: |
          set -euo pipefail || true
          mkdir -p .ci_artifacts_local/binaries || true
          # Collect release binaries from target/*/release
          find . -type f -path "*/target/*/release/*" -perm -111 -maxdepth 6 -print -exec cp --parents {} .ci_artifacts_local/binaries/ \; || true

      - name: Collect per-crate logs
        if: always()
        run: |
          mkdir -p .ci_artifacts_local/logs || true
          # Copy any logs generated by ops/rust/verify.sh or other steps
          cp -r .ci_artifacts_local/* .ci_artifacts_local/logs/ 2>/dev/null || true

      - name: Lightweight smoke test (Docker Compose)
        if: always()
        env:
          COMPOSE_FILE: docker-compose.dev.yml
        run: |
          set -euo pipefail || true
          echo "Attempting lightweight smoke test using docker compose (backend service)..."
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose -f ${COMPOSE_FILE} up -d backend || true
            sleep 6
            # Try health endpoint (adjust path if your backend differs)
            if curl -fsS --max-time 5 http://localhost:${TF_API_PORT:-5046}/healthz > .ci_artifacts_local/smoke-curl.out 2>&1; then
              echo "smoke: OK" > .ci_artifacts_local/smoke-status.txt
            else
              echo "smoke: FAIL" > .ci_artifacts_local/smoke-status.txt
            fi
            docker compose -f ${COMPOSE_FILE} down || true
          else
            echo "docker compose not available; skipping smoke test" > .ci_artifacts_local/smoke-status.txt
          fi

      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-verify-artifacts
          path: |
            .ci_artifacts_local/**
            .ci_artifacts_local/binaries/**
            .ci_artifacts_local/logs/**

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-verify-logs
          path: |
            .ci_artifacts_local/**
