name: Tag Lint
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/tag-lint.yml'
jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint Tags
        run: python scripts/tag_lint.py
