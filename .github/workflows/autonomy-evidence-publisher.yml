# Autonomy Evidence Publisher (Phase 4N8)
#
# Publishes evidence bundles to GitHub Releases for 1-year retention tier.
# This workflow runs ONLY on merged PRs to main, ensuring the evidence
# channel remains a clean "record of truth" for audits.
#
# SECURITY POSTURE (Non-negotiable):
# - Only runs when PR merged to main
# - Verifies bundle BEFORE publishing (strict mode)
# - Uses minimal permissions (contents: write for releases)
# - Never downloads from untrusted sources
# - All artifacts created in-job or from verified CI artifacts
#
# RETENTION TIERS:
# - CI artifacts: 90 days (GitHub Actions default)
# - Merged PR → Release: 1 year minimum
# - Incident: 7 years (manual escalation)

name: Autonomy Evidence Publisher

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: tools/registry/perf-skill-audit/out
  VIEWER_DIR: tools/registry/autonomy-viewer/dist

jobs:
  # ==========================================================================
  # Gate: Only proceed if PR was merged (not just closed)
  # ==========================================================================
  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      run_id: ${{ steps.check.outputs.run_id }}
    steps:
      - name: Check merge conditions
        id: check
        run: |
          echo "🔒 Phase 4N8: Evidence Publisher Gate Check"
          echo ""

          # Verify this is a merged PR to main
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "::notice::PR was closed but not merged - skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ github.base_ref }}" != "main" ]]; then
            echo "::notice::PR was not merged to main - skipping"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for autonomy label (optional gate)
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          echo "PR Labels: $LABELS"

          # Generate release tag (slash-free monthly rollup format)
          YEAR_MONTH=$(date +%Y-%m)
          RELEASE_TAG="autonomy-evidence-${YEAR_MONTH}"
          RUN_ID="${{ github.run_id }}"

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "should_publish=true" >> $GITHUB_OUTPUT

          echo "✅ Merge gate passed"
          echo "   Release Tag: $RELEASE_TAG"
          echo "   Run ID: $RUN_ID"

  # ==========================================================================
  # Publish: Generate/verify evidence and publish to Release
  # ==========================================================================
  publish:
    name: Publish Evidence to Release
    needs: gate
    if: needs.gate.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write # Phase 4N16: Required for keyless OIDC signing

    # Phase 4N20: Signature identity pins (deterministic)
    env:
      TF_SIG_ISSUER: https://token.actions.githubusercontent.com
      TF_SIG_REPO: ${{ github.repository }}
      TF_SIG_REF: refs/heads/main
      TF_SIG_WORKFLOW: .github/workflows/autonomy-evidence-publisher.yml
      TF_SIG_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/autonomy-evidence-publisher.yml@refs/heads/main
      TF_SIG_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm -C tools/registry/perf-skill-audit install

      # Phase 4N16: Install cosign for keyless signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: 'v2.4.1'

      # ========================================================================
      # Step 1: Generate fresh evidence artifacts (deterministic)
      # ========================================================================
      - name: Generate performance plan
        run: |
          echo "📊 Generating performance plan..."
          npx tsx tools/registry/perf-skill-audit/src/index.ts || true

          if [ -f "${{ env.OUT_DIR }}/perf.plan.json" ]; then
            echo "✅ Performance plan generated"
          else
            echo "⚠️ No performance plan (may be empty run)"
          fi

      - name: Ensure apply proofs artifact exists
        run: |
          mkdir -p "${{ env.OUT_DIR }}"
          if [ ! -f "${{ env.OUT_DIR }}/apply-proofs.json" ]; then
            echo "[]" > "${{ env.OUT_DIR }}/apply-proofs.json"
            echo "ℹ️ Created fallback apply-proofs.json for deterministic bundling"
          fi

      - name: Ensure governance contract file exists
        run: |
          if [ ! -f "AUTONOMY_V1_GOVERNANCE_CONTRACT.md" ] && [ -f "QUARANTINE/root-md/AUTONOMY_V1_GOVERNANCE_CONTRACT.md" ]; then
            cp "QUARANTINE/root-md/AUTONOMY_V1_GOVERNANCE_CONTRACT.md" "AUTONOMY_V1_GOVERNANCE_CONTRACT.md"
            echo "ℹ️ Restored AUTONOMY_V1_GOVERNANCE_CONTRACT.md from QUARANTINE/root-md"
          fi

      - name: Generate CIO Dashboard
        run: |
          echo "📊 Generating County CIO Dashboard..."
          mkdir -p ${{ env.VIEWER_DIR }}

          npx tsx tools/registry/autonomy-viewer/src/generate.ts \
            --artifacts=${{ env.OUT_DIR }} \
            --output=${{ env.VIEWER_DIR }} \
            --emit-json \
            --verbose || echo "::warning::Dashboard generation failed (non-fatal)"

      - name: Generate Evidence Bundle
        id: bundle
        run: |
          echo "📦 Generating Evidence Bundle..."
          BUNDLE_NAME="autonomy-evidence-${{ needs.gate.outputs.run_id }}.zip"

          npx tsx tools/registry/autonomy-viewer/src/bundle.ts \
            --in ${{ github.workspace }} \
            --out ${{ env.VIEWER_DIR }} \
            --name "$BUNDLE_NAME" \
            --run-id "${{ needs.gate.outputs.run_id }}" \
            --emit-manifest \
            --verbose

          MANIFEST_PATH="${{ env.VIEWER_DIR }}/${BUNDLE_NAME}.manifest.json"

          # Capture manifest SHA256
          if [ -f "$MANIFEST_PATH" ]; then
            MANIFEST_SHA=$(sha256sum "$MANIFEST_PATH" | cut -d' ' -f1)
            echo "manifest_sha=$MANIFEST_SHA" >> $GITHUB_OUTPUT
            echo "bundle_name=${BUNDLE_NAME}" >> $GITHUB_OUTPUT
            echo "bundle_path=${{ env.VIEWER_DIR }}/${BUNDLE_NAME}" >> $GITHUB_OUTPUT
            echo "✅ Bundle generated: ${BUNDLE_NAME}"
          else
            echo "::error::Bundle manifest not found at $MANIFEST_PATH"
            exit 1
          fi

      # ========================================================================
      # Step 2: Verify bundle (STRICT - non-negotiable before publish)
      # ========================================================================
      - name: Verify Evidence Bundle (strict)
        id: verify
        run: |
          echo "🔐 Verifying Evidence Bundle (strict mode)..."
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-bundle.ts \
            --zip "$BUNDLE_PATH" \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "verify_ok=true" >> $GITHUB_OUTPUT
            echo "✅ Bundle verification PASSED (strict)"
          else
            echo "verify_ok=false" >> $GITHUB_OUTPUT
            echo "::error::Bundle verification FAILED - cannot publish"
            exit 1
          fi

      # ========================================================================
      # Step 2a: Phase 4N16 - Keyless Signatures for Evidence Artifacts
      # ========================================================================
      - name: Sign Evidence Artifacts (Keyless)
        id: sign
        run: |
          echo "🔏 Phase 4N16: Signing evidence artifacts (keyless OIDC)..."
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"
          SIGN_DIR="${{ env.VIEWER_DIR }}/signatures"
          mkdir -p "$SIGN_DIR"

          # List of primary artifacts to sign
          ARTIFACTS_TO_SIGN=(
            "$BUNDLE_PATH"
            "${{ env.VIEWER_DIR }}/MANIFEST.json"
          )

          SIGNED_COUNT=0
          for ARTIFACT in "${ARTIFACTS_TO_SIGN[@]}"; do
            if [ -f "$ARTIFACT" ]; then
              BASENAME=$(basename "$ARTIFACT")
              echo "  Signing: $BASENAME"

              # Keyless signing with Sigstore/Fulcio
              # --yes skips confirmation prompts
              # --bundle creates the combined signature bundle for offline verification
              cosign sign-blob "$ARTIFACT" \
                --yes \
                --bundle "${ARTIFACT}.bundle" \
                --output-signature "${ARTIFACT}.sig" \
                --output-certificate "${ARTIFACT}.crt"

              # Copy signature files to sign dir for later
              cp "${ARTIFACT}.bundle" "$SIGN_DIR/"
              cp "${ARTIFACT}.sig" "$SIGN_DIR/"
              cp "${ARTIFACT}.crt" "$SIGN_DIR/"

              SIGNED_COUNT=$((SIGNED_COUNT + 1))
              echo "  ✅ Signed: $BASENAME"
            else
              echo "  ⚠️ Skipping (not found): $ARTIFACT"
            fi
          done

          echo "signed_count=$SIGNED_COUNT" >> $GITHUB_OUTPUT
          echo "sign_dir=$SIGN_DIR" >> $GITHUB_OUTPUT
          echo "✅ Signed $SIGNED_COUNT artifacts with keyless OIDC"

      - name: Generate Evidence Index
        run: |
          echo "📋 Generating Evidence Index..."

          # Phase 4N20: Include SHA for identity pinning
          npx tsx tools/registry/autonomy-viewer/src/evidence-index.ts \
            --out ${{ env.VIEWER_DIR }} \
            --artifacts ${{ env.OUT_DIR }} \
            --bundle "${{ steps.bundle.outputs.bundle_name }}" \
            --manifest-sha "${{ steps.bundle.outputs.manifest_sha }}" \
            --verify-ok \
            --verify-strict \
            --run-id "${{ needs.gate.outputs.run_id }}" \
            --workflow "autonomy-evidence-publisher" \
            --repo "${{ github.repository }}" \
            --ref "refs/heads/main" \
            --sha "${{ github.sha }}" \
            --release-tag "${{ needs.gate.outputs.release_tag }}" \
            --verbose

      - name: Generate Evidence Ledger
        run: |
          echo "📋 Generating Evidence Ledger..."

          npx tsx tools/registry/autonomy-viewer/src/evidence-ledger-viewer.ts \
            --in ${{ env.VIEWER_DIR }} \
            --out ${{ env.VIEWER_DIR }}/autonomy-ledger.html \
            --title "TerraFusion Evidence Ledger - ${{ needs.gate.outputs.release_tag }}" \
            --verbose

      - name: Generate Chain of Custody
        run: |
          echo "🔗 Generating Chain of Custody..."

          # Create minimal apply-proofs for publisher context (no actual apply in publisher)
          echo '[{"planItemId":"publisher-${{ needs.gate.outputs.run_id }}","outcome":"noop","allowedSurfaceCheck":{"passed":true},"forbiddenPathCheck":{"passed":true}}]' > ${{ env.OUT_DIR }}/apply-proofs.json

          npx tsx tools/registry/autonomy-viewer/src/custody-cli.ts \
            --proof ${{ env.OUT_DIR }}/apply-proofs.json \
            --plan ${{ env.OUT_DIR }}/perf.plan.json \
            --evidence-index ${{ env.VIEWER_DIR }}/autonomy-evidence-index.json \
            --out ${{ env.VIEWER_DIR }}/autonomy-custody.html \
            --emit-json \
            --verbose || echo "::warning::Chain of custody generation failed (non-fatal)"

      # ========================================================================
      # Step 2b: Generate and Verify Custody Attestation (Phase 4N13/4N14)
      # ========================================================================
      - name: Generate Custody Attestation
        run: |
          echo "🔐 Generating Custody Attestation..."

          npx tsx tools/registry/autonomy-viewer/src/custody-attest.ts \
            --in ${{ env.VIEWER_DIR }} \
            --out ${{ env.VIEWER_DIR }}/custody-attestation.json \
            --verbose

          echo "✅ Custody attestation generated"

      - name: Verify Custody Attestation (strict)
        run: |
          echo "🔒 Verifying Custody Attestation (strict mode)..."

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-custody.ts \
            --in ${{ env.VIEWER_DIR }} \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "✅ Custody attestation verification PASSED (strict)"
          else
            echo "::error::Custody attestation verification FAILED - cannot publish"
            exit 1
          fi

      # ========================================================================
      # Step 2c: Phase 4N20 - Strict Pin Verification (Pre-Publish Gate)
      # ========================================================================
      - name: Verify Signature Pins (Phase 4N20)
        run: |
          echo "🔏 Phase 4N20: Verifying signature pins (strict mode)..."

          # Display expected pins
          echo "📌 Expected pins:"
          echo "   Issuer: $TF_SIG_ISSUER"
          echo "   Repo: $TF_SIG_REPO"
          echo "   Ref: $TF_SIG_REF"
          echo "   Workflow: $TF_SIG_WORKFLOW"
          echo "   Identity: $TF_SIG_IDENTITY"
          echo "   SHA: $TF_SIG_SHA"

          # Verify bundle with policy from evidence index
          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"
          INDEX_PATH="${{ env.VIEWER_DIR }}/autonomy-evidence-index.json"

          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-bundle.ts \
            --zip "$BUNDLE_PATH" \
            --verify-signatures \
            --policy-from-index "$INDEX_PATH" \
            --strict \
            --verbose
          VERIFY_EXIT=$?
          set -e

          if [ $VERIFY_EXIT -eq 0 ]; then
            echo "✅ Phase 4N20: Pin verification PASSED"
          else
            echo "::error::Phase 4N20: Pin verification FAILED - cannot publish"
            echo "::error::Signature identity does not match expected pins"
            exit 1
          fi

      # ========================================================================
      # Step 2d: Phase 4N21 - Rekor Transparency Log Verification (Pre-Publish Gate)
      # ========================================================================
      - name: Verify Rekor Anchoring (Phase 4N21)
        run: |
          echo "🧾 Phase 4N21: Verifying Rekor transparency log anchoring..."

          BUNDLE_PATH="${{ steps.bundle.outputs.bundle_path }}"
          INDEX_PATH="${{ env.VIEWER_DIR }}/autonomy-evidence-index.json"

          # Check that .bundle files exist (required for Rekor verification)
          BUNDLE_COUNT=$(find "$(dirname $BUNDLE_PATH)" -name "*.bundle" -type f | wc -l)
          if [ "$BUNDLE_COUNT" -eq 0 ]; then
            echo "::error::Phase 4N21: No .bundle files found - Rekor anchoring required"
            exit 1
          fi
          echo "   Found $BUNDLE_COUNT .bundle file(s)"

          # Verify Rekor anchoring using verify-custody
          set +e
          npx tsx tools/registry/autonomy-viewer/src/verify-custody.ts \
            --in "$(dirname $BUNDLE_PATH)" \
            --verify-signatures \
            --verify-rekor \
            --strict \
            --verbose
          REKOR_EXIT=$?
          set -e

          if [ $REKOR_EXIT -eq 0 ]; then
            echo "✅ Phase 4N21: Rekor anchoring verification PASSED"
          else
            echo "::error::Phase 4N21: Rekor verification FAILED - cannot publish"
            echo "::error::Evidence bundle is not properly anchored in transparency log"
            exit 1
          fi

      # ========================================================================
      # Step 3: Publish to GitHub Release
      # ========================================================================
      - name: Prepare release assets
        id: assets
        run: |
          echo "📦 Preparing release assets (Phase 4N14/4N16: Canonical naming + signatures)..."
          ASSETS_DIR="${{ env.VIEWER_DIR }}/release-assets"
          mkdir -p "$ASSETS_DIR"

          RUN_ID="${{ needs.gate.outputs.run_id }}"

          # Phase 4N14: Use canonical asset names for immutable URL generation
          # These names MUST match CANONICAL_ASSET_NAMES in evidence-index.ts
          BUNDLE_NAME="autonomy-evidence-bundle-${RUN_ID}.zip"
          MANIFEST_NAME="autonomy-evidence-manifest-${RUN_ID}.json"

          cp "${{ steps.bundle.outputs.bundle_path }}" "$ASSETS_DIR/${BUNDLE_NAME}"
          cp "${{ env.VIEWER_DIR }}/MANIFEST.json" "$ASSETS_DIR/${MANIFEST_NAME}"
          cp "${{ env.VIEWER_DIR }}/autonomy-evidence-index.json" "$ASSETS_DIR/"
          cp "${{ env.VIEWER_DIR }}/autonomy-dashboard.html" "$ASSETS_DIR/" || true
          cp "${{ env.VIEWER_DIR }}/autonomy-ledger.html" "$ASSETS_DIR/" || true
          cp "${{ env.VIEWER_DIR }}/autonomy-custody.html" "$ASSETS_DIR/" || true
          cp "${{ env.VIEWER_DIR }}/custody-attestation.json" "$ASSETS_DIR/" || true

          # Phase 4N16: Copy signature files for primary artifacts
          echo "📎 Including signature files..."

          # Bundle signatures
          if [ -f "${{ steps.bundle.outputs.bundle_path }}.sig" ]; then
            cp "${{ steps.bundle.outputs.bundle_path }}.sig" "$ASSETS_DIR/${BUNDLE_NAME}.sig"
            cp "${{ steps.bundle.outputs.bundle_path }}.crt" "$ASSETS_DIR/${BUNDLE_NAME}.crt"
            cp "${{ steps.bundle.outputs.bundle_path }}.bundle" "$ASSETS_DIR/${BUNDLE_NAME}.bundle"
            echo "  ✅ ${BUNDLE_NAME} signature files"
          fi

          # Manifest signatures
          if [ -f "${{ env.VIEWER_DIR }}/MANIFEST.json.sig" ]; then
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.sig" "$ASSETS_DIR/${MANIFEST_NAME}.sig"
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.crt" "$ASSETS_DIR/${MANIFEST_NAME}.crt"
            cp "${{ env.VIEWER_DIR }}/MANIFEST.json.bundle" "$ASSETS_DIR/${MANIFEST_NAME}.bundle"
            echo "  ✅ ${MANIFEST_NAME} signature files"
          fi

          echo "assets_dir=$ASSETS_DIR" >> $GITHUB_OUTPUT

          echo "✅ Release assets prepared (canonical naming + signatures):"
          ls -la "$ASSETS_DIR/"

      # ========================================================================
      # Step 3a: Phase 4N17 - Verify Signature Triplet Parity
      # ========================================================================
      - name: Verify Signature Triplet Parity (Phase 4N17)
        id: triplet
        run: |
          echo "🔏 Phase 4N17: Verifying signature triplet parity..."
          ASSETS_DIR="${{ steps.assets.outputs.assets_dir }}"

          RUN_ID="${{ needs.gate.outputs.run_id }}"
          BUNDLE_NAME="autonomy-evidence-bundle-${RUN_ID}.zip"
          MANIFEST_NAME="autonomy-evidence-manifest-${RUN_ID}.json"

          # Primary signed assets - MUST have complete triplet
          PRIMARY_SIGNED=(
            "$BUNDLE_NAME"
            "$MANIFEST_NAME"
          )

          TRIPLET_OK=true
          MISSING_TRIPLETS=()

          for ASSET in "${PRIMARY_SIGNED[@]}"; do
            SIG_FILE="${ASSET}.sig"
            CRT_FILE="${ASSET}.crt"
            BUNDLE_FILE="${ASSET}.bundle"

            MISSING=()
            if [ ! -f "$ASSETS_DIR/$SIG_FILE" ]; then MISSING+=("$SIG_FILE"); fi
            if [ ! -f "$ASSETS_DIR/$CRT_FILE" ]; then MISSING+=("$CRT_FILE"); fi
            if [ ! -f "$ASSETS_DIR/$BUNDLE_FILE" ]; then MISSING+=("$BUNDLE_FILE"); fi

            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "  ❌ $ASSET: Missing ${MISSING[*]}"
              TRIPLET_OK=false
              MISSING_TRIPLETS+=("$ASSET")
            else
              echo "  ✅ $ASSET: Complete triplet (.sig, .crt, .bundle)"
            fi
          done

          if [ "$TRIPLET_OK" = false ]; then
            echo ""
            echo "::error::Phase 4N17 FAILED: Signature triplet parity check failed"
            echo "::error::Missing triplets for: ${MISSING_TRIPLETS[*]}"
            echo "::error::All primary signed assets must have .sig, .crt, and .bundle files"
            exit 1
          fi

          echo ""
          echo "triplet_verified=true" >> $GITHUB_OUTPUT
          echo "✅ Phase 4N17: All signature triplets verified (parity check passed)"

      - name: Create or Update Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.release_tag }}
          name: 'Autonomy Evidence Archive - ${{ needs.gate.outputs.release_tag }}'
          body: |
            ## 📦 Autonomy Evidence Archive (Phase 4N16)

            This release contains verified and **cryptographically signed** evidence bundles from merged autonomy PRs.

            **Retention Tier:** 1 year (merged PR)
            **Policy:** autonomy-evidence-retention.v1
            **Signing:** Keyless OIDC (Sigstore/Fulcio)

            ---

            ### Run: ${{ needs.gate.outputs.run_id }}

            | Field | Value |
            |-------|-------|
            | **Bundle** | `autonomy-evidence-bundle-${{ needs.gate.outputs.run_id }}.zip` |
            | **Manifest SHA256** | `${{ steps.bundle.outputs.manifest_sha }}` |
            | **Verification** | ✅ Passed (strict) |
            | **Custody Attestation** | ✅ Passed (Phase 4N13) |
            | **Keyless Signature** | ✅ Signed (Phase 4N16) |
            | **PR** | #${{ github.event.pull_request.number }} |
            | **Merged By** | @${{ github.event.pull_request.merged_by.login }} |
            | **Merged At** | ${{ github.event.pull_request.merged_at }} |

            ---

            ### Verify Offline

            ```bash
            # Verify bundle integrity (hash-based)
            pnpm perf:verify-bundle --zip autonomy-evidence-bundle-${{ needs.gate.outputs.run_id }}.zip

            # Verify custody attestation (Phase 4N13)
            pnpm perf:verify-custody --strict

            # Verify cryptographic signature (Phase 4N16)
            pnpm perf:verify-signature \
              --artifact autonomy-evidence-bundle-${{ needs.gate.outputs.run_id }}.zip \
              --bundle autonomy-evidence-bundle-${{ needs.gate.outputs.run_id }}.zip.bundle \
              --identity "https://github.com/${{ github.repository }}/.github/workflows/autonomy-evidence-publisher.yml@refs/heads/main"
            ```

            ---

            *TerraFusion Autonomy v1 — Government. Transcended.*
          draft: false
          prerelease: false
          files: |
            ${{ steps.assets.outputs.assets_dir }}/*
          make_latest: false

      # ========================================================================
      # Step 4: Phase 4N15 - Verify Asset Existence (Reality Check)
      # ========================================================================
      - name: Verify Release Assets Exist (Phase 4N15)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Phase 4N15: Verifying release assets exist..."

          RELEASE_TAG="${{ needs.gate.outputs.release_tag }}"
          RUN_ID="${{ needs.gate.outputs.run_id }}"

          # Expected canonical asset names
          EXPECTED_ASSETS=(
            "autonomy-evidence-bundle-${RUN_ID}.zip"
            "autonomy-evidence-manifest-${RUN_ID}.json"
            "autonomy-evidence-index.json"
            "autonomy-dashboard.html"
            "autonomy-ledger.html"
            "autonomy-custody.html"
            "custody-attestation.json"
          )

          # Get actual assets from release
          echo "Fetching assets for release: $RELEASE_TAG"
          ACTUAL_ASSETS=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' 2>/dev/null || echo "")

          if [ -z "$ACTUAL_ASSETS" ]; then
            echo "::error::Failed to retrieve release assets for $RELEASE_TAG"
            exit 1
          fi

          echo "Found assets:"
          echo "$ACTUAL_ASSETS"
          echo ""

          # Check each expected asset exists
          MISSING=()
          for ASSET in "${EXPECTED_ASSETS[@]}"; do
            if echo "$ACTUAL_ASSETS" | grep -q "^${ASSET}$"; then
              echo "  ✅ $ASSET"
            else
              echo "  ❌ $ASSET (MISSING)"
              MISSING+=("$ASSET")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "::error::Phase 4N15 FAILED: Missing ${#MISSING[@]} expected assets"
            echo "Missing: ${MISSING[*]}"
            exit 1
          fi

          echo ""
          echo "✅ Phase 4N15: All ${#EXPECTED_ASSETS[@]} canonical assets verified"

      - name: Publish Summary
        run: |
          RUN_ID="${{ needs.gate.outputs.run_id }}"
          echo "## 📦 Evidence Published to Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${{ needs.gate.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Retention Tier:** 1 year (merged PR)" >> $GITHUB_STEP_SUMMARY
          echo "**Keyless Signature:** ✅ Signed (${{ steps.sign.outputs.signed_count }} artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Assets Published (Phase 4N14/4N16 Canonical Naming + Signatures)" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`autonomy-evidence-bundle-${RUN_ID}.zip\` | Complete evidence bundle |" >> $GITHUB_STEP_SUMMARY
          echo "| \`autonomy-evidence-bundle-${RUN_ID}.zip.bundle\` | Signature verification bundle |" >> $GITHUB_STEP_SUMMARY
