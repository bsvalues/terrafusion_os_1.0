name: 🧪 Comprehensive Testing Suite

on:
  push:
    branches: [ main, develop, 'feature/*', 'bugfix/*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly comprehensive tests
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - unit
        - integration
        - e2e
        - performance
      parallel_execution:
        description: 'Enable parallel test execution'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '18'
  DOTNET_VERSION: '8.0'
  PYTHON_VERSION: '3.11'
  PLAYWRIGHT_VERSION: '1.40.0'

jobs:
  # =============================================================================
  # TEST MATRIX STRATEGY
  # =============================================================================
  test-strategy:
    name: 📋 Test Strategy Planning
    runs-on: ubuntu-latest
    outputs:
      run_unit: ${{ steps.strategy.outputs.run_unit }}
      run_integration: ${{ steps.strategy.outputs.run_integration }}
      run_e2e: ${{ steps.strategy.outputs.run_e2e }}
      run_performance: ${{ steps.strategy.outputs.run_performance }}
      test_matrix: ${{ steps.strategy.outputs.test_matrix }}
    steps:
      - name: Determine test strategy
        id: strategy
        run: |
          TEST_TYPE="${{ github.event.inputs.test_type || 'all' }}"
          
          case "$TEST_TYPE" in
            "all")
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_performance=true" >> $GITHUB_OUTPUT
              ;;
            "unit")
              echo "run_unit=true" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_performance=false" >> $GITHUB_OUTPUT
              ;;
            "integration")
              echo "run_unit=false" >> $GITHUB_OUTPUT
              echo "run_integration=true" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_performance=false" >> $GITHUB_OUTPUT
              ;;
            "e2e")
              echo "run_unit=false" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=true" >> $GITHUB_OUTPUT
              echo "run_performance=false" >> $GITHUB_OUTPUT
              ;;
            "performance")
              echo "run_unit=false" >> $GITHUB_OUTPUT
              echo "run_integration=false" >> $GITHUB_OUTPUT
              echo "run_e2e=false" >> $GITHUB_OUTPUT
              echo "run_performance=true" >> $GITHUB_OUTPUT
              ;;
          esac
          
          # Test matrix for parallel execution
          echo 'test_matrix={"os":["ubuntu-latest","windows-latest"],"browser":["chromium","firefox","webkit"]}' >> $GITHUB_OUTPUT
          
          echo "Test strategy configured for: $TEST_TYPE"

  # =============================================================================
  # UNIT TESTS - BACKEND (.NET)
  # =============================================================================
  unit-tests-backend:
    name: 🔬 Backend Unit Tests
    runs-on: ${{ matrix.os }}
    needs: test-strategy
    if: needs.test-strategy.outputs.run_unit == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [net8.0]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache .NET packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/backend/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore TerraFusion.sln

      - name: Build test projects
        run: |
          dotnet build TerraFusion.sln \
            --configuration Debug \
            --no-restore \
            --verbosity minimal

      - name: Run unit tests
        run: |
          dotnet test TerraFusion.sln \
            --configuration Debug \
            --no-build \
            --logger trx \
            --logger "console;verbosity=detailed" \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            -- RunConfiguration.DisableAppDomain=true

      - name: Generate detailed coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"Html;HtmlSummary;Badges;TextSummary"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-test-results-${{ matrix.os }}
          path: backend/TestResults/
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          directory: backend/TestResults
          flags: backend,unit
          name: backend-unit-coverage

      - name: Comment coverage summary
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          if [[ -f "TestResults/CoverageReport/Summary.txt" ]]; then
            echo "## 📊 Backend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat TestResults/CoverageReport/Summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # =============================================================================
  # UNIT TESTS - FRONTEND (React + TypeScript)
  # =============================================================================
  unit-tests-frontend:
    name: 🎨 Frontend Unit Tests
    runs-on: ${{ matrix.os }}
    needs: test-strategy
    if: needs.test-strategy.outputs.run_unit == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '20']
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: |
          npm run lint
          npm run lint:types

      - name: Run unit tests
        run: |
          npm test -- \
            --coverage \
            --watchAll=false \
            --testResultsProcessor=jest-sonar-reporter \
            --coverageReporters=text-lcov \
            --coverageReporters=html \
            --coverageReporters=text

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-results-${{ matrix.os }}-node${{ matrix.node-version }}
          path: |
            frontend/coverage/
            frontend/test-report.xml
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '18'
        with:
          directory: frontend/coverage
          flags: frontend,unit
          name: frontend-unit-coverage

  # =============================================================================
  # INTEGRATION TESTS
  # =============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: test-strategy
    if: needs.test-strategy.outputs.run_integration == 'true'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrafusion_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      elasticsearch:
        image: elasticsearch:8.11.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        options: >-
          --health-cmd "curl http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 9200:9200
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup test environment
        run: |
          echo "🔧 Configuring integration test environment..."
          
          # Create test configuration
          cat > .env.test << EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/terrafusion_test
          REDIS_URL=redis://localhost:6379
          ELASTICSEARCH_URL=http://localhost:9200
          JWT_SECRET=test_secret_key_for_integration_tests
          API_BASE_URL=http://localhost:5000
          FRONTEND_URL=http://localhost:3000
          ENVIRONMENT=test
          LOG_LEVEL=debug
          EOF

      - name: Restore backend dependencies
        working-directory: backend
        run: dotnet restore TerraFusion.sln

      - name: Run database migrations
        working-directory: backend
        run: |
          export ASPNETCORE_ENVIRONMENT=Test
          dotnet ef database update --project TerraFusion.Infrastructure --startup-project TerraFusion.API

      - name: Seed test data
        working-directory: backend
        run: |
          dotnet run --project TerraFusion.TestDataSeeder

      - name: Start API in background
        working-directory: backend
        run: |
          export ASPNETCORE_ENVIRONMENT=Test
          nohup dotnet run --project TerraFusion.API --urls "http://localhost:5000" > api.log 2>&1 &
          echo $! > api.pid
          
          # Wait for API to be ready
          for i in {1..30}; do
            if curl -f http://localhost:5000/health > /dev/null 2>&1; then
              echo "✅ API is ready"
              break
            fi
            echo "⏳ Waiting for API... ($i/30)"
            sleep 2
          done

      - name: Run API integration tests
        working-directory: backend
        run: |
          dotnet test TerraFusion.IntegrationTests \
            --configuration Release \
            --logger trx \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Start frontend in background
        working-directory: frontend
        run: |
          npm run start &
          echo $! > frontend.pid
          
          # Wait for frontend to be ready
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Frontend is ready"
              break
            fi
            echo "⏳ Waiting for frontend... ($i/30)"
            sleep 2
          done

      - name: Run frontend integration tests
        working-directory: frontend
        run: |
          npm run test:integration

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            backend/TestResults/
            frontend/test-results/
            backend/api.log
          retention-days: 30

      - name: Cleanup processes
        if: always()
        run: |
          if [[ -f backend/api.pid ]]; then
            kill $(cat backend/api.pid) || true
          fi
          if [[ -f frontend/frontend.pid ]]; then
            kill $(cat frontend/frontend.pid) || true
          fi

  # =============================================================================
  # END-TO-END TESTS
  # =============================================================================
  e2e-tests:
    name: 🌐 E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: test-strategy
    if: needs.test-strategy.outputs.run_e2e == 'true'
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: npm run build

      - name: Run E2E tests
        run: |
          npx playwright test \
            --project=${{ matrix.browser }} \
            --shard=${{ matrix.shard }}/4 \
            --reporter=html,json,junit

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30

      - name: Upload trace files
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.browser }}-shard${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 30

  # =============================================================================
  # PERFORMANCE TESTS
  # =============================================================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: test-strategy
    if: needs.test-strategy.outputs.run_performance == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install Artillery
        run: npm install -g artillery

      - name: Build application for testing
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run Lighthouse performance tests
        run: |
          npm install -g @lhci/cli
          lhci autorun --config=lighthouserc.json

      - name: Run K6 load tests
        run: |
          k6 run tests/performance/load-test.js

      - name: Run Artillery stress tests
        run: |
          artillery run tests/performance/stress-test.yml

      - name: Bundle size analysis
        working-directory: frontend
        run: |
          npm run analyze:bundle

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            .lighthouseci/
            performance-results/
            frontend/bundle-analyzer-report.html
          retention-days: 30

  # =============================================================================
  # TEST RESULTS AGGREGATION
  # =============================================================================
  test-summary:
    name: 📊 Test Results Summary
    runs-on: ubuntu-latest
    needs: [test-strategy, unit-tests-backend, unit-tests-frontend, integration-tests, e2e-tests, performance-tests]
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate test summary
        run: |
          echo "# 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test execution status
          echo "## 🎯 Test Execution Status" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.unit-tests-backend.result }}" != "skipped" ]]; then
            echo "| Backend Unit Tests | ${{ needs.unit-tests-backend.result }} | .NET Core unit tests |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.unit-tests-frontend.result }}" != "skipped" ]]; then
            echo "| Frontend Unit Tests | ${{ needs.unit-tests-frontend.result }} | React/TypeScript unit tests |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.integration-tests.result }}" != "skipped" ]]; then
            echo "| Integration Tests | ${{ needs.integration-tests.result }} | API + Database integration |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.e2e-tests.result }}" != "skipped" ]]; then
            echo "| E2E Tests | ${{ needs.e2e-tests.result }} | Cross-browser end-to-end |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.performance-tests.result }}" != "skipped" ]]; then
            echo "| Performance Tests | ${{ needs.performance-tests.result }} | Load, stress, and bundle analysis |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📈 Coverage & Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Backend coverage reports uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend coverage reports uploaded to Codecov" >> $GITHUB_STEP_SUMMARY
          echo "- Performance metrics available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- E2E test traces available for failed tests" >> $GITHUB_STEP_SUMMARY

      - name: Report test status
        if: failure()
        run: |
          echo "❌ Some tests failed. Please check the detailed logs and artifacts."
          exit 1
