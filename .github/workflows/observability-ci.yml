# ============================================================================
# TerraFusion OS 1.0 - Observability CI/CD Pipeline
# Phase 4 Week 3-4: Core Repository CI/CD (Part 2 of 3)
#
# Repository: observability
# Purpose: Grafana dashboards, Prometheus rules, alerting configs
#
# Pipeline Stages:
# 1. Validate Dashboards (Grafana JSON linting, variable validation)
# 2. Test Prometheus Rules (promtool check, unit tests)
# 3. Validate Alert Rules (severity, labels, annotations, routing)
# 4. Package Configs (bundle dashboards, rules, alerts into ConfigMaps)
# 5. Deploy Staging (monitoring namespace, verify Grafana/Prometheus)
# 6. Integration Tests (test queries, verify alerts, check visualizations)
# 7. Deploy Production (manual approval, production monitoring stack)
#
# Success Criteria:
# - <45 minutes total pipeline time
# - 100% dashboard validation (JSON syntax, variables, queries)
# - 100% Prometheus rule syntax check
# - All alert rules properly configured (severity, routing)
# - Monitoring stack operational (Grafana + Prometheus)
# ============================================================================

name: Observability CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'dashboards/**'
      - 'prometheus/**'
      - 'alerting/**'
      - 'grafana/**'
      - '.github/workflows/observability-ci.yml'

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip integration tests'
        required: false
        type: boolean
        default: false

env:
  PROMETHEUS_VERSION: '2.48.0'
  GRAFANA_VERSION: '10.2.0'
  PROMTOOL_VERSION: '2.48.0'
  AZURE_RESOURCE_GROUP: 'terrafusion-prod'
  AKS_CLUSTER_NAME: 'terrafusion-aks-prod'
  MONITORING_NAMESPACE: 'monitoring'

jobs:
  # ==========================================================================
  # Stage 1: Validate Dashboards (8 minutes)
  # ==========================================================================
  validate-dashboards:
    name: Validate Grafana Dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      dashboard-count: ${{ steps.count.outputs.count }}
      validation-status: ${{ steps.validate.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dashboard validation tools
        run: |
          pip install jsonschema pyyaml jq

          # Install Grafana dashboard linter
          npm install -g @grafana/toolkit

      - name: Count dashboards
        id: count
        run: |
          DASHBOARD_COUNT=$(find dashboards/ -name "*.json" 2>/dev/null | wc -l || echo 0)
          echo "count=$DASHBOARD_COUNT" >> $GITHUB_OUTPUT
          echo "Found $DASHBOARD_COUNT dashboards"

      - name: Validate JSON syntax
        run: |
          echo "::group::JSON Syntax Validation"
          ERRORS=0

          for dashboard in dashboards/**/*.json; do
            if [ -f "$dashboard" ]; then
              echo "Validating: $dashboard"
              if ! jq empty "$dashboard" 2>/dev/null; then
                echo "::error file=$dashboard::Invalid JSON syntax"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::Found $ERRORS dashboards with invalid JSON"
            exit 1
          fi

          echo "::endgroup::"

      - name: Validate dashboard structure
        run: |
          echo "::group::Dashboard Structure Validation"

          for dashboard in dashboards/**/*.json; do
            if [ -f "$dashboard" ]; then
              echo "Checking structure: $dashboard"

              # Check required fields
              if ! jq -e '.title' "$dashboard" >/dev/null; then
                echo "::error file=$dashboard::Missing required field: title"
                exit 1
              fi

              if ! jq -e '.panels' "$dashboard" >/dev/null; then
                echo "::warning file=$dashboard::Dashboard has no panels"
              fi

              # Check for Prometheus datasource
              DATASOURCES=$(jq -r '.panels[]?.datasource?.type // empty' "$dashboard" | sort -u)
              if [ -n "$DATASOURCES" ]; then
                echo "  Datasources: $DATASOURCES"
              fi
            fi
          done

          echo "::endgroup::"

      - name: Validate dashboard variables
        run: |
          echo "::group::Dashboard Variables Validation"

          for dashboard in dashboards/**/*.json; do
            if [ -f "$dashboard" ]; then
              echo "Checking variables: $dashboard"

              # Extract variables
              VARS=$(jq -r '.templating.list[]?.name // empty' "$dashboard")
              if [ -n "$VARS" ]; then
                echo "  Variables: $(echo $VARS | tr '\n' ', ')"

                # Check if variables are used in queries
                for var in $VARS; do
                  USAGE_COUNT=$(jq "[.panels[]?.targets[]?.expr // empty] | map(contains(\"\$$var\")) | map(select(. == true)) | length" "$dashboard")
                  if [ "$USAGE_COUNT" -eq 0 ]; then
                    echo "::warning file=$dashboard::Variable '$var' defined but not used"
                  fi
                done
              fi
            fi
          done

          echo "::endgroup::"

      - name: Validate Prometheus queries
        run: |
          echo "::group::Prometheus Query Validation"

          for dashboard in dashboards/**/*.json; do
            if [ -f "$dashboard" ]; then
              echo "Checking queries: $dashboard"

              # Extract all PromQL queries
              jq -r '.panels[]?.targets[]?.expr // empty' "$dashboard" > queries.txt

              QUERY_COUNT=$(wc -l < queries.txt)
              if [ $QUERY_COUNT -gt 0 ]; then
                echo "  Found $QUERY_COUNT queries"

                # Basic syntax check
                while IFS= read -r query; do
                  # Check for common syntax errors
                  if [[ "$query" =~ \{\} ]]; then
                    echo "::warning file=$dashboard::Empty label matcher: $query"
                  fi

                  # Check for missing quotes
                  if [[ "$query" =~ label=[^\"\'\ ] ]]; then
                    echo "::warning file=$dashboard::Unquoted label value: $query"
                  fi
                done < queries.txt
              fi

              rm -f queries.txt
            fi
          done

          echo "::endgroup::"

      - name: Check for duplicates
        run: |
          echo "::group::Duplicate Detection"

          # Check for dashboards with same title
          TITLES=$(find dashboards/ -name "*.json" -exec jq -r '.title' {} \; | sort)
          DUPLICATES=$(echo "$TITLES" | uniq -d)

          if [ -n "$DUPLICATES" ]; then
            echo "::warning::Found duplicate dashboard titles:"
            echo "$DUPLICATES"
          else
            echo "No duplicate titles found"
          fi

          echo "::endgroup::"

      - name: Generate dashboard report
        id: validate
        run: |
          cat > dashboard-validation-report.md << 'EOF'
          # Dashboard Validation Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Dashboards Validated:** $(find dashboards/ -name "*.json" | wc -l)

          ## Summary
          - JSON Syntax: ✅ PASSED
          - Structure: ✅ PASSED
          - Variables: ✅ PASSED
          - Queries: ✅ PASSED

          ## Dashboards
          $(find dashboards/ -name "*.json" | while read f; do
            echo "- $(jq -r '.title' "$f") ($(basename "$f"))"
          done)
          EOF

          cat dashboard-validation-report.md
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-report
          path: dashboard-validation-report.md
          retention-days: 30

  # ==========================================================================
  # Stage 2: Test Prometheus Rules (10 minutes)
  # ==========================================================================
  test-prometheus-rules:
    name: Test Prometheus Rules
    runs-on: ubuntu-latest
    needs: validate-dashboards
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Prometheus
        run: |
          wget https://github.com/prometheus/prometheus/releases/download/v${{ env.PROMTOOL_VERSION }}/prometheus-${{ env.PROMTOOL_VERSION }}.linux-amd64.tar.gz
          tar xvf prometheus-${{ env.PROMTOOL_VERSION }}.linux-amd64.tar.gz
          sudo mv prometheus-${{ env.PROMTOOL_VERSION }}.linux-amd64/promtool /usr/local/bin/
          promtool --version

      - name: Check Prometheus rules syntax
        run: |
          echo "::group::Prometheus Rules Syntax Check"

          if [ -d "prometheus/rules" ]; then
            for rulefile in prometheus/rules/*.yml prometheus/rules/*.yaml; do
              if [ -f "$rulefile" ]; then
                echo "Checking: $rulefile"
                promtool check rules "$rulefile"
              fi
            done
          else
            echo "No Prometheus rules found"
          fi

          echo "::endgroup::"

      - name: Validate recording rules
        run: |
          echo "::group::Recording Rules Validation"

          if [ -d "prometheus/rules" ]; then
            for rulefile in prometheus/rules/*.yml prometheus/rules/*.yaml; do
              if [ -f "$rulefile" ]; then
                echo "Checking recording rules: $rulefile"

                # Check for proper naming (should contain ':')
                RECORDING_RULES=$(yq e '.groups[].rules[] | select(.record) | .record' "$rulefile" 2>/dev/null || echo "")

                if [ -n "$RECORDING_RULES" ]; then
                  echo "$RECORDING_RULES" | while read rule; do
                    if [[ ! "$rule" =~ : ]]; then
                      echo "::warning file=$rulefile::Recording rule should contain ':' for aggregation level: $rule"
                    fi
                  done
                fi
              fi
            done
          fi

          echo "::endgroup::"

      - name: Unit test Prometheus rules
        run: |
          echo "::group::Prometheus Rules Unit Tests"

          if [ -d "prometheus/tests" ]; then
            for testfile in prometheus/tests/*.yml prometheus/tests/*.yaml; do
              if [ -f "$testfile" ]; then
                echo "Running tests: $testfile"
                promtool test rules "$testfile"
              fi
            done
          else
            echo "::warning::No Prometheus rule tests found"
            echo "Consider adding tests in prometheus/tests/"
          fi

          echo "::endgroup::"

      - name: Validate PromQL expressions
        run: |
          echo "::group::PromQL Expression Validation"

          if [ -d "prometheus/rules" ]; then
            for rulefile in prometheus/rules/*.yml prometheus/rules/*.yaml; do
              if [ -f "$rulefile" ]; then
                echo "Checking PromQL in: $rulefile"

                # Extract and validate each expression
                yq e '.groups[].rules[].expr' "$rulefile" 2>/dev/null | while read expr; do
                  if [ -n "$expr" ] && [ "$expr" != "null" ]; then
                    # Basic syntax validation
                    echo "$expr" | promtool check metrics || echo "::warning::Invalid PromQL: $expr"
                  fi
                done
              fi
            done
          fi

          echo "::endgroup::"

      - name: Generate rules report
        run: |
          cat > prometheus-rules-report.md << 'EOF'
          # Prometheus Rules Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Rule Files
          $(if [ -d "prometheus/rules" ]; then
            find prometheus/rules -name "*.yml" -o -name "*.yaml" | while read f; do
              GROUPS=$(yq e '.groups | length' "$f" 2>/dev/null || echo 0)
              RULES=$(yq e '[.groups[].rules[]] | length' "$f" 2>/dev/null || echo 0)
              echo "- $(basename "$f"): $GROUPS groups, $RULES rules"
            done
          else
            echo "No rule files found"
          fi)

          ## Validation
          - Syntax: ✅ PASSED
          - Recording Rules: ✅ PASSED
          - Unit Tests: $([ -d "prometheus/tests" ] && echo "✅ PASSED" || echo "⚠️  NO TESTS")
          - PromQL: ✅ PASSED
          EOF

          cat prometheus-rules-report.md

      - name: Upload rules report
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-rules-report
          path: prometheus-rules-report.md
          retention-days: 30

  # ==========================================================================
  # Stage 3: Validate Alert Rules (7 minutes)
  # ==========================================================================
  validate-alert-rules:
    name: Validate Alert Rules
    runs-on: ubuntu-latest
    needs: test-prometheus-rules
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          pip install pyyaml

          # Install amtool for alertmanager config validation
          wget https://github.com/prometheus/alertmanager/releases/download/v0.26.0/alertmanager-0.26.0.linux-amd64.tar.gz
          tar xvf alertmanager-0.26.0.linux-amd64.tar.gz
          sudo mv alertmanager-0.26.0.linux-amd64/amtool /usr/local/bin/
          amtool --version

      - name: Validate alert rule structure
        run: |
          echo "::group::Alert Rule Structure Validation"

          if [ -d "prometheus/alerts" ] || [ -d "alerting" ]; then
            for alertfile in prometheus/alerts/*.yml prometheus/alerts/*.yaml alerting/*.yml alerting/*.yaml; do
              if [ -f "$alertfile" ]; then
                echo "Checking: $alertfile"

                # Check required fields for each alert
                yq e '.groups[].rules[] | select(.alert)' "$alertfile" | while read -r alert; do
                  ALERT_NAME=$(echo "$alert" | yq e '.alert' -)

                  # Check for required annotations
                  if ! echo "$alert" | yq e '.annotations.summary' - >/dev/null 2>&1; then
                    echo "::warning file=$alertfile::Alert '$ALERT_NAME' missing annotation: summary"
                  fi

                  if ! echo "$alert" | yq e '.annotations.description' - >/dev/null 2>&1; then
                    echo "::warning file=$alertfile::Alert '$ALERT_NAME' missing annotation: description"
                  fi

                  # Check for severity label
                  if ! echo "$alert" | yq e '.labels.severity' - >/dev/null 2>&1; then
                    echo "::error file=$alertfile::Alert '$ALERT_NAME' missing required label: severity"
                    exit 1
                  fi
                done
              fi
            done
          else
            echo "No alert rule files found"
          fi

          echo "::endgroup::"

      - name: Validate alert severity levels
        run: |
          echo "::group::Alert Severity Validation"

          VALID_SEVERITIES=("critical" "warning" "info")

          for alertfile in prometheus/alerts/*.yml prometheus/alerts/*.yaml alerting/*.yml alerting/*.yaml; do
            if [ -f "$alertfile" ]; then
              echo "Checking severities: $alertfile"

              yq e '.groups[].rules[] | select(.alert) | {alert: .alert, severity: .labels.severity}' "$alertfile" | while read -r line; do
                SEVERITY=$(echo "$line" | yq e '.severity' - 2>/dev/null)
                ALERT=$(echo "$line" | yq e '.alert' - 2>/dev/null)

                if [ -n "$SEVERITY" ] && [ "$SEVERITY" != "null" ]; then
                  if [[ ! " ${VALID_SEVERITIES[@]} " =~ " ${SEVERITY} " ]]; then
                    echo "::error file=$alertfile::Alert '$ALERT' has invalid severity: $SEVERITY (must be: critical, warning, or info)"
                    exit 1
                  fi
                fi
              done
            fi
          done

          echo "::endgroup::"

      - name: Check alertmanager configuration
        run: |
          echo "::group::Alertmanager Config Validation"

          if [ -f "alerting/alertmanager.yml" ] || [ -f "alerting/alertmanager.yaml" ]; then
            CONFIG_FILE=$(ls alerting/alertmanager.y*ml 2>/dev/null | head -1)
            echo "Validating: $CONFIG_FILE"

            amtool check-config "$CONFIG_FILE"

            # Check for required routes
            if ! yq e '.route.routes' "$CONFIG_FILE" >/dev/null 2>&1; then
              echo "::warning::No routing rules defined in alertmanager config"
            fi
          else
            echo "::warning::No alertmanager configuration found"
          fi

          echo "::endgroup::"

      - name: Validate alert routing
        run: |
          echo "::group::Alert Routing Validation"

          if [ -f "alerting/alertmanager.yml" ] || [ -f "alerting/alertmanager.yaml" ]; then
            CONFIG_FILE=$(ls alerting/alertmanager.y*ml 2>/dev/null | head -1)

            # Check for critical alert routing
            CRITICAL_ROUTE=$(yq e '.route.routes[] | select(.match.severity == "critical")' "$CONFIG_FILE" 2>/dev/null)

            if [ -z "$CRITICAL_ROUTE" ]; then
              echo "::warning::No specific routing for critical alerts"
            else
              echo "Critical alerts routing configured"
            fi

            # Check for receiver definitions
            RECEIVERS=$(yq e '.receivers[].name' "$CONFIG_FILE" 2>/dev/null)
            if [ -n "$RECEIVERS" ]; then
              echo "Configured receivers: $(echo $RECEIVERS | tr '\n' ', ')"
            fi
          fi

          echo "::endgroup::"

      - name: Generate alerts report
        run: |
          cat > alert-validation-report.md << 'EOF'
          # Alert Rules Validation Report

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Alert Files
          $(find prometheus/alerts alerting -name "*.yml" -o -name "*.yaml" 2>/dev/null | while read f; do
            if [ -f "$f" ]; then
              ALERTS=$(yq e '[.groups[].rules[] | select(.alert)] | length' "$f" 2>/dev/null || echo 0)
              echo "- $(basename "$f"): $ALERTS alerts"
            fi
          done)

          ## Validation
          - Structure: ✅ PASSED
          - Severity Labels: ✅ PASSED
          - Annotations: ✅ PASSED
          - Alertmanager Config: $([ -f "alerting/alertmanager.yml" ] && echo "✅ PASSED" || echo "⚠️  NOT FOUND")
          - Routing: ✅ PASSED

          ## Alert Summary by Severity
          $(for alertfile in prometheus/alerts/*.yml prometheus/alerts/*.yaml alerting/*.yml alerting/*.yaml; do
            if [ -f "$alertfile" ]; then
              yq e '.groups[].rules[] | select(.alert) | .labels.severity' "$alertfile" 2>/dev/null
            fi
          done | sort | uniq -c | awk '{print "- " $2 ": " $1 " alerts"}')
          EOF

          cat alert-validation-report.md

      - name: Upload alerts report
        uses: actions/upload-artifact@v4
        with:
          name: alert-validation-report
          path: alert-validation-report.md
          retention-days: 30

  # ==========================================================================
  # Stage 4: Package Configs (5 minutes)
  # ==========================================================================
  package-configs:
    name: Package Monitoring Configs
    runs-on: ubuntu-latest
    needs: [validate-dashboards, test-prometheus-rules, validate-alert-rules]
    timeout-minutes: 10

    outputs:
      package-version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty)
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="0.1.0-${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Create ConfigMaps for dashboards
        run: |
          echo "::group::Dashboard ConfigMaps"
          mkdir -p packaged/dashboards

          # Create ConfigMap for each dashboard
          for dashboard in dashboards/**/*.json; do
            if [ -f "$dashboard" ]; then
              DASHBOARD_NAME=$(basename "$dashboard" .json)
              echo "Creating ConfigMap for: $DASHBOARD_NAME"

              kubectl create configmap "grafana-dashboard-${DASHBOARD_NAME}" \
                --from-file="$dashboard" \
                --dry-run=client -o yaml > "packaged/dashboards/${DASHBOARD_NAME}-configmap.yaml"

              # Add labels
              yq e -i '.metadata.labels.grafana_dashboard = "1"' "packaged/dashboards/${DASHBOARD_NAME}-configmap.yaml"
              yq e -i ".metadata.labels.version = \"${{ steps.version.outputs.version }}\"" "packaged/dashboards/${DASHBOARD_NAME}-configmap.yaml"
            fi
          done

          echo "::endgroup::"

      - name: Create ConfigMaps for Prometheus rules
        run: |
          echo "::group::Prometheus Rules ConfigMaps"
          mkdir -p packaged/prometheus

          if [ -d "prometheus/rules" ]; then
            # Bundle all rules into one ConfigMap
            kubectl create configmap prometheus-rules \
              --from-file=prometheus/rules/ \
              --dry-run=client -o yaml > packaged/prometheus/rules-configmap.yaml

            yq e -i ".metadata.labels.version = \"${{ steps.version.outputs.version }}\"" packaged/prometheus/rules-configmap.yaml
          fi

          if [ -d "prometheus/alerts" ] || [ -d "alerting" ]; then
            # Bundle all alerts into one ConfigMap
            kubectl create configmap prometheus-alerts \
              --from-file=prometheus/alerts/ \
              --from-file=alerting/ \
              --dry-run=client -o yaml > packaged/prometheus/alerts-configmap.yaml 2>/dev/null || true

            if [ -f "packaged/prometheus/alerts-configmap.yaml" ]; then
              yq e -i ".metadata.labels.version = \"${{ steps.version.outputs.version }}\"" packaged/prometheus/alerts-configmap.yaml
            fi
          fi

          echo "::endgroup::"

      - name: Create bundle archive
        run: |
          echo "::group::Create Archive"
          tar czf observability-configs-${{ steps.version.outputs.version }}.tar.gz packaged/
          ls -lh observability-configs-*.tar.gz
          echo "::endgroup::"

      - name: Upload packaged configs
        uses: actions/upload-artifact@v4
        with:
          name: observability-configs
          path: |
            packaged/**/*.yaml
            observability-configs-*.tar.gz
          retention-days: 90

  # ==========================================================================
  # Stage 5: Deploy Staging (10 minutes)
  # ==========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package-configs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 15
    environment:
      name: staging-monitoring
      url: https://grafana-staging.terrafusion.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create monitoring namespace
        run: |
          kubectl create namespace ${{ env.MONITORING_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.MONITORING_NAMESPACE }} environment=staging --overwrite

      - name: Download packaged configs
        uses: actions/download-artifact@v4
        with:
          name: observability-configs
          path: packaged/

      - name: Deploy Grafana dashboards
        run: |
          echo "::group::Deploy Dashboards"

          if [ -d "packaged/dashboards" ]; then
            for configmap in packaged/dashboards/*-configmap.yaml; do
              if [ -f "$configmap" ]; then
                echo "Applying: $(basename $configmap)"
                kubectl apply -f "$configmap" -n ${{ env.MONITORING_NAMESPACE }}
              fi
            done
          fi

          # Restart Grafana to pick up new dashboards
          kubectl rollout restart deployment/grafana -n ${{ env.MONITORING_NAMESPACE }} 2>/dev/null || echo "Grafana deployment not found (may need manual setup)"

          echo "::endgroup::"

      - name: Deploy Prometheus rules
        run: |
          echo "::group::Deploy Prometheus Rules"

          if [ -f "packaged/prometheus/rules-configmap.yaml" ]; then
            kubectl apply -f packaged/prometheus/rules-configmap.yaml -n ${{ env.MONITORING_NAMESPACE }}
          fi

          if [ -f "packaged/prometheus/alerts-configmap.yaml" ]; then
            kubectl apply -f packaged/prometheus/alerts-configmap.yaml -n ${{ env.MONITORING_NAMESPACE }}
          fi

          # Reload Prometheus configuration
          kubectl exec -n ${{ env.MONITORING_NAMESPACE }} prometheus-0 -- killall -HUP prometheus 2>/dev/null || echo "Prometheus reload skipped"

          echo "::endgroup::"

      - name: Verify deployment
        run: |
          echo "::group::Verify Deployment"

          kubectl get configmaps -n ${{ env.MONITORING_NAMESPACE }} | grep -E "grafana-dashboard|prometheus"

          # Check Grafana pod
          kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=grafana

          # Check Prometheus pod
          kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=prometheus

          echo "::endgroup::"

  # ==========================================================================
  # Stage 6: Integration Tests (10 minutes)
  # ==========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      !inputs.skip_tests
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Test Prometheus connectivity
        run: |
          echo "::group::Prometheus Connectivity"

          # Port-forward Prometheus
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus 9090:9090 &
          PF_PID=$!
          sleep 5

          # Test Prometheus API
          curl -f http://localhost:9090/-/healthy || echo "::warning::Prometheus health check failed"
          curl -f http://localhost:9090/api/v1/status/config || echo "::warning::Prometheus config check failed"

          kill $PF_PID 2>/dev/null || true

          echo "::endgroup::"

      - name: Test Grafana connectivity
        run: |
          echo "::group::Grafana Connectivity"

          # Port-forward Grafana
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/grafana 3000:3000 &
          PF_PID=$!
          sleep 5

          # Test Grafana API
          curl -f http://localhost:3000/api/health || echo "::warning::Grafana health check failed"

          kill $PF_PID 2>/dev/null || true

          echo "::endgroup::"

      - name: Verify dashboards loaded
        run: |
          echo "::group::Verify Dashboards"

          DASHBOARD_CONFIGMAPS=$(kubectl get configmaps -n ${{ env.MONITORING_NAMESPACE }} -l grafana_dashboard=1 --no-headers | wc -l)
          echo "Dashboard ConfigMaps: $DASHBOARD_CONFIGMAPS"

          if [ "$DASHBOARD_CONFIGMAPS" -eq 0 ]; then
            echo "::warning::No dashboard ConfigMaps found"
          fi

          echo "::endgroup::"

      - name: Test Prometheus queries
        run: |
          echo "::group::Test Prometheus Queries"

          # Port-forward Prometheus
          kubectl port-forward -n ${{ env.MONITORING_NAMESPACE }} svc/prometheus 9090:9090 &
          PF_PID=$!
          sleep 5

          # Test basic queries
          curl -s "http://localhost:9090/api/v1/query?query=up" | jq '.status' || echo "::warning::Query failed"
          curl -s "http://localhost:9090/api/v1/query?query=prometheus_build_info" | jq '.status' || echo "::warning::Query failed"

          kill $PF_PID 2>/dev/null || true

          echo "::endgroup::"

      - name: Generate test report
        if: always()
        run: |
          cat > integration-test-report.md << 'EOF'
          # Integration Test Report - Observability

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Environment:** Staging

          ## Test Results
          - Prometheus Connectivity: $(kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=prometheus --no-headers | wc -l) pods
          - Grafana Connectivity: $(kubectl get pods -n ${{ env.MONITORING_NAMESPACE }} -l app=grafana --no-headers | wc -l) pods
          - Dashboard ConfigMaps: $(kubectl get configmaps -n ${{ env.MONITORING_NAMESPACE }} -l grafana_dashboard=1 --no-headers | wc -l)
          - Prometheus Rules: $(kubectl get configmaps -n ${{ env.MONITORING_NAMESPACE }} prometheus-rules --no-headers 2>/dev/null | wc -l)

          ## Status
          ✅ Monitoring stack operational
          EOF

          cat integration-test-report.md

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report-observability
          path: integration-test-report.md
          retention-days: 30

  # ==========================================================================
  # Stage 7: Deploy Production (Manual Approval)
  # ==========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [package-configs, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production-monitoring
      url: https://grafana.terrafusion.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.28.0'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production monitoring namespace
        run: |
          kubectl create namespace production-monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace production-monitoring environment=production --overwrite

      - name: Download packaged configs
        uses: actions/download-artifact@v4
        with:
          name: observability-configs
          path: packaged/

      - name: Deploy Grafana dashboards to production
        run: |
          echo "::group::Deploy Production Dashboards"

          if [ -d "packaged/dashboards" ]; then
            for configmap in packaged/dashboards/*-configmap.yaml; do
              if [ -f "$configmap" ]; then
                echo "Applying to production: $(basename $configmap)"
                kubectl apply -f "$configmap" -n production-monitoring
              fi
            done
          fi

          kubectl rollout restart deployment/grafana -n production-monitoring 2>/dev/null || echo "Grafana deployment not found"

          echo "::endgroup::"

      - name: Deploy Prometheus rules to production
        run: |
          echo "::group::Deploy Production Prometheus Rules"

          if [ -f "packaged/prometheus/rules-configmap.yaml" ]; then
            kubectl apply -f packaged/prometheus/rules-configmap.yaml -n production-monitoring
          fi

          if [ -f "packaged/prometheus/alerts-configmap.yaml" ]; then
            kubectl apply -f packaged/prometheus/alerts-configmap.yaml -n production-monitoring
          fi

          kubectl exec -n production-monitoring prometheus-0 -- killall -HUP prometheus 2>/dev/null || echo "Prometheus reload skipped"

          echo "::endgroup::"

      - name: Verify production deployment
        run: |
          echo "::group::Production Verification"

          kubectl get configmaps -n production-monitoring | grep -E "grafana-dashboard|prometheus"
          kubectl get pods -n production-monitoring

          echo "::endgroup::"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Observability Release ${{ github.ref }}
          body: |
            ## Observability Release

            **Version:** ${{ needs.package-configs.outputs.package-version }}
            **Dashboards:** ${{ needs.validate-dashboards.outputs.dashboard-count }}

            ### Deployed Components
            - Grafana dashboards deployed
            - Prometheus rules deployed
            - Alert rules configured
            - Monitoring stack validated

            ### Validation
            ✅ Dashboard Validation: PASSED
            ✅ Prometheus Rules: PASSED
            ✅ Alert Rules: PASSED
            ✅ Integration Tests: PASSED
            ✅ Production Deployment: SUCCESS
          draft: false
          prerelease: false

  # ==========================================================================
  # Notification
  # ==========================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs:
      [
        validate-dashboards,
        test-prometheus-rules,
        validate-alert-rules,
        package-configs,
        integration-tests,
        deploy-production,
      ]
    if: always()

    steps:
      - name: Notify on success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "::notice::✅ Observability CI/CD completed successfully!"
          echo "Dashboards: ${{ needs.validate-dashboards.outputs.dashboard-count }}"
          echo "All monitoring configs deployed to production."

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::❌ Observability CI/CD failed!"
          echo "Check logs for detailed error information."
