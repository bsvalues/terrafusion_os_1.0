name: E2E Smoke + Unit Tests

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js (use Node 22 to satisfy engine requirements)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Verify Node runtime
        run: |
          echo "Node version:" $(node -v)
          echo "NPM version:" $(npm -v)
          node -v
          npm -v

      - name: Build frontend (deterministic)
        working-directory: terrafusion-cos/frontend_engine
        run: |
          # Use npm ci when a lockfile is present for deterministic installs,
          # otherwise fall back to npm install to avoid failing on runners without a lockfile.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run ci:build

      - name: Run unit tests (electron)
        working-directory: terrafusion-cos/electron
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Install Playwright and browsers
        working-directory: terrafusion-cos/e2e
        run: |
          # Install dependencies required by Playwright. Use npm install as CI may not have a lockfile.
          npm install --no-audit --no-fund
          npx playwright install --with-deps

      - name: Serve built frontend for E2E
        working-directory: terrafusion-cos/frontend_engine
        env:
          TF_FRONTEND_PORT: 3102
        run: |
          # Serve the deterministic build from terrafusion-cos/ui on port $TF_FRONTEND_PORT
          # Don't run `npm ci` here (it requires a lockfile); just serve the already-built `../ui` directory.
          npx http-server ../ui -p $TF_FRONTEND_PORT &

          # Wait until the server responds before running Playwright (10s timeout)
          for i in $(seq 1 10); do
            if curl -sSf "http://localhost:${TF_FRONTEND_PORT}" >/dev/null 2>&1; then
              echo "Frontend server is up"
              break
            fi
            echo "Waiting for frontend server... ($i)"
            sleep 1
          done

      - name: Run Playwright E2E (smoke + preload test)
        working-directory: terrafusion-cos/e2e
        env:
          CI: true
          TF_FRONTEND_PORT: 3102
          TF_API_5050_PORT: 5050
        # Make Playwright strict so failures fail the job
        run: |
          npx playwright test --reporter=list preload-ipc.spec.js smoke.spec.js

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            terrafusion-cos/logs/artifacts/renderer-screenshot.png
            terrafusion-cos/logs/electron-main.log
