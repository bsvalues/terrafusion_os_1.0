# TerraFusion OS - Container Image Security Scanning
# FISMA-HIGH: Mandatory container vulnerability scanning before deployment
name: Container Security Scan

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/Dockerfile*'
      - 'backend/src/**'
      - 'frontend/Dockerfile*'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile*'
      - 'backend/src/**'
      - 'frontend/Dockerfile*'
  schedule:
    # Weekly scan for new CVEs
    - cron: '0 6 * * 1'

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build & Scan ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            dockerfile: backend/Dockerfile.API
            context: backend
          - name: gateway
            dockerfile: backend/Dockerfile.Gateway
            context: backend
          - name: consciousness
            dockerfile: backend/Dockerfile.Consciousness
            context: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ matrix.service.dockerfile }} \
            -t terrafusion/${{ matrix.service.name }}:scan \
            ${{ matrix.service.context }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'terrafusion/${{ matrix.service.name }}:scan'
          format: 'sarif'
          output: 'trivy-${{ matrix.service.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service.name }}.sarif'
          category: 'trivy-${{ matrix.service.name }}'

      - name: Run Trivy filesystem scan (config audit)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '${{ matrix.service.context }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  scan-kubernetes:
    name: Scan Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy K8s manifest scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Run Trivy Docker Compose scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'backend/docker-compose.microservices.yml'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
