name: CI • TerraForge Rust Kernel (cost)

# Builds and tests the retained sovereign cost kernel at packages/terrabuild/kernels.
# The canonical valuation kernel is owned by bsvalues/terrafusion-forge and is
# staged through the local sovereign proof path; GitHub is not its artifact trust plane.
#
# Without this workflow, a deploy ships a .NET endpoint that 500s at subprocess
# launch because the binaries were never built. This workflow is the safety net.
#
# Trigger policy:
#   • push to main                      → always run + publish artifact
#   • PR touching kernels or workflow   → run, verify, no artifact publish
#   • workflow_dispatch                  → manual run
#
# Success gates:
#   1. cargo fmt --check passes (no formatting drift)
#   2. cargo clippy --all-targets -- -D warnings (zero warnings)
#   3. cargo test --workspace passes
#   4. Release binaries build for linux + windows targets
#   5. The cost binary passes a smoke-test invocation (valid JSON in → valid JSON out)

on:
  push:
    branches: [main]
    paths:
      - 'packages/terrabuild/kernels/**'
      - '.github/workflows/terraforge-kernels.yml'
  pull_request:
    paths:
      - 'packages/terrabuild/kernels/**'
      - '.github/workflows/terraforge-kernels.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/terrabuild/kernels
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kernels-${{ runner.os }}-${{ hashFiles('packages/terrabuild/kernels/Cargo.lock') }}
          restore-keys: |
            kernels-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  build-release:
    name: Build release (${{ matrix.os }})
    needs: lint-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-suffix: linux-x64
            bin-ext: ''
          - os: windows-latest
            artifact-suffix: windows-x64
            bin-ext: '.exe'
    defaults:
      run:
        working-directory: packages/terrabuild/kernels
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target (release)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kernels-release-${{ runner.os }}-${{ hashFiles('packages/terrabuild/kernels/Cargo.lock') }}
          restore-keys: |
            kernels-release-${{ runner.os }}-

      - name: cargo build --release --locked
        run: cargo build --release --workspace --locked

      - name: Smoke test — cost kernel returns success JSON for a known input
        shell: bash
        run: |
          COST_BIN="../../../target/release/terraforge-kernel-cost${{ matrix.bin-ext }}"
          if [ ! -f "$COST_BIN" ]; then
            echo "::error::Missing expected binary at $COST_BIN"
            exit 1
          fi
          INPUT='{"contractPackVersion":"1.0.0","moduleApiVersion":"1.0.0","requestId":"ci-smoke-001","action":"calculate_cost","payload":{"subject":{"parcelId":"CI-0001","attributes":{"sqft":1850.0,"quality":"GOOD","condition":"AVERAGE"}},"tables":{"baseRate":145.50,"modifiers":{"GOOD":1.15,"AVERAGE":1.0,"DepreciationRate":0.10}}}}'
          OUTPUT=$(echo "$INPUT" | "$COST_BIN")
          echo "cost kernel stdout: $OUTPUT"
          echo "$OUTPUT" | grep -q '"success":true' || { echo "::error::cost kernel did not return success"; exit 1; }
          echo "$OUTPUT" | grep -q '"replacementCost":309551' || { echo "::error::cost kernel produced unexpected replacementCost"; exit 1; }

      - name: Upload retained cost binary (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: terraforge-cost-kernel-${{ matrix.artifact-suffix }}
          path: target/release/terraforge-kernel-cost${{ matrix.bin-ext }}
          retention-days: 30
          if-no-files-found: error
