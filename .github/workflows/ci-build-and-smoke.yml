name: Build • Test • Compose Smoke

'on':
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_ROLL_FORWARD: Major
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Toolchains ----------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Caches ----------
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      # ---------- Build & Tests ----------
      - name: Print versions
        run: |
          dotnet --info
          rustc --version
          cargo --version
          docker version

      - name: Build backends & images
        run: |
          make build
        env:
          BUILDKIT_PROGRESS: plain

      - name: Unit tests (.NET + Rust)
        run: |
          make test

      # ---------- Compose Up + Health ----------
      - name: Compose up (detached)
        run: |
          docker compose -f docker-compose.dev.yml up -d db redis nats keycloak
          # Wait for Keycloak before API
          echo "Waiting for Keycloak..."
          for i in {1..60}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Keycloak is up"; break
            fi
            sleep 2
          done
          docker compose -f docker-compose.dev.yml up -d api valuation-worker gis-worker

      - name: Wait for API health
        run: |
          echo "Waiting for API health..."
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5046/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy"; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"; docker compose -f docker-compose.dev.yml logs api; exit 1

      # ---------- k6 Smoke ----------
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke
        run: |
          k6 run ops/k6/smoke.js

      # ---------- Artifacts & Teardown ----------
      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml logs --no-color > compose-logs.txt || true
      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
