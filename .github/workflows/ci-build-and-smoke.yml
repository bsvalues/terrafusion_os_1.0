name: Build - Test - Compose Smoke

'on':
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_ROLL_FORWARD: Major
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build-test-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Toolchains ----------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Caches ----------
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.sln', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Cargo registry + git + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ runner.os }}-

      # ---------- Build & Tests ----------
      - name: Print versions
        run: |
          dotnet --info
          rustc --version
          cargo --version
          docker version

      - name: Build backends & images
        run: |
          make build
        env:
          BUILDKIT_PROGRESS: plain

      - name: Unit tests (.NET + Rust)
        run: |
          make test

      # ---------- Compose Up + Health ----------
      - name: Compose up (infra)
        run: |
          docker compose -f docker-compose.dev.yml pull db redis nats keycloak || true
          docker compose -f docker-compose.dev.yml up -d db redis nats keycloak

      - name: Wait for Keycloak (up to 15 min)
        run: |
          bash ops/ci/wait-for.sh "http://localhost:8080" 900
          # optional: check realm import page exists (not required for health)
          curl -sf "http://localhost:8080" >/dev/null

      - name: Compose up (apps)
        run: |
          docker compose -f docker-compose.dev.yml up -d api valuation-worker gis-worker

      - name: Wait for API health (up to 10 min)
        run: |
          bash ops/ci/wait-for.sh "http://localhost:5046/health" 600

      # ---------- k6 Smoke ----------
      - name: Setup k6
        uses: grafana/setup-k6-action@v1
      - name: Run k6 smoke
        run: k6 run ops/k6/smoke.js

      # ---------- Artifacts & Teardown ----------
      - name: Collect compose/system diagnostics
        if: always()
        run: |
          mkdir -p .ci_artifacts
          docker compose -f docker-compose.dev.yml ps --format json > .ci_artifacts/compose-ps.json || true
          docker ps --no-trunc > .ci_artifacts/docker-ps.txt || true
          docker compose -f docker-compose.dev.yml logs --no-color > .ci_artifacts/compose-logs.txt || true
          # Grab per-container logs (more reliable if compose logs fail)
          for c in $(docker ps --format '{{.Names}}'); do
            docker logs --timestamps "$c" > ".ci_artifacts/${c}.log" 2>&1 || true
          done
          # Snapshot compose file used
          cp docker-compose.dev.yml .ci_artifacts/ || true

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-and-docker-logs
          path: .ci_artifacts
          if-no-files-found: warn

      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
