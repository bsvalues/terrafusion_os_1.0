name: 🔒 TerraFusion Seal Gate (fast)

# ═══════════════════════════════════════════════════════════════════════════════
# SOLO VELOCITY MODE - The ONE required check for PR merges
# ═══════════════════════════════════════════════════════════════════════════════
# Target: 3-8 minutes max
# Required: Yes (this is the ONLY required check)
# Philosophy: Fast, deterministic, never flaky
#
# What's included:
#   ✅ Lint/format checks (fast)
#   ✅ Type checking (fast)
#   ✅ Unit tests (fast, no external deps)
#   ✅ Build validation (fast)
#   ✅ Scope drift guard (deterministic)
#
# What's NOT included (moved to nightly/release):
#   ❌ E2E tests (slow, flaky)
#   ❌ Container scanning (slow)
#   ❌ SBOM generation (slow)
#   ❌ Integration tests (requires services)
#   ❌ Performance tests (slow)
#   ❌ Security deep scans (slow)
#
# See: .github/workflows/nightly.yml for heavy checks
# See: .github/workflows/release-compliance.yml for release-only checks
# ═══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: seal-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Fast path classification - skip heavy work for docs/ci-only changes
  # ═══════════════════════════════════════════════════════════════════════════
  classify:
    name: 📋 Classify Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      skip_backend: ${{ steps.classify.outputs.skip_backend }}
      skip_frontend: ${{ steps.classify.outputs.skip_frontend }}
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          # Get changed files safely for PR vs push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" || echo "")
          else
            # Push: compare before..after when available
            if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git diff --name-only "${{ github.event.before }}...${{ github.sha }}" || echo "")
            else
              # Fallback (first commit / unusual)
              CHANGED=$(git ls-files)
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Classify
          # Treat SEAL backend-gate wiring changes as backend-impacting so security
          # regression checks cannot be skipped by workflow-only diffs.
          HAS_BACKEND=$(echo "$CHANGED" | grep -E '^(backend/|\.github/workflows/seal-gate-fast\.yml$)' | head -1 || true)
          HAS_FRONTEND=$(echo "$CHANGED" | grep -E '^(src/|frontend/|package\.json|pnpm-lock\.yaml)' | head -1 || true)
          # NON_DOC: anything that isn't docs, markdown, config, or meta files
          NON_DOC=$(echo "$CHANGED" | grep -Ev '^(docs/|.*\.md$|README(\..*)?$|\.github/|\.editorconfig$|\.gitignore$|LICENSE$)' | head -1 || true)

          # Set outputs
          if [ -z "$HAS_BACKEND" ]; then
            echo "skip_backend=true" >> $GITHUB_OUTPUT
          else
            echo "skip_backend=false" >> $GITHUB_OUTPUT
          fi

          if [ -z "$HAS_FRONTEND" ]; then
            echo "skip_frontend=true" >> $GITHUB_OUTPUT
          else
            echo "skip_frontend=false" >> $GITHUB_OUTPUT
          fi

          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> $GITHUB_OUTPUT
            echo "📄 DOCS-ONLY: Skipping heavy build steps"
          else
            echo "docs_only=false" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Frontend Fast Gate (lint + type-check + unit tests + build)
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-fast:
    name: 🎨 Frontend Fast Gate
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 8
    needs: classify
    if: needs.classify.outputs.skip_frontend != 'true' && needs.classify.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (loud, temporary non-blocking)
        id: lint
        run: pnpm -C frontend run lint
        continue-on-error: true

      - name: Lint escape hatch (expires 2026-03-15)
        if: steps.lint.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Lint failed (temporarily non-blocking until 2026-03-15). Fix lint; this will become a merge blocker."
          today="$(date -u +%F)"
          cutoff="2026-03-15"
          if [[ "$today" > "$cutoff" || "$today" == "$cutoff" ]]; then
            echo "::error::Lint escape hatch expired on $cutoff. Lint must pass."
            exit 1
          fi

      - name: Type check (blocking)
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          if pnpm -C frontend -s run | grep -qE '(^| )type-check($| )'; then
            pnpm -C frontend run type-check
          elif pnpm -C frontend -s run | grep -qE '(^| )typecheck($| )'; then
            pnpm -C frontend run typecheck
          else
            echo "::error::No typecheck script found (expected type-check or typecheck)."
            exit 1
          fi

      - name: Unit tests (blocking)
        id: unit-tests
        run: pnpm -C frontend run test:tier0

      - name: IPC tests (blocking)
        id: ipc-tests
        run: pnpm -C frontend run test:ipc

      - name: Build (blocking)
        id: build
        run: pnpm -C frontend run build

      - name: Bundle Analysis (blocking - requires build)
        id: bundle-analysis
        run: pnpm -C frontend run test:unit -- apps/os-shell/src/tests/performance/BundleAnalysis.test.ts

      - name: Frontend Summary
        if: always()
        shell: bash
        run: |
          echo "## 🎨 Frontend Fast Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome == 'success' && '✅' || '⚠️ Soft (expires 2026-03-15)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type Check | ${{ steps.typecheck.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ steps.unit-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IPC Tests | ${{ steps.ipc-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle | ${{ steps.bundle-analysis.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # Backend Fast Gate (restore + build with warnings-as-errors + unit tests)
  # ═══════════════════════════════════════════════════════════════════════════
  backend-fast:
    name: ⚙️ Backend Fast Gate
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 8
    needs: classify
    if: needs.classify.outputs.skip_backend != 'true' && needs.classify.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee # v4.0.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/TerraFusion.sln

      - name: Build (warnings as errors)
        run: dotnet build backend/TerraFusion.sln -c Release --no-restore /warnaserror

      - name: Unit tests (no DB required)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/TerraFusion.sln \
            -c Release \
            --no-build \
            --filter "Category=Unit|TestCategory=Unit" \
            -v:minimal \
            || dotnet test backend/TerraFusion.sln -c Release --no-build -v:minimal

      - name: Phase 4 security regression visibility
        id: phase4-tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/TerraFusion.Unit.Tests/TerraFusion.Unit.Tests.csproj \
            -c Release \
            --no-build \
            --filter "FullyQualifiedName~SecurityTodoGateTests|FullyQualifiedName~JwtTokenServiceSecurityTests" \
            -v:minimal
          dotnet test backend/TerraFusion.API.Tests/TerraFusion.API.Tests.csproj \
            -c Release \
            --no-build \
            --filter "FullyQualifiedName~AuthenticationRateLimitTests|FullyQualifiedName~AuditCorrelationTests" \
            -v:minimal

      - name: Backend Summary
        if: always()
        shell: bash
        run: |
          echo "## ⚙️ Backend Fast Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Phase 4 Security Regression Visibility | ${{ steps.phase4-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # Governance Fast Gate (drift guard, scope classifier)
  # ═══════════════════════════════════════════════════════════════════════════
  governance-fast:
    name: 🔒 Governance Fast Gate
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Orphan C# source scan (build graph integrity)
        shell: bash
        run: |
          set -euo pipefail
          echo "🔍 Scanning for orphaned .cs files..."
          node tools/dx/orphan-cs-scan.mjs
          echo "✅ Build graph integrity verified"

      - name: Workspace sanity (no quarantined packages)
        shell: bash
        run: |
          set -euo pipefail
          if pnpm -w list --depth 0 2>/dev/null | grep -q "MARKED-FOR-REVIEW"; then
            echo "::error::Quarantined package included in workspace (MARKED-FOR-REVIEW)"
            exit 1
          fi
          echo "✅ Workspace sanity passed"

      - name: Governance enforcement (AGENTS.md compliance)
        shell: bash
        env:
          CI: 'true'
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          echo "🔒 Governance Enforcement (SEAL)"
          echo "================================="

          # Get changed files
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null || echo "")
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${GITHUB_EVENT_BEFORE}...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "")
          fi

          VIOLATIONS=0

          # Check 1: Forbidden paths (AGENTS.md)
          echo ""
          echo "📋 Check: Forbidden paths..."
          FORBIDDEN=$(echo "$CHANGED" | grep -E '^(specialized/|applications/|.*ARCHIVE/)' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Forbidden paths modified (AGENTS.md violation)"
            echo "$FORBIDDEN" | while read -r f; do echo "  ❌ $f"; done
            VIOLATIONS=1
          else
            echo "  ✅ No forbidden paths modified"
          fi

          # Check 2: Legacy frontend
          echo ""
          echo "📋 Check: Legacy frontend..."
          LEGACY=$(echo "$CHANGED" | grep -E '^frontend/' | grep -v -E '^frontend-v2/|^frontend/apps/os-shell/|^frontend/package\.json$|^frontend/vitest\.config\.ts$|^frontend/lighthouserc\.cjs$|^frontend/Dockerfile$|^frontend/nginx\.conf$|^frontend/pnpm-lock\.yaml$|^frontend/\.dockerignore$|^frontend/\.eslintrc\.(cjs|json|js)$|^frontend/tsconfig(\..+)?\.json$' || true)
          if [ -n "$LEGACY" ]; then
            echo "::error::Legacy frontend modified (use frontend-v2/ or frontend/apps/os-shell/ instead)"
            echo "$LEGACY" | while read -r f; do echo "  ❌ $f"; done
            VIOLATIONS=1
          else
            echo "  ✅ Legacy frontend not touched"
          fi

          echo ""
          if [ $VIOLATIONS -eq 0 ]; then
            echo "✅ Governance enforcement passed"
          else
            echo "❌ Governance violations detected - merge blocked"
            exit 1
          fi

      - name: Drift guard (dotnet canonical enforcement)
        shell: bash
        run: |
          set -euo pipefail
          # Forbid direct 'dotnet test' in workflows (except canonically allowed files)
          # Allowed: dotnet-test.yml (canonical), seal-gate-fast.yml (self), nightly.yml (heavy checks),
          #          release-compliance.yml (release checks), ci.yml (legacy, mentions in comments)
          hits=$(grep -rn 'dotnet test' .github/workflows/*.yml \
            | grep -v 'dotnet-test.yml' \
            | grep -v 'seal-gate-fast.yml' \
            | grep -v 'nightly.yml' \
            | grep -v 'release-compliance.yml' \
            | grep -v 'ci.yml' \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Drift guard violation: direct 'dotnet test' found outside allowed workflows"
            echo "$hits"
            exit 1
          fi
          echo "✅ Drift guard passed"

      - name: OS Core typecheck (runtime enforcement layer)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f packages/os-core/package.json ]; then
            pnpm -C packages/os-core typecheck
            echo "✅ OS Core typecheck passed"
          else
            echo "⚠️ OS Core not yet scaffolded (skipped)"
          fi

      - name: Scope classifier (optional)
        if: hashFiles('tools/scope-classifier/package.json') != ''
        working-directory: tools/scope-classifier
        run: pnpm test
        continue-on-error: true

      - name: Verify critical files exist
        shell: bash
        run: |
          set -euo pipefail
          # Snyk policy (warn-only, optional in Solo Velocity)
          test -f .snyk && echo "✅ .snyk exists" || echo "⚠️ .snyk missing (optional)"
          # Solution file (CRITICAL - fail if missing)
          test -f backend/TerraFusion.sln || { echo "::error::Missing backend/TerraFusion.sln"; exit 1; }
          # Platform contract (CRITICAL - single source of truth)
          test -f platform.json || { echo "::error::Missing platform.json (platform contract)"; exit 1; }
          echo "✅ Critical files verified"

      - name: Platform contract lint
        shell: bash
        run: node scripts/platform-lint.mjs

      - name: Quarantine toolchain tests (23 tests / 4 suites)
        id: quarantine-tests
        shell: bash
        run: node --test scripts/quarantine/__tests__/*.test.mjs
        continue-on-error: true

      - name: Phase83 platform tests (32 tests / 11 suites)
        id: phase83-tests
        shell: bash
        run: node --test os-platform/core/tests/phase83-tools.test.mjs
        continue-on-error: true

      - name: Workflow path integrity (13 tests / 5 suites)
        id: workflow-tests
        shell: bash
        run: node --test scripts/governance/__tests__/workflow-paths.test.mjs
        continue-on-error: true

      - name: Workflow inventory tests (23 tests / 5 suites)
        id: inventory-tests
        shell: bash
        run: node --test scripts/governance/__tests__/workflow-inventory.test.mjs scripts/governance/__tests__/workflow-inventory.integration.test.mjs
        continue-on-error: true

      - name: Workflow inventory snapshot check
        id: inventory-snapshot
        shell: bash
        run: node scripts/governance/workflow-inventory.mjs --check
        continue-on-error: true

      - name: Governance test escape hatch (expires 2026-03-15)
        if: steps.quarantine-tests.outcome == 'failure' || steps.phase83-tests.outcome == 'failure' || steps.workflow-tests.outcome == 'failure' || steps.inventory-tests.outcome == 'failure' || steps.inventory-snapshot.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Governance tests failed (temporarily non-blocking until 2026-03-15). See Issue #266."
          today="$(date -u +%F)"
          cutoff="2026-03-15"
          if [[ "$today" > "$cutoff" || "$today" == "$cutoff" ]]; then
            echo "::error::Governance test escape hatch expired on $cutoff. All governance tests must pass."
            exit 1
          fi

      - name: Repo shape guard (root spine allowlist)
        id: shape-guard
        shell: bash
        run: node scripts/repo-shape-guard.mjs
        continue-on-error: true

      - name: Repo shape guard enforcement
        if: steps.shape-guard.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ vars.QUARANTINE_GUARD_STRICT }}" = "true" ]; then
            echo "::error::Repo shape guard failed (QUARANTINE_GUARD_STRICT=true). Root spine must be clean."
            exit 1
          else
            echo "::warning::Repo shape guard failed (quarantine in progress). Will become blocking when QUARANTINE_GUARD_STRICT=true."
          fi

      - name: Quarantine plan check (strict — gated)
        if: vars.QUARANTINE_STRICT == 'true'
        shell: bash
        run: node scripts/quarantine/plan.mjs --check

      - name: Governance Summary
        if: always()
        shell: bash
        run: |
          echo "## 🔒 Governance Fast Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Workspace Sanity | ${{ steps.shape-guard.outcome != '' && '✅' || '⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AGENTS.md Compliance | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Drift Guard | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Quarantine Tests (23t/4s) | ${{ steps.quarantine-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase83 Tests (32t/11s) | ${{ steps.phase83-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow Paths (13t/5s) | ${{ steps.workflow-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inventory Tests (23t/5s) | ${{ steps.inventory-tests.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Inventory Snapshot | ${{ steps.inventory-snapshot.outcome == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total: 91 tests / 25 suites** | |" >> $GITHUB_STEP_SUMMARY
          echo "| Repo Shape Guard | ${{ steps.shape-guard.outcome == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quarantine Plan | ${{ vars.QUARANTINE_STRICT == 'true' && '✅ (strict)' || '⏭️ (not strict)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Enforcement:** QUARANTINE_GUARD_STRICT=\`${{ vars.QUARANTINE_GUARD_STRICT }}\`, QUARANTINE_STRICT=\`${{ vars.QUARANTINE_STRICT }}\`" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # SEAL - Final gate (all fast checks must pass)
  # ═══════════════════════════════════════════════════════════════════════════
  seal:
    name: 🔒 TerraFusion Seal Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs: [classify, frontend-fast, backend-fast, governance-fast]

    steps:
      - name: Check all gates
        shell: bash
        run: |
          set -euo pipefail
          echo "🔒 TerraFusion Seal Gate (fast) - Results"
          echo "========================================="
          echo ""

          # Track failures
          FAILED=0

          # Classify always runs
          if [ "${{ needs.classify.result }}" != "success" ]; then
            echo "❌ Classify: FAILED"
            FAILED=1
          else
            echo "✅ Classify: passed"
          fi

          # Frontend (may be skipped)
          case "${{ needs.frontend-fast.result }}" in
            success) echo "✅ Frontend: passed" ;;
            skipped) echo "⏭️ Frontend: skipped (no changes)" ;;
            *)
              echo "❌ Frontend: FAILED"
              FAILED=1
              ;;
          esac

          # Backend (may be skipped)
          case "${{ needs.backend-fast.result }}" in
            success) echo "✅ Backend: passed" ;;
            skipped) echo "⏭️ Backend: skipped (no changes)" ;;
            *)
              echo "❌ Backend: FAILED"
              FAILED=1
              ;;
          esac

          # Governance (may be skipped for docs-only)
          case "${{ needs.governance-fast.result }}" in
            success) echo "✅ Governance: passed" ;;
            skipped) echo "⏭️ Governance: skipped (docs-only)" ;;
            *)
              echo "❌ Governance: FAILED"
              FAILED=1
              ;;
          esac

          echo ""

          # Write to GitHub Step Summary
          echo "## 🔒 SEAL Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Audit Trail**" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Classification: docs_only=${{ needs.classify.outputs.docs_only }}, skip_frontend=${{ needs.classify.outputs.skip_frontend }}, skip_backend=${{ needs.classify.outputs.skip_backend }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Classify | ${{ needs.classify.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          case "${{ needs.frontend-fast.result }}" in
            success) echo "| Frontend | ✅ |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| Frontend | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| Frontend | ❌ |" >> $GITHUB_STEP_SUMMARY ;;
          esac
          case "${{ needs.backend-fast.result }}" in
            success) echo "| Backend | ✅ |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| Backend | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| Backend | ❌ |" >> $GITHUB_STEP_SUMMARY ;;
          esac
          case "${{ needs.governance-fast.result }}" in
            success) echo "| Governance | ✅ |" >> $GITHUB_STEP_SUMMARY ;;
            skipped) echo "| Governance | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY ;;
            *) echo "| Governance | ❌ |" >> $GITHUB_STEP_SUMMARY ;;
          esac
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $FAILED -eq 0 ]; then
            echo "🎉 SEAL GATE PASSED - Ready to merge"
            echo "> ✅ **Ready to merge**" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "🚫 SEAL GATE FAILED - Fix issues before merging"
            echo "> ❌ **Fix issues before merging**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════════════════
  # Legacy SEAL context (Repository Rules compatibility)
  # ═══════════════════════════════════════════════════════════════════════════
  seal-legacy:
    name: 🔒 SEAL
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs: [seal]

    steps:
      - name: Emit legacy context
        shell: bash
        run: |
          # This job exists solely to emit the legacy "🔒 SEAL" context name
          # for Repository Rules compatibility (GitHub's newer governance layer)
          #
          # Branch Protection requires: "🔒 TerraFusion Seal Gate"
          # Repository Rules require: "🔒 SEAL" (legacy name)

          if [ "${{ needs.seal.result }}" == "success" ]; then
            echo "✅ Legacy SEAL context (inherited from TerraFusion Seal Gate)"
            exit 0
          else
            echo "❌ Legacy SEAL context (inherited failure from TerraFusion Seal Gate)"
            exit 1
          fi
