name: Frontend CI (sanity-main)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hello
        run: |
          echo "Workflow parsed. Runner is alive."
          node -v || true
          npm -v || true
