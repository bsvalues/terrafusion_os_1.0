name: Code Intelligence
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan TODOs
        run: python scripts/scan_todos.py
      - name: Upload Intel
        uses: actions/upload-artifact@v4
        with:
          name: code-intel
          path: docs/TODO_INTEL.json
