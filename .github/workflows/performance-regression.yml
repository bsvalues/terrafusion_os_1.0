# performance-regression.yml
#
# GitHub Actions CI/CD Pipeline for Performance Regression Detection
# Automated performance testing on every PR with threshold enforcement.
#
# Pipeline Features:
# - Lighthouse CI audits on every PR
# - Bundle size comparison with main branch
# - Memory leak detection tests
# - Performance benchmark suite execution
# - Automated reporting with historical trends
# - PR comment with performance metrics
#
# Triggers:
# - Pull Request (opened, synchronize)
# - Push to main branch
# - Manual workflow dispatch
#
# @module PerformanceRegressionCI
# @version 1.0.0
# @elite-status Championship-Grade CI/CD

name: Performance Regression Detection

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'vite.config.ts'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: LIGHTHOUSE CI AUDIT
  # ═══════════════════════════════════════════════════════════════════════════
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Build production bundle
        run: pnpm run build
        working-directory: ./frontend
        env:
          NODE_ENV: production

      - name: Start preview server
        run: |
          pnpm run preview &
          npx wait-on http://localhost:4173 -t 60000
        working-directory: ./frontend

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:4173
            http://localhost:4173/research-portal
          configPath: './frontend/lighthouserc.cjs'
          uploadArtifacts: true
          artifactName: lighthouse-results-${{ github.run_id }}
          temporaryPublicStorage: true

      - name: Comment PR with Lighthouse results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/manifest.json', 'utf8'));
            const comment = `## 🏆 Lighthouse Performance Audit

            | Metric | Score | Target |
            |--------|-------|--------|
            | Performance | ${results[0].summary.performance * 100}% | ≥90% |
            | Accessibility | ${results[0].summary.accessibility * 100}% | ≥95% |
            | Best Practices | ${results[0].summary['best-practices'] * 100}% | ≥90% |

            [View Full Report](${results[0].url})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: BUNDLE SIZE ANALYSIS
  # ═══════════════════════════════════════════════════════════════════════════
  bundle-size:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Build PR bundle
        run: pnpm run build
        working-directory: ./frontend
        env:
          NODE_ENV: production

      - name: Analyze PR bundle size
        id: pr-size
        run: |
          BUNDLE_SIZE=$(du -sb dist/assets/*.js | awk '{s+=$1} END {print s}')
          echo "PR_BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
          echo "PR bundle size: $BUNDLE_SIZE bytes"
        working-directory: ./frontend

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Install main dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./main-branch/frontend

      - name: Build main bundle
        run: pnpm run build
        working-directory: ./main-branch/frontend
        env:
          NODE_ENV: production

      - name: Analyze main bundle size
        id: main-size
        run: |
          BUNDLE_SIZE=$(du -sb dist/assets/*.js | awk '{s+=$1} END {print s}')
          echo "MAIN_BUNDLE_SIZE=$BUNDLE_SIZE" >> $GITHUB_OUTPUT
          echo "Main bundle size: $BUNDLE_SIZE bytes"
        working-directory: ./main-branch/frontend

      - name: Compare bundle sizes
        if: github.event_name == 'pull_request'
        run: |
          PR_SIZE=${{ steps.pr-size.outputs.PR_BUNDLE_SIZE }}
          MAIN_SIZE=${{ steps.main-size.outputs.MAIN_BUNDLE_SIZE }}
          DIFF=$((PR_SIZE - MAIN_SIZE))
          PERCENT=$(awk "BEGIN {printf \"%.2f\", ($DIFF / $MAIN_SIZE) * 100}")

          echo "Bundle size comparison:"
          echo "Main: $MAIN_SIZE bytes"
          echo "PR: $PR_SIZE bytes"
          echo "Difference: $DIFF bytes ($PERCENT%)"

          # Fail if bundle size increased by >5%
          if (( $(echo "$PERCENT > 5" | bc -l) )); then
            echo "❌ Bundle size increased by $PERCENT% (threshold: 5%)"
            exit 1
          else
            echo "✅ Bundle size change within acceptable range"
          fi

      - name: Comment PR with bundle size
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const prSize = parseInt('${{ steps.pr-size.outputs.PR_BUNDLE_SIZE }}');
            const mainSize = parseInt('${{ steps.main-size.outputs.MAIN_BUNDLE_SIZE }}');
            const diff = prSize - mainSize;
            const percent = ((diff / mainSize) * 100).toFixed(2);

            const status = Math.abs(parseFloat(percent)) > 5 ? '❌' : '✅';

            const comment = `## ${status} Bundle Size Analysis

            | Branch | Size | Change |
            |--------|------|--------|
            | main | ${(mainSize / 1024).toFixed(2)} KB | - |
            | PR | ${(prSize / 1024).toFixed(2)} KB | ${diff > 0 ? '+' : ''}${(diff / 1024).toFixed(2)} KB (${percent}%) |

            Target: <500 KB gzipped
            Threshold: ±5% change
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: PERFORMANCE BENCHMARK SUITE
  # ═══════════════════════════════════════════════════════════════════════════
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run performance benchmark suite
        run: pnpm test -- --testPathPattern=performance --coverage=false
        working-directory: ./frontend
        env:
          NODE_OPTIONS: --expose-gc

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: frontend/performance-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: MEMORY LEAK DETECTION
  # ═══════════════════════════════════════════════════════════════════════════
  memory-leaks:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run memory leak detection tests
        run: pnpm test -- --testPathPattern=MemoryLeakDetection --coverage=false
        working-directory: ./frontend
        env:
          NODE_OPTIONS: --expose-gc --max-old-space-size=4096

      - name: Analyze heap snapshots
        run: |
          echo "Memory leak detection completed"
          echo "Check test output for leak indicators"

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 5: PERFORMANCE SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Performance Summary
    needs: [lighthouse, bundle-size, benchmarks, memory-leaks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate performance summary
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = [
              { name: 'Lighthouse Audit', status: '${{ needs.lighthouse.result }}' },
              { name: 'Bundle Size', status: '${{ needs.bundle-size.result }}' },
              { name: 'Performance Benchmarks', status: '${{ needs.benchmarks.result }}' },
              { name: 'Memory Leak Detection', status: '${{ needs.memory-leaks.result }}' }
            ];

            const allPassed = jobs.every(job => job.status === 'success');
            const emoji = allPassed ? '✅' : '❌';

            let summary = `## ${emoji} Performance Regression Check\n\n`;
            jobs.forEach(job => {
              const status = job.status === 'success' ? '✅' : '❌';
              summary += `- ${status} ${job.name}\n`;
            });

            console.log(summary);

            if (context.payload.pull_request && !allPassed) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary + '\n\n⚠️ Performance regression detected. Please review before merging.'
              });
            }
