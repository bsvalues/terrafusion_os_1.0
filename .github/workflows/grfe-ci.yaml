name: grfe-ci

# DISABLED: monorepo-scaffolding/ was quarantined.
# All jobs reference working-directory: monorepo-scaffolding which no longer exists.
# Kept as workflow_dispatch for reference; re-enable when path is restored.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: monorepo-scaffolding
        run: |
          cargo --version
          cargo build --workspace --locked --verbose
      - name: Test
        working-directory: monorepo-scaffolding
        run: cargo test --workspace --locked --verbose
