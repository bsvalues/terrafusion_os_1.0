name: TerraFusion Application CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ai-swarm/**'
      - 'Dockerfile*'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'ai-swarm/**'
      - 'Dockerfile*'
      - 'docker-compose.yml'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/terrafusion-os/backend
  FRONTEND_IMAGE: ghcr.io/terrafusion-os/frontend
  AI_SWARM_IMAGE: ghcr.io/terrafusion-os/ai-swarm

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.BACKEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./Dockerfile.backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests
      run: |
        docker run --rm ${{ env.BACKEND_IMAGE }}:${{ github.sha }} dotnet test --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: backend-test-results
        path: ./backend/test-results.trx

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run tests
      run: npm run test:ci

    - name: Build application
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.FRONTEND_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: ./frontend/dist/

  build-ai-swarm:
    name: Build AI Swarm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-swarm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        black --check .
        isort --check-only .

    - name: Run tests
      run: |
        pip install pytest pytest-cov
        pytest --cov=. --cov-report=xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.AI_SWARM_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./ai-swarm
        file: ./Dockerfile.ai-swarm
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./ai-swarm/coverage.xml
        flags: ai-swarm
        name: ai-swarm-coverage

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-ai-swarm]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-app-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-app-results.sarif'

    - name: Scan Docker images
      run: |
        docker pull ${{ env.BACKEND_IMAGE }}:latest
        docker pull ${{ env.FRONTEND_IMAGE }}:latest
        docker pull ${{ env.AI_SWARM_IMAGE }}:latest

        trivy image --format sarif --output backend-scan.sarif ${{ env.BACKEND_IMAGE }}:latest
        trivy image --format sarif --output frontend-scan.sarif ${{ env.FRONTEND_IMAGE }}:latest
        trivy image --format sarif --output ai-swarm-scan.sarif ${{ env.AI_SWARM_IMAGE }}:latest

    - name: Upload image scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: backend-scan.sarif,frontend-scan.sarif,ai-swarm-scan.sarif

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-ai-swarm, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Get EKS cluster credentials
      run: |
        aws eks update-kubeconfig --region us-east-1 --name terrafusion-staging

    - name: Update Helm dependencies
      working-directory: ./infrastructure/helm
      run: |
        helm dependency update charts/terrafusion

    - name: Deploy applications
      working-directory: ./infrastructure/helm
      run: |
        helm upgrade --install terrafusion-staging ./charts/terrafusion \
          --namespace terrafusion-staging \
          --set backend.image.tag=${{ github.sha }} \
          --set frontend.image.tag=${{ github.sha }} \
          --set aiSwarm.image.tag=${{ github.sha }} \
          --values ./charts/terrafusion/values-staging.yaml \
          --wait \
          --timeout 600s

    - name: Run integration tests
      run: |
        # Wait for deployments to be ready
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-backend -n terrafusion-staging
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-frontend -n terrafusion-staging
        kubectl wait --for=condition=available --timeout=300s deployment/terrafusion-ai-swarm -n terrafusion-staging

        # Run integration tests
        kubectl run integration-tests --image=curlimages/curl --rm -i --restart=Never -- \
          sh -c "curl -f http://terrafusion-backend.terrafusion-staging.svc.cluster.local/api/health && \
                 curl -f http://terrafusion-frontend.terrafusion-staging.svc.cluster.local/health && \
                 curl -f http://terrafusion-ai-swarm.terrafusion-staging.svc.cluster.local/health && \
                 echo 'All services are healthy'"

  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup K6
      run: |
        curl https://github.com/grafana/k6/releases/download/v0.45.0/k6-v0.45.0-linux-amd64.tar.gz -L | tar xvz
        sudo mv k6-v0.45.0-linux-amd64/k6 /usr/local/bin/

    - name: Run performance tests
      run: |
        k6 run --out json=perf-results.json performance-tests/load-test.js

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: perf-results.json

    - name: Check performance thresholds
      run: |
        # Check if response time is within acceptable limits
        RESPONSE_TIME=$(jq '.metrics.http_req_duration.values.avg' perf-results.json)
        if (( $(echo "$RESPONSE_TIME > 1000" | bc -l) )); then
          echo "Performance test failed: Average response time $RESPONSE_TIME ms > 1000ms"
          exit 1
        fi

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, performance-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Kubernetes tools
      uses: azure/setup-kubectl@v3

    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Get EKS cluster credentials
      run: |
        aws eks update-kubeconfig --region us-east-1 --name terrafusion-production

    - name: Deploy to production
      working-directory: ./infrastructure/helm
      run: |
        helm upgrade --install terrafusion-production ./charts/terrafusion \
          --namespace terrafusion-production \
          --set backend.image.tag=${{ github.sha }} \
          --set frontend.image.tag=${{ github.sha }} \
          --set aiSwarm.image.tag=${{ github.sha }} \
          --values ./charts/terrafusion/values-production.yaml \
          --wait \
          --timeout 900s

    - name: Run production health checks
      run: |
        # Backend health check
        kubectl run health-check-backend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-backend.terrafusion-production.svc.cluster.local/health

        # Frontend health check
        kubectl run health-check-frontend --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-frontend.terrafusion-production.svc.cluster.local/health

        # AI Swarm health check
        kubectl run health-check-ai-swarm --image=curlimages/curl --rm -i --restart=Never -- curl -f http://terrafusion-ai-swarm.terrafusion-production.svc.cluster.local/health

    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      if: success()
      with:
        status: success
        text: "TerraFusion production deployment completed successfully"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
