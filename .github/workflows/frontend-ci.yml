name: 🎨 Frontend React CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
    branches: [main, development]
  pull_request:
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
    branches: [main, development]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CI: true

jobs:
  build-and-test:
    name: 🔨 Build & Test React App
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: 📦 Install Root Dependencies
        run: npm ci

      - name: 📦 Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: 🔍 ESLint Analysis
        run: cd frontend && npm run lint

      - name: ✅ TypeScript Type Check
        run: cd frontend && npm run type-check

      - name: 🎨 Code Formatting Check
        run: cd frontend && npm run format:check

      - name: 🧪 Unit Tests
        run: cd frontend && npm run test:coverage

      - name: 🔨 Production Build
        run: cd frontend && npm run build

      - name: 📊 Bundle Analysis
        run: |
          cd frontend
          npm run build:analyze || echo "Bundle analysis not configured"

      - name: 📤 Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: 📤 Upload Build Assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  e2e-tests:
    name: 🎭 End-to-End Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: 🎭 Install Playwright
        run: cd frontend && npx playwright install --with-deps

      - name: 📥 Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: 🎭 Run Playwright Tests
        run: cd frontend && npm run test:e2e

      - name: 📤 Upload Playwright Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  accessibility-tests:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: 📥 Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: ♿ Run Accessibility Tests
        run: |
          cd frontend
          npm run test:a11y || echo "Accessibility tests not configured"

      - name: 🏛️ Government Compliance Check
        run: |
          cd frontend
          npm run test:compliance || echo "Compliance tests not configured"

  performance-audit:
    name: ⚡ Performance Audit
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: 📥 Download Build Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: ⚡ Lighthouse Performance Audit
        run: |
          cd frontend
          npm install -g @lhci/cli
          npm run lhci || echo "Lighthouse CI not configured"

      - name: 📊 Bundle Size Analysis
        run: |
          cd frontend
          echo "📊 Build size analysis:"
          du -sh dist/ || echo "No build directory"
          ls -la dist/ || echo "Build directory empty"

  security-scan:
    name: 🛡️ Frontend Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: 🛡️ npm Audit
        run: |
          cd frontend
          npm audit --audit-level moderate

      - name: 🔍 Dependency Check
        run: |
          cd frontend
          echo "🔍 Checking for known vulnerabilities:"
          npx audit-ci --moderate
