name: core-governance-gates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

env:
  TF_SECURITY_SCAN: '1'
  TF_PERF_BENCH: '1'
  TF_AI_SWARM_MONITOR: '1'
  TF_GOV_COMPLIANCE: '1'
  TF_ENFORCE_BRANCH_PROTECTION: '0'
  TF_REQUIRED_CHECKS: '🔒 SEAL,typecheck-core,phase83-tools'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'os-platform/core/**'
              - 'os-platform/core/fixtures/**'
              - 'tools/registry/**'
              - 'tools/registry/check-generated-js.mjs'
              - 'tsconfig.core.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  phase-lane-server-guard:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI Phase Lane Guard (no core touches on phase lanes)
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci/phase-lane-server-guard.sh
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/ci-diagnostics
          git status --porcelain > .tmp/ci-diagnostics/git-status-porcelain.txt || true
          git diff --name-status > .tmp/ci-diagnostics/git-diff-name-status.txt || true
          git diff --cached --name-status > .tmp/ci-diagnostics/git-diff-cached-name-status.txt || true
          bash scripts/ci/audit-governed-no-write.sh > .tmp/ci-diagnostics/audit-governed-no-write.log 2>&1 || true
      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-diagnostics/
          if-no-files-found: ignore

  phase50-4-governance:
    needs: [changes, phase-lane-server-guard]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit governed surfaces are check-only
        shell: bash
        run: |
          set -euo pipefail
          echo "phase50.4: auditing governed surfaces for ungated write paths"
          surfaces=(.github/workflows/core-governance-gates.yml .husky/pre-push)
          forbidden='--write|prettier[[:space:]].*--write|eslint[[:space:]].*--fix([^a-zA-Z-]|$)|stylelint[[:space:]].*--fix|patch-package|changeset[[:space:]]+version|npm[[:space:]]+version'
          hits="$(rg -n -S -e "$forbidden" "${surfaces[@]}" || true)"
          # allow explicitly gated writes only
          ungated="$(echo "$hits" | grep -Ev 'TF_ALLOW_WRITE=1|--fix-dry-run' || true)"
          if [[ -n "${ungated}" ]]; then
            echo "ERROR: ungated write paths detected in governed surfaces:"
            echo "${ungated}"
            exit 1
          fi
          echo "phase50.4: no-write audit PASS"
      - name: Verify branch protection matches canon (optional enforce)
        shell: bash
        env:
          TF_REPO: ${{ github.repository }}
          TF_PROTECTED_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "phase50.4: verifying branch protection for ${TF_REPO}@${TF_PROTECTED_BRANCH}"
          api="https://api.github.com/repos/${TF_REPO}/branches/${TF_PROTECTED_BRANCH}/protection"
          if ! json="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api" 2>/dev/null)"; then
            if [[ "${TF_ENFORCE_BRANCH_PROTECTION}" == "1" ]]; then
              echo "ERROR: failed to fetch branch protection and enforcement is enabled"
              exit 1
            fi
            echo "phase50.4: branch protection check skipped (insufficient token permissions)"
            exit 0
          fi
          contexts="$(echo "$json" | jq -r '.required_status_checks.contexts[]? // empty')"
          missing=0
          IFS=',' read -ra required <<< "${TF_REQUIRED_CHECKS}"
          for req in "${required[@]}"; do
            req="$(echo "$req" | xargs)"
            [[ -z "$req" ]] && continue
            if ! echo "$contexts" | grep -Fxq "$req"; then
              echo "ERROR: missing required status check: $req"
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "Observed required checks:"
            echo "${contexts:-<none>}" | sed 's/^/  - /'
            exit 1
          fi
          echo "phase50.4: branch protection verification PASS"
      - name: Merge choreography gate (phase branches)
        shell: bash
        env:
          TARGET_BRANCH: main
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          echo "phase50.4: merge choreography branch='${branch}' target='${TARGET_BRANCH}'"
          if [[ "${branch}" != feat/phase* ]]; then
            echo "phase50.4: not a phase lane; skip merge choreography"
            exit 0
          fi
          git fetch -q origin "${TARGET_BRANCH}:${TARGET_BRANCH}" || true
          if git merge-base --is-ancestor "origin/${TARGET_BRANCH}" HEAD; then
            echo "phase50.4: up-to-date with origin/${TARGET_BRANCH}"
          else
            echo "ERROR: branch is not up-to-date with origin/${TARGET_BRANCH}"
            echo "Run: git fetch origin ${TARGET_BRANCH} && git merge --no-ff origin/${TARGET_BRANCH}"
            exit 1
          fi
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/ci-diagnostics
          git status --porcelain > .tmp/ci-diagnostics/git-status-porcelain.txt || true
          git diff --name-status > .tmp/ci-diagnostics/git-diff-name-status.txt || true
          git diff --cached --name-status > .tmp/ci-diagnostics/git-diff-cached-name-status.txt || true
          bash scripts/ci/audit-governed-no-write.sh > .tmp/ci-diagnostics/audit-governed-no-write.log 2>&1 || true
      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-diagnostics/
          if-no-files-found: ignore

  phase50-5-main-invariants:
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit governed surfaces are check-only
        shell: bash
        run: |
          set -euo pipefail
          echo "phase50.5: auditing governed surfaces for ungated write paths"
          surfaces=(.github/workflows/core-governance-gates.yml .husky/pre-push)
          forbidden='--write|prettier[[:space:]].*--write|eslint[[:space:]].*--fix([^a-zA-Z-]|$)|stylelint[[:space:]].*--fix|patch-package|changeset[[:space:]]+version|npm[[:space:]]+version'
          hits="$(rg -n -S -e "$forbidden" "${surfaces[@]}" || true)"
          ungated="$(echo "$hits" | grep -Ev 'TF_ALLOW_WRITE=1|--fix-dry-run' || true)"
          if [[ -n "${ungated}" ]]; then
            echo "ERROR: ungated write paths detected in governed surfaces:"
            echo "${ungated}"
            exit 1
          fi
          echo "phase50.5: no-write audit PASS"
      - name: Verify branch protection matches canon (optional enforce)
        shell: bash
        env:
          TF_REPO: ${{ github.repository }}
          TF_PROTECTED_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "phase50.5: verifying branch protection for ${TF_REPO}@${TF_PROTECTED_BRANCH}"
          api="https://api.github.com/repos/${TF_REPO}/branches/${TF_PROTECTED_BRANCH}/protection"
          if ! json="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "$api" 2>/dev/null)"; then
            if [[ "${TF_ENFORCE_BRANCH_PROTECTION}" == "1" ]]; then
              echo "ERROR: failed to fetch branch protection and enforcement is enabled"
              exit 1
            fi
            echo "phase50.5: branch protection check skipped (insufficient token permissions)"
            exit 0
          fi
          contexts="$(echo "$json" | jq -r '.required_status_checks.contexts[]? // empty')"
          missing=0
          IFS=',' read -ra required <<< "${TF_REQUIRED_CHECKS}"
          for req in "${required[@]}"; do
            req="$(echo "$req" | xargs)"
            [[ -z "$req" ]] && continue
            if ! echo "$contexts" | grep -Fxq "$req"; then
              echo "ERROR: missing required status check: $req"
              missing=1
            fi
          done
          if [[ "$missing" == "1" ]]; then
            echo "Observed required checks:"
            echo "${contexts:-<none>}" | sed 's/^/  - /'
            exit 1
          fi
          echo "phase50.5: branch protection verification PASS"
      - name: Assert clean tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/ci-diagnostics
          git status --porcelain > .tmp/ci-diagnostics/git-status-porcelain.txt || true
          git diff --name-status > .tmp/ci-diagnostics/git-diff-name-status.txt || true
          git diff --cached --name-status > .tmp/ci-diagnostics/git-diff-cached-name-status.txt || true
          bash scripts/ci/audit-governed-no-write.sh > .tmp/ci-diagnostics/audit-governed-no-write.log 2>&1 || true
      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-diagnostics/
          if-no-files-found: ignore

  governed-spine:
    needs: [changes, phase-lane-server-guard, phase50-4-governance]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Governed Spine (type-check + phase83-tools)
        run: pnpm test:governed
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/ci-diagnostics
          git status --porcelain > .tmp/ci-diagnostics/git-status-porcelain.txt || true
          git diff --name-status > .tmp/ci-diagnostics/git-diff-name-status.txt || true
          git diff --cached --name-status > .tmp/ci-diagnostics/git-diff-cached-name-status.txt || true
          bash scripts/ci/audit-governed-no-write.sh > .tmp/ci-diagnostics/audit-governed-no-write.log 2>&1 || true
      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-diagnostics/
          if-no-files-found: ignore

  phase85-tools:
    needs: [changes, phase-lane-server-guard, phase50-4-governance]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Phase 8.5 tool gates
        run: node --test os-platform/core/tests/phase85-tools.test.mjs
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh
      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p .tmp/ci-diagnostics
          git status --porcelain > .tmp/ci-diagnostics/git-status-porcelain.txt || true
          git diff --name-status > .tmp/ci-diagnostics/git-diff-name-status.txt || true
          git diff --cached --name-status > .tmp/ci-diagnostics/git-diff-cached-name-status.txt || true
          bash scripts/ci/audit-governed-no-write.sh > .tmp/ci-diagnostics/audit-governed-no-write.log 2>&1 || true
      - name: Upload failure diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-diagnostics/
          if-no-files-found: ignore

  phase86-toolrunner:
    needs: [changes, phase-lane-server-guard, phase50-4-governance]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
