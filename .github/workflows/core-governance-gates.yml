name: core-governance-gates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

env:
  TF_SECURITY_SCAN: '1'
  TF_PERF_BENCH: '1'
  TF_AI_SWARM_MONITOR: '1'
  TF_GOV_COMPLIANCE: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'os-platform/core/**'
              - 'os-platform/core/fixtures/**'
              - 'tools/registry/**'
              - 'tools/registry/check-generated-js.mjs'
              - 'tsconfig.core.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  phase-lane-server-guard:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI Phase Lane Guard (no core touches on phase lanes)
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash scripts/ci/phase-lane-server-guard.sh
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh

  governed-spine:
    needs: [changes, phase-lane-server-guard]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Governed Spine (type-check + phase83-tools)
        run: pnpm test:governed
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh

  phase85-tools:
    needs: [changes, phase-lane-server-guard]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Phase 8.5 tool gates
        run: node --test os-platform/core/tests/phase85-tools.test.mjs
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh

  phase86-toolrunner:
    needs: [changes, phase-lane-server-guard]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Phase 8.6 ToolRunner gates
        run: node --test os-platform/core/tests/phase86-toolrunner.test.mjs
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh

  check-generated-js:
    needs: [changes, phase-lane-server-guard]
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate core JS
        run: pnpm run build:core-js
      - name: Generated JS matches repo
        run: git diff --exit-code
      - name: Generated JS in sync
        run: pnpm run check:generated
      - name: CI Assert Clean Tree (no mutation)
        run: bash scripts/ci/assert-clean-tree.sh

  no-relevant-changes:
    needs: changes
    if: needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No core governance surface changes — gates skipped."
