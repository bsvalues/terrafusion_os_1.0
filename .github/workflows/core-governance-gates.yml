name: core-governance-gates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'os-platform/core/**'
              - 'os-platform/core/fixtures/**'
              - 'os-platform/core/tests/**'
              - 'tools/registry/**'
              - 'tools/registry/check-generated-js.mjs'
              - 'tools/tdc/cli/**'
              - 'tsconfig.core.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/**'

  governed-spine:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Governed Spine (type-check + phase83-tools)
        run: pnpm test:governed

  phase85-tools:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Phase 8.5 tool gates
        run: node --test os-platform/core/tests/phase85-tools.test.mjs

  phase86-toolrunner:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Phase 8.6 ToolRunner gates
        run: node --test os-platform/core/tests/phase86-toolrunner.test.mjs

  phase10-sdui:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build TDC CLI
        run: |
          cd tools/tdc/cli
          npx tsc --skipLibCheck
      - name: Phase 10 SDUI parse tests
        run: node --test os-platform/core/tests/phase10-sdui.parse.test.mjs
      - name: Phase 10 SDUI policy tests
        run: node --test os-platform/core/tests/phase10-sdui.policy.test.mjs

  phase11-county:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build TDC CLI
        run: |
          cd tools/tdc/cli
          npx tsc --skipLibCheck
      - name: Phase 11 County Pack tests
        run: pnpm run test:phase11-county

  phase12-mcp:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile MCP PostGIS policy
        run: npx tsc os-platform/core/pilot/mcp/postgis-policy.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-policy.js os-platform/core/pilot/mcp/postgis-policy.mjs
      - name: Phase 12A MCP PostGIS tests
        run: pnpm run test:phase12-mcp
  phase12b-routing:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile postgis-routing.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-routing.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-routing.js os-platform/core/pilot/mcp/postgis-routing.mjs
      - name: Phase 12B Multi-County Routing
        run: pnpm run test:phase12b-routing

  phase12c-writes:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile postgis-writes.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-writes.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-writes.js os-platform/core/pilot/mcp/postgis-writes.mjs
      - name: Compile postgis-approval.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-approval.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-approval.js os-platform/core/pilot/mcp/postgis-approval.mjs
      - name: Phase 12C Supervised Writes
        run: pnpm run test:phase12c-writes

  phase12d-e2e:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Compile mock-pg-pool.ts to .mjs
        run: npx tsc os-platform/core/tests/mocks/mock-pg-pool.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/tests/mocks/mock-pg-pool.js os-platform/core/tests/mocks/mock-pg-pool.mjs
      - name: Compile postgis-policy.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-policy.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-policy.js os-platform/core/pilot/mcp/postgis-policy.mjs
      - name: Compile postgis-writes.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-writes.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-writes.js os-platform/core/pilot/mcp/postgis-writes.mjs
      - name: Compile postgis-approval.ts to .mjs
        run: npx tsc os-platform/core/pilot/mcp/postgis-approval.ts --module ESNext --target ES2022 --moduleResolution node --skipLibCheck --types node && mv os-platform/core/pilot/mcp/postgis-approval.js os-platform/core/pilot/mcp/postgis-approval.mjs
      - name: Phase 12D E2E Integration
        run: pnpm run test:phase12d-e2e

  check-generated-js:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate core JS
        run: pnpm run build:core-js
      - name: Generated JS matches repo
        run: git diff --exit-code
      - name: Generated JS in sync
        run: pnpm run check:generated

  no-relevant-changes:
    needs: changes
    if: needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No core governance surface changes — gates skipped."
