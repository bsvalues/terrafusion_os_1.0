name: core-governance-gates

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

env:
  TF_ENFORCE_BRANCH_PROTECTION: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'AGENTS.md'
              - '.governance/**'
              - 'brain/packs/**'
              - 'docs/adr/**'
              - 'docs/agents/**'
              - 'docs/branching/**'
              - 'docs/brain/**'
              - 'docs/governance/**'
              - 'os-platform/core/**'
              - 'os-platform/core/fixtures/**'
              - 'tools/registry/**'
              - 'tools/registry/check-generated-js.mjs'
              - 'tsconfig.core.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/ci/**'
              - '.github/workflows/**'

  governed-spine:
    needs: changes
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    env:
      BRANCH_PROTECTION_READ_TOKEN: ${{ secrets.BRANCH_PROTECTION_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify MAO-002 pilot merge authority
        if: github.event_name == 'pull_request'
        env:
          TF_REPO: ${{ github.repository }}
          TF_PR_NUMBER: ${{ github.event.pull_request.number }}
          TF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TF_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TF_PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          TF_MAO_002_AUTHORITY_JSON: ${{ vars.MAO_002_PILOT_AUTHORITY_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/verify-mao-002-pilot-authority.py
      - name: No core governance changes
        if: needs.changes.outputs.core != 'true'
        run: echo "No core governance surface changes — governed-spine satisfied."
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.core == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.core == 'true'
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        if: needs.changes.outputs.core == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify branch protection matches canon snapshot
        if: needs.changes.outputs.core == 'true' && env.TF_ENFORCE_BRANCH_PROTECTION == '1' && github.event_name == 'push' && github.ref_name == 'main' && env.BRANCH_PROTECTION_READ_TOKEN != ''
        env:
          TF_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ env.BRANCH_PROTECTION_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/verify-branch-protection-against-canon.sh
      - name: Verify AGENTS.md matches protection canon
        if: needs.changes.outputs.core == 'true'
        run: bash scripts/ci/verify-agents-doc-against-protection-canon.sh
      - name: Release lane safety lint (no auto-approve / no direct-to-prod)
        if: needs.changes.outputs.core == 'true'
        run: bash scripts/ci/release-lane-safety-lint.sh
      - name: Governed Spine (type-check + phase83-tools)
        if: needs.changes.outputs.core == 'true'
        run: pnpm test:governed

  phase85-tools:
    needs: changes
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - name: No core governance changes
        if: needs.changes.outputs.core != 'true'
        run: echo "No core governance surface changes — phase85-tools satisfied."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.core == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.core == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.core == 'true'
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        if: needs.changes.outputs.core == 'true'
        run: pnpm install --frozen-lockfile
      - name: Phase 8.5 tool gates
        if: needs.changes.outputs.core == 'true'
        run: node --test os-platform/core/tests/phase85-tools.test.mjs

  phase86-toolrunner:
    needs: changes
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - name: No core governance changes
        if: needs.changes.outputs.core != 'true'
        run: echo "No core governance surface changes — phase86-toolrunner satisfied."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.core == 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.core == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.core == 'true'
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        if: needs.changes.outputs.core == 'true'
        run: pnpm install --frozen-lockfile
      - name: Phase 8.6 ToolRunner gates
        if: needs.changes.outputs.core == 'true'
        run: node --test os-platform/core/tests/phase86-toolrunner.test.mjs

  check-generated-js:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ${{ vars.BENTON_RUNNER == 'true' && fromJSON('["self-hosted", "benton", "linux-x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate core JS
        run: pnpm run build:core-js
      - name: Generated JS matches repo
        run: git diff --exit-code
      - name: Generated JS in sync
        run: pnpm run check:generated

  no-relevant-changes:
    needs: changes
    if: needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No core governance surface changes — gates skipped."
