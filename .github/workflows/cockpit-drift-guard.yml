name: Cockpit Drift Guard

on:
  pull_request:
    paths:
      - 'apps/agent-cockpit/**'
      - 'os-platform/core/pilot/local-agent/**'
      - 'os-platform/core/tests/local-agent-cockpit-*'
      - '.github/workflows/cockpit-drift-guard.yml'
      - 'tools/registry/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  drift-guard:
    name: Cockpit preflight + local-agent suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cockpit preflight
        run: pnpm --filter @terrafusion/agent-cockpit run preflight

      - name: Local agent test suite
        run: pnpm run test:local-agent

      - name: Doc-truth (cockpit references real verbs)
        run: pnpm run proof:local-agent:doc-truth
