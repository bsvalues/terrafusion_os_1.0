name: production
url: https://terrafusionmarket.com

# Protection rules for production environment
protection_rules:
  - type: required_reviewers
    reviewers:
      users: []
      teams: ["security-team", "infrastructure-team"]
  
  - type: wait_timer
    minutes: 30

# Environment variables and secrets available to production
variables:
  ENVIRONMENT: production
  LOG_LEVEL: warn
  MONITORING_ENABLED: true
  SECURITY_SCANNING: true

# Deployment branches - only main branch can deploy to production
deployment_branch_policy:
  protected_branches: true
  custom_branch_policies: true
  custom_branches:
    - main
