name: staging
url: https://staging.terrafusion.gov

# Protection rules for staging environment
protection_rules:
  - type: required_reviewers
    reviewers:
      users: []
      teams: ["infrastructure-team"]
  
  - type: wait_timer
    minutes: 5

# Environment variables and secrets available to staging
variables:
  ENVIRONMENT: staging
  LOG_LEVEL: debug
  MONITORING_ENABLED: true

# Deployment branches
deployment_branch_policy:
  protected_branches: true
  custom_branch_policies: false
