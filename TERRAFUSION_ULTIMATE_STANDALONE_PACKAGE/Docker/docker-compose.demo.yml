services:
  # TerraFusion Demo - Infrastructure Services Only
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres-demo
    restart: unless-stopped
    environment:
      - POSTGRES_DB=terrafusion_demo
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-terrafusion123}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terrafusion-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis-demo
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - terrafusion-network

  # TerraFusion Demo API (nginx placeholder)
  terrafusion-demo:
    image: nginx:alpine
    container_name: terrafusion-demo-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - C:\Users\bsval\terrafusion_os_1.0\TERRAFUSION_ULTIMATE_STANDALONE_PACKAGE\demo-content:/usr/share/nginx/html:ro
    networks:
      - terrafusion-network
    depends_on:
      - postgres
      - redis
    command: ["sh", "-c", "echo 'TerraFusion IDE Demo Running on http://localhost:8080' && nginx -g 'daemon off;'"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  terrafusion-network:
    driver: bridge