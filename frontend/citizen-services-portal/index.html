<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tf-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraFusion OS - Citizen Services Portal</title>
    <meta name="description" content="TerraFusion OS Citizen Services Portal - Comprehensive citizen service request management and delivery system for government operations" />
    <meta name="keywords" content="TerraFusion OS, Citizen Services, Government Portal, Service Requests, Digital Government, Public Services" />
    <meta name="author" content="TerraFusion Development Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://services.terrafusion.gov/" />
    <meta property="og:title" content="TerraFusion OS - Citizen Services Portal" />

    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:description" content="Comprehensive citizen service request management and delivery system" />
    <meta property="twitter:image" content="/tf-social-banner.png" />

    <meta name="robots" content="noindex, nofollow" />
    <meta name="government" content="true" />
