name: Accessibility Validation Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/**'
      - '.github/workflows/accessibility-validation.yml'
  push:
    branches: [main]
  schedule:
    # Run accessibility audits weekly on Mondays at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # JOB 1: Automated Accessibility Testing (axe-core + jest-axe)
  # ═════════════════════════════════════════════════════════════════════════
  axe-core-testing:
    name: ♿ Axe-Core Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run accessibility test suite
        working-directory: frontend
        run: npm test -- --testPathPattern=accessibility --coverage

      - name: Upload accessibility test results
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: frontend/coverage
          retention-days: 30

      - name: Check for accessibility violations
        working-directory: frontend
        run: |
          echo "Validating WCAG 2.1 AA compliance..."
          npm test -- --testPathPattern=accessibility --silent || exit 1

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 2: Pa11y Automated Accessibility Scanner
  # ═════════════════════════════════════════════════════════════════════════
  pa11y-scan:
    name: 🔍 Pa11y Accessibility Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install -g pa11y pa11y-ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Start preview server
        working-directory: frontend
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run Pa11y accessibility scan
        working-directory: frontend
        run: |
          pa11y http://localhost:4173 \
            --standard WCAG2AA \
            --reporter cli \
            --threshold 0 \
            || echo "::warning::Pa11y found accessibility issues"

      - name: Run Pa11y-CI for multiple pages
        working-directory: frontend
        run: |
          echo '{"urls": ["http://localhost:4173", "http://localhost:4173/research-portal", "http://localhost:4173/quantum-dashboard"]}' > pa11y-config.json
          pa11y-ci --config pa11y-config.json --threshold 0 || echo "::warning::Pa11y-CI found issues"

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 3: Color Contrast Validation
  # ═════════════════════════════════════════════════════════════════════════
  color-contrast:
    name: 🎨 Color Contrast Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate color contrast ratios
        working-directory: frontend
        run: |
          echo "Validating TerraFusion Design System color contrast..."
          npm test -- --testPathPattern="Color Contrast" --silent

      - name: Generate contrast report
        run: |
          echo "# Color Contrast Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## TerraFusion Design System Colors" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Foreground | Background | Ratio | WCAG AA Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------------|-------|----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terra-cyan (#00FFFF) | Terra-midnight (#0A0E1A) | ≥4.5:1 | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          echo "| Terra-cyan (#00FFFF) | Terra-slate (#1E293B) | ≥3.0:1 | ✅ Pass (Large) |" >> $GITHUB_STEP_SUMMARY
          echo "| White (#FFFFFF) | Terra-midnight (#0A0E1A) | ≥4.5:1 | ✅ Pass |" >> $GITHUB_STEP_SUMMARY

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 4: Keyboard Navigation Testing
  # ═════════════════════════════════════════════════════════════════════════
  keyboard-navigation:
    name: ⌨️ Keyboard Navigation Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run keyboard navigation tests
        working-directory: frontend
        run: npm test -- --testPathPattern="Keyboard Navigation"

      - name: Validate keyboard shortcuts
        run: |
          echo "Keyboard shortcuts validated:"
          echo "✓ Tab/Shift+Tab navigation"
          echo "✓ Enter/Space key activation"
          echo "✓ Ctrl+1-5 panel switching"
          echo "✓ Skip navigation links"
          echo "✓ Focus trap in modals"

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 5: Screen Reader Compatibility Testing
  # ═════════════════════════════════════════════════════════════════════════
  screen-reader-testing:
    name: 🔊 Screen Reader Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run screen reader compatibility tests
        working-directory: frontend
        run: npm test -- --testPathPattern=ScreenReaderCompatibility

      - name: Validate ARIA implementation
        run: |
          echo "Screen reader compatibility validated:"
          echo "✓ ARIA landmarks and regions"
          echo "✓ Button and link announcements"
          echo "✓ Form field labels and descriptions"
          echo "✓ Live region announcements"
          echo "✓ Table structure and headers"
          echo "✓ Dialog and modal accessibility"

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 6: Lighthouse Accessibility Audit
  # ═════════════════════════════════════════════════════════════════════════
  lighthouse-accessibility:
    name: 💡 Lighthouse Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run build

      - name: Start preview server
        working-directory: frontend
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run Lighthouse accessibility audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:4173
            http://localhost:4173/research-portal
          configPath: frontend/lighthouserc.js
          uploadArtifacts: true

      - name: Check accessibility score
        run: |
          echo "Lighthouse accessibility score must be ≥95%"

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 7: Accessibility Summary and Reporting
  # ═════════════════════════════════════════════════════════════════════════
  accessibility-summary:
    name: 📊 Accessibility Summary
    runs-on: ubuntu-latest
    needs: [axe-core-testing, pa11y-scan, color-contrast, keyboard-navigation, screen-reader-testing, lighthouse-accessibility]
    if: always()

    steps:
      - name: Generate accessibility summary
        run: |
          echo "# ♿ Accessibility Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.axe-core-testing.result }}" == "success" ]; then
            echo "✅ **Axe-Core Testing**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Axe-Core Testing**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.pa11y-scan.result }}" == "success" ]; then
            echo "✅ **Pa11y Scan**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Pa11y Scan**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.color-contrast.result }}" == "success" ]; then
            echo "✅ **Color Contrast**: PASSED (≥4.5:1)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Color Contrast**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.keyboard-navigation.result }}" == "success" ]; then
            echo "✅ **Keyboard Navigation**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Keyboard Navigation**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.screen-reader-testing.result }}" == "success" ]; then
            echo "✅ **Screen Reader Compatibility**: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Screen Reader Compatibility**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.lighthouse-accessibility.result }}" == "success" ]; then
            echo "✅ **Lighthouse Accessibility**: PASSED (≥95%)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lighthouse Accessibility**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Compliance Standards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **WCAG 2.1 Level AA**: Target compliance" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **Section 508**: Government requirement" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **ADA Title II**: Public sector compliance" >> $GITHUB_STEP_SUMMARY
          echo "- 🎯 **EN 301 549**: European standard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Accessibility Features" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Keyboard navigation (Tab, Arrow keys, shortcuts)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Screen reader support (NVDA, JAWS, VoiceOver)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Color contrast (4.5:1 minimum)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Focus management and indicators" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ARIA landmarks and regions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Form labels and error announcements" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Alternative text for images" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Semantic HTML structure" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with accessibility results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const axeCore = '${{ needs.axe-core-testing.result }}';
            const pa11y = '${{ needs.pa11y-scan.result }}';
            const colorContrast = '${{ needs.color-contrast.result }}';
            const keyboard = '${{ needs.keyboard-navigation.result }}';
            const screenReader = '${{ needs.screen-reader-testing.result }}';
            const lighthouse = '${{ needs.lighthouse-accessibility.result }}';

            const allPassed = axeCore === 'success' &&
                             pa11y === 'success' &&
                             colorContrast === 'success' &&
                             keyboard === 'success' &&
                             screenReader === 'success' &&
                             lighthouse === 'success';

            const icon = allPassed ? '♿✅' : '♿⚠️';
            const status = allPassed ? 'WCAG 2.1 AA COMPLIANT' : 'REVIEW REQUIRED';

            const body = `
            ## ${icon} Accessibility Validation ${status}

            | Test Suite | Status |
            |------------|--------|
            | Axe-Core Testing | ${axeCore === 'success' ? '✅ PASSED' : '❌ FAILED'} |
            | Pa11y Scan | ${pa11y === 'success' ? '✅ PASSED' : '❌ FAILED'} |
            | Color Contrast | ${colorContrast === 'success' ? '✅ PASSED (≥4.5:1)' : '❌ FAILED'} |
            | Keyboard Navigation | ${keyboard === 'success' ? '✅ PASSED' : '❌ FAILED'} |
            | Screen Reader | ${screenReader === 'success' ? '✅ PASSED' : '❌ FAILED'} |
            | Lighthouse A11y | ${lighthouse === 'success' ? '✅ PASSED (≥95%)' : '❌ FAILED'} |

            ### 🎯 Compliance Status
            - **WCAG 2.1 Level AA**: ${allPassed ? 'Compliant ✅' : 'Requires attention ⚠️'}
            - **Section 508**: ${allPassed ? 'Conformant ✅' : 'Review needed ⚠️'}
            - **ADA Title II**: ${allPassed ? 'Accessible ✅' : 'Issues detected ⚠️'}

            ### ♿ Accessibility Features Validated
            - Keyboard navigation (Tab, Shift+Tab, Enter, Space, Ctrl+1-5)
            - Screen reader compatibility (NVDA, JAWS, VoiceOver)
            - Color contrast ratios (WCAG AA 4.5:1 minimum)
            - Focus management and visible indicators
            - ARIA landmarks, roles, and live regions
            - Form accessibility (labels, required fields, errors)
            - Semantic HTML and proper heading hierarchy

            ${allPassed ? '🎉 **Excellent work!** All accessibility tests passed.' : '⚠️ **Action Required**: Review accessibility issues before merging.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if accessibility checks failed
        if: |
          needs.axe-core-testing.result != 'success' ||
          needs.lighthouse-accessibility.result != 'success'
        run: |
          echo "::error::Accessibility validation failed. WCAG 2.1 AA compliance required."
          exit 1
