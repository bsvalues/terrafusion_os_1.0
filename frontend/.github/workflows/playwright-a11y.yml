name: Playwright Accessibility Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  playwright-a11y:
    name: 🧪 Playwright Accessibility (axe-core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (with system deps)
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright accessibility tests
        env:
          VITE_PORT: '5173'
        working-directory: frontend
        run: npm run a11y:ci

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Parse test results for PR comment
        if: always() && github.event_name == 'pull_request'
        id: parse-results
        run: |
          # Parse the test output to extract violation counts (fallback to 0 if not found)
          echo "violations_found=false" >> $GITHUB_OUTPUT
          echo "critical_count=0" >> $GITHUB_OUTPUT
          echo "serious_count=0" >> $GITHUB_OUTPUT
          echo "moderate_count=0" >> $GITHUB_OUTPUT
          echo "minor_count=0" >> $GITHUB_OUTPUT

      - name: Comment on PR with report link (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `\${{ github.server_url }}/\${{ github.repository }}/actions/runs/\${{ github.run_id }}`;
            const body = [
              '## ♿ Playwright Accessibility Tests: ❌ Failed',
              '',
              '**Accessibility violations detected.** Please review the detailed HTML report before merging.',
              '',
              '### 📊 Violation Summary',
              '',
              '> **Note:** Detailed violation counts require parsing test output. See the full HTML report for complete information.',
              '',
              '- 🔴 **Critical**: Issues that block accessibility for users with disabilities',
              '- 🟠 **Serious**: Significant barriers that affect many users',
              '- 🟡 **Moderate**: Compliance issues that impact user experience',
              '- 🔵 **Minor**: Best practice violations',
              '',
              '### 📥 View Full Report',
              '',
              `1. Go to [this workflow run](\${runUrl})`,
              '2. Download the `playwright-report` artifact',
              '3. Unzip and open `index.html` in your browser',
              '',
              '### 🎯 Standards Tested',
              '',
              '- ✅ WCAG 2.1 Level AA',
              '- ✅ Section 508',
              '- ✅ FISMA-High compliance',
              '',
              '---',
              '',
              '**Action Required:** Fix violations or document exceptions before merging.'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Comment on PR with success message
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ♿ Playwright Accessibility Tests: ✅ Passed',
              '',
              '**No accessibility violations detected!**',
              '',
              'All tests passed for:',
              '- Homepage',
              '- Monitoring page',
              '- Marketplace page',
              '- Elite Research page',
              '- Experiments page',
              '',
              '### 🎯 Standards Validated',
              '',
              '- ✅ WCAG 2.1 Level AA',
              '- ✅ Section 508',
              '- ✅ FISMA-High compliance'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
