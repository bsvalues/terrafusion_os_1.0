# TerraFusion Government OS - Nginx Configuration
# !! This is a server{} block — it gets COPIED to /etc/nginx/conf.d/default.conf
# !! Do NOT copy this to /etc/nginx/nginx.conf (that needs the http{} wrapper)
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Government OS Demo Headers
    add_header X-TerraFusion-Service "Government OS Frontend";
    add_header X-TerraFusion-Version "1.0.0";
    add_header X-TerraFusion-County "Benton County";
    add_header X-TerraFusion-Properties "89247";
    add_header X-TerraFusion-AI-Agents "1008";
    add_header X-TerraFusion-Performance "949x faster";

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # Compression
    gzip on;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        
        # CORS for demo
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
    }

    # API proxy prevention (handled by main nginx)
    location /api {
        return 502 "API should be handled by main proxy";
    }

    # Demo metadata endpoint
    location /demo-meta {
        return 200 '{"service":"TerraFusion Government OS","version":"1.0.0","county":"Benton County","properties":89247,"ai_agents":1008,"performance":"949x faster","status":"operational"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin "*";
    }
}