    <style>
      /* Transportation Loading Screen */
      #transportation-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }
      
      .transport-loader {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      
      .transport-icon {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        animation: transport-pulse 2s infinite;
      }
      
      @keyframes transport-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      
      .loading-text {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }
      
      .loading-subtitle {
        font-size: 1rem;
        opacity: 0.8;
        margin-bottom: 2rem;
      }
      
      .transport-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .loading-info {
        position: absolute;
        bottom: 2rem;
        text-align: center;
        font-size: 0.875rem;
        opacity: 0.7;
      }
      
      .loading-info div {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Transportation Loading Screen -->
    <div id="transportation-loading">
      <div class="transport-loader">
        <div class="transport-icon">🚦</div>
        <div>
          <div class="loading-text">TerraFusion Smart Transportation</div>
          <div class="loading-subtitle">Initializing Intelligent Transport Systems</div>
        </div>
      </div>
      
      <div class="transport-spinner"></div>
      
      <div class="loading-info">
        <div><strong>Benton County Transportation Authority</strong></div>
        <div>Director: Michael Torres • (509) 735-3300</div>
        <div>transportation@co.benton.wa.us</div>
        <div style="margin-top: 1rem;">Coverage: 1,703.4 sq mi • 142 Smart Signals • 28 Transit Routes</div>
      </div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading screen when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('transportation-loading');
          if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
              loadingScreen.style.display = 'none';
            }, 500);
          }
        }, 2000); // Show loading for 2 seconds minimum
      });
    </script>
  </body>
</html>
