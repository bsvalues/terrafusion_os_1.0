version: '3.8'

services:
  consul:
    image: consul:1.17.0
    container_name: terrafusion-consul
    hostname: consul
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
      - ./consul/config:/consul/config:ro
    environment:
      - CONSUL_BIND_INTERFACE=eth0
      - CONSUL_CLIENT_INTERFACE=eth0
    command: >
      consul agent
      -server
      -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -bind='{{ GetInterfaceIP "eth0" }}'
      -data-dir=/consul/data
      -config-dir=/consul/config
      -datacenter=terrafusion-dc1
      -domain=terrafusion.local
      -log-level=INFO
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - terrafusion-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
      - "terrafusion.service=consul"
      - "terrafusion.environment=production"

volumes:
  consul_data:
    driver: local

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16