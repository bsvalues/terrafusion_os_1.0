# 🏆 BENTON COUNTY OPENAI OSS INTEGRATION - PRODUCTION CONFIGURATION
# Championship-level configuration for production deployment

# System Information
system:
  name: "Benton County OpenAI OSS Integration"
  version: "1.0.0"
  environment: "production"
  deployment_date: "2025-01-08"
  log_level: "INFO"
  timezone: "America/Los_Angeles"

# OpenAI OSS Models Configuration
openai_oss:
  # API Configuration
  api_base: "https://api.openai.com/v1/oss"
  api_version: "2024-01-01"
  timeout: 30
  max_retries: 3
  retry_delay: 1.0
  
  # Model Specifications
  models:
    gpt-oss-20b:
      display_name: "GPT-OSS 20B"
      parameters: "20 billion"
      context_window: 32000
      max_tokens: 4000
      temperature: 0.7
      top_p: 0.9
      specialties:
        - "property_valuation_analysis"
        - "market_trend_analysis"
        - "complex_calculations"
        - "regulatory_compliance_checks"
        - "financial_modeling"
        - "roi_calculations"
      cost_per_token: 0.0
      rate_limit: 1000  # requests per minute
      concurrent_requests: 10
      
    gpt-oss-120b:
      display_name: "GPT-OSS 120B"
      parameters: "120 billion"
      context_window: 128000
      max_tokens: 8000
      temperature: 0.5
      top_p: 0.95
      specialties:
        - "advanced_property_analytics"
        - "multi_variable_analysis"
        - "predictive_modeling"
        - "comprehensive_reporting"
        - "legal_document_analysis"
        - "complex_market_research"
        - "investment_strategy_analysis"
      cost_per_token: 0.0
      rate_limit: 500   # requests per minute
      concurrent_requests: 5

# Local Ollama Configuration
ollama:
  host: "localhost"
  port: 11434
  base_url: "http://localhost:11434"
  timeout: 60
  max_retries: 3
  
  # Available models
  models:
    llama2:
      name: "llama2:7b"
      display_name: "Llama 2 7B"
      specialties: ["general_queries", "sensitive_data", "local_processing"]
      context_window: 4096
      
    codellama:
      name: "codellama:13b"
      display_name: "Code Llama 13B"
      specialties: ["code_analysis", "technical_documentation", "calculations"]
      context_window: 8192
      
    mistral:
      name: "mistral:7b"
      display_name: "Mistral 7B"
      specialties: ["analysis", "reasoning", "classification"]
      context_window: 8192
  
  # Auto-download missing models
  auto_download: true
  download_timeout: 1800  # 30 minutes

# Hybrid Routing Configuration
routing:
  # Default routing strategy
  default_strategy: "intelligent"
  
  # Sensitivity Detection
  sensitivity_detection:
    enabled: true
    confidence_threshold: 0.8
    
    # Data classification patterns
    patterns:
      red_zone:  # Highly sensitive - local only
        - pattern: '\b\d{3}-?\d{2}-?\d{4}\b'
          type: "ssn"
          description: "Social Security Number"
        - pattern: '\b\d{2}-?\d{7}\b'
          type: "ein"
          description: "Employer ID Number"
        - pattern: '\b[A-Z0-9]{8,15}\b'
          type: "parcel_id"
          description: "Property Parcel ID"
        - pattern: '\d+\s+[A-Za-z\s]+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln|Drive|Dr|Court|Ct|Circle|Cir|Plaza|Pl)\b'
          type: "street_address"
          description: "Street Address"
        - keywords: ["owner", "proprietor", "taxpayer", "mortgage", "lien", "foreclosure"]
          type: "sensitive_keywords"
          
      yellow_zone:  # Semi-sensitive - anonymize first
        - pattern: '\b\d{5}(?:-\d{4})?\b'
          type: "zip_code"
          description: "ZIP Code"
        - pattern: '\$[\d,]+(?:\.\d{2})?'
          type: "currency"
          description: "Currency Amount"
        - keywords: ["property", "assessment", "valuation", "comparable"]
          type: "property_keywords"
          
      green_zone:  # Safe for cloud
        - keywords: ["calculate", "formula", "percentage", "roi", "cap rate"]
          type: "calculation_keywords"
        - keywords: ["market", "trend", "analysis", "forecast"]
          type: "analysis_keywords"
  
  # Model Selection Logic
  model_selection:
    # Task-based routing
    task_routing:
      simple_calculations:
        primary: "gpt-oss-20b"
        fallback: "ollama_local"
        criteria: ["math", "percentage", "ratio", "basic_formula"]
        
      complex_analysis:
        primary: "gpt-oss-120b"
        fallback: "gpt-oss-20b"
        criteria: ["comprehensive", "detailed", "multi-factor", "advanced"]
        
      property_valuation:
        primary: "gpt-oss-120b"
        fallback: "ollama_local"
        criteria: ["valuation", "assessment", "appraisal", "market_value"]
        
      financial_modeling:
        primary: "gpt-oss-120b"
        fallback: "gpt-oss-20b"
        criteria: ["roi", "npv", "irr", "cash_flow", "investment"]
        
      sensitive_data:
        primary: "ollama_local"
        fallback: null
        criteria: ["ssn", "ein", "parcel_id", "owner_name", "tax_record"]
        
      general_queries:
        primary: "gpt-oss-20b"
        fallback: "ollama_local"
        criteria: ["general", "definition", "explanation", "help"]
    
    # Complexity scoring
    complexity_scoring:
      simple: 1-3
      moderate: 4-6
      complex: 7-10
      
      indicators:
        simple: ["what", "how much", "calculate", "formula"]
        moderate: ["analyze", "compare", "evaluate", "assess"]
        complex: ["comprehensive", "detailed", "multi-variable", "predictive"]
  
  # Anonymization Configuration
  anonymization:
    enabled: true
    preserve_context: true
    
    methods:
      addresses:
        strategy: "zip_code_only"
        example: "123 Main St, Kennewick, WA 99336" → "Property in 99336 area"
        
      names:
        strategy: "role_replacement"
        example: "John Smith" → "[PROPERTY_OWNER]"
        
      financial_amounts:
        strategy: "rounded_ranges"
        example: "$234,567" → "~$235,000"
        rounding: 1000  # Round to nearest thousand
        
      identifiers:
        strategy: "hashed_values"
        algorithm: "sha256"
        truncate: 10  # First 10 characters of hash
        
      dates:
        strategy: "year_month_only"
        example: "2023-08-15" → "2023-08"

# Performance Configuration
performance:
  # Caching
  caching:
    enabled: true
    backend: "redis"
    ttl: 3600  # 1 hour default
    max_size: 10000  # Maximum cached items
    
    # Cache policies by query type
    policies:
      calculations: 7200    # 2 hours
      definitions: 86400    # 24 hours
      market_data: 1800     # 30 minutes
      property_data: 900    # 15 minutes
  
  # Rate Limiting
  rate_limiting:
    enabled: true
    global_limit: 1000    # requests per minute
    per_user_limit: 100   # requests per minute per user
    burst_size: 50        # burst allowance
    
    # Model-specific limits
    model_limits:
      gpt-oss-20b: 1000
      gpt-oss-120b: 500
      ollama_local: 200
  
  # Connection Pooling
  connection_pooling:
    max_connections: 100
    min_connections: 10
    connection_timeout: 30
    idle_timeout: 300
  
  # Monitoring
  monitoring:
    metrics_enabled: true
    prometheus_port: 9091
    health_check_interval: 30
    performance_logging: true

# Security Configuration
security:
  # Authentication
  authentication:
    enabled: true
    method: "jwt"
    secret_key_env: "JWT_SECRET"
    token_expiry: 3600  # 1 hour
    refresh_token_expiry: 604800  # 1 week
    
  # Authorization
  authorization:
    enabled: true
    levels:
      read_only:
        permissions: ["query", "health_check"]
        rate_limit: 50
        
      standard_user:
        permissions: ["query", "stats", "health_check"]
        rate_limit: 100
        
      power_user:
        permissions: ["query", "stats", "health_check", "admin_stats"]
        rate_limit: 500
        
      administrator:
        permissions: ["*"]
        rate_limit: 1000
  
  # Encryption
  encryption:
    at_rest: true
    in_transit: true
    algorithm: "AES-256-GCM"
    key_rotation_days: 90
  
  # Data Protection
  data_protection:
    pii_detection: true
    data_masking: true
    audit_logging: true
    retention_policy: 2555  # 7 years in days
    
  # Access Control
  access_control:
    cors_enabled: true
    allowed_origins: ["https://bentoncounty.gov", "https://assessor.bentoncounty.gov"]
    allowed_methods: ["GET", "POST"]
    allowed_headers: ["Authorization", "Content-Type"]

# Database Configuration
database:
  # PostgreSQL
  postgresql:
    host: "localhost"
    port: 5432
    database: "benton_county_ai"
    username: "benton_ai"
    password_env: "DATABASE_PASSWORD"
    pool_size: 20
    max_overflow: 30
    pool_timeout: 30
    pool_recycle: 3600
    
    # Connection parameters
    connect_args:
      sslmode: "prefer"
      connect_timeout: 10
      application_name: "openai_oss_integration"
  
  # Redis
  redis:
    host: "localhost"
    port: 6379
    db: 1
    password_env: "REDIS_PASSWORD"
    pool_size: 10
    socket_timeout: 5
    socket_connect_timeout: 5
    retry_on_timeout: true
    health_check_interval: 30

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging
  file:
    enabled: true
    path: "/var/log/benton-county-ai/openai_oss_integration.log"
    max_size: "100MB"
    backup_count: 10
    rotation: "daily"
  
  # Structured logging
  structured:
    enabled: true
    format: "json"
    include_fields: ["timestamp", "level", "logger", "message", "user_id", "query_id"]
  
  # Sensitive data handling
  sensitive_data:
    mask_enabled: true
    mask_patterns: ["ssn", "ein", "credit_card"]
    mask_character: "*"

# Monitoring and Alerting
monitoring:
  # Prometheus
  prometheus:
    enabled: true
    port: 9091
    path: "/metrics"
    
  # Health checks
  health_checks:
    enabled: true
    interval: 30  # seconds
    timeout: 10
    
    endpoints:
      database: "SELECT 1"
      redis: "PING"
      ollama: "GET /api/tags"
      openai_oss: "GET /health"
  
  # Alerts
  alerts:
    enabled: true
    
    # Email alerts
    email:
      enabled: true
      smtp_server: "smtp.bentoncounty.gov"
      smtp_port: 587
      username_env: "SMTP_USERNAME"
      password_env: "SMTP_PASSWORD"
      recipients:
        - "ai-team@bentoncounty.gov"
        - "it-alerts@bentoncounty.gov"
      
    # Slack alerts
    slack:
      enabled: false
      webhook_url_env: "SLACK_WEBHOOK_URL"
      channel: "#ai-alerts"
    
    # Alert thresholds
    thresholds:
      error_rate: 0.05        # 5% error rate
      response_time: 5000     # 5 seconds
      queue_size: 100         # 100 pending requests
      cpu_usage: 80           # 80% CPU usage
      memory_usage: 85        # 85% memory usage
      disk_usage: 90          # 90% disk usage

# Backup and Recovery
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  location: "/var/backups/benton-county-ai/openai-oss"
  
  # What to backup
  include:
    - "configuration"
    - "logs"
    - "cache_metadata"
    - "user_data"
    - "statistics"
  
  # Compression
  compression:
    enabled: true
    algorithm: "gzip"
    level: 6
  
  # Verification
  verification:
    enabled: true
    test_restore: true
    notification: true

# Disaster Recovery
disaster_recovery:
  rpo: 60    # Recovery Point Objective (minutes)
  rto: 30    # Recovery Time Objective (minutes)
  
  # Failover configuration
  failover:
    enabled: true
    automatic: true
    health_check_failures: 3
    
  # Recovery testing
  testing:
    enabled: true
    schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
    notification: true
    
  # Documentation
  runbook: "/opt/benton-county-ai/docs/disaster_recovery_runbook.md"

# Development and Testing
development:
  debug_mode: false
  test_mode: false
  mock_responses: false
  
  # Testing configuration
  testing:
    unit_tests: true
    integration_tests: true
    performance_tests: true
    security_tests: true
    
    # Test data
    test_data_path: "/opt/benton-county-ai/test_data"
    synthetic_data: true

# Compliance and Governance
compliance:
  # Regulatory compliance
  regulations:
    gdpr: true
    ccpa: true
    hipaa: false  # Not applicable for property data
    sox: false    # Not applicable
  
  # Data governance
  data_governance:
    data_classification: true
    data_lineage: true
    data_quality: true
    
  # Audit requirements
  audit:
    enabled: true
    log_all_queries: true
    log_all_responses: false  # Too much storage
    retention_period: 2555    # 7 years
    immutable_storage: true
    
  # Privacy
  privacy:
    anonymization_required: true
    consent_tracking: false   # Not applicable for government data
    right_to_erasure: false   # Not applicable for government records

# Feature Flags
features:
  # Experimental features
  experimental:
    advanced_caching: true
    predictive_routing: false
    auto_scaling: false
    
  # Beta features
  beta:
    enhanced_anonymization: true
    multi_model_ensemble: false
    real_time_learning: false
    
  # Production features
  production:
    hybrid_routing: true
    openai_oss_integration: true
    security_scanning: true
    performance_monitoring: true

# Integration Points
integrations:
  # Championship system integration
  championship_system:
    enabled: true
    base_url: "http://localhost:8000"
    api_key_env: "CHAMPIONSHIP_API_KEY"
    
  # External systems
  external_systems:
    pacs:
      enabled: false
      base_url: ""
      
    ciaps:
      enabled: false
      base_url: ""
      
    arcgis:
      enabled: false
      base_url: ""

# Maintenance
maintenance:
  # Scheduled maintenance
  windows:
    - day: "Sunday"
      start: "02:00"
      duration: 2  # hours
      operations: ["backup", "log_rotation", "cache_cleanup"]
      
    - day: "Wednesday"
      start: "01:00"
      duration: 1  # hour
      operations: ["health_checks", "performance_analysis"]
  
  # Auto-maintenance
  auto_maintenance:
    enabled: true
    log_cleanup: true
    cache_optimization: true
    performance_tuning: true
    
  # Update policy
  updates:
    automatic_security: true
    automatic_patches: false
    manual_features: true
    notification_required: true

# Documentation
documentation:
  api_docs: "/opt/benton-county-ai/docs/api"
  user_guide: "/opt/benton-county-ai/docs/user_guide"
  admin_guide: "/opt/benton-county-ai/docs/admin_guide"
  troubleshooting: "/opt/benton-county-ai/docs/troubleshooting"
  
  # Auto-generated docs
  auto_generation:
    enabled: true
    include_examples: true
    include_schemas: true
    update_frequency: "daily"
