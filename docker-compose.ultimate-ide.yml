version: '3.8'

services:
  # Ultimate IDE Gateway (New)
  terrafusion-ide-gateway:
    build:
      context: ./backend/TerraFusion.IDE.Gateway
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:7000
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__TerraFusionAPI=http://terrafusion-api:5000
      - Services__RustDevEngine=http://rust-dev-engine:8080
      - Services__AISwarm=http://ai-swarm:3000
      - Services__OpsTools=http://ops-tools:9000
    depends_on:
      - terrafusion-api
      - rust-dev-engine
      - ai-swarm
      - ops-tools
    networks:
      - terrafusion-network

  # Enhanced Frontend with Monaco IDE
  terrafusion-ide-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ide
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://terrafusion-ide-gateway:7000
      - VITE_WEBSOCKET_URL=ws://terrafusion-ide-gateway:7000/ws
      - VITE_AI_SWARM_URL=http://ai-swarm:3000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - terrafusion-ide-gateway
    networks:
      - terrafusion-network

  # Existing TerraFusion API (Enhanced)
  terrafusion-api:
    build:
      context: ./backend
      dockerfile: TerraFusion.API/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-enhanced;Port=5432;Database=terrafusion_ide;Username=${DB_USER:-terrafusion};Password=${DB_PASSWORD:-terrafusion123}
      - Redis__ConnectionString=redis-enhanced:6379
    depends_on:
      - postgres-enhanced
      - redis-enhanced
    networks:
      - terrafusion-network

  # Rust Development Engine (From TerraFusionDevelopment)
  rust-dev-engine:
    build:
      context: ./TerraFusionDevelopment
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://terrafusion:terrafusion123@postgres-enhanced:5432/terrafusion_ide
      - REDIS_URL=redis://redis-enhanced:6379
      - SERVER_PORT=8080
    depends_on:
      - postgres-enhanced
      - redis-enhanced
    networks:
      - terrafusion-network

  # AI Swarm Orchestration
  ai-swarm:
    build:
      context: ./ai-swarm-supreme-commander
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://terrafusion:terrafusion123@postgres-enhanced:5432/terrafusion_ide
      - REDIS_URL=redis://redis-enhanced:6379
      - AI_AGENTS_COUNT=1008
      - SUPREME_COMMANDER=active
    depends_on:
      - postgres-enhanced
      - redis-enhanced
    networks:
      - terrafusion-network

  # Ops Tools Suite Integration
  ops-tools:
    build:
      context: ./terrafusion-ops-tools
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=development
      - TOOLS_COUNT=45
      - MONITORING_ENABLED=true
      - COMPLIANCE_VALIDATION=true
    volumes:
      - ./terrafusion-ops-tools:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - terrafusion-network

  # Enhanced PostgreSQL Database
  postgres-enhanced:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terrafusion_ide
      - POSTGRES_USER=${DB_USER:-terrafusion}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-terrafusion123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_ide_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d
      - ./database/ide-schema.sql:/docker-entrypoint-initdb.d/001-ide-schema.sql
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-terrafusion} -d terrafusion_ide"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Real-time Features
  redis-enhanced:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_ide_data:/data
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./terrafusion-ops-tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./terrafusion-ops-tools/monitoring/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - terrafusion-network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=terrafusion123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./terrafusion-ops-tools/monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./terrafusion-ops-tools/monitoring/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - terrafusion-network

  # Elasticsearch for Advanced Search
  elasticsearch:
    image: elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - terrafusion-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Load Balancer & SSL Termination
  nginx-ide:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ide.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - terrafusion-ide-frontend
      - terrafusion-ide-gateway
    networks:
      - terrafusion-network

  # Code Quality & Security Scanner
  sonarqube:
    image: sonarqube:community
    ports:
      - "9001:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://postgres-enhanced:5432/sonarqube
      - SONAR_JDBC_USERNAME=${DB_USER:-terrafusion}
      - SONAR_JDBC_PASSWORD=${DB_PASSWORD:-terrafusion123}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - postgres-enhanced
    networks:
      - terrafusion-network

volumes:
  postgres_ide_data:
    driver: local
  redis_ide_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16