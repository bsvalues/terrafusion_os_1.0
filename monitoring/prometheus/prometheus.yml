# TerraFusion OS 1.0 - Prometheus Configuration
# Government-grade monitoring for comprehensive system observability

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'terrafusion-government'
    environment: 'production'
    classification: 'government'

# Government compliance alerting rules
rule_files:
  - "/etc/prometheus/rules/terrafusion-alerts.yml"
  - "/etc/prometheus/rules/government-compliance.yml"
  - "/etc/prometheus/rules/security-monitoring.yml"

# Alert manager configuration for government notifications
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v1

# Scrape configurations for all TerraFusion components
scrape_configs:
  # TerraFusion API Gateway - Primary application metrics
  - job_name: 'terrafusion-api'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}', 'localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    basic_auth:
      username: 'prometheus'
      password: 'government-monitoring-secure'
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'terrafusion-api:${TF_API_PORT:-5046}'
      - target_label: service
        replacement: 'terrafusion-api'

  # AI Swarm Controller - 50,000 agent monitoring
  - job_name: 'ai-swarm-controller'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}', 'localhost:${TF_STATIC_PORT:-8080}', 'localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 30s
    scrape_timeout: 15s
    metrics_path: /ai-metrics
    scheme: http
    params:
      format: ['prometheus']
    relabel_configs:
      - target_label: service
        replacement: 'ai-swarm'
      - target_label: component
        replacement: 'supreme-commander'

  # Field Generals - Specialized AI agent monitoring
  - job_name: 'ai-field-generals'
    static_configs:
      - targets: 
          - 'localhost:${TF_STATIC_PORT:-8080}' # Strategic Operations
          - 'localhost:${TF_STATIC_PORT:-8080}' # Government Compliance
          - 'localhost:${TF_STATIC_PORT:-8080}' # Database Operations
          - 'localhost:${TF_STATIC_PORT:-8080}' # API Management
          - 'localhost:${TF_STATIC_PORT:-8080}' # Security Operations
          - 'localhost:${TF_STATIC_PORT:-8080}' # Performance Optimization
          - 'localhost:${TF_STATIC_PORT:-8080}' # Quality Assurance
    scrape_interval: 45s
    metrics_path: /field-general-metrics
    relabel_configs:
      - source_labels: [__address__]
        regex: 'localhost:809([0-6])'
        target_label: field_general_id
        replacement: '${1}'
      - target_label: service
        replacement: 'ai-field-general'

  # PostgreSQL Database - Government data operations
  - job_name: 'postgresql'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 30s
    metrics_path: /metrics
    scheme: http
    relabel_configs:
      - target_label: service
        replacement: 'postgresql-government'
      - target_label: database_type
        replacement: 'primary'

  # Redis Cache - High-performance caching metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 20s
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'redis-cache'
      - target_label: cache_role
        replacement: 'primary'

  # Elasticsearch - Document search and analytics
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}', 'localhost:${TF_STATIC_PORT:-8080}', 'localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 60s
    metrics_path: /_prometheus/metrics
    scheme: http
    relabel_configs:
      - target_label: service
        replacement: 'elasticsearch-government'
      - source_labels: [__address__]
        regex: 'localhost:920([0-2])'
        target_label: es_node_id
        replacement: 'node-${1}'

  # System Node Metrics - Infrastructure monitoring
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}', 'node2:9100', 'node3:9100']
    scrape_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: 'system-infrastructure'
      - source_labels: [__address__]
        target_label: node_instance

  # Docker Container Metrics - Container orchestration monitoring
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:${TF_STATIC_PORT:-8080}']
    scrape_interval: 30s
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: 'docker-containers'

  # Government Module Health Checks
  - job_name: 'government-modules'
    static_configs:
      - targets:
          # Tier 1 - Core Government (8 modules)
          - 'government-edition:8000'
          - 'ai-swarm:8001'
          - 'ai-command-brain:8002'
          - 'marketplace-champion:8003'
          - 'costforge-ai-champion:8004'
          - 'terrafusion-record:8005'
          - 'terra-agent-champion:8006'
          - 'government-edition-enhanced:8007'
          # Tier 2 - Essential Operations (12 modules)
          - 'terra-collections:8010'
          - 'terra-levy:8011'
          - 'terra-insight:8012'
          - 'unified-system:8013'
          - 'web-audit-tracker:8014'
          - 'terra-miner:8015'
          - 'gispro:8016'
          - 'terrafusion-devops-championship:8017'
          - 'terra-fusion-sync:8018'
          - 'terra-flow:8019'
          - 'terra-flow-champion:8020'
          - 'terrafusion-publicrecords:8021'
          # Tier 3 - Extended Features (12 modules)
          - 'commercial-suite:8030'
          - 'property-workbench:8031'
          - 'shock-and-awe:8032'
          - 'terra-fusion-dashboard:8033'
          - 'terra-fusion-assessor:8034'
          - 'development:8035'
          - 'testing-suite:8036'
          - 'ai-advanced:8037'
    scrape_interval: 60s
    metrics_path: /health/metrics
    honor_timestamps: true
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):80([0-3][0-9])'
        target_label: module_name
        replacement: '${1}'
      - source_labels: [__address__]
        regex: '.+:800([0-7])'
        target_label: module_tier
        replacement: 'tier-1-core'
      - source_labels: [__address__]
        regex: '.+:801([0-9]|2[0-1])'
        target_label: module_tier
        replacement: 'tier-2-operations'
      - source_labels: [__address__]
        regex: '.+:803([0-7])'
        target_label: module_tier
        replacement: 'tier-3-extended'
      - target_label: service
        replacement: 'government-module'

  # Legacy System Integration Monitoring
  - job_name: 'legacy-systems'
    static_configs:
      - targets:
          - 'harris-pacs:8100'    # Harris PACS integration
          - 'tyler-eagleview:8101' # Tyler EagleView
          - 'aumentum:8102'        # Aumentum system
          - 'vision-appraisal:8103' # Vision Appraisal
    scrape_interval: 120s
    metrics_path: /integration/metrics
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):81([0-3][0-9])'
        target_label: legacy_system
        replacement: '${1}'
      - target_label: service
        replacement: 'legacy-integration'
      - target_label: integration_type
        replacement: 'government-system'

  # Security and Compliance Monitoring
  - job_name: 'security-compliance'
    static_configs:
      - targets: ['security-monitor:9200']
    scrape_interval: 30s
    metrics_path: /security/metrics
    scheme: https
    tls_config:
      ca_file: '/etc/prometheus/certs/government-ca.crt'
      cert_file: '/etc/prometheus/certs/prometheus.crt'
      key_file: '/etc/prometheus/certs/prometheus.key'
      insecure_skip_verify: false
    relabel_configs:
      - target_label: service
        replacement: 'security-compliance'
      - target_label: security_classification
        replacement: 'government'

  # Government Audit Trail Monitoring
  - job_name: 'audit-logging'
    static_configs:
      - targets: ['audit-service:8500']
    scrape_interval: 60s
    metrics_path: /audit/metrics
    relabel_configs:
      - target_label: service
        replacement: 'government-audit'
      - target_label: audit_type
        replacement: 'fisma-compliance'

  # Network and Infrastructure Security
  - job_name: 'network-security'
    static_configs:
      - targets: ['firewall:9300', 'ids:9301', 'ips:9302']
    scrape_interval: 45s
    metrics_path: /network/metrics
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):93([0-2][0-9])'
        target_label: security_component
        replacement: '${1}'
      - target_label: service
        replacement: 'network-security'

  # Performance and Capacity Monitoring
  - job_name: 'performance-monitoring'
    static_configs:
      - targets: ['performance-analyzer:8600']
    scrape_interval: 30s
    metrics_path: /performance/metrics
    params:
      detailed: ['true']
      classification: ['government']
    relabel_configs:
      - target_label: service
        replacement: 'performance-analysis'
      - target_label: analysis_type
        replacement: 'capacity-planning'

  # Government Reporting System
  - job_name: 'government-reporting'
    static_configs:
      - targets: ['reporting-service:8700']
    scrape_interval: 300s # 5 minutes for reporting metrics
    metrics_path: /reporting/metrics
    relabel_configs:
      - target_label: service
        replacement: 'government-reporting'
      - target_label: report_classification
        replacement: 'official-use'

# Remote write configuration for long-term storage
remote_write:
  - url: "http://prometheus-remote-storage:9201/api/v1/write"
    name: "terrafusion-long-term"
    remote_timeout: 30s
    queue_config:
      capacity: 10000
      max_shards: 200
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
    write_relabel_configs:
      - source_labels: [service]
        regex: 'government-.*'
        target_label: retention_class
        replacement: '7_years'
      - source_labels: [service]
        regex: 'security-.*'
        target_label: retention_class
        replacement: '10_years'
      - target_label: government_classification
        replacement: 'official'

# Remote read configuration for historical data
remote_read:
  - url: "http://prometheus-remote-storage:9201/api/v1/read"
    name: "historical-data"
    remote_timeout: 1m
    read_recent: true

# Storage configuration for government compliance
storage:
  tsdb:
    path: /prometheus/data
    retention.time: 2555d  # 7 years retention for government records
    retention.size: 500GB
    wal-compression: true
    no-lockfile: false
    allow-overlapping-blocks: false
    min-block-duration: 2h
    max-block-duration: 36h