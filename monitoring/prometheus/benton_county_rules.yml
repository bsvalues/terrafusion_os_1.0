# TerraFusion OS - Benton County Government Alert Rules
# Production monitoring rules for critical government operations

groups:
  - name: benton_county_critical
    interval: 30s
    rules:
      # Harris PACS Integration Critical Alerts
      - alert: HarrisPACSIntegrationDown
        expr: up{job="harris-pacs-integration"} == 0
        for: 2m
        labels:
          severity: critical
          county: benton
          system: harris-pacs
        annotations:
          summary: "Harris PACS v12.4.7 integration is down"
          description: "Harris PACS integration has been down for {{ $value }} minutes. 89,247 parcels may be affected."
          runbook_url: "https://docs.terrafusion.gov/runbooks/harris-pacs-recovery"

      # AI Swarm Critical Alerts
      - alert: AISwarmAgentsLow
        expr: ai_swarm_active_agents < 1000
        for: 5m
        labels:
          severity: critical
          county: benton
          system: ai-swarm
        annotations:
          summary: "AI Swarm agents below critical threshold"
          description: "Only {{ $value }} of 1008 AI agents are active. Government operations may be impacted."
          
      - alert: AISwarmPerformanceDegraded
        expr: ai_swarm_performance_score < 0.85
        for: 3m
        labels:
          severity: warning
          county: benton
          system: ai-swarm
        annotations:
          summary: "AI Swarm performance degraded"
          description: "AI Swarm performance is at {{ $value | humanizePercentage }}. Normal threshold is 90%."

      # Database Critical Alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          county: benton
          system: database
        annotations:
          summary: "PostgreSQL database is down"
          description: "Primary database is down. All government services affected."

      - alert: DatabaseConnectionsHigh
        expr: postgresql_connections > 80
        for: 5m
        labels:
          severity: warning
          county: benton
          system: database
        annotations:
          summary: "Database connections high"
          description: "Database has {{ $value }} active connections. Threshold is 80."

  - name: benton_county_performance
    interval: 60s
    rules:
      # API Performance
      - alert: APIResponseTimeSlow
        expr: http_request_duration_seconds{quantile="0.95"} > 2.0
        for: 5m
        labels:
          severity: warning
          county: benton
          system: api
        annotations:
          summary: "API response time degraded"
          description: "95th percentile response time is {{ $value }}s. SLA is 2 seconds."

      # Module System Health
      - alert: ModuleSystemDown
        expr: up{job="terrafusion-api"} == 0
        for: 2m
        labels:
          severity: critical
          county: benton
          system: modules
        annotations:
          summary: "Module system is down"
          description: "TerraFusion module system is not responding. All 35 modules affected."

      # Storage Alerts
      - alert: DiskSpaceHigh
        expr: (node_filesystem_size_bytes - node_filesystem_free_bytes) / node_filesystem_size_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          county: benton
          system: storage
        annotations:
          summary: "Disk space usage high"
          description: "Disk usage is at {{ $value | humanizePercentage }} on {{ $labels.device }}."

  - name: benton_county_compliance
    interval: 120s
    rules:
      # FISMA Compliance Monitoring
      - alert: AuditLogMissing
        expr: rate(audit_events_total[5m]) == 0
        for: 10m
        labels:
          severity: critical
          county: benton
          system: compliance
        annotations:
          summary: "Audit logging has stopped"
          description: "No audit events recorded in the last 10 minutes. FISMA compliance violation."

      # Security Monitoring
      - alert: UnauthorizedAPIAccess
        expr: rate(http_requests_total{status=~"401|403"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
          county: benton
          system: security
        annotations:
          summary: "High unauthorized access attempts"
          description: "{{ $value }} unauthorized API access attempts per second."

      # Government SLA Monitoring
      - alert: GovernmentSLABreach
        expr: availability_percentage < 0.999
        for: 1m
        labels:
          severity: critical
          county: benton
          system: sla
        annotations:
          summary: "Government SLA breached"
          description: "System availability is {{ $value | humanizePercentage }}. Government SLA requires 99.9%."