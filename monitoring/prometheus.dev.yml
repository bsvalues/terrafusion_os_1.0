global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    county: 'benton'
    system: 'terrafusion-os'

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # TerraFusion Backend API
  - job_name: 'terrafusion-backend'
    static_configs:
      - targets: ['backend:${TF_API_PORT:-5046}']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # TerraFusion Frontend
  - job_name: 'terrafusion-frontend'
    static_configs:
      - targets: ['frontend:${TF_FRONTEND_PORT:-3102}']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL Database
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis Cache
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 15s

  # Claude-Flow AI Service
  - job_name: 'claude-flow'
    static_configs:
      - targets: ['claude-flow:${TF_STATIC_PORT:-8080}']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # AI Swarm Orchestration
  - job_name: 'ai-swarm'
    static_configs:
      - targets: ['ai-swarm:9000']
    metrics_path: '/swarm/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:\${{TF_PROMETHEUS_PORT:-9090}}']

  # Node Exporter (if added later)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Development-specific settings
# Note: retention settings moved to command line arguments
