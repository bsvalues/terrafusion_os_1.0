# TerraFusion OS - Enhanced Development Docker Compose
# Optimized for Benton County development with security, performance, and debugging
# Features: Redis caching, PostgreSQL, monitoring, security scanning

version: '3.8'

services:
  # Backend API with enhanced development features
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev.enhanced
      target: development
    ports:
      - "5000:${TF_API_PORT:-5046}"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:5001;http://+:${TF_API_PORT:-5046}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=terrafusion_dev;Username=terrafusion;Password=dev_password_2024
      - ConnectionStrings__Redis=redis:6379
      - Harris_PACS_ConnectionString=Host=postgres;Database=harris_pacs_dev;Username=harris;Password=pacs_dev_2024
      - AI_Swarm_Size=1008
      - Quantum_Performance_Enabled=true
      - Benton_County_Mode=true
    volumes:
      - ./backend:/app:cached
      - backend_data:/app/data
      - backend_logs:/app/logs
      - dotnet_packages:/home/devuser/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - terrafusion-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TF_STATIC_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend with hot reload and debugging
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
      - "3001:${TF_SHELL_PORT:-3103}"  # Webpack dev server
    environment:
      - REACT_APP_API_URL=https://localhost:${TF_STATIC_PORT:-8080}
      - REACT_APP_ENVIRONMENT=development
      - REACT_APP_BENTON_COUNTY=true
      - REACT_APP_AI_SWARM_SIZE=1008
      - REACT_APP_QUANTUM_ENABLED=true
      - FAST_REFRESH=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - terrafusion-dev
    restart: unless-stopped

  # PostgreSQL for development (Harris PACS compatible)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=terrafusion_dev
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD=dev_password_2024
      - POSTGRES_MULTIPLE_DATABASES=harris_pacs_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - terrafusion-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion -d terrafusion_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - terrafusion-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # AI Models service for 1,008 agent swarm
  ai-models:
    image: alpine:latest
    command: sh -c "mkdir -p /models/swarm /models/quantum && tail -f /dev/null"
    volumes:
      - ai_models:/models
    networks:
      - terrafusion-dev
    restart: unless-stopped

  # Development monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terrafusion-dev
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana for development dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:${TF_FRONTEND_PORT:-3102}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=terrafusion_dev_2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - terrafusion-dev
    restart: unless-stopped
    depends_on:
      - prometheus

  # Security scanning service
  security-scanner:
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy_cache:/root/.cache/trivy
    networks:
      - terrafusion-dev
    restart: "no"
    command: ["sleep", "infinity"]

  # Development reverse proxy with SSL termination
  nginx-dev:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - terrafusion-dev
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local
  backend_data:
    driver: local
  backend_logs:
    driver: local
  frontend_node_modules:
    driver: local
  dotnet_packages:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  trivy_cache:
    driver: local

networks:
  terrafusion-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "com.terrafusion.environment=development"
      - "com.terrafusion.county=benton"
      - "com.terrafusion.security=development"
