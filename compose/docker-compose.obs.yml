version: "3.9"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: terrafusion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - terrafusion-obs
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: terrafusion-grafana
    ports:
      - "3009:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${TF_GRAFANA_PASSWORD:?TF_GRAFANA_PASSWORD is required}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
      - GF_SERVER_ROOT_URL=http://localhost:3009
    volumes:
      - grafana-data:/var/lib/grafana
      - ./obs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./obs/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./obs/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - terrafusion-obs
    restart: unless-stopped
    depends_on:
      - prometheus

  # Optional: Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: terrafusion-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - terrafusion-obs
    restart: unless-stopped

networks:
  terrafusion-obs:
    driver: bridge

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
