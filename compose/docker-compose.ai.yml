version: "3.9"
services:
  ai-orchestrator:
    image: terrafusion/ai-orchestrator:latest
    container_name: terrafusion-ai-orchestrator
    env_file: ../.env.ai
    ports: 
      - "3001:3001"
    depends_on: 
      - redis
    networks:
      - terrafusion-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  claude-flow:
    image: terrafusion/claude-flow:2.0.0
    container_name: terrafusion-claude-flow
    env_file: ../.env.ai
    ports: 
      - "3002:3002"
    depends_on: 
      - redis
    networks:
      - terrafusion-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  ai-tools:
    image: terrafusion/ai-tools:latest
    container_name: terrafusion-ai-tools
    env_file: ../.env.ai
    ports: 
      - "3003:3003"
    depends_on: 
      - redis
    networks:
      - terrafusion-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  redis:
    image: redis:7-alpine
    container_name: terrafusion-redis
    ports: 
      - "6379:6379"
    networks:
      - terrafusion-ai
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  terrafusion-ai:
    driver: bridge

volumes:
  redis-data:
    driver: local
