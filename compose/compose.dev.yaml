version: '3.8'

services:
  frontend-dev:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_ENV=development
      - REACT_APP_COUNTY=benton
    command: npm run dev
    networks:
      - terrafusion-dev-net
    restart: unless-stopped

  backend-dev:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=postgres-dev;Database=terrafusion_benton_dev;Username=terrafusion_dev;Password=dev_password
      - Redis__ConnectionString=redis://redis-dev:6379
      - JwtSettings__SecretKey=dev_jwt_secret_key
      - County__Name=Benton County
      - County__State=WA
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - terrafusion-dev-net
    restart: unless-stopped

  postgres-dev:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=terrafusion_dev
      - POSTGRES_PASSWORD=dev_password
      - POSTGRES_DB=terrafusion_benton_dev
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./database/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - terrafusion-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - terrafusion-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-swarm-dev:
    build: ./backend/ai-swarm
    ports:
      - "3001:3001"
    environment:
      - SWARM_ENVIRONMENT=development
      - SWARM_COUNTY=benton
      - SWARM_AGENT_COUNT=10
      - DATABASE_CONNECTION=Host=postgres-dev;Database=terrafusion_benton_dev;Username=terrafusion_dev;Password=dev_password
      - REDIS_CONNECTION=redis://redis-dev:6379
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - terrafusion-dev-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-dev-data:
  redis-dev-data:

networks:
  terrafusion-dev-net:
    driver: bridge
