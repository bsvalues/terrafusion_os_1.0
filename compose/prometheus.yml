global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:\${{TF_PROMETHEUS_PORT:-9090}}']

  - job_name: 'terrafusion-core'
    static_configs:
      - targets: ['core:${TF_STATIC_PORT:-8080}']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'terrafusion-worker'
    static_configs:
      - targets: ['worker:${TF_STATIC_PORT:-8080}']
    metrics_path: '/metrics'
    scrape_interval: 30s
