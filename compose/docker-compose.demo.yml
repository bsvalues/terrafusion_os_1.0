name: terrafusion_benton
services:
  db:
    image: postgis/postgis:15-3.4
    container_name: terrafusion_benton-db-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - terrafusion_demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    networks:
      - terrafusion_demo

  # Mock API service for demo using nginx
  api:
    image: nginx:alpine
    container_name: terrafusion_benton-api
    ports:
      - "8080:80"
    networks:
      - terrafusion_demo
    volumes:
      - ../data/benton:/usr/share/nginx/html/data:ro
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      db: { condition: service_healthy }

  # Static frontend demo
  ui:
    image: nginx:alpine
    container_name: terrafusion_benton-ui
    ports:
      - "3000:80"
    networks:
      - terrafusion_demo
    volumes:
      - ../frontend:/usr/share/nginx/html:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - terrafusion_demo
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3001:3000"
    networks:
      - terrafusion_demo

networks:
  terrafusion_demo:
    external: true
    name: terrafusion_demo

configs:
  prometheus_cfg:
    file: ./prometheus.yml
