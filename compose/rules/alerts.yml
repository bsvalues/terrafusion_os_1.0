# TerraFusion OS - Prometheus Alert Rules
# FISMA-HIGH: Alerting for security, availability, and compliance events
groups:
  - name: terrafusion-availability
    rules:
      # Service down alerts
      - alert: APIServiceDown
        expr: up{job="terrafusion-api"} == 0
        for: 1m
        labels:
          severity: critical
          compliance: fisma-high
        annotations:
          summary: "TerraFusion API (Kernel) is down"
          description: "The API service has been unreachable for more than 1 minute."

      - alert: GatewayServiceDown
        expr: up{job="terrafusion-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          compliance: fisma-high
        annotations:
          summary: "TerraFusion Gateway (Shell) is down"
          description: "The Gateway service has been unreachable for more than 1 minute."

      - alert: ConsciousnessServiceDown
        expr: up{job="terrafusion-consciousness"} == 0
        for: 2m
        labels:
          severity: critical
          compliance: fisma-high
        annotations:
          summary: "TerraFusion Consciousness (AI Swarm) is down"
          description: "The Consciousness service has been unreachable for more than 2 minutes."

      # High latency
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="terrafusion-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is above 2 seconds for 5 minutes."

  - name: terrafusion-resources
    rules:
      # High CPU
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 85% for 5 minutes."

      # High memory
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% for 5 minutes."

      # Disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space is below 15%."

      # Container restart
      - alert: ContainerRestarting
        expr: increase(container_restart_count[15m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting frequently"
          description: "Container has restarted more than 3 times in the last 15 minutes."

  - name: terrafusion-database
    rules:
      # PostgreSQL down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          compliance: fisma-high
        annotations:
          summary: "PostgreSQL database is down"
          description: "PostgreSQL has been unreachable for more than 1 minute."

      # High connection count
      - alert: PostgreSQLHighConnections
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection count"
          description: "PostgreSQL connection count is above 80 for 5 minutes."

  - name: terrafusion-security
    rules:
      # High error rate (potential attack)
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          compliance: fisma-high
        annotations:
          summary: "High HTTP error rate detected"
          description: "More than 5% of requests are returning 5xx errors for 5 minutes."

      # Unusual request rate (potential DDoS)
      - alert: UnusualRequestRate
        expr: rate(http_requests_total[1m]) > 1000
        for: 2m
        labels:
          severity: warning
          compliance: fisma-high
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate exceeds 1000 req/min for 2 minutes. Potential DDoS."
