# TerraFusion OS - Production Docker Compose
# Optimized for production deployment

version: '3.8'

services:
  terrafusion-api:
    image: terrafusion/api:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=terrafusion;Username=terrafusion;Password=${DB_PASSWORD}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - Redis__ConnectionString=redis:6379
    volumes:
      - /var/terrafusion/logs:/app/logs
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  terrafusion-frontend:
    image: terrafusion/frontend:latest
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  ai-command-brain:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  ai-swarm:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  ai-advanced:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Use PostgreSQL in production
  postgres:
    image: postgres:15-alpine
    container_name: terrafusion-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terrafusion
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - terrafusion-network

  # Nginx reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: terrafusion-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - terrafusion-api
      - terrafusion-frontend
    networks:
      - terrafusion-network

  # SSL certificate renewal
  certbot:
    image: certbot/certbot
    container_name: terrafusion-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - terrafusion-network

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/terrafusion/postgres
