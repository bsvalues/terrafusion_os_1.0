server {
    listen 80;
    server_name localhost;
    
    # Enable CORS for demo
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    
    # Health check endpoint
    location /health {
        return 200 '{"status":"healthy","service":"terrafusion-demo","timestamp":"2025-08-19T04:40:00Z"}';
        add_header Content-Type application/json;
    }
    
    # Benton County parcels endpoint
    location /api/counties/benton/parcels {
        return 200 '[
            {
                "parcelId": "R32400-300-0010",
                "address": "123 Main St",
                "city": "Richland",
                "state": "WA",
                "zip": "99352",
                "totalValue": 450000,
                "propertyType": "Residential",
                "yearBuilt": 1995,
                "landSqft": 8000,
                "bldgSqft": 2400
            },
            {
                "parcelId": "R32400-300-0020",
                "address": "456 Oak Ave",
                "city": "Kennewick",
                "state": "WA", 
                "zip": "99336",
                "totalValue": 380000,
                "propertyType": "Residential",
                "yearBuilt": 1987,
                "landSqft": 7200,
                "bldgSqft": 2100
            }
        ]';
        add_header Content-Type application/json;
    }
    
    # Benton County assessments endpoint
    location /api/counties/benton/assessments {
        return 200 '[
            {
                "parcelId": "R32400-300-0010",
                "assessedValue": 450000,
                "taxYear": 2024,
                "landValue": 180000,
                "improvementValue": 270000
            },
            {
                "parcelId": "R32400-300-0020", 
                "assessedValue": 380000,
                "taxYear": 2024,
                "landValue": 152000,
                "improvementValue": 228000
            }
        ]';
        add_header Content-Type application/json;
    }
    
    # Demo dashboard data
    location /api/dashboard/stats {
        return 200 '{
            "totalProperties": 85247,
            "totalValue": 12400000000,
            "avgValue": 145500,
            "lastUpdated": "2025-08-19T04:40:00Z"
        }';
        add_header Content-Type application/json;
    }
    
    # Serve static data files
    location /data/ {
        alias /usr/share/nginx/html/data/;
        autoindex on;
    }
    
    # Default location
    location / {
        return 200 '{"message":"TerraFusion Benton County Demo API","version":"1.0","endpoints":["/health","/api/counties/benton/parcels","/api/counties/benton/assessments","/api/dashboard/stats"]}';
        add_header Content-Type application/json;
    }
}
