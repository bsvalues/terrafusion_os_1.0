version: '3.8'
services:
  db:
    container_name: cowlitz-postgres
    environment:
      POSTGRES_USER: terrafusion_cowlitz
      POSTGRES_PASSWORD: terrafusion_cowlitz_secure_2024
      POSTGRES_DB: terrafusion_cowlitz
    ports:
      - "5432:5432"
    networks: [ terrafusion_cowlitz ]

  redis:
    container_name: cowlitz-redis
    ports: ["6379:6379"]
    networks: [ terrafusion_cowlitz ]

  core:
    container_name: cowlitz-core
    environment:
      COUNTY_NAME: "Cowlitz County, WA"
      COUNTY_CODE: "US-WA-COWLITZ"
      COWLITZ_DEMO_MODE: "true"
    ports: ["8020:${TF_STATIC_PORT:-8080}"]
    networks: [ terrafusion_cowlitz ]

  ui:
    container_name: cowlitz-ui
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:\${{TF_SERVICE_8020_PORT:-8020}}
      NEXT_PUBLIC_COUNTY_NAME: "Cowlitz County, WA"
    ports: ["3020:${TF_FRONTEND_PORT:-3102}"]
    networks: [ terrafusion_cowlitz ]

networks:
  terrafusion_cowlitz:
    external: true
