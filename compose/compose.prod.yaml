version: '3.8'

services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend
  frontend:
    image: registry.terrafusion.com/terrafusion/frontend:benton-1.0
    environment:
      - REACT_APP_API_URL=https://api.bentoncounty.gov
      - REACT_APP_ENV=production
      - REACT_APP_COUNTY=benton
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # .NET Backend API
  backend:
    image: registry.terrafusion.com/terrafusion/api:benton-1.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:${TF_API_PORT:-5046}
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=terrafusion_benton_production;Username=terrafusion_db;Password=${DATABASE_PASSWORD}
      - Redis__ConnectionString=redis://redis:6379
      - JwtSettings__SecretKey=${JWT_SECRET}
      - County__Name=Benton County
      - County__State=WA
      - HarrisPacs__ConnectionString=${HARRIS_PACS_CONNECTION}
      - HarrisPacs__ApiEndpoint=${HARRIS_PACS_API_ENDPOINT}
      - HarrisPacs__ApiKey=${HARRIS_PACS_API_KEY}
    ports:
      - "5000:${TF_API_PORT:-5046}"
    depends_on:
      - postgres
      - redis
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # AI Swarm Orchestration
  ai-swarm:
    image: registry.terrafusion.com/terrafusion/ai-swarm:benton-1.0
    environment:
      - SWARM_ENVIRONMENT=production
      - SWARM_COUNTY=benton
      - SWARM_AGENT_COUNT=1008
      - DATABASE_CONNECTION=${DATABASE_CONNECTION}
      - REDIS_CONNECTION=${REDIS_CONNECTION}
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:\${{TF_FRONTEND_PORT:-3000}}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=terrafusion_db
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=terrafusion_benton_production
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backups:/backups
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrafusion_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - terrafusion-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - terrafusion-net
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3009:${TF_FRONTEND_PORT:-3102}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=terrafusion2025
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - terrafusion-net
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  terrafusion-net:
    driver: bridge
