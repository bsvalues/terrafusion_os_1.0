version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
    time: 09:00
  open-pull-requests-limit: 5
  reviewers:
  - government-security-team
  commit-message:
    prefix: security
    include: scope
  labels:
  - dependencies
  - security
  - government-approved
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 2
  reviewers:
  - devops-team
  commit-message:
    prefix: ci
    include: scope
  labels:
  - github-actions
  - infrastructure
