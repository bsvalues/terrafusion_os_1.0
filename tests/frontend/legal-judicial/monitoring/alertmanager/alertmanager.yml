global:
  smtp_smarthost: government-mail.local:587
  smtp_from: alerts@legal-judicial.gov
route:
  group_by:
    - alertname
    - government
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: government-alerts
  routes:
    - match:
        severity: critical
      receiver: government-emergency
      group_wait: 10s
      repeat_interval: 5m
    - match:
        compliance: wcag_2_2_aa
      receiver: accessibility-team
      group_wait: 15s
    - match:
        security: vulnerability
      receiver: security-team
      group_wait: 5s
      repeat_interval: 1m
receivers:
  - name: government-alerts
    email_configs:
      - to: ops@legal-judicial.gov
        subject: 'TerraFusion legal-judicial Alert: {{ .GroupLabels.alertname }}'
        body: '

          Government Service Alert - {{ .GroupLabels.alertname }}


          Service: {{ .GroupLabels.service }}

          Severity: {{ .GroupLabels.severity }}

          Government Impact: {{ .GroupLabels.citizen_impact }}


          Alert Details:

          {{ range .Alerts }}

          - Summary: {{ .Annotations.summary }}

          - Description: {{ .Annotations.description }}

          - Impact: {{ .Annotations.impact }}

          - Action Required: {{ .Annotations.action }}

          {{ end }}


          Government Service Dashboard: http://grafana.gov:3001

          Citizen Service Status: {{ .ExternalURL }}


          This is an automated alert from TerraFusion Government Monitoring.

          '
  - name: government-emergency
    email_configs:
      - to: emergency@legal-judicial.gov, cio@legal-judicial.gov
        subject: "\U0001F6A8 CRITICAL: TerraFusion legal-judicial Emergency"
        body: "\n\U0001F6A8 CRITICAL GOVERNMENT SERVICE EMERGENCY \U0001F6A8\n\nService:\
          \ {{ .GroupLabels.service }}\nAlert: {{ .GroupLabels.alertname }}\nCitizen Impact:\
          \ HIGH\n\nIMMEDIATE ACTION REQUIRED\n\n{{ range .Alerts }}\nEmergency Details:\n\
          - {{ .Annotations.summary }}\n- {{ .Annotations.description }}\n- Citizen Impact:\
          \ {{ .Annotations.impact }}\n- Required Action: {{ .Annotations.action }}\n\
          {{ end }}\n\nThis is a critical alert requiring immediate attention.\nGovernment\
          \ services may be unavailable to citizens.\n"
    slack_configs:
      - api_url: https://hooks.slack.com/services/GOVERNMENT/EMERGENCY/WEBHOOK
        channel: '#government-emergency'
        title: "\U0001F6A8 Critical Alert: legal-judicial"
        text: '{{ .GroupLabels.alertname }} - Immediate action required'
  - name: accessibility-team
    email_configs:
      - to: accessibility@legal-judicial.gov, section508@legal-judicial.gov
        subject: "\u267F Accessibility Alert: legal-judicial"
        body: '

          Accessibility Compliance Alert


          Service: {{ .GroupLabels.service }}

          Compliance Issue: {{ .GroupLabels.compliance }}


          {{ range .Alerts }}

          Accessibility Details:

          - Issue: {{ .Annotations.summary }}

          - Description: {{ .Annotations.description }}

          - Citizen Impact: {{ .Annotations.impact }}

          - Compliance Requirement: {{ .Annotations.requirement }}

          {{ end }}


          Section 508 compliance must be maintained for all government services.

          '
  - name: security-team
    email_configs:
      - to: security@legal-judicial.gov, cybersecurity@legal-judicial.gov
        subject: "\U0001F512 Security Alert: legal-judicial"
        body: '

          Government Security Alert


          Service: {{ .GroupLabels.service }}

          Security Issue: {{ .GroupLabels.security }}


          {{ range .Alerts }}

          Security Details:

          - Threat: {{ .Annotations.summary }}

          - Description: {{ .Annotations.description }}

          - Risk Level: {{ .Annotations.impact }}

          - Response Required: {{ .Annotations.action }}

          {{ end }}


          Government security protocols must be followed immediately.

          '
