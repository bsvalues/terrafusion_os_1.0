global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    government_service: RAGPanel
    service_type: core
    compliance_level: government_grade
    accessibility: wcag_2_2_aa
rule_files:
  - government_alerts.yml
  - performance_rules.yml
  - accessibility_rules.yml
  - security_rules.yml
scrape_configs:
  - job_name: terrafusion-RAGPanel
    static_configs:
      - targets:
          - localhost:3000
          - localhost:8080
        labels:
          service: RAGPanel
          type: core
          government: 'true'
    scrape_interval: 5s
    metrics_path: /metrics
    honor_labels: true
  - job_name: RAGPanel-node-exporter
    static_configs:
      - targets:
          - localhost:9100
        labels:
          service: RAGPanel
          exporter: node
  - job_name: RAGPanel-government-metrics
    static_configs:
      - targets:
          - localhost:9090
        labels:
          government_compliance: enabled
          wcag_monitoring: active
          section_508: validated
    scrape_interval: 30s
    metrics_path: /government/metrics
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093
