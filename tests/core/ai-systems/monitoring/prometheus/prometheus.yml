global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    government_service: ai-systems
    service_type: core
    compliance_level: government_grade
    accessibility: wcag_2_2_aa
rule_files:
- government_alerts.yml
- performance_rules.yml
- accessibility_rules.yml
- security_rules.yml
scrape_configs:
- job_name: terrafusion-ai-systems
  static_configs:
  - targets:
    - localhost:3000
    - localhost:8080
    labels:
      service: ai-systems
      type: core
      government: 'true'
  scrape_interval: 5s
  metrics_path: /metrics
  honor_labels: true
- job_name: ai-systems-node-exporter
  static_configs:
  - targets:
    - localhost:9100
    labels:
      service: ai-systems
      exporter: node
- job_name: ai-systems-government-metrics
  static_configs:
  - targets:
    - localhost:9090
    labels:
      government_compliance: enabled
      wcag_monitoring: active
      section_508: validated
  scrape_interval: 30s
  metrics_path: /government/metrics
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - localhost:9093
