# Default deny all ingress traffic in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: terrafusion
  labels:
    app: terrafusion
    compliance: fisma-high
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow frontend to receive traffic from ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
---
# Allow frontend -> api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: frontend
        - podSelector:
            matchLabels:
              component: gateway
      ports:
        - port: 5000
          protocol: TCP
---
# Allow gateway -> api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: gateway
      ports:
        - port: 5000
          protocol: TCP
---
# Allow ingress to gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 3002
          protocol: TCP
---
# Allow api -> postgres, redis, consul
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-infrastructure
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: api
        - podSelector:
            matchLabels:
              component: consciousness
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-redis
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: api
        - podSelector:
            matchLabels:
              component: consciousness
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-consul
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: consul
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: api
        - podSelector:
            matchLabels:
              component: gateway
        - podSelector:
            matchLabels:
              component: consciousness
      ports:
        - port: 8500
          protocol: TCP
---
# Allow consciousness -> postgres, redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-consciousness-ingress
  namespace: terrafusion
  labels:
    app: terrafusion
spec:
  podSelector:
    matchLabels:
      component: consciousness
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              component: gateway
      ports:
        - port: 3004
          protocol: TCP
