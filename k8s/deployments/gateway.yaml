apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: terrafusion
  labels:
    app: terrafusion
    component: gateway
    tier: shell
    compliance: fisma-high
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terrafusion
      component: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terrafusion
        component: gateway
        tier: shell
    spec:
      serviceAccountName: terrafusion-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: gateway
          image: terrafusion/gateway:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "256Mi"
              cpu: "400m"
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: terrafusion-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: terrafusion
  labels:
    app: terrafusion
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: gateway
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: http
