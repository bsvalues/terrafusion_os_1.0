apiVersion: apps/v1
kind: Deployment
metadata:
  name: consciousness
  namespace: terrafusion
  labels:
    app: terrafusion
    component: consciousness
    tier: consciousness
    compliance: fisma-high
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terrafusion
      component: consciousness
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terrafusion
        component: consciousness
        tier: consciousness
    spec:
      serviceAccountName: terrafusion-consciousness
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: consciousness
          image: terrafusion/consciousness:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          envFrom:
            - configMapRef:
                name: consciousness-config
            - secretRef:
                name: terrafusion-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: consciousness
  namespace: terrafusion
  labels:
    app: terrafusion
    component: consciousness
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: consciousness
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
      name: http
