apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: terrafusion
  labels:
    app: terrafusion
    component: frontend
    compliance: fisma-high
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terrafusion
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terrafusion
        component: frontend
    spec:
      serviceAccountName: terrafusion-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: terrafusion/frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: terrafusion
  labels:
    app: terrafusion
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
