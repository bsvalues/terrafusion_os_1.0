apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: terrafusion
  labels:
    app: terrafusion
    component: api
    tier: kernel
    compliance: fisma-high
spec:
  replicas: 2
  selector:
    matchLabels:
      app: terrafusion
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: terrafusion
        component: api
        tier: kernel
    spec:
      serviceAccountName: terrafusion-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: terrafusion/api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: terrafusion-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: terrafusion
  labels:
    app: terrafusion
    component: api
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: api
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
