apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: terrafusion
  labels:
    app: terrafusion
    component: api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  CONSUL_HOST: "consul.terrafusion.svc.cluster.local"
  REDIS_HOST: "redis.terrafusion.svc.cluster.local"
  POSTGRES_HOST: "postgres.terrafusion.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "terrafusion"
  REDIS_PORT: "6379"
  CONSUL_PORT: "8500"
