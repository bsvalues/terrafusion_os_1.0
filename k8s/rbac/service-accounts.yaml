# TerraFusion OS - Kubernetes Service Accounts
# FISMA-HIGH: Least-privilege principle — each service has its own identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-api
  namespace: terrafusion
  labels:
    app: terrafusion
    component: api
    compliance: fisma-high
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-gateway
  namespace: terrafusion
  labels:
    app: terrafusion
    component: gateway
    compliance: fisma-high
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-consciousness
  namespace: terrafusion
  labels:
    app: terrafusion
    component: consciousness
    compliance: fisma-high
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terrafusion-frontend
  namespace: terrafusion
  labels:
    app: terrafusion
    component: frontend
    compliance: fisma-high
