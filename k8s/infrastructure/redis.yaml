apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: terrafusion
  labels:
    app: terrafusion
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terrafusion
      component: redis
  template:
    metadata:
      labels:
        app: terrafusion
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
              protocol: TCP
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: terrafusion
  labels:
    app: terrafusion
    component: redis
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
