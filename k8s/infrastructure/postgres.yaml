apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: terrafusion
  labels:
    app: terrafusion
    component: postgres
    compliance: fisma-high
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: terrafusion
      component: postgres
  template:
    metadata:
      labels:
        app: terrafusion
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: terrafusion-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "terrafusion"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: terrafusion
          component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: terrafusion
  labels:
    app: terrafusion
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: terrafusion
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
