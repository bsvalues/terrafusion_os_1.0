<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion cOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* WebGL Background */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.4;
        }

        .os-layer {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Desktop */
        .desktop {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 100px);
            grid-auto-rows: 100px;
            gap: 20px;
            align-content: start;
        }

        /* Desktop Icons */
        .desktop-icon {
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .desktop-icon:hover {
            background: rgba(0,255,238,0.08);
            transform: translateY(-2px);
        }

        .desktop-icon:active {
            transform: scale(0.95);
        }

        .icon {
            width: 52px;
            height: 52px;
            background: rgba(10,15,28,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,238,0.3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,255,238,0.2);
            transition: all 0.2s;
        }

        .desktop-icon:hover .icon {
            box-shadow: 0 12px 32px rgba(0,255,238,0.4);
            border-color: rgba(0,255,238,0.6);
        }

        .icon svg {
            width: 32px;
            height: 32px;
        }

        .icon-label {
            font-size: 12px;
            text-align: center;
            color: rgba(255,255,255,0.95);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-weight: 500;
        }

        /* Taskbar */
        .taskbar {
            height: 48px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(40px);
            border-top: 1px solid rgba(0,255,238,0.15);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            box-shadow: 0 -4px 24px rgba(0,255,238,0.1);
        }

        /* Start Button */
        .start-button {
            width: 38px;
            height: 38px;
            background: rgba(10,15,28,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,238,0.4);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(0,255,238,0.3);
        }

        .start-button:hover {
            transform: scale(1.05);
            border-color: rgba(0,255,238,0.6);
            box-shadow: 0 6px 16px rgba(0,255,238,0.5);
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .start-button svg {
            width: 20px;
            height: 20px;
        }

        /* Running Apps */
        .running-apps {
            display: flex;
            gap: 4px;
            flex: 1;
        }

        .taskbar-app {
            height: 36px;
            padding: 0 12px;
            background: rgba(0,255,238,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,238,0.15);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 13px;
        }

        .taskbar-app:hover {
            background: rgba(0,255,238,0.1);
            border-color: rgba(0,255,238,0.3);
        }

        .taskbar-app.active {
            background: rgba(0,255,238,0.15);
            border-color: rgba(0,255,238,0.4);
            box-shadow: 0 0 12px rgba(0,255,238,0.2);
        }

        .app-icon-small svg {
            width: 18px;
            height: 18px;
        }

        /* System Tray */
        .system-tray {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 12px;
            border-left: 1px solid rgba(0,255,238,0.15);
        }

        .tray-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tray-icon:hover {
            background: rgba(0,255,238,0.1);
        }

        .tray-icon svg {
            width: 18px;
            height: 18px;
        }

        .clock {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            font-weight: 500;
            padding: 0 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.3;
        }

        /* Start Menu */
        .start-menu {
            position: fixed;
            bottom: 60px;
            left: 12px;
            width: 620px;
            height: 520px;
            background: rgba(10,15,28,0.92);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(0,255,238,0.25);
            border-radius: 16px;
            box-shadow: 0 24px 64px rgba(0,255,238,0.15), 0 0 80px rgba(0,153,255,0.1);
            display: none;
            flex-direction: column;
            z-index: 2000;
            overflow: hidden;
        }

        .start-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,255,238,0.6), transparent);
            animation: scan 3s infinite;
        }

        @keyframes scan {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .start-menu.show {
            display: flex;
        }

        .start-menu-header {
            padding: 24px;
            border-bottom: 1px solid rgba(0,255,238,0.1);
        }

        .start-menu-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #0099ff, #00ffee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .start-menu-apps {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            align-content: start;
        }

        .start-app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .start-app:hover {
            background: rgba(0,255,238,0.08);
            border-color: rgba(0,255,238,0.2);
        }

        .start-app-icon {
            width: 44px;
            height: 44px;
            background: rgba(10,15,28,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,255,238,0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-app-icon svg {
            width: 28px;
            height: 28px;
        }

        .start-app-name {
            font-size: 11px;
            text-align: center;
            color: rgba(255,255,255,0.9);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- WebGL Background -->
    <canvas id="webgl-canvas"></canvas>
    
    <!-- SVG Definitions -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="tfGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1" />
                <stop offset="50%" style="stop-color:#0891b2;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#667eea;stop-opacity:1" />
            </linearGradient>
        </defs>
    </svg>
    
    <div class="os-layer">
        <!-- Desktop -->
        <div class="desktop">
            <div class="desktop-icon" ondblclick="launchApp('TerraFusion Sync')">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                </div>
                <div class="icon-label">TerraFusion<br>Sync</div>
            </div>
            
            <div class="desktop-icon" ondblclick="launchApp('TerraFlow')">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                </div>
                <div class="icon-label">TerraFlow</div>
            </div>
            
            <div class="desktop-icon" ondblclick="launchApp('CostForge AI')">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="icon-label">CostForge<br>AI</div>
            </div>
            
            <div class="desktop-icon" ondblclick="launchApp('Settings')">
                <div class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/>
                    </svg>
                </div>
                <div class="icon-label">Settings</div>
            </div>
        </div>
        
        <!-- Start Menu -->
        <div class="start-menu" id="startMenu">
            <div class="start-menu-header">
                <div class="start-menu-title">TerraFusion Applications</div>
            </div>
            <div class="start-menu-apps">
                <div class="start-app" onclick="launchApp('TerraFusion Sync')">
                    <div class="start-app-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                            <path d="M23 4v6h-6M1 20v-6h6"/>
                            <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                        </svg>
                    </div>
                    <div class="start-app-name">TerraFusion Sync</div>
                </div>
                <div class="start-app" onclick="launchApp('TerraFlow')">
                    <div class="start-app-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                        </svg>
                    </div>
                    <div class="start-app-name">TerraFlow</div>
                </div>
                <div class="start-app" onclick="launchApp('CostForge AI')">
                    <div class="start-app-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <div class="start-app-name">CostForge AI</div>
                </div>
                <div class="start-app" onclick="launchApp('Settings')">
                    <div class="start-app-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M12 1v6m0 6v6M5.64 5.64l4.24 4.24m4.24 4.24l4.24 4.24M1 12h6m6 0h6M5.64 18.36l4.24-4.24m4.24-4.24l4.24-4.24"/>
                        </svg>
                    </div>
                    <div class="start-app-name">Settings</div>
                </div>
            </div>
        </div>
        
        <!-- Taskbar -->
        <div class="taskbar">
            <button class="start-button" onclick="toggleStartMenu()" title="Start">
                <svg viewBox="0 0 24 24" fill="url(#tfGradient)">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </button>
            
            <div class="running-apps" id="runningApps">
                <!-- Running apps will appear here -->
            </div>
            
            <div class="system-tray">
                <div class="tray-icon" title="AI Swarm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="4"/>
                    </svg>
                </div>
                <div class="tray-icon" title="Security">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <div class="tray-icon" title="Network">
                    <svg viewBox="0 0 24 24" fill="none" stroke="url(#tfGradient)" stroke-width="2">
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                    </svg>
                </div>
                <div class="clock" id="clock">
                    <span id="time">12:00</span>
                    <span id="date">Oct 2</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // WebGL Transcendence Background
        const canvas = document.getElementById('webgl-canvas');
        const gl = canvas.getContext('webgl');
        let mouseX = 0, mouseY = 0;
        
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();
        
        if (gl) {
            const vertexShader = gl.createShader(gl.VERTEX_SHADER);
            gl.shaderSource(vertexShader, `
                attribute vec2 position;
                void main() {
                    gl_Position = vec4(position, 0.0, 1.0);
                }
            `);
            gl.compileShader(vertexShader);
            
            const fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
            gl.shaderSource(fragmentShader, `
                precision mediump float;
                uniform float time;
                uniform vec2 resolution;
                uniform vec2 mouse;
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / resolution;
                    vec2 mouseUV = mouse / resolution;
                    
                    // Flowing energy
                    float energy = 0.0;
                    for(float i = 0.0; i < 5.0; i++) {
                        vec2 pos = vec2(
                            sin(time * 0.3 + i * 1.5) * 0.3 + 0.5,
                            cos(time * 0.4 + i * 2.1) * 0.3 + 0.5
                        );
                        float dist = distance(uv, pos);
                        energy += 0.008 / (dist + 0.008);
                    }
                    
                    // Mouse glow
                    float mouseDist = distance(uv, mouseUV);
                    float mouseGlow = 0.03 / (mouseDist + 0.03);
                    
                    // TerraFusion colors
                    vec3 color1 = vec3(0.0, 0.6, 1.0);      // Trust blue
                    vec3 color2 = vec3(0.0, 1.0, 0.933);    // Transcendence cyan
                    vec3 color3 = vec3(0.0, 1.0, 0.667);    // Success green
                    
                    vec3 color = mix(color1, color2, uv.x + sin(time * 0.5) * 0.1);
                    color = mix(color, color3, uv.y + cos(time * 0.4) * 0.1);
                    color += energy * 0.4;
                    color += mouseGlow * vec3(0.2, 0.8, 1.0) * 0.3;
                    
                    // Subtle grid
                    float grid = step(0.985, sin(uv.x * 60.0)) + step(0.985, sin(uv.y * 60.0));
                    color += grid * 0.03;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `);
            gl.compileShader(fragmentShader);
            
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            gl.useProgram(program);
            
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            
            const posLoc = gl.getAttribLocation(program, 'position');
            gl.enableVertexAttribArray(posLoc);
            gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
            
            const timeLoc = gl.getUniformLocation(program, 'time');
            const resLoc = gl.getUniformLocation(program, 'resolution');
            const mouseLoc = gl.getUniformLocation(program, 'mouse');
            
            function render(time) {
                gl.uniform1f(timeLoc, time * 0.001);
                gl.uniform2f(resLoc, canvas.width, canvas.height);
                gl.uniform2f(mouseLoc, mouseX, mouseY);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            render(0);
        }
        
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: false
            });
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric'
            });
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Start Menu
        let startMenuOpen = false;
        function toggleStartMenu() {
            startMenuOpen = !startMenuOpen;
            document.getElementById('startMenu').classList.toggle('show', startMenuOpen);
        }
        
        document.addEventListener('click', (e) => {
            const startMenu = document.getElementById('startMenu');
            const startButton = document.querySelector('.start-button');
            if (startMenuOpen && !startMenu.contains(e.target) && !startButton.contains(e.target)) {
                toggleStartMenu();
            }
        });
        
        // Launch App
        const runningApps = new Set();
        function launchApp(appName) {
            console.log('Launching:', appName);
            
            if (startMenuOpen) toggleStartMenu();
            
            if (!runningApps.has(appName)) {
                runningApps.add(appName);
                const appBar = document.getElementById('runningApps');
                const appEl = document.createElement('div');
                appEl.className = 'taskbar-app active';
                appEl.innerHTML = `
                    <div class="app-icon-small">
                        <svg viewBox="0 0 24 24" fill="url(#tfGradient)">
                            <circle cx="12" cy="12" r="10"/>
                        </svg>
                    </div>
                    <span>${appName}</span>
                `;
                appEl.onclick = () => appEl.classList.toggle('active');
                appBar.appendChild(appEl);
            }
        }
        
        console.log('TerraFusion cOS • Government. Transcended.');
    </script>
</body>
</html>
