[package]
name = "valuation-kernel"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion cOS Team"]
description = "Government-grade Property Assessment Algorithms"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
statrs = "0.16"
rayon = "1.7"
async-trait = "0.1"
futures = "0.3"

[lib]
name = "valuation_kernel"
path = "src/lib.rs"