[package]
name = "security-layer"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion cOS Team"]
description = "Government-grade Security Protection Framework"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = { version = "0.10", features = ["aes256"] }
argon2 = "0.5"
rand = "0.8"
async-trait = "0.1"
futures = "0.3"

[lib]
name = "security_layer"
path = "src/lib.rs"