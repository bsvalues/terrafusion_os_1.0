[package]
name = "ffi-bridge"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion cOS Team"]
description = "Native C FFI Interface for .NET 8.0 Integration"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "ffi_bridge"
path = "src/lib.rs"

[features]
dotnet-ffi = []