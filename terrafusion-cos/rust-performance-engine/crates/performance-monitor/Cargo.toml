[package]
name = "performance-monitor"
version = "1.0.0"
edition = "2021"
authors = ["TerraFusion cOS Team"]
description = "Elite System Monitoring for Government Deployment"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.29"
prometheus = "0.13"
async-trait = "0.1"
futures = "0.3"

[lib]
name = "performance_monitor"
path = "src/lib.rs"