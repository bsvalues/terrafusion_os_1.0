# TerraFusion cOS Production CI/CD Pipeline
# Automated testing, security scanning, and deployment

name: TerraFusion cOS Production Deployment

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: terrafusion/cos-api
  HELM_CHART_VERSION: 2.0.0

jobs:
  security-scan:
    name: Security & Vulnerability Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install security tools
      run: |
        pip install safety bandit semgrep
        
    - name: Run vulnerability scan with Safety
      run: |
        safety check --json --output safety-report.json || true
        
    - name: Run static security analysis with Bandit
      run: |
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Run SAST with Semgrep
      run: |
        semgrep --config=auto --json --output=semgrep-report.json . || true
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
          semgrep-report.json

  test:
    name: Automated Testing Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: terrafusion_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-prod.txt
        pip install pytest pytest-cov pytest-asyncio
        
    - name: Run Ultimate Test Suite
      env:
        DATABASE_URL: postgresql://postgres:testpass@localhost:5432/terrafusion_test
        REDIS_URL: redis://localhost:6379
        TERRAFUSION_ENV: testing
      run: |
        python run_ultimate_tests.py
        
    - name: Run additional unit tests
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          tests/ULTIMATE_TERRAFUSION_TEST_REPORT_*.json
          htmlcov/
          coverage.xml

  build:
    name: Build Production Container
    runs-on: ubuntu-latest
    needs: [security-scan, test]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          
    - name: Build and push container
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
        
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        
    - name: Create namespace
      run: |
        kubectl create namespace terrafusion-staging --dry-run=client -o yaml | kubectl apply -f -
        
    - name: Deploy to staging
      run: |
        helm upgrade --install terrafusion-cos-staging \
          ./deployment/helm/terrafusion-cos \
          --namespace terrafusion-staging \
          --values ./deployment/staging/values.yaml \
          --set image.tag=${{ github.sha }} \
          --set environment=staging \
          --wait --timeout=10m
          
    - name: Run smoke tests
      run: |
        kubectl wait --for=condition=ready pod -l app=terrafusion-cos -n terrafusion-staging --timeout=300s
        kubectl port-forward -n terrafusion-staging svc/terrafusion-cos-api-service 8090:8090 &
        sleep 10
        curl -f http://localhost:8090/health || exit 1
        curl -f http://localhost:8090/api/status || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
        
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
        
    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig
        
    - name: Pre-deployment backup
      run: |
        kubectl exec -n terrafusion-database \
          deployment/terrafusion-postgresql-primary -- \
          pg_dump -U postgres terrafusion_cos_prod > backup-$(date +%Y%m%d-%H%M%S).sql
          
    - name: Deploy to production
      run: |
        helm upgrade --install terrafusion-cos-production \
          ./deployment/helm/terrafusion-cos \
          --namespace terrafusion-production \
          --values ./deployment/production/values.yaml \
          --set image.tag=${{ github.ref_name }} \
          --set environment=production \
          --wait --timeout=20m
          
    - name: Verify production deployment
      run: |
        kubectl wait --for=condition=ready pod -l app=terrafusion-cos -n terrafusion-production --timeout=600s
        kubectl get pods -n terrafusion-production
        kubectl get services -n terrafusion-production
        
    - name: Run production health checks
      run: |
        # Wait for load balancer
        sleep 60
        
        # Health check through ingress
        curl -f https://api.terrafusion.gov/health || exit 1
        curl -f https://api.terrafusion.gov/api/status || exit 1
        
        # Check all services are healthy
        kubectl get pods -n terrafusion-production --no-headers | \
          awk '{print $3}' | grep -q "Running" || exit 1
          
    - name: Notify deployment success
      if: success()
      run: |
        echo "🚀 TerraFusion cOS ${{ github.ref_name }} successfully deployed to production!"
        echo "🔗 API Endpoint: https://api.terrafusion.gov"
        echo "📊 Monitoring: https://monitoring.terrafusion.gov"
        
    - name: Rollback on failure
      if: failure()
      run: |
        echo "❌ Production deployment failed, initiating rollback..."
        helm rollback terrafusion-cos-production --namespace terrafusion-production
        kubectl wait --for=condition=ready pod -l app=terrafusion-cos -n terrafusion-production --timeout=300s

  performance-test:
    name: Performance & Load Testing
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6
        
    - name: Run performance tests
      run: |
        k6 run --out json=performance-results.json deployment/testing/performance-test.js
        
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance-results.json