# TerraFusion cOS Staging Environment Configuration
# Pre-Production Testing Environment

environment:
  name: "staging"
  tier: "pre-production"
  classification: "INTERNAL"
  deployment_region: "us-gov-west-1"

# Application Configuration
application:
  name: "terrafusion-cos-staging"
  version: "2.0.0-enterprise"
  replicas: 3
  min_replicas: 2
  max_replicas: 8
  target_cpu_utilization: 70
  target_memory_utilization: 80

# Security Configuration
security:
  encryption_at_rest: true
  encryption_in_transit: true
  tls_version: "1.3"
  certificate_authority: "internal-staging-ca"
  security_clearance_required: false
  multi_factor_auth: true
  session_timeout: 28800
  token_rotation_interval: 3600
  
# Database Configuration
database:
  primary:
    type: "postgresql"
    version: "15"
    host: "terrafusion-db-staging.internal"
    port: 5432
    database: "terrafusion_cos_staging"
    ssl_mode: "require"
    connection_pool_size: 20
    max_connections: 100
    
  cache:
    type: "redis"
    version: "7.0"
    cluster_mode: false
    host: "terrafusion-redis-staging.internal"
    port: 6379
    ssl: true
    max_connections: 200

# Scaling Configuration
scaling:
  user_capacity: 10000
  peak_capacity: 15000
  concurrent_sessions: 5000
  api_rate_limit: 5000
  burst_rate_limit: 10000
  
# Load Balancer Configuration
load_balancer:
  type: "application"
  algorithm: "round_robin"
  health_check_path: "/health"
  health_check_interval: 30
  timeout: 60
  sticky_sessions: false
  ssl_termination: true
  
# Monitoring Configuration
monitoring:
  metrics_enabled: true
  logging_level: "DEBUG"
  log_retention_days: 30
  metrics_retention_days: 90
  alerting_enabled: true
  
  prometheus:
    enabled: true
    retention: "30d"
    scrape_interval: "15s"
    
  grafana:
    enabled: true
    admin_password: "${GRAFANA_STAGING_PASSWORD}"
    
  elasticsearch:
    enabled: true
    retention_days: 30
    shards: 1
    replicas: 1

# Backup Configuration
backup:
  enabled: true
  schedule: "0 3 * * *"
  retention_days: 7
  storage_class: "STANDARD"
  encryption: true
  
# Network Configuration
network:
  vpc_cidr: "10.1.0.0/16"
  private_subnets:
    - "10.1.1.0/24"
    - "10.1.2.0/24"
  public_subnets:
    - "10.1.101.0/24"
    - "10.1.102.0/24"
    
# Compliance Configuration
compliance:
  fips_140_2: true
  fedramp_high: false
  soc2_type2: false
  audit_logging: true
  data_residency: "US"
  encryption_standard: "AES-256"

# Resource Limits
resources:
  api_server:
    cpu_request: "500m"
    cpu_limit: "2000m"
    memory_request: "1Gi"
    memory_limit: "4Gi"
    
  database:
    cpu_request: "1000m"
    cpu_limit: "2000m"
    memory_request: "4Gi"
    memory_limit: "8Gi"
    storage: "100Gi"
    
  cache:
    cpu_request: "250m"
    cpu_limit: "500m"
    memory_request: "1Gi"
    memory_limit: "2Gi"

# Disaster Recovery
disaster_recovery:
  enabled: false
  rpo: 24
  rto: 4
  automated_failover: false
  
# Service Configuration
services:
  terrafusion_sync:
    enabled: true
    replicas: 2
    resources:
      cpu_request: "250m"
      cpu_limit: "1000m"
      memory_request: "512Mi"
      memory_limit: "2Gi"
      
  terra_flow:
    enabled: true
    replicas: 2
    resources:
      cpu_request: "250m"
      cpu_limit: "1000m"
      memory_request: "512Mi"
      memory_limit: "2Gi"
      
  security_mesh:
    enabled: true
    replicas: 2
    resources:
      cpu_request: "500m"
      cpu_limit: "1000m"
      memory_request: "1Gi"
      memory_limit: "2Gi"
      
  ai_swarm:
    enabled: true
    replicas: 2
    resources:
      cpu_request: "1000m"
      cpu_limit: "2000m"
      memory_request: "2Gi"
      memory_limit: "4Gi"

# Feature Flags
features:
  ai_swarm_coordination: true
  quantum_optimization: true
  advanced_analytics: true
  real_time_sync: true
  automated_workflows: true
  predictive_scaling: false

# Testing Configuration
testing:
  load_testing: true
  security_testing: true
  performance_testing: true
  integration_testing: true
  automated_testing: true