# TerraFusion cOS Production Environment Configuration
# Government-Grade Deployment Settings

environment:
  name: "production"
  tier: "government-grade"
  classification: "CONFIDENTIAL"
  deployment_region: "us-gov-west-1"

# Application Configuration
application:
  name: "terrafusion-cos"
  version: "2.0.0-enterprise"
  replicas: 12
  min_replicas: 8
  max_replicas: 50
  target_cpu_utilization: 70
  target_memory_utilization: 80

# Security Configuration
security:
  encryption_at_rest: true
  encryption_in_transit: true
  tls_version: "1.3"
  certificate_authority: "internal-gov-ca"
  security_clearance_required: true
  multi_factor_auth: true
  session_timeout: 28800  # 8 hours
  token_rotation_interval: 3600  # 1 hour
  
# Database Configuration
database:
  primary:
    type: "postgresql"
    version: "15"
    host: "terrafusion-db-primary.internal"
    port: 5432
    database: "terrafusion_cos_prod"
    ssl_mode: "require"
    connection_pool_size: 100
    max_connections: 500
    
  replica:
    type: "postgresql"
    version: "15" 
    host: "terrafusion-db-replica.internal"
    port: 5432
    database: "terrafusion_cos_prod"
    ssl_mode: "require"
    connection_pool_size: 50
    
  cache:
    type: "redis"
    version: "7.0"
    cluster_mode: true
    nodes: 6
    host: "terrafusion-redis-cluster.internal"
    port: 6379
    ssl: true
    max_connections: 1000

# Scaling Configuration
scaling:
  user_capacity: 150000
  peak_capacity: 200000
  concurrent_sessions: 50000
  api_rate_limit: 10000  # requests per minute per user
  burst_rate_limit: 50000
  
# Load Balancer Configuration
load_balancer:
  type: "application"
  algorithm: "least_connections"
  health_check_path: "/health"
  health_check_interval: 30
  timeout: 60
  sticky_sessions: true
  ssl_termination: true
  
# Monitoring Configuration
monitoring:
  metrics_enabled: true
  logging_level: "INFO"
  log_retention_days: 90
  metrics_retention_days: 365
  alerting_enabled: true
  
  prometheus:
    enabled: true
    retention: "90d"
    scrape_interval: "15s"
    
  grafana:
    enabled: true
    admin_password: "${GRAFANA_ADMIN_PASSWORD}"
    
  elasticsearch:
    enabled: true
    retention_days: 90
    shards: 3
    replicas: 2

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  storage_class: "GLACIER"
  encryption: true
  
# Network Configuration
network:
  vpc_cidr: "10.0.0.0/16"
  private_subnets:
    - "10.0.1.0/24"
    - "10.0.2.0/24"
    - "10.0.3.0/24"
  public_subnets:
    - "10.0.101.0/24"
    - "10.0.102.0/24"
    - "10.0.103.0/24"
    
# Compliance Configuration
compliance:
  fips_140_2: true
  fedramp_high: true
  soc2_type2: true
  audit_logging: true
  data_residency: "US"
  encryption_standard: "AES-256"

# Resource Limits
resources:
  api_server:
    cpu_request: "2000m"
    cpu_limit: "4000m"
    memory_request: "4Gi"
    memory_limit: "8Gi"
    
  database:
    cpu_request: "4000m"
    cpu_limit: "8000m"
    memory_request: "16Gi"
    memory_limit: "32Gi"
    storage: "1Ti"
    
  cache:
    cpu_request: "1000m"
    cpu_limit: "2000m"
    memory_request: "8Gi"
    memory_limit: "16Gi"

# Disaster Recovery
disaster_recovery:
  enabled: true
  rpo: 4  # Recovery Point Objective in hours
  rto: 2  # Recovery Time Objective in hours
  backup_regions:
    - "us-gov-east-1"
  automated_failover: true
  
# Service Configuration
services:
  terrafusion_sync:
    enabled: true
    replicas: 6
    resources:
      cpu_request: "1000m"
      cpu_limit: "2000m"
      memory_request: "2Gi"
      memory_limit: "4Gi"
      
  terra_flow:
    enabled: true
    replicas: 4
    resources:
      cpu_request: "1000m"
      cpu_limit: "2000m"
      memory_request: "2Gi"
      memory_limit: "4Gi"
      
  security_mesh:
    enabled: true
    replicas: 8
    resources:
      cpu_request: "2000m"
      cpu_limit: "4000m"
      memory_request: "4Gi"
      memory_limit: "8Gi"
      
  ai_swarm:
    enabled: true
    replicas: 16
    resources:
      cpu_request: "4000m"
      cpu_limit: "8000m"
      memory_request: "8Gi"
      memory_limit: "16Gi"

# Feature Flags
features:
  ai_swarm_coordination: true
  quantum_optimization: true
  advanced_analytics: true
  real_time_sync: true
  automated_workflows: true
  predictive_scaling: true