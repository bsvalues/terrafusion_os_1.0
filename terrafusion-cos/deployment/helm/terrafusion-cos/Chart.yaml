apiVersion: v2
name: terrafusion-cos
description: TerraFusion cOS - County Operating System Helm Chart
version: 2.0.0
appVersion: 2.0.0-enterprise
type: application
icon: https://terrafusion.gov/assets/logo.png
home: https://terrafusion.gov
sources:
  - https://github.com/terrafusion/cos
maintainers:
  - name: TerraFusion Systems Team
    email: systems@terrafusion.gov
keywords:
  - government
  - operating-system
  - county
  - vendor-substrate
  - ai-swarm
annotations:
  "category": "Government Technology"
  "security.clearance": "CONFIDENTIAL"
  "compliance.fedramp": "High"
  "compliance.fips140-2": "Level 2"
dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: elasticsearch
    version: 19.x.x
    repository: https://helm.elastic.co
    condition: elasticsearch.enabled