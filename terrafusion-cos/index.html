<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraFusion cOS - Government. Transcended.</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0099ff;
            color: white;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0099ff 0%, #00ffaa 100%);
            z-index: 9999;
        }

        .loading-content {
            text-align: center;
            animation: pulse 2s infinite;
        }

        .loading-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .loading-subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #app {
            display: none;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-title">TerraFusion cOS</div>
            <div class="loading-subtitle">Government. Transcended.</div>
            <div>Initializing Frontend Engine...</div>
        </div>
    </div>

    <div id="app"></div>

    <script type="module">
        import { TerraFusionFrontendEngine, TerraFusionAppShell } from './frontend_engine/index.js';

        async function initializeTerraFusion() {
            try {
                console.log('🚀 Initializing TerraFusion cOS Frontend...');

                // Initialize the frontend engine
                const engine = new TerraFusionFrontendEngine({
                    theme: 'government-professional',
                    security: 'top-secret',
                    accessibility: true,
                    performance: {
                        budget: {
                            js: 500 * 1024, // 500KB
                            css: 100 * 1024, // 100KB
                            images: 2 * 1024 * 1024 // 2MB
                        }
                    }
                });

                await engine.initialize();

                // Initialize the app shell
                const appShell = new TerraFusionAppShell({
                    container: '#app',
                    theme: 'government-professional',
                    security: 'top-secret'
                });

                await appShell.initialize();

                // Hide loading screen and show app
                document.getElementById('loading').style.display = 'none';
                document.getElementById('app').style.display = 'block';

                console.log('✅ TerraFusion cOS Frontend initialized successfully');

            } catch (error) {
                console.error('❌ Failed to initialize TerraFusion cOS Frontend:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="loading-content">
                        <div class="loading-title">❌ Initialization Failed</div>
                        <div class="loading-subtitle">Check console for details</div>
                        <div style="font-size: 0.9rem; margin-top: 1rem;">${error.message}</div>
                    </div>
                `;
            }
        }

        // Start initialization when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeTerraFusion);
        } else {
            initializeTerraFusion();
        }
    </script>
</body>
</html>
