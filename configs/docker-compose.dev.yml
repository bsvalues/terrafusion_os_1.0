version: '3.8'

services:
  # Backend API - .NET Core
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:${TF_API_PORT:-5046}"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:\${{TF_API_PORT:-5000}}
      - TRUST_FABRIC_DID=did:tf:service:backend:001
      - FABRIC_SERVICE_NAME=TerraFusion.API
    volumes:
      - ./backend:/app
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${TF_STATIC_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - terrafusion-network

  # Frontend - Vite React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:${TF_FRONTEND_PORT:-3102}"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:${TF_API_PORT:-5046}
      - TRUST_FABRIC_DID=did:tf:service:frontend:001
      - FABRIC_SERVICE_NAME=TerraFusion.UI
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terrafusion-network

  # Trust Fabric Attestation Service (Lightweight)
  trust-fabric:
    build:
      context: ./trust-fabric
      dockerfile: Dockerfile.attestation
    ports:
      - "7000:7000"
    environment:
      - FABRIC_MODE=attestation
      - FABRIC_NETWORK=terrafusion-network
    volumes:
      - ./trust-fabric:/app
      - ./data/fabric:/app/data
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Database (PostgreSQL for production-like environment)
  database:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=terrafusion
      - POSTGRES_USER=terrafusion
      - POSTGRES_PASSWORD=dev_password_change_in_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - terrafusion-network
    restart: unless-stopped

  # Redis for caching and real-time features
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - terrafusion-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  terrafusion-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
