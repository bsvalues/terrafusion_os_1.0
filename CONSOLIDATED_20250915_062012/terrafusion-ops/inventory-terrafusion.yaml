version: "2.0"
metadata:
  environment: "production"
  owner: "terrafusion-ops"
  slack_channel: "#tf-deployments"

scripts:
  # ============== MIGRATION OPERATIONS ==============
  audit_system:
    path: "./audit.sh"
    description: "Complete system inventory before migration"
    timeout: 300
    tags: ["migration", "critical"]
    env:
      AUDIT_DEPTH: "full"
    pre_checks:
      - "test -d .git"
      - "which sha256sum"
    post_hooks:
      - "echo 'Audit complete' | tee -a migration.log"

  migrate_intelligent:
    path: "./migrate.sh"
    description: "AI-preserving intelligent migration"
    timeout: 1800
    retries: 0  # No auto-retry for migration
    tags: ["migration", "critical", "destructive"]
    requires_confirmation: true
    pre_checks:
      - "test -f AUDIT_*/AUDIT_REPORT.md"
      - "test -d BACKUP_*"
    env:
      MIGRATION_MODE: "intelligent"
      PRESERVE_AI_ASSETS: "true"

  validate_migration:
    path: "./validate-migration.sh"
    description: "Comprehensive migration validation"
    timeout: 600
    tags: ["migration", "validation"]
    success_codes: [0, 1]  # 1 = warnings but passable

  # ============== COUNTY DEMONSTRATIONS ==============
  demo_benton:
    path: "./championship/scripts/demo/demo_benton.sh"
    description: "Benton County full demonstration"
    timeout: 1200
    tags: ["demo", "county", "benton"]
    env:
      TF_COUNTY: "benton"
      DEMO_MODE: "full"
    pre_checks:
      - "test -f county-data/benton-parcels.db"
      - "test -d championship"

  demo_yakima:
    path: "./championship/scripts/demo/demo_yakima.sh"
    description: "Yakima County demonstration"
    timeout: 900
    tags: ["demo", "county", "yakima"]
    env:
      TF_COUNTY: "yakima"
      DEMO_MODE: "full"

  demo_franklin:
    path: "./championship/scripts/demo/demo_franklin.sh"
    description: "Franklin County demonstration"
    timeout: 900
    tags: ["demo", "county", "franklin"]
    env:
      TF_COUNTY: "franklin"
      DEMO_MODE: "full"

  # ============== AI SWARM OPERATIONS ==============
  deploy_ai_swarms:
    path: "./scripts/ai-swarm-deployment.sh"
    description: "Deploy AI swarm infrastructure"
    timeout: 2400
    tags: ["ai", "swarm", "deployment"]
    requires_confirmation: true
    env:
      TF_SWARM_SIZE: "50000"
      TF_AI_MONITOR: "enabled"
    pre_checks:
      - "test -f ai-swarm-config.json"
      - "docker --version"

  monitor_ai_health:
    path: "./scripts/ai-health-check.mjs"
    description: "Comprehensive AI agent health monitoring"
    timeout: 300
    tags: ["ai", "monitoring", "health"]
    interpreter: "node"

  emergency_recovery:
    path: "./scripts/emergency-recovery.sh"
    description: "Emergency system recovery with AI assistance"
    timeout: 1200
    tags: ["emergency", "recovery", "critical"]
    requires_confirmation: true
    retries: 0

  # ============== DEVELOPMENT & TESTING ==============
  run_comprehensive_tests:
    path: "./scripts/test-comprehensive.sh"
    description: "Full test suite including AI agent tests"
    timeout: 1800
    tags: ["testing", "comprehensive"]
    env:
      TEST_MODE: "full"
      INCLUDE_AI_TESTS: "true"

  validate_components:
    path: "./scripts/validate-components.sh"
    description: "Validate all system components"
    timeout: 600
    tags: ["validation", "components"]

  # ============== PRODUCTION OPERATIONS ==============
  prod_deploy_and_verify:
    path: "./scripts/production-deployment.sh"
    description: "Production deployment with verification"
    timeout: 3600
    tags: ["production", "deployment", "critical"]
    requires_confirmation: true
    requires_approval: true
    env:
      DEPLOYMENT_STRATEGY: "blue_green"
      AUTO_ROLLBACK: "true"
    pre_checks:
      - "test -f production.env"
      - "test -d backup/"

  rollback_production:
    path: "./scripts/production-rollback.sh"
    description: "Emergency production rollback"
    timeout: 900
    tags: ["production", "rollback", "emergency"]
    requires_confirmation: true

  # ============== MONITORING & METRICS ==============
  collect_metrics:
    path: "./scripts/metrics-collection.sh"
    description: "Collect comprehensive system metrics"
    timeout: 300
    tags: ["monitoring", "metrics"]
    schedule: "*/15 * * * *"  # Every 15 minutes

  generate_reports:
    path: "./scripts/report-generation.py"
    description: "Generate operational reports"
    timeout: 600
    tags: ["reporting", "analytics"]
    interpreter: "python3"

# ============== WORKFLOW DEFINITIONS ==============
workflows:
  full_migration:
    description: "Complete migration workflow"
    steps:
      - audit_system
      - migrate_intelligent
      - validate_migration
    requires_approval: true

  demo_all_counties:
    description: "Demonstrate all county integrations"
    steps:
      - demo_benton
      - demo_yakima
      - demo_franklin
    parallel: true
    max_parallel: 2

  ai_swarm_full_cycle:
    description: "Complete AI swarm deployment and monitoring"
    steps:
      - deploy_ai_swarms
      - monitor_ai_health
    requires_approval: true

  production_release:
    description: "Full production release workflow"
    steps:
      - run_comprehensive_tests
      - validate_components
      - prod_deploy_and_verify
      - collect_metrics
    requires_approval: true
    rollback_on_failure: rollback_production

  emergency_response:
    description: "Emergency system response"
    steps:
      - monitor_ai_health
      - emergency_recovery
      - collect_metrics
    max_timeout: 1800

# ============== CONFIGURATION ==============
config:
  default_timeout: 600
  default_retries: 1
  log_retention_days: 30
  enable_slack_notifications: true
  enable_ai_monitoring: true
  prometheus_endpoint: "http://localhost:\${{TF_PROMETHEUS_PORT:-9090}}"
  redis_endpoint: "redis://localhost:\${{TF_PROMETHEUS_PORT:-9090}}"
  notification_channels:
    - "#terrafusion-ops"
    - "#terrafusion-alerts"